canonical_text:
  quote: ''
  summary: Lugh explains further dangerous elements of the fine imposed on the sons
    of Tuireann. Tuireann advises his sons to seek Manannan's horse and curragh from
    Lugh; Lugh refuses the horse but grants the curragh. The brothers leave Ireland,
    travel by the curragh to the Garden in the East of the World, change into hawks
    with Brian's Druid rod, evade guards, and seize apples. The king's three daughters
    pursue them as ospreys with lightning until Brian changes the brothers into swans
    and they escape into the sea and return to their boat.
  language: English
  quote_policy: summarized
