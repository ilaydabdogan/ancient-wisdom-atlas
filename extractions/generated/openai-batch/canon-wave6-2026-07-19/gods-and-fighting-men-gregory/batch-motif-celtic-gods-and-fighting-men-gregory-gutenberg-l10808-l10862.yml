canonical_text:
  quote: ''
  summary: Diarmuid demands a healing cup from a king, defeats large bodies of fighters,
    and receives the cup after the king recalls a prophecy about him. A red man carries
    him across a river, gives instructions involving well water, the cup, and drops
    of blood, and identifies himself as a messenger from beyond the world. Diarmuid
    heals the daughter of King Under-Wave, but his love for her disappears; he refuses
    reward, asks for a ship, and returns to Ireland and the Fianna.
  language: English
