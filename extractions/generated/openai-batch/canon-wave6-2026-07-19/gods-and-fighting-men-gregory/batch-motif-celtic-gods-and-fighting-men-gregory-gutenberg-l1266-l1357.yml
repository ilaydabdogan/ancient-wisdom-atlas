candidate_motifs:
- id: motif:1
  label: returning culture-hero breaks oppressive tribute power
  taxonomy_refs:
  - culture_hero
  basis: Lugh returns with special equipment, sees the Tuatha de Danaan under Fomor
    oppression, and violently ends the immediate tribute demand by killing most of
    the tax-gatherers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage presents Lugh as a powerful returning champion and master
    of arts, but it does not explicitly label him a culture hero; the motif assignment
    is based on function within the episode.
- id: motif:2
  label: prophecy of the oppressor's loss of power through a descendant
  taxonomy_refs:
  - divine_parent_child
  basis: Ceithlenn identifies Lugh as the son of Balor's daughter and states that
    it was foretold that from Lugh's coming to Ireland the Fomor would never have
    power there again.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The family relationship and prophecy are explicit, but the broader divine
    parent-child motif is only partially represented in this passage.
- id: motif:3
  label: heroic departure of an invading fleet
  taxonomy_refs:
  - departure
  basis: Bres orders ships prepared, provisions loaded, an army gathered and armed,
    and the force sets out by sea toward Ireland.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:13
  confidence: medium
  cautions: This is an enemy expedition rather than the departure of the central hero;
    taxonomy fit is functional rather than exact.
- id: motif:4
  label: threat to displace the island and replace it with destructive water
  taxonomy_refs:
  - chaos
  basis: Balor commands that Ireland be tied to the backs of the ships, moved north
    of Lochlann, and replaced by destroying water.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The command is a threat or order rather than an accomplished cosmogonic
    event; the passage does not show the island actually moved.
- id: motif:5
  label: foreknowledge among enemy ritual specialists
  taxonomy_refs:
  - wisdom
  basis: The Fomor council includes nine poets with learning and the gift of foreknowledge,
    and Ceithlenn states a prophecy about Lugh's arrival.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: low
  cautions: The passage mentions foreknowledge and prophecy but does not develop a
    wisdom quest or teaching episode.
