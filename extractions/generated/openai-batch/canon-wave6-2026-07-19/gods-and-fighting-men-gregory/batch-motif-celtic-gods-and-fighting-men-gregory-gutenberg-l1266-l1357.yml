canonical_text:
  quote: ''
  summary: Lugh Lamh-Fada returns with Sidhe riders, foster-brothers, and Manannan's
    horse, armor, helmet, and sword. He confronts Fomor tax-gatherers who terrorize
    the Tuatha de Danaan, kills most of them, and sends survivors back to Lochlann.
    Balor and Ceithlenn identify him and recall a prophecy that his arrival will end
    Fomor power in Ireland. The Fomor council responds; Bres gathers ships and troops
    to fight Lugh, while Balor commands that Ireland be dragged away and replaced
    by destroying water. The Fomor fleet reaches Ireland and devastates West Connacht.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lugh Lamh-Fada is recognized as returning, accompanied by Riders of the Sidhe
    from the Land of Promise and foster-brothers named as sons of Manannan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lugh rides Manannan's horse Aonbharr, described as swift as the cold spring
    wind, able to treat sea as dry land, and protective of its rider from being killed
    off its back.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lugh wears Manannan's breast-plate, which protects the wearer from wounds,
    and a jeweled helmet associated with a sun-like appearance of his forehead when
    removed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lugh carries Manannan's sword Freagarthach, the Answerer, described as fatal
    to those it wounds and terrifying to opponents when bared in battle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lugh's troop reaches the King of Ireland and the Tuatha de Danaan, and the
    groups welcome one another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A troop of nine times nine Fomor messengers arrives to ask rent and taxes
    from the men of Ireland; four named messengers are described as especially hard
    and cruel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Tuatha de Danaan are said to fear the four cruel Fomor messengers so much
    that they would not punish a son or foster-son without their permission.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The King of Ireland and the Tuatha de Danaan stand before the Fomor messengers;
    the king says that even a seated child could be killed by them as an offense.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lugh says the Tuatha de Danaan have been under oppression too long, attacks
    the Fomor messengers, kills or wounds eight nines of them, and spares the last
    nine under Nuada's protection to carry a message home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The surviving nine messengers return to Lochlann and report that a young well-featured
    lad came into Ireland and killed the tax-gatherers except for themselves.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Balor of the Evil Eye asks who the young man is; Ceithlenn identifies him
    as the son of Balor's daughter and says it had been foretold that after his coming
    to Ireland the Fomor would never again have power there.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief men of the Fomor hold a council including named chiefs, nine poets
    with learning and foreknowledge, Lobais the Druid, Balor, Balor's twelve sons,
    and Ceithlenn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Bres and his father Elathan come seeking Fomor help; Bres says he will go
    to Ireland with seven battalions, fight Lugh as Ildánach, strike off his head,
    and bring it to Berbhe.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Ships are prepared with food and drink; swift messengers called the two Luaths
    gather Bres's army, which readies armor and weapons and sets out for Ireland.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Balor orders the force to fight the Ildánach, decapitate him, tie Ireland
    to the backs of the ships, let destroying water replace it, and put Ireland north
    of Lochlann.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: The Fomor ships depart with painted sails, cross the sea to the harbour of
    Eas Dara, and send an army through West Connacht, destroying it; Bodb Dearg is
    named as King of Connacht.
  category: sequence
  evidence_refs:
  - ev:13
