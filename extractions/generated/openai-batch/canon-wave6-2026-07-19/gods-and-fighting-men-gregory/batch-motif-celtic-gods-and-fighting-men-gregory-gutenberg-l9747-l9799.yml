canonical_text:
  quote: ''
  summary: Finn and the Fianna encounter Daireann at the ford of the Slaine. She asks
    Finn to marry her on terms he refuses, then gives him strong mead in a silver
    cup; because he is bound not to refuse feast items, he drinks and becomes mad,
    insulting the Fianna. The Fianna leave, but Caoilte repeatedly brings them back
    until Finn recovers by nightfall. A second episode tells of Maer sending Finn
    nine love-charmed nuts, which Finn refuses and buries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Finn and the Fianna sit at a ford of the Slaine and see a young woman on a
    round rock above the ford, wearing silk, a green cloak, a golden brooch, and a
    golden crown.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young woman addresses the Fianna of Ireland and asks one of them to come
    speak with her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sciathbreac of the Speckled Shield goes toward the woman and asks whom she
    wants; she names Finn, son of Cumhal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman identifies herself as Daireann, daughter of Bodb Dearg, son of the
    Dagda, and says she has come to be Finn's wife if he gives the bride-gift she
    asks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Daireann asks Finn to promise that she will be his only wife for a year and
    have half his time after that; Finn refuses the promise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young woman takes a white silver cup from under a covering, fills it with
    strong drink identified as strong mead, and gives it to Finn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Finn is under bonds not to refuse anything belonging to a feast, so he drinks
    from the cup and immediately becomes like one gone mad.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: In mad drunkenness, Finn turns toward the Fianna and speaks of harms, faults,
    and battle misfortunes he knows against them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief men of the Fianna rise and leave, each setting out for his own country,
    until only Finn and Caoilte remain on the hill.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Caoilte follows the Fianna and urges them not to leave their lord and leader
    because of the arts and tricks of a woman of the Sidhe.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Caoilte brings the Fianna back to the hill thirteen times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: By night, the bitterness leaves Finn's tongue, and his sense and memory return
    after Caoilte has brought back all the Fianna.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The narrator says this was Caoilte's hardest day's work except for the day
    he brought a flock of beasts and birds to Teamhair to ransom Finn from the High
    King of Ireland.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: Maer, wife of Bersa of Berramain, falls in love with Finn and makes nine nuts
    of Segair with love charms, sending them to Finn and telling him to eat them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Finn refuses the nuts, calls them not nuts of knowledge but nuts of ignorance,
    says they may be an enchantment for drinking love, and buries them a foot deep
    in the earth.
  category: action
  evidence_refs:
  - ev:7
