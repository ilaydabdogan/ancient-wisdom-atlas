canonical_text:
  quote: ''
  summary: Finn and the Fianna find Diarmuid dying. Diarmuid asks Finn for a healing
    drink of water from Finn's hands, citing Finn's gift of knowledge and past debts.
    Finn refuses because of Grania, then delays twice by letting the water fall from
    his hands. After Osgar threatens him, Finn brings water a third time, but Diarmuid
    dies as it reaches him. The Fianna keen; Finn leaves, fearing Angus and the Tuatha
    de Danaan, while several companions cover Diarmuid with cloaks.
  language: English
  quote_policy: summarized
