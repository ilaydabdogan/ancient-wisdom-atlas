canonical_text:
  quote: ''
  summary: Finn gives conduct advice for becoming a good champion. Lugaidh's Son keeps
    the advice and gains poetic praise. Aoife, wife of Mal and daughter of the King
    of Lochlann, hears the praise, falls in love with Lugaidh's Son, and crosses the
    sea to Ireland with nine foster-sisters. Finn welcomes her and gives her to Lugaidh's
    Son, warning that she brings war. After a year and a month, Mal comes with armed
    battalions to avenge his wife. In battle, Mal and Lugaidh's Son fight, and Mal
    is killed. Aoife then remains with Lugaidh's Son and becomes mother of his children.
  language: English
  quote_policy: summarized
