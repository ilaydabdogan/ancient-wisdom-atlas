canonical_text:
  quote: ''
  summary: Diarmuid, hidden with Grania in a quicken-tree, uses berries to guide Oisin's
    chess moves against Finn. Finn discovers him, reacts with jealousy to Diarmuid
    kissing Grania, and orders men to surround the tree. Angus Og secretly aids Diarmuid
    by causing attackers to bear Diarmuid's appearance and later removes Grania under
    a Druid cloak. Diarmuid declares he will fight rather than surrender, while Osgar
    urges forgiveness and then swears to protect him against Finn and the Fianna.
  language: English
  quote_policy: summarized
