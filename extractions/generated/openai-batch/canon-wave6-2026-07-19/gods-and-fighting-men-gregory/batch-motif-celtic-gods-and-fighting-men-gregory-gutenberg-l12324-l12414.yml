  evidence_refs:
  - ev:1
- id: obs:2
  text: Finn attributes Oisin's success to the help of others including Diarmuid,
    asks whether he or Osgar has spoken truly, and Diarmuid confirms that he and Grania
    are present in the bed of the Surly One of Lochlann.
  category: speech
  evidence_refs:
  - ev:2
