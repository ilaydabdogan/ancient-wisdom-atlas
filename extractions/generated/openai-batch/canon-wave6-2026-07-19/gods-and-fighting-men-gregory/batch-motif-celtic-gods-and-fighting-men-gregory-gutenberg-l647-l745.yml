canonical_text:
  quote: ''
  summary: 'The passage introduces the Tuatha de Danaan: their misty arrival in Ireland,
    northern cities, wise teachers, four treasures, leading gods and goddesses, valued
    emblems, and wisdom well. It then narrates the Firbolg response: Eochaid receives
    news and an interpreted dream, sends Sreng to inspect the newcomers, and Sreng
    meets Bres in cautious armed parley.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tuatha de Danaan, also called the people of the gods of Dana or Men of
    Dea, came through the air to Ireland in a mist.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: They came from the north, where they had four cities named Falias, Gorias,
    Finias, and Murias, each associated with a wise teacher.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'They brought four treasures: the Lia Fail or Stone of Destiny from Falias,
    a Sword from Gorias, a Spear of Victory from Finias, and a Cauldron from Murias
    that left no company unsatisfied.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nuada was king of the Tuatha de Danaan; Manannan son of Lir was described
    as greater again; several male figures are named with functions in writing, healing,
    battle, craft, and smithwork.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Several leading women are named, including battle goddesses, women whose names
    were later given to Ireland, a nurse of poets, Brigit, and Dana, called the Mother
    of the Gods.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Brigit is described as connected with poetry, healing, smithwork, and the
    first whistle for night-calling; one side of her face was ugly and the other comely,
    and her name is explained as a fiery arrow.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The plough, the sun, and the hazel-tree are said to have been placed above
    all other things by the Tuatha de Danaan, and Ireland was later said to be divided
    among Coll the hazel, Cecht the plough, and Grian the sun.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A well below the sea contained nine hazels of wisdom whose leaves, blossoms,
    and nuts affected the well and fed five salmon; eating such a salmon would give
    all wisdom and poetry, and seven streams of wisdom sprang from and returned to
    the well.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Tuatha de Danaan came on the first day of Beltaine and landed in the north-west
    of Connacht; the Firbolgs saw only mist on the hills.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Eochaid son of Erc, king of the Firbolgs, received messengers reporting a
    new race in Ireland of uncertain origin settled at Magh Rein.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Eochaid had dreamed in the night, and his Druids interpreted the dream as
    foretelling a strong enemy coming against him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Eochaid and his advisers chose Sreng, a great fighting man, to go speak with
    the strangers; Sreng set out with shield, spears, sword, head-covering, and iron
    club.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Watchers of the Tuatha de Danaan saw Sreng and sent Bres, armed with shield,
    sword, and two spears, to meet and speak with him.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Sreng and Bres approached slowly and watchfully, set their shields in the
    ground, looked over the rims, and began to speak; Sreng was reassured when Bres
    spoke Irish.
  category: sequence
  evidence_refs:
  - ev:14
