  type: summary
  locator: lines 647-745; Beltaine landing paragraph
  quote_or_summary: On Beltaine the Tuatha de Danaan land in northwest Connacht; the
    Firbolgs, already in Ireland and from the South, see nothing but mist on the hills.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source metadata; summarized.
