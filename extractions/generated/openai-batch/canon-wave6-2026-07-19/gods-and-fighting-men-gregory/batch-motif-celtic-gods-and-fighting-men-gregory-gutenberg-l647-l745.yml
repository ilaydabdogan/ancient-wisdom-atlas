    Grian the sun.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source metadata; summarized.
- id: ev:8
  type: summary
  locator: lines 647-745; well of wisdom paragraph
  quote_or_summary: A well below the sea has nine hazels of wisdom; leaves, blossoms,
    and nuts fall into it, salmon eat the nuts, eating a salmon grants wisdom and
    poetry, and seven streams of wisdom flow from and back to the well.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source metadata; summarized.
