- id: motif:2
  label: Four wisdom cities and four imported treasures
  taxonomy_refs:
  - wisdom
  basis: The northern cities are associated with wise teachers and learning, and the
    Tuatha de Danaan bring four named treasures from them.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
