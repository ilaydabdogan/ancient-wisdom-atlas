  quote: ''
  summary: A daring Connacht youth called Red Ridge nearly leaves Finn over delayed
    wages, but Finn quiets him by verse and by recalling past gifts and shared experiences.
    In a separate episode, a daughter of Mongan of the Sidhe brings Finn a flat stone
    with a gold chain during a ford battle; Finn uses it, it falls into the ford,
    and a prophecy says the Woman of the Waves will one day recover it, after which
    the world will end seven years later.
