canonical_text:
  quote: ''
  summary: 'A man at the door explains to Finn the meanings of strange figures in
    the house: Sluggishness, Liveliness, the World, the Desires of Men, Old Age, and
    the wells of Lying and Truth. He identifies himself as Cuanna from Innistuil,
    says he arranged the things to see Finn because of Finn''s wisdom and fame, offers
    sleep until morning, and Finn and his men awaken on Cairn Feargall with their
    dogs and arms beside them.'
  language: English
  quote_policy: summarized
