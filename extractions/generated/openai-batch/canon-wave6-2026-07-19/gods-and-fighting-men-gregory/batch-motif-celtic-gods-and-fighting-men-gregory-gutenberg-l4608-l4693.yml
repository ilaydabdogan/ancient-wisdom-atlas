canonical_text:
  quote: ''
  summary: Tadg, whose wife, brothers, and many Munster people have been carried away
    by Cathmann of Fresen, prepares a hide-covered curragh and sails westward with
    his men to seek them. The voyage crosses a stormy sea, reaches an island of giant
    sheep and a nine-horned ram, and then reaches strange islands where eating colored
    bird eggs causes feathers to grow until bathing removes them.
  language: English
  quote_policy: summarized
