candidate_motifs:
- id: motif:1
  label: Quarrel within a warrior fellowship becomes factional feud
  taxonomy_refs: []
  basis: An argument over an earlier killing escalates through insults, blows, factional
    fighting, later renewed conflict, and a stated resolve by the sons of Morna to
    oppose Finn's friends.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: No supplied taxonomy family directly names this feud pattern.
- id: motif:2
  label: Poetic mediation halts violence
  taxonomy_refs: []
  basis: Fergus and the poets sing songs and poems that make the fighters stop, drop
    weapons, and accept a temporary peace.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a clear function for song but does not describe ritual
    details beyond poetic performance and peacemaking.
- id: motif:3
  label: Disputed division of a supernatural animal or food renews conflict
  taxonomy_refs: []
  basis: A falling-out between Finn and Goll arises over the dividing of a pig of
    the pigs of Manannan, followed by renewed fighting.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage names Manannan's pigs but gives little additional context
    for their supernatural status or significance within this excerpt.
- id: motif:4
  label: Vengeance by attacking a beloved person and valued dependents
  taxonomy_refs: []
  basis: After resolving to oppose Finn's friends, the sons of Morna pressure and
    kill Berach Brec, Goll drowns Finn's valued hound, and the sons of Morna kill
    a meeting group involving Tuatha de Danaan women and Fianna men.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The attacks are linked by sequence and stated hostility to Finn's friends;
    the passage does not present a formal revenge code.
- id: motif:5
  label: Loyal beloved refuses to abandon the hero and is slain
  taxonomy_refs: []
  basis: Berach Brec refuses the sons of Morna's demand that she give up Finn, and
    Art son of Morna kills her with a spear.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The beloved is not stolen or recovered; therefore the available 'stolen_beloved'
    taxonomy ref is not applied.
- id: motif:6
  label: Mistaken killing of one's own allies
  taxonomy_refs: []
  basis: The Fianna mistake a troop's tracks for those of the sons of Morna, kill
    the troop at night, and discover in daylight that the victims were their own people.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage gives the mistaken identity and aftermath but not a supernatural
    cause for the error.
- id: motif:7
  label: Commemorative naming of stone and place after tragic events
