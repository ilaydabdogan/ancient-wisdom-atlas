canonical_text:
  quote: ''
  summary: 'Finn and Goll argue over Goll''s killing of Finn''s father; insults between
    Cairell and Conan escalate into factional fighting within the Fianna. Fergus and
    the poets stop the fight with songs and bind Finn and Goll to keep peace pending
    judgment by the High King. Later disputes and killings renew the feud: a quarrel
    over a pig of Manannan, the murder of Finn''s beloved Berach Brec, the drowning
    of Finn''s hound Conbeg, killings of Tuatha de Danaan women, and a mistaken slaughter
    of Finn''s own men. The passage ends with commemorative place-names: the Stone
    of the Mistake and the Parting Hill of Heroes.'
  language: English
  quote_policy: summarized
