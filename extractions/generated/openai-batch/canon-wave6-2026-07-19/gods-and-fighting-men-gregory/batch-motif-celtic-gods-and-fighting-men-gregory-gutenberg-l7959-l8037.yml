canonical_text:
  quote: ''
  summary: Fergus reaches Tadg's house, where Finn's kin grieve over his danger. Tadg's
    wife reveals that Daire Donn, the King of the World, can only be defeated by a
    sword and shield made by the smith of the Fomor on the night of Daire Donn's birth
    and kept by the King of the Country of the Fair Men. Labran, in eagle form, travels
    to obtain the weapons, receives them from their guarded chamber, returns exhausted,
    and cannot carry them onward. Tadg gives the weapons to the swift Aedh, who brings
    them to Finn at the White Strand. When Finn uncovers them, they emit fire and
    deadly bubbles; the Fianna cannot look at them but take courage, and Finn sends
    Fergus to summon the King of the World to battle.
  language: English
  quote_policy: summarized
