  summary: Oisin recalls the sounds, hunts, hounds, battles, feasts, companions, and
    natural places of the Fianna, while lamenting his old age and the loss of his
    former life. Patrick repeatedly urges him to abandon such memories, attend to
    Christian judgment, and take the Son of God for help. Their exchange contrasts
    Oisin's loyalty to the Fianna and his hound with Patrick's warnings about hell,
    divine authority, and the straight or crooked path at the end of life. Oisin also
    briefly recalls giving cows and a ring to a headless woman who vanished after
    birds carried off the ring.
