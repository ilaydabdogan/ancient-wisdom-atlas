canonical_text:
  quote: ''
  summary: Finn and his men are welcomed by a king in a hill. The Red Woman asks that
    they be shown the beast they had followed. The beast speaks, leaves, and is hunted
    until Bran brings it down; after death it appears as a tall man, whom the Red
    Woman identifies as the King of the Firbolgs. She foretells future troubles, offers
    to take Finn to the Country of the Young, and is refused. She then raises a deer
    and releases her own white hound to kill it, disappears, and Finn leaves the enchanted
    deer behind.
  language: English
  quote_policy: summarized
