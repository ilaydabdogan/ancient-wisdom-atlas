canonical_text:
  quote: ''
  summary: The sons of Tuireann receive pigs from Easal without fighting, travel with
    Easal to Ioruaidh to seek a hound or whelp, win it after Brian captures the King
    of Ioruaidh, and make peace. Lugh learns they have obtained most of the fine needed
    against the Fomor and sends a Druid spell that makes them forget the remaining
    items and long for Ireland. At Teamhair, Lugh receives the fine but says the cooking-spit
    and three shouts on the hill are still missing, weakening the sons of Tuireann.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king and his people decide to give the pigs freely to the sons of Tuireann
    because they see that no one has yet been able to stand against them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sons of Tuireann thank Easal and wonder at receiving the pigs without
    fighting, since they had fought for every other part of the fine and had left
    blood elsewhere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Easal brings the sons of Tuireann to his house, where they receive food, drink,
    beds, and the pigs the next morning; Brian praises the king in a poem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Easal asks to accompany the sons of Tuireann to the King of Ioruaidh because
    his daughter is the king’s wife and he wants to persuade him to give the whelp
    without battle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king’s ship is made ready, and the party reaches the coast of Ioruaidh,
    where people and armies are watching the harbours and landing-places.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The King of Ioruaidh refuses to give up his hound by force or goodwill, despite
    Easal’s warning that the sons of Tuireann have overthrown many kings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sons of Tuireann arm themselves and fight the army of Ioruaidh; in the
    fighting, Iuchar and Iucharba are separated from Brian.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Brian reaches the King of Ioruaidh, fights him, overcomes him, binds him,
    and brings him to Easal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The whelp is given to the sons of Tuireann, the king is unbound, and peace
    is made.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lugh learns that the sons of Tuireann have obtained the things he wants for
    the battle with the Fomor, then sends a Druid spell that makes them forget the
    remaining part of the fine and long to return to Ireland.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lugh is at a fair outside Teamhair with the King of Ireland; after learning
    the sons of Tuireann have landed at Brugh na Boinn, he enters Teamhair, shuts
    the gate, puts on Manannan’s smooth armour and the cloak of the daughters of Flidais,
    and takes his arms.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sons of Tuireann are welcomed by the king and the Tuatha de Danaan, ask
    for Lugh, and search the fair without finding him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Brian says Lugh has gone into Teamhair to avoid them because he knows they
    have come with deadly arms.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Lugh refuses to come out at first and says the fine should be given to the
    king; afterward he comes out on the lawn and receives the fine.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Lugh says the payment is good but incomplete, and asks for the cooking-spit
    and the three shouts on the hill.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: When the sons of Tuireann hear Lugh’s demand, weakness comes on them; they
