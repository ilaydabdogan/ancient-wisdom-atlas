- id: obs:1
  text: Finn says farewell to Crimall, goes to learn poetry from Finegas at the Boinn,
    and uses the name Deimne rather than his own name.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says poets thought poetry was revealed to them on the brink of
    water.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Finegas has watched for the salmon at the Boinn for seven years because of
    a prophecy that the eater of the salmon of knowledge would gain all knowledge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Finegas tells Finn to roast the salmon but not to eat it; Finn burns his thumb
    on the salmon skin and puts his thumb in his mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Finegas identifies the boy as Finn, says the prophecy was for Finn rather
    than himself, gives Finn the whole salmon, and Finn gains knowledge connected
    with the nuts of the nine hazels of wisdom beside a well below the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A moon well belonging to Beag, son of Buan, gives wisdom to whoever drinks
