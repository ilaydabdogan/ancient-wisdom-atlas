canonical_text:
  quote: ''
  summary: Finn, using the name Deimne, studies poetry with Finegas at the Boinn and
    gains wisdom through contact with the salmon of knowledge. A second wisdom comes
    to him when water from Beag's moon well enters his mouth. He demonstrates poetic
    learning in a seasonal poem, then goes to the High King's Samhain gathering at
    Teamhair, declares himself son of Cumhal, pledges service, and is accepted by
    the king.
  language: English
  quote_policy: summarized
