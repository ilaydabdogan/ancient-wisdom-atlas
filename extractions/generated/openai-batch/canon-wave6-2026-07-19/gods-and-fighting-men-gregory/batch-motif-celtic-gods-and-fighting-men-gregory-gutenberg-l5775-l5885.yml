    and require red gold for a vessel of its water.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: While Finn is hunting near the well, the three women try to prevent him from
    reaching it, and one throws a vessel of water at him; some water enters his mouth
    and he gains the knowledge the well can give.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Finn learns the three ways of poetry and makes a poem describing May, summer,
    animals, woods, waters, fields, and the coming of winter.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Finn, still a young lad, goes at Samhain to the High King's gathering at Teamhair,
