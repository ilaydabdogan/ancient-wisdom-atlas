canonical_text:
  quote: ''
  summary: Diarmuid, Conan, Goll, and Osgar become unable to return home while hunting
    and enter a lighted woodland house. An old man hosts them with a young girl and
    a cat present. During the meal a great wether overpowers the men, but the cat
    subdues it. The old man explains that Goll has wrestled with the world, that the
    wether contains the strength of the world, and that the cat is death. Later the
    young girl, identified as Youth, refuses Conan, Osgar, and Diarmuid as former
    possessors of her, but gives Diarmuid a love-spot on his forehead that makes women
    unable to refuse him love.
  language: English
  quote_policy: summarized
