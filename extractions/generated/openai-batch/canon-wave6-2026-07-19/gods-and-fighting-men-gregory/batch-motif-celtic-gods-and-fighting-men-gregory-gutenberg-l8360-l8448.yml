canonical_text:
  quote: ''
  summary: Arthur, son of the King of Britain, comes to Finn with twenty-seven men,
    steals three named hounds during a hunt, and crosses the sea to Britain. Finn
    discovers the theft through water divination in a golden basin and sends nine
    Fianna warriors after Arthur. They kill Arthur's companions, spare Arthur, recover
    the hounds, and bring back a horse and mare whose offspring become the Fianna's
    horses. A separate episode tells how a rejected woman-Druid imprisons many of
    Finn's hounds in a hill. The passage then recounts the later death of Adhnuall,
    who wanders after a battle, returns to a burial hill, howls three times, and dies.
  language: English
  quote_policy: summarized
