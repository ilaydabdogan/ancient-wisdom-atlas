canonical_text:
  quote: ''
  summary: Mochaomhog recognizes the singing swans as the children of Lir, brings
    them to his dwelling, and has silver chains made for them. Deoch desires the birds,
    and Lairgnen tries to take them from the altar. When he touches them, their bird
    skins fall away and they appear as aged humans. Fionnuala asks Mochaomhog to baptize
    them and arrange their burial. The children are baptized, die, and are buried
    with an inscribed Ogham stone over them.
  language: English
  quote_policy: summarized
