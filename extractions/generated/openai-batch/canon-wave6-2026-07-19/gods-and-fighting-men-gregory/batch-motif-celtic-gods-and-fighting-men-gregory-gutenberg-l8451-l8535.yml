canonical_text:
  quote: ''
  summary: During a hunt at Ceiscoran, Conaran of the Tuatha de Danaan orders his
    three enchanted daughters to avenge Finn. The women set enchanted hanks of yarn
    at a cave opening; Finn, Conan, and many of the Fianna pass through and lose their
    strength, are bound, and are brought into the cave. The women intend to kill the
    captives, but Goll son of Morna arrives, defeats two of them, overpowers the eldest,
    and spares her when she promises to release Finn and the Fianna. The captives
    are unbound and Fergus praises Goll.
  language: English
  quote_policy: summarized
