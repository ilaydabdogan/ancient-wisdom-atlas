canonical_text:
  quote: ''
  summary: A dispute between Patrick and Oisin contrasts Christian repentance, Heaven,
    hell, and God's creative power with Oisin's loyalty to Finn, Osgar, Caoilte, and
    the Fianna. Patrick urges Oisin to stop insulting priests, repent, and accept
    the Son of God. Oisin rejects a Heaven without his companions, praises the Fianna's
    generosity, truth, hunting, battle, and loyalty, calls absent comrades to free
    him, and challenges divine superiority by heroic standards of combat and rescue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Patrick tells Oisin to stop speaking against priests and warns that continued
    daring talk will end in great pain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oisin answers by valuing a boar hunt with the leader of the Fianna over the
    fate of clerks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Patrick calls Oisin senseless and blind, and says inward sight would make
    him desire Heaven.
  category: speech
  evidence_refs:
