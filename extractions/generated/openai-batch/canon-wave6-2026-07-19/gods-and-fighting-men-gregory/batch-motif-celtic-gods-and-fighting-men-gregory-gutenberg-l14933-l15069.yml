candidate_motifs:
- id: motif:1
  label: Repentance before death to avoid pain and gain Heaven
  taxonomy_refs:
  - divine_judgment
  basis: Patrick warns Oisin of pain at the end, says Finn and the Fianna are on a
    flag-stone of pain, and urges Oisin to repent, take the Son of God, and not lose
    Heaven.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: high
  cautions: The passage is a debate rather than a narrated judgment scene.
- id: motif:2
  label: Heroic loyalty outweighing promised Heaven
  taxonomy_refs: []
  basis: Oisin says Heaven is little good without Caoilte, Osgar, and his father,
    refuses to part from the Fianna, and values hunting, battle, and comradeship over
    clerical promises.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  - ev:12
  confidence: high
  cautions: This is expressed through Oisin's speech, not through an enacted choice.
- id: motif:3
  label: Contested afterlife fate of heroic dead
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: Patrick places Finn and the Fianna in a painful afterlife and urges Oisin
    toward Heaven, while Oisin denies they would remain there unless it pleased them
    and says Finn would go to any better place above or below.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: No journey through the afterlife is narrated; the passage only debates
    afterlife locations and fate.
- id: motif:4
  label: Divine power tested by warrior standards
  taxonomy_refs: []
  basis: Oisin imagines Osgar and God fighting hand to hand, asks why God did not
    protect figures in past conflicts, and measures divine worth by battle deeds and
    rescue from bonds.
  evidence_refs:
  - ev:10
  - ev:15
  - ev:16
  confidence: high
  cautions: The combat with God is hypothetical and rhetorical.
- id: motif:5
  label: Aged hero calls absent companions for rescue
  taxonomy_refs: []
  basis: Oisin calls on Conan, Osgar, Diarmuid, Caoilte, and other strong men to come
    together and free him from bonds.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The requested rescue does not occur within the passage.
- id: motif:6
  label: Creator deity contrasted with warrior king
