canonical_text:
  quote: ''
  summary: 'Finn meets three strange men named Dubh, Dun, and Glasan, accepts them
    into service, and assigns each a night watch measured by a burning log. During
    their watches, Dubh and Dun recover wondrous objects said to have been stolen
    from Finn a hundred years earlier: an inexhaustible cup and a knife that produces
    meat from a bone. Glasan hides among corpses in a strange house, kills a one-limbed
    corpse-eating hag, and sees three young men leap from her body; two are killed
    and one escapes. Finn praises the first two watchers but warns that the escaped
    young man may cause trouble. Twenty-one years later, a Red-Haired Man enters Finn’s
    service on condition that, if he dies, Finn will bury him on Inis Caol. After
    the man withers and dies, Finn keeps his promise and begins the burial journey
    with the body on an old white horse that has grown younger.'
  language: English
  quote_policy: summarized
