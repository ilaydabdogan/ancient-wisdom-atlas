canonical_text:
  quote: ''
  summary: During a hunt on Slieve Fuad, Finn and Daire become separated from the
    Fianna amid confusing music and Druid mist. They meet Glanluadh, hear Sidhe music,
    fall asleep, and awake before a lighted house surrounded by a stormy sea. A grey
    man brings them inside, where Ailne, wife of Meargach, accuses Finn over earlier
    deaths and imprisons Finn, Daire, and Glanluadh. After Glanluadh explains her
    innocence, Ailne frees and restores her with an enchanted Sidhe cup, then allows
    her to feed Finn and Daire while still planning revenge on the Fianna.
  language: English
  quote_policy: summarized
