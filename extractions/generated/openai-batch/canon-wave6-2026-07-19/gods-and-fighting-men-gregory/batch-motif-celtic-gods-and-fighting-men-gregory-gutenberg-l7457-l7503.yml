canonical_text:
  quote: ''
  summary: Finn receives news that foreigners have arrived at the harbour of the White
    Strand. He exhorts the Fianna to defend Ireland in return for the tribute and
    service they receive. The Fianna pledge not to retreat. Credhe equips them, accompanies
    them with cattle, provides milk during a year-and-a-day battle, and receives the
    wounded for healing. The Fianna march and camp, while Caoilte, Oisin, and Lugaidh's
    Son go ahead to the harbour. A shore party sent by the King of the World for spoils
    is attacked by them; Conn Crither and Glas, son of Bremen, join, and the landing
    party is destroyed.
  language: English
  quote_policy: summarized
