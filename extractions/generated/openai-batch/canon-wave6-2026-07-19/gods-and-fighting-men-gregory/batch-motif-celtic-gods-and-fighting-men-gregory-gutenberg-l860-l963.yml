canonical_text:
  quote: ''
  summary: After Nuada loses an arm and is removed from kingship under the Tuatha
    de Danaan rule requiring bodily perfection, Bres is chosen king for his beauty.
    His reign is marked by Fomor tribute, his own heavy milk tax, ungenerous hospitality,
    forced labor for Ogma and the Dagda, and disputes over food. Nechtan and others
    deceive Bres with disguised cows and false milk; Angus Og counsels the Dagda to
    defeat Cridenbel's demand for food by hiding gold in the portions Cridenbel claims,
    leading to Cridenbel's death and the Dagda's vindication when the gold is found
    in the body.
  language: English
  quote_policy: summarized
