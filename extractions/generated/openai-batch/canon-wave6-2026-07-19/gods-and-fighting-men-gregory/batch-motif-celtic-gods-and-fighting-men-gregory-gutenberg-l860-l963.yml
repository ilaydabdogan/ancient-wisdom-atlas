candidate_motifs:
- id: motif:1
  label: Kingship conditioned on bodily wholeness
  taxonomy_refs:
  - royal_legitimacy
  basis: Nuada is removed from kingship because the Tuatha de Danaan law requires
    a king to be perfect in shape after his arm is cut off.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states the law directly; broader implications for sacral kingship
    require comparison beyond this passage.
- id: motif:2
  label: Beautiful king whose reign proves deficient
  taxonomy_refs:
  - royal_legitimacy
  basis: Bres is chosen as exceptionally beautiful, but his reign brings tribute,
    lack of resistance, poor hospitality, forced labor, and an initially wrongful
    judgment.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  - ev:9
  - ev:12
  confidence: medium
  cautions: The passage links Bres's reign with misrule but does not explicitly define
    beauty as a false criterion for kingship.
- id: motif:3
  label: Coercive tribute in food, milk, and children
  taxonomy_refs:
  - sacred_exchange
  basis: The Fomor demand thirds of corn, milk, and children, while Bres imposes his
    own milk tax on every house.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The exchange is coercive tribute rather than reciprocal sacred exchange,
    so the taxonomy match is tentative.
- id: motif:4
  label: Deceptive substitution to evade an unjust demand
  taxonomy_refs:
  - trickster_boundary
  basis: Nechtan disguises cows to meet Bres's color requirement, wooden cows produce
    bog stuff instead of milk, and Angus Og counsels the Dagda to meet Cridenbel's
    wording by making gold the 'best bits.'
  evidence_refs:
  - ev:6
  - ev:7
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage presents deception and verbal strategy, but it does not explicitly
    identify any figure as a trickster or emphasize boundary-crossing.
- id: motif:5
  label: Son aids father through strategic counsel
  taxonomy_refs:
  - divine_parent_child
  basis: Angus Og, named as the Dagda's son, advises him about the gold that defeats
    Cridenbel and later about wages and the heifer.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: medium
  cautions: The familial relationship is explicit; the 'divine' taxonomy aspect depends
    on the surrounding work's gods context rather than a direct statement in these
    lines.
- id: motif:6
  label: Truth proved by opening the body
  taxonomy_refs: []
  basis: After Cridenbel dies and the Dagda is accused, the king orders the body opened;
