canonical_text:
  quote: ''
  summary: 'The Sons of the Gael, led by the sons of Miled, come from the south to
    Ireland to avenge Ith and to seek the western island foretold by their Druids.
    The Tuatha de Danaan obstruct their first landing by enchantment, making the island
    appear under a cloud and like a pig-shaped thing, but the newcomers land elsewhere.
    On their march they meet Banba, Fodhla, and Eriu, queens of the Tuatha de Danaan;
    Eriu appears alternately as a beautiful queen and a grey-white crow. At Teamhair
    Amergin demands kingship or battle from the sons of Cermait, who ask for a fair
    offer. Amergin proposes that the Gaels withdraw beyond nine waves and try to land
    again: if the Tuatha prevent them, the Gaels will leave forever; if the Gaels
    land, the Tuatha must yield kingship.'
  language: English
  quote_policy: summarized
