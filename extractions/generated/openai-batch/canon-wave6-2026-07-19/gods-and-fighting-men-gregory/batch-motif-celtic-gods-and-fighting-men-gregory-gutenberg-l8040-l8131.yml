canonical_text:
  quote: ''
  summary: The King of the World and his armies meet the remaining Fianna in a great
    battle. Natural forces, animals, and supernatural beings react as omens of destruction.
    Finn directs Fergus to praise warriors so their courage will increase. Conan fights
    to make amends for old harms; Duban Donn vows to surpass Duban son of Cas and
    kills many enemies; Osgar fights a large force alone; Caoilte comes to aid him,
    is reproached by Osgar, becomes angry, and kills eighty fighting men.
  language: English
  quote_policy: summarized
