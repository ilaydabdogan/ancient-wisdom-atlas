candidate_motifs:
- id: motif:1
  label: Time-dilated return from the Country of the Young
  taxonomy_refs:
  - return
  - afterlife_journey_map
  basis: Oisin is away for hundreds or thousands of years while the time seems short
    to him, and he returns to Ireland aged and displaced.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives the altered time and aged return, but the exact cause
    of his aging is not explained within this excerpt.
- id: motif:2
  label: Westward sea journey to a youth-giving realm
  taxonomy_refs:
  - departure
  - afterlife_journey_map
  basis: Oisin and Niamh travel west over the sea, pass strange sights and a storm,
    and arrive in the Country of the Young, where youth and delights are promised.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The available taxonomy label is broad; the passage does not explicitly
    call the realm an afterlife, only the Country of the Young and Country of Victory.
- id: motif:3
  label: Otherworld royal beloved seeks hero as eternal husband
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: The king says Niamh, his daughter, crossed the sea seeking Oisin to be her
    husband forever, and Oisin says he married Niamh.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Niamh is royal and from the Country of the Young, but the excerpt does
    not explicitly call her divine; the taxonomy reference to divine beloved is therefore
    cautious.
- id: motif:4
  label: Realm of lasting youth and complete delight
  taxonomy_refs:
  - afterlife_journey_map
  basis: The Country of the Young is described as delightful and blossoming, and its
    king promises Oisin long-lasting life, youth forever, and every delight the heart
    thought of.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage frames the realm as marvelous and youth-giving, but does not
    provide a doctrinal cosmology.
