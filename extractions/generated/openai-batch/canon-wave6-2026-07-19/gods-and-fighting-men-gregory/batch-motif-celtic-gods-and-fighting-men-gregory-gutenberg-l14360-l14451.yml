canonical_text:
  quote: The Country of the Young, the Country of Victory
  summary: Oisin, returned to Ireland aged after a long absence with Niamh, is questioned
    by Patrick. Oisin recounts traveling west over the sea with Niamh, seeing strange
    mounted and animal pursuits, passing through storm, and arriving in the Country
    of the Young. There he is welcomed by the king, queen, retinues, and nobles; the
    king promises lasting life, youth, and delights, identifies Niamh as his daughter,
    and says she sought Oisin as her husband. Oisin says he married Niamh and had
    two sons and a daughter by her.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Oisin came back to Ireland a long time after Niamh brought him away; the time
    is described as hundreds or thousands of years, though it seemed short to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After his return to Ireland, Oisin was found as a withered old man, lying
    on the ground while his white horse went away from him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Patrick kept Oisin in his house, taught and questioned him; Oisin was displeased
    with Ireland as it then was and spoke of earlier times and the Fianna.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Patrick asked Oisin to tell what happened when he left Finn and the Fianna
    and went away with Niamh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Oisin says he and golden-haired Niamh turned from the land, faced westward,
    and crossed the sea as it went away before them and filled with waves behind them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the journey Oisin and Niamh saw cities, courts, duns, lime-white houses,
    sunny-houses, and palaces.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: They saw a hornless deer running hard with an eager white red-eared hound
    following it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: They saw a young girl on a horse, holding a golden apple and going over the
    tops of the waves, followed by a young man on a white horse with a crimson cloak
    and a gold-hilted sword.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Oisin identifies the destination as the Country of the Young and the Country
    of Victory, and says that if Patrick's Heaven has the same grandeurs, he would
    give friendship to God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At one stage the horse was very swift, the sky darkened, wind rose everywhere,
    the sea appeared as if on fire, and the sun was hidden.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the storm and wind went down, Oisin and Niamh saw a delightful country
    in full blossom, smooth plains, a many-colored king's dun, sunny-houses, and palaces
    of shining stones.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Three fifties of armed men came out to meet Oisin and Niamh, and Niamh confirmed
    that this was the Country of the Young.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A hundred beautiful young girls in silk cloaks worked with gold welcomed Oisin;
    a shining army, a king, a queen, and fifty young girls also appeared.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The king welcomed Oisin, promised him long life, youth forever, and every
    delight the heart thought of, and identified himself as the king of the Country
    of the Young.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The king said the queen was the country's comely queen and that golden-headed
    Niamh, their daughter, had crossed the sea looking for Oisin to be her husband
    forever.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Oisin gave thanks, bowed before the queen, went to the royal house, was met
    by high nobles, and attended a feast lasting ten days and ten nights.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Oisin says he married Niamh of the Golden Hair and went to the Country of
    the Young, though telling it to Patrick is sorrowful to him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Patrick asks Oisin how he left the Country of the Young and whether he had
    children there.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:19
  text: Oisin says he had two sons and a daughter by Niamh; Niamh named the sons Finn
    and Osgar, and Oisin named the daughter The Flower.
  category: relationship
  evidence_refs:
  - ev:10
