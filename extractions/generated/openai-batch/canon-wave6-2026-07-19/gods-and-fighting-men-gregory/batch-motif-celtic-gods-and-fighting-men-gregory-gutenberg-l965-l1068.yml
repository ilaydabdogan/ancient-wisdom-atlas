candidate_motifs:
- id: motif:1
  label: satire that brings down a ruler's fortune
  taxonomy_refs: []
  basis: Corpre receives inadequate hospitality, speaks a satire directed at Bres's
    prosperity, and Bres's good luck ends from that day.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage calls the speech the first satire in Ireland, but it does
    not explicitly explain the mechanism beyond the sequence of satire and decline.
- id: motif:2
  label: royal legitimacy restored through bodily wholeness
  taxonomy_refs:
  - royal_legitimacy
  basis: After Nuada's own hand is restored and he is as well as before, the Tuatha
    de Danaan remove Bres and put Nuada back in the kingship.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The broader rule connecting bodily wholeness and kingship may be clearer
    in surrounding text; within this passage the restoration and kingship follow in
    sequence.
- id: motif:3
  label: miraculous prosthesis and superior restorative healing
  taxonomy_refs: []
  basis: Diancecht makes a functioning silver arm for Nuada, and Miach later surpasses
    that cure by restoring Nuada's original severed hand.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: No available taxonomy reference precisely covers prosthetic or surgical
    healing.
- id: motif:4
  label: the healer's child surpasses the father and is killed
  taxonomy_refs: []
  basis: Miach is called better at healing than Diancecht; after Miach's better cure,
    Diancecht attacks repeatedly until Miach dies.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: This is an episode-level pattern; the passage does not generalize it beyond
    these figures.
- id: motif:5
  label: medicinal knowledge grows from a slain healer and is obscured
  taxonomy_refs:
  - wisdom
  basis: Herbs grow from Miach's grave in the number of his joints and sinews; Airmed
    arranges them by virtue, but Diancecht mixes them so no one knows all their powers.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage is specifically
    about medicinal knowledge rather than wisdom in general.
- id: motif:6
  label: hidden paternity revealed by a fitting token
  taxonomy_refs:
  - divine_parent_child
  basis: Eri says Elathan gave her a ring for the man whose finger it would fit; the
    ring fits Bres, and Elathan recognizes it before Eri identifies Bres as his son.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:14
  confidence: medium
  cautions: The parent-child relation is explicit, but the taxonomy label uses 'divine';
    the passage identifies Elathan as a Fomor king rather than explicitly as a god.
- id: motif:7
  label: otherworldly sea-arrival of a radiant lover with a token
  taxonomy_refs: []
  basis: Eri recalls Elathan coming over a level sea in a silver-seeming vessel, appearing
    young and adorned with gold, receiving her love, and leaving a ring.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage does not explicitly label the voyage otherworldly; that label
    is inferred cautiously from the Fomor setting and unusual description.
- id: motif:8
  label: foreign gathering tests strangers through contests
  taxonomy_refs: []
  basis: At the Fomor gathering, strangers are given friendly challenges involving
    hounds, horses, and sword skill.
  evidence_refs:
  - ev:13
