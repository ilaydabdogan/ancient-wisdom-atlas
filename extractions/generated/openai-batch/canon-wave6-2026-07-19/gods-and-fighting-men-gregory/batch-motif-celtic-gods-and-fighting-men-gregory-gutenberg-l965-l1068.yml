canonical_text:
  quote: ''
  summary: After the Dagda completes work and asks the reward Angus had advised, the
    poet Corpre receives poor hospitality from Bres and utters a satire, after which
    Bres declines. Diancecht gives Nuada a silver arm, but Miach surpasses him by
    restoring Nuada's own hand and performing other healing feats. Diancecht kills
    Miach; herbs grow from Miach's grave, Airmed sorts them by virtue, and Diancecht
    mixes them so their powers are no longer fully known. With Nuada restored, the
    Tuatha de Danaan depose Bres and restore Nuada. Bres seeks his ancestry from his
    mother Eri, learns that his father is Elathan of the Fomor, proves this by a fitting
    ring, travels to the Fomor, succeeds in animal challenges, and is recognized by
    Elathan when the ring is seen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After completing his work, the Dagda asks for the reward Angus had told him
    to request; Bres thinks the request foolish because it is only a heifer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Corpre, son of Etain and poet of the Tuatha de Danaan, comes for hospitality
    at Bres's house and is lodged in a small dark house without fire, furniture, or
    bed, and receives three dry cakes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Corpre speaks a formula describing lack of food, milk, shelter, light, and
    payment for a story-teller, and applies it to the prosperity of Bres.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: From the day of Corpre's speech, Bres has no good luck and declines; the narration
    calls this the first satire made in Ireland.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Diancecht the healer makes a silver arm for Nuada, with movement in every
    finger, after Nuada's arm is struck off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nuada receives the lasting name Nuada Argat-lamh, meaning Nuada of the Silver
    Hand.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Miach places a cat's eye into the head of a one-eyed young man; afterward
    the eye wakes at small sounds or movements but sleeps when the man wants to watch
    an army or gathering.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Miach restores Nuada's own severed hand over three days and three nights,
    using the words about joint and sinew, placing the hand against Nuada's side and
    breast, and using fire-blackened bulrushes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the end of Miach's three-day treatment, Nuada is healed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Diancecht is vexed by Miach's superior cure, wounds him repeatedly, and finally
    strikes so that the brain is cut out; Miach dies and Diancecht buries him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Three hundred and sixty-five herbs grow from Miach's grave, corresponding
    to his joints and sinews.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Airmed spreads her cloak and lays out the herbs according to their virtue,
    but Diancecht mixes them so that their full powers are no longer known.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the Tuatha de Danaan see Nuada restored, they gather at Teamhair, require
    Bres to give up the kingship, and restore Nuada as king.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Bres, angry at being put out, seeks revenge and an army, and asks his mother
    Eri to tell him his race.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Eri tells Bres that his father is Elathan, a king of the Fomor, who came to
    her over a level sea in a silver-seeming vessel, appearing young, yellow-haired,
    gold-clothed, and wearing five gold rings.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Elathan gave Eri a ring and told her to give it only to the man whose finger
    it would fit.
  category: object
  evidence_refs:
  - ev:11
- id: obs:17
  text: The ring fits Bres's middle finger, and Eri, Bres, and his people set out
    from the hill and strand toward the country of the Fomor.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: At a Fomor gathering, strangers are given friendly challenges; Bres's party's
    hounds and horses beat those of the Fomor.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: When Bres puts his hand to his sword, Elathan sees the ring, asks who the
