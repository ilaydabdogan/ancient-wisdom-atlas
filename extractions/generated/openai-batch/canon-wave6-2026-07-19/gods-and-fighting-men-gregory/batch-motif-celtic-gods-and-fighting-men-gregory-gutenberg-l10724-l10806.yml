canonical_text:
  quote: ''
  summary: Diarmuid angers the woman he is with, and she and the house vanish. He
    sets out to find her, carrying the dead greyhound. After directions from a cowherd,
    he travels by ship and then by a boat that goes under the sea to a plain identified
    as Land-under-Wave. There he gathers three drops of blood, is brought hidden in
    rushes to the sick daughter of King Under-Wave, and learns that she needs three
    draughts from the cup of the King of the Plain of Wonder. Diarmuid sets out and
    is helped across a river by a low-sized reddish man, who says he will accompany
    him to take the cup.
  language: English
  quote_policy: summarized
