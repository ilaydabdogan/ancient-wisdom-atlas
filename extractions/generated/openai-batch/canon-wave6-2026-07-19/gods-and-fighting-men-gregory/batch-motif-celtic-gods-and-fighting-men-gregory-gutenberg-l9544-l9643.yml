canonical_text:
  quote: '"It was the Tuatha de Danaan I saw," said he, "taking up a quarrel against
    me, and making a great slaughter of the Fianna."'
  summary: Conan questions Finn, who answers and describes the music and sounds he
    loves. Conan promises Finn his daughter and a wedding-feast. Finn dreams that
    the Tuatha de Danaan will quarrel with him and slaughter the Fianna. The Fianna
    seek Finn through Mac-an-Reith's true knowledge. Later, in the hall at Almhuin,
    Men of Dea take offense at a division of the hall and report that Finn is taking
    a woman promised to a Tuatha man. Fionnbhar gathers Tuatha battalions, while Finn
    goes fearfully to Conan's feast and is seated in the drinking-hall.
  language: English
  quote_policy: quoted
