- id: motif:4
  label: Contested bride and wedding-feast conflict
  taxonomy_refs:
  - stolen_beloved
  basis: Conan offers his daughter to Finn and prepares a wedding-feast, while Failbhe
    Beag says Finn is bringing away a woman already promised to a Tuatha man and against
