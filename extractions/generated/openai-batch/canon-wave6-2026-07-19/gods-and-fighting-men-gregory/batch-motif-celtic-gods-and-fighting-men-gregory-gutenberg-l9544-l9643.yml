- id: motif:2
  label: Ominous dream before conflict
  taxonomy_refs: []
  basis: Finn dreams of the Tuatha de Danaan taking up a quarrel against him and slaughtering
    the Fianna, and later repeats his fear that the Men of Dea will kill his people.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: The passage shows warning and fear, but the outcome of the threatened
    violence is outside this range.
- id: motif:3
  label: Seer reveals hidden location
  taxonomy_refs:
  - wisdom
  basis: Mac-an-Reith is described as having true knowledge and uses it to identify
