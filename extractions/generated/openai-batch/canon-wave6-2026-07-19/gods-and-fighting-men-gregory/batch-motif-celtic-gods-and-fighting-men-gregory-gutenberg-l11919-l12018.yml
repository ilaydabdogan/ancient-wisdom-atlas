canonical_text:
  quote: ''
  summary: Diarmuid tells Grania about the bound stranger-kings and the hounds prepared
    to hunt him, then leaves the cave with her and Muadhan. The surviving strangers
    fail to loosen their leaders and are directed by Finn's woman-messenger to set
    the hounds on Diarmuid's track. The hounds pursue Diarmuid, Grania, and Muadhan
    across the cave, river, bog, and Slieve Luachra. Muadhan's whelp kills the first
    hound, Diarmuid kills the second with the Gae Dearg, and he kills the third by
    striking it against a rock. Diarmuid then kills the green-cloaked man at the head
    of the troop and two others, causing the strangers to flee.
  language: English
  quote_policy: summarized
