  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Connla is with his father Conn, King of Teamhair, on the Hill of Uisnach when
    he sees a woman in wonderful clothing approaching.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman says she comes from Tir-nam-Beo, the Land of the Ever-Living Ones,
    where death does not come; she describes lasting feasts, kindness without quarrelling,
    and identifies the people as the Sidhe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At first only Connla sees the woman; later others hear her words but still
    cannot see her.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The woman asks Connla to come to Magh Mell and says he will be a king forever
    without sorrow or fret and that his body will not wither from youth and comeliness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Conn interprets the unseen woman's call as an attack beyond his wisdom and
    power, aimed at taking his son away from him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Coran the Druid sings spells against the woman of the Sidhe so that her voice
    is not heard and Connla no longer sees her; as she is driven away, she throws
    Connla an apple.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For a month Connla uses no food or drink except the apple; the apple does
    not grow smaller, and Connla is troubled because of the woman he saw.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Magh Archomnim the same woman returns, says the Ever-Living Ones ask Connla
    to take sway over the people of Tethra, and speaks against the power of Druids
    where the law of Traig Mor comes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Connla says his own people are dearer to him than anything else, yet sorrow
    has taken hold of him because of the woman.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The woman invites Connla into her shining ship to go to the Plain of Victory
    and to another country that can be reached before night, where there is no living
    race except women and girls.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Connla leaps from his people into the shining boat and is seen sailing away
    far off, as if in mist, across the sea; he and the woman never come back, and
