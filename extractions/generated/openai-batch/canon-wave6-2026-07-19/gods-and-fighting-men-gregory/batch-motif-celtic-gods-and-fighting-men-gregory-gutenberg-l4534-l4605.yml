canonical_text:
  quote: ''
  summary: Connla of the Red Hair is summoned by a woman of the Sidhe from a deathless
    Otherworld. His father Conn tries to resist the unseen call through the Druid
    Coran. The woman gives Connla an inexhaustible apple, returns after a month, invites
    him into a shining ship, and Connla sails away across the sea in mist, never returning.
  language: English
  quote_policy: summarized
