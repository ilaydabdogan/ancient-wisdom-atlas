canonical_text:
  quote: ''
  summary: As Finn and the Lad of the Skins return toward Ireland, an old enemy arrives
    by ship and fights the Lad through successive human and animal forms until both
    die as birds. Finn brings the Lad's bird-body back to the woman, who sets out
    to sea with it, sees another dead bird revived on an island, finds green leaves
    there, and restores the Lad to life. The Lad returns to Almhuin, receives his
    wages from Finn, and departs with his wife.
  language: English
  quote_policy: summarized
