candidate_motifs:
- id: motif:1
  label: last assembly and decline of a heroic band
  taxonomy_refs:
  - departure
  basis: The passage explicitly marks the final gathering of Finn, Oisin, and the
    Fianna and says the group wore away afterward one by one.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy link to departure is functional and broad; the passage itself
    frames decline more than a formal departure journey.
- id: motif:2
  label: aged hero lamenting lost companions and former strength
  taxonomy_refs: []
  basis: Caoilte's complaint contrasts his age and few remaining acquaintances with
    earlier nights beside Diarmuid and Osgar and his former spear-bearing prowess.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No supplied taxonomy family directly names this lament pattern.
- id: motif:3
  label: hero entering a Sidhe hill for healing with uncertain return
  taxonomy_refs: []
  basis: Caoilte goes into a hill of the Sidhe to be healed of old wounds, and the
    narration leaves uncertain whether he came back.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not provide details of what happens inside the Sidhe
    hill.
- id: motif:4
  label: otherworldly or returned guide leading a lost ruler from darkness
  taxonomy_refs:
  - return
  basis: Long after Caoilte's disappearance, a flame-like man recognized as Caoilte
    guides a lost king through a dark wood to the right road.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly explain the guide's ontological status;
    the return connection depends on the sequence from the earlier uncertain disappearance.
- id: motif:5
  label: unrecognized remnants dying with lips to the earth
  taxonomy_refs: []
  basis: A remnant group of the Fianna comes to Teamhair, finds its strength and fame
    gone and no one speaking to them, then lies down with lips to the earth and dies.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The meaning of putting lips to the earth is not explained in the passage.
- id: motif:6
  label: hidden sleeping heroic war-band in a cave
  taxonomy_refs:
  - return
  - resurrection
  basis: The smith finds Finn and the Fianna lying in a cave, and later tradition
    says the Fianna will rise when the Dord Fiann is sounded three times.
  evidence_refs:
  - ev:10
  - ev:13
  confidence: high
  cautions: The figures are lying and partly roused, but the passage does not state
    they are asleep; it uses variant traditions introduced by 'some say.'
- id: motif:7
  label: incomplete awakening by twice-sounded heroic instrument before a required
    third sounding
  taxonomy_refs:
  - return
  - resurrection
  basis: The smith blows the Dord Fiann twice, causing movement but no full rising,
    while a future tradition requires three soundings for the Fianna to rise fully.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The text does not directly say that the smith failed because he did not
    blow a third time, though the sequence strongly suggests incompletion.
- id: motif:8
  label: hero who never died and reappears in later heroic shapes
  taxonomy_refs:
  - return
  - shapeshifter
  basis: Some say Finn never died and remains alive, and some say he has been on earth
    again in the shape of one of Ireland's heroes.
  evidence_refs:
  - ev:9
  - ev:13
  confidence: medium
  cautions: The wording is reported as a tradition and does not describe the mechanism
    of taking another shape.
- id: motif:9
  label: poetic memory confirmed by tall ancestral witnesses
  taxonomy_refs:
  - wisdom
  basis: Poets and reciters keep the deeds of the Fianna in memory, and tall shapes
    on the hills respond to a recitation by saying the man below knows the battle
    of Gabhra better than one who was there.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage presents an encounter around poetic memory, but the identity
    of the tall shapes is not specified.
