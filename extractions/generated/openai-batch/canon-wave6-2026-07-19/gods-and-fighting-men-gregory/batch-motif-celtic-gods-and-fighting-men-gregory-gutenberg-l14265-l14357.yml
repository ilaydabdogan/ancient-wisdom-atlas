canonical_text:
  quote: ''
  summary: 'After the Fianna''s last gathering, the passage recounts Caoilte''s winter
    lament, his entry into a hill of the Sidhe for healing, a later appearance as
    a flame-like guide to a lost king, the death of a remnant of the Fianna at Teamhair,
    and mists over Loch Dearg. It then gives variant traditions about Finn: some say
    he never died; a smith enters a cave containing Finn and the Fianna, blows the
    Dord Fiann twice, partly rouses them, flees, and loses the key; some say a future
    threefold sounding will raise the Fianna, and Finn has appeared again in the shape
    of Irish heroes. The passage ends with poets preserving the Fianna''s deeds and
    two tall shapes hearing poems about Gabhra.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says this was the last time Finn, Oisin, and the Fianna were gathered
    for hunting, battle, chess-playing, drinking, or music, and that they wore away
    afterward one by one.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Caoilte is described as old, bereaved of his sons, and lonely for former times;
    in heavy snow he laments the cold winter, mountain deer, wolves, lost companions,
    and his former spear and battle prowess.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Caoilte later enters a hill of the Sidhe to be healed of old wounds; whether
    he returns is said to be unknown, and a tradition connecting him with Patrick
    is presented as doubtful by the narrator.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: A king of Ireland and his people lose their way at night in a dark wood with
    no path before them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:5
  text: A very tall man shining like a burning flame takes the bridle of the king's
    horse and leads him through the wood to the right road; he identifies himself
    first as the king's candlestick and then as one who was once with Finn, and the
    king recognizes him as Caoilte son of Ronan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Three times nine of the Fianna come from the west to Teamhair, find that no
    one notices or speaks with them now that they lack their former strength and name,
    lie down on the hillside, put their lips to the earth, and die.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Loch Dearg is said to have been under mists for three days, a month, and a
    year after the destruction of the Fianna of Ireland.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: 'The passage gives variant traditions about Finn''s death: one says he died
    by a fisherman''s hand, while another says he never died and remains alive somewhere.'
  category: other
  evidence_refs:
  - ev:9
- id: obs:9
  text: A smith enters a cave with a door by making a key, finds a wide place with
    very big men lying on the floor, and sees the largest lying in the middle with
    the Dord Fiann beside him; he understands these figures to be Finn and the Fianna.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The smith blows the Dord Fiann once and the lying men shake from head to foot;
    he blows it again and they turn on their elbows.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: Frightened, the smith throws down the Dord Fiann, runs from the cave, locks
    the door, throws the key into the lake, and hears the cave figures cry that he
    has left them worse than he found them; the cave is not found again afterward.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: Some say that when the Dord Fiann is sounded three times in the future, the
    Fianna will rise up as strong and well as before; some also say Finn has appeared
    on earth since old times in the shape of Irish heroes.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:13
  text: The deeds of Finn and his men are said to have been kept in memory by poets
    of Ireland and Alban; two sheep-minders reciting Fianna poems see two tall shapes
    on opposite hills, and one shape says the reciter knows about Gabhra better than
    he himself does.
  category: speech
  evidence_refs:
  - ev:14
