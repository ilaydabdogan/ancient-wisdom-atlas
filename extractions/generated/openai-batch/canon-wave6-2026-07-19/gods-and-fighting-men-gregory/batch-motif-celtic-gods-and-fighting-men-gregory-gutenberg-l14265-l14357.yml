- id: ev:10
  type: summary
  locator: 14324-14328
  quote_or_summary: A smith opens a cave with a key he made and sees a wide place
    with big men lying down; the largest lies in the middle with the Dord Fiann beside
    him, and the smith knows it is Finn and the Fianna.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source text; summarized.
- id: ev:11
  type: summary
  locator: 14330-14335
  quote_or_summary: The smith lifts and blows the Dord Fiann; its sound is very great,
    the lying men shake head to foot, and after a second blast they turn on their
    elbows.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source text; summarized.
- id: ev:12
  type: quote
  locator: 14337-14341
  quote_or_summary: The smith flees, locks the cave, throws the key into a lake, and
    hears the figures cry, "You left us worse than you found us"; the cave is not
    found again.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source text; short quotation.
- id: ev:13
  type: summary
  locator: 14343-14347
  quote_or_summary: Some say the Dord Fiann will one day be sounded three times and
