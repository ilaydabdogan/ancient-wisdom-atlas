canonical_text:
  quote: ''
  summary: Nine of the Fianna search through Ireland for a desired pup, encounter
    and defeat cat-headed, dog-headed, and white-backed armies, display named banners
    and named swords, pursue the strange smith Lon to a smithy where extraordinary
    smiths make swords, and recount the origin of Finn's shield from Balor's poisoned
    head and a hazel tree, later made into a shield and passed through Manannan and
    Tadg to Finn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nine of the Fianna set out looking for a pup and search many named places
    without finding one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Fianna see three armies of the sons of the King of Ruadhleath approaching;
    the armies are described as Cat-headed, Dog-headed, and White-backed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Finn raises his shining spear, Caoilte gives a shout heard in several places,
    and other named warriors answer the shout.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Fianna raise named banners with specific images or emblems, including
    a sun-shape, a candle of battle, a red hand, a rowan broom, a bloody branch, and
    a briar.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Fianna attack the three armies and kill the Cat-Heads, Dog-Heads, and
    White-Backs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the battle, the Fianna go to a little hill with a double dun and find
    a hound from which they can get a pup.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Several Fianna have named swords, including Finn's Mac an Luin, Oisin's Ceard-nan
    Gallan, Caoilte's Cruadh-Chosgarach, Diarmuid's Liomhadoir, and Osgar's Cosgarach
    Mhor.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Lon son of Liobhan appears as a very big and ugly young man with one foot
    and one eye, a cloak of black skins, and a blunt ploughshare turning red in his
    hand.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Lon identifies himself as one of the three smiths of the King of Lochlann
    and runs away or leads the Fianna onward; they follow him through Ireland to the
    sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the smithy, the Fianna find four smiths working, each with seven hands;
    they watch until the swords are made and then take the swords away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Finn has a shield called Sgiath Gailbhinn, the Storm Shield; when it calls
    out it can be heard through Ireland.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Magh Tuireadh battle episode, Lugh cuts off Balor's head and hangs
    it in the fork of a hazel tree; poison from the head splits and withers the tree.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The damaged hazel tree becomes a dwelling-place for crows and ravens for fifty
    years.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: When Manannan's men dig up the tree, poison rises from the roots; nine men
    die, another nine die after them, and a third nine are blinded.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Luchtaine the Carpenter makes a shield from the hazel wood; Manannan gives
    the shield and chessmen to Tadg son of Nuada, and the shield later comes to Finn.
  category: sequence
  evidence_refs:
  - ev:11
