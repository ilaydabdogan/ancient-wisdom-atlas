canonical_text:
  quote: ''
  summary: The children of Lir, transformed into swans, tell Lir they cannot live
    on land with people but retain speech, memory, and music. Lir laments and reports
    Aoife's deed to Bodb Dearg. Bodb punishes Aoife by transforming her into a witch
    of the air. The Tuatha de Danaan and the Sons of the Gael gather at Loch Dairbhreach
    for three hundred years to hear the swans' music. When the allotted time ends,
    the swan-children farewell their kin, fly to the cold sea of the Maoil, and prepare
    for a storm by choosing the Rock of the Seals as a meeting place.
  language: English
  quote_policy: summarized
