  summary: The Grey Man returns from looking for a cup, attacks Conan with a sword,
    and is killed by Osgar after Conan calls for help. Ailne sees this and dies from
    grief and dread. The Fianna feast on found food and drink, but in the morning
    the dun has vanished and they are lying on bare grass. Conan's sheepskin remains
    attached to him, and its wool grows yearly.
