canonical_text:
  quote: ''
  summary: The passage opens Book Five with Oisin's wife Eibhir, whom he seeks beyond
    the sea and wins after fighting the High King of Ireland and Firbolg helpers.
    It then recounts Beara, daughter of the King of Spain, whose Druid foretells the
    arrival of her husband and instructs her to make a shining shirt from the clothing
    of a golden or crimson-spotted salmon; Eoghan arrives as an exile, marries Beara,
    wears the shirt, and receives the name Eoghan the Bright. A lineage note mentions
    Oiliol and Aine of the Sidhe. The passage then introduces Osgar, son of Oisin,
    whose latent martial strength is revealed when he attacks enemies with a log of
    wood, and ends with a feast at Almhuin where Fianna heroes name their preferred
    forms of music, with Osgar choosing the sound of swords in battle.
  language: English
  quote_policy: summarized
