canonical_text:
  quote: ''
  summary: Finn gathers the seven battalions of the Fianna at Fionntulach after learning
    that enemies are coming. Cael arrives from Brugh na Boinne and says he has seen
    Credhe, a woman of the Sidhe, in a dream as the object of a high marriage. Finn
    warns that Credhe demands a poem describing her vessels and palaces before accepting
    any suitor. The Fianna postpone battle, travel to Loch Cuire, and come to the
    door of the hill of the Sidhe. Credhe appears with her women, and Cael sings a
    detailed praise-poem of her house, wealth, vessels, birds, vat, apple-tree, and
    rank. Credhe accepts him as husband, and the Fianna remain for a seven-day wedding
    feast.
  language: English
  quote_policy: summarized
