canonical_text:
  quote: ''
  summary: Miodac, son of the King of Lochlann, disguises himself as a poet, gives
    Finn riddling verses, and invites the Fianna into the House of the Quicken Trees
    for a feast. The house changes from splendid to bare and foul, and the Fianna
    are held by enchantment. Finn orders the Dord Fiann to be sounded. Other Fianna
    come to fight but cannot overcome the enemies until Diarmuid kills Miodac and
    the Three Kings of the Island of the Floods and removes the enchantment with their
    blood. Conan then asks Diarmuid for food and comments on Diarmuid's responsiveness
    to women.
  language: English
  quote_policy: summarized
