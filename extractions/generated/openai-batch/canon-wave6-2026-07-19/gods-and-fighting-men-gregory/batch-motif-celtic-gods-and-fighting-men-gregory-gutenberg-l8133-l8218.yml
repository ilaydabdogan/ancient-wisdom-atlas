canonical_text:
  quote: ''
  summary: Finn receives Fergus's reports from an overwhelming battle. Daire Donn,
    the King of the World, searches for Finn and kills several Fianna champions before
    Finn defeats and beheads him with the destined sword and shield. The royal crown
    and weapons are then passed first to Conmail, who is killed by Goll Garbh, and
    then to Ogarmach, who challenges Finn. Finn beheads Ogarmach and falls as if dead,
    but rises again.
  language: English
  quote_policy: summarized
