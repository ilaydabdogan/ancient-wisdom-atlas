canonical_text:
  quote: ''
  summary: Bres and Sreng compare and exchange weapons before relaying a demand that
    the Firbolgs cede half of Ireland or fight. The Firbolgs refuse. The Men of Dea
    fortify themselves; three queens use enchantments of darkness, fire, and blood
    against Teamhair, but Firbolg Druids break the spell. The armies prepare, fight
    under agreed conditions, use healing baths between battle days, and after Eochaid
    is killed the remaining Firbolgs accept peace and settle in Connacht.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sreng and Bres put their shields away and each says he had feared the other
    side's spears.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sreng identifies the Firbolg spears as Craisech and says they break shields,
    crush flesh and bones, and cause death or wounds that never heal.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bres and Sreng exchange spears so fighters on each side can see the weapons
    used by the other side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bres sends the Firbolgs an offer that the Men of Dea will take half of Ireland
    in peace, but that refusal will lead to battle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bres and Sreng say that whatever happens later, they themselves will be friends.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sreng returns to Teamhair, gives the message, shows the spear, and advises
    sharing the country because the newcomers have better weapons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Eochaid and his chief men decide not to give up half the country, saying the
    strangers would soon take the whole.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Men of Dea move west in Connacht and build walls and ditches on Magh Nia,
    with Belgata mountain behind them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Badb, Macha, and the Morrigu go to Teamhair and by enchantment bring mists,
    darkness, and showers of fire and blood over the place for three days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Firbolg Druids Cesarn, Gnathach, and Ingnathach break the enchantment
