literal_observations:
- id: obs:1
  text: Finn, Oisin, Caoilte, Diarmuid, Lugaidh's Son, and five named hounds go to
    the top of Cairn Feargall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: They see a very tall rough giant carrying an iron fork with a squealing pig
    between its prongs, while a beautiful young girl follows and pushes him forward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Finn and the others pursue the giant and girl, a dark Druid mist hides
    the road; after it clears, they see a light-roofed house by a ford.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before the house is a green lawn with two wells; one well has a rough iron
    vessel at its edge and the other has a copper vessel.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the house are an old white-haired man at the door, the young girl,
    the giant boiling a pig by the fire, an old countryman with twelve eyes, a ram,
    and a hag in a worn grey gown.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man at the door welcomes the visitors and says great respect should be
    shown to Finn and his people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Caoilte brings Finn a drink in the copper vessel; it tastes like honey while
    he drinks and like gall afterward, and Finn suffers pains, signs of death, and
    a changed appearance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Caoilte then brings Finn a drink in the iron vessel; the draught is extremely
    bitter, but after drinking it Finn’s color and appearance return and he is well
    again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The giant divides the boiled pig among Finn and his dogs, Finn’s four comrades,
    himself, the old man and hag, and the man of the house and young girl; the ram
    objects that it has been forgotten.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ram takes the Fianna’s quarter of meat and begins eating it; sword-strokes
    do not harm it, and the twelve-eyed man throws it out of the house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The hag throws her pale grey gown over Finn’s four comrades, and they become
    weak, withered old men with hanging heads.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Finn sleeps with his head in the breast of the man at the door; the hag removes
    the covering, and when Finn wakes the four comrades are in their own shape again.
  category: sequence
  evidence_refs:
  - ev:9
