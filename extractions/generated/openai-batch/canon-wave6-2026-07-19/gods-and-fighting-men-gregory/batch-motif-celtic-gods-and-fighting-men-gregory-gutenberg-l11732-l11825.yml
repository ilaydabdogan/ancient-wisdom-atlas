canonical_text:
  quote: ''
  summary: Diarmuid and Grania travel westward by rivers, cook salmon, meet Muadhan,
    and accept him as a servant and night-watchman. Muadhan carries them over streams,
    prepares a cave shelter, catches and divides three salmon, and keeps watch. Diarmuid
    later sees ships arrive, meets the Green Champions of Muir-na-locht sent by Finn
    to find him, hears of their invulnerable hounds, and performs a wine-tun trick
    that kills fifty of the strangers.
  language: English
  quote_policy: summarized
