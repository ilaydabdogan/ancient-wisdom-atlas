canonical_text:
  quote: ''
  summary: Aine is described through variant identifications, a dangerous stone called
    Cathair Aine, associations with madness, healing, poetry, music, love, and the
    name Leanan Sidhe. The passage then tells how, after Oilioll Oluim killed her
    brother, Aine created an enchanted yew-tree with a harp-playing little man; a
    quarrel and partial judgment followed, leading to battle and the deaths of Oilioll
    and his seven sons.
  language: English
  quote_policy: summarized
