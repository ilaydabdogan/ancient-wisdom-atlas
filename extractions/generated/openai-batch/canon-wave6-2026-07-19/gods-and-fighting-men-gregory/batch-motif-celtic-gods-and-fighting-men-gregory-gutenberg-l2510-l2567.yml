canonical_text:
  quote: ''
  summary: After music induces grief, laughter, and sleep, three figures escape through
    the Fomor, and the Dagda’s heifer calls back Ireland’s cattle. Cé, a wounded druid
    of Nuada, dies on a flowered plain, where a lake rises and is named Loch Cé. The
    remaining Fomor are expelled on Samhain by the Morrigu and Angus Og. The Morrigu
    proclaims victory and peace; the dead are described as innumerable. Lugh becomes
    king, honors his foster-mother Taillte with burial, a mound, fires, keening, and
    annual summer games, and arranges his mother Ethlinn’s marriage to Tadg, producing
    genealogical links to Finn and Bran.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A harp-player performs three tunes described as the crying tune, laughing
    tune, and sleepy tune, and the listeners respond with crying, laughter, and sleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the sleep of the hosts, three figures go away through the Fomor, who
    would have harmed them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Dagda brings out a heifer received as wages from Bres; when the heifer
    calls to her calf, the cattle of Ireland taken as tribute by the Fomor return
    to their fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cé, the wounded druid of Nuada of the Silver Hand, travels south, sees a smooth
    flower-filled plain, reaches it, and dies there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Cé’s grave is made, a lake bursts out over the grave and the whole plain
    and is named Loch Cé.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four Fomor remain in Ireland after the battle and spoil corn, milk, fruit,
    and sea produce until the Morrigu and Angus Og drive them out on Samhain night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the battlefield is cleared, the Morrigu announces the victory to hosts
    and to Irish heights, rivers, and inlets, using a peace formula involving sky
    and earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The number of men fallen in battle is said to be unknowable until stars, snowflakes,
    dew, grass, cattle-trodden grass, or the horses of the Son of Lir in a stormy
    sea can be counted.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lugh is made king over the Men of Dea and has his court at Nas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before her death, Taillte tells her husband Duach the Dark to clear the wood
    of Cuan so that people can gather around her grave; the men of Ireland cut the
    wood down within a month.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Lugh buries Taillte in the plain of Midhe, raises a mound over her, and orders
    fires, keening, games, and sports to be held each summer in her honor at the place
    named Taillten.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Lugh’s mother Ethlinn comes to Teamhair after the battle; Lugh gives her in
    marriage to Tadg, son of Nuada, and their children are named as Muirne, mother
    of Finn, and Tuiren, mother of Bran.
  category: relationship
  evidence_refs:
  - ev:10
