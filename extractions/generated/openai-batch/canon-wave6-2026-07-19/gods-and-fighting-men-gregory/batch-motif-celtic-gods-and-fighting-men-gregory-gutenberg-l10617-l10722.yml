canonical_text:
  quote: ''
  summary: On a snowy winter night, a wild ugly long-haired woman asks for shelter
    among the Fianna. Finn and Oisin refuse her, but Diarmuid admits her under his
    covering, brings her to the fire, and later lets her under his bed-covering. She
    is then seen as a beautiful young woman. She asks where Diarmuid would like the
    best house built, and by morning a great furnished house stands on the hillside.
    She asks Diarmuid to promise not to say three times what way she was when she
    came to him. After Diarmuid goes back to the Fianna, Finn obtains one of Diarmuid’s
    greyhound’s pups from the woman; Diarmuid returns, notices the loss, and reproaches
    her by recalling her former appearance. Oisin then obtains another pup, and Diarmuid
    repeats the reproach. The passage ends as Caoilte seeks the same kind of promise
    for another pup.
  language: English
  quote_policy: summarized
