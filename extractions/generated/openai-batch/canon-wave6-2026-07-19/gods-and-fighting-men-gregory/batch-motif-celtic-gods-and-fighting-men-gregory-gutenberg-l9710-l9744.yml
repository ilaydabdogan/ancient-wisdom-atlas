canonical_text:
  quote: ''
  summary: Finn hunts on the mountain of Bearnas Mor. A wild pig kills many of the
    Fianna's hounds before Bran overcomes it. A tall man comes from a hill and asks
    Finn to spare the pig, then brings the company into a Sidhe hill at Glandeirgdeis.
    At the house door he strikes the pig with a Druid rod, and it becomes a beautiful
    young woman called Scathach, the Shadowy One. After a feast, Finn asks to marry
    her, and her father agrees. At night Scathach plays a harp with iron, bronze,
    and silver strings, each having a different power; the silver string puts Finn,
    Bran, and the rest into heavy sleep. They wake at sunrise outside on the mountain
    where they first saw the pig.
  language: English
  quote_policy: summarized
