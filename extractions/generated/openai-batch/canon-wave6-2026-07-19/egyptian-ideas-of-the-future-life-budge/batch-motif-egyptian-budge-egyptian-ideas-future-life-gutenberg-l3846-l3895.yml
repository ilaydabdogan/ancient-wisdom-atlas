    force or strength personified, able under some conditions to follow him into heaven.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The KHAIBIT or shadow is mentioned in connection with the soul and, in later
    thought, was believed to be near it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The REN or name is described as one of the most important constituent parts
    of a person, and preserving the name is said to be of great importance.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Blotting out a man's name was thought to destroy him also, because the name
    was a portion of his special identity.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A nameless being could not be introduced to the gods, and the passage states
    that no created thing exists without a name.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A good son was expected to perpetuate his father's name, and maintaining tombs
    so names remained readable was considered meritorious.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: If the deceased knew and pronounced the names of divine beings, whether friends
