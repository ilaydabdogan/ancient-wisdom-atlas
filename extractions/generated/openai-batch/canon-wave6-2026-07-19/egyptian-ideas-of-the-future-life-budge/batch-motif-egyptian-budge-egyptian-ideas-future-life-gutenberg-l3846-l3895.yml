canonical_text:
  quote: ''
  summary: 'The passage describes several Egyptian constituents of a person: BA as
    soul, KHU as luminous spirit, SEKHEM as power or vital force, KHAIBIT as shadow,
    and REN as name. It says the BA can move between tomb and heaven and may reanimate
    the body; the KHU can be imprisoned unless protected by formulae; the SEKHEM can
    follow its possessor into heaven; the shadow is near the soul; and the name is
    crucial to identity, survival, introduction to gods, and power over divine beings
    when known and pronounced. The passage ends by listing eight parts of a human
    entity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The BA is identified as the soul and is described as dwelling in the KA, able
    to become corporeal or incorporeal, having substance and form, and often depicted
    as a human-headed hawk.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The BA is said to leave the tomb, pass up into heaven, enjoy eternal existence
    in glory, revisit the body in the tomb, and possibly reanimate and converse with
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The souls of the blessed dead are described as dwelling in heaven with the
    gods and enjoying celestial pleasures forever.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The KHU is described as a spiritual intelligence or spirit taking the form
    of a shining, luminous, intangible shape of the body; KHUs are said to form a
    class of celestial beings living with the gods.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The KHU, like the KA, could be imprisoned in the tomb, and special formulae
    were composed and recited to prevent this.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
