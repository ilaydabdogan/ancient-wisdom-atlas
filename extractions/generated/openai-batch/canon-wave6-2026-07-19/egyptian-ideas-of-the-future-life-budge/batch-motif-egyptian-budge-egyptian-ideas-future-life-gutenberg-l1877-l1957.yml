canonical_text:
  quote: ''
  summary: The passage explains that the Egyptian resurrection hope described here
    concerns the SAHU, a spiritual body transformed from the physical body through
    funeral prayers and rites. It discusses air supplied through Temu, the night Sun,
    and a comparison between the Sun’s daily death and the deceased’s death. It treats
    the severed head and reconstituted limbs of Osiris, the deceased’s wish not to
    lose the head, and ritual or prehistoric contexts of mutilation, burning, and
    reassembly. It then describes later prayers to Amen for breath of life while maintaining
    Osiris as the divine-human model, cause, symbol, and judge associated with resurrection
    and eternal spiritual life.
  language: English
  quote_policy: summarized
