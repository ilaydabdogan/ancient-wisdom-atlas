canonical_text:
  quote: ''
  summary: Budge summarizes Egyptian beliefs about Osiris as a divine being who died,
    was mutilated, rose again, became king of the underworld and judge of the dead,
    and enabled the righteous to conquer death. He then introduces Plutarch's account
    of Osiris's birth and related divine births on five superadded days, including
    the curse on Rhea/Nut, Mercury's winning of lunar portions to create the added
    days, Osiris's birth proclamation, the Pamyles variant, and the births and relationships
    of Aroueris, Typho, Isis, and Nephthys.
  language: English
  quote_policy: summarized
