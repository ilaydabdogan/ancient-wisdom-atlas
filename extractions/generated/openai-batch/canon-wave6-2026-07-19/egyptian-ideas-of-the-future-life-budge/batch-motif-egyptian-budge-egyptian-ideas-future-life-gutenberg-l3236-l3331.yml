  quote: "“his heart should balance exactly the symbol of the law”"
  summary: The passage describes the Egyptian judgment of the dead in the Hall of
    Maati, where the deceased Ani’s heart is weighed against the symbol of Maat. Osiris
    and divine witnesses are present; Anubis tends the balance, Thoth records the
    result, and Am-mit waits to devour the heart if it is found light. Ani, his wife
    Thuthu, his soul, and destiny/fortune-related figures or objects appear near the
    balance. The passage also compares details across several papyri, including a
    lake of fire scene.
