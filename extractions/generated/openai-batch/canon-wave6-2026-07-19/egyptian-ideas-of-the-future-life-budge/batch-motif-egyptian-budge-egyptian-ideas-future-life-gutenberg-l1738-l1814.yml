canonical_text:
  quote: Thou livest, thou art stablished, thou renewest thy youth...
  summary: A hymn praises Osiris as sovereign, renewed, crowned, accompanied by Isis,
    strengthened by Rā, and served by offerings, libations, and mortuary meals. Budge
    then summarizes another hymn in which Osiris gives men and women a second birth,
    interprets this as resurrection into new life, and describes Osiris as equal to
    Rā. The passage also describes Horus, begotten after Osiris's death, as heir,
    avenger, and intercessor for the deceased in the Judgment Scene, and introduces
    a prayer to Osiris to prevent bodily decay.
  language: English
  quote_policy: quoted
