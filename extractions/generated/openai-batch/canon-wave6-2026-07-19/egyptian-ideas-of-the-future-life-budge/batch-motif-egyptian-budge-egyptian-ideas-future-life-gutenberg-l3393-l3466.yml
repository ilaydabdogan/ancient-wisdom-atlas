candidate_motifs:
- id: motif:1
  label: deceased becomes counterpart of Osiris through funerary rites
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The passage states that rites corresponding to those performed for Osiris
    are performed for the deceased so that the same favorable things happen to him
    and he becomes the counterpart of Osiris.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage frames identification with Osiris and expected posthumous
    benefit; it does not narrate a full resurrection episode in this excerpt.
