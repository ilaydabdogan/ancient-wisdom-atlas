  summary: The passage explains why the deceased is identified with Osiris, describes
    the funerary importance of being declared ma[=a] kheru, outlines the deceased's
    need for effective speech during underworld travel, and describes Horus leading
    Ani into the shrine of Osiris after judgment. It also notes iconographic details
    of Osiris's shrine and a variant in which the throne rests on or in water, compared
    by the author to a Book of the Dead passage describing Osiris's house.
