canonical_text:
  quote: And let life arise out of death.
  summary: A funerary address petitions Osiris to embalm and preserve the deceased
    from decay, worms, and bodily destruction, and to grant entrance into everlastingness.
    The passage describes the corruption of a body after the soul departs, asks for
    protection from worms, reptiles, and a hidden slaughterer, praises Osiris as incorruptible,
    and has the deceased identify himself with Khepera while declaring everlasting
    existence, life, germination, peaceful awakening, and bodily stability.
  language: English
  quote_policy: quoted
