  quote: ''
  summary: Budge describes Amen as a originally local Theban hidden god who became
    a national supreme deity through Theban royal power and priestly theology, was
    identified with Ra and other old gods, and was opposed by Amenophis IV in favor
    of Aten. The passage also summarizes images of Aten as a life-giving solar disk
    and quotes titles of Amen-Ra as primordial, hidden, self-forming, creator, sustainer,
    and unique god.
