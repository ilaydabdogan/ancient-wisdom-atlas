  summary: Budge describes Egyptian beliefs about continued life after death, including
    food and pleasure in heaven, preservation of the physical body, burial positions
    interpreted as hopes for rebirth, the contrast with mutilation or burning, and
    doctrines of the KHAT and KA, including offerings for the KA.
  language: English
