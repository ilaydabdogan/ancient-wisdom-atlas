  quote: ''
  summary: Budge discusses uses of the Egyptian word neter in Pyramid Text passages
    concerning deceased kings and then in early Egyptian moral precepts. The cited
    royal passages describe Unas, Teta, and Pepi in relation to God, Ra, heaven, divine
    transformation, solar boats, and divine sonship. The cited precepts attribute
    moral order, provision, obedience, and good sons to God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the cited text of Unas, offerings or things sent by the king's ka, father,
    and Ra come to him; Unas is described as pure, existing beside God, and freed
    from evil words or things written in his name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage cited from the text of Teta places a scene in the eastern part
    of heaven, where gods give birth to themselves, where what they give birth to
    is born, and where they renew their youth.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Teta is said to stand up in the form of a star, to weigh words or try deeds,
    and God is said to listen to what he says.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Teta is described as arriving in the height of heaven, being seen by henmemet
    beings, being known by the morning boat, sailing it, and bringing the evening
    boat to a standstill when it calls to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Teta sees his body in the morning boat, knows the uraeus in the evening boat,
    is called by God in his name, and is taken in to Ra.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One cited passage says the king has received the form or attribute of God;
    another says of Pepi I, "This Pepi is God, the son of God."
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Budge interprets the passages as referring to a supreme Being in the next
    world who can invoke and obtain a favourable reception for the deceased king by
    Ra, the Sun-god.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Budge notes a possible argument that neter refers to Osiris, but states that
    if so, the powers of God have been attributed to Osiris in relation to Ra and
    the deceased.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Precepts of Kaqemna and Ptah-hetep are described as works of direction
    and guidance for a young man in duties toward society and God.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The quoted moral precepts say that God opposes making men or women afraid,
    that the eating of bread follows God's plan, that cultivated land is given by
    God, that good conduct may be fair before God, and that obedience is loved by
    God while disobedience is hated.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The quoted precepts also describe dependents as to be satisfied by those whom
    God has favoured, wealth and advancement as guarded things God has provided, and
    a good son as a gift of God.
  category: speech
  evidence_refs:
  - ev:7
