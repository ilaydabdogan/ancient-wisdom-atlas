canonical_text:
  quote: '"Thou art the One God who came into being in the beginning of time."'
  summary: The passage gives hymnic praise to R[=a], Amen-R[=a], and the solar Disk
    as creator, ruler, self-created deity, and daily traveler across heaven. It describes
    the defeat of the serpent-fiend Nak and solar travel in boats. In a prayer from
    the Papyrus of Ani, Osiris Ani asks to accompany the solar deity into heaven,
    travel in the M[=a]tet and Sektet boats, pass among the stars, avoid confinement
    in the tomb, have his limbs renewed, and reach the land of eternity.
  language: English
  quote_policy: quoted
