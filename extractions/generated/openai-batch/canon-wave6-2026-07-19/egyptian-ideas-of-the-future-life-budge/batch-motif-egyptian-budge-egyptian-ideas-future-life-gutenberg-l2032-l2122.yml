canonical_text:
  quote: ''
  summary: 'Budge explains the many Egyptian gods as local, family, civic, national,
    natural, and animal-associated divine beings, while distinguishing them from a
    higher singular God in educated Egyptian thought. He describes how gods could
    be fused, imported, replaced, or elevated by political fortune. The passage then
    uses Thoth as an example: his early emblem was the dog-headed ape, associated
    with the sun and heavenly portals, later linked to the Book of the Dead, divine
    words, Osiris''s triumph, the weighing of the deceased''s heart against Ma''at''s
    feather, and eventually the ibis form and attributes of letters, science, mathematics,
    and a creation role compared with Wisdom in Proverbs.'
  language: English
  quote_policy: summarized
