canonical_text:
  quote: ''
  summary: The passage recounts Osiris as a civilizing king who teaches agriculture,
    laws, and worship, then travels widely using persuasive speech, hymns, songs,
    and music. Typho organizes a conspiracy with seventy-two others and Aso, uses
    a measured ornate chest to trap Osiris, seals it, and sends it by the Nile to
    the sea. Pans and Satyrs report the event, giving an etiology for Panic Terrors.
    Isis mourns, searches for the chest, learns from children where it went, and Egyptian
    practice is said to treat children’s speech as omen-bearing. Isis also searches
    for the exposed child of Osiris and Nepthys, finds him with the aid of dogs, raises
    him, and he becomes Anubis, guard and attendant of the gods.
  language: English
  quote_policy: summarized
