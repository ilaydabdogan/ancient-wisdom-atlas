canonical_text:
  quote: ''
  summary: 'The passage summarizes several Egyptian deities and associated mythic
    functions: Isis as wife of Osiris, mother of Horus, revivifier of Osiris, and
    divine mother; Set as night counterpart to Horus the Elder, helper of the dead
    in one older view, and later antagonist and murderer of Osiris; Nephthys as Isis''s
    companion and funerary helper; Nu as primeval watery source; Ptah, Thoth, Ptah-Seker,
    Ptah-Seker-Ausar, and Khnemu as creative or composite divine figures connected
    with creation, mouth-opening, life, death, resurrection, and the fashioning of
    humanity.'
  language: English
  quote_policy: summarized
