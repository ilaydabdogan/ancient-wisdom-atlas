comparison_claims:
- id: claim:1
  claim: 'The passage compares two Horus-Set conflict traditions by noting that they
    are often confused in texts, while distinguishing their meanings: night defeated
    by day in one and life or good defeating death or evil in the other.'
  claim_level: same_motif
  target: Two Horus-Set conflict patterns within Egyptian textual tradition
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs:
  - ev:4
  confidence: medium
  limitations: The passage emphasizes that the fights and Horus figures were originally
    distinct, so the claim should not collapse them into a single identical myth.
- id: claim:2
  claim: The passage links Ptah's function of opening the mouth with Book of the Dead
    Chapter XXIII mouth-opening formulae, supporting a same-function comparison within
    Egyptian funerary tradition.
  claim_level: same_function
  target: Book of the Dead Chapter XXIII mouth-opening formula
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage provides only brief quoted allusions from the Book of the
    Dead, not the full chapter context.
