candidate_motifs:
- id: motif:1
  label: Creation by divine word and mental conception
  taxonomy_refs: []
  basis: The passage repeatedly links creation with divine conception, speech, voice,
    mouth, and the uttered name as a word of power.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:12
  confidence: high
  cautions: No supplied taxonomy label exactly names creation by speech, so no taxonomy
    reference is assigned.
- id: motif:2
  label: Creator as potter or craftsman
  taxonomy_refs: []
  basis: God is explicitly called the primeval Potter who forms men and gods with
    his hands and on a potter's table.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The motif is limited to the opening hymn within this passage.
- id: motif:3
  label: Primeval waters before formed world
  taxonomy_refs:
  - chaos
  basis: The passage describes a time before heaven and earth in which only boundless
    primeval water and thick darkness exist, containing the germs of later things.
  evidence_refs:
  - ev:6
  - ev:11
  confidence: high
  cautions: The passage uses water and darkness rather than the word 'chaos'; the
    taxonomy mapping is therefore conceptual but directly supported by the pre-creation
    description.
- id: motif:4
  label: Cosmic egg or germ producing the solar god
  taxonomy_refs:
  - cosmic_egg
  basis: A germ or egg is formed, and Rā springs from it with the almighty power of
    the divine spirit embodied in his shining form.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage says 'germ, or egg,' so the egg terminology is present but
    paired with an alternative rendering.
- id: motif:5
  label: Self-generated deity from primeval matter
  taxonomy_refs: []
  basis: Neb-er-tcher says he evolved himself, developed himself from primeval matter,
    was alone, and made all things without another worker.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: No supplied taxonomy family exactly corresponds to self-generation from
    primeval matter.
- id: motif:6
  label: One becoming three through divine emanation
  taxonomy_refs:
  - divine_parent_child
  basis: The speaker emits Shu and Tefnut from himself and states that from being
    One he became Three; the passage then gives a divine genealogy.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The numeric formulation is explicit, but the taxonomy reference captures
    the parent-child/emanation aspect rather than the full theological detail.
- id: motif:7
  label: Sacred birth of a divine sibling group
  taxonomy_refs:
  - sacred_birth
  - sibling_pair
  basis: Nut brings forth Osiris, Horus-khent-an-maa, Sut, Isis, and Nephthya at one
    birth.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage gives a multiple birth of divine figures; 'sibling_pair' is
    only partially apt because the group contains more than two figures.
- id: motif:8
  label: Divine judgment and protection of the weak
  taxonomy_refs:
  - divine_judgment
  basis: God judges between mighty and weak, protects the weak against the strong,
    hears the bound, and rewards or protects followers.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a theological attribute passage rather than a narrative judgment
    scene.
- id: motif:9
  label: Cosmos mapped onto divine body
  taxonomy_refs: []
  basis: The passage describes heaven, earth, and underworld in relation to the deity's
    head, feet, spirit, form, and mystery, and the illustration caption describes
