canonical_text:
  quote: ''
  summary: 'The passage presents Egyptian theological and cosmogonic material: a creator
    God makes and sustains the universe by hand, will, and speech; Rā is identified
    as the visible symbol of God; creation begins from primeval water and darkness,
    proceeds through divine desire and utterance, and includes a germ or egg from
    which Rā springs; a Papyrus of Nesi Amsu passage has Neb-er-tcher describe self-evolution
    from primeval matter, creation by a word of power, and the emanation of Shu and
    Tefnut followed by further divine births.'
  language: English
  quote_policy: summarized
