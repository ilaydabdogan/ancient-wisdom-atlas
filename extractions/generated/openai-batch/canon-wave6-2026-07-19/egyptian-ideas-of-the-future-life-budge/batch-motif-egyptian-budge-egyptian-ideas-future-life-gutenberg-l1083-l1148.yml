canonical_text:
  quote: ''
  summary: The passage quotes a hymn to Ra/Temu-Harmachis in which the solar deity
    rises in the horizon, renews himself in the solar disk within Hathor, is called
    self-begotten and self-born, emerges from water and Nu, receives homage from Nut,
    Maat, gods, peoples, and souls, travels in the Sektet boat, is protected by Isis
    and Nephthys, and triumphs over a serpent-fiend/Nak. Budge then comments that
    Egyptians treated Ra as the visible type and symbol of God Almighty while Egyptian
    religious ideas varied by period and preserved inherited traditions.
  language: English
  quote_policy: summarized
