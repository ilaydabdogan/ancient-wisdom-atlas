canonical_text:
  quote: R[=a], the Sun-god, was evolved from the primeval abyss of water by the agency
    of the god Khepera
  summary: Budge discusses an Egyptian cosmogonic passage in which Rā emerges from
    primeval water through Khepera’s agency, Osiris is identified with Khepera in
    relation to evolutions and new births, and humanity arises from tears of the solar
    Eye. The passage then summarizes Rā’s role toward the dead and quotes hymnic material
    in which Rā/Khepera rises daily, is honored by Nut, Maat, Thoth, gods, and cosmic
    regions, travels in a divine bark, and defeats a serpent enemy.
  language: English
