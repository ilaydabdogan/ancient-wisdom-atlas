comparison_claims:
- id: claim:1
  claim: The passage contrasts the Rā/Khepera cosmogony with other Egyptian cosmogonic
    views in which Ptah and Khnemu play leading parts, stating that the latter cosmogony
    is entirely different.
  claim_level: same_function
  target: Egyptian cosmogonies associated with Ptah and Khnemu
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage names the contrast but does not describe the Ptah or Khnemu
    cosmogonies in detail.
- id: claim:2
  claim: The passage states that ideas about Rā’s relation to the dead remained substantially
    the same from earliest to latest times, despite the rise of Amen and the attempted
    dominance of Aten.
  claim_level: same_motif
  target: Egyptian solar-afterlife ideas across periods mentioned by Budge
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a broad historical statement in the source passage and is not
    substantiated here with multiple primary passages.
