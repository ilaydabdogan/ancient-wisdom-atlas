canonical_text:
  quote: ''
  summary: 'Horus presents Ani to Osiris after Ani''s heart has been weighed and found
    righteous. Ani kneels with offerings, declares his innocence, and asks to enter
    Osiris''s presence and be favored. The passage then gives a Book of the Dead speech
    for the deceased after the heart-weighing ordeal: the deceased addresses the gods
    of the Hall of the Maati goddesses, asks not to be slaughtered or accused, seeks
    vindication as true of voice, denies wrongdoing, lists righteous and charitable
    acts, asks for protection before Osiris, and invokes esoteric knowledge, visions,
    and the setting of the Balance in Aukert.'
  language: English
  quote_policy: summarized
