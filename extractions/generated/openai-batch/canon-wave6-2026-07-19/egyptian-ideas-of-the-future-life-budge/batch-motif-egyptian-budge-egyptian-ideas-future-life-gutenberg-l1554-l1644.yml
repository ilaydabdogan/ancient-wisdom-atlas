canonical_text:
  quote: ''
  summary: Budge describes the early center and later spread of Osiris worship, the
    transformation of Osiris from a risen-dead exemplar into the giver of resurrection
    and eternal life, and his identification with Ra, Khepera, and other Egyptian
    gods. The passage summarizes Book of the Dead Chapter XVII and accompanying vignettes,
    including the meeting of the souls of Ra and Osiris in Tattu, the scarab emerging
    from Osiris's buried head, and Ra as a cat cutting off a night-serpent by a Persea
    tree. Hymnic excerpts praise Osiris as eternal king, divine son, father of Horus,
    underworld guide, creator, and source of resurrection and immortality.
  language: English
  quote_policy: summarized
