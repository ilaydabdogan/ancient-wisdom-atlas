    explicitly identifying Osiris with Ra in Book of the Dead Chapter XVII and depicting
    their souls meeting and embracing in Tattu.
  claim_level: same_function
  target: Ra and Osiris in Book of the Dead Chapter XVII
  evidence_refs:
