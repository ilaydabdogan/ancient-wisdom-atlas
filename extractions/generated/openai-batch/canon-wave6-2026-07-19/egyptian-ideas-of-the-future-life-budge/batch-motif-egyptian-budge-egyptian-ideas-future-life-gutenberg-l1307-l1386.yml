canonical_text:
  quote: ''
  summary: The passage recounts Isis receiving news that the chest containing Osiris
    had been carried by water to Byblos, enclosed by a tamarisk tree, and made into
    a palace pillar. Isis goes to Byblos, enters the queen’s household as nurse, attempts
    to confer immortality on a child by placing him in fire while she laments in swallow
    form, and is interrupted by the queen. Isis reveals herself, obtains the pillar,
    retrieves the chest, treats the remaining wood as a sacred object, mourns over
    the chest, returns toward Egypt, and opens the chest to embrace her dead husband.
    The passage then gives variant accounts concerning a child associated with Isis
    and explanations of Maneros and a banquet skeleton custom.
  language: English
  quote_policy: summarized
