    my city."'
  summary: The passage explains Budge's view that Egyptian divine beings called neteru
    were understood as manifestations or attributes of a supreme divine reality symbolized
    by Rā. It discusses the coexistence of monotheistic and polytheistic elements,
    cites scholarly classifications of Egyptian religion, uses the Negative Confession
    as an example of layered belief, and contrasts this with satirical misrepresentations
    of Egyptian worship by Juvenal and George Herbert.
