canonical_text:
  quote: ''
  summary: 'The passage summarizes several Egyptian deities and mythic patterns: Temu/Atmu
    as a self-evolved creator; Shu and Tefnut as children or aspects of Temu; Shu
    as the one who raises and supports the sky; Seb as earth god, father of gods,
    and maker of a primeval egg; Nut as sky mother and nourisher associated with the
    heavenly afterlife; and Osiris as a murdered, dismembered, magically revived deity
    who becomes a model of resurrection, immortality, and judgment of the dead.'
  language: English
  quote_policy: summarized
