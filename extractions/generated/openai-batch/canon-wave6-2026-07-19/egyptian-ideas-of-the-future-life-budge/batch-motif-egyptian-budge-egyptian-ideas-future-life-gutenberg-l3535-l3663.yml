canonical_text:
  quote: ''
  summary: A deceased speaker addresses Osiris, asserts purification and right conduct,
    passes through named places and ritual questions, and seeks entry into the Hall
    of the M[=a][=a]ti goddesses. The hall’s door parts, floor, and doorkeeper challenge
    the deceased to state their names. Thoth then questions the deceased, identifies
    Osiris as the god in a fiery, serpent-walled, water-floored house, and promises
    that the deceased’s name and offerings will be brought to Osiris from the Eye
    of R[=a].
  language: English
  quote_policy: summarized
