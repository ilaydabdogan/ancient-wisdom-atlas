canonical_text:
  quote: ''
  summary: The passage presents Khepera as a primeval scarab-associated god symbolizing
    matter with the germ of life and the dead body from which a spiritual body rises.
    It then describes Rā as the ancient solar god, his daily celestial boat journey,
    his battle with the serpent Apep, and the relation of that conflict to the Horus-Set
    opposition. A quoted hymn identifies Rā’s body with multiple deities, and the
    passage concludes that Egyptian theology treated gods as aspects or forms of Rā.
  language: English
  quote_policy: summarized
