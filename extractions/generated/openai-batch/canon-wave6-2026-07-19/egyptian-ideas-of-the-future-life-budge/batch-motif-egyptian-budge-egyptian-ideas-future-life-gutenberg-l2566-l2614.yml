  summary: The passage catalogues Egyptian deities and divine forms associated with
    the sun, the sky, the dead, judgment, cardinal directions, embalming, sacred trees,
    and generative or protective powers. It identifies Horus as a hawk-symbolized
    sun god; names four spirits of Horus linked to the cardinal points and canopic
    protection; describes Anubis and Ap-uat as jackal-associated gods of the dead;
    and lists other deities including Maat, Hathor, Meh-urt, Sekhet, Bast, Neith,
    Sebak, Amsu, Baba, and Hapi.
