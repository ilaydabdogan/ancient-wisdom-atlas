canonical_text:
  quote: ''
  summary: The passage presents prayers and petitions attributed to the deceased,
    requesting heavenly, earthly, and underworld benefits; safe travel through named
    afterlife places and pylons; offerings and a homestead in the Field of Reeds;
    entry into the City of God; and admission to the Hall of Maati. It describes Maati
    as Isis and Nephthys, associates Ma'at with truth and a measuring reed, names
    a tribunal of forty-two gods who watch sinners at the reckoning of lives, and
    closes with the deceased's denial of sins, declaration of purity, reference to
    the Bennu, and claim to know the gods' names.
  language: English
  quote_policy: summarized
