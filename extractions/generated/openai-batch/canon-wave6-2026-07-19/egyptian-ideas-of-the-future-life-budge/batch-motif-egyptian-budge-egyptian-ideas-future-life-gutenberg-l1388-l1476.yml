canonical_text:
  quote: ''
  summary: 'The passage recounts a Plutarchian narrative of Isis, Osiris, Orus/Horus,
    and Typho/Set: Typho finds the chest containing Osiris, dismembers the body into
    fourteen pieces, and scatters them; Isis searches for and buries the fragments,
    consecrating an imitation phallus for the lost member. Osiris returns from the
    other world to instruct Horus, who later battles Typho. The passage also describes
    Thueris deserting Typho, a serpent slain by her soldiers, Isis releasing the captured
    Typho, Horus’s anger at Isis, divine confirmation of Horus’s legitimacy, and the
    posthumous begetting of Harpocrates. Budge then notes that many elements are supported
    by Egyptian texts and inscriptions.'
  language: English
  quote_policy: summarized
