canonical_text:
  quote: ''
  summary: The passage presents hymnic praise of Ra as he rises, travels the sky in
    solar boats, illuminates the earth, sets in the west without dying, and is born
    from his mother Nut. The scribe Ani praises Ra and asks to reach everlasting heaven,
    the mountain of favored ones, and the company of holy shining beings in the underworld.
    A closing note identifies a later short hymn as reproducing the essentials of
    longer Eighteenth Dynasty hymns.
  language: English
  quote_policy: summarized
