canonical_text:
  quote: '"I came into being in Nu. I am R[=a] who rose in the beginning."'
  summary: The passage describes how Egyptian theological systems incorporated older
    local gods, focusing on Heliopolis, where Temu/Atmu was placed at the head of
    a great company of gods and identified with R[=a] and Nu. It summarizes Book of
    the Dead material about divine self-production, the emergence of gods from Nu,
    and the treatment of solar phases as forms of one god. It also explains that divine
    companies called groups of nine could include more than nine gods because different
    forms or aspects of a deity were included by implication.
  language: English
  quote_policy: quoted
