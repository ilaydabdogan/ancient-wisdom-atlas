canonical_text:
  quote: ''
  summary: Morraha repeatedly plays cards at the seashore with the Slender Red Champion,
    first winning sheep, cattle, a castle, and a wife, then ignoring his wife's warning
    and losing a fourth game. The Red Champion lays Druid bonds on him until he brings
    the sword of light and news of Anshgayliacht's death. Morraha's wife instructs
    him to summon Brown Allree with a bridle, keep silence, and feed the mare. Brown
    Allree carries him over fire, steel thistles, and sea to the King of France, where
    royal signs on Morraha's breast lead to his reception and further counsel from
    the queen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Morraha rises, washes, prays, eats, asks God to prosper the day, and goes
    to the brink of the sea.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A short green currach comes toward Morraha with one youthful champion in it,
    playing hurly with a gold hurl and a silver ball.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The champion produces a table, two chairs, and a pack of cards from his pocket,
    and he and Morraha sit down to play cards.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Morraha wins the first three card games and claims sheep, cattle, then a castle
    and a wife.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: Morraha's wife asks how he found her, and forbids him to play again, warning
    that if he has won so much he will lose more.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Morraha goes against his wife's will, plays a fourth game of cards with the
    Red Champion, and loses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Red Champion lays Druid bonds on Morraha not to sleep two nights in one
    house or finish a second meal at one table until he brings the sword of light
    and news of Anshgayliacht's death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Morraha groans after returning home; the chair breaks, and his wife identifies
    the groan as that of a king's son under spells.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Morraha's wife tells him to shake a bridle in the window, accept whatever
    beast enters it, remain silent until the beast speaks, take three bottles of ale
    and three loaves, and follow the beast's instructions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Brown Allree puts her head in the bridle; while Morraha rides, she tries to
    make him speak, then speaks first and asks for food, which he gives her as bread
    and ale.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Brown Allree carries Morraha by leaping over three miles of fire, a hill covered
    with steel thistles, and three miles of sea, then reaches the land of the King
    of France, where bells ring when she shakes herself and neighs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: People sent by the king see stars of a king's son on Morraha's breast, carry
    him to the king, and after a night of entertainment Morraha asks the queen for
    counsel and good luck.
  category: sequence
  evidence_refs:
  - ev:8
