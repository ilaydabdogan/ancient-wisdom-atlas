canonical_text:
  quote: ''
  summary: 'The excerpt follows Jack returning to his father''s house with fine clothes
    and money, asking his father to seek the landlord''s daughter for him, and presenting
    himself as a master thief. The landlord tests him first by demanding that he steal
    a goose from the kitchen, which Jack accomplishes while disguised as a beggar
    and using hares as a distraction. After the squire''s family eats the stolen goose
    at Jack''s home, the squire sets a second test: stealing six horses guarded by
    six men. The passage ends with an old colliach admitted into the stable and sharing
    drink with the guards.'
  language: English
  quote_policy: summarized
