canonical_text:
  quote: ''
  summary: O'Cronicert breaks successive vows connected with his wife while hosting
    the King of Erin and court. After he strikes his wife, a rider on a black horse
    carries him to a palace, shows him superior wine and hospitality, identifies himself
    as the wife's brother, and warns him that a third broken vow will cost him his
    wife and possessions. O'Cronicert later keeps the guests for a dance and leaves
    his wife with Kayn Mac Loy; she transforms into a big filly, injures Kayn, breaks
    out, disappears, and carries away the Tower of Castle Town.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: O'Cronicert remembers that a vow has been broken when he reaches the place
    where he had met the deer, and he goes ahead to tell his wife the king is coming.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: O'Cronicert's wife is already preparing dinner; she says she pardons him this
    time, knows what he has done, and states that the first vow is broken.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King of Erin and his court arrive at O'Cronicert's house, where the wife
    has food and drink ready for them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: O'Cronicert becomes angry that his wife is not praising the dinner, strikes
    her in the mouth, knocks out two teeth, and calls her a deer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife says that her father's big dogs have had a better dinner than the
    one being given to the King of Erin and his court.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man riding a black horse seizes O'Cronicert by the collar, carries him behind
    him, and brings him to a large palace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the palace a stableman cleans the black horse's feet with wine, and the
    rider asks O'Cronicert to compare that wine with the wine served to Brian Boru
    and his court.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Inside the noble house, O'Cronicert is seated at the head of a table among
    gentlemen eating and drinking and again acknowledges that the wine is better.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rider says that the fist was unjust and that the wind from O'Cronicert's
    blow carried the two teeth to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rider identifies himself as O'Cronicert's brother-in-law, says his sister
    has no match among kings or knights in Erin, states that two vows are broken,
    and warns that a third broken vow will cost O'Cronicert his wife and all he possesses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rider returns O'Cronicert home, gives him the two teeth, and says no one
    has missed him because of the ongoing conviviality.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: O'Cronicert puts the two teeth back in his wife's mouth, and they are as strong
    as before; she says two vows are now broken.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the king wants to leave, O'Cronicert insists on holding a dance despite
    his wife's statement that the guests should be allowed to go.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: During the dance, the guests go outside to cool themselves; O'Cronicert leaves
    his wife and Kayn Mac Loy in the house, and this is described as breaking the
    third vow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The wife springs through a room, becomes a big filly, kicks Kayn Mac Loy and
    breaks his thigh, smashes the door, disappears, takes the Tower of Castle Town,
    and leaves Kayn in an old black house in a pool of rain-drip.
  category: action
  evidence_refs:
  - ev:8
