canonical_text:
  quote: ''
  summary: Seven McAndrew brothers take twenty-one cows to the Fair of Killalla. Their
    neighbor O'Toole, who has wanted the cattle, warns that the cows are under the
    Evil Eye and buys them cheaply as hides. The brothers spend the small proceeds
    at the fair. Later, after their father's death, Con inherits money and buys a
    gilded keg from a landlord who calls it a mare's egg. When the keg rolls into
    bushes and a hare jumps out, the brothers mistake the hare for the foal and chase
    it unsuccessfully.
  language: English
  quote_policy: summarized
