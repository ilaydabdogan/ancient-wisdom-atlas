canonical_text:
  quote: ''
  summary: Oifa sends away the children of Lir under a curse. After she gives a false
    account at Dearg's hall, Lir learns that his children are missing and finds swans
    with human voices at the Lake of the Red Eye. Fingula identifies the swans as
    Lir's children and states the condition for release. Dearg punishes Oifa by transforming
    her into an air-demon. The swan-children leave the lake for the Moyle, suffer
    storm and separation, reunite at the place of the seals, and later receive news
    from Dearg's sons.
  language: English
  quote_policy: summarized
