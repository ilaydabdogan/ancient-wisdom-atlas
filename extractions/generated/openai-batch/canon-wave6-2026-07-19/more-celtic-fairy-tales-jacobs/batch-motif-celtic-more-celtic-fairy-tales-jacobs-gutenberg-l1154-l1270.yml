canonical_text:
  quote: ''
  summary: Rhiannon tells Powel that she is being pressed toward an unwanted marriage
    and asks him to pledge to meet her in a year at her father's palace. Powel comes
    with knights to a prepared feast, where Gwawl enters as a suitor and secures from
    Powel a broad promise of a boon, then asks for Rhiannon and the banquet. Rhiannon
    identifies Gwawl as the unwanted suitor and instructs Powel in a counter-plan
    involving a small bag, a future feast, disguise, hidden knights, and a horn signal.
    Powel and Rhiannon then answer Gwawl by limiting what can be given immediately
    and postponing the marriage feast for a year.
  language: English
  quote_policy: summarized
