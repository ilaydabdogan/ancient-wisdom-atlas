canonical_text:
  quote: '"Jack must be our chief."'
  summary: Jack proves superiority among thieves by stealing a goat, a wether, and
    a bullock from the same farmer without violence, using placed brogues, a hanging-corpse
    deception, and imitated animal cries. The thieves make him chief and reveal caves
    containing money and disguises. Later, while they are away, Jack traps the housekeeper
    in the treasure cave, takes money and fine clothes, and drives the stolen animals
    back to the farmer and Joan, who recognize them.
  language: English
  quote_policy: quoted
