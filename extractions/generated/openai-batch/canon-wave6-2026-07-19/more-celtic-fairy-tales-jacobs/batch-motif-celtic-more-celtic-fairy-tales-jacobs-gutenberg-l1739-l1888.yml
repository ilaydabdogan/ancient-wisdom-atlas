canonical_text:
  quote: The green hill opened, and the pair went into a fine chamber.
  summary: Paddy buys a house and land after being warned that the house has a ghost.
    In the cellar he meets a little man, later named Donal the piper, who asks him
    to keep a secret, gives him wine from a barrel, plays music, and promises access
    to drink and riches. Donal takes Paddy by night on a broom to fairy hills and
    fairy courts, where fairy rulers and hosts prepare for a hurling match that requires
    live human companions.
  language: English
  quote_policy: quoted
