candidate_motifs:
- id: motif:1
  label: Royal bride won by heroic prowess
  taxonomy_refs: []
  basis: The battle is explicitly for the daughter of the King of the Great Universe,
    and the man who wins her by heroism is to marry her; the narrator claims her after
    leaping to her and defeating warriors.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage frames the marriage claim through martial prowess rather than
    a formal contest with stated rules beyond heroism.
- id: motif:2
  label: Superhuman ascent to an elevated woman
  taxonomy_refs:
  - ascent
  basis: The woman is on the top of a castle, and the narrator reaches her by springing
    on the end of his spear and on his tiptoes.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The ascent is a physical leap to a castle-top, not explicitly a cosmic
    or spiritual ascent.
- id: motif:3
  label: Betraying companion attempts to claim the won bride
  taxonomy_refs: []
  basis: After the narrator brings the woman to the ship and returns to fight, the
    King of the Red Shield prepares to sail home with her and says the narrator should
    go home with his mother and sister.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The king denies this at first by claiming he was only preparing the ship,
    so the betrayal is inferred from his later statement within the same exchange.
- id: motif:4
  label: Invulnerable protective object neutralized before use
  taxonomy_refs: []
  basis: The red shield would prevent weapons from making an impression if put on,
    but the narrator strikes the King of the Red Shield before he can put it on.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not call the shield magical, only describes its protective
    effect.
- id: motif:5
  label: Flight by sea under pursuit and concealment by mist
  taxonomy_refs:
  - departure
  basis: The narrator is pursued by many ships after hostile forces seek compensation;
    he flees over the ocean and escapes when a thick dark mist causes the pursuers
    to lose sight of him.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The taxonomy reference to departure is broad; the passage emphasizes pursuit
    and escape rather than a ritual departure.
- id: motif:6
  label: Island refuge after flight
  taxonomy_refs: []
  basis: After escaping pursuit, the narrator reaches an island called the Wet Mantle,
    builds a hut, and remains there with his family for a long time.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The refuge is temporary, since a later opponent reaches the island.
- id: motif:7
  label: Stolen beloved after hero is immobilized
  taxonomy_refs:
  - stolen_beloved
  basis: A big man traps the narrator in a bog up to the armpits and carries away
    the daughter of the King of the Universe while the narrator cannot stop him.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The abducted woman is the narrator's wife at this point in the tale; the
    continuation of the recovery is outside the supplied passage.
- id: motif:8
  label: Children aid trapped father with weapon
  taxonomy_refs: []
  basis: The narrator's boys bring him the short spear, and he uses it to cut the
    ground around himself until he escapes the bog.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not specify which son or whether both sons act equally,
    only that the boys bring the spear.
