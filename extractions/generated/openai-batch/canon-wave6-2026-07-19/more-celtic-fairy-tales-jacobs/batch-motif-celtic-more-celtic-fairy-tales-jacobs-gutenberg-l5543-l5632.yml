canonical_text:
  quote: ''
  summary: A first-person storyteller recounts sailing past a battle being fought
    for the daughter of the King of the Great Universe, leaping to a castle-top to
    seize her, defeating warriors, and killing the King of the Red Shield when he
    attempts to take her. In the frame, Kayn refuses healing until the tale continues.
    The storyteller then says he married the woman, fled pursuing forces by ship through
    mist to the island called the Wet Mantle, had two sons, and was later trapped
    in a bog by a large man who carried off his wife; his sons brought him his spear
    so he could cut himself free.
  language: English
  quote_policy: summarized
