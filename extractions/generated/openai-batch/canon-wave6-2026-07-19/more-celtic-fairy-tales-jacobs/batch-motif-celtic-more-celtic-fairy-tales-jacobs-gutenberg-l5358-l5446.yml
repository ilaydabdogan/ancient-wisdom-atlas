canonical_text:
  quote: ''
  summary: At daybreak O'Cronicert's former splendor has vanished, and Murdoch Mac
    Brian returns for his injured foster-brother Kayn Mac Loy. Kayn is sent to the
    Isle of Innisturk to find a healing herb but remains uncured and destitute. A
    giant-like man, later identified as Machkan-an-Athar, offers to heal Kayn with
    salve, but Kayn demands to know why Machkan has no church in Lochlann. Machkan
    tells how seven masons built a church in one day under a bargain involving his
    mother and sister; when the women entered, the doors shut and the church rose
    into the sky as a tuft of mist. Kayn then asks what became of them, and Machkan
    says he had resolved to destroy the world until he found them, but his brother
    advised him first to seek them, then demand them peaceably, and fight if necessary.
  language: English
  quote_policy: summarized
