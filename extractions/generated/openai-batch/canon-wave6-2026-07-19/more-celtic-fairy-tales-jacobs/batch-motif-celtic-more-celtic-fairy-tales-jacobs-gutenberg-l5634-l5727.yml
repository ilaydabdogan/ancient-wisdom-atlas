canonical_text:
  quote: ''
  summary: A first-person storyteller recounts waiting in the Wet Mantle with two
    sons, setting out by ship, joining the weaker side in battle, being taken with
    corpses by a one-eyed giant to a cave, and escaping with a stolen king's daughter
    by blinding the giant with a heated bar. He marries the damsel, has a son, leaves
    a named gold ring for the child, and later recognizes a strong champion who arrives
    by ship as his son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person narrator remains in the Wet Mantle until his two sons are
    grown; the sons ask about seeking their mother, and each person takes a separate
    ship and goes his own way.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says he is under vows never to pass a battle without helping
    the weaker side, goes ashore, fights with a short spear, and sleeps among the
    bodies afterward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A speaker asks Kayn to stretch out his leg so that a salve, binding herb,
    and poultice can be applied, while also saying he must hear Mass in Rome and be
    in Norway before sleeping.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kayn Mac Loy refuses to stretch out his foot until he is told whether the
    speaker found the daughter of the King of the Universe, went home, or what happened.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The big man says the requested tale is long and instead begins a shorter tale
    from the point at which he awoke after the battle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A one-eyed giant drags a ship through water that reaches only to his knees
    and uses a fishing rod, line, and hook to load bodies onto the ship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The giant hooks the narrator's clothes but cannot lift him with the rod, so
    he comes ashore and carries him onto the ship in his arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The giant reaches a precipitous rock with a large cave, where a beautiful
    damsel stands at the cave door and receives the bodies from him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The damsel asks each body whether it is alive, and the giant orders her to
    keep the narrator apart for a future breakfast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The damsel says she is a king's daughter stolen by the giant, has been with
    him seven years except two days, and is separated from him by a drawn sword until
    the seven years expire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The damsel proposes that the narrator heat the giant's roasting bar in the
    embers until red and thrust it into the giant's eye while avoiding capture.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The narrator heats the bar, thrusts it into the giant's eye, throws a stone
    into the sea to mislead him, and the giant dies when the bar strikes the cave
    doorpost and knocks off his brain-cap.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The narrator and the damsel spend seven years and seven days throwing the
    giant into the sea in pieces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The narrator weds the damsel, they have a boy, and after seven years the narrator
    starts out again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The narrator gives the damsel a gold ring with his name on it for the boy,
    and the boy is later sent out to seek him.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: The narrator returns to the battlefield, finds the short spear and his ship,
