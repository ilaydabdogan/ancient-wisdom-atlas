canonical_text:
  quote: '"I am your mother; your sisters killed me and destroyed my body"'
  summary: 'The passage first concludes a fox tale: a fox tricks a speaking little
    bonnach into entering its mouth, eats it and a duck, then is shot by a hunter
    after joking about a bullet. The passage then begins the tale of Smallhead: two
    half-sisters hate Smallhead, kill their mother, threaten Smallhead with a needle-gathering
    task, and a short grey cat who identifies herself as the murdered mother helps
    Smallhead and counsels mercy. Smallhead later follows the sisters to the house
    of a dangerous enchantress and asks lodging.'
  language: English
  quote_policy: quoted
