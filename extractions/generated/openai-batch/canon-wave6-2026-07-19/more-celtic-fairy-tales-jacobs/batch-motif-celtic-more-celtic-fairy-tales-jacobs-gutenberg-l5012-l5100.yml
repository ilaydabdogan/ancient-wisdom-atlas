  text: Elidore spends a long time waiting on the king's son and joining in the games
    and sports of the little men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The little men are small but proportionate, have fair hair on their shoulders,
    ride small horses, and live on milk flavored with saffron rather than meat, fowl,
