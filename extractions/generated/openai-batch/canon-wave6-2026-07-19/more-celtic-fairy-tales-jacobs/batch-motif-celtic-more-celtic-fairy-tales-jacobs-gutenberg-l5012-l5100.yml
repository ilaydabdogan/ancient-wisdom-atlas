canonical_text:
  quote: ''
  summary: A boy named Elidore flees harsh monastic schooling, enters a cave-side
    underground passage into a sunless country of little truthful people, serves their
    king's son, visits his mother, steals a yellow ball at her request, loses access
    to the country, later becomes a monk, and reports words that a bishop interprets
    as Greek and as evidence of Trojan descent for the Britons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is set in the days of Henry Beauclerc of England, and Elidore is
    a widow's son being raised to become a cleric.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elidore is slow at learning letters in the monks' Scriptorium and forgets
    letters as he learns others.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The monks use the rod to punish Elidore when he forgets letters, and the beatings
    become more frequent and severe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At twelve years old Elidore runs away into the forest near St. David's and
    wanders for two days and two nights eating hips and haws.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Elidore reaches the mouth of a cave beside a river, becomes exhausted, and
    is approached by two small figures who invite him to a land of games and sports.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Elidore follows the two figures through a dark underground passage into a
    beautiful country with rivers, meadows, woods, and plains, where the sun, moon,
    and stars are not seen.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king of the little men questions Elidore and appoints him to attend the
    king's son.
  category: action
  evidence_refs:
  - ev:4
