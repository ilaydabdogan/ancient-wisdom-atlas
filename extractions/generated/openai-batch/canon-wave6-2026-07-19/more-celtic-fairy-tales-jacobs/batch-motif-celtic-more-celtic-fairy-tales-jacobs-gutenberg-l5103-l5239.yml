canonical_text:
  quote: "“In a moment the deer started up as a woman behind O'Cronicert”"
  summary: 'A huge beggarly brotherhood consumes O''Cronicert''s resources. O''Cronicert
    petitions King Brian Boru and the royal household, receives cattle and a lap-dog,
    and travels home. The lap-dog chases a roebuck, which appears as a beautiful woman.
    She agrees to marry O''Cronicert if he keeps three vows: not to invite his worldly
    king without telling her, not to reproach her for being found as a deer, and not
    to leave her alone with one man. After their return, his ruined house becomes
    a palace and he gains wealth, livestock, and gold and silver through his wife.
    He later goes to invite the King of Erin to dinner without telling his wife, breaking
    the first vow.'
  language: English
  quote_policy: quoted
