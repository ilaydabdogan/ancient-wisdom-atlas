canonical_text:
  quote: Whoever had killed a person could not cross the bridge.
  summary: Smallhead saves herself and her two sisters from an old hag by shifting
    ribbon markers and causing the hag's son to kill the hag's daughters instead.
    The sisters flee to the Bridge of Blood, where killers cannot cross; Smallhead
    crosses and carries her sisters over while the hag is stopped. At a king's castle,
    Smallhead becomes a kitchen-maid and learns from a king's son that he cannot marry
    until the Sword of Light is obtained from the same hag beyond the bridge. Smallhead
    bargains to fetch it if he marries her elder sister, then returns to the hag's
    house and sabotages the hag's stirabout with salt, prompting the hag to demand
    water from the well.
  language: English
  quote_policy: quoted
