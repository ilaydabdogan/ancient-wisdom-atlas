canonical_text:
  quote: ''
  summary: A young man tells a princess he is compelled to give her to the King of
    Moroco but vows to free her. After her farewell kiss awakens her father and the
    guards, her father sets the young man an impossible clay-removal task. A fox aids
    him, the clay vanishes overnight, and the fox later transports the young man and
    princess. The young man delivers the princess, then escapes with her and a bay
    filly. He next secures a golden bird, golden cage, and golden apples from the
    King of Spain and again rides away with the filly.
  language: English
  quote_policy: summarized
