canonical_text:
  quote: ''
  summary: Smallhead obtains the Sword of Light by waiting at the well when the hag's
    son uses it as a light, then uses it to secure her sister's marriage to a King's
    son. She next learns that the King's second son cannot marry until he has the
    shining Black Book, which is held by the hag beyond the Bridge of Blood. Smallhead
    spoils the hag's food with soot so that the son must fetch water while carrying
    the book as a light; she snatches the book at the well and pushes him in. The
    hag kills her son in rage, pursues Smallhead, curses her from across the bridge,
    and then offers to withdraw the curse if Smallhead will care for her. Smallhead
    later offers the Black Book in exchange for the second sister's marriage.
  language: English
  quote_policy: summarized
