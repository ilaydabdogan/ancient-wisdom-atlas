canonical_text:
  quote: ''
  summary: A first-person speaker, in human form, brings a child by ship, reaches
    a deserted island with a gloomy castle, deceives an old hag and her wounded one-eyed
    son by posing as a doctor, blinds the son with a heated iron bar, and escapes
    with the child and eleven stolen royal children. The speaker restores the children
    to their aged parents, and the king grants the last child to the speaker. A separate
    sword episode states that an equivocal promise allows a sword of light to be thrown
    into the air and return to Blue Niall. The passage then begins another tale about
    rich McAndrew of County Mayo and his seven foolish sons.
  language: English
  quote_policy: summarized
