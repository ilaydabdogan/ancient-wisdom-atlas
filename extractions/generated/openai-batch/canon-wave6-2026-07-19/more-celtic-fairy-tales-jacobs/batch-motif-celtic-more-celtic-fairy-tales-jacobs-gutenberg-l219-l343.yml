canonical_text:
  quote: ''
  summary: The passage includes table-of-contents and illustration-list material,
    then begins the tale of the Children of Lir. The five kings of Ireland choose
    Dearg as head king instead of Lir. Dearg seeks peace by offering Lir one of three
    foster-daughters as wife. Lir marries Ove, who bears four children and dies. Lir
    then marries Oifa, Ove's sister. Oifa becomes jealous of Lir's love for the children,
    takes them to a lake, fails to have them killed by attendants, and uses a Druid's
    wand to transform them into four white swans. Fingula accuses Oifa and asks for
    an end to the enchantment. Oifa declares that the children will remain swans until
    a future northern man and southern woman marry, and that they will wander Ireland's
    waters for nine hundred years while retaining speech and unmatched music.
  language: English
  quote_policy: summarized
