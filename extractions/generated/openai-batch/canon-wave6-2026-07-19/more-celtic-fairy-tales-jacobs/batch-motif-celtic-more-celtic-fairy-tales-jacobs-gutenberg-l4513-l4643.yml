canonical_text:
  quote: ''
  summary: Smallhead enters service with a hag who keeps a seven-year-old pig for
    a future feast. By striking the pig with a rod, Smallhead discovers he is an enchanted
    king's son stolen by the hag. She restores him, steals the hag's magic book, turns
    herself and the king's son into doves, and flees. The hag's sister pursues in
    hawk form. Smallhead and the king's son evade her first as doves and then as self-sweeping
    heather brooms, while villagers obstruct the pursuer and interpret the brooms
    as a heavenly blessing.
  language: English
  quote_policy: summarized
