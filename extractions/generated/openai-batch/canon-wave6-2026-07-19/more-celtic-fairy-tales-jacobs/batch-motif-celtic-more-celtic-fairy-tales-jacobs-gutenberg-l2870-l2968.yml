canonical_text:
  quote: He struck me a light blow, and so I came back to my own shape again.
  summary: A dog-like narrator guarding a child cuts off an attacking hand, later
    tracks the hidden child by blood, loses the child again, returns home, is recognized
    by the child, and regains human shape after the child strikes him with a rod.
  language: English
  quote_policy: quoted
