canonical_text:
  quote: ''
  summary: Paddy enters an open house during a storm and steals guineas gathered by
    a weasel at the hearth. The weasel pursues him, attacks his horse, and later kills
    his livestock. Paddy's dog tracks the weasel to a hut by a lake, where an old
    hag named Mary Kerwan is found. She claims the gold, says she has suffered for
    five hundred years because of a crime, and offers hidden treasure if Paddy pays
    for masses, keeps secrecy, buys the haunted house, and burns her hut after her
    death. Paddy retrieves a pot of gold from beneath a bush by a well; a black dog
    emerges from it.
  language: English
  quote_policy: summarized
