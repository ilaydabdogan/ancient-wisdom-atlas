canonical_text:
  quote: ''
  summary: The passage closes a tale in which Smallhead uses an enchanted display
    with a hen and cock to remind the King of Munster's son of earlier transformations,
    a promise, and his forgotten wife; he recognizes her and marries her. It then
    begins “The Legend of Knockgrafton,” introducing Lusmore, a poor hunchbacked plaiter
    associated with herbs, charms, and a foxglove sprig, who hears fairy music at
    the old moat of Knockgrafton, adds words to the repeated song, and is brought
    among the fairies and honored for his musical skill.
  language: English
  quote_policy: summarized
