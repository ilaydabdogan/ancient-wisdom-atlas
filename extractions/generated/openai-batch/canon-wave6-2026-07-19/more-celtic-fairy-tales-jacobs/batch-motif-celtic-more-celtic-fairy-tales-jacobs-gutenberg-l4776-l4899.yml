candidate_motifs:
- id: motif:1
  label: magical recognition of a forgotten spouse
  taxonomy_refs:
  - stolen_beloved
  basis: Smallhead uses an enchanted display to make the prince remember their prior
    bond after he has forgotten her and is about to marry another woman.
  evidence_refs:
