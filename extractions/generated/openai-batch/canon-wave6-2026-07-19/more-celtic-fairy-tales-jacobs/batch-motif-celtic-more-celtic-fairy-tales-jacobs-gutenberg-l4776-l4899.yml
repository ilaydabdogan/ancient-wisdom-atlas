  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage states forgetting and a rival marriage arrangement, but does
    not describe Smallhead as literally stolen in this excerpt.
- id: motif:2
  label: transformations into animals and objects during escape or enchantment
  taxonomy_refs:
  - shapeshifter
  basis: The hen recalls the prince as a pig restored to human form, the pair as doves,
    and the pair as heather brooms.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The transformations are recounted retrospectively rather than narrated
    directly in this passage.
- id: motif:3
