canonical_text:
  quote: ''
  summary: Fin and Bran defeat a sequence of large adversaries threatening a king,
    using Bran's venomous shoe and Fin's beheading of the defeated enemies. After
    the Big Hag is killed, the king says that peace is restored and recognizes that
    Fin fulfills a prophecy. The king explains that three men gained great fighting
    power from fairy-given shirts, which they remove at night. Fin departs by coracle,
    recruits a soothsayer, a thief, and a climber, and uses their skills to locate
    and steal the shirts while the three Big Men sleep.
  language: English
  quote_policy: summarized
