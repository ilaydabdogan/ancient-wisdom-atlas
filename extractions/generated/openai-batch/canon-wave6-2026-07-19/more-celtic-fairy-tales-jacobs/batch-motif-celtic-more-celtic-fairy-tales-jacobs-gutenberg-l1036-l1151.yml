canonical_text:
  quote: ''
  summary: Powel, Prince of Dyfed, sits on the mound of Gorseth Arberth after being
    told that anyone who sits there must either suffer blows or wounds or see a wonder.
    A beautiful maiden on a large white horse, wearing shining gold, appears on the
    road. Repeated attempts by Powel's men to overtake her fail, though she seems
    to keep a slow pace. On the third day Powel pursues her himself; when he asks
    her to stop, she does so, unveils her face, and says her chief quest was to seek
    him.
  language: English
  quote_policy: summarized
