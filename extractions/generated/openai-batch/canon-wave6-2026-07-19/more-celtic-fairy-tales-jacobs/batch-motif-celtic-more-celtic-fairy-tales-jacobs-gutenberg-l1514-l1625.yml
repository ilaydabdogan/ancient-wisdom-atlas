canonical_text:
  quote: ''
  summary: Teirnyon hears of Rhiannon’s punishment, recognizes the boy he has raised
    as resembling Powel, and decides with his wife to return the child. He travels
    with the boy to Narberth, where Rhiannon is performing penance by the horse-block.
    At a feast, Teirnyon publicly declares the boy to be Rhiannon and Powel’s son;
    the company agrees, Rhiannon’s trouble ends, and the boy is named Pryderi. Powel
    promises support to Teirnyon, arranges further fosterage with Pendaran Dyfed,
    and Pryderi grows into an accomplished youth before Powel dies. The passage then
    begins a new tale about Paddy O’Kelly setting out by moonlight to sell an ass
    at a fair.
  language: English
  quote_policy: summarized
