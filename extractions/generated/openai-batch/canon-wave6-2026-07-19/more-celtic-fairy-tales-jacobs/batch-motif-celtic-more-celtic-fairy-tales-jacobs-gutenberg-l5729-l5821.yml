canonical_text:
  quote: ''
  summary: 'A narrator is joined by sons arriving by ship while all are seeking the
    daughter of the King of the Universe. One son proves his identity by a ring bearing
    the narrator''s name. A soothsayer tells them the woman is with the Son of the
    Blackbird. The heroes challenge and kill successive groups of warriors; the narrator
    kills the Son of the Blackbird and takes the woman from the castle. The passage
    then turns to Kayn Mac Loy, whose leg is healed with herbs by a big man, who returns
    him from an island to shore. A new tale begins: Fin and his men secretly observe
    three men arrive by boat from the west, magically create a house from pebbles,
    slate, and shavings, announce that the King of the Big Men sent them to challenge
    the Fians, and are bound by Fin under crosses and enchantments until he returns.'
  language: English
  quote_policy: summarized
