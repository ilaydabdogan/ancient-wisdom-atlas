canonical_text:
  quote: ''
  summary: A first-person narrator says his mother taught him the language of birds.
    After he hears birds reveal a tree bearing three magic rods, his wife makes him
    cut one, then uses it to transform him successively into a raven, horse, fox,
    and wolf. In wolf form he is hunted, appeals to a king, and is sheltered at court,
    where he shows human manners. The king, whose previous children were stolen at
    birth, sets the animal to watch a newly born twelfth child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says his mother taught him the language of birds, and that he
    listened to birds after marriage and laughed at their conversation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two birds compare their trees; one says that three rods of magic mastery grow
    on its tree.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the narrator tells his wife what the birds said, she arranges an early
    walk to the tree and demands that he cut a rod for her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator cuts the rod; his wife strikes a stone and changes it, then strikes
    him and makes him a black raven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: As a raven, the narrator is endangered by a proclamation rewarding raven-killing
    and hides in a parlour chimney for about a month.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wife later strikes the narrator with the rod, makes him an old white horse,
    and has him put to cart work drawing stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife spreads a report that the narrator died, prepares a coffin and burial,
    and later changes him from horse to fox after he damages property and attacks
    people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: As a fox, the narrator hides in a badger hole and kills geese and ducks; the
    wife then makes him a wolf.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: As a wolf, the narrator flees to an island, kills sheep at times, is seen
    by a shepherd, and is pursued by dogs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the pursuit, the narrator recognizes the king’s sign, leaps onto the
    front of the king’s saddle, and the king orders the hounds stopped.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the king’s home, the animal refuses food until given a knife and fork,
    uses them with his paws, bows to the king, drinks wine, and thanks him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The king has had eight sons and three daughters stolen on the night each was
    born despite guards, and he assigns the newly born twelfth child to the animal’s
    care.
  category: sequence
  evidence_refs:
