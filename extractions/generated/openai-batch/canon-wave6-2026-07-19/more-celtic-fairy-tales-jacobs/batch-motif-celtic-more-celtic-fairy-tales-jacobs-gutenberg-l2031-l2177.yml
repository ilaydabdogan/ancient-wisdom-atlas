  quote: '"There is a snow mountain and an ice mountain and a mountain of fire"'
  summary: In the Realm Underwaves, Prince Underwaves repeatedly commands the rider
    of the black horse to complete tasks before dawn so that the prince may marry
    the Greek princess. With the speaking black horse's help, the rider retrieves
    a silver cup from Greece, crosses snow, ice, and fire mountains to obtain an ancestral
    silver ring from a fiery loch, and has a superior castle and well made. The princess
    continues to delay the wedding by pointing out further requirements or faults.
