canonical_text:
  quote: ''
  summary: The passage closes one tale with escape, the disenchantment of a fox into
    a bewitched prince, marriages, and treasure rewards. It then begins “The Russet
    Dog,” a series of fox anecdotes in which the fox removes fleas with wool and water,
    catches ducks with heather camouflage, encounters bagpipes, tricks wrens, escapes
    a hunter by setting fires, and is finally outwitted by a cock. The passage ends
    by introducing a further story about Master Wolf losing his tail through the fox.
  language: English
