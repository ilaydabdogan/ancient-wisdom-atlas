canonical_text:
  quote: ''
  summary: Fin sails by coracle to the Kingdom of the Big Men, is taken to the king
    as a dwarf with Bran as a lapdog, observes the king’s nightly absence, learns
    that a Monster demands the king’s daughter and half the kingdom, and twice substitutes
    for the king by deceiving the Monster before announcing combat on the third night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fin readies a coracle, sails over the sea, and reaches the Kingdom of the
    Big Men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Big Wayfarer identifies himself as the Red-haired Coward of the King of
    the Big Men and says Fin is sought as a dwarf for the King, while Bran is to be
    a lapdog.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another Big Man tries to take Fin; the two Big Men fight and leave the choice
    to Fin, who chooses the first one.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fin is taken to the King’s palace, where nobles assemble to see him; the King
    carries Fin and Bran on his palms and gives Fin a sleeping place at the end of
    the King’s bed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fin watches the household and observes that the King goes out at night and
    does not return until morning, leaving the Queen by herself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The King tells Fin that a great Monster wants the King’s daughter in marriage
    and half the kingdom, and that the King must fight him every night because no
    other man will do it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fin asks to go in the King’s place for the night and tells the King to rest.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: At the combat place, Fin sees the sea approach in fire imagery and as a darting
    serpent before a Huge Monster appears and calls him a little speck.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fin presents himself as a messenger and falsely says the Queen has died; the
    Monster agrees to go home that night.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the morning, the King fears his kingdom is lost and that his dwarf and
    lapdog are killed, but Fin is alive and says he is quick and active.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the next night Fin again goes in the King’s place, describes a funeral
    and the King’s death, and the Monster again goes away.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The King rejoices that Fin and Bran are alive and that he has rested.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: On the third night Fin returns to the place, the Big Monster appears, and
    Fin says he has come to combat him.
  category: speech
  evidence_refs:
