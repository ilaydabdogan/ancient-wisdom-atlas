canonical_text:
  quote: ''
  summary: The passage recounts that fairies remove Lusmore's hump and give him new
    clothes after he has pleased them with their tune. News spreads, and an old woman
    seeks the same remedy for Jack Madden, another humped man. Jack is brought to
    Knockgrafton, interrupts the fairy song at the wrong time with an added phrase,
    and is punished when the fairies place Lusmore's former hump on his back in addition
    to his own. He is found half dead and later dies after cursing anyone who listens
    to fairy tunes.
  language: English
