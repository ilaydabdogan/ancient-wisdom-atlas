canonical_text:
  quote: ''
  summary: The passage first recounts how the McAndrews are progressively cheated
    out of money, livestock, land, and finally their house and garden through foolish
    bargains and neighbors' greed. It then begins a new tale in which a bereaved Farmer
    of Liddesdale, lacking a ploughman, resolves to hire the first man who comes by
    and agrees to pay a newly arrived ploughman as much dry corn as he can carry in
    one burden-withe.
