canonical_text:
  quote: ''
  summary: The passage closes a tale in which Paddy O'Kelly aids the fairy host of
    Connacht, receives supernatural rewards, burns a dead hag's hut at the little
    man's instruction, and becomes wealthy. It then begins “The Black Horse,” where
    a youngest king's son receives a poor garron, exchanges it for a magical black
    horse, travels to the Realm Underwaves, is compelled to fetch the daughter of
    the King of the Greeks, carries her away on the horse, and hears her postpone
    marriage until a hereditary silver wedding cup is obtained.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two hosts take sides for hurling, then fight; Paddy O'Kelly helps the fairy
    host of Connacht, overturns the Stongirya, and the host of Connacht defeats the
    other host.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The host of Munster changes into flying beetles and eats green things; thousands
    of doves come from a hole and swallow the beetles, and the hole is called Pull-na-gullam,
    the dove's hole.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the battle, King Finvara gives Paddy O'Kelly a purse of gold, and the
    little piper brings Paddy home and puts him in bed beside his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A little man tells Paddy that his mother is dead and instructs him to burn
    the house over her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Paddy finds the hag dead, burns the hut with a coal, and reports this to the
    little man.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The little man gives Paddy a purse that will never be empty while Paddy is
    alive, tells him to remember the weasel as the beginning and prime cause of his
    riches, and then leaves permanently.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Paddy O'Kelly and his wife live for years in a large house, and Paddy dies
    leaving wealth and a large family.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In “The Black Horse,” a dead king's youngest son receives only an old white
    limping garron as his share.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The youngest king's son exchanges the limping white garron for a black horse
    after being told that the black horse can carry him to any place he thinks of.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: When the king's son mounts and thinks of the Realm Underwaves, the black horse
    takes him there before the next sunrise.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the Realm Underwaves, a court is gathered to see who will seek the daughter
    of the King of the Greeks to be the wife of the son of the King Underwaves.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: Prince Underwaves lays the rider of the black horse under crosses and spells
    to bring the Greek king's daughter before sunrise.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The black horse speaks to the king's son, recognizes his distress under spells,
