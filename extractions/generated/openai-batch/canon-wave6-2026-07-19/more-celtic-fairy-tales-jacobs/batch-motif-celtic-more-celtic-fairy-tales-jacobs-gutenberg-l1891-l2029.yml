  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: 'The black horse gives instructions: near the Greek town the princess will
    desire a ride, and the rider should say no man except himself may ride before
    a woman on that horse.'
  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: The princess sees the horse and asks for a ride; her own horseman tries to
    mount but the horse kicks him off.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The king's son mounts in front of the princess, she rides behind him, and
