- id: obs:3
  text: The women plot together and accuse Rhiannon of murdering her child before
    their eyes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Rhiannon denies the charge, appeals to divine knowledge, and urges the women
    to tell the truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nobles ask Powel to put away Rhiannon, but Powel says they have no cause to
    ask this of him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rhiannon accepts a penance requiring her to remain at the palace of Narberth
