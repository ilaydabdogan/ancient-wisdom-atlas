canonical_text:
  quote: ''
  summary: After Rhiannon's son is born, the women watching him sleep and later accuse
    Rhiannon of killing the vanished child. Powel refuses to put Rhiannon away, and
    she accepts a seven-year public penance at Narberth. Elsewhere, Teirnyon watches
    his mare on the first of May, cuts off a clawed arm that tries to seize the newborn
    colt, and finds an infant boy at his door. The boy is wrapped in satin, named
    Goldenlocks, grows with unusual speed, and later receives the colt saved that
    night.
  language: English
  quote_policy: summarized
