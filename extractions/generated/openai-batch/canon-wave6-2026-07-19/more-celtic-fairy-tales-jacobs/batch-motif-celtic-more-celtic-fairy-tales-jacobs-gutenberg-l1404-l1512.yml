    and offer to carry guests on her back into the palace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Teirnyon Twryv Vliant is lord of Gwent Is Coed and owns an exceptionally beautiful
    mare whose colts vanish every first of May after foaling.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Teirnyon arms himself and keeps watch on the first of May night to learn what
    takes the colts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A claw comes through the window, seizes the colt by the mane, and Teirnyon
