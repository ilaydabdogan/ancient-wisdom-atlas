  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Teirnyon hears tumult and wailing, follows the noise in darkness, then returns
    after remembering that he left the door open.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the door Teirnyon finds an infant boy in swaddling clothes and a satin
    mantle; the boy is very strong for his age.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Teirnyon's wife takes the satin mantle as evidence that the boy is of gentle
