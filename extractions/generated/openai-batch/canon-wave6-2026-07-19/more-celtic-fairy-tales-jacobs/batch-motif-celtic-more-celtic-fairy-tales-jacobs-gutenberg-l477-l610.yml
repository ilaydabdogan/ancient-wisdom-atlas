canonical_text:
  quote: ''
  summary: 'The passage concludes the tale of the children of Lir: they lament their
    bird-form suffering, return to a desolate ancestral place, settle near Glory Isle,
    hear Mac Howg''s bell, are taken under the saint''s care, are sought by Lairgnen
    and Deoch, lose their feathered form when seized from the altar, receive baptism,
    die, and are buried. The passage then begins “Jack the Cunning Thief,” introducing
    Jack as a poor farmer’s youngest son who sets out from a crossroads, insists on
    shelter in a dangerous house, and claims to the six household owners that he is
    Master Thief.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lay describes the children of Lir as having feathers for bed-clothes and
    white sand and bitter brine for food and wine, with Fingula sheltering her brothers
    under her wings or breast.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sons of Dearg the king go to the Hall of Lir and tell Lir about the condition
    of his children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The children of Lir fly through the Moyle to the Bay of Erris and then to
    the Hill of the White Field, where they find unroofed raths, nettles, and no house,
    fire, or dwelling-place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fingula laments that her father’s place is forlorn, that its lord lives no
    more, and that no one in the place of their birth knows them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The children of Lir fly to the Glory Isle of Brandan and settle on the Lake
    of the Birds until the coming of holy Patrick to Erin and holy Mac Howg to Glory
    Isle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: On Mac Howg’s first night on the island, the children hear his bell for matins
    and are frightened; Fingula tells her brothers to listen to the cleric’s bell
    and says he will free them from pain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mac Howg asks whether they are the children of Lir, says he has come for their
    sakes, calls them to land, and places bright white silver chains between Aod and
    Fingula and between Conn and Fiachra.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Deoch hears of the birds and says she will not wed Lairgnen until she has
    them; Lairgnen sends to Mac Howg for them, but the saint refuses.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Lairgnen lays hands on the birds at the altar; their feathery coats fall off,
    the three sons become withered bony old men, and Fingula becomes a lean withered
    old woman.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Fingula asks the cleric to baptise them and describes how they should be placed
    in the grave; afterward the children are baptised, die, and are buried with a
    cairn and runic names.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the following tale opening, a poor farmer has three sons who go to seek
    their fortune; Jack, the youngest, is fond of snares, tracking, and tricks, and
    takes the lonesomest road after the brothers part at cross-roads.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: On a rainy night Jack comes to a lonesome house, asks a blear-eyed old woman
    by the fire for supper and a bed, and stays despite her warning about six owners
    who might skin him alive.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: After receiving supper and lodging, Jack warns the old woman not to let the
    six men disturb him; in the morning six ugly-looking men stand around his bed.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: When the chief asks who he is and what his business is, Jack says his name
    is Master Thief and that he is looking for apprentices and workmen.
  category: speech
  evidence_refs:
  - ev:14
