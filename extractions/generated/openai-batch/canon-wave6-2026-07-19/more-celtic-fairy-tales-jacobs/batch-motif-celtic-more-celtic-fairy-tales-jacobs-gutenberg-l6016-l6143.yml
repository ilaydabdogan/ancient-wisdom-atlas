canonical_text:
  quote: ''
  summary: The passage first closes an episode in which Fin forgives three Big Men
    after their confession and makes them swear future loyalty. It then recounts how
    Cormac mac Art, high king at Tara, acquires a fairy branch from a youth at the
    cost of his wife, son, and daughter; after a year he follows them through a magical
    mist into a marvellous plain, sees strange repeated labors and wells with heads
    and streams, enters a house where true stories cook a boar, is reunited with his
    family, and meets Manannan mac Lir, who reveals that he gave the branch and brought
    Cormac there.
  language: English
  quote_policy: summarized
