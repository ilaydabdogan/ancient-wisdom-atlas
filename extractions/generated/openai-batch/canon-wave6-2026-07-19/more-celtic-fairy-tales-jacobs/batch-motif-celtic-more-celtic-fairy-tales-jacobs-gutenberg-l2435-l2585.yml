canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which Cathal, King of Munster, is
    cured of his craving and rewards MacConglinney. It then tells of Owen O'Mulready,
    who wants to have a dream. His master James Taafe tells him to put out the hearth
    fire and sleep on the hearth. In the dream Owen is sent with a letter to America,
    meets a cow-boy guide, tries to cross the sea on a speaking crane, is abandoned
    hanging from a thresher's flail between sky and sea, calls to a boat, and drops
    a shoe. Margaret wakes when struck by the shoe and finds Owen climbing inside
    the chimney, black with soot. Owen no longer wants to dream.
  language: English
  quote_policy: summarized
