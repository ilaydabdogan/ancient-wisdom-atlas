canonical_text:
  quote: ''
  summary: 'A ploughman places stakes in fields, waits until they show the earth is
    ready, and then ploughs, sows, and harrows three fields in one day. At harvest
    he tries to claim nearly all the corn under a wage agreement involving one burden-withe,
    but the farmer invokes the three Marts and the withe breaks; the ploughman vanishes
    in a white mist. A new tale begins: a sick king needs apples from a guarded tree
    as medicine, but a bright bird steals apples at night while the gardener''s eldest
    son falls asleep on watch.'
  language: English
  quote_policy: summarized
