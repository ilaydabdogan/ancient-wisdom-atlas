canonical_text:
  quote: ''
  summary: 'The passage ends one tale with a woman rejecting a false claimant, a rider
    returning after three years to his black horse, and the horse requiring beheading
    before appearing as a man released from spells. It then begins ''The Vision of
    MacConglinney'': King Cathal of Munster suffers insatiable hunger caused by a
    lawless beast within him; the scholar Anier MacConglinney travels to help, shames
    the king into sharing food, obtains a pledge that the king will fast overnight,
    then binds the king and eats roasted meat dipped in honey before him.'
  language: English
  quote_policy: summarized
