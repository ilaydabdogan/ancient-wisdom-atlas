canonical_text:
  quote: ''
  summary: MacConglinney addresses the fasting King of Munster and recounts a comic
    vision of a food-filled landscape, a New Milk Lake, an edible house, and the hermitage
    of the Wizard Doctor. In the vision he receives a food-and-fire cure. As he recites
    and handles roasting morsels, the lawless beast within Cathal emerges, jumps from
    the king's throat onto a spit, and vanishes after MacConglinney puts the spit
    in embers, overturns a cauldron, and fires fill the house.
  language: English
  quote_policy: summarized
