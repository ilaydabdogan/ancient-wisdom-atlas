canonical_text:
  quote: ''
  summary: 'A first-person hero sails alone into mist and reaches an island where
    a strange old woman, after being claimed as foster-mother, warns him about a breath-drawing
    cave giant. The hero enters the cave, takes the short spear, and beheads the giant.
    The woman identifies herself as a soothsayer, names him Mac Connachar son of the
    King of Lochlann, and directs him to the kingdom of the Red Shield, where his
    mother and sister are threatened with marriages to the king and his son. After
    a frame interruption concerning Kayn Mac Loy and a healing salve, the hero continues:
    he reaches the fortified town, kills the two scaled bridge-guardians Roar and
    Rustle, breaks through the palace wall, rejoins his mother and sister, and negotiates
    with the King of the Red Shield.'
  language: English
  quote_policy: summarized
