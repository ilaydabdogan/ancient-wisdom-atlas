canonical_text:
  quote: ''
  summary: A scholarly note compares the tale's swan and chain metamorphosis pattern
    with the Continental Seven Swans or Ravens, the Swan Knight saga, old Irish bird-guise
    beings such as Fand, Liban, and Dechtire, and the Dream of Angus. It emphasizes
    silver or gold chains as metamorphosis tokens or talismans, describes swan-maids
    and annual human-bird alternation, and proposes an Irish folk-tale pattern involving
    a water or sea fairy mother, talisman-dependent shapeshifting children, and a
    jealous human wife who tampers with the talismans.
  language: English
  quote_policy: summarized
