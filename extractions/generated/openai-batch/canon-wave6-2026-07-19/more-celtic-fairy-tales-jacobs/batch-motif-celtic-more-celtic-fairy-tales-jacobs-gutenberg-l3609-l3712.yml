- id: obs:1
  text: In the first palace, the boy passes groups of armed guards who are standing
    upright but asleep; a far room is bright without lamp or candle and contains a
    golden bird in a common cage and three apples turned solid gold.
  category: setting
  evidence_refs:
  - ev:1
