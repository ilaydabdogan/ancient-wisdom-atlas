canonical_text:
  quote: ''
  summary: The boy enters guarded palaces where guards and attendants are asleep,
    attempts to take a golden bird and then the King of Moroco's swift bay filly,
    and each time chooses an ornate golden replacement that causes an alarm. Each
    capture leads a king to impose a further task. A fox repeatedly helps by carrying
    him on its tail and giving instructions, finally sending him to take Princess
    Golden Locks from the King of Greek's palace, where the boy falls in love and
    kisses her hand.
  language: English
  quote_policy: summarized
