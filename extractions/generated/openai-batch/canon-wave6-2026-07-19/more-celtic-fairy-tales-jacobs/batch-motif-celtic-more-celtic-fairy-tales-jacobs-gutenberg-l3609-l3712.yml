  text: When the bird's wing touches the golden wires, it squawks loudly, the sleeping
    guards wake, and the boy is surrounded.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The king threatens the boy with execution but sets a task: bring the King
    of Moroco''s bay filly that outruns the wind and leaps over castle-bawn walls;
    the reward will be the golden bird and liberty.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
