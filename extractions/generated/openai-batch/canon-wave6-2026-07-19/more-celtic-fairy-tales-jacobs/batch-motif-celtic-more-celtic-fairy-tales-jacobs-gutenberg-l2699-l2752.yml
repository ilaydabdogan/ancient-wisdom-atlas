canonical_text:
  quote: ''
  summary: An unnamed woman instructs Morraha to provoke Rough Niall of the Speckled
    Rock by demanding news of Anshgayliacht's death and the sword of light. Morraha
    repeats the challenge on horseback while Niall pursues and damages horses, saddle,
    and clothing. Niall's wife repeatedly blinds him with food, later warns him to
    stay awake while a little currach remains in sight, and finally tells him to sleep.
    Morraha enters during Niall's heavy sleep, seizes the sword at Niall's bed, and
    demands the hidden story. Niall agrees to tell it.
  language: English
