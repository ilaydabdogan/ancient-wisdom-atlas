    tells the wolf to keep his tail on it while the fox goes away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf's tail becomes fast in the ice; after the fox alerts the farmer,
    the wolf flees and leaves his tail behind, explaining why the wolf is stump-tailed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fox tries to lure a cock and hen from a tree by saying there is peace
