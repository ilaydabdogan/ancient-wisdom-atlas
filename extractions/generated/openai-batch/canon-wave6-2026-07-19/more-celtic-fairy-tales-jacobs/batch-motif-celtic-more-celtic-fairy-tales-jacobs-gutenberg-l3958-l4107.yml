  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fox persuades the wolf to go with him to a keg of butter, and the two
    bury it near the seashore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The fox repeatedly pretends to attend baptisms, visits the hidden butter,
