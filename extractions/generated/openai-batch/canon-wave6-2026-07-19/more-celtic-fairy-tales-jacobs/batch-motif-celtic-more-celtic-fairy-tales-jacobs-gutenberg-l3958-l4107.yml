  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the empty butter keg is found, the fox accuses the wolf, hangs him by
    the hind legs, and places butter under his mouth to make it appear to have come
    from the wolf's belly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fox and wolf take land, plant oats and then potatoes, and the fox gains
