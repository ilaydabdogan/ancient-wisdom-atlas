canonical_text:
  quote: ''
  summary: 'A fox repeatedly tricks a stronger wolf: first causing the wolf to lose
    his tail in ice, then failing to lure a cock and hen because hounds are approaching,
    then stealing a buried keg of butter while blaming the wolf, then taking the useful
    parts of crops through root-and-top choices, and finally sending the wolf to a
    mare whose kick breaks his head.'
  language: English
  quote_policy: summarized
