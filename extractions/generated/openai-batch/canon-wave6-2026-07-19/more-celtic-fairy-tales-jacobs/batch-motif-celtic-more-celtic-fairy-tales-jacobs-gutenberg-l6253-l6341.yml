canonical_text:
  quote: ''
  summary: 'The passage concludes a riddle episode: the knight''s daughter obtains
    the riddle question from the eldest brother, the Knight of Riddles answers it,
    and the brother exposes that the answer was leaked by posing a counter-riddle
    about taking skins from hares. The knight gives his daughter to the brother in
    marriage. The son-in-law later kills three giants and receives the name Hero of
    the White Shield. His younger brother later meets him, wrestles him, and the two
    recognize one another as brothers. The younger brother then finds twelve strong
    sons playing shinny, learns they are his own children, reunites with their mother,
    and takes them home; the narrative links his descendants with kings in Alba. A
    short separate tale, “The Tail,” tells of a shepherd pulling a half-drowned sheep
    from a peat hag until its tail breaks, ending with a pun that otherwise the tale
    would have been longer.'
  language: English
  quote_policy: summarized
