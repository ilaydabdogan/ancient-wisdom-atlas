canonical_text:
  quote: ''
  summary: Powel comes disguised to Heveyth Hen's feast with a bag, gains Gwawl's
    assent to fill it, and traps Gwawl inside it by exploiting the condition required
    to make the bag full. Powel's household seizes Gwawl's host, and the captive is
    mocked in a game called Badger in the Bag. Rhiannon and Heveyth counsel that Gwawl
    be released after providing gifts or satisfaction to suitors and minstrels and
    pledging not to seek revenge. Powel and Rhiannon then feast, distribute gifts,
    travel to Dyved, and rule prosperously.
  language: English
  quote_policy: summarized
