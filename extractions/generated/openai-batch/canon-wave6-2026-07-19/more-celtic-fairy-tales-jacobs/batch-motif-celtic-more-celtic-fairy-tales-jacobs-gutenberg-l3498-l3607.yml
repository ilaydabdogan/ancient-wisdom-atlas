canonical_text:
  quote: ''
  summary: A king's garden is visited at midnight by a bright bird that steals apples
    and enchants watchers. The youngest gardener's son wounds the bird and obtains
    a golden feather. The king promises his daughter and half his kingdom to whoever
    brings the golden bird. The elder brothers fail after mistreating or ignoring
    a talking fox. The youngest shares food with the fox, follows its lodging advice,
    and is carried swiftly on the fox's tail toward the King of Spain's palace, where
    the fox tells him how to find the golden bird.
  language: English
  quote_policy: summarized
