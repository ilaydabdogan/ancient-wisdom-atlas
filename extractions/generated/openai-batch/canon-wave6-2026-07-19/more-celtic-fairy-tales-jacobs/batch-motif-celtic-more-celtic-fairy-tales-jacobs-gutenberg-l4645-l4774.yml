canonical_text:
  quote: ''
  summary: Smallhead and the King's son return near his father's castle. She appears
    in great beauty and warns him that if he kisses anyone or lets any living thing
    kiss him, he will forget her. An old hound licks his face at the castle, and he
    forgets his past seven years. Smallhead later sits in a tree over a well; the
    smith's wife and stepdaughter mistake her reflected face for their own and run
    away. The smith recognizes the reflection as hers, brings her into his household,
    and she later proves extraordinary skill by ironing castle linen. She is brought
    to the castle and placed over the maids, though the prince does not remember her.
    At a feast for the prince's arranged marriage to the King of Ulster's daughter,
    Smallhead performs a magical thread-walking feat from a high window. The bride
    attempts to imitate her, falls, and dies.
  language: English
  quote_policy: summarized
