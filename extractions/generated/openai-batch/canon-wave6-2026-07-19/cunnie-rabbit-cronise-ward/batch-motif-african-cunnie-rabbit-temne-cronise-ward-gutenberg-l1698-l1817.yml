canonical_text:
  quote: ''
  summary: In a drought, the animals gather but cannot solve their lack of water.
    Cunnie Rabbit digs a well and drinks from it. When Spider and then Elephant seek
    water, Rabbit requires contests of strength. The contests are described in exaggerated
    terms, reaching the sky and producing destructive fire. After the animals fail
    to defeat him, they bring many clothes and plead for water; Rabbit allows each
    a cup, with a bargain that wasted water must be paid for with cloth. The passage
    also includes a frame scene of Konah and other children listening while Mamenah
    narrates.
  language: English
  quote_policy: summarized
