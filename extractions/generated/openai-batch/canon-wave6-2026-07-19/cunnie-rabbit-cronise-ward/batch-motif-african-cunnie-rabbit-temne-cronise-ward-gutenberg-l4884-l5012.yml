canonical_text:
  quote: ''
  summary: Sobah introduces a tale about a would-be evildoer receiving retribution.
    A king's neglected wife receives aid from a speaking ant hill, and her child immediately
    becomes a rich, wise man. A wicked messenger persuades the king to test or kill
    the son through dangerous tasks and traps. The son survives with help from the
    ant hill, ants, a butterfly, his servant, and a child, finally escaping a water
    execution by substituting stones in a tied mat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sobah recalls and begins a story described as one in which a would-be evildoer
    receives just retribution.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy named Pass-all-king-fo'-wise is the son of a king and a wife who had
    hidden in a farm-house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother sits on a large ant hill and wishes her child were strong; the
    ant hill speaks and says it will give the child both sense and riches.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child immediately becomes a grown rich man with a stone house, many servants,
    and a counsellor.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A wicked messenger tells the king that the son will take the country unless
    the king kills him, and the king orders special trials or work.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first trial requires the boy to pick all the fruit from a high tree guarded
    by poisonous stinging ants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boy reports the trial to the ant hill, and the ants gather the fruit into
    one place before morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The second trial requires the boy to identify the king's first cow among many
    cattle; a butterfly sits on the correct cow, and the boy names it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A pit is dug with knives and broken bottles around and inside it, covered
    with a mat and chair; the boy tests the place with a heavy stick, and the chair
    falls into the hole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The final attempt is presented as a crowning rite in which the boy is to be
    wrapped in a mat, tied, weighted with heavy stones, and thrown into deep water
    for three days.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The boy's servant says he has forgotten something, and all the people, including
    the king, get up and leave because they also forget something.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: While the people are gone, a small child unties the boy; the boy puts heavy
    stones in the mat, ties it, goes home, and the people later throw the mat into
    the deep water thinking he is inside.
  category: sequence
  evidence_refs:
  - ev:9
