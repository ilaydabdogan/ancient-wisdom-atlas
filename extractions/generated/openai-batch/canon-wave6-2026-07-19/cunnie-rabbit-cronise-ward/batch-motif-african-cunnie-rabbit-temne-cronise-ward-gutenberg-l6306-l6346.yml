canonical_text:
  quote: ''
  summary: An unnamed woman uses an interpreter to question Konah and invite her to
    a mission school. Konah wants to go, but Sobah and Mamenah delay consent. At an
    evening meeting, a large crowd hears an organ and prayer, then watches magic-lantern
    images of the life and crucifixion of the Saviour while the story of love and
    self-sacrifice is told. After further discussion with the missionaries, Sobah
    postpones a decision until morning. Native helpers remain with Konah and answer
    questions about mission-school life, describing God-word, pictures, books, sewing,
    and storytelling; Konah asks what kind of stories are told.
  language: English
  quote_policy: summarized
