canonical_text:
  quote: ''
  summary: The passage frames Mr. Leopard’s attack on Mr. Spider as retribution for
    an earlier flogging. Spider prepares a gourd hiding place for his household, but
    Leopard escapes, comes to Spider’s house, eats the prepared meal, detects Spider
    by smell, and attacks Spider’s family with sling stones. Spider silences each
    injured relative with a bone until he is struck himself; then he cries out, is
    caught, and his wife and children die while Spider escapes to another country.
  language: English
  quote_policy: summarized
