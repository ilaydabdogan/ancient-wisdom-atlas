canonical_text:
  quote: '"Now dem two pusson deh, which one pass fo'' cunnie?"'
  summary: A note describes burial places for infants, older persons, and most of
    the dead. In the story, Greedy pretends to be dead so that a visiting Watch-pot
    man will bury him rather than eat his rice. Greedy's wife helps the deception,
    but Watch-pot digs the grave, encloses Greedy in the coffin, threatens him with
    the final shovel of earth, and is asked to pull him out. Greedy and his wife then
    try to flee with the rice and soup, forgetting the calabash and stick-spoon; Watch-pot
    brings the utensils, is invited to eat, and eats the rice with them. The storyteller
    closes by asking which of the two men is more cunning, and the frame narrative
    moves toward another story.
  language: English with Temne-inflected dialect representation
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening note says a first baby is usually buried on a refuse heap, a second
    child nearer the house, an older person most honorably within the house, and many
    dead in the bush or by the road-side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman asks the visiting man to go behind the house so she can say goodbye
    to her husband, then tells her husband that the stranger will bury him for his
    own rice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband says the stranger will not eat his rice and tells his wife to
    hide the hoe so the stranger must go to town to find one.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The visiting man opens his box, takes out digging tools and a shovel, digs
    a deep hole, enters and exits it, and is described as cunning like a rabbit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife again tells her husband to get up; the children cry from hunger rather
    than grief for their father; the husband refuses because the stranger will not
    eat his rice if he is buried.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
