canonical_text:
  quote: ''
  summary: A child sings for her mother to return from the grave, and the mother emerges.
    After seeing the resulting wealth, the stepmother sends her own daughter to wash
    a stick or spoon at the devil's place. The daughter behaves disrespectfully toward
    strange road figures and the devil, receives four eggs, and breaks them as instructed.
    The eggs release bees, snakes, whip-bearing men, and finally fire, which burns
    the house, the mother, and the daughter. Konah concludes with a moral against
    doing wrong to children without parents.
  language: English, rendered in dialect
  quote_policy: summarized
