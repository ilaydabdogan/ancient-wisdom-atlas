canonical_text:
  quote: ''
  summary: A woman follows a visiting sweetheart after a dance, despite warnings that
    strangers from far away may be dead persons from graves. The sweetheart is revealed
    as a dead man who leads her toward a town of the dead, where she is frightened
    by unseen dead people in white clothing. A dog with supernatural sight turns into
    a person and offers to rescue her on the condition that she never call him dog
    and that he may eat food she prepares for a friend. The dog drives off the dead,
    carries her across a large water, and returns her home. Later, after the dog repeatedly
    eats her cooked rice, she angrily calls him dog; he looks at her, and she falls
    down dead.
  language: English, with Sierra Leone oral narrative dialect as transcribed
  quote_policy: summarized
