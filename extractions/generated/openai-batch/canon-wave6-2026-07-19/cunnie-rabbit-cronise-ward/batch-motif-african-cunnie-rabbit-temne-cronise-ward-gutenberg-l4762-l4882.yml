canonical_text:
  quote: ''
  summary: A poor boy is blamed for the death of a hunter's young animal and is beaten
    until he replaces it. Later he captures a singing and dancing bird from a dangerous
    water place guarded by an alligator. The bird brings gifts and wealth through
    its performances. The bad hunting man secretly handles the bird, is tricked into
    taking it outside, and loses it. When he tries to replace the bird by catching
    another at the same water, an alligator eats him. The story closes with a moral
    that doing wrong to a little child brings worse trouble on the wrongdoer.
  language: English, with Temne oral narrative dialect represented in transcription
  quote_policy: summarized
