canonical_text:
  quote: ''
  summary: Mr. Spider accepts an old woman's carrying-task in exchange for her sheep,
    kills and eats the sheep, is trapped by the old woman's lengthening limbs, tricks
    her by invoking her fear of the Manekky, abandons her under a tree, later returns
    to use her skull to frighten a girl, and is punished when the skull jumps onto
    his nose until a blacksmith removes it. The frame narrative connects the animated
    skull with questions about dead people walking or acting unseen.
  language: English, with Sierra Leone oral narrative dialect transcription
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman owns a sheep and offers it to anyone who will carry her because
    she is too old to walk.
  category: action
  evidence_refs:
