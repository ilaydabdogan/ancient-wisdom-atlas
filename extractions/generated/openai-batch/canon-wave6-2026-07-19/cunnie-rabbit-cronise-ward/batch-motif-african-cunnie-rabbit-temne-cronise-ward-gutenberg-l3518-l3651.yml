canonical_text:
  quote: MARRY THE DEVIL, THERE'S THE DEVIL TO PAY.
  summary: A beautiful girl rejects human suitors but accepts a handsome-looking stranger
    who is actually a devil from the bush. He conceals his human-eating nature, takes
    her away despite family concern, sheds parts of his borrowed appearance on the
    road, and at night prepares to kill and eat her while her sick younger brother
    remains awake nearby.
  language: English dialect transcription
  quote_policy: quoted
