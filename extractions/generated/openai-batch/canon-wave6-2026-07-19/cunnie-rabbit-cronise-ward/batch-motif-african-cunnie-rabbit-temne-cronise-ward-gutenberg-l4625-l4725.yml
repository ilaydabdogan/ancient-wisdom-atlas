canonical_text:
  quote: He done rich by heen cunnie.
  summary: Spider repeatedly enters a Cow with his children to cut and carry away
    fat, ignores Frog's warning, cuts the Cow's heart, and causes the Cow's death.
    He accuses children of dirtying him while washing the Cow's insides, complains
    to the king, receives the Cow's meat, then stages the Cow's head in a hole to
    deceive passing strangers into thinking they have killed the king's sacred cow.
    Frightened, they give Spider three cows, and he becomes rich by cunning. The frame
    narrative ends as a fowl crows and dawn breaks.
  language: English
  quote_policy: quoted
