canonical_text:
  quote: '"So nar Spider bring tief long tem nah de wuld. He bin begin tief, so now
    we all duh tief."'
  summary: A note explains Mory-made charms. In the tale, Spider steals cloth and
    beads and obtains charms that let him evade capture by jumping like a monkey.
    The chief's people consult the same Mory man, obtain a counter-charmed black monkey
    with a whip and escorts, and capture Spider after he leaves or loses a hand charm
    that contains his strength. Spider is imprisoned, but Cunnie Rabbit, his cunning
    friend, magically enters the locked prison and frees him. The narrator concludes
    that Spider brought theft into the world. In the frame, Konah dreams of the pursuing
    black monkey, imprisonment, and rescue by Rabbit.
  language: English
  quote_policy: quoted
