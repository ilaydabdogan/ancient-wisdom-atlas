canonical_text:
  quote: ''
  summary: Sobah prepares a trading voyage by boat with a crew, cargo, and a white
    fowl believed to ensure prosperity. The crew rows through an evening river landscape,
    becomes fearful of spirits, drops silver into the water to propitiate the river
    spirit, and drifts silently until reaching broader waters. A sea gale later forces
    the boat to anchor at the bar-mouth; after meals and rest, the men gather into
    a storytelling mood, and Sobah prepares to tell a story about Mr. Spider.
  language: English
  quote_policy: summarized
