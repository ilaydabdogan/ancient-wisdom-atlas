canonical_text:
  quote: ''
  summary: The introduction describes storytelling as a leisure pastime often performed
    at night before sympathetic listeners, sometimes around fires. It notes skilled
    village storytellers, itinerant professionals who exchange stories and songs for
    subsistence, all-night riddling and storytelling during ceremonies, and chanted
    choruses with clapping. It then characterizes African and American folklore as
    rich in anthropomorphic animal stories and summarizes a Temne pattern in which
    animals once formed a single community before predation scattered them. A Spider
    tale is described in which Spider uses a fraudulent claim of witch-killing medicine
    to kill and eat animals, causing them to flee.
  language: English
  quote_policy: summarized
