canonical_text:
  quote: ''
  summary: Sobah tells an audience a tale called “Watch-pot and Greedy.” A western
    man named Watch-pot hears that an eastern man named Greedy never lets strangers
    eat his food, and Watch-pot resolves to eat Greedy’s rice. Watch-pot arrives prepared
    with cloth gifts and tools. Greedy and his wife try to prevent him from eating
    by pretending that Greedy has died, but Watch-pot stays to perform funeral duties,
    produces white cloth, builds a coffin, makes a fire, and finally insists on burying
    the supposed corpse inside the farm-house rather than in the bush.
  language: English with Temne-dialect narrative forms
  quote_policy: summarized
