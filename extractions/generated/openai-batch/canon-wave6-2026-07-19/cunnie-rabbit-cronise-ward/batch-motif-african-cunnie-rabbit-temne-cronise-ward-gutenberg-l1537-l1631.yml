canonical_text:
  quote: ''
  summary: Turtle visits Leopard's wife and says that, if Leopard were present, he
    would ride him like a horse. After Leopard hears this and confronts him, Turtle
    denies the boast, pretends to be too sick to walk, and persuades Leopard to carry
    him. Turtle obtains a rope and stick, rides and beats Leopard like a horse, and
    is seen by Leopard's wife, who laughs and confirms the boast. Leopard then punishes
    Turtle by tying and flogging him, explaining the marks on Turtle's back. The prose
    frame reports audience laughter at the episode and its retribution.
  language: English
  quote_policy: summarized
