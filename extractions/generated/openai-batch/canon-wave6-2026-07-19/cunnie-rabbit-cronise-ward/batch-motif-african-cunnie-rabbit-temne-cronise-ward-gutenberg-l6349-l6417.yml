canonical_text:
  quote: THE NEW VERSION OF EVE AND THE APPLE.
  summary: A visitor narrates a creation-and-fall story in which God creates a man,
    a woman, and a garden, forbids one tree, and a snake sent by Satan persuades the
    woman and man to eat the fruit. God discovers them, questions them, and punishes
    the people and snake. The visitors then explain God to Konah as kind, burden-bearing,
    and one who died and rose in three days. Konah asks to go with the mission visitors;
    her father later decides to move to the mission town. During the visitors’ departure,
    Konah and other girls hold the hand of a woman visitor until the river, where
    Konah watches the group leave and longs to follow.
  language: English
  quote_policy: quoted
