canonical_text:
  quote: ''
  summary: After heavy rain extinguishes all fire, the gathered animals are cold and
    seek fire from a woman and her child, Goro. The woman says anyone who wants fire
    must wrestle and beat Goro. Goro defeats Deer, Elephant, Leopard, Cat, and, at
    the end of the excerpt, raises Spider; several defeats are used to explain present
    animal traits. The passage also includes a storytelling performance frame with
    chanting, clapping, and audience reaction.
  language: English
  quote_policy: summarized
