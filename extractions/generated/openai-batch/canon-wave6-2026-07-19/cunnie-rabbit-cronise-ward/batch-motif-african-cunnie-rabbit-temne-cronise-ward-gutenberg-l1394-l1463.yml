canonical_text:
  quote: ''
  summary: In a framed storytelling scene, Sobah continues a tale despite listeners'
    concern for Mr. Spider. Spider falls, breaks his foot, and returns without fire,
    explaining why spiders now crawl. Cunnie Rabbit asks a woman for fire and is sent
    to fight her child; after being lifted for six months, he falls, rises, and runs,
    explaining why he is hard to catch. Other animals fail. Conk the snail is thrown
    out by Cunnie Rabbit, is marked with blood, but persists. Conk asks for fire,
    prepares the wrestling ground with slippery spit, lifts the woman's child for
    five years, takes the fire home, and cooks before the girl returns. The woman
    cries, and the tale states that this brought crying into the world. The passage
    closes with silence and Gondomah's remark that Spider is smart.
  language: English
  quote_policy: summarized
