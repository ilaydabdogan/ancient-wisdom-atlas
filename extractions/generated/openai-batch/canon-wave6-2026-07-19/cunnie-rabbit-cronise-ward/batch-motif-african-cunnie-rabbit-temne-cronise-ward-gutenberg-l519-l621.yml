literal_observations:
- id: obs:1
  text: The passage states that Spider occupies a comparable place in West African
    folklore to Brer Rabbit in southern U.S. Black tales, Annancy in West Indian stories,
    and Hlakanyana in South African stories.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports an earlier claim of essential identity between Brer Rabbit
    and Hlakanyana and says there is perhaps a closer parallel between the Temne Spider
    and Annancy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mr. Spider and Brer Rabbit are both described as clever, but Brer Rabbit is
    characterized as more harmless in mischief, while Mr. Spider's cunning can be
    vicious and can bring him grief without destroying him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cunning Rabbit is described as rivaling Mr. Spider in shrewdness and wit and
    as usually having the advantage when their interests clash.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cunning Rabbit is identified by the authors as not actually a rabbit but as
    the water deerlet or chevrotain, described as nimble, shy, fleet, cunning, and
    venerated by local people.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A submitted skeletal fragment was identified as belonging to Hyomoschus Aquaticus,
    an animal said to be peculiar to West Africa.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The authors call it conjectural, but suggest a possible transfer of Cunning
    Rabbit's qualities to the American hare because of similarity in popular names.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: When asked where the stories came from, informants reportedly answered that
    they came from far up country, implying remote origin in space and time.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says many stories in the collection are almost identical with
    tales in the Uncle Remus series and with some Annancy stories, and also resemble
    tales from American Indian folklore and other African Black communities.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that the Tar Baby story appears in this collection as the
    Wax Girl and that the encounter is the same in the Spider/Wax Girl and Brer Rabbit/Tar
    Baby versions, though preliminaries and outcomes differ.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Brer Rabbit is described as regaining freedom and prestige when Mr. Fox throws
    him into the brier patch, while Mr. Spider is flogged by the outraged community
    for deception and appropriation.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Mr. Spider's strength contest with Elephant and Hippopotamus is described
    as a variant of a contest between Mr. Terrapin and Mr. Bear.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: A Temne story of Turtle making Mr. Leopard into a riding-horse is compared
    with Brer Rabbit riding Brer Fox and Annancy riding Tiger.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Mr. Leopard is described as feigning death so that mourning animals gather
    near him, after which he seizes and devours them; this is compared with Mr. Wildcat's
    similar ruse involving a wild turkey.
  category: action
  evidence_refs:
  - ev:14
