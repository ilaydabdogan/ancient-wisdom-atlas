canonical_text:
  quote: ''
  summary: 'Cunnie Rabbit and the other animals gather and remove their horns. The
    group declares that whoever can blow all the horns without leaving any unblown
    will become king. Spider, Elephant, and the others fail. Rabbit uses a trick based
    on fear of Purro boys and the debble: whenever tired, he shouts as if he hears
    something, causing the others to shout and overlook his rest. After repeating
    this, he finishes all the horns and is accepted as king. The frame narrative then
    records Konah''s delight and a request for another story about Spider.'
  language: English
  quote_policy: summarized
