canonical_text:
  quote: ''
  summary: A stranger ignores a town warning not to set traps in a forest near a devil
    house. A devil turns into a pigeon, enters the trap, asks the stranger to release
    it, carry it home, kill it, cook it, season it, and eat it completely. Later,
    in the bush, the bird flies from the man’s mouth; the man falls dead and the devils
    carry him away. The tale is followed by a moral warning against stubborn disobedience,
    a proverb about eating from the devil’s bowl, and comments on the fearful effect
    of the recital on listeners.
  language: English
  quote_policy: summarized
