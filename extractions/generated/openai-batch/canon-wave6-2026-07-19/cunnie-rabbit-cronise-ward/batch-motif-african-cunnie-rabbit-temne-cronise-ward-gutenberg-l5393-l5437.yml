canonical_text:
  quote: ''
  summary: 'A boy goes into the bush to cut a stick and encounters an extremely long
    object that is actually a woman''s teeth. He cuts the teeth despite her cries,
    eventually shortening them inside her mouth. The tale concludes that there had
    been no teeth in the world before: the woman brought teeth, and the boy cut and
    scattered them, giving teeth to everyone. The frame then notes that the story
    failed to impress, and Konah introduces a new explanatory tale about why Spider''s
    middle is small, which she had heard from Sobah.'
