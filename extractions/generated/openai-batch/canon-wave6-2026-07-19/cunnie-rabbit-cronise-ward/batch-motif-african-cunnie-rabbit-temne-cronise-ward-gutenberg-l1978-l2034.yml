canonical_text:
  quote: ''
  summary: Mamenah recounts that Spider, formerly a person and now another kind of
    being, had a large cassava farm and divided cassava among goats after inviting
    them to choose town or bush. Goats choosing town received four sticks each and
    were told to like people; goats choosing bush received two sticks, explaining
    why bush-goats dislike people and remain in the bush. In the frame scene, Konah
    sees a cow switching its tail; Mamenah explains this as the cow remembering cassava
    once tied to its tail while swimming, not merely driving away a fly. The children
    then eat rice and stew, fetch water, and rest after the meal.
  language: English
  quote_policy: summarized
