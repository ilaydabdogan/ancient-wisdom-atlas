canonical_text:
  quote: "“Dis not to true stone, he nar one debble wey bin turn stone.”"
  summary: Spider finds a large bearded stone in the forest; the narration says it
    is a devil in stone form. Anyone who says that the stone has a beard falls down
    near it and nearly dies. Spider exploits this danger to kill Deer, Feleentambo,
    and other animals. Cunnie Rabbit resists Spider’s efforts to make him speak the
    dangerous phrase until Spider himself says it; both fall. Trorkey raises Cunnie
    Rabbit and, after hesitation, Spider. The tale ends by praising Cunnie Rabbit’s
    sense and saying Spider cannot surpass him.
  language: English
  quote_policy: quoted
