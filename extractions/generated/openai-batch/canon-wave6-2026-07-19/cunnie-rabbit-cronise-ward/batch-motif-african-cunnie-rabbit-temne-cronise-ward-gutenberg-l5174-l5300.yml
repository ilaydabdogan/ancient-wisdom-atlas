canonical_text:
  quote: ''
  summary: A story told in dialect recounts a dead wife's daughter mistreated by the
    surviving co-wife, sent to a far devil's place, tested and rewarded with four
    magic eggs that produce attendants, wealth, and a house. The devil also gives
    instructions for calling the girl's dead mother back from the grave by beating
    rice on the grave and singing; the grave opens and the mother begins to emerge
    while the girl obeys a warning not to pull her out.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The inner story begins with two wives of one husband; one wife dies and leaves
    her child with the other wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The surviving wife hates the dead wife's child, makes her fetch water, beat
    rice, break wood, and do other work, and then flogs her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The surviving wife's own child does no work; both children become sick with
    yaws, and the harsh scrubbing of the dead wife's child makes her yaws end quickly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the girl drops a rice-stick in the kitchen, the woman slaps and curses
    her and orders her to wash it at the devil's far place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the road, the girl meets a bundle of hoe handles that can talk and a man
    with one eye who asks where she is going and shows her the way.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the devil's place, the devil is described as having many eyes, a broad
    head, and a bald middle of the head, and he asks the girl to pick lice from his
    head.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The girl does nothing bad while picking lice; the devil washes the rice-stick
    clean, wraps it in a silk handkerchief, and gives it back to her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The devil tells the girl to take four eggs; the narration says he is testing
    her honesty, and she takes only four small eggs rather than the larger eggs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The devil instructs the girl to break three eggs at intervals on the way and
    to break the last egg at the place where she wants to build a house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The first three broken eggs produce servants and a hammock, boxes of clothes
    and beads, officers and soldiers, and gold, silver, diamonds, other stones, and
    carriers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The last egg produces large houses, fine buildings, a wall, goats, cows, and
    music; the girl enters with her soldiers and servants.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the frame narrative, listeners react with wonder, children dance when music
    is mentioned, and the group claps time when Konah begins the song portion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'The devil gives the girl instructions for making her mother come out of the
    grave: prepare rice, take mortar and pestle to the grave, beat the rice on top
    of the grave, and sing.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The song asks the mother to turn back to the world and says the girl is tired
    of the present mother who flogs her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: As the girl beats and sings, the grave cracks and opens, and the mother's
    head comes out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The girl wants to pull her mother out, but the devil had warned that pulling
    would cut the mother in the middle and prevent her from coming out again, so the
    girl keeps beating and singing.
  category: sequence
  evidence_refs:
  - ev:9
