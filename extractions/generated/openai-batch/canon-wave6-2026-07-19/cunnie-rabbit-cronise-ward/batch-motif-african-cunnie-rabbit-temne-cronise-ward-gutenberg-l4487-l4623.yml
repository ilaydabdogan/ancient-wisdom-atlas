canonical_text:
  quote: ''
  summary: Spider claims to be a great doctor and takes Leopard's three sick children
    into a secluded enclosure, secretly kills and cooks them, and later has Leopard
    draw out only their bones. Leopard attempts revenge by hiding in a charcoal hamper
    sent to Spider, but Spider detects him, heats an iron in the fire, kills him,
    and makes a dinner. The frame narration then returns to the late-night storytelling
    gathering, where Sobah feeds the fire and begins another Spider exploit. In the
    next tale, Frog shows Spider how to enter the king's cow through its mouth and
    cut fat from inside without harming the heart; Spider is impatient, tries to hurry
    Frog before dawn with false bird calls, and joins Frog in unauthorized cutting
    of the cow's fat.
  language: English
  quote_policy: summarized
