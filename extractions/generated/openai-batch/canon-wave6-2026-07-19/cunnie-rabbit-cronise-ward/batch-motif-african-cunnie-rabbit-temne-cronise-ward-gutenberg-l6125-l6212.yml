canonical_text:
  quote: Befo' dis tem heah, axe no bin to dis wuld.
  summary: A boy repeatedly loses one item and receives another in compensation, passing
    through a chain involving a girl, ants, water, a hawk, the breeze, and a baboon.
    The baboon gives him an axe. A chief takes and then compensates the boy for the
    axe, has specialists examine and copy it, and a Kongah man teaches its use. The
    passage explains that axes were thereafter made and spread through the world.
  language: English
  quote_policy: quoted
