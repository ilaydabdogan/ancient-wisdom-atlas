canonical_text:
  quote: ''
  summary: After rice harvest, a Temne village is excited and afraid at the arrival
    of two white women, three white men, carriers, and attendants. A missionary's
    glasses alarm villagers, who interpret them as dangerous witch medicine. The chief
    receives the visitors as guests, provides lodging and food, and a meeting is called
    for the visitors to speak the "God-word." Konah watches the organ, hymn-singing,
    dinner customs, a lump of sugar passed from person to person, and a white woman's
    hair being let down and touched.
  language: English
  quote_policy: summarized
