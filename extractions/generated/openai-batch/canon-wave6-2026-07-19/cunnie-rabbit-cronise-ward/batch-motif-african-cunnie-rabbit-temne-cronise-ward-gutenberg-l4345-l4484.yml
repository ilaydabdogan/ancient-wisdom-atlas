canonical_text:
  quote: ''
  summary: The passage contains an embedded tale in which Leopard pretends to be dead
    so that the other animals will gather near him; Cunnie Rabbit notices that Leopard
    is still breathing and stays ready to escape. Leopard then rises and catches the
    animals who ignored Cunnie Rabbit. The surrounding frame comments on audience
    approval of successful cunning, includes a boys' fight over insults, and introduces
    another embedded tale. In that tale Spider has eaten Leopard's child; Leopard
    overhears Spider mention it, pursues him into the farm-house, and eats Spider's
    children and wife after they tire of hanging above him. Spider escapes by dropping
    bark for Leopard to seize as a decoy.
  language: English
  quote_policy: summarized
