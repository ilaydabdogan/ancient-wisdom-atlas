canonical_text:
  quote: ''
  summary: Spider, Lizard, and Chameleon want to go to Freetown but have no boat.
    They agree that Chameleon will serve as the boat because his body resembles one.
    Lizard rows while Spider captains and steers; Spider repeatedly drives Chameleon
    against rocks. Chameleon complains and threatens to leave them to swim, but is
    persuaded to continue until they reach shore. The tale explains Chameleon's damaged
    form and slow walking. The frame then comments on Spider's trickery and begins
    a new famine tale involving Spider and Elephant.
  language: English
  quote_policy: summarized
