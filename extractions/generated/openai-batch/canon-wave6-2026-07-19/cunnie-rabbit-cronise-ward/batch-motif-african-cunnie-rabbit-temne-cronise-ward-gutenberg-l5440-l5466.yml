canonical_text:
  quote: ''
  summary: A king announces a large dinner in all his towns. Mr. Spider, wanting to
    eat at every town, ties ropes around his middle at a crossroads and sends his
    children to different towns to pull him when cooking begins. All towns cook at
    the same time, so the children pull equally from all directions; Spider reaches
    no town, eats nothing, and his middle becomes small, explaining his narrow waist.
    A brief frame notes that the story ends, children run to answer a call, and Konah
    later returns to fairy-land in dreams.
  language: English
  quote_policy: summarized
