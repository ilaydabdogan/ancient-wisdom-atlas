canonical_text:
  quote: ''
  summary: 'A company passes time by posing and solving conundrums. The riddles identify
    ordinary things through figurative descriptions: an egg, fish-net, umbrella, fire-stones,
    broom, orange, sugar-cane, eyes, nose, ground, and related objects. Participants
    laugh at failed or delayed answers, praise successful solutions, and Sobah then
    introduces a new kind of mental challenge called a “Hill.”'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mammy points to a hen sitting on a nest as a hint, and Oleemah states that
    the answer is an egg described as having no door-mouth or window while a person
    talks inside.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dogbah asks what the answer is after others have understood the hint, and
    the company laughs at his expense.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man from Freetown proposes a conundrum about a dress sewn for an absent
    girl; after failed guesses he explains the answer as a fish-net.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same Freetown young man proposes a conundrum about a large house with
    one post, and Konah answers “Umbrella” after recalling a chief’s cotton shelter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mammy Mamenah, while making a colored palm-fibre mat, gives a conundrum about
    three slaves; nearby fire-stones supporting a rice-pot suggest the solution to
    another woman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another woman, reminded of broom-making, gives a conundrum about many slaves
    tied on one rope and hung up.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Children sit in a corner under leaking thatch; the falling drops are connected
    with the conundrum “Water hang,” to which Foday answers orange.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Konah gives the related conundrum “Water stand up, water grow,” and the answer
    is declared to be sugar-cane.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Freetown young man asks a riddle about two men close together who never
    see each other; boys answer “two eyes,” and a follow-up answer is “two eyes and
    nose.”
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A riddle describes a father-built house made entirely of windows; the passage
    identifies this as a fish-net seen woven that day in the barri.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Konah answers that the thing walked upon but never moving is the ground, then
