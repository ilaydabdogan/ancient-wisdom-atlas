  quote: '"De two beef no know say dat dey two go draw each odder."'
  summary: Spider persuades Elephant and Pawpawtámus that each will pull Spider with
    a rope. He secretly ties the rope between the two stronger animals, signals them,
    and hides while they pull against each other until both die. Spider claims superiority
    in sense over strength, uses the animals as food during famine, and discarded
    pieces thrown into the water become fish. The frame narration describes Sobah's
    performance, listeners' reactions, and the boat journey resuming toward Freetown.
  language: English
  quote_policy: quoted
