  quote: '"T''ree twin bin deh, two boy en one girl."'
  summary: A brief riddle-tale tells of three twins, two boys and one girl. The boys
    go hunting in a hilly place. One boy sees and shoots a hog through a hill; the
    other retrieves it through the shot-path and carries it home. Before the hog arrives,
    their sister has already cooked its heart, liver, and lung. The listener is asked
    which twin surpassed the others, and the majority answer favors the girl.
