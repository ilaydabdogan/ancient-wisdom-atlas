canonical_text:
  quote: ''
  summary: Spider, motivated by greed for food, arranges to be buried near his farm-house,
    rises from his grave at night to cook and eat the food left by his wife and children,
    and returns before daybreak. The household consults a country-fashion man, who
    advises making a sticky wax figure like a young girl and placing it in the house.
    Spider addresses the silent wax figure, touches and strikes it, becomes stuck,
    is discovered by his wife and the townspeople, and is beaten. The tale ends by
    explaining Spider’s flattened body as the result of this punishment.
  language: English
  quote_policy: summarized
