  summary: After three days of drumming and dancing, the boy returns crowned and mounted,
    gathers the people, and says he will tell what he saw when he died. He reports
    that after being thrown into water he met the person who crowned him king and
    instructed that the same should be done to the messenger who had caused trouble
    for the king's son. The named man tries to flee, is caught, bound in a mat, weighted
    with a stone, sunk, and dies. The narrator states a moral against doing harm to
    an innocent companion. In the frame, Dogbah is uneasy at the moral and offers
    to tell another story.
