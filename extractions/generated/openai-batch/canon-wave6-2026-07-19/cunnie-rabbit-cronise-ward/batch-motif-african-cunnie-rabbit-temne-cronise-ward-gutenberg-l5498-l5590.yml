canonical_text:
  quote: ''
  summary: Spider buys a gun and powder in Freetown, represents them to the animal
    town as powerful witch medicine, and orders everyone to stay indoors at night.
    He then ambushes and shoots animals at their doors, claiming each victim was a
    witch, and cooks and eats the bodies. Cunnie Rabbit later discovers and takes
    the gun and powder, attempts unsuccessfully to shoot Spider, accuses him, and
    agrees to keep silent as Spider’s companion. The animals scatter from the town
    into the bush, which the tale gives as the reason animals no longer live in town.
  language: English
  quote_policy: summarized
