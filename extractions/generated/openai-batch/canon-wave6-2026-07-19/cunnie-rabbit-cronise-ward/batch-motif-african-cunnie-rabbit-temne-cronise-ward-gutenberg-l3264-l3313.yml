  summary: A group of women and children gathers in Mamenah's hut after rice planting.
    The women discuss farming, seasonal rains, and measures to protect crops, including
    an offering to a cotton-tree spirit and a medicine charm at a farm boundary. Magbindee
    reports a story about gold growing from the ears of a buried rich man, which leads
    Mamenah to recall an old legend about a marvel of nature.
