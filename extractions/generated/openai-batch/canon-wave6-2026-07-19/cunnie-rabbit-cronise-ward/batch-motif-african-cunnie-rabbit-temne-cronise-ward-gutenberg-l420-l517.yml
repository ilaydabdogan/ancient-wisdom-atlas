canonical_text:
  quote: ''
  summary: 'Introductory passage summarizing several animal tales: animal harmony
    is broken by Leopard''s predation, the animals use the only boat to flee to an
    island, Leopard deceives Deer and seizes the boat, and the animals disperse over
    the earth. The passage then describes recurring etiological explanations for animal
    traits, fixed character types for Deer, Elephant, Cunning Rabbit, and Spider,
    and several examples in which clever weaker figures defeat stronger ones, including
    Spider''s rope ruse against Elephant and Hippopotamus, Cunning Rabbit''s victories
    at his well, and Goro aided by a mother''s incantation. It closes with an editorial
    characterization of Spider as a national hero figure associated with cunning,
    survival, weaving, and food acquisition.'
  language: English
  quote_policy: summarized
