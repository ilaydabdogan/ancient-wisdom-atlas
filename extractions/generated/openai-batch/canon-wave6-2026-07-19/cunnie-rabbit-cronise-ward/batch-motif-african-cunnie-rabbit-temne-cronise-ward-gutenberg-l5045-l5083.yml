canonical_text:
  quote: '"Well, he done turn elephan''. De foot nar de mottah."'
  summary: An elderly sick person in Mende country is taken into the bush, placed
    under a small bamboo-roof shelter, and fitted with mortars, a pestle, and fanners
    so that the body resembles an elephant. The narrator says that later the person
    is not seen and has turned into an elephant. Other speakers question or affirm
    the claim, and Mammy Yamah adds an account of girls who hear a monkey's song in
    the bush, sing it, and turn into elephants.
  language: English
  quote_policy: quoted
