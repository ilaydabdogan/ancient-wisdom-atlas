canonical_text:
  quote: ''
  summary: 'The passage describes the Purro secret society’s initiatory season: a
    restricted forest lodge is prepared with a bamboo barricade, symbols, and a yellow
    snake guardian. Women, children, and uninitiated men fear the sounds and procession
    of the Purro devil and hide or avoid looking. After the procession passes, Mamenah
    tries to dispel the uncanny mood by beginning a story about a trick of Cunnie
    Rabbit.'
