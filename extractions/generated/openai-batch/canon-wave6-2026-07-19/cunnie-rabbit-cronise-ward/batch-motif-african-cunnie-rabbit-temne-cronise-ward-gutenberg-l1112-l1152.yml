canonical_text:
  quote: Nar play I duh play.
  summary: Spider persuades Bowman to lie on a stick for a length test, ties him with
    a rope while claiming it is only play, tightens the rope, and carries Bowman to
    his mother-in-law. After people judge the matter, the mother gives Spider the
    girl as wife. The frame then notes Sobah's expressive storytelling, the dispersal
    of the listeners, Mammy Mamenah covering the fire, and the night belonging to
    spirits and other creatures of darkness.
  language: English
  quote_policy: quoted
