  quote: '"W''en he ''plit, all den people come out; dey no bin die"'
  summary: A girl subdues a roadside devil by plaiting and pulling its long beard.
    Townspeople kill the devil but cannot split its body until a prophet bird tells
    them to use a thorn. When the devil is opened, many living people emerge from
    inside. An old woman returns inside against warning, the body shuts, and the people
    cannot reopen it because the bird has gone; the devil is buried and the tale ends
    with a moral against stubborn disobedience.
