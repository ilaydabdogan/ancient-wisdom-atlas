canonical_text:
  quote: ''
  summary: A hunter who kills elephants is visited by an Elephant transformed into
    a fine girl. She asks him how he kills Elephant and how he can protect himself.
    He reveals several secrets, but his wife overhears and stops him before the final
    secret. The girl becomes Elephant again. The next day the hunter meets the Elephant,
    misses his shot, and tries the forms he disclosed; the Elephant smashes them.
    He escapes only by using the undisclosed final transformation involving water,
    but is badly injured and never hunts again. The tale ends with warnings not to
    reveal all secrets and not to mistreat one's wife.
  language: English
  quote_policy: summarized
