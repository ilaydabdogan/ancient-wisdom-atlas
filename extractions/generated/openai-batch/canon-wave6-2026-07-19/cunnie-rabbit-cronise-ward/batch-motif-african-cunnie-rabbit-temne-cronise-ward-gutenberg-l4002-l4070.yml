  quote: '"Well, now dem four boy yeah, which one make dem get fadder?"'
  summary: Soree tells a framed tale about four twin sons whose father disappeared
    while hunting. The sons go into the bush, find his remains, reconstruct him in
    stages, and the oldest restores him to life with a protective horn. The story
    ends as an unresolved question about which son should be credited with restoring
    the father.
