canonical_text:
  quote: '"Ebery mawnin'' Spider kill ''bout one t''ousan'', he put um inside pot."'
  summary: Spider offers to initiate all the fowls into Bundo. With the chief's approval,
    he has a large house and fence prepared, receives food, oil, and later ornaments,
    and shuts the fowls inside. Instead of initiating them, he kills and eats them,
    leaving only hatchlings. He flees by night with his children and the supplied
    goods; people discover bones and feathers, pursue him, catch him after his fear
    of Leopard reveals his hiding place, and he escapes to ask a Mory man for a charm.
  language: English
  quote_policy: quoted
