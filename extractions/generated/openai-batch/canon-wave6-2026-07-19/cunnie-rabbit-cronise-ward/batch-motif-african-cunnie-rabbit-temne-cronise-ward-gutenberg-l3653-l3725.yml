canonical_text:
  quote: ''
  summary: A boy prevents a devil from killing and eating a woman by staying awake,
    asking for food, and then sending the devil to fetch water with a fish-net. While
    the devil is delayed, the boy wakes the woman and they flee. They hide from the
    pursuing devil and reach home. The girl tells her people that disregarding advice
    brought her trouble, and the tale closes with a moral about not refusing a child
    companion, followed by the frame audience dispersing.
  language: English
