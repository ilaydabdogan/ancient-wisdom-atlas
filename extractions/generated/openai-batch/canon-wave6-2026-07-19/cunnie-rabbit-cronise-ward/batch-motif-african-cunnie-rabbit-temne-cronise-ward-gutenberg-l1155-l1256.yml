canonical_text:
  quote: ''
  summary: Sobah goes hunting in the forest, experiences failed attempts and alarming
    animal signs, discovers that his protective charm is missing, retrieves it, and
    successfully kills Cunnie Rabbit near the river. Villagers carry the animal as
    though ceremonially heavy, and Mamenah explains that Cunnie Rabbit is considered
    king of beasts for wisdom. Later, neighbors bring firewood as an indirect request
    for Sobah to tell a story; talk of animal behavior leads to animal tales with
    human attributes, and Oleemah asks for the story of why deer cough.
  language: English
  quote_policy: summarized
