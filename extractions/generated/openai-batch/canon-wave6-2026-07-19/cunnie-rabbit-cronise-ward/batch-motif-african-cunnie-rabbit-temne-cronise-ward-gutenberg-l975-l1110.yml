canonical_text:
  quote: ''
  summary: 'Mr. Spider seeks to marry a woman''s daughter. The mother requires three
    difficult items: bloody lion teeth, sass-wood palm-wine, and a live Bowman or
    boa-constrictor. In this passage Spider tricks Lion at a warming fire and obtains
    the teeth, then fakes sass-wood palm-wine by stealing palm-wine and placing it
    in a pot hung on a sass-wood tree. The passage ends as he begins the task of bringing
    Bowman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman has a daughter who is ready for marriage, but the mother prevents
    men from marrying her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The mother tells Spider that he must first bring three things: lion teeth
    fresh with blood, sass-wood palm-wine, and Bowman, glossed as boa-constrictor.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Listeners interrupt to say the tasks are impossible: Lion is too strong,
    sass-wood has no palm-wine, and Spider is too little to bring Bowman; Sobah says
    Spider can do it because he is cunning.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spider goes into a large forest where animals pass, makes a small fire beside
    the road, makes a bench where smoke goes, and asks animals to warm themselves
    one by one because it is rainy season and cold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Spider carries and hides a heavy hammer; he does not strike animals he does
    not want, but coaxes them to bring larger animals and eventually Lion.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When Lion arrives, Spider welcomes him, cleans the bench, adds raw leaves
    to make much smoke, and watches while the smoke goes on Lion, whose eyes shut
    and teeth open as he warms himself.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Spider strikes Lion's teeth once with the hammer; Lion cries out, spits his
    teeth onto the ground, and runs away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spider returns after Lion does not follow, takes the teeth, carries them to
    the woman, and presents them as raw lion teeth with blood; the woman then asks
    for sass-wood palm-wine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Spider sharpens his axe, finds a sass-wood tree, climbs it, digs a hole, buys
    a large country-pot, ties it with a strong rope, and hangs it on the tree.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Spider stays awake at night, steals palm-wine from people, pours it into the
    pot on the dry sass-wood tree until it overflows, and rubs palm-wine inside the
    hole and over the tree.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Spider brings a man to see whether the palm-wine runs; the man sees the full
