canonical_text:
  quote: ''
  summary: In the closing part of a tale, Elephant, Leopard, and the other animals
    drink water from a well, cook and eat an immense pot of rice, are overtaken by
    a great water and by ashes from a fire, swim home, and acquire different colors.
    In the frame scene, Mammy Mamenah cooks while the children watch goats in the
    yard; she explains the goats' movements, chewing, tail motion, fighting, and nose-touching
    as memories or continuations of long-ago events involving swimming, rice, water,
    and Cunnie Rabbit.
  language: English
  quote_policy: summarized
