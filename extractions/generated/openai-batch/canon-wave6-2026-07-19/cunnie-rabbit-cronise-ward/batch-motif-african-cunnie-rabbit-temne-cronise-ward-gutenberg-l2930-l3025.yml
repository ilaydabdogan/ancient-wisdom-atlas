canonical_text:
  quote: ''
  summary: Sobah, Mamenah, and Konah go to burn their farm brush. An omen in the road
    forces them to return and take another route; at a lightning-struck tree Sobah
    uses a leaf as a counter-charm. The brush is burned, and the fire is described
    as monstrous and uncanny. Later, Konah listens as Sobah explains that devils may
    be present in many places, can transform into many forms, and may be driven away
    or appeased by devil-houses with medicine. Konah recalls a village devil-house
    containing a stone, food, a skull, a bottle, a horn, and medicine. Sobah then
    prepares to tell a Spider-and-devil story.
  language: English
  quote_policy: summarized
