canonical_text:
  quote: "“Spider he smart man fo' true, true. Nobody nebber go ketch up wid Spider.”"
  summary: Spider and Leopard are hungry. Leopard proposes eating their children,
    and Spider arranges that Leopard’s children and wife are eaten first. When it
    is time to eat Spider’s family, Spider has his wife Nahker and children drag palm
    leaves to imitate an approaching tornado. Spider persuades Leopard to let himself
    be tied to a plum tree for safety, reveals the trick, and then has Leopard taunted,
    beaten, and whipped. The audience laughs, and Soree praises Spider’s cleverness
    before Sobah begins a balancing tale.
