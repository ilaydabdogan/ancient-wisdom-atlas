canonical_text:
  quote: ''
  summary: A horsekeeper loads the first-person narrator and other horses with household
    goods, people, and small animals, then leads them away. The party travels past
    a wooded mountain and is warned about wolves, but the drivers continue by night.
    The narrator runs among the horses out of fear, recalling Pegasus fleeing the
    Chimera. Armed drivers carry weapons and firebrands. Wolves do not attack, but
    villagers mistake the party for thieves, set mastiff dogs on them, and throw stones
    until a husband pleads with them. A villager in a cypress tree explains the attack
    as self-defense, and the party leaves wounded and bitten.
  language: English
  quote_policy: summarized
