canonical_text:
  quote: ''
  summary: Milo takes the first-person narrator by the hand and leads him toward a
    nearby bath. The narrator crouches under or close to Milo to hide from public
    view because he has become an occasion for laughter. After washing and returning
    home, he remains ashamed at others' gestures. He eats a meager supper with Milo,
    claims a headache from sobbing and weeping, asks leave to go to his chamber, and
    goes to bed.
