canonical_text:
  quote: ''
  summary: In a theatre, two women accuse Lucius of killing three men and appeal to
    the judges for punishment. Torture instruments are brought, but before torture
    the alleged bodies are uncovered by Lucius and revealed to be three mangled blown
    bladders. The crowd laughs, Milo leads the stunned Lucius home, and the magistrates
    explain that the episode belongs to an annual celebration of the god Risus. They
    offer Lucius civic honors and a statue. Lucius thanks them but declines the statue,
    then refuses an invitation from Byrrhena because he fears going out at night and
    cites an obligation to Milo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman in mourning carrying a child and an old woman in ragged robes enter
    the theatre with olive boughs associated with the three alleged slain bodies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two women appeal to the judges for mercy toward the slain persons and
    ask for legal punishment of the accused man, whom they call a thief and the cause
    of their sorrows.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An ancient judge says the murder deserves punishment and proposes using the
    rack to discover whether the accused had accomplices.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fire, a wheel, and other instruments of torment are brought into the theatre.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman asks that the accused uncover the alleged bodies before being
    tortured, and the judge orders him to uncover them with his own hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A sergeant forces Lucius forward when he refuses for a time to uncover the
    bodies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Lucius uncovers the alleged bodies, they are revealed as three blown
    bladders, mangled and wounded in places corresponding to where he remembers wounding
    the thieves the previous night.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The people laugh greatly and leave the theatre, while Lucius stands still,
    cold as ice, compared to the statues and images there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Milo takes Lucius by the hand, leads him through obscure lanes to his house,
    and tries to comfort him with gentle speech.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Magistrates and judges enter Milo's house and explain that the day is celebrated
    once a year in honor of the god Risus with a solemn novelty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The magistrates say the city intends to reward Lucius with honors, make him
    a patron, and set up his statue or image for perpetual remembrance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Lucius thanks the city but says statues or images should be reserved for his
    ancestors and for those more worthy than himself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A messenger reports that Byrrhena asks Lucius to come to supper, but Lucius
    refuses, saying he is afraid to go to her house at night and is bound by a promise
    to Milo.
  category: sequence
  evidence_refs:
  - ev:7
