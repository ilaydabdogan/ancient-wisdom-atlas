canonical_text:
  quote: as a man raised from death to life
  summary: News of the narrator's survival and divine favor reaches his country. His
    household and friends visit him with gifts. He settles near the goddess's temple,
    receives repeated night commands to enter her religious order, dreams of a priest
    and a servant named Candidus, then sees the dream fulfilled when a servant returns
    with his white horse. He seeks initiation; a priest explains that admission, minister,
    costs, purity, and timing depend on the goddess. A later vision announces the
    appointed day and names Priest Mythra as minister.
  language: English
  quote_policy: quoted
