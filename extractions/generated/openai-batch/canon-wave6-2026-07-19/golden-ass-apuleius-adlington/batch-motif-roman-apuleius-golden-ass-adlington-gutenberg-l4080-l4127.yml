canonical_text:
  quote: ''
  summary: A young man among the thieves proposes prayers and sacrifice to Mars before
    selling the captive maiden. After obtaining wine and sacrificial animals, the
    band makes an altar and sacrifices a goat. During the feast, the new companion
    secretly gives food and drink to the maiden Charites. The ass-narrator realizes
    that the man is not the thief Hemus but Lepolemus, Charites' husband. Lepolemus
    continues giving the thieves wine while abstaining himself until they fall asleep
    as if dead.
  language: English
  quote_policy: summarized
