  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Phelibus and his company load their belongings onto the narrator-ass and depart
    around midnight after the report of their conduct spreads.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a wild desert before sunrise, the company removes the goddess from the
