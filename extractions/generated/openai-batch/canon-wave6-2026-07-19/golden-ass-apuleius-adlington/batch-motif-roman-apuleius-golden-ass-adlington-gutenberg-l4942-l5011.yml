canonical_text:
  quote: ''
  summary: A company carrying a goddess performs violent and ecstatic-looking rites,
    gathers offerings, obtains a sheep under color of divination, is exposed in misconduct,
    punishes the narrator-ass in the desert, is later received with ritual honor in
    a city, and a cook plans to kill the ass as a substitute for venison eaten by
    a hound.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One member of the company sighs as if ravished in spirit or filled with divine
    power, then says he has displeased the goddess by acting against the order of
    the religion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same member whips his own body until blood flows abundantly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator-ass fears that a goddess who desires human blood might also desire
    the blood of an ass.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Local inhabitants bring offerings including gold, silver, wine, milk, cheese,
    flour, wheat, other goods, and barley for the ass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The company puts the offerings into a sack and places it on the narrator-ass's
    back along with the goddess.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At a castle, under color of divination, the company obtains a fat sheep from
