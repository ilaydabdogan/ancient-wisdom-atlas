canonical_text:
  quote: ''
  summary: A soldier sells the first-person ass to a baker and a cook. The ass secretly
    eats their stored delicacies, causing the two servants to accuse one another until
    they discover him through a hole in the chamber door. The household laughs at
    the ass's appetite; the master displays him as a novelty, feeds him table foods
    and wine, buys him at four times the prior price, and entrusts him to a rich freedman
    to be cared for and trained.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soldier, ordered by his captain to go to Rome with letters, sells the ass
    for eleven pence to two companion servants, one a baker and one a cook.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The baker and cook live in common, use the ass to carry necessities, and the
    ass is described as received by them as a third brother and companion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After supper, the two servants bring meats, breads, pastries, custards, and
    honeyed delicacies into their chamber, shut the door, and go to the baths.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ass secretly eats the chamber food instead of hay, first taking small
    amounts from different dishes so that no one suspects him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ass later devours whole portions of the sweet delicacies, and the baker
    and cook begin to suspect that a thief is taking the food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The baker and cook accuse one another of stealing the best food and speak
    of broken faith, partnership, brotherhood, and possible discord.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After both swear they have taken none of the meat, they decide to search for
    the thief and say they cannot imagine the ass, mice, or flies eating whole dishes;
    the passage mentions Harpies carrying away Phineus's meats.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ass grows plump and sleek from the rich food; his skin softens and his
    hair shines, although he is not eating hay.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The baker and cook watch through a hole, see the ass eating, laugh, and call
    household servants to witness the ass's appetite.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The master of the house also looks through the hole, enjoys the sight, orders
    the door opened, and has the ass brought into his parlor as a novelty.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: In the parlor, the ass greedily eats untouched table foods and foods described
    as ones every ass would abhor, while onlookers laugh.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A servant suggests giving the ass drink; the master orders a pot filled with
    wine, and the ass drinks the cup at one draught.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The delighted master pays the baker and cook four times what they paid for
    the ass, entrusts him to a rich Libertine, and the Libertine begins teaching him
    many qualities, including to sit at table.
  category: sequence
  evidence_refs:
  - ev:10
