canonical_text:
  quote: ''
  summary: Psyches secretly beholds her divine husband Cupid, sees his beauty and
    weapons, wounds herself with one of his arrows, and accidentally burns him with
    oil from her lamp. Cupid declares that trust has been broken, rebukes her, and
    departs. Psyches attempts to drown herself, but the river casts her onto the bank.
    Pan counsels her to worship Cupid rather than die. Psyches then visits one of
    her sisters and recounts the discovery of Cupid and his departure, adding that
    Cupid said he would take that sister as wife and ordered Zephyrus to carry Psyches
    away.
  language: English
  quote_policy: summarized
