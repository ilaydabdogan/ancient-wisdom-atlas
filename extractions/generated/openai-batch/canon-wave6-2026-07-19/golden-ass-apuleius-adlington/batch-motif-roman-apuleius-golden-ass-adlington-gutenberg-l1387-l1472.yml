  quote: reduce the soule of this man from hell, and to revive his body for the triall
    hereof
  summary: A hired watcher is employed to guard a dead husband’s body through the
    night after witnesses certify its bodily integrity. He sees a weasel, falls asleep,
    and at dawn the body is found undiminished. After being paid, he is beaten and
    expelled for an ill-judged offer of future service. During the funeral procession,
    an old man accuses the widow of poisoning her husband and brings forward Zachlas,
    an Egyptian ritual specialist, to recall the dead man’s soul and revive the body
    for testimony.
  language: English
  quote_policy: quoted
