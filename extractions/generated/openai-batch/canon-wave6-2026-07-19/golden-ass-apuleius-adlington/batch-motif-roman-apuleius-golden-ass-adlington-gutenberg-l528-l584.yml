canonical_text:
  quote: How Meroe the Witch turned divers persons into miserable beasts.
  summary: 'The passage recounts Socrates'' report of Meroe''s witchcraft: she transforms
    several people into animals, causes a rival wife to remain pregnant for years,
    magically imprisons the townspeople until they swear not to harm her, and relocates
    the chief instigator''s house to a distant waterless hill-town. The hearer expresses
    fear and urges departure before daybreak.'
  language: English
  quote_policy: quoted
