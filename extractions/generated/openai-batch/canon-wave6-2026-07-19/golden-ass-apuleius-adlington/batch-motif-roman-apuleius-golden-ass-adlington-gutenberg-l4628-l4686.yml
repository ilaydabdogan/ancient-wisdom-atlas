canonical_text:
  quote: I will make sacrifice with the bloud of thine eies upon the grave of my husband.
  summary: Charites deceives Thrasillus into drugged sleep, accuses him of murdering
    her husband Lepolemus, blinds him with a needle, goes to Lepolemus's tomb with
    his sword, kills herself there, and is buried in the same sepulchre. Thrasillus
    later enters the sepulchre, addresses the offended dead spirits, and resolves
    to starve himself as a bodily sacrifice.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A disguised man goes to a chamber where a nurse, acting by her mistress's
    appointment, gives him mingled and dosed drink in a cup with flattering talk until
    wine and speech make him fall asleep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Charites comes in after the man is asleep, stands over him, and calls him
    the murderer of her husband and the deviser of means for her destruction.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Charites says she will not kill the sleeping man with sword or other weapon,
    but will deprive him of sight and make a sacrifice with the blood of his eyes
    upon her husband's grave.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Charites takes a great needle from her head and pricks out both of the sleeping
    man's eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Charites takes the naked sword that her husband Lepolemus used to wear and
    runs through the city toward his sepulchre.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People from the house and city run after Charites to take the sword from her,
    but she clasps Lepolemus's tomb and keeps them away with the weapon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the tomb, Charites tells the mourners not to lament, says she has avenged
    her husband and punished the breaker of their marriage, and says it is time to
    seek Lepolemus by finishing her life with the sword.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Charites relates the matter, declares the vision she saw and how she deceived
    Thrasillus, then thrusts the sword under her right breast, wallows in her blood,
    and dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Charites's friends bury her body within the same sepulchre.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Thrasillus hears the matter, goes to the same sepulchre, addresses the dead
    spirits he has offended, says he sacrifices his whole body to them, closes the
    sepulchre, and intends to starve there in sorrow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A young man reports these events with sighs and tears to cowherds and shepherds,
    who weep and prepare to depart because they fear new masters.
  category: sequence
  evidence_refs:
  - ev:7
