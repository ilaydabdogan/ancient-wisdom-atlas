canonical_text:
  quote: ''
  summary: A young man delays and avoids his stepmother's illicit demand, seeks advice
    from a sage old man, and is advised to flee. The stepmother, angered by his refusal,
    conspires with a servant to poison him, but her own younger son drinks the poisoned
    wine and dies. She then accuses the young man to his father and to legal authorities.
    Public pressure for stoning is restrained by judicial procedure, witnesses are
    called, and the guilty servant begins false testimony against the young man. The
    narrator says he knows the court proceedings by report because he was bound at
    a manger.
  language: English
  quote_policy: summarized
