canonical_text:
  quote: ''
  summary: After the thieves fall asleep from drinking, Lepolemus carries the maiden
    home on the ass. The city receives her joyfully, the thieves’ cave is plundered,
    and the thieves are killed. The maiden marries Lepolemus and asks that the ass
    be honored. The ass hopes for rest, liberty, and roses that might restore him
    to human form, but he is instead made a mill animal, beaten, underfed, and later
    attacked by stallions when released into pasture. The narrator compares this attack
    to histories of a Thracian king whose wild horses tore guests apart.
  language: English
  quote_policy: summarized
