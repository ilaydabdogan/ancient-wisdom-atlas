canonical_text:
  quote: ''
  summary: In a public judicial setting, an old man identified as captain of the night
    watch accuses Apuleius of killing three citizens and hiding overnight. Apuleius
    answers that he drew his sword because he believed the three men were thieves
    breaking into Milo’s house and threatening murder. He describes killing them in
    combat, argues that he acted without malice or gain, appeals with tears to the
    people and the gods, and then notices the crowd and Milo laughing at him.
  language: English
  quote_policy: summarized
