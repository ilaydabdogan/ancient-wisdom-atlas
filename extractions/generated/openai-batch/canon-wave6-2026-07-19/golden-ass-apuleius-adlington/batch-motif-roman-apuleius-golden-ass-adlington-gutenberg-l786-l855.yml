canonical_text:
  quote: ''
  summary: The narrator enters Hipata, asks an old woman about Milo, learns of Milo’s
    wealth and avarice, and goes to his barred house. A maid admits him after he explains
    that he has brought letters from Demeas of Corinth. Milo receives him in a sparse
    household, offers lodging, alludes to Theseus accepting a poor cottage, orders
    Fotis to prepare washing and baths, and the narrator asks Fotis to buy fodder
    for his horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After two companions have departed, the narrator enters the city and asks
    an old woman whether it is called Hipata.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman confirms the city name and indicates Milo’s dwelling by bay
    windows near the city gates and a lane.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman describes Milo as wealthy in money and substance, avaricious,
    a usurer, living in a small house with his wife and one maid.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator reaches Milo’s fast-barred door and knocks; the maid initially
    assumes the visitor is seeking to borrow money and asks about a pledge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator says he has come from Corinth with letters from Demeas, Milo’s
    friend; the maid reports this inside and then invites him to enter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside, Milo is sitting on a little bed near supper, his wife sits at his
    feet, and there is no meat on the table.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Milo reads Demeas’s letters, thanks Demeas for sending the narrator, and calls
    the narrator a worthy guest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Milo tells his wife to move so the narrator can sit in her place, and says
    he has no other stool or household goods because of fear of robbery.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Milo offers the narrator a chamber and poor lodging, and says acceptance would
    resemble Theseus, who did not disdain Hecades’ poor cottage.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Milo orders Fotis to carry the narrator’s packet to the chamber, bring water
    and a towel, and take him to the baths.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator says most of these services are unnecessary, but asks Fotis to
    use money to buy hay and oats for his horse.
  category: action
  evidence_refs:
  - ev:6
