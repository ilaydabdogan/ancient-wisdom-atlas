canonical_text:
  quote: ''
  summary: The first-person narrator recalls the thieves' planned death for himself
    and the maiden. A thief deposits stolen crowns, reports the losses among the band,
    and urges recruitment of new members. He brings in a tall young man who asks to
    join, claims to be the renowned Thracian thief Hemes, and recounts losing his
    former band after robbing an exiled imperial official and his loyal wife Platina.
    Platina had disguised herself as a man to accompany her husband, raised an alarm
    during the robbery, and later petitioned Caesar for vengeance. Hemes says he escaped
    the imperial soldiers by dressing as a woman and riding an ass carrying barley
    sheaves, then offers two thousand crowns as a dowry to the band.
  language: English
  quote_policy: summarized
