  evidence_refs:
  - ev:4
- id: obs:7
  text: Each sister contrasts Psyches' fortune with her own unhappy marriage and servitude.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sisters decide to deprive Psyches of her bliss, conceal the visit and
    her prosperity from their parents, and later return to suppress her pride.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The sisters hide the treasure Psyches gave them, tear their hair, renew false
