  - ev:1
- id: obs:2
  text: Psyches commands Zephyrus, by her husband's appointment, to bring her sisters
    down; Zephyrus carries them with gentle blasts and sets them softly in the valley.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Psyches welcomes her sisters into her house, shows them treasure-storehouses,
    has them hear the serving voices, and provides bath and food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After eating the divine delicacies, the sisters become envious and one asks
    what Psyches' husband is, what his estate is, and who is lord of the house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Psyches remembers a promise to her husband, gives a fabricated description
