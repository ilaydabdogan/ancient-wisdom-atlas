canonical_text:
  quote: ''
  summary: Psyches' elder sisters find the hill where she had been exposed, are carried
    down by Zephyrus, and are welcomed by Psyches into her richly served house. After
    seeing her treasures and unseen servants, they become envious, question her husband's
    identity, receive gifts, and return home. They complain of their own marriages,
    resent Psyches' divine prosperity, agree to conceal her condition from their parents,
    feign renewed mourning, and plot her destruction.
  language: English
  quote_policy: summarized
