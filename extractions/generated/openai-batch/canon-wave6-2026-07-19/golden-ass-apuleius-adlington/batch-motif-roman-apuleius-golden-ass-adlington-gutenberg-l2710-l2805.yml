canonical_text:
  quote: ''
  summary: Psyche, admired for divine beauty yet left unwedded, is assigned by Apollo's
    oracle to a high rock as bride of a nonhuman serpent-like power. Her marriage
    procession is conducted like a funeral; she is left on the rock, carried gently
    by Zephyrus into a flowered valley, and discovers a divine palace beside a river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Psyche is admired and praised for her beauty, but no king, prince, or other
    superior suitor comes to woo her, while her two sisters are married to kings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Psyche's father suspects that heavenly powers envy her condition and consults
    Apollo's oracle at Milet, praying and sacrificing for a husband for his daughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Apollo's oracle orders that Psyche be dressed in mourning and set on a high
    rock, and describes her husband as nonhuman, serpent-like, winged, fiery, and
    powerful over gods, Jove, rivers, and deadly floods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The preparations for Psyche''s marriage are described with mourning features:
    black torches, cries instead of songs, ended hymeneal melody, tears, and civic
    lamentation.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The procession brings Psyche not to ordinary marriage but toward what the
