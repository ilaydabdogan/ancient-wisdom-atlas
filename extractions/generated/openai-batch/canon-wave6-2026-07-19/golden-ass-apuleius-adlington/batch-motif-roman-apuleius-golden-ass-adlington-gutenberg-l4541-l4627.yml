canonical_text:
  quote: ''
  summary: News of Lepolemus’ death reaches Charites, who laments publicly, embraces
    the corpse, and is restrained from killing herself. Thrasillus outwardly mourns
    but secretly rejoices and presses his desire for Charites. Charites continues
    grieving, honors an image of her dead husband, and rejects Thrasillus’ marriage
    demand. In sleep, the shape of Lepolemus appears, warns her not to join Thrasillus,
    and says Thrasillus killed him with a spear rather than a boar. Charites hides
    the vision, plans revenge and her own death, and deceives Thrasillus by arranging
    a secret midnight meeting.
  language: English
  quote_policy: summarized
