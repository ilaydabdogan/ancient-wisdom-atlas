  summary: A theatrical enactment presents Mercury delivering a golden apple to Paris
    by Jupiter's command. Juno, Pallas, and Venus appear with distinctive regalia
    and attendants, each offering Paris a reward if he judges her fairest. Paris gives
    the apple to Venus. The narrator then moralizes about corrupted and unjust judgments,
    citing Paris, Palamedes, Ajax, Ulysses, Socrates, and contemporary judges, before
    returning to the narrative.
  language: English
