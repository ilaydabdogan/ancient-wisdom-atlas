canonical_text:
  quote: received humane shape, and felt, heard and walked
  summary: Fotis explains that she substituted yellow hair from sheared goat skins
    for hair resembling Boetius. Her mistress used ritual materials, charms, liquids,
    perfumes, and fire so that the goat-skin bodies took human form and came to the
    door in Boetius's place. Lucius, drunk and deceived by night, killed three goat
    skins, then jokingly compared himself to Ajax and Hercules. He asks Fotis to let
    him secretly observe and learn the mistress's sorcery; Fotis agrees despite danger,
    and the passage ends with Lucius and Fotis spending the night together.
  language: English
  quote_policy: quoted
