canonical_text:
  quote: the ground opened, and there appeared a great well and fountain of bloud
  summary: 'After the baker is hanged, the ass-narrator is sold to a poor gardener
    and endures labor and winter hardship. The gardener visits a hospitable villager,
    where a series of dreadful marvels occurs during a meal: a hen lays a living chick,
    blood wells from the ground, wine boils out of vessels, animals behave unnaturally,
    and the household fears divine anger. News then arrives that the host''s three
    sons are dead, followed by background on their friendship with an oppressed poor
    neighbor and conflict with a violent rich young man.'
  language: English
  quote_policy: quoted
