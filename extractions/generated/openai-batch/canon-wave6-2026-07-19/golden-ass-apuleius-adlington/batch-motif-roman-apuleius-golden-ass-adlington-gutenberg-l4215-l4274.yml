canonical_text:
  quote: ''
  summary: The first-person narrator, in ass form, is assigned to fetch wood daily
    from a high hill under a cruel boy driver. The boy overloads and beats him, ties
    thorns to his tail, and after being kicked retaliates by setting the dry load
    on fire. The ass escapes by plunging into rainwater, after which the boy claims
    the ass caused the fire himself.
