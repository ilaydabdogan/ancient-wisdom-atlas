canonical_text:
  quote: to see the shape of my person
  summary: Psyches enters a richly supplied house where bodiless voices serve her
    with bed, bath, food, wine, and music. At night an unknown husband comes to her,
    consummates the marriage, and leaves before dawn. Her parents and sisters mourn
    her; her husband warns her not to answer or look toward her sisters and later
    permits a visit, but warns her not to seek to see his shape. Psyches asks that
    Zephyrus bring her sisters down into the valley.
  language: English
  quote_policy: quoted
