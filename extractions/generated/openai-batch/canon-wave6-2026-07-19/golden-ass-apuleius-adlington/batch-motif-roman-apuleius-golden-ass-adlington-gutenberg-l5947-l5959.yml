canonical_text:
  quote: ''
  summary: 'A witness says that a young man bought poison, mixed it with wine, and
    attempted to have it given to a child, then offered it to his brother. After the
    witness finishes, the judges find the accused young man culpable and prepare to
    condemn him to the prescribed punishment for parricides: being sewn in a skin
    with a dog, cock, snake, and ape, after the customary use of white and black stones
    in a pot to determine acquittal or condemnation.'
