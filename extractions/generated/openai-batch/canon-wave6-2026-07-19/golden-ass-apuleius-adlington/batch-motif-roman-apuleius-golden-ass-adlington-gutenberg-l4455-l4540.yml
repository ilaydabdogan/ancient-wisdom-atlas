canonical_text:
  quote: ''
  summary: At midnight an unnamed young man from Charites' household sits by the fireside
    and reports that Charites has been miserably lost. He recounts how Thrasillus,
    a rejected suitor of Charites, entered her household under the guise of friendship
    after she married Lepolemus. Unable to separate the couple or obtain Charites,
    Thrasillus accompanies Lepolemus on a hunt, urges him to pursue a dangerous wild
    boar, secretly disables Lepolemus's horse, allows the boar to wound him, stabs
    him so the wound may be blamed on the boar, kills the beast, and then feigns mourning
    over the body.
  language: English
  quote_policy: summarized
