canonical_text:
  quote: ''
  summary: After the staged judgment of Paris, Juno and Pallas leave angrily while
    Venus rejoices. A saffron-colored scented flood from a hidden spout changes goats'
    white hair to yellow, and stage engines make the wooden hill disappear into the
    ground. An armed man demands a condemned woman intended for a spectacle involving
    the ass narrator; a bed is prepared. The narrator fears shame and death by the
    beast meant to devour the woman, escapes when unattended, runs to Cenchris, hides
    at the sea coast, lies on the sand at sunset, and falls asleep.
  language: English
  quote_policy: summarized
