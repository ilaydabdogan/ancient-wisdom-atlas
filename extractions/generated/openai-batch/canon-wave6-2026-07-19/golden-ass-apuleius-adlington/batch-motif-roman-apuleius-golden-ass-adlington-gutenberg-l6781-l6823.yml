canonical_text:
  quote: as it were by a new regeneration
  summary: The narrator joins a goddess procession after being restored from an ass
    to a man. The procession reaches the seacoast, where a priest consecrates and
    purifies a finely made ship and the people cast scented offerings and milk into
    the sea before the ship launches. The procession returns to the temple, divine
    images are placed in the goddess's secret chamber, a scribe announces the end
    of service, and the joyful crowd disperses while the narrator remains absorbed
    by the goddess's beauty and by memory of his suffering.
  language: English
  quote_policy: quoted
