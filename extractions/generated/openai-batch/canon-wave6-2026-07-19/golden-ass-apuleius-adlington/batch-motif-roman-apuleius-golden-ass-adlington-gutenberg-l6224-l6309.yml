canonical_text:
  quote: ''
  summary: 'The narrator describes a matron''s sexual encounter with him, the keeper''s
    and master''s plan to display such an act publicly, and the substitution of a
    condemned poor woman for the matron. The condemned woman''s backstory is then
    recounted: a daughter ordered killed at birth is secretly saved; her brother later
    supports and marries her to a friend; the brother''s jealous wife lures and kills
    the maiden with a stolen ring and a burning firebrand; after the brother becomes
    dangerously ill with grief, the wife hires a physician to poison him under the
    guise of a healing potion. The excerpt ends while she is demanding that the physician
    first drink some of the potion.'
  language: English
  quote_policy: summarized
