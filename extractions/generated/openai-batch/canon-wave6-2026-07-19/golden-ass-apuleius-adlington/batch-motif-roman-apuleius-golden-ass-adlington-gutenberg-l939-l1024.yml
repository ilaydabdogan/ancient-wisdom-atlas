canonical_text:
  quote: ''
  summary: Lucius wakes in Thessaly wanting to see marvels and, remembering reports
    of local sorcery, imagines ordinary objects, animals, trees, and waters as transformed
    humans. He wanders into the market, where an attendant of Byrrhena recognizes
    him. Byrrhena identifies him as her kinsman through his mother Salvia and invites
    him to her house. There Lucius views lifelike carvings of Victory, Diana, dogs,
    a cavern-like landscape with plants, fruit, and water, and an image of Acteon
    changed into a hart and killed by hounds after seeing Diana naked. Byrrhena then
    dismisses others and begins to speak privately about Lucius’s safety.
  language: English
  quote_policy: summarized
