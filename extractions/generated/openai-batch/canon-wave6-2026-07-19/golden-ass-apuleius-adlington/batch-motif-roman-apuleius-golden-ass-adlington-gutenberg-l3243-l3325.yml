canonical_text:
  quote: "“O Cupid take me a more worthy wife, and thou Zephyrus beare downe thy mistresse”"
  summary: After Psyche’s account, each of her sisters attempts to replace her as
    Cupid’s wife and dies by leaping from the mountain or rock. Psyche then travels
    seeking Cupid, who is wounded in Venus’s chamber. A gull tells Venus that Cupid
    is burned and that public gossip blames Venus and Cupid for disorder in marriage.
    Venus learns Psyche’s name, angrily confronts her wounded son, accuses him of
    disobedience and loving her enemy, and threatens to strip him of his divine implements
    and punish him with Sobriety’s aid.
  language: English
  quote_policy: quoted
