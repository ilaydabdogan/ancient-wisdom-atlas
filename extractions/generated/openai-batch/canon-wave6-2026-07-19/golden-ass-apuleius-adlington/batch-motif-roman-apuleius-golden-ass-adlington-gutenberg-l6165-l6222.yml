  summary: The first-person narrator, treated as an animal mount and performer, is
    luxuriously adorned, ridden by his master, and taken to Corinth, where crowds
    pay to see him. A wealthy matron becomes sexually desirous of him, explicitly
    compared to Pasiphae desiring a bull. She bribes his keeper for access, prepares
    a richly furnished chamber, anoints herself and the narrator with balm, declares
    her love, and draws him onto the bed while he reflects anxiously on the mismatch
    between her human body and his animal limbs, hooves, mouth, and teeth.
