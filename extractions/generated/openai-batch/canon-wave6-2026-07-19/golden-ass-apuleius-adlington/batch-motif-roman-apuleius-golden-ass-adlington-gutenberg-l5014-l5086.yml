canonical_text:
  quote: ''
  summary: The ass-narrator escapes a cook preparing to kill him, disrupts a feast,
    is then suspected of being infected by a mad dog, avoids an armed attack by entering
    a chamber, survives the night, and proves he is not mad by drinking clear water
    and behaving gently. He is then loaded again with the goddess Syria and other
    gear and taken onward with music to beg in villages.
  language: English
  quote_policy: summarized
