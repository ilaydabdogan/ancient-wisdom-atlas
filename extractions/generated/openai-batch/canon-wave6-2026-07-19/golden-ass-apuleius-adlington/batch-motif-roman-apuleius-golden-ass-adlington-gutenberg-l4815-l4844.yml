canonical_text:
  quote: ''
  summary: Travelers lodge in a village and hear of a household servant who, though
    married, frequented a town harlot. His jealous wife burns his property and account
    books, ties their child to herself, and jumps into a deep pit. The master punishes
    the servant by stripping him, smearing him with honey, and binding him to a fig-tree
    where ants consume his flesh. Villagers recount the matter, and the travelers
    leave the lodging.
