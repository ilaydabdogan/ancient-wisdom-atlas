  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In his account, Bellerophon says that as a young man he traveled through Thessaly,
    came to Larissa in poverty, and saw an old man in the marketplace offering a reward
    to anyone who would watch a corpse that night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A passerby explains that in Thessaly women witches bite morsels from the flesh
    and faces of dead men and use them for sorceries and enchantments.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passerby says a corpse watcher must keep his eyes continually on the corpse
