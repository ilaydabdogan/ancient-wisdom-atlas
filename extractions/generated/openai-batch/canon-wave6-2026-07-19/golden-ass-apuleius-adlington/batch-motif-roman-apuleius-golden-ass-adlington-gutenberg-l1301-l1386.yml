canonical_text:
  quote: these Witches do turn themselves into sundry kindes of beasts
  summary: At Byrrhena’s lavish supper, talk turns from the city’s amenities to witches
    who despoil corpses and mutilate living people. Bellerophon is prompted to recount
    how, in Larissa, he accepted a paid night watch over a corpse despite warnings
    that Thessalian witches shapeshift, enchant keepers to sleep, and cause failed
    guards to suffer matching bodily losses.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Lucius attends supper at Byrrhena’s house with strangers and leading people
    of the city amid richly described beds, vessels, servants, pages, wine, candles,
    and torches.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Byrrhena asks Lucius how he likes the country and praises the city’s temples,
    baths, household abundance, pleasure, ease, and hospitality to merchants and provincials.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lucius answers that he likes the place but fears witches who are said to dig
    up dead bodies, steal bones, cut off toes and fingers, uncover hearses, and spoil
    corpses for enchantments.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another guest says witches do not spare the living and mentions a nearby person
    whose nose and ears were cut off.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The company laughs and looks at Bellerophon; Byrrhena asks him to tell Lucius
    the tale of the loss of his nose and ears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bellerophon, after being pressed by Byrrhena, arranges the tablecloth and
