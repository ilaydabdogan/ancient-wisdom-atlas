canonical_text:
  quote: ''
  summary: A woman uses poison to kill her husband, the physician involved, the physician’s
    wife, and her own daughter. The physician’s wife exposes the crimes before dying,
    and the woman is condemned to be eaten by wild beasts. The ass-narrator is appointed
    to a public spectacle with the condemned woman, considers suicide but lacks hands,
    and hopes spring roses will restore his human shape. At the theater, dancers appear,
    followed by a staged wooded hill resembling Homeric Ida, with a fountain, goats,
    and a shepherd representing Paris.
