canonical_text:
  quote: ''
  summary: The narrator recounts how visions and commands from Osiris lead him to
    a marked priest, Asinius Marcellus, who is also instructed by an oracular image
    of Osiris. Poverty delays the narrator's religious appointment, but he sells his
    robe, undertakes abstinence and fasting, attends nocturnal sacrifices of Serapis,
    and is called to a third religious order. Osiris later appears and directs him
    into legal and civic office, where he serves with a shaven crown.
  language: English
  quote_policy: summarized
