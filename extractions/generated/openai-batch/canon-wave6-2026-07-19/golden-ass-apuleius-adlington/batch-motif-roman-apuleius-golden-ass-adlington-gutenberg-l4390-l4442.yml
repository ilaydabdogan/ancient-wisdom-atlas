canonical_text:
  quote: I had died as Meleager did by the sticke, which his mad mother Althea cast
    into the fire.
  summary: After a boy's death, the narrator, called a beast, is threatened with castration
    and beheading on the next day. The boy's mother mourns, enters the stable, accuses
    the beast of failing to save his master, binds his feet, beats him with a bar,
    and burns him with a firebrand. The narrator defends himself by throwing dung
    into her face and eyes, forcing her to stop, and compares the danger to Meleager's
    death by a stick cast into fire by Althea.
  language: English
  quote_policy: quoted
