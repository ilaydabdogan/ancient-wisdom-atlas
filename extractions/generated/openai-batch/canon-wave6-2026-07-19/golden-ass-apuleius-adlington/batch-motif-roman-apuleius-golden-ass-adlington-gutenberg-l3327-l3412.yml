canonical_text:
  quote: ''
  summary: Juno and Ceres attempt to calm Venus, who is angry at Psyches and Cupid.
    Venus refuses to be appeased. Psyches wanders in search of her husband, climbs
    to a mountain temple of Ceres, orders the neglected harvest objects there, and
    begs Ceres for hiding-place and mercy. Ceres is moved but refuses because of her
    amity with Venus. Psyches then goes to a forest temple of Juno, prays at the altar
    for advocacy and deliverance, and Juno appears but begins to refuse aid because
    of Venus.
  language: English
  quote_policy: summarized
