canonical_text:
  quote: ''
  summary: The narrator, an ass, describes being taught to leap, dance, nod in answer
    to speech, and look at a pot to request drink. He obeys the training though he
    says he could have performed these acts without instruction, because he fears
    being treated as a strange wonder and thrown to wild beasts. His fame spreads,
    making his master Thiasus renowned. Thiasus is identified as a Corinthian man
    of high office who plans three days of public entertainments and travels to Thessaly
    to buy excellent beasts and fighters.
  language: English
