canonical_text:
  quote: ''
  summary: The priests of the goddess Siria use written lots to give profitable fortune-telling
    answers. After leaving by night with the narrator-ass, they are overtaken by armed
    townspeople, accused of stealing a golden cup under cover of religion, searched,
    and imprisoned after the cup is found hidden with the goddess image. The narrator
    is then sold to a baker, loaded with corn, taken to the bakehouse, and made to
    turn a mill with his face covered; after resisting, he is beaten into work and
    later watches the baker's craft with curiosity.
  language: English
  quote_policy: summarized
