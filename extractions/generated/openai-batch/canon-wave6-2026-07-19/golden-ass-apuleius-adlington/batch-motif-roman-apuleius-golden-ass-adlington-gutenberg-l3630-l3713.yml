    Mount Tenarus toward hell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the route, Psyche passes a lame ass, pays for passage, ignores an old man
    in the river, refuses to help a woman spinning, and feeds a ravenous dog with
    a sop.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Psyche reaches Proserpina's chamber, refuses a royal seat and delicate food,
    kneels at Proserpina's feet, eats coarse bread, declares her message, and receives
    a secret in a box.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After leaving Proserpina, Psyche gives the dog another sop and pays the boatman
    another half-penny.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After returning from hell to the light of the world, Psyche wants to take
    some of the divine beauty from the box to please her love.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Psyche opens the box, she finds no beauty, but an infernal and deadly
    sleep overtakes her and she falls to the ground like a sleeping corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cupid, healed from his wound, escapes through a window, regains his wings,
