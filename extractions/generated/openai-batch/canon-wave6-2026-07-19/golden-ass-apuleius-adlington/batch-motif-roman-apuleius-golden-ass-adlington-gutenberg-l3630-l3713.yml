canonical_text:
  quote: ''
  summary: Psyche is warned not to look inside a box containing divine beauty, travels
    by Mount Tenarus toward hell with coins and sops, passes underworld obstacles,
    receives a box from Proserpina, returns to the light, opens the box, and is overcome
    by deadly sleep. Cupid escapes confinement, finds her, removes the sleep, awakens
    her, and petitions Jupiter. Jupiter summons the gods, legitimizes Cupid and Psyche's
    union, has Mercury bring Psyche to heaven, gives her an immortality drink, and
    a divine wedding feast is held. Psyche later bears a child called Pleasure. The
    episode is framed as a tale told by an old woman to a captive maiden and overheard
    by the ass narrator.
  language: English
  quote_policy: summarized
