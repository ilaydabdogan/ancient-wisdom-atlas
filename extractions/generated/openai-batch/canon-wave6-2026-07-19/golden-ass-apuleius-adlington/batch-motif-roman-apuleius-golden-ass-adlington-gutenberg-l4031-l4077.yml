  quote: '"Therefore if you put this virgin in the Asses belly, you shall but execute
    your indignation against her, without all manner of profit"'
  summary: A newly accepted captain of thieves is told that a bound gentlewoman and
    the ass who carried her have been sentenced to death. He argues that killing the
    woman by placing her in the ass's belly would bring no profit, and advises selling
    her instead. After deliberation, the thieves accept his advice and unbind the
    maiden; the ass-narrator observes her smile and judges her motives.
