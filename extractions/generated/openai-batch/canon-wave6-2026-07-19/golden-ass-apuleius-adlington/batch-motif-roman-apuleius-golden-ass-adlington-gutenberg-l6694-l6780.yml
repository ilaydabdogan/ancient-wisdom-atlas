canonical_text:
  quote: I was transformed from an asse to my humane shape
  summary: A procession of Isis displays ritual objects, divine figures, secret sacred
    items, and a serpent-marked vessel. A priest gives Lucius a garland of roses,
    which he eats and is restored from ass form to human form. The priest clothes
    him and declares that Isis has delivered him from Fortune and calls him to join
    the goddess’s holy service.
  language: English
  quote_policy: quoted
