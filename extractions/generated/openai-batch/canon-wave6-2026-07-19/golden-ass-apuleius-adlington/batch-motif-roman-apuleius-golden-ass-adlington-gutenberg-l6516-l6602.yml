canonical_text:
  quote: ''
  summary: At midnight Lucius wakes in fear, sees the full moon over the sea, purifies
    himself by plunging seven times into the sea, and prays to a powerful goddess
    under several possible names for release from his ass-shape and misfortune. He
    falls asleep and sees a divine female figure rise from the sea, adorned with lunar,
    vegetal, serpent, starry, musical, and regal objects. The goddess addresses him
    as Lucius, says his prayers have moved her, identifies herself as the universal
    mother and ruler of elements worshipped under many names, especially as Queen
    Isis by Egyptians, and promises aid.
  language: English
  quote_policy: summarized
