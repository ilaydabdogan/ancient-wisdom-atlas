canonical_text:
  quote: ''
  summary: Barbarus, jealous of his wife, leaves her under the custody of his servant
    Myrmex with severe threats if any man touches her. Philesiterus, attracted to
    the guarded matron, offers gold to Myrmex and the wife; Myrmex is overcome by
    desire for the money and arranges a nighttime meeting. Barbarus unexpectedly returns,
    Philesiterus escapes but leaves slippers under the bed, and Barbarus binds Myrmex
    to take him before the Justice. On the road Philesiterus invents a false explanation,
    accusing Myrmex of stealing the slippers from the baths, and Barbarus orders the
    slippers returned to him.
  language: English
  quote_policy: summarized
