canonical_text:
  quote: ''
  summary: A band of robbers disguises Thrasileon in a bear skin, presents him to
    Demochares as a gift through forged letters, arranges access to the house, stages
    the robbery from a hidden sepulchre, and Thrasileon is discovered and attacked
    by dogs while still in the bear disguise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The robbers devise a plan in which one of them will wear a bear skin, pretend
    to be a bear, and be led to Demochares's house at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thrasileon volunteers for the role because he is described as courageous in
    body and mind.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bear skin is fastened around Thrasileon, the seam is hidden with hair,
    and holes are made in the bear head for seeing and breathing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The group uses a hired cave during the preparation, and Thrasileon enters
    it in the manner of a bear.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The robbers forge letters in the name of Nicanor, presenting the bear as a
    hunting gift for Demochares.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Demochares accepts the apparent bear and gives the bear-bringers ten crowns;
    spectators gather, and Thrasileon frightens them away to prevent close inspection.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator advises Demochares to house the bear in an open place near water
    and shade rather than among diseased beasts, and the robbers offer to watch it
    overnight.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After leaving Demochares, the robbers find a large hidden sepulchre off the
    highway and use it for their purpose.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: At night the armed robbers surround Demochares's house, Thrasileon opens the
    way in, and the robbers break open a treasure counter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The robbers carry gold and silver to the sepulchre while the narrator watches
    at the gate.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Thrasileon, still appearing as the bear, runs around the house to frighten
    any household members who wake.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A boy sees the bear from a window and alerts the household servants, who come
    out with lights, weapons, greyhounds, and mastiffs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Thrasileon fights the dogs despite being nearly dead, tumbles out of the house,
    and is pursued by dogs from the street as well.
  category: action
  evidence_refs:
  - ev:10
