canonical_text:
  quote: he is yet alive and doth but sleepe
  summary: A reputable elderly physician interrupts a legal execution, testifies that
    a servant sought poison, produces a sealed purse as proof, and later reveals that
    he substituted a Mandragora sleeping draught for poison. The child thought dead
    is found rising in the sepulchre, the servant and stepmother are exposed, and
    legal punishments and rewards follow.
  language: English
  quote_policy: quoted
