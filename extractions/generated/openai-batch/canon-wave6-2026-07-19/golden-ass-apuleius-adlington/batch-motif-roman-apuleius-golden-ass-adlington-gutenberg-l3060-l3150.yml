canonical_text:
  quote: ''
  summary: Psyche's sisters suspect she has never seen her husband and exploit this
    by claiming he is a deadly serpent foretold by Apollo's oracle. Frightened, Psyche
    admits she knows him only by his night-time voice and that he warned her not to
    look at him. The sisters instruct her to hide a lamp and razor and kill him while
    he sleeps. After inner wavering, Psyche brings the lamp and razor to the bed and
    sees Cupid asleep instead of a serpent.
  language: English
  quote_policy: summarized
