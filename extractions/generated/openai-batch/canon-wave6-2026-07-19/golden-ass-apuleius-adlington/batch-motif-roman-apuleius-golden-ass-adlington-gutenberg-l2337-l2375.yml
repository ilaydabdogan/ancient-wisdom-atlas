  quote: ''
  summary: After an unnamed companion dies from a violent fall and is thrown into
    a river, the group leaves Thebes for Platea. There they encounter Demochares,
    a wealthy man preparing public games with weapons, hunting structures, wild beasts,
    and condemned persons to fight the beasts. His costly bears sicken and die; common
    people eat their flesh. Babulus and the narrator take one large bear, remove and
    dry its skin while keeping the claws and head attached.
