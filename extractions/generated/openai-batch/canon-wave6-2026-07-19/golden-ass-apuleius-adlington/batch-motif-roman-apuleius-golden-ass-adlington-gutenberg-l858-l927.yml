canonical_text:
  quote: ''
  summary: Lucius goes to the market before the baths and buys fish. He meets his
    old acquaintance Pithias, now clerk of the market, who condemns the fishmonger
    for overcharging and has Lucius's fish trampled. Lucius washes, returns without
    money or food, is summoned by Fotis to Milo's supper, and is compelled by Milo
    to endure questioning until he falls asleep and goes to rest.
  language: English
