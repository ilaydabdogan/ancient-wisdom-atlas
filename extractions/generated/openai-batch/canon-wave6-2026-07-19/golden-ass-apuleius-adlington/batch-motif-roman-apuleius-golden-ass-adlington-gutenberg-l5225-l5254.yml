canonical_text:
  quote: ''
  summary: The first-person speaker describes poor slaves who are beaten, branded,
    ragged, smoke-blackened, and otherwise distressed. He then describes old and weakened
    horses suffering wounds and exhaustion from labor. Seeing this, he fears coming
    to the same condition, remembers his former human state, laments, and refuses
    food. His only consolation is that he can understand what people say while they
    do not fear his presence. He recalls Homer’s idea that a man becomes wise through
    travel among many lands and nations, and he says his ass-state has given him experience
    and wisdom despite misery. He then introduces a jest he will tell.
  language: English
