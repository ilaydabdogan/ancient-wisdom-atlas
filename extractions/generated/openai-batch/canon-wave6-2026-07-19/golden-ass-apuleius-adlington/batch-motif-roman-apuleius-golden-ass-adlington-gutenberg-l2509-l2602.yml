canonical_text:
  quote: ''
  summary: Robbers return to their cave with a young gentlewoman as a captive for
    ransom. She laments her seizure, confinement, and separation from family and betrothed.
    She recounts that armed thieves abducted her from her mother’s arms on her wedding
    day, disrupting the marriage rites. She reports a dream in which her bridegroom
    follows her tracks and is killed by a thief with a stone.
  language: English
  quote_policy: summarized
