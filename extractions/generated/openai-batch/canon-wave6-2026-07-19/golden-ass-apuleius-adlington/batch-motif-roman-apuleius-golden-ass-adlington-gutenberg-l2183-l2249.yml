  summary: The narrator, an overburdened ass traveling with thieves, plans to collapse
    near a river and refuse to continue. Another ass fakes collapse first and is destroyed
    by the thieves. The narrator abandons deception, reaches the thieves' fortified
    den, and observes the thieves tying the animals and rebuking an old woman who
    promises food, wine, and hot water.
