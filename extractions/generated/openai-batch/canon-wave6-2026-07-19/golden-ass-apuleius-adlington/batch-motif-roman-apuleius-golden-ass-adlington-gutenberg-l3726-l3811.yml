canonical_text:
  quote: ''
  summary: Thieves drive the ass-shaped narrator Lucius to a cave, load him with stolen
    goods, beat him, and discuss killing him. Fearing death, Lucius breaks his halter
    and runs. An old woman tries to stop him, but he kicks her down. A captive gentlewoman
    seizes the halter, mounts him, prays to the gods for deliverance, and promises
    honors and memorial fame if the ass brings her safely home. She compares the rescue
    to mythic accounts of Phryxus on the ram, Arion on the dolphin, Europa by the
    bull, and Jupiter’s transformation into a bull. At a three-way junction she tries
    to turn toward her father’s house, but Lucius resists because the thieves have
    gone that way.
  language: English
  quote_policy: summarized
