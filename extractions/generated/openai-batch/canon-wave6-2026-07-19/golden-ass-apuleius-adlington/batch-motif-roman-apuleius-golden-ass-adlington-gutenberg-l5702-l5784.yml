canonical_text:
  quote: "“The shadow of the Asse.”"
  summary: A gardener traveling with the ass is confronted by an arrogant soldier,
    resists the soldier's attempted seizure of the ass, beats him, and flees to a
    friend's house. The friend hides the gardener in a chest and the ass upstairs.
    Soldiers later search the house under a false accusation. The ass looks out of
    a window, its shadow is seen, and both the ass and the hidden gardener are discovered.
    The episode is said to give rise to the proverb concerning the ass's shadow.
  language: English
  quote_policy: quoted
