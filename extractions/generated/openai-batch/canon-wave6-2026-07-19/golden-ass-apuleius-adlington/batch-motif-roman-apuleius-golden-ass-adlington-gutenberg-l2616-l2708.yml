canonical_text:
  quote: ''
  summary: The passage opens the tale of Cupid and Psyche. A western king and queen
    have three beautiful daughters, of whom the youngest, Psyche, is so admired that
    people worship her as Venus. Venus's cult is neglected as Psyche receives divine
    honors. Angered by this transfer of worship, Venus calls her winged son Cupid
    and commands him to punish Psyche by making her love the most miserable creature.
    Venus then travels toward the sea and is attended by sea deities.
