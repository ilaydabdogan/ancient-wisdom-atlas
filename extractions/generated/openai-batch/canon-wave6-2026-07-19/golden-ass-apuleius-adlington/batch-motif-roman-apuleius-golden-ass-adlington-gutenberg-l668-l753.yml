canonical_text:
  quote: ''
  summary: The first-person narrator tries to leave at night but is challenged by
    the hostler, who warns that the roads are dangerous and suspects him of crime.
    Fearing accusation and recalling Meroe and Cerberus at hell-gate, the narrator
    attempts to hang himself with bed-rope; the rope breaks and he falls on Socrates.
    Socrates wakes alive, and the narrator later departs with him. In daylight the
    narrator finds no throat wound and treats the events as a wine-dream, but Socrates
    reports dreaming that his throat was cut and his heart removed. Under a plane
    tree, Socrates eats bread and cheese, grows pale and weak, and becomes thirsty
    near running water.
  language: English
  quote_policy: summarized
