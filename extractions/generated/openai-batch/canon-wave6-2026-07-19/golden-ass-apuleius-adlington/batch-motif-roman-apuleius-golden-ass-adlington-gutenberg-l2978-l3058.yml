  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Psyche asks her husband to command Zephyrus to bring her sisters so she may
    be comforted by seeing them, while still professing that her husband is her only
    light.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The husband yields to Psyche's plea after her embraces and tears, and leaves
