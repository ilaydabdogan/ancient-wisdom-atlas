- id: obs:2
  text: The husband says the child in Psyche's womb will become an immortal god if
    she obeys, but a mortal creature otherwise; Psyche rejoices at the prospect of
    a divine babe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sisters are described as wicked furies breathing serpentine poison, and
    the husband later describes them as blood enemies who will come like Syrens to
