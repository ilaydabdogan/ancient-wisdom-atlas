canonical_text:
  quote: ''
  summary: Psyche's unseen husband warns her at night that her sisters will try to
    make her behold his face, and says the child in her womb will be immortal if she
    obeys but mortal otherwise. Psyche persuades him to let her sisters visit again.
    Zephyrus carries the sisters safely down from the rock to the valley. They flatter
    Psyche about her pregnancy, enjoy the palace's unseen music and abundance, question
    her about her husband, and she gives a new invented answer before sending them
    away with gold and silver.
  language: English
  quote_policy: summarized
