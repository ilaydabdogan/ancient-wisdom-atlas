  summary: The narrating ass and a maiden are recaptured by thieves after an attempted
    escape. The ass is beaten, an old woman is found hanged from a cypress branch
    and cast into a ditch, and the thieves debate punishments for the maiden. One
    thief proposes killing and gutting the ass, sewing the maiden inside his belly,
    and leaving them on a stone under the heat of the sun; the thieves consent and
    the ass laments his expected death.
