canonical_text:
  quote: ''
  summary: Fotis comes privately to Apuleius, confesses she caused his recent trouble
    through another's command, offers him a whip for punishment, then bars the chamber
    door and reveals her mistress's witchcraft. She says the mistress can affect infernal,
    celestial, divine, and elemental powers, is especially dangerous when desiring
    young men, currently desires a Boeotian, and commanded Fotis to gather his hair
    from a barber's floor for sorcery. The barber caught Fotis, accused her of stealing
    young men's hair for wicked sorceries, took the hair away, and threatened legal
    complaint.
  language: English
  quote_policy: summarized
