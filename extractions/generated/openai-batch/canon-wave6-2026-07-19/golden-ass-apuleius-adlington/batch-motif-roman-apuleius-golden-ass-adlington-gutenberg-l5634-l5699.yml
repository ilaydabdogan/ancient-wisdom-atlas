canonical_text:
  quote: ''
  summary: A rich tyrannical man rejects civic remonstrance, expels a poor man, and
    unleashes dogs on the assembled helpers. The dogs kill the youngest of three brothers;
    the surviving brothers attempt revenge, and the tyrant kills or wounds another.
    The last brother feigns injury, disarms the tyrant, kills him with his own dagger,
    and then kills himself. The account is said to have been signified by dreadful
    wonders in a good man's house; the good man hears the news and kills himself,
    and the Gardener returns home in tears on the narrator's back.
  language: English
  quote_policy: summarized
