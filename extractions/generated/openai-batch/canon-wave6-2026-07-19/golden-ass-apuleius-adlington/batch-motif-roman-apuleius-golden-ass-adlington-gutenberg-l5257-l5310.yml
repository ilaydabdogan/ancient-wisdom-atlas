canonical_text:
  quote: ''
  summary: In the fortieth chapter, the narrator in ass form is owned by a baker whose
    wife is described as cruel, adulterous, impious, and abusive. She forces the narrator
    to grind in the mill and be beaten. The narrator observes a secret lover and an
    old bawd connected to the wife, and notes that his long ears let him hear hidden
    conversations despite his covered eyes. The bawd criticizes the wife’s current
    lover, praises Philesiterus as a bolder lover, and begins an embedded story about
    Barbarus, a severe senator who keeps his wife enclosed under guard.
