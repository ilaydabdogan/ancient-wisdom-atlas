canonical_text:
  quote: ''
  summary: Aristomenus and Socrates share a chamber. Aristomenus fears the witch Meroe,
    bars the doors, and places his bed behind the door. At midnight the doors burst
    open, his bed overturns, and two old women enter with a torch, sponge, and sword.
    Meroe accuses Socrates of intending to abandon her and identifies Aristomenus
    as his counselor and witness. Meroe kills Socrates, catches his blood, removes
    his heart, and Panthia plugs the wound with a sponge. The women humiliate Aristomenus,
    depart, and the room’s fastenings return to place. Aristomenus fears being blamed
    for the murder and resolves to flee before daybreak.
  language: English
  quote_policy: summarized
