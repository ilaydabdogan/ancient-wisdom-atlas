canonical_text:
  quote: ''
  summary: Thrasileon, enclosed in a beast form, is attacked by dogs and armed men
    and dies without betraying his companions. A butcher cuts open the beast and reveals
    a thief inside. The surviving robbers hide treasure in a sepulchre, return home,
    commemorate their dead with gold cups and hymns to Mars, and then sleep while
    the old woman feeds the animals and the narrator eats bread.
  language: English
  quote_policy: summarized
