canonical_text:
  quote: ''
  summary: The ass-narrator is led by a boy to a hill and tied to an oak while the
    boy cuts wood. A great bear emerges from a nearby cave, causing the narrator to
    break his halter and flee. A passing stranger finds and rides the ass, but shepherds
    reclaim him, beat the stranger, and accuse him of stealing the ass and murdering
    the missing boy. The stranger says he only found the loose ass and wishes the
    ass could speak as a witness. The shepherds later find the boy’s body torn apart,
    bury the remains, and plan to bring the bound stranger before the authorities
    for murder.
