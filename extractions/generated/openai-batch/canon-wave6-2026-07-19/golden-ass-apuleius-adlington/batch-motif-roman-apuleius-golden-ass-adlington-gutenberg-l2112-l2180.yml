canonical_text:
  quote: ''
  summary: Lucius, in the form of an ass, is unloaded with other animals near a village,
    enters a garden in hunger, seeks red roses that he believes may restore him to
    human form, mistakes distant flowers for roses, discovers poisonous laurel roses
    by a riverbank, is beaten by a gardener, kicks the gardener down, is pursued by
    townspeople and dogs, then is bound and whipped until his dung forces the attackers
    to stop.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The thieves arrive at a village of acquaintances, unload the animals, share
    part of the treasure, and release the animals into a meadow to pasture.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ass is prevented by the other animals from feeding with them and goes
    into a garden behind the stable because he is hungry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ass eats raw green herbs in the garden and searches for red roses, believing
    that finding the remedy while alone would change him from an ass into Lucius unseen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ass sees at a distance what he thinks are bright damask-colored roses
    in a shadowed valley near a wood and associates the place in his mind with Venus
    and the Graces.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the ass reaches the place, he discovers there is no valley and no true
    roses, but a riverbank with thick trees bearing scentless flowers called laurel
    roses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The laurel roses are described as poisonous to beasts, yet the ass approaches
    intending to eat them despite knowing the danger.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A young gardener sees that the ass has eaten his herbs, comes with a staff,
    curses, and beats the ass nearly to death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ass kicks the gardener with his hind heels, leaving him lying at the foot
    of a hill nearly slain, and then runs away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The gardener’s wife cries over her injured husband, and townspeople respond
    by calling for dogs to tear the ass down.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A large group of bandogs and mastiffs comes out, and the ass runs back toward
    the stable from which he came.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The townspeople call in the dogs, bind the ass to a post, and scourge him
    with a knotted whip until he is nearly dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The ass’s dung spatters the attackers’ faces, causing them to stop beating
    him.
  category: action
  evidence_refs:
  - ev:8
