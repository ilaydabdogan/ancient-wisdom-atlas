canonical_text:
  quote: ''
  summary: 'A soldier loads the ass-narrator with military gear to frighten passersby
    and brings him to a captain''s house. There the narrator reports an embedded household
    tragedy: a beautiful stepmother falls violently in love with her virtuous stepson,
    shows bodily symptoms of love-sickness, summons him to her chamber, and urges
    him to satisfy her desire in secret.'
  language: English
  quote_policy: summarized
