canonical_text:
  quote: ''
  summary: The narrator-ass and other animals are brought to a populous city market.
    The horses are sold, but the ass resists repeated mouth examinations and bites
    a man's fingers, causing the crier to mock him. A mendicant associated with the
    goddess Syria bargains over the ass as a beast fit to carry the goddess's image.
    The new master, Phelibus, takes the ass home, where his daughters or household
    companions and a young musician react to him. The next day a brightly dressed
    and painted group clothes the goddess's image in purple, places it on the ass,
    and proceeds through villages with swords and axes, dancing, biting themselves,
    and wounding their arms.
  language: English
  quote_policy: summarized
