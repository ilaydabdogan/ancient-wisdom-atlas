canonical_text:
  quote: ''
  summary: Socrates recounts being robbed in a deep valley on his way from Macedonie
    to Larissa, then being received by Meroe, an old wine-seller. After a sexual encounter
    and lodging with her, he is rebuked by his companion, but warns him not to speak
    against Meroe because she is a powerful magician. Socrates describes her alleged
    powers over heaven, earth, water, spirits, gods, planets, hell, and the love of
    nearby and distant peoples.
  language: English
