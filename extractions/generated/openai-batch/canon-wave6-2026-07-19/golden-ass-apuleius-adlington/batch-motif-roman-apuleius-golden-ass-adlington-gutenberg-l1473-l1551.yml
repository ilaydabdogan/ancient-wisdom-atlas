canonical_text:
  quote: ''
  summary: A prophet temporarily revives a corpse by herbs and prayer to the Sun.
    The corpse complains of being recalled from Lethe and Styx, then identifies his
    wife as his poisoner and explains that witches, while trying to mutilate his body,
    instead mutilated his sleeping guard and replaced the guard's nose and ears with
    wax. The guard confirms the loss and flees in shame. After the tale, Byrrhena
    invites the outer narrator to the feast of the god Risus. Later, in darkness after
    his torch goes out, the narrator sees three large men at Milo's gates, supposes
    them thieves, kills them with his sword, is admitted by Fotis, and goes to sleep,
    comparing himself to Hercules after fighting Geryon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers ask not to overcome death permanently but to have a small space
    of life so that the matter may be known.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prophet lays one herb three times against the dead person's mouth and
    another herb on the dead person's breast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prophet turns toward the East and makes prayers to the Sun before the
    corpse begins to breathe, move, hold up its head, and speak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The revived corpse says he has tasted the water of Lethe and been in the deadly
    den of Styx, and asks to be left in quiet rest.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The prophet orders the corpse to state the cause of death before the people
    and threatens to use conjurations to torment the body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The corpse says he was poisoned by his wife and that his bed was yielded to
    an adulterer; the wife denies the accusation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The crowd debates the corpse's accusation, with some proposing that the wife
    be buried alive with her husband and others doubting the dead body's testimony.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The corpse says witches and enchantresses came at night to spoil his limbs,
    transformed themselves into beasts, and cast the body-guard into a deathlike sleep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The corpse says the body-guard, sharing the corpse's name and asleep under
    enchantment, rose when the witches called, and the witches cut off the guard's
    nose and ears instead of the corpse's.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The corpse says the witches made the guard a pair of wax ears and a wax nose
    to hide what they had done.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: When the guard touches his face, his nose and ears fall off; the crowd marvels
    and laughs, and he hides his disfigurement with hair and a cloth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: After Bellephoron finishes his tale, the table guests laugh, and Byrrhena
    describes the local feast of the god Risus and asks the outer narrator to devise
    a laughing matter for it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The outer narrator departs, his torch goes out, and in the dark he sees three
    large men forcing Milo's gates; he concludes they are thieves, draws his sword,
    and kills them.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: Fotis lets the outer narrator into the house after the killings; the narrator
    goes to his chamber and sleeps, likening himself to Hercules after the fight with
    King Geryon.
  category: sequence
  evidence_refs:
  - ev:7
