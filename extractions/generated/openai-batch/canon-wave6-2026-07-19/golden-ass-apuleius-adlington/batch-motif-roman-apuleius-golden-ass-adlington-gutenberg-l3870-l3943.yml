canonical_text:
  quote: ''
  summary: At dawn a member of the thieves' company returns to their cave and reports
    that the robbery of Milo's house has been publicly blamed on Lucius Apuleius.
    The report describes suspicions against Lucius, the imprisonment and torture of
    his servant, and pursuit toward Lucius's homeland. The transformed narrator laments
    his condition as an ass, reflects on blind Fortune, and tries unsuccessfully to
    deny the accusation because he cannot speak human words.
  language: English
  quote_policy: summarized
