canonical_text:
  quote: ''
  summary: The ass-narrator exposes the baker’s wife’s hidden lover by kicking him
    as he lies concealed in a bin. The baker punishes the young man and divorces his
    wife. The wife seeks an enchantress, first for reconciliation and then for an
    evil spirit to kill the baker. A ragged woman later leads the baker into a chamber;
    servants find him dead by hanging, and his daughter later reports that his spirit
    appeared with a halter and described his death and enchanted descent into hell.
  language: English
