canonical_text:
  quote: ''
  summary: The shepherds stop in a wooded place to treat their wounds. A first old
    shepherd warns them by asking whether they know where they are and drives his
    flock away. A second old man asks for help rescuing his nephew from a ditch. A
    young companion follows him into thorny bushes. When the young man does not return,
    another shepherd searches and reports seeing a terrible dragon devouring him,
    while the old man is nowhere to be seen. The company flees the desolate, pestilent
    country.
