canonical_text:
  quote: ''
  summary: Fotis explains that Lucius has become an ass because she mistook a box,
    and that eating a rose will restore him. Lucius, retaining human understanding
    in an ass's body, is rejected by stable animals, tries to take roses from an image
    of Hippone, is beaten by a boy, and is then seized with other animals by armed
    thieves who rob Milo. He unsuccessfully tries to invoke Caesar while unable to
    speak properly, later sees garden roses, but delays eating them because restoration
    to human form among the thieves might get him killed.
  language: English
  quote_policy: summarized
