canonical_text:
  quote: ''
  summary: After an old woman's tale, the Baker's wife arranges for a young lover
    to visit while her husband is away. The husband returns unexpectedly, and she
    hides the lover in a flour bin. The husband then tells a parallel story about
    a Fuller's wife who hid her lover in a smoking twig container, where sneezing
    exposed him. The Baker's wife condemns adulterous wives while her own lover remains
    hidden, and she is forced to serve her husband the supper prepared for the lover.
  language: English
  quote_policy: summarized
