canonical_text:
  quote: ''
  summary: Psyches is seized near the house of Venus, abused and tormented, and then
    assigned severe tasks. Venus first orders her to sort a mixed heap of grains before
    night; ants pity Psyches and complete the sorting. Cupid is locked away from Psyches.
    Venus then commands Psyches to bring golden wool from dangerous sheep near a river.
    Psyches intends to drown herself, but a divinely inspired reed warns her, advises
    her to wait and hide under a tree, and tells her how to gather golden fleece from
    briers after the sheep’s fury passes. Psyches brings the wool back, but Venus
    remains dissatisfied.
  language: English
  quote_policy: summarized
