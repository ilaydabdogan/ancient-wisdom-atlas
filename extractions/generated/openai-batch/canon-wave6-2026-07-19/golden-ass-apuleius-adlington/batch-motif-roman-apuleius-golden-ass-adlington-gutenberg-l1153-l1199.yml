canonical_text:
  quote: ''
  summary: Byrrhena sends Apuleius food and old wine. Apuleius calls Fotis and speaks
    of wine, Venus, lamps, oil, and cups. At Milo’s supper he avoids Pamphile, watches
    Fotis, and hears Pamphile predict rain from the candle on the table. Milo jokes
    that Pamphile is a Sibyl-like prophet. Apuleius explains that a small man-made
    light can remember the greater heavenly light and indicate events in the sky.
    He then recounts Diophanes, an Assyrian fortune-teller at Corinth, who gave practical
    predictions for money and made varying predictions about Apuleius’s future writings
    and fame. Milo identifies Diophanes as the same man who had also profited locally
    from his predictions.
  language: English
  quote_policy: summarized
