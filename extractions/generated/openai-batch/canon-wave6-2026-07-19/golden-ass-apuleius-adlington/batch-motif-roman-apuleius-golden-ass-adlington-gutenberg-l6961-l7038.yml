canonical_text:
  quote: ''
  summary: After an initiation, the narrator appears in ceremonial clothing before
    the image of the goddess, takes part in feast rites, prays to Isis as a world-nourishing
    and world-governing goddess, departs for Rome under divine exhortation, and later
    receives warning of a further consecration connected with Osiris. A night visitor
    from that order appears with ritual objects and a bodily recognition sign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person narrator comes forth sanctified with twelve stoles and a
    religious habit and is commanded to stand on a wooden seat in the middle of the
    temple before the goddess's figure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator's vestment is fine linen embroidered with flowers, and he wears
    a cope bearing colored beasts, including Indian dragons and Hyperborean griffins;
    priests call the habit a celestial stole.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator carries a light torch in his right hand and wears a flower garland
    with palm leaves; he is described as adorned like the Sun and made in the fashion
    of an image while people gather around to behold him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A feast of nativity and a new procession are celebrated with banquets, and
    a third day is marked with similar ceremonies, a religious dinner, and the consummation
    of the order.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the narrator continues there for some time beholding the goddess's image,
    the goddess admonishes him to depart homeward and render thanks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before departing, the narrator falls prostrate before the goddess, wipes her
    steps with his face, weeps and sighs, and begins a prayer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the prayer, the goddess is addressed as holy and blessed, the perpetual
    comfort of humankind, one who nourishes the world, and a loving mother who succors
    people on land and sea.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prayer attributes to the goddess power over storms, dangers, fate, fortune,
    stars, gods above and below, the Sun, the world, hell, time, planets, elements,
    winds, clouds, seeds, fruits, and living creatures.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the prayer, the narrator embraces the great Priest Mythra, calls him
    his spiritual father, asks pardon, gives thanks, and departs to visit parents
    and friends.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: By the exhortation of the goddess, the narrator ships to Rome with a prosperous
    wind and there makes daily prayers to Isis Campensis, while calling himself her
    minister and worshipper but a stranger to her Roman church and religion.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After a year, the goddess warns the narrator to receive a new order and consecration;
    he reasons with himself and consults priests and bishops, concluding that he is
    religious to Isis but not sacred to Osiris.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that Isis and Osiris have religious unity and concord but
    differ in order and ceremony, and that the narrator must also become a minister
    of Osiris.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: At night, a member of the order appears in linen robes holding spears wrapped
    in ivy and other undeclared things, leaves items in the narrator's chamber, sits
    in the narrator's seat, recites requirements for the entry banquet, and shows
    a maimed left ankle that makes him halt.
  category: sequence
  evidence_refs:
  - ev:13
