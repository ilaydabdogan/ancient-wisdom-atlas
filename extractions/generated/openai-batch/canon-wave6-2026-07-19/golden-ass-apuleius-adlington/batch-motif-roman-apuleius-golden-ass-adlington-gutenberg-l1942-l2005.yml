canonical_text:
  quote: ''
  summary: Fotis secretly brings the narrator to watch her mistress perform a nocturnal
    magical transformation. The mistress anoints herself from boxes kept in a coffer,
    becomes an owl, and flies away. The narrator, astonished, asks Fotis for the ointment
    so that he too may become a bird, asks how to return to human shape, hears of
    a plant-and-well-water remedy, and begins applying the ointment to himself.
  language: English
  quote_policy: summarized
