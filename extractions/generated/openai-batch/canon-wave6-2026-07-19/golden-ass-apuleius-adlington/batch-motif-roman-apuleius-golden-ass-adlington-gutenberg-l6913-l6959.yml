canonical_text:
  quote: ''
  summary: Lucius receives instruction from the great priest for entry into a religious
    order and knowledge of divine secrets. He is led through temple rites, interpretation
    of secret books, washing, fasting, offerings, exclusion of the profane, investiture
    in a linen robe, and entry into the innermost sacred place. The narrator says
    the details cannot lawfully be told, but reports approaching Hell and the gates
    of Proserpina, passing through the elements, returning, seeing the sun at midnight,
    and worshipping celestial and infernal gods.
  language: English
  quote_policy: summarized
