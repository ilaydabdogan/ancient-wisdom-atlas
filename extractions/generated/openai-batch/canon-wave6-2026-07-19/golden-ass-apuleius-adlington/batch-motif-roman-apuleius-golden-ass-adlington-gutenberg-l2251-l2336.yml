canonical_text:
  quote: ''
  summary: 'A band of thieves feasts beside a fire with plundered goods, argues over
    raids, and recounts two failed burglaries: Lamathus is trapped by the hand, maimed,
    kills himself to avoid capture, and is buried in the sea; Alcinus is tricked by
    an old woman and pushed from a window.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The robbers remove garments, wash, anoint themselves with oil, sit at a table
    of rich food, and refresh themselves by a fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another company of young men arrives with gold, silver, plate, jewels, and
    rich robes described as prey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator says the group's excessive drinking, eating, laughing, crying,
    and noise makes him think of Lapithes, Thebans, and Centaurs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: One robber says his group conquered the house of Milo of Hippata, brought
    away riches by force, and returned safely with a horse and an ass.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same speaker says the Boeotia raiding party lost their captain Lamathus,
    whose memory should be renowned.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Chriseros is described as a rich man who conceals his estate, lives alone
    in a small house filled with treasure, and wears ragged apparel.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: During an attempted burglary, Lamathus puts his hand through a door-hole to
    pull back a bolt; Chriseros catches the hand, nails it to the post, and calls
    neighbors by claiming his house is on fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lamathus's companions cut off his arm at the elbow, bind the wound with cloths
    to avoid a blood trail, and lead him away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lamathus asks his companions to deliver his body from torment and captivity;
    after they refuse to kill him, he kisses his sword and drives it through his body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The companions wrap Lamathus's body in linen cloths and throw it into the
    sea, described as a grave of water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Alcinus enters an old woman's house to rob her and throws bags of money and
    gold from an upper window to companions below.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The old woman wakes and tells Alcinus not to throw her ragged coverings into
    neighbors' houses because the neighbors are already rich.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Believing the old woman's words, Alcinus leans out the window to inspect the
    surrounding places; she takes him by the heels and thrusts him out.
  category: sequence
  evidence_refs:
  - ev:7
