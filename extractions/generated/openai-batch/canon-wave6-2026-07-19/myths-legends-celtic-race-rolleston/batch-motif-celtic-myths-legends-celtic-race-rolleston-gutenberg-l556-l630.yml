canonical_text:
  quote: ''
  summary: The passage reports de Jubainville’s philological argument that Germanic
    peoples were politically subject to Celtic peoples and borrowed many legal, political,
    military, and social terms from Celtic. It discusses the histories of Amt, frei,
    and Beute, including semantic developments across Celtic, Germanic, Irish, French,
    Norse, and Welsh forms. It then states that Celts did not impose language or religion
    on the German tribes, contrasts Celtic and German deities and funerary customs,
    describes Celtic burial and punitive or sacrificial fire, and describes German
    cremation on pyres, compared with early Greeks.
  language: English
  quote_policy: summarized
