canonical_text:
  quote: ''
  summary: 'The passage recounts the early story of Etain: in the Land of Youth, Fuamnach
    jealously transforms Etain into a butterfly and drives her by magical tempests.
    Angus shelters Etain and partly restores her at night, but Fuamnach drives her
    away again. Etain is swallowed in a drink by Etar’s wife, passes into her womb,
    and is born as a mortal-seeming child. The High King Eochy seeks a queen, finds
    Etain by a spring, marries her, and brings her to Tara. Eochy’s brother Ailill
    then becomes gravely lovesick for Etain and confesses his passion in metaphorical
    language.'
  language: English
  quote_policy: summarized
