  summary: An alphabetical index segment lists Celtic figures, places, objects, and
    referenced episodes, including Otherworld lands, Lir/Llyr, the Children of Lir,
    Lugh/Llew, magic cauldrons, enchanted lands, the Stone of Destiny, and named lakes
    or wells.
