  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The index identifies the Land of the Dead with Spain and with the western
    extremity of Great Britain according to ancient writers cited by Plutarch and
    Procopius.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Land of the Living is equated with the Land of the Happy Dead, and gifts
    brought by Lugh from it are referenced.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Land of Youth is identified with the Land of the Dead and the Land of
    the Living, and is associated with the People of Dana, Oisīn, Connla’s Well, Cleena,
    and other references.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Land of Shadows is listed as the dwelling-place of Skatha and as a place
    visited by Cuchulain.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Lake of the Dragon’s Mouth is described as Caer’s resort, where Angus
    Ōg joins Caer.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Lake of the Cauldron is listed as the place where Matholwch met Llassar
    Llaesgyvnewid and Kymideu Kymeinvoll.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Llassar Llaesgyvnewid is identified as the giver of a magic cauldron to Bran.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lir is identified as a sea-god, father of Mananan, and father of Lodan, and
    is compared in the index with Greek Oceanus and Welsh Llyr.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Children of Lir are indexed under transformation and death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Lairgnen is described as a Connacht chief who seizes the Children of Lir.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Llyr is described in Welsh legend as father of Manawyddan and as corresponding
    to Gaelic Lir; the index also notes Irish equivalents Lir and Mananan.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Lugh or Lugus is described as a god of Light, the son of Kian, a Sun-god,
    an all-craftsman, and Lugh of the Long Arm.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Lugh is indexed as imposing an eric for Kian’s murder, slaying Balor, being
    enthroned in Balor’s stead, possessing a fiery spear, and fathering Cuchulain
    by Dectera.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Lugh of the Long Arm is linked with an invincible sword and with protecting
    or fighting beside Cuchulain.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Llew Llaw Gyffes is indexed as a hero also called the Lion of the Sure Hand,
    identified with the Gaelic deity Lugh, associated with Blodeuwedd as his flower-wife,
    and as slayer of Gronw Pebyr.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: Llwyd son of Kilcoed is described as an enchanter who removes a magic spell
    from the seven Cantrevs of Dyfed and from Pryderi and Rhiannon.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: Lia Fail is identified as the Stone of Destiny.
  category: object
  evidence_refs:
  - ev:16
