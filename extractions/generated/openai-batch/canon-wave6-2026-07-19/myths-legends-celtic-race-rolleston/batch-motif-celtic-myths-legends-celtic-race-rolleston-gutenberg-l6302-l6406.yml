canonical_text:
  quote: ''
  summary: The passage recounts a Christian-origin legend in which Cuchulain is summoned
    from Hell by St. Patrick to persuade King Laery of Christianity, then turns to
    Christianized traditions surrounding the death of Conor mac Nessa through Mesgedra’s
    brain-ball and a portent of Christ’s crucifixion. It then opens the tale of mac
    Datho’s boar and hound, in which rival rulers seek a wondrous hound and mac Datho
    is troubled by the competing offers.
  language: English
