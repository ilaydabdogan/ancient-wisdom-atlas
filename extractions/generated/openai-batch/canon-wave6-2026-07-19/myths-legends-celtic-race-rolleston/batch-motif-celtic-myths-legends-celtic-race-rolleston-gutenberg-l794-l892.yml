  summary: 'The passage surveys classical and modern descriptions of Celts and Gauls:
    the Gæsati fighting naked and gold-adorned at Clastidium; Gallic love of gold
    and untouched sacred offerings; reverence for bards, enigmatic learned speech,
    and Druidic mediation; Ammianus’ descriptions of Gallic warriors and women; Rice
    Holmes’ summary of Gallic material civilization; and a concluding note that Celtic
    political weakness requires explanation.'
