canonical_text:
  quote: ''
  summary: The passage closes the Kilhwch and Olwen episode with Yspaddaden's defeat,
    beheading, Olwen's marriage to Kilhwch, and Arthur's host dispersing. It then
    summarizes Rhonabwy's dream of Arthur's camp, a memory-giving ring stone, a chess
    game involving Arthur, Owain, and Owain's Ravens, and Rhonabwy's three-day sleep.
    It introduces The Lady of the Fountain as a Welsh reproduction of Chrestien de
    Troyes's Le Chevalier au lion, and recounts Kymon's chivalric adventure toward
    a forest guardian and a fountain ritual that summons storm, birdsong, and a black
    knight.
  language: English
  quote_policy: summarized
