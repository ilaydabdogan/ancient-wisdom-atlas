canonical_text:
  quote: "“Is thy lord alive?”"
  summary: A woman extracts a hairy wolf-like creature from mac Cecht’s wound, and
    mac Cecht kills it. The passage then turns to Conall of the Victories, who has
    escaped after his king’s death and reached his father Amorgin at Teltin, badly
    wounded and carrying damaged arms. Amorgin questions whether Conall’s lord is
    alive and declares it cowardly to leave a lord dead among foes; Conall shows severe
    wounds as proof that he fought. The narrator closes by framing the wider story
    as the story of Etain, the overthrow of Fairyland, and fairy vengeance on Eochy’s
    great-grandson.
