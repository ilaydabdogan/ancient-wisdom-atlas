canonical_text:
  quote: ''
  summary: Pwyll sits on the Mound of Arberth to seek an adventure and sees Rhiannon,
    a shining lady on a white horse who cannot be overtaken until he asks her to stop.
    Rhiannon says she fled an unwanted suitor, Gwawl, and wishes to marry Pwyll. At
    a feast, Gwawl exploits Pwyll's rash promise of a boon to demand Rhiannon and
    the banquet. Rhiannon arranges a later counter-plan using a magical bag. Pwyll,
    disguised as a beggar, traps Gwawl in the bag during a second feast; Gwawl renounces
    Rhiannon and revenge, and Pwyll marries Rhiannon. The pair give gifts and rule
    peacefully in Dyfed.
  language: English
  quote_policy: summarized
