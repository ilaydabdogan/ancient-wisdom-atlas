  text: A surviving monk says he is the fifteenth man of the monks of St. Brennan
    of Birr and that all the others have died; he shows a tablet of the Holy Brennan,
    and Maeldūn kisses it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An enormous old bird arrives from the south-west carrying a huge tree-branch
    with red berries; fragments and juice from the berries fall into a lake and redden
    the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maeldūn approaches the bird; the others follow behind shields, and one companion
    gathers berries from the branch without the bird harming them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two eagles cleanse insects from the great bird; after bathing and preening,
    its feathers become glossy and abundant, and it flies away swift and strong.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Diuran bathes in the lake and drinks its water; afterward his sight remains
