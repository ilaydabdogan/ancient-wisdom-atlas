canonical_text:
  quote: ''
  summary: Maeldūn and his companions meet a surviving monk of St. Brennan, observe
    an aged giant bird renewed after eating berries, being cleansed by eagles, and
    bathing in a lake, and Diuran gains lasting health by entering that lake. They
    then encounter an island whose inhabitants laugh and play without ceasing, an
    island encircled by a moving rampart of flame through which a festive people can
    be seen, and an aged monk of Tory who recounts his pride, theft, supernatural
    rebuke, demonic danger, and command to cast his wealth into the sea.
  language: English
  quote_policy: summarized
