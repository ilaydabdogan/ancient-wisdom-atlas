canonical_text:
  quote: ''
  summary: Finn and the remaining Fianna voyage in search of missing comrades. Dermot
    climbs cliffs on an island, encounters a guarded well, fights the well’s knight,
    and descends with him into Fairyland. Finn and his companions later enter by a
    cavern, discover that the Hard Gilly was a fairy king who had decoyed warriors
    for aid in battle, fight on his side, and return suddenly to the Kerry shore with
    Tasha, whom Finn is to marry. The narrator comments on the tale as characteristic
    of Fian legend and explicitly compares the champion-in-Faery motive with Cuchulain
    and Fand.
  language: English
  quote_policy: summarized
