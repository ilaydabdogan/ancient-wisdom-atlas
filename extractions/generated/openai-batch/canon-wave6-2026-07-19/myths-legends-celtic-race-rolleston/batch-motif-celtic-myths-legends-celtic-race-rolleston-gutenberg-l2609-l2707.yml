canonical_text:
  quote: ''
  summary: Nuada is barred from kingship by mutilation, Bres rules badly and is deposed
    after Corpry's satire, and Nuada is restored after his hand is made whole. Bres
    learns from Eri that his father is the Fomorian king Elatha, who recognizes a
    ring token and gives him military aid. Balor of the Evil Eye oppresses Ireland.
    The passage then introduces Lugh and recounts how Balor, warned that his grandson
    will kill him, imprisons his daughter Ethlinn in a tower. Kian owns an abundant
    magical cow, which Balor steals by taking the form of a redheaded boy and deceiving
    Sawan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nuada's mutilation prevents him from ruling because no blemished man may be
    king in Ireland, so the Danaans choose Bres instead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bres is described as strong and beautiful, but he permits Fomorian oppression,
    taxes his subjects heavily, and gives no hospitality to chiefs, nobles, or harpers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The poet Corpry is lodged in a small, dark chamber without fire or furniture
    and is served three dry cakes and no ale before composing a satire on Bres.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Poetic satire is said to have magical power in Ireland; Corpry's quatrain
    is repeated among the people, and Bres lays down his sovereignty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nuada is chosen king in place of Bres after receiving a silver hand through
    Diancecht or, in another version, after Diancecht's son causes a real hand to
    grow again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bres asks Eri about his lineage; she identifies Elatha, a Fomorian king from
