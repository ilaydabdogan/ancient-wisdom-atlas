canonical_text:
  quote: ''
  summary: The passage narrates Cuchulain’s combat with Loch, interference by the
    Morrigan in animal forms, the protective arrival of Lugh, the death of the boy-corps
    of Emania, Cuchulain’s retaliatory Carnage of Murthemney, and the later combat
    with the composite Clan Calatin, during which Fiacha intervenes to save him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maev sends Loch son of Mofebis against Cuchulain, and Cuchulain stains his
    chin with blackberry juice to look bearded before fighting him at the Ford.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Morrigan attacks Cuchulain successively as a white heifer with red ears,
    a black eel in the river, and a grey wolf; during the eel and wolf attacks Loch
    wounds Cuchulain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cuchulain’s battle-fury takes hold of him, and he kills Loch with the Gae
    Bolg; before dying, Loch asks and receives permission to fall on Cuchulain’s side
    of the ford.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After continued fighting, wounds, and lack of sleep, Cuchulain sends his charioteer
    Laeg to seek aid from the men of Ulster.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At evening by the grave mound of Lerga, Cuchulain sees a tall, richly dressed
    warrior pass through Maev’s host without being noticed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stranger tells Cuchulain to sleep for three days, promises to defend the
    Ford, applies magical healing balms, and is identified by Cuchulain as Lugh his
    father from among the People of Dana.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The men of Ulster remain helpless, but a band of thrice fifty boys at Emain
    Macha are not affected by Macha’s curse because it falls only on grown men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy-corps arm themselves under Follaman to aid Cuchulain, and Follaman
    vows not to return without the diadem of Ailell as a trophy.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The boy-corps attack Maev’s host three times, kill three times their own number,
    and are then overwhelmed and slain with no survivor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Cuchulain awakens refreshed and hears of the boys’ deaths, he enters
    frenzy, mounts his war-chariot, and drives around Maev’s host.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The chariot’s ruts are compared to fortress ramparts, its scythed wheels mangle
    bodies, and terror and uproar cause many in Maev’s host to die by each other’s
    weapons or from fear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Carnage of Murthemney is said to avenge the boy-corps of Emania, killing
    six score and ten princes along with many others; Lugh mac Ethlinn is said to
    have fought by Cuchulain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The men of Erin send the Clan Calatin against Cuchulain; Calatin is described
    as a wizard whose twenty-seven sons form one being with him and act as organs
    of their father.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Clan Calatin are poisonous, so that even a graze from one of their weapons
    would kill a man in nine days.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The multiform creature hurls twenty-eight spears at once, which Cuchulain
    catches on his shield, but the Clan Calatin then throws him down and presses his
    face into the gravel.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Fiacha son of Firaba, an Ulster exile in Maev’s host, cuts off the twenty-eight
    hands holding Cuchulain down, after which Cuchulain destroys the Clan Calatin.
  category: sequence
  evidence_refs:
  - ev:11
