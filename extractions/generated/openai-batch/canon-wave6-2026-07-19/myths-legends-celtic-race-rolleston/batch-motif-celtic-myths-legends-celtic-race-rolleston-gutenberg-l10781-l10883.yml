  quote: ''
  summary: The passage introduces the Arthurian material as medieval romance rather
    than Celtic mythology, then recounts Kymon’s defeat by the Black Knight, Owain’s
    successful pursuit of the same adventure, his rescue by Luned through an invisibility
    ring, his marriage to the lady of the Castle of the Fountain, Arthur’s later search
    for him, Owain’s forgotten promise and disgrace, his wilderness exile, restoration
    by a widowed countess, and his rescue of a lion from a serpent.
