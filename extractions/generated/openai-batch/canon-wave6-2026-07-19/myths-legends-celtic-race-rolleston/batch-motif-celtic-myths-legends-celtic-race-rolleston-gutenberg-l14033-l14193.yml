canonical_text:
  quote: ''
  summary: 'Alphabetical index entries under M, listing Celtic mythological figures,
    places, rites, symbols, and referenced episodes: May-day and Beltené; the Megalithic
    People and ritual practices; Mercury and Lugh; Merlin/Myrddin; Messbuachalla and
    Conary; Midir and Etain; the Sons of Miled; symbols such as feet, ships, fire,
    cauldron, Stonehenge, and the Grail; Modred, Mongan, the Morrigan, Moytura, Murna,
    and Myrddin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: May-day is listed as sacred to Beltené, as the day on which the Sons of Miled
    began the conquest of Ireland, as the occasion of a recurring combat between Gwythur
    ap Greidawl and Gwyn ap Nudd, and as the eve on which a strange scream was heard
    in Britain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Megalithic People are described as builders of dolmens and cromlechs;
    the entry links them with magic, non-anthropomorphic representations of divine
    powers, Druidism, human sacrifice, and conceptions of deity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mercury is described as regarded by Gauls as chief of the gods, and Lugh Lamfada
    is identified with Mercury.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Merlin is connected with magical arts, equated with Myrddin, associated by
    Geoffrey of Monmouth with the erection of Stonehenge, and has an abode described
    elsewhere in the source.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Messbuachalla is described as the only daughter of Etain Oig, as meaning “the
    cowherd’s foster-child,” as linked with King Eterskel’s promised son, and as visited
    by a Danaan lover before the birth of Conary.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mexico entry lists cup-and-ring marking, a feet symbol, and a cross-legged
    “Buddha” motif in religious art.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Midir the Proud is described as a son of the Dagda, as associated with splendour,
    with Fuamnach as wife and Etain as second bride, and as recovering and later yielding
    up Etain.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Sons or Children of Miled are described as conquering the People of Dana,
    coming to displace Danaan rule in Ireland, beginning their conquest on May-day,
    seeking vengeance for Ith’s slaying, and entering the sovereignty of Ireland.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Structures in Minorca are described as analogous to structures in Ireland
    that represent ships.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Modred is described as King Arthur’s nephew who usurps Arthur’s crown, weds
    Arthur’s wife Guanhumara, and is defeated and slain by Arthur.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Mongan is described as an Irish chieftain and reincarnation of Finn.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Morda is described as a blind man set by Ceridwen to keep fire under a magic
    cauldron.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Morann is described as a Druid associated with a prophecy concerning Cuchulain.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Moriath is described as a king’s daughter whose love for Maon and device to
    win him back to Ireland are referenced.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: The Morrigan is described as an extraordinary goddess associated with perverse
    and horrible supernatural powers, with love or friendship for Cuchulain, with
    threats and attacks against him, with croaking of war and slaughter, and with
    settling as a crow on dead Cuchulain’s shoulder.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Moyslaught, “The Plain of Adoration,” is listed as the place where the idol
    of Crom Cruach was erected.
  category: setting
  evidence_refs:
  - ev:16
- id: obs:17
  text: 'Moytura is listed as the scene of two battles: one between Danaans and Firbolgs,
    and another between Danaans and Fomorians.'
  category: setting
  evidence_refs:
  - ev:17
- id: obs:18
  text: Munsalväsche or Montsalvat is listed as the castle where the Grail is preserved
    in Wolfram von Eschenbach’s poem.
  category: setting
  evidence_refs:
  - ev:18
- id: obs:19
  text: Murna of the White Neck is described as wife of Cumhal and mother of Finn;
    she takes refuge in the forests of Slieve Bloom and gives birth to Demna, identified
    as Finn.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:20
  text: Murtagh Mac Erc is described as lending the famous Stone of Scone to Scotland.
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: Murthemney is associated with Kian’s killing, a vision of Cuchulain by the
    prophetess Fedelma, carnage, an Ulster host, and Cuchulain’s dūn.
  category: setting
  evidence_refs:
  - ev:21
- id: obs:22
  text: Myrddin is described as a deity in Arthur’s mythological cycle, corresponding
    with the Sun-god Nudd; the entry also references a suggestion that he was worshipped
    at Stonehenge and says he seizes the Thirteen Treasures of Britain.
  category: relationship
  evidence_refs:
  - ev:22
