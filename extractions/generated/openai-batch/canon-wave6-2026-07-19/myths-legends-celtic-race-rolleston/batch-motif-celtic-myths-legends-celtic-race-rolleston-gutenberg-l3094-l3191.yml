canonical_text:
  quote: ''
  summary: 'The passage surveys several Irish mythological figures: Mananan as sea-lord,
    guide to the otherworld, owner of magical objects, and protector of Erin; Dana
    as mother of the Irish gods and associated with fertility; the Morrigan as warlike
    shapeshifting goddess in conflict with Cuchulain; Cleena as a Danaan maiden carried
    back to Fairyland by a wave; and Ainé as Munster patroness, love-goddess, magical
    avenger, ancestress, and focus of Midsummer/St. John''s Night rites and visions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mananan is described as lord of the sea, beyond or under which the Land of
    Youth or Islands of the Dead were believed to lie, and as a guide of humans to
    that country.
  category: attribute
  evidence_refs:
  - ev:1
