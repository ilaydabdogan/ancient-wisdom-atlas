  text: White-crested waves are called the Horses of Mananan, and Cuchulain is under
    a taboo not to perceive them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mananan wears a many-coloured cloak and is said to protect Erin by circling
    hostile camps at night with a thunderous tramp and flapping cloak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Isle of Man is described as Mananan’s throne and as taking its name from
    him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dana is called the mother of the Irish gods, daughter of the Dagda, and associated
    with fertility and blessing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Brian, Iuchar, and Iucharba are named as Dana’s sons and are said to represent
    one person in a triadic conception of divine power.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Morrigan delights in setting men at war, fights among them, changes into
    frightful shapes, and appears above armies as a crow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Morrigan offers love to Cuchulain in the guise of a human maid, is refused,
    and persecutes him afterward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In a stream the Morrigan turns into a water-serpent and then water-weeds to
    entangle and drown Cuchulain; he wounds her, she later becomes his friend, and
    before his last battle she breaks his chariot pole as a warning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Cleena, a Danaan maiden from Mananan’s Land of Youth beyond the sea, escapes
    with the mortal Keevan, falls asleep on the beach to fairy music, and is carried
    back to Fairyland by a great wave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ainé is described as patroness of Munster, daughter of Owel, and a love-goddess
    who inspires mortals with passion.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ainé is said to have been ravished by Ailill Olum, who is slain by her magic
