- id: motif:2
  label: hostage bargaining to undo enchantment
  taxonomy_refs:
  - sacred_exchange
  basis: Manawyddan refuses wealth and instead demands the release of Rhiannon and
    Pryderi and the removal of the enchantment before releasing the mouse.
  evidence_refs:
