- id: motif:4
  label: theft of supernatural livestock by magical deception
  taxonomy_refs:
  - sacred_theft
  basis: Gwydion obtains the magic swine from Pryderi through bardic disguise and
    an illusory exchange of horses and hounds; the narrator frames the tale as a contest
    over prized possessions of the Under-world.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage describes the swine as bestowed by Arawn of Annwn and treats
    them as Under-world possessions, but the theft occurs from Pryderi’s court rather
