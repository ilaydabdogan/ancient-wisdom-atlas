  basis: Māth judges Gwydion and Gilvaethwy for shame and the death of Pryderi and
    turns them into deer for a twelvemonth.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The transformation is a punishment imposed by Māth, not voluntary shapeshifting.
