canonical_text:
  quote: ''
  summary: 'The passage recounts Manawyddan’s capture of a mouse, the disguised Llwyd’s
    bargaining for her release, the lifting of enchantment from Dyfed, and the restoration
    of Rhiannon and Pryderi. It then introduces the tale of Māth son of Māthonwy:
    Māth’s ritual dependence on a maiden’s lap, Gwydion’s deceptive acquisition of
    Pryderi’s magic swine from Annwn, the resulting war and death of Pryderi, Goewin’s
    coercion by Gilvaethwy, and Māth’s punishment of Gwydion and Gilvaethwy by transforming
    them into deer.'
  language: English
  quote_policy: summarized
