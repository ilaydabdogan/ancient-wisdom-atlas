canonical_text:
  quote: ''
  summary: Deirdre sees a raven, blood, and snow and uses the image to describe the
    man she would love; Levarcam identifies him as Naisi. Deirdre persuades Naisi
    to rescue her from Conor, and Naisi, with his brothers, takes her to Scotland.
    After years in exile, Conor sends Fergus with a promise of forgiveness. Deirdre
    warns against returning, but the party goes back under Fergus’s protection. Fergus
    is diverted by Baruch’s feast because of a geis, leaving his sons as escorts.
    At Emain Macha, Conor questions Levarcam and sends Trendorn to spy on the party.
    Trendorn sees Deirdre and Naisi at chess; Naisi strikes out Trendorn’s eye with
    a chessman, and Trendorn reports Deirdre’s beauty to Conor.
  language: English
  quote_policy: summarized
