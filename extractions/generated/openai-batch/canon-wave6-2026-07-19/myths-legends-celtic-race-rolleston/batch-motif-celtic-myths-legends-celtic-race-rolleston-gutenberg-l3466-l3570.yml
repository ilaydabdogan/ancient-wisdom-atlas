canonical_text:
  quote: ''
  summary: The passage introduces the Children of Lir as an example of Danaan redemption
    within a Christianized framing of Irish invasion myth. Lir’s childless second
    wife Aoife becomes jealous of his four children, attempts to have them killed,
    and instead transforms them by sorcery into four white swans under a long threefold
    doom over Irish waters. Bōv the Red punishes Aoife, while the swan-children retain
    speech and wondrous music. After centuries of hardship, Fionuala cares for her
    brothers, the swans meet the mortal Evric, revisit the unseen site of their father’s
    palace, and finally hear a Christian bell from a hermit who instructs them in
    the faith.
  language: English
  quote_policy: summarized
