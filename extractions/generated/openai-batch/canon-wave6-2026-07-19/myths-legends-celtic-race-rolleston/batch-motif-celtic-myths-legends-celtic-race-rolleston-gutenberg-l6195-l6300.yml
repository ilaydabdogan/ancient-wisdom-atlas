canonical_text:
  quote: ''
  summary: Murgen, after a nocturnal supernatural experience near the stone of Fergus,
    recovers the lost lay of the Tain and brings it to his father Sanchan. Sanchan
    performs it at Gort, where the song produces vivid heroic visions and overwhelms
    the court. A supernatural Fergus appears, Murgen is revealed dead, the maiden
    rejects the gold cups awarded to her, and her curse causes the recovered lay to
    become nearly lost again.
  language: English
  quote_policy: summarized
