  quote: ''
  summary: The passage recounts Cuchulain's summons to aid Fand in Fairyland, his
    liaison with her, Emer's confrontation, Fand's return to Mananan, and Cuchulain's
    enforced forgetfulness. It then describes Maev's vengeance through the magically
    trained children of Calatin, and the episode of Blanid's milk signal, Cuchulain's
    killing of Curoi, and Fercartna's fatal revenge.
  language: English
