    encounters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Conall of the Victories arrives, and Ket and Conall greet one another with
    formal praise before disputing the right to stand over the boar.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Conall claims that since taking weapons he has continually slain, raided,
    and humiliated Connacht men; Ket yields the boar but says his brother Anluan could
    match Conall.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Conall reveals that Anluan is present as a severed head, which he draws from
    his girdle and dashes in Ket’s face.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After Anluan’s head is displayed, battle breaks out in the hall, moves outside,
    and ends with the Connacht host in flight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mac Datho’s hound pursues King Ailell’s chariot until the charioteer cuts
    off the hound’s head; neither party wins the disputed animal, while Mac Datho
    saves his lands and life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Conall overtakes Ket after a foray; they fight, Ket is killed, and the badly
