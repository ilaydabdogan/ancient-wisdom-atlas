  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After Beälcu is killed, Conall takes the heads of Beälcu’s three sons and
    returns to Ulster.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Maev retires to an island on Loch Ryve and habitually bathes early each morning
