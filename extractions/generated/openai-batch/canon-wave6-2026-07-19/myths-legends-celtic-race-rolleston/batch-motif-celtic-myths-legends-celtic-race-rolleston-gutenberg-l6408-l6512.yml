canonical_text:
  quote: ''
  summary: Mac Datho resolves simultaneous demands for his hound from Ulster and Connacht
    by promising it to both sides and hosting them at a feast. A contest over the
    carving of a great boar becomes a heroic boasting contest, ending in Conall’s
    display of Anluan’s severed head and a battle in which the hound is killed and
    neither side gains it. The passage then recounts Ket’s death after combat with
    Conall, Beälcu’s attempt to heal Conall for later combat, Conall’s stratagem against
    Beälcu’s sons, and Forbay’s killing of Queen Maev with a sling after measuring
    and practicing the shot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mac Datho tells his wife that both Ulster and Connacht have requested his
    hound at the same time and that refusing either side may bring raids and killing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mac Datho’s wife advises him to promise the hound to both groups and have
    them come fetch it, so that any violence falls between them rather than on him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mac Datho follows the counsel, invites both Ulster and Connacht to a feast
    on the same day, and tells each group it can have the hound afterward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Conor of Ulster, Maev, and their retinues assemble at Mac Datho’s dūn, where
    a feast is prepared and Mac Datho’s famous boar has been killed as the chief dish.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bricriu proposes that warriors of Ulster and Connacht compare deeds of arms
    and award the carving of the boar to the best performer in border fighting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ket son of Maga stands over the boar with a knife and challenges Ulster lords
