evidence:
- id: ev:1
  type: summary
  locator: 3838-3842
  quote_or_summary: Ugainy the Great is said to rule Ireland and much of Western Europe,
    marry the Gaulish princess Kesair, and have two sons, Laery and Covac.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:2
  type: summary
  locator: 3842-3848
  quote_or_summary: Laery inherits the kingdom; Covac, envious and sick, asks a Druid
    how to kill Laery despite Laery’s armed escorts, and the Druid tells him to feign
    death.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:3
  type: summary
  locator: 3848-3852
  quote_or_summary: Covac pretends to be on his bier, stabs Laery when he bends over
    the supposed corpse, kills Ailill, takes the throne, and his illness leaves him.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:4
  type: summary
  locator: 3856-3863
  quote_or_summary: Covac forces the child Maon to swallow portions of his father’s
    and grandfather’s hearts and a mouse with her young; Maon loses speech from disgust,
    and Covac lets him go because he is dumb.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:5
  type: summary
  locator: 3863-3868
  quote_or_summary: Maon is taken to Munster and stays with Scoriath, then goes to
    Gaul, Kesair’s country, where he is treated with honor as heir to Ireland.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:6
  type: summary
  locator: 3868-3874
  quote_or_summary: Moriath, daughter of the King of Feramorc, loves Maon and sends
    Craftiny the harper to Gaul with gifts and a love-lay set to an enchanting melody.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:7
  type: summary
  locator: 3874-3878
  quote_or_summary: Craftiny performs the lay before Maon; Maon is so moved by the
    song’s beauty and passion that his speech returns and he is dumb no more.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:8
  type: summary
  locator: 3878-3888
  quote_or_summary: The King of Gaul equips Maon with an armed force; Maon attacks
    and kills Covac at Dinrigh. A Druid’s questions to a Gaul produce the name Labra
    the Mariner for Maon.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:9
  type: summary
  locator: 3888-3897
  quote_or_summary: Maon/Labra marries Moriath and reigns ten years. The passage derives
    Leinster’s name from Gaulish settlers bearing broad blue-green iron spearheads
    called laighne.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:10
  type: summary
  locator: 3899-3905
  quote_or_summary: Labra has his hair cropped once a year; the hair-cropper is chosen
    by lot and killed because Labra hides long horse-like ears, which the passage
    compares to King Midas in a Greek myth.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:11
  type: summary
  locator: 3905-3910
  quote_or_summary: The chosen hair-cropper is a poor widow’s only son; Labra spares
    him after the widow’s pleas, provided he swears by the Wind and Sun to tell no
    man what he saw.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:12
  type: summary
  locator: 3910-3919
  quote_or_summary: The secret makes the youth gravely sick. A wise Druid says he
    must reveal it, instructing him to go to a four-road crossing, turn right, and
    tell the first tree; he whispers to a willow and recovers.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
- id: ev:13
  type: quote
  locator: 3919-3926
  quote_or_summary: Craftiny makes a harp from the willow; when he plays in the king’s
    hall, the strings chime, “Two horse’s ears hath Labra the Mariner.” Labra then
    reveals himself and no one is killed again for the mystery.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source text.
