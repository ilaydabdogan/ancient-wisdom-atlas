canonical_text:
  quote: ''
  summary: The passage recounts legends of Ugainy, Covac, Laery, Maon/Labra the Mariner,
    Moriath, and Craftiny. It includes Covac’s fratricidal usurpation, Maon’s childhood
    trauma and muteness, his restoration through music and return with Gaulish forces,
    an etymological account of Leinster, and a tale in which Labra’s hidden horse-like
    ears are disclosed through a willow-wood harp. It closes by introducing the legend-cycle
    of Conary Mōr.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ugainy the Great is said to have ruled Ireland and much of Western Europe,
    married Kesair, and had two sons, Laery and Covac.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Laery inherited the kingdom, while Covac, described as sick with envy, sought
    Druidic advice on killing him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Druid advised Covac to feign death; Covac followed the advice, and when
    Laery approached the bier, Covac stabbed Laery and also killed Ailill.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After killing Laery and Ailill, Covac took the throne, and his illness left
    him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maon, son of Ailill, was forced as a child to swallow portions of his father’s
    and grandfather’s hearts and a mouse with her young; afterward he lost his speech
    and was released by Covac.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Maon was taken to Munster, stayed with King Scoriath of Feramorc, then went
    to Gaul, where he was honored as heir to Ireland.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Moriath, daughter of the King of Feramorc, loved Maon and sent Craftiny the
    harper to him with gifts, a love-lay, and an enchanting melody.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Craftiny performed the love-lay before Maon in Gaul, and Maon’s speech returned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The King of Gaul equipped Maon with an armed force and sent him to Ireland,
    where Maon attacked Covac at Dinrigh and slew him with his nobles and guards.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After Covac’s defeat, an exchange with a Druid of Covac’s company led to Maon
    being known as Labra the Mariner.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Maon/Labra sought out Moriath, married her, and reigned over Ireland for ten
    years.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage derives the name of Leinster from Gaulish spearheads called laighne
    and from the settlement of the Gauls in the province.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: After his accession, Labra had his hair cropped once a year; the man chosen
    by lot to crop it was afterward put to death.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The reason given for the killings was that Labra had long ears like a horse
    and wanted the condition hidden.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: A poor widow’s only son was chosen to crop Labra’s hair and was spared after
    his mother’s pleas, on condition that he swore by the Wind and Sun to tell no
    man what he saw.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The hidden secret made the young man sick, and a wise Druid advised that he
    reveal it to the first tree he met after turning right at a four-road crossing.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The young man whispered the secret to a willow tree and recovered his former
    light-heartedness.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: Craftiny later made a harp from that willow, and when he played it in the
