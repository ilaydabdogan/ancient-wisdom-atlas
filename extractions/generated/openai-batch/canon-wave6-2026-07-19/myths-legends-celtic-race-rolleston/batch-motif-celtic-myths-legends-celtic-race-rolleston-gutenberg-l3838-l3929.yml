candidate_motifs:
- id: motif:1
  label: False death used as a murder trap
  taxonomy_refs: []
  basis: Covac follows Druidic advice to pretend to be dead so that Laery will approach
    him without sufficient protection, then kills him.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents the stratagem literally and does not assign a broader
    mythic taxonomy.
- id: motif:2
  label: Child heir traumatized into muteness
  taxonomy_refs: []
  basis: Maon is forced to swallow bodily remains and an animal with young, becomes
    mute, and is spared because he appears harmless.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explicitly explain the act beyond disgust and resulting
    loss of speech.
- id: motif:3
  label: Exiled rightful heir returns to regain kingship
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: Maon is recognized in Gaul as heir to Ireland, receives military support,
    returns, kills the usurper Covac, marries Moriath, and reigns.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames Maon as heir but does not provide a formal legal argument
    for succession.
- id: motif:4
  label: Healing and restoration through music
  taxonomy_refs: []
  basis: Craftiny’s performance of Moriath’s love-lay restores Maon’s lost speech,
    and the narrator later notes the compelling power of Craftiny’s music.
  evidence_refs:
  - ev:7
  - ev:14
  confidence: high
  cautions: No specific taxonomy reference for magical music is supplied in the available
    list.
- id: motif:5
  label: Eponymous naming after weapons and settlers
  taxonomy_refs: []
  basis: The passage derives Leinster’s Irish name from the laighne spearheads of
    Gaulish settlers allotted lands there.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is presented as a traditional derivation within the passage.
- id: motif:6
  label: Forbidden bodily secret of a ruler
  taxonomy_refs:
  - forbidden_knowledge
  basis: Labra conceals his horse-like ears by killing hair-croppers, and the spared
    youth swears not to tell the secret to any man.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The available taxonomy label is broad; the passage’s specific form is
    a hidden bodily trait.
- id: motif:7
  label: Secret transferred to tree and revealed by instrument
  taxonomy_refs:
  - forbidden_knowledge
  basis: The young man tells Labra’s secret to a willow; Craftiny later makes a harp
    from the willow, and the harp reveals the secret aloud.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The tree is a literal willow in the passage; no world-tree or axis symbolism
    is stated.
- id: motif:8
  label: Binding oath and sickness from an unrevealed secret
  taxonomy_refs:
  - covenant
  basis: The hair-cropper swears by the Wind and Sun to tell no man, then becomes
    gravely ill until a Druid instructs him to reveal the secret to a tree.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The taxonomy reference 'covenant' is approximate because the passage describes
    an oath rather than a negotiated covenant.
- id: motif:9
  label: Supernatural or magical agency in music
  taxonomy_refs: []
  basis: The narrator explicitly states that Irish legend often presents music as
    if supernatural powers speak through it, citing Craftiny’s music and the harp’s
    speech.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The statement is narrator commentary, not a separate narrated episode
    in this passage.
