canonical_text:
  quote: ''
  summary: The passage summarizes Irish invasion traditions concerning the Nemedians,
    Firbolgs, and People of Dana. It describes conflicts with the Fomorians, Fomorian
    tribute and the Nemedian defeat on Tory Island, later accounts of survivor lineages,
    the Firbolgs’ bag-and-coracle migration legend, Taltiu’s marriage and commemorative
    fair, and the divine genealogy and later Christian reinterpretation of the People
    of Dana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nemedians are described as akin to the Partholanians, and both are said
    to have come from mysterious regions of the dead; later Irish accounts give them
    Scriptural patriarchal descent and earthly origins.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Fomorians are described as opponents of the Partholanians and Nemedians;
    later legends make them pirates from oversea, while the passage says they had
    no arrival legend and were coeval with the world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nemed wins four battles against the Fomorians and then dies of a plague that
    also kills 2000 of his people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Fomorians, under Morc and Conann, establish tyranny over Ireland and take
    a tribute of two-thirds of the milk and two-thirds of the children of the land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nemedians revolt, land on Tory Island, capture Conann’s Tower, and Conann
    is killed by the Nemedian chief Fergus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Morc enters the battle with a fresh host, routs the Nemedians, and only thirty
    survive; the cited poem says the sea engulfed all the others.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The thirty survivors leave Ireland; the passage contrasts an older belief
    that they perished without descendants with later accounts making some survivors
    ancestors of Britons, Firbolgs, and the People of Dana.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The name Firbolg is explained as “Men of the Bags,” and a later legend says
    they carried earth in leathern bags under oppression in Greece, then made boats
    or coracles from the bags and sailed to Ireland.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nennius is reported as saying that the Firbolgs came from Spain, with the
    passage explaining “Spain” as a rationalistic rendering of Celtic words for the
    Land of the Dead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The Firbolgs are said to have come in three groups: the Fir-Bolg, the Fir-Domnan,
    and the Galioin; the passage says they play no great part and have a character
    of servility and inferiority.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Eochy mac Erc marries Taltiu or Telta, daughter of the King of the Great Plain,
    identified parenthetically as the Land of the Dead; Taltiu has a palace at Teltown,
    dies there, and is honored by an annual assembly or fair.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The People of Dana, or Tuatha De Danann, are explained as “the folk of the
    god whose mother is Dana”; Dana is also called Brigit, is linked to Gaulish and
    British inscriptional names, is the daughter of Dagda, and is connected through
    three sons to Ecne, whose name means Knowledge or Poetry.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tuan mac Carell is said to have called the People of Dana gods; the passage
    states that Christian influences reduced them to fairies or identified them with
    fallen angels, and that the Milesians conquered them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage describes the Fomorians as powers of darkness and evil and the
    People of Dana as representatives of Light and Knowledge.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:9
