candidate_motifs:
- id: motif:1
  label: Otherworld origin of invading peoples
  taxonomy_refs:
  - afterlife_journey_map
  - departure
  basis: The passage repeatedly connects colonizing or migrating peoples and Taltiu’s
    origin with the regions of the dead, Land of the Dead, or Great Plain.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage mixes mythic explanation, later rationalization, and authorial
    interpretation rather than presenting a single narrative episode.
- id: motif:2
  label: Primordial dark adversaries opposed to light and knowledge
  taxonomy_refs:
  - duality
  - chaos
  - wisdom
  basis: The Fomorians are described as powers of darkness and evil, while the People
    of Dana are described as representatives of Light and Knowledge.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: medium
  cautions: The contrast is an interpretive summary by the author and is not dramatized
    as one direct confrontation in this passage.
- id: motif:3
  label: Crushing tribute of sustenance and offspring
  taxonomy_refs: []
  basis: The Fomorians impose a tribute of two-thirds of all milk and two-thirds of
    the children of Ireland.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The tribute is coercive; the passage does not describe it as a ritual
    sacrifice.
- id: motif:4
  label: Revolt against island tower followed by near annihilation
  taxonomy_refs:
  - departure
  basis: The Nemedians storm Tory Island and Conann’s Tower but are routed by Morc;
    all but thirty are slain or engulfed, and the survivors leave Ireland.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The survivor group is thirty, so it should not be assimilated to a pair-survivor
    motif.
- id: motif:5
  label: Escape migration by improvised vessel
  taxonomy_refs:
  - ark_vessel
  - departure
  basis: The Firbolgs, oppressed in Greece, make boats or coracles from their leathern
    bags and sail to Ireland.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The vessels are coracles in a migration legend, not an ark in a flood-renewal
    episode.
- id: motif:6
  label: Otherworld bride and commemorative fair
  taxonomy_refs:
  - sacred_marriage
  basis: A Firbolg king marries Taltiu, daughter of the King of the Great Plain, and
    her death-site becomes the location of an annual fair in her honor.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: The passage does not explicitly state a sacral marriage, sovereignty rite,
    fertility function, or cultic origin beyond commemoration.
- id: motif:7
  label: Mother-goddess namesake and divine knowledge genealogy
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  - wisdom
  basis: Dana/Brigit gives her name to the People of Dana, is daughter of Dagda, and
    is connected genealogically to Ecne, Knowledge or Poetry; the race is associated
    with Light and Knowledge.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage gives a genealogical and etymological explanation rather than
    a full narrative of Dana’s actions.
- id: motif:8
  label: Diminished gods reinterpreted as fairies or fallen angels
  taxonomy_refs: []
  basis: The passage states that Christian influences reduced the People of Dana from
    gods to fairies or identified them with fallen angels in later legend.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a reception-history pattern, not an internal mythic action.
