  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives this as a household food detail rather than as the main
    action of the Ethné story.
- id: motif:4
  label: Miraculous nourishment after refusal of fairy food
  taxonomy_refs: []
  basis: Ethné abstains from the food of Faëry after her spiritual change and is nourished
