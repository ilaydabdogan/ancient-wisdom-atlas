- id: motif:6
  label: Long-lived Danaan being enters human mortality
  taxonomy_refs: []
  basis: The passage says Danaan folk do not age after maturity and that Ethné would
    be about fifteen hundred years old, yet after her Christian adoption and the call
    of her Danaan kin she becomes mortally sick and dies.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not explicitly state that baptism causes mortality; it
