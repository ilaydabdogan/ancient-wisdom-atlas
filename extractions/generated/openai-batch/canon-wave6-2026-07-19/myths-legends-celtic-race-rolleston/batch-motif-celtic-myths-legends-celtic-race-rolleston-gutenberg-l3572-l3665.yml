canonical_text:
  quote: ''
  summary: 'The passage concludes the tale of the Children of Lir with the seizure
    of the enchanted swans, their transformation into aged humans, baptism, death,
    burial, and ascent to heaven. It then introduces the tale of Ethné as another
    transition tale joining pagan Danaan material with Christian ritual: Ethné, a
    Danaan-associated handmaiden, refuses fairy food after a moral awakening, is miraculously
    nourished, loses a veil that grants access to fairyland and invisibility, receives
    baptism from St. Patrick, hears her Danaan kin calling, sickens, dies, and is
    commemorated by a church name. The narrator frames such legends as showing early
    Irish Christian tenderness toward the older divinities.'
  language: English
  quote_policy: summarized
