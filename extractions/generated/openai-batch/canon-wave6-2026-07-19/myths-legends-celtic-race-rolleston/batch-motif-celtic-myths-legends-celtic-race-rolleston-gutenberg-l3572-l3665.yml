candidate_motifs:
- id: motif:1
  label: Enchanted swan-beings forcibly taken and transformed into aged humans
  taxonomy_refs:
  - shapeshifter
  basis: The four singing swans are seized by their chains and, when brought to Deoca,
    their swan plumage falls away to reveal aged human beings.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: 'The taxonomy reference is approximate: the passage shows transformation
    between swan and human forms, but does not describe voluntary shapeshifting.'
- id: motif:2
  label: Christian rite at the threshold of death for beings of the older order
  taxonomy_refs:
  - initiation
  basis: The Children of Lir are baptized just before death and burial; Ethné is baptized
    by St. Patrick and later receives last rites. The narrator explicitly frames these
    as transition tales reconciling pagan and Christian orders.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:9
  - ev:10
  confidence: high
  cautions: The available taxonomy term initiation is broad; the passage's specific
    rites are Christian baptism and last rites.
- id: motif:3
  label: Regenerating feast animal
  taxonomy_refs:
  - dying_and_returning
  basis: The magic swine of Mananan may be eaten on one day and are alive again for
