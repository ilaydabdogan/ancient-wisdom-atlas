- id: motif:2
  label: Sun-god weds and reigns over the land
  taxonomy_refs:
  - sacred_marriage
  - royal_legitimacy
  basis: MacGrené is identified as Son of the Sun, and the passage says Eriu's marriage
    to him means the Sun-god has wedded the land and is reigning over it.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This formulation is reported through the passage's author and de Jubainville;
    it is not narrated as a full marriage episode here.
- id: motif:3
  label: Praise of a fertile land triggers suspicion and killing
  taxonomy_refs: []
  basis: Ith praises Ireland's abundance, after which the Danaans conclude he has
    designs on their land and put him to death.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives a narrative sequence but does not name it as a conventional
    motif.
- id: motif:4
  label: Avenging invasion after slain kinsman or envoy
  taxonomy_refs: []
  basis: After Ith's body is returned to Spain, the children of Miled resolve to avenge
    the outrage and prepare to invade Ireland.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage supports the revenge-invasion sequence, but wider comparison
    is not established within the excerpt.
- id: motif:5
  label: May Day as threshold of arrival, destruction, death, and life
  taxonomy_refs:
  - seasonal_cycle
  - death_rebirth
  basis: The first of May is linked to the Milesian arrival, Partholan's landing,
