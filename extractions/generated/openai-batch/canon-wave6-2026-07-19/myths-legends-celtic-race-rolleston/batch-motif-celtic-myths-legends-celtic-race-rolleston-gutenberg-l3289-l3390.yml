canonical_text:
  quote: ''
  summary: The passage recounts Danaan rule in Ireland by three kings and their three
    wives, links Eriu with Ireland and MacGrené with the Sun, narrates Ith's arbitration
    and death, the Milesian revenge-invasion, voyage deaths and Skena's burial, the
    May Day arrival associated with Beltené, Amergin's mystical poems identifying
    himself with natural forces and invoking Ireland's features, and Amergin's judgment
    that the Milesians withdraw beyond nine waves before returning to fight for Ireland.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ireland is said to be ruled by three Danaan kings, MacCuill, MacCecht, and
    MacGrené, grandsons of the Dagda, with wives named Banba, Fohla, and Eriu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that this grouping illustrates a Celtic habit of conceiving
    divine persons in triads, and says the three triads represent one person each.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: MacGrené is explained as 'Son of the Sun'; the passage says Eriu is his wife
    and that Eriu/Erinn remains a poetic name for Ireland.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Ith lands in Ireland, finds that the Danaan king Neit has been slain in battle
    with the Fomorians, and encounters the three Danaan sons at Aileach arranging
    a division of land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Danaans ask Ith to settle their inheritance; after he praises Ireland's
    abundance and temperate climate, they suspect him of desiring the land, seize
    him, and kill him.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Ith's companions recover his body and carry it back to Spain, after which
    the children of Miled resolve to avenge him and prepare to invade Ireland.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Milesian company is commanded by thirty-six chiefs, each with a ship,
    family, and followers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Two members of the Milesian company die during the voyage: an unnamed son
    of Miled drowns after falling from the masthead, and Skena, Amergin''s wife, dies
    and is buried at a place named Inverskena.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sons of Miled arrive in Ireland on Thursday, the first of May, a date
    the passage also associates with Partholan's landing, a pestilence that destroyed
    Partholan's race, and Beltené's feast day.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says Beltené is one of the names of the god of Death, who gives
    life to men and takes it away again.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Amergin sets foot in Ireland, he chants a first-person poem identifying
    himself with wind, ocean wave, billow murmur, animals, a ray of the sun, a plant,
    a lake, craft, science, a spear-point, and a god who creates the fire of thought.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage's cited explanation says the poet or filé is the Word of Science,
    gives fire of thought to man, and is mingled with winds, waves, animals, and warrior
    arms.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: Two other poems attributed to Amergin invoke Ireland's land and physical features,
    including sea, mountain, wood, river, and lake, to aid him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: At Tara, the Milesian host summons the three Danaan kings to deliver up the
    island; the Danaans request three days and ask that Amergin decide the terms.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: 'Amergin delivers what the passage calls the first judgment in Ireland: the
    Milesians must withdraw the length of nine waves from shore and then return; if
    they conquer the Danaans, the land is fairly theirs by right of battle.'
  category: sequence
  evidence_refs:
  - ev:11
