canonical_text:
  quote: ''
  summary: Cuchulain and Ferdia continue their single combat at the Ford. Cuchulain
    enters battle frenzy, uses the Gae Bolg, and kills Ferdia, then collapses. Ferdia
    is buried with a mound and Ogham pillar, while Cuchulain is carried away and healed
    with water and magical herbs. Sualtam rides to rouse Ulster, is accidentally decapitated,
    and his severed head continues to cry its warning until Conor and the warriors
    begin to recover from Macha’s curse. Conor swears an oath and summons Ulster to
    arms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cuchulain asks Ferdia to choose the day’s weapons; Ferdia gives Cuchulain
    the choice, and Cuchulain chooses “all or any.” They fight with spears until midday
    without either gaining advantage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cuchulain attacks over Ferdia’s shield with a sword and leaps three times;
    Ferdia catches him on the shield and throws him into the Ford, while Laeg mocks
    Cuchulain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cuchulain’s frenzy comes upon him; he becomes giant-like, overtops Ferdia,
    and a hero-light blazes about his head.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: During close combat, demons, goblins, and unearthly things of the glens scream
    from the edges of the swords, and the waters of the Ford recoil so that the combatants
    fight on dry land in the riverbed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ferdia wounds Cuchulain deeply with the sword; the river runs red with Cuchulain’s
    blood, and Cuchulain calls to Laeg for the Gae Bolg.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cuchulain strikes over Ferdia’s shield with a spear and then drives the Gae
    Bolg upward with his toes; it pierces Ferdia’s protections and fills his body
    with barbs. Ferdia says the blow is his death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cuchulain carries the falling Ferdia northward across the Ford so that Ferdia
    will not die on the side of the men of Erin; Cuchulain then collapses in a swoon
    like death, and Maev’s host crosses into Ulster.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before leaving the Ford, people take Ferdia’s body, bury it in a grave, build
    a mound over it, and set up a pillar-stone bearing his name and lineage in Ogham.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Friends of Cuchulain carry him to Murthemney, wash him, bathe his wounds in
    streams, and his Danaan kin cast magical herbs into the rivers for his healing;
    he remains weak and stuporous for many days.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sualtam, Cuchulain’s father, takes the Grey of Macha and rides out to rouse
    Ulster, crying that Ulster’s men are being slain, women taken captive, and cattle
    driven away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At Emania, Sualtam tells Cathbad, Conor, and the nobles that Cuchulain alone
    holds the gap of Ulster against the four provinces of Erin and calls on them to
    defend themselves.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Cathbad says death is due to one who disturbs the king; Conor says Sualtam’s
    message is true, and the lords of Ulster murmur that it is true.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: As Sualtam turns away angrily, the Grey starts, Sualtam’s neck hits the sharp
    rim of the shield on his back, and his head is severed. The head continues crying
    its message, and Conor orders it placed on a pillar.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The continued crying of Sualtam’s head begins to penetrate Conor’s clouded
    mind; the warriors’ eyes begin to glow, and Macha’s curse slowly lifts from their
    minds and bodies.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Conor swears an oath invoking the heavens, earth, and sea, promising to restore
    every woman and every cow; his Druid declares the hour propitious, and messengers
    are sent to summon Ulster to arms.
  category: speech
  evidence_refs:
  - ev:13
