  quote: ''
  summary: 'The passage summarizes the opening framework of the medieval Irish “Colloquy
    of the Ancients”: the aged survivors Keelta and Oisīn part after a last meeting;
    Keelta encounters St. Patrick, is purified with holy water, locates a baptismal
    well, and becomes Patrick’s guide and storyteller through Irish landscape lore
    connected with the Fianna, Fairy Folk, Tara, and named places.'
