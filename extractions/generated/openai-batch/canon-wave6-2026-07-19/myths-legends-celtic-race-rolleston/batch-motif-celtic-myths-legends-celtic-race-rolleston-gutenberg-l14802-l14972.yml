canonical_text:
  quote: ''
  summary: Index entries list Celtic mythological figures, places, texts, motifs,
    and cross-references, including transmigration, animal transformations, Tuan mac
    Carell, the Tuatha Dé Danann, the Underworld, wells, the Ulster cycle, the Wee
    Folk, Vivionn, magical illusion, parallels between Dermot and Grania and Tristan
    and Iseult, and tasks set by Yspaddaden.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tory Island is described as a stronghold of Fomorian power and as invaded
    by the Nemedians.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The entry on transmigration says Celtic immortality was alleged to embody
    an Oriental conception, but also says the Celts did not hold the doctrine in the
    same way as Pythagoras and Orientals.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Welsh Taliesin is listed as having become an eagle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tuan mac Carell’s legend is recorded in the Book of the Dun Cow; he is called
    king of all deer in Ireland and is said to have given the name gods to the People
    of Dana.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Tuatha Dé Danann are glossed as the folk of the god whose mother is Dana.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tyren is described as changed by a woman of the Fairy Folk into a hound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Twrch Trwyth is described as a king in the shape of a monstrous boar.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Underworld entry links the Underworld with a cult found by Celts in Western
    Europe, names Dis or Pluto and Māth as gods of it, and says it is identical with
    the Land of the Dead.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Well of Knowledge is said to be equivalent to Connla’s Well, and Sinend
    is said to have made a fatal visit to it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mac Cecht is listed as visiting the Well of Kesair, and Keelta is listed as
    praising the Well of Tradaban.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Macha’s curse is listed as causing the debility of the Ultonians and descending
    on Ulster; the same index entry also notes the lifting and later recurrence of
    the curse.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Maev’s war against Ulster is described as being undertaken to secure the Brown
    Bull of Quelgny, and Cuchulain of Murthemney is listed as guarding the passes
    of Ulster.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Wee Folk are linked with Fergus mac Leda, Iubdan is named king of the
    Wee Folk, and the Wee Folk are said to swarm into Ulster.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Vivionn is described as a young giantess from the Land of Maidens, daughter
    of Treon, slain by Æda, and buried at the Ridge of the Dead.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: The Veil of Illusion is said to be thrown over Caradawc by Caswallan.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: The tale of Dermot and Grania is said to be paralleled in the story of Tristan
    and Iseult as told by Heinrich von Freiberg.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:17
  text: Vitra is described as the God of Evil in Vedantic mythology and as related
    to Cenchos, the Footless.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:18
  text: Yspaddaden Penkawr is named as father of Olwen, as setting tasks for Kilhwch,
    and as slain by Goreu son of Custennin.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:19
  text: A maiden called Youth is listed as giving the Love Spot to Dermot.
  category: action
  evidence_refs:
  - ev:18
- id: obs:20
  text: The Tylwyth Teg are glossed as Welsh fairies, with Gwyn ap Nudd named as their
    king.
  category: relationship
  evidence_refs:
  - ev:19
