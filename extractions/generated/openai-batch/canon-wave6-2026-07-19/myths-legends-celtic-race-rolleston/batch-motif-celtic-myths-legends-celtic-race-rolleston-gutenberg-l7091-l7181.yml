canonical_text:
  quote: ''
  summary: 'The passage first recounts Keelta helping Fairy Folk against oversea pirates,
    receiving a prophecy of his remaining lifespan, refusing a magical restoration
    to youth on Christian grounds, and accepting healing. It then begins the tale
    of Oisín’s birth: Finn’s hounds spare a pursued fawn, who becomes Saba and explains
    that a Fairy Druid named the Dark changed her for refusing him. Finn marries and
    protects her, but while he is away fighting Northmen, a deceptive likeness of
    Finn lures Saba out, strikes her with a hazel wand, turns her back into a deer,
    and she is chased away.'
  language: English
