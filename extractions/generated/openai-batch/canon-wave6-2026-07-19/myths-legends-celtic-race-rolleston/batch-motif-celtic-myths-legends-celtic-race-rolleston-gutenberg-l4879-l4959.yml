canonical_text:
  quote: ''
  summary: Cuchulain crosses a hostile bridge to Skatha’s fortress, becomes her pupil,
    learns warrior feats and the Gae Bolg, joins Skatha’s war against Aifa, defeats
    Aifa by a trick, spares her on terms of peace, and becomes her lover. Before leaving,
    he gives Aifa a ring and instructions for a future son named Connla, including
    geise of non-disclosure, never turning aside, and never refusing combat. Later
    a young lad arrives by bronze boat at an Ulster gathering, performs feats, refuses
    to turn back or identify himself, and defeats Ulster warriors sent against him.
  language: English
  quote_policy: summarized
