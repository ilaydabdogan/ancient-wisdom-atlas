canonical_text:
  quote: ''
  summary: 'The passage first characterizes a Connacht warrior-queen and Gaelic women-warriors.
    It then summarizes the Ultonian tale of Fergus mac Leda and Iubdan, King of the
    Wee Folk: Iubdan boasts in Faylinn, Eisirt reports the larger people of Ulster,
    travels to Fergus, returns with Æda as proof, and binds Iubdan by geise to visit
    Fergus and taste his porridge. Iubdan and Bebo travel over the sea, Iubdan falls
    into the porridge-pot, and Fergus detains them. Iubdan gives tree-burning advice,
    the Wee Folk afflict Fergus’s land and offer fertility, and Iubdan is finally
    ransomed with magical water-shoes after naming other fairy treasures.'
  language: English
  quote_policy: summarized
