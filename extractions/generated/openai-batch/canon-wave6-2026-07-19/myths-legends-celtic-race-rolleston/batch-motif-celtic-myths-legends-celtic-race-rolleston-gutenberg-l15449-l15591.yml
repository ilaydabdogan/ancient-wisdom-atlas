  summary: The passage is a set of explanatory notes. It defines Ogham writing on
    pillar-stones, mentions Mananan’s magic swine and the eternal youth of the People
    of Dana, explains hound-name symbolism in the Ultonian cycle, links Skatha’s supernatural
    country with Skye, identifies Lugh as Cuchulain’s father and Macha’s curse as
    not applying to Cuchulain, notes Cuchulain’s belly spear and Ferdia, and compares
    Fergus’s fairy sword Caladcholg with Arthur’s Excalibur.
