canonical_text:
  quote: ''
  summary: 'The passage closes one Ossianic episode in which Goll mac Morna kills
    the hag-like Irnan, after which the Fianna sack and burn Conaran’s dūn and Goll
    receives Keva. It then recounts “The Chase of Slievegallion”: Milucra, jealous
    of Ainé and seeking Finn, enchants a lake on Slievegallion. Finn follows his hounds
    after a fawn to the mountain, is compelled by a beautiful weeping woman to recover
    a gold ring from the lake, and emerges as a feeble white-haired old man. The Fianna
    discover him, dig into the Fairy Mound, and obtain a red-gold drinking horn that
    restores Finn’s form but leaves his hair silver-white by his own choice. The passage
    adds an allegorical interpretation of wisdom through suffering and a local tradition
    of the Witch of the Lake.'
  language: English
  quote_policy: summarized
