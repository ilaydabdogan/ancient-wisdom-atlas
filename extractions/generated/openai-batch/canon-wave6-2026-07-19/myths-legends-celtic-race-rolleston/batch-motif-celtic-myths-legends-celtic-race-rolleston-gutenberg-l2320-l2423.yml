canonical_text:
  quote: ''
  summary: The passage introduces the Legend of Tuan mac Carell from the Book of the
    Dun Cow. St. Finnen obtains hospitality from Tuan by fasting at his doorstep.
    Tuan then recounts Ireland's ancient history from Partholan onward, claiming to
    have survived successive ages by transforming from decrepit human survivor into
    stag, boar, sea-eagle, salmon, and finally human again after being eaten by Carell's
    wife and reborn from her womb. He preserves memory of all these ages and teaches
    the Christian monks. The narrator compares the tale to Welsh Taliessin's transformations
    and to a Celtic idea of transmigration of the soul.
  language: English
  quote_policy: summarized
