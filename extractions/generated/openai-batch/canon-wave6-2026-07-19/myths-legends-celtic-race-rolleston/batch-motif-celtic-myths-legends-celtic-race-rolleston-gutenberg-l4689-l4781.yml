- id: obs:1
  text: The genealogy links Dectera with Lugh and lists Cuchulain as their child;
    a note adds that Dectera also had a mortal husband, Sualtam, who passed as Cuchulain's
    father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dectera, daughter of Cathbad, disappears from Conor's court with fifty young
    female companions, and their location remains unknown for three years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A flock of birds descends on fields around Emain Macha, destroys crops and
    fruit, and draws Conor's party onward toward the Fairy Mound of Angus on the river
    Boyne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the river, an Ulster warrior finds a noble mansion and recognizes Dectera,
    her fifty maidens, and Lugh of the Long Arm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the morning a newborn male infant is found in the hut among the Ulster
    warriors and is described as Dectera's gift to Ulster.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The child is taken home, given to Dectera's sister Finchoom for nursing, named
    Setanta, and allotted the Plain of Murthemney as inheritance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Druid Morann prophesies that the infant will be widely praised, loved
    by many, avenge wrongs, give combat at fords, and decide quarrels.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When old enough, Setanta goes to Conor's court to be brought up and instructed
    with other sons of princes and chieftains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cullan, a wealthy smith hosting Conor's company, bars the fortress gates and
    releases a huge ferocious dog to guard the mansion for the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Setanta arrives after being forgotten by the feast party; the hound attacks
