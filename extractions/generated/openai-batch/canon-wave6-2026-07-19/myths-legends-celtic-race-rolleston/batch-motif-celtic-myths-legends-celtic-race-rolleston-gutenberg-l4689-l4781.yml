canonical_text:
  quote: ''
  summary: 'The passage gives Cuchulain''s genealogy and birth narrative: Dectera
    disappears with fifty maidens, birds lure Conor''s party to a fairy mound and
    riverside mansion, Lugh and Dectera are found there, and a newborn male infant
    is later discovered and brought to Ulster as Setanta. The infant receives a prophecy
    from the Druid Morann. In a later episode, young Setanta follows King Conor to
    Cullan''s feast, kills Cullan''s guardian hound at the gate, offers to replace
    it and guard the house himself, and receives the name Cuchulain, the Hound of
    Cullan.'
  language: English
  quote_policy: summarized
