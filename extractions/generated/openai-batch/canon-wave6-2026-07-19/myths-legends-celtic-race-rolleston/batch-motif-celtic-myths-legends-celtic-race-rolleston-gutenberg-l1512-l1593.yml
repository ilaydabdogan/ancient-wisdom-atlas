canonical_text:
  quote: ''
  summary: The passage describes cup-and-ring markings on megalithic stones, notes
    similar examples in Europe, India, and a possible Mexican example, and proposes
    a cautious sepulchral interpretation. It then describes New Grange on the Boyne
    as a chambered tumulus associated in Irish tradition with the Sidhe and with royal
    pagan burials, and gives details of its mound, passage, chamber, carvings, and
    stone basins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cup-shaped hollows are described as being made in stone surfaces, often surrounded
    by concentric rings, with one or more radial lines drawn outward from the cup.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some systems of cups are joined by lines, but more often the lines end a short
    distance outside the widest ring.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that these markings occur in Great Britain, Ireland, Brittany,
    and India, where they are called mahadéos.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'A possible example from New Spain or Mexico is described on the circular
    top of the Triumphal Stone: a central cup, nine concentric circles, and a straight
    channel from the cup to the rim.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the meaning of the cup-and-ring markings remains unresolved
    for antiquarians.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage proposes, as a guess, that cup-and-ring markings may be diagrams
    or plans of a megalithic sepulchre, with the hollow as burial-place, rings as
    surrounding structures, and the duct as an approach.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: New Grange is described as a major chambered tumulus on the northern bank
    of the Boyne in Ireland.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Boyne tumuli are said to appear in ancient Irish mythical literature both
    as dwelling-places of the Sidhe or Fairy Folk and as traditional burial-places
    of pagan Celtic High Kings.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The story of King Cormac says he ordered that he should not be buried at the
    royal cemetery by the Boyne because of its pagan associations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The monuments are said to have been opened and plundered by the Danes in the
    ninth century, while still preserving evidence of sepulchral origin and association
    with primitive religion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: New Grange is described externally as a large mound or knoll, about 280 feet
    across and 44 feet high, with an outer circle of standing stones, an inner ditch
    and rampart, and a curb of large stones.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A passage entrance was found by workmen taking road material from the mound;
    the boundary stone below it is carved with spirals and lozenges, and the entrance
    faces south-east.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage into New Grange is formed of upright slabs roofed with slabs,
    is about three feet wide, and runs straight for sixty-two feet into the mound.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The inner passage ends in a cruciform chamber with a domed roof made from
    overlapping flat stones; each of the three recesses contains a large stone basin
    or rude sarcophagus, but no burial traces remain.
  category: object
  evidence_refs:
  - ev:8
