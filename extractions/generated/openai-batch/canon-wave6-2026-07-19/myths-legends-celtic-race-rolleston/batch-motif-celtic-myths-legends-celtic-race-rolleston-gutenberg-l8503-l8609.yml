canonical_text:
  quote: ''
  summary: 'Maeldūn and his companions continue a sea voyage through a sequence of
    marvelous islands: an empty house supplied with food, an inaccessible apple island
    whose branch grows sustaining fruit, islands with dangerous beasts, fiery swine
    and golden apples, a white tower guarded by a cat that punishes theft, an island
    of black and white sheep that change color across a boundary, an island with giant
    livestock and a burning river, and an island with a mill grinding begrudged goods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The voyagers find a high island with a shore house whose stone-valved door
    opens into the sea and receives salmon hurled in by waves.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The house is empty of people but contains beds, meat, and drink arranged for
    the chief and his company; Maeldūn’s party eats, drinks, and departs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the apple island, Maeldūn breaks off a twig while the crew cannot find
    an entrance; after three days and nights, three apples grow on the rod, each feeding
    the crew for forty days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A huge beast within a stone fence runs around an island and alternately turns
    its body inside its unmoving skin and its skin around its body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The huge beast attacks the party, and stones strike them as they row away;
    one stone pierces Maeldūn’s shield and lodges in the boat’s keel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the island of the biting horses, horse-like beasts tear flesh from one
    another so that the island runs with blood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The voyagers are disheartened and complain because they do not know their
    location or how to obtain guidance or aid in their quest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: On an island full of golden-apple trees, red beasts like fiery swine kick
    the trees so that apples fall and are eaten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Birds leave the fiery-swine island in the morning, swim out to sea until nones,
    return until vespers, and eat apples all night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maeldūn’s companions land at night, feel the hot soil caused by the fiery
    swine in underground caverns, gather apples that relieve hunger and thirst, and
    sail away refreshed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the eleventh island the voyagers find a tall white chalk tower with white
    houses and an empty large house containing a small cat playing on four stone pillars.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The house of the cat contains rows of gold and silver brooches, neck-torques,
    swords with gold and silver hilts, quilts, shining garments, roasted meat, bacon,
    and liquor.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Maeldūn asks the cat whether the provisions have been left for them; the cat
    looks at him and continues playing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The youngest of Maeldūn’s foster-brothers takes a necklace; the cat leaps
    through him like a fiery arrow, leaving him as ashes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Maeldūn had forbidden the jewel theft, soothes the cat, replaces the necklace,
    and the crew scatters the youth’s ashes on the shore before sailing away.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: An island is divided by a brazen palisade, with black sheep on one side, white
    sheep on the other, and a big man tending them.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:17
  text: When the big man puts a white sheep among black sheep it becomes black, and
    when he puts a black sheep among white sheep it becomes white.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Maeldūn throws a peeled white wand onto the black-sheep side; it turns black,
    and the party departs in terror without landing.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: On a wide island with huge swine, the party kills and roasts a small pig too
    large to carry aboard.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: Diuran and Germān climb a high mountain, encounter a broad river, and Germān’s
    spear haft is consumed when dipped in the water as if by liquid fire.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:21
  text: Across the river a huge man guards what appears to be a herd of oxen and warns
    the men not to disturb the calves.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:22
  text: On the island of the mill, the voyagers find a grim mill and a giant miller
    who says half the corn of their country is ground there, namely what people begrudge
    one another.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:23
  text: The voyagers see many heavy loads going to the mill and all the ground material
    carried westward; they cross themselves and sail away.
  category: action
  evidence_refs:
  - ev:14
