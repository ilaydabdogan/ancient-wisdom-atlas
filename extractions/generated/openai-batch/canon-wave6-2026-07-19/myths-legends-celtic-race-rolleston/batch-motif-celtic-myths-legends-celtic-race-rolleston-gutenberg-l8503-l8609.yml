- id: ev:7
  type: summary
  locator: 8555-8562
  quote_or_summary: At the Island of the Little Cat, the hungry party finds a tall
    white chalk tower and white houses; in the largest empty house a small cat plays
    on four stone pillars.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summary only.
- id: ev:8
  type: summary
  locator: 8562-8569
  quote_or_summary: The cat’s house contains rows of gold and silver brooches, neck-torques,
    and swords, plus quilts, garments, roasted ox, bacon, and liquor; Maeldūn asks
    the cat if these were left for them.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summary only.
- id: ev:9
  type: summary
  locator: 8569-8578
  quote_or_summary: After eating and sleeping, the youngest foster-brother takes a
    necklace; the cat leaps through him like a fiery arrow and he becomes ashes. Maeldūn,
    who had forbidden the theft, soothes the cat, replaces the necklace, and the party
    scatters the ashes before leaving.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summary includes a brief public-domain phrase.
- id: ev:10
  type: summary
  locator: 8580-8586
  quote_or_summary: The Island of the Black and the White Sheep has a brazen palisade,
    black sheep on one side, white sheep on the other, and a big man who changes each
    sheep’s color by moving it among the opposite flock.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summary only.
- id: ev:11
  type: summary
  locator: 8586-8589
  quote_or_summary: Maeldūn throws a peeled white wand onto the black-sheep side;
    it turns black, and the party leaves in terror without landing.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summary only.
- id: ev:12
  type: summary
  locator: 8591-8598
  quote_or_summary: On the Island of the Giant Cattle, the party kills a large small
    pig, while Diuran and Germān climb a high mountain and find a broad river; Germān’s
    spear haft is consumed as with liquid fire when dipped in the water.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summary only.
- id: ev:13
  type: summary
  locator: 8598-8601
  quote_or_summary: Across the river a huge man guards what seems to be oxen and tells
    the men not to disturb the calves, so they go no farther and leave quickly.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summary only.
- id: ev:14
  type: summary
  locator: 8603-8609
  quote_or_summary: On the Island of the Mill, a giant miller says half the corn of
    their country is ground there, namely what people begrudge each other; the voyagers
    see heavy loads, the ground material carried westward, cross themselves, and sail
    away.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
