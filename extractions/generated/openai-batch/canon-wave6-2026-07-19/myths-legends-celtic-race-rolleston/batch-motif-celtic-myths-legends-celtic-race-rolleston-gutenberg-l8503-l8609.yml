candidate_motifs:
- id: motif:1
  label: quest voyage through successive marvelous islands
  taxonomy_refs:
  - mystical_quest
  basis: The party is explicitly on a quest and repeatedly reaches distinct islands
    with marvelous beings, dangers, and provisions while seeking guidance.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:14
  confidence: medium
  cautions: The passage excerpt does not state the full purpose or destination of
    the quest.
- id: motif:2
  label: miraculous sustenance in time of hunger
  taxonomy_refs: []
  basis: The voyagers receive food in empty houses, apples that sustain the whole
    crew for forty days, and golden apples that relieve hunger and thirst.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: high
  cautions: No available taxonomy reference directly names this food-provision pattern.
- id: motif:3
  label: forbidden theft of guarded treasure punished by supernatural animal
  taxonomy_refs:
  - sacred_theft
  basis: Maeldūn forbids taking the jewel; the youngest foster-brother steals a necklace
    and is killed by the cat, after which Maeldūn returns the necklace.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames the taking as theft of a jewel, but does not explicitly
    call the treasure sacred.
- id: motif:4
  label: transformative boundary between black and white sides
  taxonomy_refs:
  - duality
  basis: A brazen palisade divides black sheep from white sheep, and crossing the
    boundary changes sheep and Maeldūn’s white wand to the side’s color.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage gives the transformation literally but does not explain its
    symbolic meaning.
- id: motif:5
  label: dangerous marvelous animals guarding or dominating islands
  taxonomy_refs: []
  basis: The voyagers encounter a revolving beast, flesh-tearing horse-like beasts,
    fiery swine, a punishing cat, and giant guarded livestock across several islands.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:9
  - ev:13
  confidence: high
  cautions: This is a descriptive recurrence in the passage rather than a specific
    supplied taxonomy family.
- id: motif:6
  label: moralized mill grinding begrudged goods
  taxonomy_refs:
  - divine_judgment
  basis: The giant miller states that the mill grinds what people begrudge one another,
    and the voyagers respond by crossing themselves and departing.
  evidence_refs:
  - ev:14
  confidence: low
  cautions: The passage does not identify the mill as divine judgment; the taxonomy
    link is tentative because the action is moralized but not explicitly adjudicative.
