canonical_text:
  quote: ''
  summary: The passage first cites Alfred Nutt on Gaelic ritual, fairy powers, and
    surviving simulacra of older sacrifices. It then recounts the myth of Sinend,
    who approaches Connla’s Well beneath the sea in the Land of Youth, where hazels
    of wisdom drop their growth into the water; the waters overwhelm her and she dies
    on the Shannon shore, giving the river its name. A quoted poem elaborates the
    image of the sacred hazel, Connla’s Well, immortal waters, and mountain setting.
    The passage next introduces the Milesians as human invaders with divine and underworld
    ancestry, coming from “Spain,” interpreted as the Land of the Dead. Ith sees Ireland
    from Bregon’s tower and sails there with ninety warriors. A quoted comparison
    from de Jubainville describes a tradition of mariners ferrying invisible dead
    passengers to Britain, and explains night and winter as times when the boundary
    between the lands of life and death is lowered.
  language: English
  quote_policy: summarized
