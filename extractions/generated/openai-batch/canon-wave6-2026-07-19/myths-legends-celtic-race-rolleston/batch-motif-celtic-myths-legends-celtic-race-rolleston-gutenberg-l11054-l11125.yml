canonical_text:
  quote: ''
  summary: The passage discusses Chrestien de Troyes's Grail episode in relation to
    Welsh Peredur, later Welsh and French continuations, and Wolfram von Eschenbach.
    Perceval is trained not to ask questions, sees marvels at the Castle of Wonders,
    and is later reproached for not asking their meaning. Rolleston contrasts the
    French interpretation of the question episode with what he considers the older
    Welsh logic of obedience and self-restraint. Later continuators identify the Grail
    and lance with Christian relics, while Wolfram presents the Grail as a life-sustaining
    stone.
  language: English
  quote_policy: summarized
