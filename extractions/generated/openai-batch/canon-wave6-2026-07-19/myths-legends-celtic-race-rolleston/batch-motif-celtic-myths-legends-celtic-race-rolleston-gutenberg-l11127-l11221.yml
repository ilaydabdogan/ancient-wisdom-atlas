canonical_text:
  quote: The Grail therefore, besides its other characters, had a talismanic power
    in promoting increase, wealth, and rejuvenation.
  summary: The passage summarizes Wolfram's Grail legend, including the Grail's heavenly
    origin, guardianship, Anfortas's wound, Parzival's failed and later successful
    Grail quest, and Loherangrain as the Swan Knight. It then discusses French and
    Welsh Grail materials, emphasizing the Grail's power of abundance and rejuvenation
    and comparing it with the Welsh Stone of Abundance and the Celtic cauldron of
    abundance associated with the Dagda, Bran, Arthur, Annwn, and Taliesin's poem.
  language: English
  quote_policy: quoted
