candidate_motifs:
- id: motif:1
  label: Disguised magical entry past guardians
  taxonomy_refs:
  - trickster_boundary
  basis: Kian crosses the sea by spells, uses woman's garb, and gains entry to Ethlinn's
    guarded place through Birōg's false story and enchantment.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage describes disguise and deception, not literal shapeshifting.
- id: motif:2
  label: Threatened child born in a triple birth
  taxonomy_refs:
  - miraculous_child
  basis: Ethlinn gives birth to three sons, Balor orders them drowned, and one child
    survives by falling from the sheet.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not call the birth divine; the motif label is limited
    to the extraordinary threatened-child pattern.
- id: motif:3
  label: Infant exposure to water with accidental survival
  taxonomy_refs: []
  basis: Balor's messenger carries the infants to a whirlpool, but a loosened pin
    causes one child to fall into a bay instead of being drowned.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No supplied motif-family taxonomy directly matches infant exposure; water
    is treated separately as a symbol.
- id: motif:4
  label: Fostered child trained in crafts
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The surviving child Lugh is fostered by a smith and trained in craft and
    handiwork before becoming the Danaan redeemer and all-craftsman.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage summarizes rather than narrates the training in detail.
- id: motif:5
  label: All-craftsman recognized by mastery of many arts
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: Lugh lists multiple arts and occupations and is admitted when his unique
    possession of all these skills is recognized; he receives the name Ildánach, the
    All-Craftsman.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The court-entry episode is presented in a mythographic retelling.
- id: motif:6
  label: Return from otherworld with magical equipment
  taxonomy_refs:
  - return
  - afterlife_journey_map
  basis: Lugh comes from the Land of the Living, also associated earlier with the
    Land of the Dead, bringing the Boat of Mananan, the Horse of Mananan, and Fragarach.
  evidence_refs:
