comparison_claims:
- id: claim:1
  claim: The passage presents Lugh as functionally comparable to Apollo as a presiding
    figure over knowledge, artistic skill, and medicinal skill.
  claim_level: same_function
  target: Apollo
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a narrator-supplied comparison in a secondary mythographic
    retelling, not a direct statement from an ancient Celtic source.
- id: claim:2
  claim: The passage links Lugh with the Gaulish god whom Caesar identified with Mercury,
    especially through the function of inventing or presiding over the arts.
  claim_level: same_function
  target: Gaulish god identified by Caesar with Mercury
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports de Jubainville's comparison and Caesar's interpretatio;
    it does not provide independent linguistic or inscriptional evidence in this excerpt.
