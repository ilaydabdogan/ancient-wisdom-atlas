canonical_text:
  quote: ''
  summary: The passage recounts Kian's magically aided access to Ethlinn, the birth
    and attempted drowning of her three sons, the survival and fosterage of Lugh,
    Lugh's later recognition as all-craftsman at Nuada's court, his return from the
    Land of the Living with magical gifts, and his leadership of the Danaans against
    Fomorian tribute demands. It ends by introducing a quest for further magical instruments
    needed for victory.
