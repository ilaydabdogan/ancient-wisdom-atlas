canonical_text:
  quote: ''
  summary: 'The passage first recounts Cuchulain’s final actions: he drinks and bathes
    at a loch, binds himself upright to a pillar-stone, is attended by animals and
    foes, is decapitated by Lewy, and is avenged by Conall. It then introduces legends
    about the lost Tain, said to have been written in Ogham on wooden staves and taken
    to Italy. Sanchan seeks to recover it, sends Murgen and Eimena on a quest, and
    Murgen discovers Fergus mac Roy’s Ogham-marked burial pillar. Murgen offers his
    life for the Tain and then appeals to Fergus for the sake of Song; Fergus rises
    amid mist and a voice speaks through the vapours.'
  language: English
  quote_policy: summarized
