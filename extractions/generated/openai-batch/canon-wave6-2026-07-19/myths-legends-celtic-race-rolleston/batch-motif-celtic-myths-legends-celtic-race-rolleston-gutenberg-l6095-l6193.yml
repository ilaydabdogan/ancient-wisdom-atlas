candidate_motifs:
- id: motif:1
  label: Hero chooses upright death at a stone
  taxonomy_refs: []
  basis: Cuchulain binds himself to a pillar-stone so that he may die standing rather
    than lying down.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage does not explicitly interpret the pillar-stone beyond its
    practical use for standing death.
- id: motif:2
  label: Animals attend, protect, or mark the fallen hero
  taxonomy_refs: []
  basis: An otter laps Cuchulain’s blood, the Grey of Macha protects and later touches
    the body, a crow settles on his shoulder, and the Dewy-Red helps Conall kill Lewy.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The functions of the otter and crow are not explained by the narrator;
    only their actions are stated.
- id: motif:3
  label: Severed head and hand as retaliatory tokens
  taxonomy_refs: []
  basis: Lewy cuts off Cuchulain’s head, Cuchulain’s falling sword cuts off Lewy’s
    hand, Cuchulain’s head and hand are taken to Tara, and Conall later takes Lewy’s
    head.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage presents trophy-taking and burial but does not add a broader
    symbolic explanation.
- id: motif:4
  label: Lost heroic poem recovered through a quest for written traces
  taxonomy_refs:
  - wisdom
  basis: The Tain is lost after being written in Ogham on wooden staves; Sanchan searches
    for fragments and sends Murgen and Eimena to seek the staff-book.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The excerpt ends before the complete recovery is narrated.
- id: motif:5
  label: Life-price offered for help from the dead
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Sanchan considers summoning Fergus’s spirit at the cost of life, and Murgen
    later vows to give his life and abandon loved ones for the recovery of the Tain.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: high
  cautions: The narrator qualifies the life-price with 'it seems,' and Fergus does
    not respond to Murgen’s first plea in the excerpt.
- id: motif:6
  label: Dead founder-poet awakened for the sake of song
  taxonomy_refs:
  - culture_hero
  - wisdom
  - return
  basis: Murgen names Fergus as the one who gave the Poem to the Gael, appeals to
    him for Song, and Fergus rises in mist afterward.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage supports Fergus’s rising and poetic role, but the excerpt
    stops before any teaching or recitation is shown.
- id: motif:7
  label: Inscribed grave reveals a heroic dead figure
  taxonomy_refs:
  - wisdom
  basis: Murgen traces Ogham strokes on a burial pillar and reads that Fergus son
    of Roy is there, locating the grave needed for the appeal to Fergus.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The inscription is a literal grave identification; further ritual use
    is only beginning in this excerpt.
comparison_claims:
- id: claim:1
  claim: The passage identifies the recovery of the Tain as belonging to a Gaelic
    legend complex, noting that it was the subject of a number of legends later combined
    by Ferguson.
  claim_level: same_motif
  target: Gaelic legends concerning the Recovery of the Tain
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The excerpt does not provide separate versions of those legends, only
    the narrator’s statement that multiple legends existed.
- id: claim:2
  claim: 'Within the passage, the recovery episode is framed as sharing the function
    of preserving cultural wisdom and poetic inheritance: the lost Tain is a treasured
    poem, Fergus is credited with giving the Poem to the Gael, and Song is described
    as the remaining treasure of the native land.'
  claim_level: same_function
  target: wisdom and culture-hero motif functions
  evidence_refs:
  - ev:7
  - ev:8
  - ev:14
  counter_evidence_refs: []
  confidence: medium
