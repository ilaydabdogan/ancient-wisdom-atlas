canonical_text:
  quote: ''
  summary: The passage discusses megalithic monuments and cult relics, especially
    the Breton tumulus of Mané-er-H’oeck, sculptured stones at Gavr’inis, holed stones,
    stone-worship, holy wells, and cup-and-ring markings. It records artifact arrangements,
    proposed magical or divinatory meanings, fertility associations, and later Christianized
    survivals or condemnations of stone, tree, and well veneration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tumulus of Mané-er-H’oeck in Brittany is described as intact when explored,
    with the chamber and objects left as the builders had placed them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the chamber entrance there was a sculptured slab with a mysterious graven
    sign that the passage says may have been a chief’s totem.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the chamber were a green jasper pendant, a large jadite ring, a jadite
    axe-head with its point resting on the ring, additional jasper pendants, and a
    white jade axe-head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chamber objects were arranged intentionally in a straight line along a
    diagonal from north-west to south-east, and one corner contained 101 axe-heads
    in jade, jadite, and fibrolite.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that the axe was a known symbol of power or godhead and
    compares its occurrence with Bronze Age rock-carvings, Egyptian hieroglyphs, and
    Minoan carvings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: No bones, cinders, or funerary urn were found in the chamber, and the structure
    is called a cenotaph.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:7
  text: At Gavr’inis and in other megalithic monuments in Ireland and Scotland, stones
    were found sculptured with waving and concentric line designs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage says the sculptured line designs resemble the lines at the roots
    and tips of human fingers when examined under magnification.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The passage raises the possibility that the line designs refer to chiromancy
