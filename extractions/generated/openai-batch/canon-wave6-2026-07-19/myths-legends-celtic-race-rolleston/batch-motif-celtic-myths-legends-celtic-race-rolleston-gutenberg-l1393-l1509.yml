  category: speech
  evidence_refs:
  - ev:2
- id: obs:10
  text: An illustration caption identifies stones from Brittany sculptured with footprints,
    axes, and finger-markings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: Small holes bored through chamber stones are described as appearing in many
    monuments from Western Europe to India.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage asks whether holed stones served as apertures for spirits of the
