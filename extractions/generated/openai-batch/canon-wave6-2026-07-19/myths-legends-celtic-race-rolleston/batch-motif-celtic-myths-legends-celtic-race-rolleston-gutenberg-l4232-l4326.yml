canonical_text:
  quote: ''
  summary: A woman is visited by a bird-form denizen from the Land of Youth who becomes
    a glorious youth and foretells the birth of Conary and a prohibition involving
    birds. Conary is later selected as king through a bull-feast divination, encounters
    transformed birds led by Nemglan, follows the prophetic sign to Tara, receives
    royal taboos, and rules prosperously. His foster-brothers are banished for raiding,
    ally with Ingcel the One-Eyed, and return toward Ireland with an outlaw host.
  language: English
  quote_policy: summarized
