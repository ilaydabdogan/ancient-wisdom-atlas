canonical_text:
  quote: ''
  summary: Cuchulain hears Cathbad's prophecy that a youth taking arms on that day
    will win great fame but live briefly. He asks King Conor for the arms of manhood,
    breaks ordinary weapons and chariots, and keeps the king's own equipment. He seeks
    Emer as bride, but she points to obstacles involving her father, her sister, and
    Cuchulain's still-unperformed deeds. Cuchulain then goes overseas to learn war-feats
    from Skatha in the Land of Shadows, crosses the Plain of Ill-luck with help from
    a radiant young man and a blazing wheel, and reaches the perilous Bridge of Leaps,
    where Ferdia explains its danger and names the bridge-leap and Gae Bolg as final
    feats taught by Skatha.
  language: English
  quote_policy: summarized
