canonical_text:
  quote: ''
  summary: 'Rolleston introduces the Welsh Barddas as a late, disputed source for
    bardic philosophy, then summarizes its cosmology: God and Cythrawl are primary
    principles; Annwn is the Abyss or Chaos; God’s Word forms Manred, the primal substance;
    existence is arranged in the circles Abred, Gwynfyd, and Ceugant; a catechism
    describes a being’s passage from Annwn through all living forms and suffering
    toward human state and eventual Gwynfyd.'
  language: English
  quote_policy: summarized
