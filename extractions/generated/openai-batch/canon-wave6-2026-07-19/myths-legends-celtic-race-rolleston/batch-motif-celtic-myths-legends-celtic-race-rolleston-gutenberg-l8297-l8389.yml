canonical_text:
  quote: ''
  summary: The passage closes the account of Oscar's death after the Battle of Gowra,
    Finn's grief and uncertain death-traditions, a folk-lore apparition connected
    with Gowra, and a popular tradition that Finn and his companions sleep spell-bound
    in an enchanted cave awaiting a future return. It then introduces the Voyage of
    Maeldūn as an early Irish wonder-voyage and begins the tale with Maeldūn's conception,
    Ailill's death, Maeldūn's secret fostering by a queen, and his exceptional beauty
    and athletic youth.
