  text: Eochy assembled forces to storm and destroy the fairy mound described as Midir's
    palace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eochy spent nine years digging up mounds while Midir and his people repaired
    the damage as fast as it was made.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Midir sent Etain to Eochy with fifty handmaids made so alike that Eochy could
    not distinguish the true Etain until she gave him a sign.
  category: sequence
  evidence_refs:
  - ev:2
