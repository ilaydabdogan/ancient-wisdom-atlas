canonical_text:
  quote: ''
  summary: The passage recounts Eochy's search for Etain, Druidic divination that
    locates her in Midir's fairy mound, Eochy's assault on the mound, Midir's stratagem
    with identical women, and Etain's recovery. It then frames Conary Mōr's genealogy
    and the Danaan vengeance behind his death, explains the Irish institution of the
    geis through definitions and examples, and begins the story of Messbuachalla,
    an exposed infant spared, fostered by a cowherd, hidden in a wicker house, and
    identified with a Druidic prophecy concerning King Eterskel's heir.
  language: English
  quote_policy: summarized
