canonical_text:
  quote: The Past may be forgotten, but it never dies.
  summary: Front matter identifies Rolleston's Myths & Legends of the Celtic Race
    and a captioned Queen Maev image. The preface argues that ancient elements of
    national life endure, that the Celtic contribution to British history and culture
    has been obscured by the term “Anglo-Saxon,” and that “Anglo-Celtic” better describes
    the blended inheritance of the intended audience. It cites E. W. B. Nicholson
    on names, language, political organization, and race, then states that the book
    is written to remember Celtic contributions to European culture.
  language: English
  quote_policy: quoted
