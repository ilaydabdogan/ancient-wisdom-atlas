canonical_text:
  quote: ''
  summary: A set of authorial notes on Celtic and Arthurian mythic material, including
    name etymologies, medievalized Welsh combat, burial-place traditions, a royal
    feet-holding custom, Arthur and the family of Dôn, Owain’s raven-army, Per-name
    vessel associations, Grail stone/chalice traditions, Grail purity restrictions,
    the Grail Castle treasure set, and transmigration motifs involving Tuan mac Carell
    and Taliesin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that Lugh is equated with Lux or Light, and that the Celtic
    words Lamh and Llaw could be used for either hand or arm.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finn and Gwyn are described as Gaelic and Cymric forms of the same name, meaning
    fair or white.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Certain Welsh tale heroes are described as fighting like medieval mounted
    knights with spears, not in chariots or on foot and not with the unusual weapons
    associated with Gaelic battle-tales.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The notes state that stories in Ireland and Wales attach themselves to actual
    burial-places, and mention a funeral urn found at the place traditionally identified
    as Branwen’s sepulchre.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A court practice is described in which a high officer held the king’s feet
    in his lap while the king sat at meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gods of the family of Dôn are described as conceived as servitors to Arthur,
    who is identified in this story as the god Artaius.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Owain is said to have a raven-army, and the note says there is no other mention
    of Kenverchyn or of how Owain obtained that army.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Breton tale of Peronnik the Fool is mentioned, and the syllable Per in
    forms of the hero’s name is said to mean a bowl or vessel.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A cited Grail tradition describes a nourishing stone called the Grail and
    glosses its name as a stone from heaven.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The true derivation of Grail is given as Low Latin cratella, meaning a small
    vessel or chalice.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'A selective action is ascribed to the Grail: it can be lifted only by a pure
    maiden, a heathen cannot see or benefit from it, and the impure and sinful cannot
    benefit from it.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Caer Vedwyd is glossed as the Castle of Revelry, and Hades is mentioned in
    the preceding note.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The objects at the Grail Castle are listed as a sword, a spear, and a vessel
    or stone, and are compared with the Danaan treasures of a sword, spear, cauldron,
    and stone.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Round Table is said to have no mention in Cymric legend earlier than the
    fifteenth century.
  category: other
  evidence_refs:
  - ev:14
- id: obs:15
  text: The notes state that a poem has an obvious connection with ideas of transmigration;
    Tuan mac Carell’s last stage is recalled as a fish, and Taliesin is said to have
    been taken in a salmon-weir.
  category: sequence
  evidence_refs:
  - ev:15
