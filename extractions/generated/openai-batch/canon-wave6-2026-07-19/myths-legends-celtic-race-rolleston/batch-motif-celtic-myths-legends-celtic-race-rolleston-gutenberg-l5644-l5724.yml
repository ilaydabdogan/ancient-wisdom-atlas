canonical_text:
  quote: ''
  summary: Maev tries to compel Ferdia, Cuchulain’s former friend and fellow pupil,
    to fight Cuchulain at the Ford. Ferdia refuses gifts of marriage but consents
    when threatened with public shame by poets and satirists. Over several days the
    two champions fight with escalating weapons, pause at night, at first exchange
    embraces and healing gifts, then grow grim and estranged. On the fourth day Ferdia
    arms himself heavily against the feared Gae Bolg while Cuchulain asks Laeg to
    spur his courage.
  language: English
  quote_policy: summarized
