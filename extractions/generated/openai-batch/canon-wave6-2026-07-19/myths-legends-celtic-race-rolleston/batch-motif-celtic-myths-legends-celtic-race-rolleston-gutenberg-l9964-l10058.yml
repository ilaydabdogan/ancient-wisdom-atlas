canonical_text:
  quote: ''
  summary: Matholwch, King of Ireland, seeks Branwen in marriage to ally Ireland and
    Britain. Bran agrees, but Evnissyen mutilates Matholwch's horses, forcing Bran
    to offer compensation, including a magic cauldron that restores slain men without
    speech. The cauldron's Irish origin is recounted through Llassar Llaesgyvnewid
    and Kymideu Kymeinvoll, whose armed offspring are destroyed in an iron house except
    for the parents, who later give the cauldron to Bran. Branwen goes to Ireland,
    bears Gwern, is later degraded and beaten, and sends a letter to Bran by a trained
    starling. Bran sails to Ireland; Irish messengers see his fleet and giant body
    as a moving wood and mountain, which Branwen interprets.
  language: English
  quote_policy: summarized
