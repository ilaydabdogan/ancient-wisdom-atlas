canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes from the tale of Dermot and Grania: their
    pursuit by the Fianna, eventual peace with Cormac and Finn, Grania''s feast for
    the former enemies, Dermot''s ominous awakening by a hound, his fatal encounter
    with the enchanted Boar of Ben Bulben, Finn''s delayed use of healing well-water,
    Dermot''s death, Grania''s grief, and Angus Ōg''s supernatural removal of Dermot''s
    body.'
  language: English
  quote_policy: summarized
