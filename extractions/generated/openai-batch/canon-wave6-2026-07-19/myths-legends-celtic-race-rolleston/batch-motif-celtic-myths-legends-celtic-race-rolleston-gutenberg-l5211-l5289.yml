canonical_text:
  quote: ''
  summary: Conor has the sons of Usna attacked, magically immobilized by Cathbad,
    captured, and beheaded by Owen. Conor then takes Deirdre by force; after further
    torment she kills herself. Yew-trees grow from Deirdre's and Naisi's graves and
    intertwine. Fergus returns, vows vengeance, and joins Ailell and Maev in Connacht.
    Maev, described as the true ruler despite Ailell's kingship, seeks the Brown Bull
    of Quelgny after rivalry over Finnbenach and agrees with Fergus and Ailell to
    raid Ulster.
  language: English
  quote_policy: summarized
