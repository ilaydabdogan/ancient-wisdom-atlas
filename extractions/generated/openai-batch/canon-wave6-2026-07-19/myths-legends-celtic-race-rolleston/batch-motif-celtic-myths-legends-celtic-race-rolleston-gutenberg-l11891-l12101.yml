canonical_text:
  quote: ''
  summary: Glossary and index entries from Boyne through Celtdom list Celtic figures,
    places, objects, and cross-references, including the Boyne River, Branwen, Bregon,
    Brenos/Brian, Bres, Bri Leith, Briccriu, Brigit, Brittany, Buddha, Caer, Caliburn,
    the Cauldron of Abundance, and Cathbad.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Boyne River entry associates the river with Angus Ōg’s palace, Angus and
    Caer, Milesian landing in the estuary, Ethné losing a veil of invisibility while
    bathing, and a church on its banks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Caer is identified as Ethal Anubal’s daughter; she is wooed by Angus Ōg, has
    a dual life, and accepts Angus Ōg’s love.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:3
  text: Branwen is listed as Bran’s sister, Matholwch’s wife, Gwern’s mother, degraded
    after Evnissyen’s outrage, brought to Britain, and buried after death on the banks
    of the Alaw.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bregon is identified as Miled’s son and Ith’s father; a tower of Bregon is
    perceived by Ith.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brenos, under the form Brian, is described as a god to whom the Celts attributed
    victories at the Allia and at Delphi.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Bres appears in multiple index senses: an ambassador slain in battle, a son
    of Eri chosen as king and later deposed for ill-government, and a son of Balor
    who learns that the sun’s appearance is the face of Lugh of the Long Arm.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bri Leith is described as the fairy palace of Midir the Proud in County Longford,
    and Etain is said to be carried there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Briccriu of the Poisoned Tongue is an Ulster lord who causes strife among
    Cuchulain and Red Branch heroes over the Championship of Ireland, summons the
    demon called The Terrible, and suggests how to carve Mac Datho’s boar.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Bridge of the Leaps entry places Cuchulain at the bridge and notes that
    he leaps there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Brigit is identified as an Irish goddess identical with Dana and Brigindo,
    daughter of the god Dagda, and grandmother of Ecne.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Brittany entry mentions a tumulus at Locmariaker whose markings are similar
    to those at New Grange in Ireland, and also mentions a symbol of the feet found
    in Brittany.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Buddha entry mentions a footprint of Buddha in India as a symbol and notes
    frequent cross-legged Buddha imagery in religious art of the East and Mexico.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: Caliburn is identified as the magic sword of King Arthur and is cross-referenced
    with Excalibur.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: Cathbad is identified as a Druid who performs divination, draws Deirdre’s
    horoscope, and casts evil spells over Naisi and Deirdre.
  category: action
  evidence_refs:
  - ev:15
- id: obs:15
  text: The Cauldron of Abundance entry equates it with the Stone of Abundance and
    refers also to the Grail.
  category: object
  evidence_refs:
  - ev:16
