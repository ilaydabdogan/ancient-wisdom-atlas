  summary: The passage argues that Egyptian religious symbolism may be related to
    prehistoric Western Europe and Celtic afterlife beliefs. It describes Egyptian
    future-life doctrine, contrasts Homeric Greek shades with Celtic immortality,
    notes reports of Celtic next-world repayment and transmigration, and summarizes
    an Irish legend in which Mongan is secretly identified as a reincarnation of Finn
    through the testimony of the revenant Keelta.
  language: English
  quote_policy: summarized
