canonical_text:
  quote: ''
  summary: Finn searches unsuccessfully for Saba, later finds a naked boy on Ben Bulban
    protected by Bran and Skolawn from the other hounds. The boy recounts being raised
    by a gentle hind in an inaccessible valley, losing her after a dark druid struck
    her with a hazel wand, and awakening on Ben Bulban. Finn names him Oisín. In a
    later episode, Niam of the Golden Hair, daughter of the King of the Land of Youth,
    arrives on a white steed, invites Oisín to the Land Oversea, describes its abundance
    and freedom from death and decay, and Oisín departs with her, never again seen
    on earth by the Fianna.
  language: English
  quote_policy: summarized
