canonical_text:
  quote: ''
  summary: Oisín travels with Niam on a white horse over the sea toward the Land of
    Youth, seeing strange apparitions in a haze. After a seemingly brief stay in the
    Land of Youth, he returns to Ireland on the fairy steed under a prohibition against
    dismounting or touching earthly soil. He finds the Hill of Allen ruined and the
    heroic company gone. While helping later Irish laborers move a boulder, he falls
    from the horse; the steed vanishes and he is transformed into an extremely aged
    man.
  language: English
  quote_policy: summarized
