canonical_text:
  quote: ''
  summary: Conary is drawn into repeated violations of his geise. Supernatural smoke
    and flames mislead his company; three red riders from the fairy mounds precede
    him to Da Derga’s red-named Hostel and announce signs of slaughter. Ingcel’s host
    prepares to attack, marks the coming fight with a stone cairn, and sees another
    broken geis in the fire kindled for the king’s feast. At the Hostel, the Morrigan
    appears as a solitary woman, foretells Conary’s destruction, and is admitted despite
    a further geis.
  language: English
  quote_policy: summarized
