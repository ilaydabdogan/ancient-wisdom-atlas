- id: motif:6
  label: Fall of a heroic warrior company in a final battle
  taxonomy_refs: []
  basis: The Battle of Gowra brings tremendous slaughter and the near extermination
    of the Fianna.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage presents the end of the Fianna as sober history rather than
