comparison_claims:
- id: claim:1
  claim: The passage compares the ending of Grania with the tale of Deirdre as endings
    that modern taste tends to sentimentalize, while the older Celtic storytelling
    is described as cruel or cynical rather than sentimental.
  claim_level: same_function
  target: The tale of Deirdre
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison concerns narrative ending and tone, not necessarily
    a shared plot motif.
- id: claim:2
  claim: The passage identifies two streams within Fian legend that treat Finn differently,
    one glorifying him and the other diminishing him in favor of rival heroes such
    as Goll mac Morna.
  claim_level: same_function
  target: Rival Fian legend streams associated with Clan Bascna and Clan Morna
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal literary-traditional comparison stated by the narrator;
    it should not be taken alone as evidence for historical clan authorship.
- id: claim:3
  claim: The passage says the Battle of Gowra and Oscar’s death circulate in multiple
    versions, including prose, poetry, Ossianic Society and Campbell versions, and
    a Scottish version with Finn’s lament.
  claim_level: same_motif
  target: Ossianic and Scottish versions of the Battle of Gowra and death of Oscar
  evidence_refs:
  - ev:10
  - ev:14
  - ev:16
  counter_evidence_refs: []
  confidence: high
