canonical_text:
  quote: ''
  summary: The passage recounts the end of Grania, in which she first plans vengeance
    against Finn through her sons but is later wooed by Finn, brought to the Hill
    of Allen as his wife, and reconciles Finn with her sons. It then comments on rival
    streams of Fian legend, one glorifying Finn and another belittling him. The passage
    next narrates the decline of the Fianna after Cairbry becomes High King, refuses
    a marriage tribute claimed by the Fianna, and gathers allies against them. At
    the Battle of Gowra, the opposing forces kiss the sacred soil of Erin before battle;
    Oscar distinguishes himself, the Fianna are nearly destroyed, Oscar and Cairbry
    kill each other in single combat, and Oisín and Finn lament Oscar’s death.
  language: English
  quote_policy: summarized
