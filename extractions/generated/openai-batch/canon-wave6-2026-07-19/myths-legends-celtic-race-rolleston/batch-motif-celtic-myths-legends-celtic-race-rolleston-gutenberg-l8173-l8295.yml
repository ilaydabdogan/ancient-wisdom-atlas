candidate_motifs:
- id: motif:1
  label: Vengeance forestalled by marriage and reconciliation
  taxonomy_refs: []
  basis: Grania prepares her sons to avenge her against Finn, but Finn woos her, takes
    her as bride, and she makes peace between Finn and her sons.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage presents the action cynically rather than as a romantic union;
    no sacred or supernatural marriage is stated.
- id: motif:2
  label: Rival heroic traditions recast the same leader
  taxonomy_refs: []
  basis: The passage explicitly describes two streams of Fian legend in which Finn
    is either glorified or belittled in favor of an opposing hero.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a literary-traditional pattern identified by the narrator, not
    an episode enacted by characters.
- id: motif:3
  label: Royal authority challenges an overmighty warrior band
  taxonomy_refs:
  - royal_legitimacy
  basis: Cairbry, as High King, refuses the Fianna’s tribute and gathers kings against
    them because they have become an oppressive power within the state.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage frames the event as quasi-historical; the royal-legitimacy
    taxonomy fit is interpretive and should be reviewed.
- id: motif:4
  label: Sacred homeland gesture before battle
  taxonomy_refs: []
  basis: The opposing forces kneel and kiss the sacred soil of Erin before charging
    at Gowra.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not explain the ritual meaning beyond calling the soil
    sacred.
- id: motif:5
  label: Mutual slaying in single combat
  taxonomy_refs: []
  basis: Oscar and Cairbry meet in single combat and each kills the other.
