canonical_text:
  quote: ''
  summary: 'The passage recounts stages in Maeldūn''s voyage among marvelous islands:
    an island encircled by rising water and fearful inhabitants; an island with a
    spouting stream full of salmon; a silver column rising from the sea with a net
    and an unknown voice; an inaccessible pedestal island; an island ruled by a queen
    and seventeen maidens who host, marry, and detain the travelers with a magical
    clew; an island of red intoxicating berries; and a wooded island with a church,
    fort, and ancient cleric.'
  language: English
  quote_policy: summarized
