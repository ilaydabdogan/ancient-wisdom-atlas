canonical_text:
  quote: ''
  summary: Glossary and index entries from DAN´AAN-S through DIUR´AN THE RHYMER. The
    entries summarize references to the Danaans, otherworld and death concepts, curses,
    transformations, divine parentage, tragic love narratives, imprisoned Kronos,
    Dermot and Grania traditions, water settings, and Maeldūn’s voyage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Danaans are indexed as refusing tribute to Balor, encountering the Fomorians,
    exercising power through a spell of music, being displaced in Ireland by the Milesians,
    and dwelling in spiritual Ireland.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dara is identified as the owner of the Brown Bull of Quelgny, and Maev requests
    the loan of that bull.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Dark Druid changes Saba into a fawn and is associated with further ill-treatment
    of her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Land of the Dead is identified with the Irish Fairyland and is also given
    the equivalent term “Spain.”
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The debility of the Ultonians is attributed to Macha’s curse and is manifested
    during Maev’s cattle-raid of Quelgny.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dectera is described as Cuchulain’s mother by Lugh, as a daughter of the Druid
    Cathbad, and as giving a son, Cuchulain, to Ulster.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Deirdre is described as Felim’s daughter; Cathbad draws her horoscope; Conor
    decides to wed her; she loves Naisi, is carried off by Naisi, returns with him
    to Ireland, is forced to wed Conor, and dies by dashing herself against a rock.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Demetrius is said to mention an island where “Kronos” was imprisoned in sleep
    while Briareus kept watch over him.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Dermot of the Love Spot is identified as a follower and friend of Finn mac
    Cumhal, lover of Grania, bred up with Angus, a typical lover of Irish legend,
    a Gaelic Adonis, and slain by the wild Boar of Ben Bulben.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Dermot entry also indexes how Dermot got the Love Spot, his adventure
    with Gilla Dacar’s steed, a fight with the Knight of the Well, and the love-story
    of Grania and Dermot.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Aoife’s cruelty to her step-children is located at Derryvaragh Lake.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Diuran the Rhymer and German are companions of Maeldūn on a wonderful voyage,
    and Diuran returns with a piece of silver net.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Dis is indexed as equivalent to Pluto.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Dithorba is described as slain by Macha, and five sons of Dithorba are described
    as taken captive by Macha.
  category: action
  evidence_refs:
  - ev:13
