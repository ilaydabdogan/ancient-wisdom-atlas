canonical_text:
  quote: ''
  summary: The passage surveys Arthurian material from the familiar later saga, Nennius,
    and Geoffrey of Monmouth. It contrasts later motifs such as the Round Table, Grail,
    Lancelot, and Avalon with their absence from early native Welsh literature, presents
    Nennius' Arthur as a sixth-century military leader against the Saxons, and presents
    Geoffrey's Arthur as a king whose story includes magical conception, wide conquests,
    Modred's usurpation, final wounding, succession to Constantine, and mysterious
    removal to Avalon.
  language: English
  quote_policy: summarized
