canonical_text:
  quote: Stones, rivers, wells, trees, and other natural objects were to them the
    adequate symbols...
  summary: The passage contrasts Egyptian evidence about human sacrifice with a discussion
    of Celtic deities. It describes natural objects as divine symbols or embodiments
    for the Megalithic People, reports Caesar's and Lucan's accounts of named Gallic
    gods, notes Roman influence and unusual divine iconography in Gaul, presents Caesar's
    Roman classifications of Gallic deities, describes an unnamed Underworld god as
    ancestor of the Gauls, and identifies Lugh/Lugus as a light-associated figure
    also linked to Underworld and dark powers through his maternal lineage.
  language: English
  quote_policy: quoted
