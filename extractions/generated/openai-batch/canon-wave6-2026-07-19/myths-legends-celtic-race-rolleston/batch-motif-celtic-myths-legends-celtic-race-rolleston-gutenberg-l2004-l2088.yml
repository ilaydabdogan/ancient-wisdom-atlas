candidate_motifs:
- id: motif:1
  label: Natural objects as divine symbols or embodiments
  taxonomy_refs: []
  basis: The passage explicitly describes stones, rivers, wells, trees, and other
    natural objects as symbols or partial embodiments of venerated supernatural forces.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage frames this as a religious conception rather than as a narrative
    episode.
- id: motif:2
  label: Divine triad
  taxonomy_refs: []
  basis: Lucan is reported as naming the triad Æsus, Teutates, and Taranus, and the
    passage also notes a broader tendency to group gods in triads.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No specific triad taxonomy reference is available in the supplied motif-family
    list.
- id: motif:3
  label: Serpentine and hybrid divine iconography
  taxonomy_refs:
  - serpent
  basis: The passage reports ram-headed serpents among older or unintelligible symbols
    in Gaulish religious sculpture.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives iconographic forms but does not explain their mythic
    function.
- id: motif:4
  label: Underworld deity as ancestor of a people
  taxonomy_refs:
  - divine_parent_child
  basis: Caesar is reported as saying all Gauls claimed descent from the Underworld
    god Dis or Pluto.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The deity's Celtic name is not given, and the relationship is reported
    through Caesar's Roman nomenclature.
- id: motif:5
  label: Night-first time reckoning from Underworld ancestry
  taxonomy_refs:
  - duality
  basis: The Gauls' claimed descent from the Underworld god is linked to beginning
    the day with the oncoming of night.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The connection is reported by Caesar; the passage does not give an indigenous
    explanation in Celtic terms.
- id: motif:6
  label: Guide of the dead to the Other-world
  taxonomy_refs:
  - afterlife_journey_map
  basis: The author conjectures that the Gallic Mercury may have been the guide of
    the dead and of travellers to the Other-world.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: This is explicitly presented as conjecture, not as a direct ancient statement.
- id: motif:7
  label: Conflict of light and darkness
  taxonomy_refs:
  - duality
  basis: D’Arbois de Jubainville is reported as interpreting Celtic mythology as a
    solar myth involving eternal conflict between Day and Night, and Lugh's light
    is set against Fomorian and Balor-linked darkness.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The solar-myth interpretation is attributed to a modern scholar and should
    not be treated as a settled indigenous meaning.
- id: motif:8
  label: Ambivalent light and Underworld deity
  taxonomy_refs:
  - duality
  basis: Lugh is described both as God of Light with solar attributes and as a god
    of the Underworld through his mother Ethlinn, daughter of Balor.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage says further details will be discussed later; only the stated
    dual affiliation is available here.
- id: motif:9
  label: Abolition or rejection of human sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The passage says Egyptian records are silent about such cruel rites and reports
    Manetho's claim that human sacrifices were abolished by Amasis I.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: This observation concerns Egypt in a comparative aside and mainly reports
    absence, rarity, or abolition rather than a Celtic mythic episode.
comparison_claims:
- id: claim:1
  claim: The passage presents Caesar's Roman names for Gallic deities as functional
    classifications rather than necessarily native divine names.
  claim_level: same_function
  target: Roman Mercury, Apollo, Minerva, Jupiter, Mars, and Dis/Pluto as equivalents
    for Gallic deities
  evidence_refs:
  - ev:6
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage itself warns that Caesar is classifying Gallic divinities
    under Roman names; native names are often not given.
- id: claim:2
  claim: The passage reports a linguistic and comparative association between Æsus
    and names or roots in Persian, Umbrian, and Scandinavian traditions.
  claim_level: linguistic_similarity
  target: Asura-masda, Umbrian Æsun, and Scandinavian Asa
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The derivation is attributed to Belloguet and is not independently
    demonstrated within the passage.
- id: claim:3
  claim: Teutates is compared functionally to Mars as a warlike deity, while Taranus
    is tentatively compared with Thor through a thunderbolt association.
  claim_level: same_function
  target: Roman Mars and possibly Thor
  evidence_refs:
  - ev:4
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Taranus-Thor comparison is explicitly tentative in the passage,
    and Teutates is presented through etymology and Roman equivalence.
- id: claim:4
  claim: Gaulish religious sculpture is described as showing Roman artistic influence
    while preserving stranger forms such as triple faces, antlers, and ram-headed
    serpents.
  claim_level: historical_contact
  target: Roman religious art and Gaulish religious sculpture
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports Roman influence in form but does not explain the
    older symbols' meanings.
- id: claim:5
  claim: The cross-legged 'Buddha' attitude in Gaulish religious art is compared visually
    with religious art of the East and Mexico, and triadic divine grouping is compared
    with Egypt.
  claim_level: visual_similarity
  target: Eastern, Mexican, and Egyptian religious art patterns
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states resemblance or recurrence only; it does not claim
    historical contact or shared origin.
- id: claim:6
  claim: D’Arbois de Jubainville's interpretation treats Celtic mythology as a variant
    of a universal solar myth involving Day and Night conflict.
  claim_level: archetypal_reading
  target: Universal solar myth of conflict between Day and Night
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an attributed scholarly interpretation, not a direct statement
    from the Celtic myths themselves in this passage.
