canonical_text:
  quote: ''
  summary: Finn, Keelta, and other Fianna pursue a beautiful fawn to Slievenamon,
    where it vanishes underground. In storm and snow they find an illuminated fairy
    mansion, are entertained, and learn that the fawn was a maiden sent by Donn son
    of Midir and his allies to draw the Fianna into Fairyland for help in battle.
    The Fianna fight for their hosts, heal wounded companions with magical herbs,
    enforce peace after a year, and return to earth. Keelta later meets Donn mac Midir,
    who honors St. Patrick. A second incident describes three mysterious young warriors
    and a gigantic hound who join Finn on condition that no one approach them at night,
    because one of them must die each night while the others watch.
  language: English
  quote_policy: summarized
