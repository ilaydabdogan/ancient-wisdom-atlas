canonical_text:
  quote: "“a peal of thunder was heard and a thick mist fell”"
  summary: Pryderi, Manawyddan, Rhiannon, and Kicva remain in an emptied Dyfed after
    thunder and mist. They try to live by crafts and hunting. A white boar leads them
    to a newly appeared castle where Pryderi and then Rhiannon are trapped by touching
    a golden bowl beside a fountain; the castle vanishes with them. Manawyddan and
    Kicva remain, attempt agriculture, and Manawyddan catches a slow mouse from a
    host that has been stripping his wheat. He prepares to hang the mouse, while a
    scholar and a priest separately plead and offer money for its release.
  language: English
  quote_policy: quoted
