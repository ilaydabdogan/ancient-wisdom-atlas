canonical_text:
  quote: The Other-world was not a place of gloom and suffering, but of light and
    liberation.
  summary: 'The passage argues that the Celtic realm of death was conceived as a luminous
    and liberating Other-world linked with the Sun, not as a place of gloom. It then
    summarizes five factors in ancient Celtic religious culture: popular magical observances
    including human sacrifice, a philosophical solar creed with the immortality of
    the soul, worship of personified deities, Druidic teaching about nature and the
    universe, and a sacerdotal organization controlling learning. It closes with reflections
    on mixed Celtic populations and race-character as mutable rather than fixed.'
  language: English
  quote_policy: quoted
