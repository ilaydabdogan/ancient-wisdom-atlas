  quote: ''
  summary: The passage describes carved stones at New Grange, including spirals, lozenges,
    zigzags, a palm- or fern-like design, and an unusual west-recess figure interpreted
    as a ship with men, an uplifted sail, and a nearby circle. It notes similar ship-and-circle
    carvings at Dowth, Locmariaker in Brittany, and Swedish rock-sculptures, then
    compares these with the Egyptian Boat of the Sun, the vessel of Rā's journeys
    to the Other-world carrying beatified dead souls.
