canonical_text:
  quote: ''
  summary: The passage concludes a penance in which Gwydion and Gilvaethwy are transformed
    into animals and restored. It then recounts Arianrod's magical test, the births
    of Dylan and Llew, Dylan's sea associations, Arianrod's restrictions on Llew,
    Gwydion's tricks by which Llew gains name and arms, and the making of Blodeuwedd
    from flowers as Llew's wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the appointed time, Gwydion and Gilvaethwy return with a young fawn; the
    fawn is brought into human shape and baptized, and the two brothers are changed
    into wild swine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After another year they return with a young one treated like the fawn, and
    the brothers are made into wolves; after a further year they return with a young
    wolf, their penance is judged complete, and their human nature is restored.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Māth orders the restored brothers to be washed, anointed, and nobly clothed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Māth asks Arianrod whether she is a virgin; after she answers uncertainly,
    she fails a magical test and gives birth to two sons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One son is named Dylan, “Son of the Wave”; after baptism he enters the sea,
    swims like the fish there, and no wave breaks beneath him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says Dylan's death occurs at the hand of his uncle Govannon, that
    the waves of Britain and Ireland wept for him, and that the incoming tide at the
    River Conway is called Dylan's death-groan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The other infant is seized by Gwydion, raised under his protection, and grows
    rapidly, being as large at four as if he were eight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Arianrod hates the children who exposed her false pretensions and declares
    that the boy shall not have a name until she gives him one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Gwydion goes to the strand below Caer Arianrod with the boy, magically makes
    himself look like a shoemaker and the boy like an apprentice, and makes shoes
    from sedges and seaweed that appear to be Cordovan leather.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After Arianrod is drawn to the shoemaker by ill-fitting shoes, a wren lands
    on a boat mast and the boy shoots it in the leg with an arrow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Arianrod praises the shot with words containing “llaw gyffes” and “llew,”
    and Gwydion declares that the boy has received the name Llew Llaw Gyffes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The narrator states that Llew Llaw Gyffes has the same meaning as Gaelic Lugh
    Lamfada, “Lugh of the Long Arm,” and describes the episode as a legend grown around
    a misunderstood inherited name.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: Arianrod next declares that the boy shall not bear arms until she invests
    him; Gwydion uses bardic disguise and a magical illusion of an armed foray around
    the castle, causing Arianrod to give them weapons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Arianrod then declares that the boy shall have no wife from the race inhabiting
    the earth; Māth and Gwydion make a wife for him from blossoms of oak, broom, and
    meadow-sweet, name her Blodeuwedd or Flower-face, wed her to Llew, and give the
    couple Dinodig to rule.
  category: sequence
  evidence_refs:
  - ev:7
