canonical_text:
  quote: ''
  summary: Peredur comes to Arthur's court as a rustic youth, is insulted by Kai,
    is praised by silent dwarfs, kills a challenging knight, and takes his armor with
    Owain's help. He then undertakes adventures for Arthur's honor and seeks redress
    against Kai. In a Grail-like sequence, he visits a lame fisher-lord who identifies
    himself as his uncle and instructs him not to ask about wonders. At the Castle
    of Wonders another uncle tests him with a sword and staple, then a bleeding spear
    and a bloodied salver bearing a man's head are carried into the hall amid lamentation.
    Peredur remains silent. Later the objects are explained as signs of injuries done
    to Peredur's kin by the nine sorceresses of Gloucester, whom Peredur and Arthur
    defeat.
  language: English
  quote_policy: summarized
