candidate_motifs:
- id: motif:1
  label: rustic hero proves himself at court
  taxonomy_refs: []
  basis: Peredur arrives in rustic fashion, is mocked, is unexpectedly praised, and
    immediately proves himself by killing a court challenger.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The label is descriptive; no supplied taxonomy reference directly names
    this pattern.
- id: motif:2
  label: heroic departure into serial adventures
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: After taking the knight's equipment, Peredur leaves court seeking further
    adventures and later enters a Grail-like sequence of castles and tests.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage summarizes many adventures without details, so the motif is
    broad.
- id: motif:3
  label: obedience test through silence before wonders
  taxonomy_refs:
  - initiation
  basis: The fisher-lord commands Peredur not to ask about unexplained wonders, and
    the narrator identifies this as a test of obedience and self-restraint.
  evidence_refs:
  - ev:8
  - ev:14
  confidence: high
  cautions: The passage itself calls it a test; the taxonomy mapping to initiation
    is interpretive but directly supported by the trial structure.
- id: motif:4
  label: strength test with broken and restored weapon
  taxonomy_refs:
  - initiation
  basis: Peredur is tested by striking an iron staple with a sword; the sword and
    staple reunite twice but not the third time, and the lord interprets this as indicating
    two-thirds of Peredur's strength.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage gives the action and interpretation, but does not explicitly
    call this an initiation.
- id: motif:5
  label: wounded kinsman and displayed relics incite vengeance
  taxonomy_refs: []
  basis: The bleeding lance and severed head are later explained as the weapon and
