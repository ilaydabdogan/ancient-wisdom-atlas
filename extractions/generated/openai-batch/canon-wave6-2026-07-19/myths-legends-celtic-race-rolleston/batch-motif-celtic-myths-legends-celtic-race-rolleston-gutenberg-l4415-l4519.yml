canonical_text:
  quote: ''
  summary: The passage recounts Ingcel's reconnaissance of Da Derga's Hostel, identifying
    Conary and his retinue, ominous figures linked with the Morrigan, and notable
    champions and objects. Ingcel and the sons of Desa attack the Hostel. The defenders
    fight back, but Conary becomes helpless from thirst after the river is cut off
    and all liquids are spent on quenching fire. Mac Cecht searches Ireland for water
    against supernatural obstruction, returns too late, kills reavers near Conary's
    severed head, pours water into the head's mouth, and the head speaks thanks. A
    woman then sees the exhausted, wounded mac Cecht and refuses to approach from
    fear.
  language: English
  quote_policy: summarized
