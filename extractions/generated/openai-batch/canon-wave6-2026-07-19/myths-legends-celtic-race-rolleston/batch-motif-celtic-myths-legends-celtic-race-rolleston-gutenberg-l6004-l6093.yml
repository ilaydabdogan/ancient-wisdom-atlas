candidate_motifs:
- id: motif:1
  label: Phantom war visions used to weaken a hero
  taxonomy_refs: []
  basis: Cuchulain is made to see armed battalions, burning dwellings, smoke, flames,
    and war sounds, and he fights these phantoms until exhausted.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage presents the apparitions literally as hostile supernatural
    workings, but no broader taxonomy label is explicit.
- id: motif:2
  label: Shape-shifting impersonation breaks a protective restraint
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Bave assumes the form of Niam’s handmaid to remove Niam, then assumes Niam’s
    form to instruct Cuchulain to leave despite his vow.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The trickster-boundary taxonomy is applied cautiously because the passage
    shows deception across an imposed vow boundary, not a named trickster.
- id: motif:3
  label: Accumulating omens before a hero’s final battle
  taxonomy_refs: []
  basis: The horse sheds blood tears, wine turns to blood, Cuchulain sees phantom
    death and fire, and he encounters the washer with his bloody gear before the final
    combat.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage gives several omens directly, but does not state a formal
    omen category.
- id: motif:4
  label: Washer at the ford washing the hero’s bloody gear
  taxonomy_refs:
  - water
  basis: At a ford, a weeping maiden washes bloody garments and arms that Cuchulain
    recognizes as his own, then vanishes.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The water taxonomy is attached to the ford and stream setting; no named
    motif taxonomy for the washer is provided.
- id: motif:5
  label: Geis violation through compelled hospitality and taboo food
  taxonomy_refs:
  - sacred_exchange
  basis: Cuchulain accepts food from the crones to avoid discourtesy, but the food
    and hearth violate his geasa, causing loss of strength in his hand and arm.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The sacred-exchange taxonomy is approximate; the passage frames the act
    as hospitality, courtesy, and geis violation rather than an explicit sacred bargain.
- id: motif:6
  label: Fatal weapon given under social coercion and returned against the giver
  taxonomy_refs:
  - sacred_exchange
  basis: Satirists repeatedly demand Cuchulain’s spear, including by threat of reviling
    Ulster; enemies then throw the spear back, killing Laeg, wounding the Grey of
    Macha, and finally striking Cuchulain.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The exchange element is based on demanded giving and social pressure;
    the passage does not call it a sacred exchange.
- id: motif:7
  label: Final departure despite warnings
  taxonomy_refs:
  - departure
  basis: Cuchulain is urged by Emer, Dectera, and Cathbad to refrain or wait, but
    he refuses, says he will not return alive, and proceeds toward battle.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The departure taxonomy is broad; the passage concerns a final martial
    departure rather than a full quest structure.
