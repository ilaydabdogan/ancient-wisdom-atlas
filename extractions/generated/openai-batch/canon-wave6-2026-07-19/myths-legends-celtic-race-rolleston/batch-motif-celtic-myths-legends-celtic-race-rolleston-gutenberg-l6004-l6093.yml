canonical_text:
  quote: "“My life’s end is near; this time I shall not return alive from the battle.”"
  summary: 'Cuchulain is weakened by phantom war visions, deceived into leaving protective
    care, and confronted by successive omens: a blood-weeping horse, blood-transformed
    wine, a washer at a ford washing his bloody gear, and a taboo meal of dog flesh.
    In the final battle, satirists demand his spear three times; when enemies throw
    it back, it kills Laeg, mortally wounds the Grey of Macha, and finally strikes
    Cuchulain.'
  language: English
  quote_policy: quoted
