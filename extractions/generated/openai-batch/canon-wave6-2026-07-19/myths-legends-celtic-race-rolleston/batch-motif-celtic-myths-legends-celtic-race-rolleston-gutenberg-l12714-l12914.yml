literal_observations:
- id: obs:1
  text: Etain is listed as Midir the Proud's second bride, transformed into a butterfly
    by Fuamnach, driven by magic tempests, brought into Angus's fairy palace, swallowed
    by Etar, and reappearing as a mortal child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eochy is listed as High King of Ireland, as Etain's wooer and husband, as
    challenged by Midir to play chess, and as recovering Etain.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Fairy Folk are equated with the Sidhe and connected with New Grange, luring
    Conary Mor into breaking a geis, sealing sources of water, and several named narrative
    episodes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fairyland is described as the Land of the Dead and is linked with visits,
    journeys, war, and rescues involving Eochy, Cuchulain, Laeg, Oisin, Finn, the
    Fianna, and Pwyll.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fand is described as the Pearl of Beauty and wife of Mananan; she sets her
    love on Cuchulain and returns home with Mananan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Evnissyen is listed as mutilating Matholwch's horses, killing warriors hidden
    in meal-bags, and dying in a magic cauldron.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ethlinn or Ethnea is listed as Balor's daughter, as giving her love to Kian,
    as giving birth to three sons, and as mother of Lugh.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Fedelma is described as a prophetess from the Fairy Mound of Croghan who is
    questioned by Maev and has a vision of Cuchulain.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Egyptian entry notes a ship symbol in sepulchral art, the Feet of Osiris
