  text: After the curse departs, the men of Ulster assemble, arm themselves, and harness
    war-chariots for the rising-out of the province.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conor’s host attacks eight score men of Erin in Meath who are carrying away
