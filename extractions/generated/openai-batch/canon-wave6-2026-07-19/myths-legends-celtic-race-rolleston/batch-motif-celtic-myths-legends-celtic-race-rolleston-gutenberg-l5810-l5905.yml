canonical_text:
  quote: ''
  summary: The passage narrates the Ulster host mustering after the curse has lifted,
    reconnaissance of their terrifying advance, the Battle of Garach, Cuchulain’s
    recovery and routing of Maev’s forces, the fatal fight of the Brown Bull of Quelgny
    and the white-horned Bull of Ailell, the close of the Tain, and the beginning
    of a tale in which Danaan women assault Cuchulain in a vision and leave him sick
    for a year.
  language: English
  quote_policy: summarized
