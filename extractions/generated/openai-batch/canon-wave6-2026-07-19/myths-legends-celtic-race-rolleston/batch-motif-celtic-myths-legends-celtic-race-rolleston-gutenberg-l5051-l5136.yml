canonical_text:
  quote: ''
  summary: 'The passage recounts several Ulster-cycle episodes: Cuchulain returns
    to Emain Macha in battle-fury and is pacified by naked women and cold-water vats;
    he wins Emer by leaping Forgall''s ramparts, fighting opponents, carrying her
    off, and marrying her; Briccriu provokes a championship contest in which Cuchulain
    passes a demon''s reciprocal beheading test; and Deirdre is born, receives a prophecy
    of beauty and ruin, is spared by Conor, and is secluded for his future marriage.'
  language: English
  quote_policy: summarized
