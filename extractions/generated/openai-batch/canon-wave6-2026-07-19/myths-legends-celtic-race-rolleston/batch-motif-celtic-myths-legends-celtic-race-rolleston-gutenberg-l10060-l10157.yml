canonical_text:
  quote: ''
  summary: The Irish plan a feast and concealed ambush for Bran, but Evnissyen discovers
    and kills the hidden warriors. At the feast Gwern receives the sovereignty of
    Ireland and is then thrown into the hearth fire by Evnissyen, causing battle.
    The Irish revive their dead in a magic cauldron until Evnissyen sacrifices himself
    to destroy it. Bran, mortally wounded, commands the seven survivors to cut off
    his head, carry it through prolonged feasting at Harlech and Gwales, and bury
    it in the White Mount as a protection for the land. Branwen dies lamenting the
    destruction of two islands. A later episode recounts Caswallan’s Veil of Illusion,
    the enchanted feasting with the speaking Head, the opening of the closed door
    that restores sorrow, burial of the Head, and Arthur’s later removal of it. The
    narrator comments on possible Norse or Icelandic influence and compares Evnissyen
    with mischief-maker figures in Celtic saga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King of Ireland and his lords plan to build a hall large enough for Bran,
    hold a feast, and have Matholwch give Bran the kingdom and homage; the Irish also
    place armed warriors in leather bags hanging from the hall pillars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Evnissyen enters the hall before the rest of the host, finds the bags, questions
    an Irishman about them, and crushes the heads of the warriors hidden inside all
    two hundred bags.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the feast Matholwch lays down the sovereignty of Ireland, and it is
    conferred on the boy Gwern.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Evnissyen suddenly seizes Gwern and throws him into the blazing hearth fire;
    Bran prevents Branwen from leaping after him, and the Irish and British hosts
    fight until nightfall.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At night the Irish heat a magic cauldron and put their dead into it; the dead
    emerge the next day restored but dumb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Evnissyen, remorseful, hides among the Irish dead, is placed in the cauldron,
    stretches himself so that the cauldron breaks into four pieces, and dies when
    his heart bursts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: All the Irish are slain, and only seven of the British survive besides Bran,
    who is wounded in the foot by a poisoned arrow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bran commands the survivors to cut off his head, take it to London, and bury
    it in the White Mount facing France; he says the Head will talk on the way, remain
    uncorrupted for a time, and protect the land from foreign invasion while buried
    there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Branwen accompanies the seven, laments at Aber Alaw that two islands have
    been destroyed because of her, dies when her heart breaks, and is buried in a
    four-sided grave on the banks of the Alaw.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Caswallan son of Beli has conquered Britain and slain the six captains of
    Caradawc; by magic art he places the Veil of Illusion on Caradawc, who sees only
    the sword that kills and not the wielder, and Caradawc’s heart breaks from grief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The seven remain seven years at Harlech listening to the birds of Rhiannon,
    then spend fourscore years at Gwales in joy and mirth while the wondrous Head
    speaks as if alive.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the hall at Gwales, one door looking toward Cornwall and Aber Henvelyn
    is closed while two are open; Heilyn opens the closed door, remembrance and sorrow
    return, and the group leaves to bury the Head in the White Mount.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Head remains in the White Mount until Arthur digs it up, because he does
    not want the land defended except by strong arms.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The narrator states that the tale is full of mythological elements, says some
