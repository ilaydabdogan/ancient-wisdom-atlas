candidate_motifs:
- id: motif:1
  label: deceptive hospitality with concealed ambush
  taxonomy_refs: []
  basis: A feast and homage are arranged to placate Bran, but armed warriors are hidden
    in leather bags in the hall to attack the guests.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents a tactical ambush rather than an explicitly ritualized
    betrayal.
- id: motif:2
  label: hidden enemies detected and destroyed before the attack
  taxonomy_refs: []
  basis: Evnissyen discovers the warriors hidden in the bags and kills all two hundred
    before the feast proceeds.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The action is literal and violent; no broader taxonomy reference is assigned
    from the available list.
- id: motif:3
  label: child sovereign cast into hearth fire
  taxonomy_refs:
  - sacrifice
  basis: Gwern receives the sovereignty of Ireland and is then seized by Evnissyen
    and thrown into the blazing hearth fire, precipitating battle.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy link to sacrifice is approximate, because the text describes
    a killing in fire but does not state a formal sacrificial rite.
- id: motif:4
  label: reviving cauldron restores slain warriors with alteration
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The Irish place their dead in a magic cauldron; they emerge restored the
    next day but dumb.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The restoration is incomplete or altered because the revived dead are
    dumb.
- id: motif:5
  label: self-sacrifice destroys the enemy’s source of renewal
  taxonomy_refs:
  - sacrifice
  basis: Evnissyen deliberately enters the cauldron among the dead, breaks it apart
    from within, and dies, after resolving to find deliverance for the men of Britain.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the act as remorseful deliverance; it does not use
    the word sacrifice.
- id: motif:6
  label: speaking severed head as companion and land-protector
  taxonomy_refs: []
  basis: Bran’s severed Head speaks on the journey, remains pleasant company, stays
    uncorrupted for a time, and protects the land from foreign invasion when buried
    in the White Mount.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: No available taxonomy family precisely matches the talking protective
    head.
- id: motif:7
  label: enchanted long feast with suspended sorrow
  taxonomy_refs: []
  basis: The seven spend seven years at Harlech with the birds of Rhiannon and eighty
    years at Gwales in joy, forgetting all past sorrow while the Head speaks.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explicitly identify the Gwales hall as an afterlife
    or otherworld, so no afterlife taxonomy is assigned.
- id: motif:8
  label: closed door opened and sorrow returns
  taxonomy_refs:
  - forbidden_knowledge
  - return
  basis: One door is closed; when Heilyn opens it to test what was said, remembrance
    and sorrow immediately return and the company must depart to bury the Head.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The text frames the act as the Third Fatal Disclosure; the link to forbidden
    knowledge is cautious because the prohibition is implicit in Bran’s condition
    and the closed door.
- id: motif:9
  label: magic illusion hides the killer and reveals only the weapon
  taxonomy_refs: []
  basis: Caswallan’s Veil of Illusion causes Caradawc to see only the sword that kills,
    not the person wielding it.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No available taxonomy reference clearly covers this illusion motif.
- id: motif:10
  label: protective buried talisman removed by a later heroic ruler
  taxonomy_refs:
  - royal_legitimacy
  basis: The buried Head protects the land from invasion until Arthur digs it up because
    he wants the land defended only by strong arms.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The royal-legitimacy taxonomy link is approximate; the passage emphasizes
