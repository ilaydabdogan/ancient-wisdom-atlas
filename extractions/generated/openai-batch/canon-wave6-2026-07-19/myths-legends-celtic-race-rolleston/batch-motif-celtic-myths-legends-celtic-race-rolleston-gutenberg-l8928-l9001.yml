canonical_text:
  quote: ''
  summary: A monk cast adrift without oars or rudder comes to a rock where he is miraculously
    sustained for seven years. He feeds Maeldūn's crew, foretells their return, and
    counsels forgiveness of the man who killed Maeldūn's father. The voyagers follow
    a falcon toward a land like Ireland, land at the island of the killer, are peacefully
    welcomed, recount their sea-marvels, and return home. Diuran places a silver piece
    from a previous marvel on the high altar of Armagh, and the story is attributed
    to Aed the Fair.
  language: English
  quote_policy: summarized
