canonical_text:
  quote: ''
  summary: 'The passage summarizes the tale of Lludd and Llevelys, in which two royal
    brothers identify and remove three plagues from Britain. It then introduces Arthurian
    tales, especially Kilhwch and Olwen: Kilhwch is placed under a destiny-like bride
    quest by his stepmother, travels to Arthur’s court to request aid, and a group
    of Arthur’s servitors with exceptional abilities is sent out on the quest.'
  language: English
  quote_policy: summarized
