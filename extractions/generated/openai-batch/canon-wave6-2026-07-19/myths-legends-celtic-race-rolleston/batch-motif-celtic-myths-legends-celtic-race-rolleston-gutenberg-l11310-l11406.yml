  summary: Elphin finds an infant in a leathern bag at Gwyddno’s salmon weir, names
    and raises him as Taliesin. Later, after Elphin is imprisoned for boasting about
    his wife and his bard, Taliesin protects the wife, defeats false evidence, silences
    Arthur’s bards, sings an allusive self-revelation, raises a storm, frees Elphin’s
    chains by music, and prophesies future events.
  language: English
  quote_policy: summarized
