- id: motif:2
  label: Impossible or exceptional feat as passage condition
  taxonomy_refs: []
  basis: The host may not pass until someone makes a withe under Cuchulain's unusual
    one-legged, one-handed, one-eyed conditions, and later until someone removes a
    deeply driven pole with the fingertips of one hand.
  evidence_refs:
  - ev:3
