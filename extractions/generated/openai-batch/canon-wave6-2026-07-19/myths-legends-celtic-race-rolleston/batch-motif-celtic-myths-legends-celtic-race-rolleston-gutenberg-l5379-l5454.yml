canonical_text:
  quote: ''
  summary: 'Cuchulain delays Maev''s invading host at Ulster by setting geis-bound
    obstacles: first an Ogham-inscribed circular withe on a pillar-stone, then a forked
    pole in a ford bearing severed heads. Fergus interprets and overcomes the obstacles.
    A later encounter shows Cuchulain sparing an unarmed charioteer but beheading
    Orlam and revealing himself to Maev''s host. The passage also notes his battle
    distortion and refers to Book of Leinster versions recounting his boyhood deeds.'
  language: English
  quote_policy: summarized
