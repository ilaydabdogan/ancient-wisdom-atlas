canonical_text:
  quote: ''
  summary: The passage recounts the tale of Vivionn, a giant maiden from the Land
    of Maidens who seeks Finn’s protection from an unwanted betrothal, is killed by
    a pursuing giant suitor, and is buried by the Fianna with a mound and Ogham-marked
    pillar stone. The passage then comments on recurring mystery and beauty in Celtic
    literature and discusses Ossianic dialogues that contrast pagan and Christian
    ideals, comparing Oisīn-and-Patrick dialogues with Keelta-and-Patrick dialogues
    in the Colloquy.
  language: English
  quote_policy: summarized
