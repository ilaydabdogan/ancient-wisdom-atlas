canonical_text:
  quote: ''
  summary: 'The passage surveys several Irish and Celtic divine figures: Angus Ōg
    as god of love, his dream-love for Caer and their swan transformation, Dermot''s
    revival by Angus, Len''s lakeside goldsmithing, Lugh''s solar radiance and paternity
    of Cuchulain, Midir''s splendid appearance at Tara, and Lir and Mananan in relation
    to the sea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Angus Ōg is described as son of the Dagda by Boanna and as the Irish god of
    love, with a palace at New Grange on the Boyne.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four bright birds hover about Angus's head and are said to be his kisses in
    bird form; their singing causes love to arise in youths and maidens.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Angus becomes sick with love for a maiden seen in a dream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Boanna searches Ireland for the dream-maiden without finding her; the Dagda
    is also unable to find her until he calls on Bōv the Red.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bōv the Red, described as skilled in mysteries and enchantments, finds the
    maiden after a year at the Lake of the Dragon's Mouth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the lake, Angus sees thrice fifty maidens walking in couples, each couple
    linked by a gold chain, and one maiden taller than the rest.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bōv identifies the taller maiden as Caer, daughter of Ethal Anubal, a Danaan
    prince of Connacht.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Angus seeks help from Ailell and Maev of Connacht; Ethal refuses to give Caer
    to Angus.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: Ethal is besieged and taken prisoner by the combined forces of Ailell and
    the Dagda.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ethal says he cannot give up Caer because she is more powerful than he is.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Caer lives alternately as a maiden and as a swan, year by year, and is expected
    on the first of November with one hundred and fifty other swans at the Lake of
    the Dragon's Mouth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: At the appointed time Angus calls to Caer; after she asks who calls, Angus
    identifies himself and is transformed into a swan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Angus's transformation is described as an indication of consent, and he joins
    Caer in the lake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Angus and Caer fly together to the palace on the Boyne, making music that
    lulls hearers to sleep for three days and nights.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Dermot of the Love-spot is said to have been bred up with Angus in the palace
    on the Boyne; after Dermot is slain by the wild boar of Ben Bulben, Angus revives
    him and carries him to share immortality in his fairy palace.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Len, a goldsmith of Bōv the Red, is connected with the old name of the Lakes
    of Killarney and works by the lake amid rainbows and showers of fiery dew.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Lugh is described as having more distinctly solar attributes than any other
    Celtic deity, and Bres mistakes the radiance of Lugh's face for the sun rising
    in the west.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: Lugh is described as father, by the Milesian maiden Dectera, of Cuchulain,
    who is called the most heroic figure in Irish legend.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: Midir the Proud is son of the Dagda and has a fairy palace at Bri Leith or
    Slieve Callary.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:20
  text: Midir appears to King Eochy at Tara as a strange young warrior with purple
    clothing, golden hair, grey eyes, spear, and gemmed shield.
  category: attribute
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:21
  text: Eochy is silent because no such person had been in Tara the previous night
    and the gate had not been opened.
  category: action
  evidence_refs:
  - ev:11
- id: obs:22
  text: Lir is described in one form as a vast presence commensurate with the sea,
    and in another as a separate person dwelling invisibly on Slieve Fuad; the sea-god
    attributes are mostly given to his son Mananan in Irish legend.
  category: attribute
  evidence_refs:
  - ev:12
