  locator: 2805-2810
  quote_or_summary: Kian says that if slain as a pig only a pig’s eric would be due,
    but if slain as a man the killers must pay a greater eric.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; summarized from dialogue.
- id: ev:5
  type: summary
  locator: 2812-2814
  quote_or_summary: Brian says Kian will be slain with no weapons, and the brothers
    stone him to death and bury him as deep as a man’s height.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:6
  type: summary
  locator: 2815-2819
  quote_or_summary: When Lugh passes by, stones on the plain cry out and tell him
    of his father’s murder; he uncovers the body, vows vengeance, and returns to Tara.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:7
  type: summary
  locator: 2819-2822
  quote_or_summary: At Tara, Lugh accuses the sons of Turenn before the High King
    and may either have them executed or name the eric he will accept.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:8
  type: summary
  locator: 2822-2827
  quote_or_summary: 'Lugh chooses an eric and names common-sounding objects: three
    apples, a pig-skin, a spear, a chariot with two horses, seven swine, a hound,
    a cooking-spit, and three shouts on a hill.'
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:9
  type: summary
  locator: 2827-2834
  quote_or_summary: Lugh explains that the apples grow in the Garden of the Sun, the
    pig-skin heals wounds and sickness, the spear is magical, and these foreign names
    are fanciful labels for places in Faëry.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:10
  type: summary
  locator: 2834-2841
  quote_or_summary: The seven swine renew after being killed and eaten; the spit belongs
    to sea-nymphs of sunken Finchory; the three shouts must be given on Mochaen’s
    guarded hill, making the tasks all but impossible.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:11
  type: summary
  locator: 2844-2853
  quote_or_summary: The sons of Turenn complete tasks with daring, but before the
    spit and shouts are won, Lugh causes forgetfulness to fall on them and they return
    to Ireland with treasures he needs against the Fomorians.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:12
  type: summary
  locator: 2856-2860
  quote_or_summary: The brothers discover Finchory is under the sea; Brian goes down
    in a magical water-dress, sees thrice fifty nymphs in their palace, and seizes
    the golden spit from their hearth.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:13
  type: summary
  locator: 2860-2864
  quote_or_summary: After desperate combat ending in the deaths of Mochaen and his
    sons, the mortally wounded brothers raise three faint cries and fulfill the eric.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:14
  type: summary
  locator: 2864-2868
  quote_or_summary: The brothers return alive to Ireland; Turenn asks Lugh for the
    magic pig-skin to heal them, but Lugh refuses, and the brothers and their father
    die together.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:15
  type: summary
  locator: 2873-2881
  quote_or_summary: At the Second Battle of Moytura, Goban, Credné, and Luchta repair
    broken Danaan weapons with magical speed through hammer blows, handles, and rivets.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:16
  type: summary
  locator: 2881-2882
  quote_or_summary: The wounded are healed by the magical pig-skin.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
  rights_note: Public domain source; concise summary.
- id: ev:17
  type: quote
  locator: 2883-2884
  quote_or_summary: The battlefield resounds with warriors’ shouts, breaking shields,
    clashing swords, and spears and lances.
  source_text_path: texts/public-domain/celtic/project-gutenberg/myths-legends-celtic-race-rolleston.md
