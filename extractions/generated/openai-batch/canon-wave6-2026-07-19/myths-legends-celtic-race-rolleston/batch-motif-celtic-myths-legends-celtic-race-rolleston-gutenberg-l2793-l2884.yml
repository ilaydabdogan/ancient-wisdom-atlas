canonical_text:
  quote: ''
  summary: The passage recounts Kian’s murder by the sons of Turenn, Lugh’s discovery
    of the crime through crying stones, and Lugh’s imposition of an eric consisting
    of difficult supernatural acquisitions and ritual shouts. The sons complete the
    tasks but are mortally wounded; Lugh refuses the healing pig-skin, and they die
    with Turenn. The passage then introduces the Second Battle of Moytura, where Danaan
    craftsmen repair weapons magically and the wounded are healed by the pig-skin.
  language: English
  quote_policy: summarized
