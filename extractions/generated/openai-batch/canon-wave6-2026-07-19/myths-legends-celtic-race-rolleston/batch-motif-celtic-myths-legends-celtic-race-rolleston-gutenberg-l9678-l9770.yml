  quote: ''
  summary: The passage introduces the Welsh Mabinogion and recounts the first branch
    story in which Pwyll of Dyfed encounters Arawn of Annwn, exchanges shapes and
    kingdoms with him for a year, defeats Arawn's rival Havgan with a single blow
    while refusing a second, preserves chastity with Arawn's wife, returns to his
    own shape and land, and establishes lasting friendship with Arawn, gaining the
    title Lord or Head of Annwn.
  language: English
