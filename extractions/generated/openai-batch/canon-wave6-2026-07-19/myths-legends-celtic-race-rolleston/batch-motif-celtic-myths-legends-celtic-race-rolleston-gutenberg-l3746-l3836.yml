canonical_text:
  quote: ''
  summary: 'The passage summarizes early Irish royal traditions: Tiernmas introduces
    Crom Cruach worship and dies with many of his people on November Eve; he is also
    credited with gold-mining and rank-marked clothing colors. Ollav Fōla is presented
    as a lawgiving king and founder of Tara’s triennial political festival. The passage
    then recounts the founding and naming of Emain Macha, including Macha’s seizure
    of sovereignty, forced marriage to Kimbay, capture of Dithorba’s sons, and use
    of captive labor to build the fortress whose circuit she marks with the spear
    of her brooch.'
  language: English
  quote_policy: summarized
