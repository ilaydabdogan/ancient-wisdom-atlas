canonical_text:
  quote: "“Here is my son for you, men of Ulster,”"
  summary: 'Cuchulain is summoned by King Conor to fight a stranger boy whom Emer
    warns may be his son by Aifa. Cuchulain fights the boy, wounds him with the Gae
    Bolg, recognizes him by a ring, and the boy dies after farewells. The narrator
    comments that the tale is an early literary instance of a father slaying a heroic
    son, comparing it with Sohrab and Rustum. The passage then turns to Cuchulain’s
    first foray after training with Skatha: he surveys Ulster from the Mountains of
    Mourne, challenges the sons of Nechtan after reading an Ogham geis on a pillar-stone,
    kills them, burns their fort, and captures wild swans and stags.'
  language: English
  quote_policy: quoted
