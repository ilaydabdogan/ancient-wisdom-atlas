candidate_motifs:
- id: motif:1
  label: heroic son slain by his father in combat
  taxonomy_refs: []
  basis: The boy is warned to be Cuchulain’s only son, fights Cuchulain, is fatally
    wounded, recognized, acknowledged as Cuchulain’s son, and dies; the narrator explicitly
    names the theme.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The narrator notes that Cuchulain is not without suspicion of the opponent’s
    identity, so the episode is not purely ignorant recognition after combat.
- id: motif:2
  label: loyalty to prince and province overriding kinship
  taxonomy_refs: []
  basis: Cuchulain says he would slay Connla for Ulster’s honour, and the narrator
    states that he fights under passionate loyalty to his prince and province.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: This is a character motivation in the passage rather than a formal taxonomy
    item supplied in the request.
- id: motif:3
  label: recognition token after fatal wounding
  taxonomy_refs: []
  basis: Only after using the Gae Bolg does Cuchulain see the ring on the boy’s finger
    and acknowledge the truth of his identity.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explain the ring’s origin or prior arrangement.
- id: motif:4
  label: heroic combat leaves named landscape traces
  taxonomy_refs: []
  basis: During wrestling, the boy’s feet sink into stone, creating footprints that
    explain the name Strand of the Footprints.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the place-name explanation but no separate cultic or
    ritual context.
- id: motif:5
  label: first foray as test after martial training
  taxonomy_refs:
  - initiation
  - departure
  basis: After a year and a day under Skatha, Cuchulain returns eager to test his
    prowess, win Emer, and sets out by chariot on his first foray.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The taxonomy links to initiation and departure are broad; the passage
    uses the section title and action rather than an explicit initiation label.
- id: motif:6
  label: geis-bound single-combat challenge
  taxonomy_refs: []
  basis: An Ogham inscription declares that an armed man entering the green must not
    depart without challenging a dweller of the dūn to single combat.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The supplied taxonomy does not include a specific geis or taboo-challenge
    category.
- id: motif:7
  label: invulnerability bypassed by alternate weapon
  taxonomy_refs: []
  basis: Foill is magically invulnerable to the point or edge of blades, so Cuchulain
    uses a sling and tempered iron ball to kill him.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The source gives no wider explanation of Foill’s magic protection.
- id: motif:8
  label: warrior trophy display after victory
  taxonomy_refs: []
  basis: Cuchulain binds Foill’s head to the chariot-rim and later ties captured swans
    and stags to the chariot.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage reports the actions but does not explicitly call them trophies
