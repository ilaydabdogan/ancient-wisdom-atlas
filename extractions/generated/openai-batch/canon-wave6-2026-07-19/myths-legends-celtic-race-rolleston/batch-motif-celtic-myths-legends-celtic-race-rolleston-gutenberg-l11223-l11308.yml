canonical_text:
  quote: ''
  summary: 'The passage first gives a comparative interpretation of the Grail materials:
    a cauldron or vessel of abundance, a blood-dripping lance, solar and thunder-weapon
    associations, and their transformation into Christian Grail romance. It then frames
    the Taliesin tale and narrates Ceridwen’s attempt to brew wisdom for her son Avagddu,
    Gwion Bach’s accidental reception of the three drops of inspiration, the poisoning
    of the remaining brew, Ceridwen’s pursuit through multiple transformations, Gwion’s
    swallowing as a grain of wheat, rebirth as an infant, and exposure at sea in a
    leather bag.'
  language: English
  quote_policy: summarized
