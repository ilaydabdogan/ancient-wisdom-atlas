canonical_text:
  quote: ''
  summary: Glossary/index entries summarize figures, objects, episodes, and cross-references
    connected with Cuchulain, Cullan, the Grail and Magic Cauldron, Cymric cosmogony,
    Da Derga, the Dagda, Dana, Etain, and related names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cuchulain is identified as an Ulster hero in Irish saga with Lugh as father
    by Dectera, a strange birth, the earliest name Setanta, and a name derived from
    the hound of Cullan.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:2
  text: Cuchulain claims arms of manhood from Conor, wooes Emer, is instructed by
    Skatha in the Land of Shadows, overcomes Aifa, fathers Connla by Aifa, and later
    slays Connla.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cuchulain places Maev’s host under geise, undergoes battle-frenzy and rias-tradh,
    encounters love and hostility from the Morrigan, fights Loch and Ferdia, and spends
    time in Fairyland where Fand loves him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near Cuchulain’s death, the index lists madness, Bave personating Niam, the
    Morrigan croaking of war, the Washer at the Ford, a broken geis caused by Clan
    Calatin, the mortal wounding of the Grey of Macha, and Cuchulain’s mortal wounding
    by Lewy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cullan gives a feast to King Conor; Cuchulain slays Cullan’s hound and is
    named the Hound of Cullan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Cup of the Last Supper is identified with the Grail and given the Magic
    Cauldron as an equivalent.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Curoi is identified as father of Lewy and husband of Blanid; he is slain by
    Cuchulain, and Blanid sets her love on Cuchulain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Custennin assists Kilhwch in his quest for Olwen.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Cymric cosmogony is summarized as involving God and Cythrawl as two primary
    existences standing for principles of life and destruction, with Cythrawl realized
    in Annwn, the Abyss or Chaos.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Conary seeks hospitality at Da Derga’s hostel, and Ingcel and his own sons
    attack the hostel.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Dagda is described as the Good or possibly Wise God, supreme head of the
    People of Dana, father of Brigit, possessor of a cauldron treasure and a magical
    harp, and distributor of spiritual Ireland among the Danaans.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Dalan, a Druid, discovers for Eochy that Etain has been carried to the mound
    of Bri-Leith.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The entry on Damayanti and Nala states that the Hindu legend is compared with
    the story of Etain.
  category: other
  evidence_refs:
  - ev:12
- id: obs:14
  text: The People of Dana are described as Nemedian survivors returning to Ireland,
    called gods by Tuan mac Carell, associated with four cities and treasures, and
    possessing the prerogative of Faery or skill in music.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: Dana is described as daughter of the Dagda, the greatest of Danaan goddesses,
    mother of Brian, Iuchar, and Iucharba, and equivalent to Dōn, a Cymric mother-goddess.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:16
  text: Cup-and-ring markings are mentioned in connection with megalithic monuments;
    the entry says their meaning receives no light and notes examples associated with
    New Spain and Mexico.
  category: object
  evidence_refs:
  - ev:15
