canonical_text:
  quote: ''
  summary: The passage introduces the religion of the Celts by contrasting the survival
    of Irish Celtic civilization and legend with the loss of explicit native Irish
    religious doctrine. It presents St. Patrick as silent on the doctrines he displaced,
    Julius Caesar as a source for Gaulish and wider Celtic religion, the British Islands
    as an authoritative religious centre, and Celtic religion as including both official
    religion and older popular practices. It then turns to the Megalithic People,
    burial-centered religion, and the spread of dolmens, cromlechs, and tumuli, ending
    with an illustration caption for a dolmen at Proleek, Ireland.
  language: English
  quote_policy: summarized
