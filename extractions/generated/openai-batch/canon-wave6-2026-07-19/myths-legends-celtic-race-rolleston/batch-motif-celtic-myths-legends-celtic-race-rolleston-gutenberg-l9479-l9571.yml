  summary: The passage presents a genealogical chart for Arthur and related figures,
    then gives comparative explanations linking Welsh figures and divine houses with
    Irish counterparts. It identifies Llyr and Manawyddan with Irish sea gods, interprets
    Llew Llaw Gyffes as related to Lugh of the Long Arm, describes the houses of Dōn
    and Llyr, and explains Arthur’s later entry into this mythological scheme.
  language: English
  quote_policy: summarized
