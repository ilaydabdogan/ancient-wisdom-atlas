canonical_text:
  quote: ''
  summary: Maeldūn learns his parentage and that his father Ailill was killed and
    burned by reavers from Leix. He prepares a sea-voyage in a skin coracle under
    Druidic instructions limiting the crew to seventeen, but his three foster-brothers
    force their way aboard, causing a stated transgression. After a failed chance
    to land on an island where his father’s killer is present, a sudden wind blows
    the boat into the ocean. The crew then encounters a sequence of strange islands,
    including islands of slaves, giant ants, great birds, a fierce beast, and giant
    horses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maeldūn is taunted about not knowing his kindred and descent, refuses food
    and drink until told, and learns from his birth mother that his father was Ailill
    of the Owens of Aran.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scorched and blackened flagstone in the ruined church graveyard is identified
    as the place where Ailill, Maeldūn’s father, was burned after being slain by reavers
    from Leix.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After learning who killed his father, Maeldūn drops the stone he was about
    to cast, goes home, and asks the way to Leix; he is told the route is only by
    sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Druid advises Maeldūn to build a skin coracle with threefold lapped skins
    and states that only seventeen men may accompany him, with specified days for
    building and launching.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maeldūn sets sail with the permitted company, but his three foster-brothers
    jump into the sea to force him to take them aboard, and he turns back to rescue
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrative states that the addition of the foster-brothers was a transgression
    and that the company was punished by wandering until expiation had been made.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the Island of the Slaves, one armed man boasts that he slew Ailill and
    burned the church of Doocloone over him; Maeldūn attempts to land but a sudden
    wind blows the boat into the ocean.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the Island of the Ants, foal-sized ferocious ants come down the strand
    and into the sea toward the boat, causing the crew to flee.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: On the Island of the Great Birds, Maeldūn first searches the island alone;
    the crew then lands, kills and eats birds, and brings others aboard.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: On the Island of the Fierce Beast, a horse-like beast with hound-like clawed
    feet tries to devour the voyagers and throws pebbles after them as they row away.
  category: action
  evidence_refs:
  - ev:9
