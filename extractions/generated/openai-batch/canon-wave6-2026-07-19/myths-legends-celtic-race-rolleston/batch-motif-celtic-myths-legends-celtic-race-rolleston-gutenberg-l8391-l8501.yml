candidate_motifs:
- id: motif:1
  label: hidden parentage revealed after taunt
  taxonomy_refs: []
  basis: A taunt about ignorance of descent leads Maeldūn to demand the truth and
    learn the identity of his father.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a parentage revelation but does not frame it as sacred
    birth or royal succession.
- id: motif:2
  label: departure for vengeance by sea
  taxonomy_refs:
  - departure
  basis: After learning that Ailill was killed by reavers from Leix, Maeldūn asks
    the way there and is told he can go only by sea, leading to the building and launch
    of a boat.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The intended vengeance is interrupted; the passage does not show its completion.
- id: motif:3
  label: prescribed voyage condition violated at departure
  taxonomy_refs: []
  basis: The Druid prescribes a crew limit of seventeen, but the three foster-brothers
    force Maeldūn to take them aboard, and the narrative labels this a transgression.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No broader taboo system is described beyond this crew-number restriction.
- id: motif:4
  label: wandering until expiation after transgression
  taxonomy_refs: []
  basis: The passage states that all were punished for the breached instruction and
    that Maeldūn was condemned to wander until expiation was made.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The nature of the expiation is not detailed in the provided lines.
- id: motif:5
  label: serial voyage through strange islands
  taxonomy_refs:
  - mystical_quest
  basis: The narrator says the party is blown out to sea and visits many islands with
    strange adventures; the excerpt then lists several islands with threatening or
    marvelous inhabitants.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The taxonomy reference is limited to the passage’s strange voyage structure;
    the passage does not explicitly identify an afterlife journey.
- id: motif:6
  label: blocked vengeance by sudden wind
  taxonomy_refs: []
  basis: When Maeldūn is about to land where Ailill’s killer is present, a great wind
