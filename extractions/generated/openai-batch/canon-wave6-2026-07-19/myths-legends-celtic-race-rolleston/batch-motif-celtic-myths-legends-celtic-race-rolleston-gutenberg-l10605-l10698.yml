canonical_text:
  quote: ''
  summary: Kilhwch and his companions reach Yspaddaden's castle, meet Custennin and
    his wife, encounter Olwen, and receive from Yspaddaden a long set of bride-winning
    tasks. The tasks include ploughing a hill in one day, obtaining magical objects,
    hunting Twrch Trwyth for comb and scissors, liberating Mabon son of Modron with
    the aid of ancient animals and Arthur, and obtaining the blood of the witch Orddu.
  language: English
  quote_policy: summarized
