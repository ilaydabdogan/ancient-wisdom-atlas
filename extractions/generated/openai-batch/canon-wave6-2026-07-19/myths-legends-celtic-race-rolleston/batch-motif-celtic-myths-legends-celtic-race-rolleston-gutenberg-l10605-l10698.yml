candidate_motifs:
- id: motif:1
  label: bride quest through impossible tasks
  taxonomy_refs:
  - mystical_quest
  basis: Kilhwch must fulfill a long series of difficult tasks and obtain rare objects
    before he can marry Olwen.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The taxonomy label is broad; the passage frames the tasks as a bride price
    rather than explicitly as a mystical initiation.
- id: motif:2
  label: obstructing father whose life is bound to daughter's marriage
  taxonomy_refs: []
  basis: Olwen says she cannot wed without her father's will because his life will
    last only until her espousals, and Yspaddaden then obstructs Kilhwch with attacks
    and tasks.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:10
  confidence: high
  cautions: No available taxonomy reference precisely matches this father-daughter
    condition.
- id: motif:3
  label: transformed king as monstrous animal quarry
  taxonomy_refs:
  - shapeshifter
  basis: Twrch Trwyth is described as a king transformed into a monstrous boar, and
    the heroes must hunt him for the comb and scissors between his ears.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not narrate the transformation event, only states the
    transformed condition.
- id: motif:4
  label: quest for magical feast and power objects
  taxonomy_refs:
  - sacred_exchange
  basis: The demanded bride price includes a magic cauldron, magic basket, magic horn,
    giant's sword, and special honey for the wedding feast.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage calls the demands a bride price, but the sacred quality of
    the exchange is inferred only from the magical objects and wedding context.
- id: motif:5
  label: abducted child located through ancient witnesses
  taxonomy_refs:
  - wisdom
  basis: Mabon, taken from his mother when three nights old, is located by consulting
    a chain of very old animals, ending with the oldest living thing.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The motif is recorded as a knowledge-search pattern; the passage does
    not present a formal wisdom contest.
- id: motif:6
  label: imprisoned helper liberated for the quest
  taxonomy_refs:
