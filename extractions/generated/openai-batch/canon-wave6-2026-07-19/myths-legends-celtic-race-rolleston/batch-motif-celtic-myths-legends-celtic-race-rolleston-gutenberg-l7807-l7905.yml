    shared feature that both Dermot and Adonis are associated with death caused by
    a wild boar.
  claim_level: same_motif
  target: Adonis-like beauty/love hero killed by a wild boar
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is supplied by the passage itself; it does not by itself
    establish historical contact, common inheritance, or equivalence beyond the stated
    analogy.
