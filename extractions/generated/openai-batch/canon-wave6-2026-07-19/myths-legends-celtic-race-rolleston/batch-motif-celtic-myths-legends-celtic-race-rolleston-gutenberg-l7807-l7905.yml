candidate_motifs:
- id: motif:1
  label: Reconciliation of pagan and Christian exemplars
  taxonomy_refs:
  - duality
  basis: The passage explicitly contrasts pagan and Christian epochs but says their
    finest traits harmonize and supplement each other.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is an authorial framing of the Colloquy rather than a self-contained
    narrative action.
- id: motif:2
  label: Beauty and love hero killed by a wild boar
  taxonomy_refs: []
  basis: Dermot is described as a beauty and love-tale hero, and the passage states
    that his death was caused by a wild boar.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage mentions death by boar but does not narrate the death scene
    itself in this excerpt.
- id: motif:3
  label: Dead child transformed into an avenging animal
  taxonomy_refs:
  - shapeshifter
  basis: Roc strikes his son’s corpse with a Druid rod; a huge boar arises in place
    of the dead child and is charged to kill Dermot.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The transformation is involuntary and effected by a magical rod; it is
    not voluntary self-shapeshifting.
- id: motif:4
  label: Supernatural hospitality house with allegorical test
  taxonomy_refs:
  - initiation
  basis: The heroes enter a mysterious hospitable hut, fail against the wether, receive
    an explanation of the animals’ identities, and Dermot later receives a special
    mark.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: No formal initiation is named in the passage; the classification is based
    on the sequence of mysterious lodging, trial, revelation, and marking.
- id: motif:5
  label: World subdued by Death
  taxonomy_refs: []
  basis: The old man explicitly identifies the wether as the World and the cat as
    Death, the power that destroys the world.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The allegory is explicit within the tale, but no broader cosmological
    system is explained here.
- id: motif:6
  label: Personified Youth grants an irresistible love-mark
  taxonomy_refs: []
  basis: The maid identifies herself as Youth and marks Dermot’s forehead so that
    women will love him as long as he lives.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the effect of the mark but does not classify the maid
    as a deity or specify the mark’s physical form beyond its placement.
- id: motif:7
  label: Hard servant carries champions over water to a fabled western region
  taxonomy_refs:
  - departure
  - trickster_boundary
  basis: The Gilla Dacar enters service, is mocked, runs westward, and his mare carries
    Fianna riders into the sea toward the fabled West.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage does not call the Gilla Dacar a trickster, and it does not
    define the fabled western region.
