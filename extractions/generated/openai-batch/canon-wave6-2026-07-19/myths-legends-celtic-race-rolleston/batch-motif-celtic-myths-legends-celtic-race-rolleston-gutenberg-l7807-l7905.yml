canonical_text:
  quote: ''
  summary: 'The passage first frames Keelta and Patrick as harmonious representatives
    of pagan and Christian epochs. It then summarizes several Dermot O’Dyna legends:
    Dermot as a beauty and love-hero whose death is associated with a wild boar; the
    origin of the Ben Bulben boar from Roc’s slain child through a Druid rod; the
    mystery-hut episode where a wether is revealed as the World, a cat as Death, and
    Youth grants Dermot the Love Spot; and the opening of the Gilla Dacar chase, in
    which a hard servant and his mare carry Fianna riders into the sea toward the
    fabled West.'
  language: English
  quote_policy: summarized
