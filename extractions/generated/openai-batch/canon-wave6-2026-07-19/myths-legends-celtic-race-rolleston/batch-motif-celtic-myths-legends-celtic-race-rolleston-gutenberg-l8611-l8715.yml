- id: motif:2
  label: Contagious transformation and compelled imitation
  taxonomy_refs: []
  basis: Men who land on the lamenting island turn black and begin weeping, and rescued
    men report that they had to do what others around them did.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The mechanism is not explained beyond exposure to the island and imitation
    of inhabitants.
- id: motif:3
  label: Enchanted hospitality followed by sleep and disappearance
  taxonomy_refs: []
  basis: On the Four Fences island, food and drink lead to a three-day sleep and awakening
    at sea; on the Glass Bridge island, supernatural hospitality and a deferred answer
    are followed by awakening at sea with the island gone.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage does not explicitly name the islands as otherworldly or explain
    the disappearance.
- id: motif:4
  label: Desire-responsive food or vessel
  taxonomy_refs: []
  basis: The Four Fences food tastes as each man wishes, and the Glass Bridge woman’s
    single pail supplies each man with what he most desires.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The text gives the effect but not the origin or rules of the food and
    pail.
- id: motif:5
  label: Inaccessible glass bridge and sleep-inducing metal gate
  taxonomy_refs: []
  basis: The glass bridge throws the voyagers backward, and striking the brazen portcullis
    produces a melody that makes them sleep until morning.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Any initiatory or threshold meaning would be interpretive beyond the literal
