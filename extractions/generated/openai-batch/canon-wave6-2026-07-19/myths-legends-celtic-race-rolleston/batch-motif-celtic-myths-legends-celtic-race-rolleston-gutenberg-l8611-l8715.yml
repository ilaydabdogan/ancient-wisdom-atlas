canonical_text:
  quote: ''
  summary: 'A sequence from Maeldūn’s voyage describes several marvelous islands and
    seas: a contagious lamenting island, an island divided by four precious fences,
    a glass-bridge fortress with a supernatural hostess, shouting birds, two anchorite
    islands, a dangerous smithy, a clear glass-like sea, and a mist-like sea revealing
    an undersea land with a beast, cattle, and warrior.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On one island, people are black and continually weeping; a foster-brother
    and other companions who land there turn black and begin weeping, while rescuers
    wrap their heads to avoid looking at or breathing the place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rescued men can only explain their behavior by saying that they had to
    do what they saw others doing around them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Island of the Four Fences is divided into four parts by fences of gold,
    silver, brass, and crystal, with kings, queens, warriors, and maidens placed in
    separate divisions.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the Island of the Four Fences, a maiden gives the voyagers cheese-like
    food tasting as each man wishes and intoxicating liquor that puts them asleep
    for three days; they awake at sea with no island visible.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Island of the Glass Bridge has a fortress with a brazen door and a bridge
    of glass; attempts to cross the bridge throw the voyagers backward.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman from the fortress lifts a slab of glass from the bridge, lowers a
    pail into the water below, and returns to the fortress.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the voyagers strike the brazen portcullis, its melody puts them to sleep
    until morning; this happens three times, with the woman making ironic speeches
    about Maeldūn.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the fourth day the woman crosses the bridge, welcomes Maeldūn and each
    crewman by name, assigns couches, and gives them abundant desired food and drink
    from one pail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Glass Bridge woman answers a courtship approach by saying she does not
    know and has never known what sin is; after a deferred answer, the voyagers wake
    at sea with no sign of island, fortress, or lady.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the Island of the Shouting Birds, the voyagers hear cry and chanting from
    afar and find black, brown, and speckled birds shouting and speaking; they leave
    without landing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On a wooded island full of birds, a solitary hair-clothed man says he was
    an Irishman who went to sea with a sod of his native country under his feet; God
    turned the sod into an island, adding breadth and a tree each year.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The hair-clothed Irish anchorite says the birds are his kin, that they all
    wait until Doomsday, and that angels miraculously nourish them; he hosts the voyagers
    for three nights.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Another island has a golden rampart, soft white down-like soil, a hair-clothed
    anchorite, and a fountain whose liquid changes by weekdays and holy feasts.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the Smithy island, the voyagers hear clanging and men speaking of them;
    a giant smith later throws a glowing mass of iron after their boat, and the sea
    boils where it falls.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the Sea of Clear Glass, the green glass-like water is so pure that gravel
    and sand are visible, and no monsters or beasts are seen among the crags.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: In a mist-like sea, the voyagers see roofed fortresses and fair land below,
    with a monstrous beast in a tree, cattle, and an armed warrior; the beast repeatedly
    stretches down to seize and eat cattle.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:17
  text: Fearing the mist-like sea might not support the boat, the voyagers sail over
    it and away.
  category: action
  evidence_refs:
  - ev:10
