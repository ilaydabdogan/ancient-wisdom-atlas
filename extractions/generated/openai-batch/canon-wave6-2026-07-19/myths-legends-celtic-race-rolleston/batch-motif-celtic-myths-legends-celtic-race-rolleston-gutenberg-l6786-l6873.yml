candidate_motifs:
- id: motif:1
  label: Hero with partly Danaan ancestry
  taxonomy_refs:
  - divine_parent_child
  basis: The passage explicitly says Finn, like most Irish heroes, had partly Danaan
    ancestry and names divine or mythic figures in his maternal line.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The ancestry is not presented as a direct divine-parent birth in this
    passage; the taxonomy match is approximate.
- id: motif:2
  label: Threatened child hidden and fostered in the wildwood
  taxonomy_refs: []
  basis: Murna hides Demna with two aged women in the wildwood because Clan Morna
    might find and kill him.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No explicit miraculous birth element is stated.
- id: motif:3
  label: Recovery of ancestral or communal magical treasure from a rival holder
  taxonomy_refs: []
  basis: Finn slays Lia, who holds the Fianna’s Treasure Bag, and gives the recovered
    bag to Clan Bascna survivors.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage frames the act as a deed and recovery, not explicitly as theft
    or ritual transfer.
- id: motif:4
  label: Wisdom gained by tasting or eating a knowledge-bearing animal
  taxonomy_refs:
  - wisdom
  basis: The Salmon of Knowledge grants the wisdom of the ages to whoever eats it;
    Finn accidentally tastes it and is told to eat it because the prophecy has come
    true in him.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explain the prophecy beyond Finegas’s statement.
- id: motif:5
  label: Divination through a body gesture linked to acquired wisdom
  taxonomy_refs:
  - wisdom
  basis: After the salmon episode, Finn can know future or distant events by putting
    his thumb in his mouth and biting it.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The account gives the practice but does not specify ritual conditions
    beyond the gesture.
- id: motif:6
  label: Hero wins leadership by defeating a supernatural attacker of the royal center
  taxonomy_refs:
  - royal_legitimacy
  - initiation
  basis: Finn gains the king’s oath that slaying the goblin will earn him his father’s
    captaincy, then kills the goblin and is installed over the Fianna.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  - ev:12
  confidence: high
  cautions: This is a political and martial succession episode; the passage does not
    name it as an initiation rite.
- id: motif:7
  label: Magic weapon counters enchantment and grants battle-fury
  taxonomy_refs: []
  basis: Fiacha’s spear gives strength and battle-fury when laid against the forehead;
    Finn uses it to shake off the goblin’s harp-spell.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The weapon’s origin beyond Fiacha’s possession is not stated.
- id: motif:8
  label: Supernatural music disables defenders by inducing dreamlike forgetfulness
  taxonomy_refs: []
  basis: The goblin’s harp music makes hearers fall into dreams and forget everything
    else, preventing battle against him.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not identify the harp itself as a separate named object.
comparison_claims:
