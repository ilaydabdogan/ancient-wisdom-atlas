canonical_text:
  quote: Finn, like most of the Irish heroes, had a partly Danaan ancestry.
  summary: The passage recounts Finn’s ancestry, the death of his father Cumhal, his
    hidden birth and fosterage, his recovery of the Fianna’s Treasure Bag, his apprenticeship
    to Finegas, his acquisition of wisdom through the Salmon of Knowledge, his divinatory
    thumb gesture, and his winning of the captaincy of the Fianna by slaying a goblin
    that burned Tara and enchanted its defenders with music.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Finn is described as having partly Danaan ancestry through his mother Murna’s
    lineage, while his father Cumhal is chief of Clan Bascna and is killed by Clan
    Morna at the battle of Knock.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lia, lord of Luachar and Treasurer of the Fianna, keeps a crane-skin Treasure
    Bag containing magic weapons and valuable jewels said to come from the days of
    the Danaans.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Cumhal’s defeat and death, Murna takes refuge in the forests of Slieve
    Bloom and gives birth to a son named Demna.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Murna gives Demna to two aged women to be nurtured in the wildwood because
    she fears Clan Morna will find and kill him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Demna is later called Finn, meaning the Fair One, because of his white skin
    and golden hair.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Finn’s first deed is to slay Lia and take the Treasure Bag of the Fianna from
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Finn finds his uncle Crimmal and other surviving old chiefs of Clan Bascna
    in poverty in the forests of Connacht, furnishes them with a retinue, and gives
    them the Treasure Bag.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Finn studies poetry and science with Finegas, an ancient sage and Druid who
    dwells on the river Boyne.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fintan, the Salmon of Knowledge, lives in a pool of the Boyne beneath hazel
    boughs that drop Nuts of Knowledge into the stream; whoever eats the salmon will
    have the wisdom of the ages.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Finegas catches the salmon after Finn becomes his pupil and tells Finn to
    cook it without eating any of it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Finn burns his thumb while turning the salmon on the spit and puts the thumb
    to his mouth; Finegas then tells him to eat the salmon because the prophecy has
    come true in him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Afterward, Finn can gain knowledge of future events or distant happenings
    by putting his thumb in his mouth and biting it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Finn goes to Tara during the Great Assembly, declares himself Finn son of
    Cumhal, and seeks service with the king as his father did.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Tara is troubled by a goblin or demon that comes at nightfall, blows fire-balls
    against the royal city, and plays harp music that causes listeners to fall into
    dreams and forget everything else.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Finn asks the king whether he will receive his father’s place as captain of
    the Fianna if he slays the goblin, and the king binds himself by oath to grant
    it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Fiacha gives Finn a magic spear whose naked blade, when laid against a man’s
    forehead, fills him with strength and battle-fury making him invincible in combat.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: Finn uses the spear at Tara to shake off the harp-spell, pursues the phantom
    to the Fairy Mound of Slieve Fuad, slays him, and brings his head back to Tara.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: Cormac the king sets Finn before the Fianna and orders them to swear obedience
    to him as captain or seek service elsewhere; Goll mac Morna swears first and the
    rest follow.
  category: sequence
  evidence_refs:
  - ev:12
