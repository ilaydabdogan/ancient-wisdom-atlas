  quote: ''
  summary: The passage recounts Blodeuwedd and Gronw's plot against Llew, the special
    conditions under which Llew can be wounded, his transformation into an eagle,
    Gwydion's discovery and restoration of him, and the later punishment of Blodeuwedd
    and Gronw. It then summarizes the tale of Maxen Wledig's dream of a maiden in
    Britain, his search for and marriage to her, the reconquest of his Roman empire,
    and a prophecy attributed to Taliesin about the Cymry.
  language: English
