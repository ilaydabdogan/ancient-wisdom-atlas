candidate_motifs:
- id: motif:1
  label: lover's betrayal and murder plot against spouse
  taxonomy_refs: []
  basis: Blodeuwedd and Gronw become lovers while Llew is away and plan to be rid
    of him permanently.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames this as narrative action rather than explicitly naming
    a motif family.
- id: motif:2
  label: secret of conditional invulnerability learned by deception
  taxonomy_refs:
  - forbidden_knowledge
  basis: Llew has highly specific conditions under which he can be killed, and Blodeuwedd
    learns them under pretence of concern for him.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The taxonomy reference is limited to the secret-vulnerability knowledge;
    the passage does not use the phrase forbidden knowledge.
- id: motif:3
  label: liminal death condition
  taxonomy_refs:
  - trickster_boundary
  basis: Llew's vulnerability depends on being neither inside nor outside, neither
    mounted nor on foot, and standing between a dead buck and a cauldron-bath under
    a roof.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The boundary logic is explicit, but the exact taxonomy association is
    interpretive.
- id: motif:4
  label: wounded hero transformed into bird and restored
  taxonomy_refs:
  - shapeshifter
  basis: After being wounded, Llew becomes an eagle; Gwydion later restores the eagle
    to Llew's human shape with a magic wand.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage describes transformation and restoration, but not death followed
    by resurrection.
- id: motif:5
  label: animal-guided search for hidden transformed figure
  taxonomy_refs:
  - mystical_quest
  basis: Gwydion follows a sow whose unexplained route leads him to the tree where
