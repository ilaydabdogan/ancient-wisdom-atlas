  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The quest element is present as a search, but the passage does not explicitly
    label it mystical.
- id: motif:6
  label: punitive transformation into nocturnal bird
  taxonomy_refs:
  - shapeshifter
  basis: Blodeuwedd is changed into an owl and ordered to shun the light of day as
    vengeance.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives the transformation and command, but does not elaborate
