canonical_text:
  quote: ''
  summary: 'The passage describes the Danaans after the Milesian conquest as beings
    of fairyland who can interact with mortals, intermarry with them, and be slain
    despite beauty, immortality, and enchantment. It distinguishes Danaan beings from
    objects of worship and says Celtic worship was directed to elemental natural forces;
    it also describes a popular conception of the Danaans as earth-gods invoked for
    fertility. The passage then recounts the Milesian settlement: Eber Donn dies before
    entering Ireland, Eber Finn and Eremon dispute sovereignty, Amergin judges the
    succession, Ireland is partitioned, war follows, Eber is slain, and Eremon becomes
    sole king at Tara.'
  language: English
  quote_policy: summarized
