candidate_motifs:
- id: motif:1
  label: Heirless ruler and pressure for a new wife
  taxonomy_refs:
  - royal_legitimacy
  basis: Pwyll lacks an heir to the throne, and his nobles urge remarriage before
    the birth of a son.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames the issue politically through succession rather than
    giving a formal legitimacy ritual.
- id: motif:2
  label: Stolen infant and false accusation of monstrous maternity
  taxonomy_refs: []
  basis: The infant disappears while watchers sleep, and the watchers fabricate blood-and-bones
    evidence to claim Rhiannon devoured him.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not identify who took the child at this point.
- id: motif:3
  label: Public penance of the falsely accused mother
  taxonomy_refs: []
  basis: Rhiannon is made to sit at the gate, recount the accusation, and offer to
    carry strangers into the castle.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The penance is imposed socially and judicially within the tale; no external
    ritual parallel is asserted.
- id: motif:4
  label: Night watch against recurring theft of animal offspring
  taxonomy_refs: []
  basis: Teirnyon watches the stable because his mare's colts have disappeared after
    foaling each first of May.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The source does not explain the previous disappearances.
- id: motif:5
  label: Severed intrusive clawed arm of an unseen thief
  taxonomy_refs: []
  basis: A long, clawed arm enters the stable and seizes the colt; Teirnyon cuts it
    off at the elbow, after which wailing is heard outside.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The being attached to the arm is not seen or named in the passage.
- id: motif:6
  label: Miraculous foundling marked by golden hair and rapid growth
  taxonomy_refs:
  - miraculous_child
  basis: The infant is found richly wrapped, named Gwri of the Golden Hair, and grows
    in two years to the size and strength of a child of six.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage reports unusual growth but does not explicitly call the child
    divine.
- id: motif:7
  label: Return and recognition of the hidden royal heir
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: Teirnyon recognizes Pwyll's features in the boy, brings him to Narberth,
    and the court recognizes him as Pwyll's child; he later succeeds Pwyll.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: Recognition is based on resemblance and public acknowledgment, not on
    a formal ordeal.
- id: motif:8
  label: Reward offered and refused after restoration
  taxonomy_refs: []
  basis: Pwyll offers Teirnyon horses, jewels, and dogs, but Teirnyon refuses them
    after returning the child.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not describe the refusal as sacred exchange or vow.
- id: motif:9
  label: Contrasted sibling pair of peace-maker and strife-maker
  taxonomy_refs:
  - sibling_pair
  - duality
  basis: Nissyen and Evnissyen are paired as sons of the same parents and are described
    with opposed dispositions toward peace and strife.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Only their character contrast is introduced in this passage; later actions
    are outside the supplied excerpt.
- id: motif:10
  label: Sea-borne embassy with visible peace sign
  taxonomy_refs: []
  basis: Thirteen ships come from Ireland, and a shield is held point upward on the
    foremost ship as a sign of peace.
  evidence_refs:
