canonical_text:
  quote: ''
  summary: 'The passage concludes the Oisín-and-Patrick episode: Oisín, now old, learns
    that Finn, Oscar, and the Fianna belong to a past three hundred years gone, encounters
    the Christian order represented by Patrick, and has his memories recorded. A source
    note identifies Michael Comyn’s eighteenth-century poem as the known source for
    the Niam and Land of Youth episodes, while older Ossianic poems also prolong Oisín’s
    life so that he can meet Patrick. The passage then begins “The Enchanted Cave”:
    Conaran of the Danaan Folk sends three sorcerer-daughters against Finn’s hunting
    party; the hags entangle and bind the Fianna with bewitched yarn at a cave mouth,
    but Goll mac Morna defeats them, spares Irnan in exchange for releasing the captives,
    and is praised by Fergus Truelips.'
  language: English
  quote_policy: summarized
