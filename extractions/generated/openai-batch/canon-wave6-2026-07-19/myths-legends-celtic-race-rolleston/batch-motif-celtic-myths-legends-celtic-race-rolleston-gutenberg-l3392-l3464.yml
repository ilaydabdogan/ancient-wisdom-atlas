canonical_text:
  quote: There are two Irelands henceforward, the spiritual and the earthly.
  summary: The passage recounts the Milesians withdrawing beyond nine waves, being
    obstructed by Danaan sorcery, receiving Aranan’s dying report that there is no
    storm aloft, and being aided by Amergin’s incantation. Eber Donn’s violent boast
    is followed by renewed tempest and shipwreck. A surviving Milesian remnant lands,
    defeats the Danaans, and gains sovereignty. The Danaans become invisible inhabitants
    of a spiritual Ireland associated with mounds, fairy palaces, undying youth, and
    the Sidhe. The narrator then interprets Danaan myths as symbolic of poetry, science,
    artistic skill, and powers of light, while raising questions about the meaning
    of Milesian victory.
  language: English
  quote_policy: quoted
