  summary: Io recounts the dreams, oracles, expulsion, transformation, pursuit, and
    wandering that followed Jupiter's desire for her. The Chorus reacts in horror,
    and Prometheus foretells further travels across named peoples, rivers, mountains,
    and crossings, including the future Bosphorus, before Io laments that death would
    be preferable to endless suffering.
