canonical_text:
  quote: ''
  summary: The Chorus fears the army encircling Thebes, prays to city-protecting gods,
    and imagines the sack of the city with fire, slaughter, captivity, and plunder.
    A scout and Eteocles arrive; the Messenger reports Tydeus at the Proetid gate,
    restrained by a seer because the sacrifices are inauspicious. Tydeus is described
    with serpent-like rage and a shield bearing a starry night sky and full moon.
    Eteocles dismisses the shield device as powerless, interprets it as an omen against
    Tydeus, and appoints Melanippus as defender. The Chorus prays for the champion’s
    success.
  language: English
  quote_policy: summarized
