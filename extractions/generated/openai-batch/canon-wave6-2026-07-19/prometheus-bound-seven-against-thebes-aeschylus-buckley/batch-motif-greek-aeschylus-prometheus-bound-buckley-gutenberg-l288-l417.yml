canonical_text:
  quote: ''
  summary: Strength and Force bring Vulcan and Prometheus to a remote Scythian desert.
    Strength orders Vulcan to bind Prometheus to cragged rocks with unbreakable chains
    because Prometheus stole fire and gave it to mortals. Vulcan reluctantly carries
    out Jupiter's command, fastening Prometheus with fetters and a wedge while lamenting
    his sufferings. Strength mocks Prometheus and exits with Force. Prometheus appeals
    to cosmic powers to witness his suffering, says he knows future events, and resolves
    to bear what Necessity imposes.
  language: English
  quote_policy: summarized
