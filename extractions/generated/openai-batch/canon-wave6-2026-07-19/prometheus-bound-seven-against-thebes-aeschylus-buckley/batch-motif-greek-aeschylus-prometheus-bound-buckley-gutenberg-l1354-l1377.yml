canonical_text:
  quote: ''
  summary: The Chorus rejects Mercury’s counsel as base and says it is willing to
    suffer with Prometheus rather than act as a traitor. Mercury warns the Chorus
    that, if it is caught in the snares or net of Ate, it should not blame fortune
    or Jove because it acts knowingly. After Mercury exits, Prometheus describes a
    violent upheaval of earth, thunder, lightning, winds, and sky, names it as an
    onslaught from Jove, and calls upon Mother Earth and ether to behold his wrongs.
