canonical_text:
  quote: ''
  summary: Prometheus tells Io and the Chorus that his own sufferings will continue
    until Jove is deposed, foretells Jove's dangerous future match and Prometheus'
    liberation by a descendant of Io, then describes Io's perilous wanderings through
    distant lands, monstrous beings, Dodona, and the future naming of the Ionian gulf.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prometheus says he is not doomed to die, that death would be an escape, and
    that his hardships have no limit until Jove is deposed from tyranny.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Io says she is suffering ill through Jupiter and would be glad to see him
    fall from power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Prometheus says Jupiter will be despoiled of his sceptre through his own senseless
    counsels and a match he will one day regret.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prometheus says a consort will give birth to a son mightier than the father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Prometheus says Jupiter has no refuge from the misfortune before Prometheus
    is liberated from his shackles.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Prometheus says his liberator is ordained to be one of Io's descendants, the
    third of her lineage in addition to ten other generations.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prometheus offers Io a choice between hearing the rest of her troubles or
    the identity of his deliverer; the Chorus asks him to give Io the account of her
    wanderings and the Chorus the account of the deliverer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Prometheus says he will describe Io's mazy wanderings and tells her to engrave
    them on the recording tablets of her mind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Io's route is described as crossing a boundary stream between continents,
    passing over the sea, and reaching the Gorgonian plains of Cisthene where the
    Phorcides dwell.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Phorcides are described as three swan-like aged damsels who possess one
    eye in common and a single tooth, and on whom neither sun nor moon looks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Near the Phorcides are three winged, snake-tressed Gorgons, abhorred by mortals;
    humans who look on them cannot retain life.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Prometheus warns Io to keep away from the keen-fanged, non-barking hounds
    of Jupiter called gryphons, and from the one-eyed Arimaspian cavalry near the
    gold-gushing fount, the stream of Pluto.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Prometheus says Io will pass a dark tribe near the fountains of the sun, follow
    the river AEthiops, reach the Nile cataract from the Bybline mountains, and be
    guided to the triangular land of the Nile where she and her children are ordained
    to found a distant colony.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Prometheus says he will recount Io's earlier hardships as proof that she has
    not listened to him in vain.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: At Dodona, speaking oaks at the oracular seat of Thesprotian Jove saluted
    Io as the illustrious spouse of Jove that is to be.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Prometheus says the gulf of the deep will be called IO-nian as a memorial
    of Io's passage to mortals.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: Prometheus presents these tokens as evidence that his intelligence perceives
