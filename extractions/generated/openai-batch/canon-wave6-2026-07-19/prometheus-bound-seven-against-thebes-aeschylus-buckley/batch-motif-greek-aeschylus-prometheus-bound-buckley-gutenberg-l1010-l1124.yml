- id: motif:2
  label: Divine ruler's fall through future consort and stronger offspring
  taxonomy_refs:
  - divine_parent_child
  - sacred_marriage
  basis: Jupiter will make a regrettable match with a consort who will bear a son
    mightier than the father, leading to his ejection from power.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The consort's identity and whether the match is celestial or mortal are
    explicitly not disclosed in this passage; 'sacred_marriage' is a cautious taxonomy
    fit because the match is ominous rather than celebratory.
- id: motif:3
  label: Withheld prophecy and selective disclosure
  taxonomy_refs:
  - forbidden_knowledge
  - wisdom
  basis: Prometheus says the nature of Jupiter's match is not a matter he can communicate,
    offers only one of two disclosures, and later presents his account as evidence
    of intelligence beyond appearances.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:11
  confidence: medium
  cautions: The passage shows restricted prophetic speech, but it does not explicitly
    call the knowledge forbidden.
