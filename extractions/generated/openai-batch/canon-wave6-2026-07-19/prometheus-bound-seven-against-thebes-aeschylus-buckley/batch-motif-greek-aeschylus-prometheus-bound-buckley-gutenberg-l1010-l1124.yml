candidate_motifs:
- id: motif:1
  label: Bound deathless sufferer awaiting eventual liberation
  taxonomy_refs: []
  basis: Prometheus is not doomed to die, experiences unending hardships, refers to
    his shackles, and expects liberation by an ordained descendant of Io.
  evidence_refs:
