canonical_text:
  quote: by stealth borne-off inclosed in a fennel-rod
  summary: Prometheus, bound on a remote rock, states that he gave boons to mortals
    by stealing fire in a fennel-rod and now suffers vengeance. A winged chorus of
    Ocean's daughters arrives, pities his fetters, criticizes Jove's harsh rule, and
    asks him to explain the accusation against him. Prometheus says Jove will later
    need his knowledge of a plot against the divine sovereignty, but he will not reveal
    it until released and compensated.
  language: English
  quote_policy: quoted
