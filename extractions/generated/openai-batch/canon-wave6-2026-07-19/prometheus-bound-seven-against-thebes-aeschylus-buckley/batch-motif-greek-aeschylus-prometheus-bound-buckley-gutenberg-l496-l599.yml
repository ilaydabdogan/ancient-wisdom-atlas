canonical_text:
  quote: ''
  summary: Prometheus recounts the divine conflict over Saturn and Jupiter, says he
    advised craft over force and helped Jupiter gain rule, then explains that Jupiter
    punished him because he opposed the destruction of mortals and gave them hope,
    fire, and arts. The Chorus expresses pity and comes near to hear more. Ocean arrives
    on a winged steed, claims kinship and friendship, and offers assistance; Prometheus
    identifies him as another witness to his suffering.
  language: English
  quote_policy: summarized
