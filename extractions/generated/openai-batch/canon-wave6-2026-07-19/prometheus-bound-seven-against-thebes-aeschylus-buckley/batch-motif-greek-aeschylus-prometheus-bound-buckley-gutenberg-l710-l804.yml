canonical_text:
  quote: All arts among the human race are from Prometheus.
  summary: The passage juxtaposes Atlas' bound suffering with Prometheus' own shackled
    misery. Prometheus recounts giving mortals rational understanding, astronomy,
    numbers, letters, memory, animal labor, vehicles, ships, medicine, divination,
    fire-related signs, and metals. The Chorus warns him not to serve humanity beyond
    profit. Prometheus states that art is weaker than necessity, that the Fates and
    Furies govern necessity, that Jupiter cannot escape doom, and that Prometheus
    must keep a concealed secret in order eventually to escape his shackles.
  language: English
  quote_policy: quoted
