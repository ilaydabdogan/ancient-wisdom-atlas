canonical_text:
  quote: Ay, but 'tis said that the gods of the captured city abandon it.
  summary: The Chorus of Theban virgins responds to the approaching Argive army by
    fleeing to the statues of the gods, praying for protection, and invoking city
    rituals. Eteocles rebukes their panic as harmful to the besieged city and directs
    them to pray that the fortifications resist the enemy spear, adding that captured
    cities are said to be abandoned by their gods.
  language: English
  quote_policy: quoted
