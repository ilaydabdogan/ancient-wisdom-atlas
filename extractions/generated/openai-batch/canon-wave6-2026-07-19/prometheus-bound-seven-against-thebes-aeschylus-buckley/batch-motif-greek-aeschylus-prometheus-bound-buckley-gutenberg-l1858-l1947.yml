canonical_text:
  quote: ''
  summary: A messenger reports the fifth and sixth attackers stationed at Thebes'
    gates. Parthenopaeus swears by his spear and carries a shield showing the Sphinx
    over a Cadmaean man; Eteocles assigns Actor against him. The messenger then reports
    Amphiaraus, a righteous seer, who rebukes Tydeus and Polynices and foresees his
    own burial in hostile soil; Eteocles reflects on evil fellowship, assigns Lasthenes,
    and the chorus prays for divine destruction of the invaders.
  language: English
  quote_policy: summarized
