canonical_text:
  quote: ''
  summary: Prometheus predicts Io's healing by Jupiter near Canopus and the Nile,
    the birth and descendants of Epaphus, the fifty maidens who flee forced cousin-marriage
    and mostly kill their husbands, and a later archer-descendant who will free Prometheus.
    Io suffers another fit and exits. The Chorus warns against unequal unions with
    gods, citing Io's suffering. Prometheus prophesies that Jove's intended marriage
    will bring about his overthrow, but says only he knows the means of escape. Mercury
    arrives and commands Prometheus to reveal the nuptial secret, calling him the
    thief of fire who gave divine honors to mortals.
  language: English
  quote_policy: summarized
