canonical_text:
  quote: ''
  summary: 'Introductory synopsis of Seven Against Thebes: Thebes is under siege;
    Eteocles organizes defenders at the gates against seven Argive chieftains; Eteocles
    and Polynices kill one another; Antigone and Ismene lament; a herald announces
    differing burial treatment for the brothers; Antigone resolves to bury Polynices
    despite the senate''s decree.'
  language: English
  quote_policy: summarized
