canonical_text:
  quote: "“never may I behold our city overrun, and an army firing it with hostile
    flame.”"
  summary: In a siege scene, the Chorus fears that the city will be overrun, burned,
    and enslaved. Eteocles rebukes their panic, urges silence and orderly prayer,
    instructs them to raise the Paean, vows sacrifices and enemy spoils to the tutelary
    gods if the city is preserved, and exits to station seven defenders at the seven
    outlets of the walls.
  language: English
  quote_policy: quoted
