  summary: 'Introductory notice for Prometheus Chained: Prometheus, after attending
    to human needs and angering Jove, is bound in a rocky cleft in remote Scythia;
    there he tells of Io, hints at the fall of Jove''s dynasty, refuses to explain
    himself to Mercury, and is swept into an abyss during violent natural upheaval.
    The passage also lists the dramatis personae.'
