canonical_text:
  quote: ''
  summary: A messenger reports successive Argive attackers stationed at Theban gates
    and describes their boasts and shield emblems. Eteocles answers by assigning Theban
    defenders and interpreting the attackers' emblems and divine allegiances, especially
    Capaneus' challenge to Jove and Hippomedon's Typhon shield opposed by Hyperbius'
    Jove shield. The chorus prays for divine punishment of the attackers.
  language: English
  quote_policy: summarized
