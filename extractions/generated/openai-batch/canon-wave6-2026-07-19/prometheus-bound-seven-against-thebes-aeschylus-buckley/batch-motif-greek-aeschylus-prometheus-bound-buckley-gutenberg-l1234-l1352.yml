canonical_text:
  quote: not one tittle shalt thou learn of the matter on which thou questionest me.
  summary: Prometheus answers Mercury with contempt, refuses to disclose the prophecy
    concerning Jupiter's loss of sovereignty, and accepts further punishment rather
    than beg for release. Mercury warns of thunder, burial in rock, return to light,
    the eagle's daily assault on Prometheus's liver, and eventual relief only through
    a god willing to substitute for him and go to Hades and Tartarus. The Chorus advises
    prudence; Prometheus remains defiant; Mercury tells sympathizers to withdraw before
    the thunder strikes.
  language: English
  quote_policy: quoted
