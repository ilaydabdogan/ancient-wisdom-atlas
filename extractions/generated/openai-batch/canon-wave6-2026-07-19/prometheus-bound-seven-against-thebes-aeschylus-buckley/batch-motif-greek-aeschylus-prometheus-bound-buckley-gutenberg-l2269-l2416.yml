canonical_text:
  quote: ''
  summary: 'Antigone and Ismene lament the deaths of Eteocles and Polynices and connect
    their grief with the house of Oedipus, Destiny, and the Furies. A Herald announces
    the Cadmaean decree: Eteocles is to receive honorable burial as defender of the
    city, while Polynices is to be left unburied and exposed because he attacked the
    city. Antigone rejects the decree and vows to bury Polynices herself, citing sibling
    kinship. The Chorus fears civic punishment while lamenting the ruin of Oedipus''
    family, and semichoral groups declare separate funeral support for the two corpses.'
  language: English
  quote_policy: summarized
