canonical_text:
  quote: ''
  summary: A messenger reports that Polynices, Eteocles' brother, stands against the
    seventh gate and bears a shield device showing Justice leading him back to his
    fathers' city. Eteocles rejects Polynices' claim to Justice, declares that the
    curses of Oedipus are being fulfilled, and resolves to face his brother himself.
    The chorus repeatedly warns him against kin-slaying, pollution, Ate, Erinnys,
    and destructive divine forces, but Eteocles exits determined that Polynices will
    not escape destruction.
  language: English
  quote_policy: summarized
