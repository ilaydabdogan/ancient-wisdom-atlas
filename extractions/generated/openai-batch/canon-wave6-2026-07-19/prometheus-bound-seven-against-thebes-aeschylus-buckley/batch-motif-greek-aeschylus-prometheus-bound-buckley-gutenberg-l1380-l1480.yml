canonical_text:
  quote: ''
  summary: The passage introduces The Seven Against Thebes, lists dramatis personae
    and setting, then presents Eteocles addressing Theban citizens at the Acropolis.
    He urges defense of the city, altars, children, and motherland, cites augury from
    a bird-seer, and orders positions at gates and towers. A messenger reports that
    seven attacking chieftains have performed a bull-blood oath over a shield, cast
    lots for gates, and are advancing. Eteocles prays to divine powers not to destroy
    or enslave Thebes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editorial synopsis identifies the play with the siege of Thebes, seven
    Theban and Argive champions, the deaths of Polynices and Eteocles, mourning by
    Antigone and Ismene, and refusal of burial to Polynices against which Antigone
    protests.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dramatis personae include Eteocles, a messenger, a chorus of Theban virgins,
    Ismene, Antigone, and a herald; the scene is the Acropolis of Thebes in the early
    morning.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eteocles addresses the Citizens of Cadmus and compares the ruler's care of
    affairs to managing the helm on the poop of a state.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Eteocles says success would be caused by the gods, while mischance would be
    blamed on him, and invokes Jove as Averter for the Cadmaean city.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eteocles calls on men of different ages to support the city, the altars of
