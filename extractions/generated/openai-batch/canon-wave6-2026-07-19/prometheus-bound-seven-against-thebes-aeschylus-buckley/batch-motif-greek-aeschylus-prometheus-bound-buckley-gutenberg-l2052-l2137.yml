canonical_text:
  quote: ''
  summary: The chorus fears that the Erinnys, called forth by Oedipus' curse on his
    sons, is completing an old family doom rooted in Laius' defiance of Apollo's oracle.
    It recalls Oedipus' parricide, marriage, self-blinding, and curse that his sons
    divide their substance by the sword. A messenger then reports that the city has
    escaped servitude, but the two brother-princes have killed each other at the seventh
    gate, fulfilling the old imprecations.
  language: English
