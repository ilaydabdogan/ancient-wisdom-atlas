canonical_text:
  quote: ''
  summary: 'Editorial footnotes discuss Prometheus traditions and staging: Lucian''s
    dialogue, the Caucasus as punishment site, a ravine or chasm setting, Mercury''s
    role in Lucian, Io''s wanderings, Jove''s sole rule, Prometheus''s vulture torment,
    Hercules unbinding the fire-bringing Titan, and the narthex or fennel-stalk used
    in connection with stolen flame.'
  language: English
  quote_policy: summarized
