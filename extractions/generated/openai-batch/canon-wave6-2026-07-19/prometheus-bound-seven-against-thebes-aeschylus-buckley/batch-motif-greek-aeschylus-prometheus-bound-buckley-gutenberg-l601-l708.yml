  quote: ''
  summary: OC counsels Prometheus to restrain his speech under Jupiter's new rule
    and offers to seek his release; Prometheus warns OC away to avoid harm. Prometheus
    recalls Atlas bearing the pillar of heaven and earth, and Typhon defeated by Jupiter's
    fiery thunderbolt and lying beneath Aetna while Vulcan forges molten masses. OC
    departs on a winged quadruped, and the chorus laments Prometheus, saying many
    peoples mourn his sufferings.
