canonical_text:
  quote: Thou seest him that bestowed fire on mortals, Prometheus.
  summary: The Chorus reflects on Prometheus' suffering and on the weakness of mortals
    under Jupiter's order. Io enters, tormented by a hornet and by the pursuing Argus,
    and asks Prometheus about his bondage and her own afflictions. Prometheus identifies
    her as the daughter of Inachus, loved by Jupiter and hated by Juno, names himself
    as the giver of fire to mortals, and says he was bound by Jupiter's decree and
    Vulcan's hand. Io asks to know the end of her wanderings; Prometheus hesitates,
    while the Chorus asks first to hear Io's own account.
  language: English
  quote_policy: quoted
