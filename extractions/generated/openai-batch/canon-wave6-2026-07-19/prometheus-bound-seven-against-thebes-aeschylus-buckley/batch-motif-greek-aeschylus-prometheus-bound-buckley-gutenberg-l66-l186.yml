  summary: The passage is an introduction containing biographical notes on Aeschylus
    and a plot summary of Prometheus Bound. It describes Prometheus being chained
    to Scythian rocks for giving heavenly fire to mortals, his laments and account
    of benefits given to humanity, Ocean’s counsel, Io’s wandering and predicted divine
    child, a future archer-warrior who will free Prometheus and help bring down Jove,
    and Mercury’s unsuccessful interrogation followed by threatened storm and eagle
    torment.
  language: English
  quote_policy: quoted
