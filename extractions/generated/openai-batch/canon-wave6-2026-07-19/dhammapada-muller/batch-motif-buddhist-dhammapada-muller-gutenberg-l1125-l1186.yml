canonical_text:
  quote: ''
  summary: The passage teaches that the eightfold way is the best path and the only
    way to purify intelligence, make an end of pain, and reach Nirvana. Buddhas preach
    the way, but individuals must make their own effort. The verses stress impermanence,
    suffering, unreality of forms, restraint of body, speech, and mind, zeal for knowledge,
    cutting down lust and self-love, mindfulness of death, and the lack of help from
    kin when death seizes a person.
  language: English
  quote_policy: summarized
