canonical_text:
  quote: ''
  summary: Verses on old age contrast laughter with a burning world, urge seeking
    light amid darkness, describe the body as wounded, frail, corrupt, and mortal,
    and compare bones, chariots, oxen, herons, and bows to human decline. The speaker
    recounts many births while seeking the maker of the tabernacle, declares that
    the maker has been seen and the structure broken, and says the mind has reached
    extinction of desires.
  language: English
  quote_policy: summarized
