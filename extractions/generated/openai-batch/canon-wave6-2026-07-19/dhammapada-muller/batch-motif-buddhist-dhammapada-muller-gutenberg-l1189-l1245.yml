  quote: ''
  summary: Chapter XXI, verses 290-305 present didactic sayings on leaving lesser
    pleasure for greater, avoiding harm, disciplined watchfulness, a paradoxical statement
    about the true Brahmana, the wakefulness of Gotama's disciples, hardships of worldly
    and mendicant life, public esteem for virtue, the visibility of good people, and
    solitary self-subdual leading to the destruction of desires.
  language: English
  quote_policy: summarized
