canonical_text:
  quote: ''
  summary: The passage gives instructions on abandoning anger, pride, bondage, and
    attachment; compares control of anger to restraining a rolling chariot; commends
    truth, giving, non-injury, watchfulness, and control of body, tongue, and mind;
    and states that sages who strive after Nirvana will end suffering and passions.
    It also teaches Atula that blame and praise are unavoidable, while the blameless
    wise person is praised by discriminating people, gods, and Brahman.
  language: English
  quote_policy: summarized
