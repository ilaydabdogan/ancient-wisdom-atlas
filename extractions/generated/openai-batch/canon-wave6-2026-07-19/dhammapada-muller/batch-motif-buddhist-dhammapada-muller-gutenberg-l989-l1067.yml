  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Killing, lying, taking what is not given, adultery, and drinking intoxicants
    are named as acts by which a person digs up his own root.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who frets over food and drink given to others finds no rest, while
    one in whom that feeling is destroyed and taken out by the root finds rest by
