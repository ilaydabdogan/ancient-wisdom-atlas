canonical_text:
  quote: ''
  summary: Verses 235-255 admonish a person near death to prepare through wisdom and
    effort. The passage uses images of departure, journey, impurity, metal-refining,
    self-caused ruin, uprooted craving, and natural dangers for passions. It contrasts
    shameful and modest conduct, warns against moral offenses and greed, and closes
    by denying outward signs as true asceticism while describing Buddhas as free from
    vanity and unshaken.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressed person is compared to a sear leaf, is said to be near the messengers
    of death, to stand at the door of departure, and to lack provision for a journey.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is told to make himself an island, work hard, and be wise; when
    impurities are blown away and guilt is absent, entry into the heavenly world of
    the elect is promised.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: A parallel statement says that, after impurities are blown away and guilt
    is absent, the addressee will not enter again into birth and decay.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A wise man is instructed to remove impurities of the self gradually, compared
    to a smith removing impurities from silver little by little.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: An impurity that springs from iron is said to destroy the iron, and a transgressor’s
    own works are said to lead him to the evil path.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Several taints are listed, and ignorance is called the greatest taint; mendicants
    are told to throw off that taint and become taintless.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage contrasts an easy life for a shameless mischief-maker with a hard
