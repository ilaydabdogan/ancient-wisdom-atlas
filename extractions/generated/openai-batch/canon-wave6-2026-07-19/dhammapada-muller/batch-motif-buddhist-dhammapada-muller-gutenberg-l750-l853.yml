canonical_text:
  quote: ''
  summary: Verses instruct hearers to avoid evil, false doctrine, idleness, and worldly
    attachment; to practice virtue, liberality, restraint, patience, non-harm, meditation,
    and purification of mind; to view the world as unstable and deceptive; to understand
    Buddha, the Law, the Church, the four truths, and the eightfold way as the safe
    refuge; and to honor the awakened and their disciples, who have overcome evils
    and crossed sorrow.
  language: English
  quote_policy: summarized
