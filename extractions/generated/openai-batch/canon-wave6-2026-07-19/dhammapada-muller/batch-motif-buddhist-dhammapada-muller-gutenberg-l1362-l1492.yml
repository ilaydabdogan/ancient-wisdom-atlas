candidate_motifs:
- id: motif:1
  label: Craving as invasive growth that must be uprooted by knowledge
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly depicts thirst or passion through creeper, root, tree,
    grass, and sprouting imagery, and explicitly instructs cutting the root by knowledge.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The motif is expressed in didactic similes rather than in a narrative
    myth episode.
- id: motif:2
  label: Cycle of birth and decay driven by thirst
  taxonomy_refs:
  - death_rebirth
  basis: Thirst makes the thoughtless man run from life to life, men undergo birth
    and decay again and again, and the thirstless sage receives the last body.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:11
  - ev:13
  - ev:16
  confidence: high
  cautions: The passage gives doctrinal statements and images, not a plotted afterlife
    journey.
- id: motif:3
  label: Attachment as fetter cut by renunciant release
  taxonomy_refs:
  - departure
  basis: Fetters and bonds are stronger than material restraints when they consist
    of attachment; after cutting them, people leave the world free from cares, desires,
    and affection.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:12
  confidence: medium
  cautions: The departure is ethical and renunciant rather than a narrated heroic
    departure.
- id: motif:4
  label: Other shore as liberation from birth and decay
  taxonomy_refs:
  - mystical_quest
  basis: The passage tells the practitioner to go to the other shore of existence
    and says a free mind will not again enter birth and decay; the foolish are faulted
    for not looking for the other shore.
  evidence_refs:
  - ev:11
  - ev:16
  confidence: medium
  cautions: The text supplies an image of crossing but no detailed quest narrative
    or route.
- id: motif:5
  label: Sacred gift and reward around the law and purified recipients
  taxonomy_refs:
  - sacred_exchange
  basis: The gift of the law is said to exceed all gifts, and gifts bestowed on passionless,
    non-hating, non-vain, and lust-free recipients bring great reward.
  evidence_refs:
  - ev:15
  - ev:17
  confidence: medium
  cautions: The verses are ethical maxims about giving and reward, not an exchange
    story with named actors.
- id: motif:6
  label: Disciplined mendicant as embodiment of restraint and law
  taxonomy_refs:
  - wisdom
  basis: The Bhikshu is defined by restraint, control, calm wise speech, teaching
    and following the law, non-envy, purity, and lack of sloth.
  evidence_refs:
  - ev:18
  - ev:19
  - ev:20
  - ev:21
  - ev:22
  confidence: medium
  cautions: This is a character ideal in verse form rather than a discrete mythic
    episode.
