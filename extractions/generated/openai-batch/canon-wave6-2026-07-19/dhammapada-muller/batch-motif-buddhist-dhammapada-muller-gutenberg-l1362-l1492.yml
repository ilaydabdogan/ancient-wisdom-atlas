canonical_text:
  quote: ''
  summary: The passage presents verses on thirst or craving as a growing force that
    leads beings through repeated life, birth, decay, pain, and bondage. It uses images
    of creepers, roots, trees, grass, streams, waves, snares, fetters, and webs to
    describe attachment, and urges cutting or uprooting thirst through knowledge,
    passionlessness, the law, restraint, and mendicant discipline.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The thirst of a thoughtless man is said to grow like a creeper, and the man
    runs from life to life like a monkey seeking fruit in a forest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fierce thirst is described as full of poison and as increasing sufferings;
    overcoming it makes sufferings fall away like water-drops from a lotus leaf.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A speaker tells the assembled audience to dig up the root of thirst so that
    Mara may not crush them repeatedly like a stream crushing reeds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cut-down tree grows again if its root remains safe; similarly, pain returns
    again and again unless the feeders of thirst are destroyed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A misguided man with strong thirst running toward pleasure in thirty-six channels
    is carried away by waves identified with desires set on passion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The channels are said to run everywhere, the creeper of passion sprouts, and
    the reader is told to cut its root by knowledge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Men driven by thirst run about like snared hares, are held in fetters and
    bonds, and undergo pain for a long time again and again.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mendicant is told to drive out thirst by striving after passionlessness
    for himself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A man who has got rid of the forest of lust may run back to the forest of
    lust and into bondage.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wise people say attachment to precious stones, rings, sons, and a wife is
    a stronger fetter than one made of iron, wood, or hemp.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: After cutting the strong fetter, people leave the world free from cares, desires,
    and pleasures.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Those who are slaves to passions run down the stream of desires like a spider
    running down the web it has made itself.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The instruction says to give up what is before, behind, and in the middle
    when going to the other shore of existence; a mind altogether free will not again
    enter birth and decay.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Doubts, strong passions, and yearning for what is delightful make thirst grow
    and strengthen fetters; reflection on what is not delightful cuts the fetter of
    Mara.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: One without thirst and sin is said to have broken all the thorns of life and
    to have received his last body.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:16
  text: One without thirst and affection, who understands words and their interpretation,
    is called the great sage and the great man.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:17
  text: A first-person speaker says he has conquered all, knows all, is free from
    taint, has left all, and is free through the destruction of thirst.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: The gift, sweetness, and delight of the law are said to exceed other gifts,
    sweetnesses, and delights; the extinction of thirst overcomes all pain.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:19
  text: Pleasures destroy the foolish if they do not look for the other shore, and
    the foolish person destroys himself through thirst for pleasures.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:20
  text: Fields are damaged by weeds, while mankind is said to be damaged by passion,
