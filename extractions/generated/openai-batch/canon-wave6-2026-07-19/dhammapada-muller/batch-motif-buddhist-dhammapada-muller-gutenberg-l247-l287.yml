  quote: ''
  summary: Chapter III, verses 33-43 teach that thought or mind is difficult to control,
    should be straightened, tamed, guarded, and made firm. The passage compares thought
    to an arrow, a fish out of water, and a fortress; describes the body as fragile
    and soon lifeless; and contrasts the harm of a wrongly directed mind with the
    benefit of a well-directed mind.
