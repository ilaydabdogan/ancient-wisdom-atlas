canonical_text:
  quote: O Bhikshu, empty this boat!
  summary: The passage describes the disciplined Bhikshu and the true Brahmana/Arhat
    as figures who abandon passion, hatred, external status markers, and fetters through
    meditation, knowledge, restraint, nonviolence, and inward purity, thereby approaching
    or attaining Nirvana and the end of suffering.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A person who does not identify with name and form and does not grieve over
    what is gone is called a Bhikshu.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bhikshu who acts with kindness and is calm in the doctrine of Buddha is
    said to reach Nirvana, described as a quiet place, cessation of natural desires,
    and happiness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bhikshu is instructed to empty a boat; when emptied, it will go quickly,
    and cutting off passion and hatred leads to Nirvana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Bhikshu who cuts off, leaves, and rises above groups of five and escapes
    five fetters is called 'saved from the flood.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bhikshu is told to meditate, avoid heedlessness, and not direct thought
    toward pleasure, lest he swallow an iron ball in hell and cry out while burning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Knowledge and meditation are presented as mutually necessary, and one who
    has both is near Nirvana.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Bhikshu entering an empty house with tranquil mind feels more than human
    delight when seeing the law clearly and finds joy after considering the origin
    and destruction of bodily elements.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The beginning for a wise Bhikshu includes watchfulness over the senses, contentedness,
    restraint under the law, noble friends, charity, and fulfillment of duties, ending
    suffering.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men are told to shed passion and hatred as the Vassika plant sheds its withered
    flowers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A quiet Bhikshu is described as one whose body, tongue, and mind are quieted,
    who is collected, and who has rejected the baits of the world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Self is called the lord and refuge of self, and the practitioner is told to
    curb himself as a merchant curbs a good horse.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A young Bhikshu who applies himself to the doctrine of Buddha is said to brighten
    the world like the moon when free from clouds.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Brahmana is told to stop the stream and drive away desires; reaching the
