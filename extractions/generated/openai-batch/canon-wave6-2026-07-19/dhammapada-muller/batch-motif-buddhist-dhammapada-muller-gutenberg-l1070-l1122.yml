canonical_text:
  quote: ''
  summary: Didactic verses define the just person, learned person, supporter of the
    law, elder, respectable person, Samana, Bhikshu, Muni, and Ariya by discernment,
    law, restraint, compassion, quieting of evil, and extinction of desires rather
    than by outward signs, speech, age, ritual practice, or solitary discipline.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a man is not just if he carries a matter by violence; the
    just person distinguishes right and wrong and leads by law and equity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says talking much does not make a man learned; patience and freedom
    from hatred and fear are named as marks of being learned.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says a supporter of the law is not identified by much talking,
    but by seeing the law and not neglecting it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says grey hair and ripe age do not make a man an elder; truth,
    virtue, love, restraint, moderation, freedom from impurity, and wisdom do.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage contrasts envy, greed, dishonesty, much talking, and physical
    complexion with the destruction of these faults at the root and freedom from hatred.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says tonsure does not make an undisciplined false-speaking man
    a Samana; the one who quiets evil is called a Samana.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says asking others for alms alone does not make a man a Bhikshu;
    adopting the whole law, chastity, knowledge, and passing through the world above
    good and evil are associated with the Bhikshu.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says silence alone does not make a foolish or ignorant man a Muni;
    the wise person takes the balance, chooses good, avoids evil, and weighs both
    sides.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says a man is not Ariya because he injures living creatures; pity
    for all living creatures is given as the reason he is called Ariya.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says discipline, vows, much learning, trance, and sleeping alone
    are not sufficient by themselves for the happiness of release; a Bhikshu is warned
    not to be confident before attaining the extinction of desires.
  category: speech
  evidence_refs:
  - ev:10
