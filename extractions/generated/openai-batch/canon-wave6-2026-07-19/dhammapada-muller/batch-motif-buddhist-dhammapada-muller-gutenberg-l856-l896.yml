  quote: ''
  summary: The passage teaches happiness through freedom from hatred, greed, possessiveness,
    victory and defeat; describes passion, hatred, the body, and hunger as painful;
    names rest, Nirvana, health, contentment, trust, solitude, tranquillity, the law,
    and wise company as sources or forms of happiness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker exhorts living happily without hatred among those who hate, without
    ailments among the ailing, and without greed among the greedy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says to live happily while calling nothing one's own, and compares
    such people to bright gods feeding on happiness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Victory is said to breed hatred, the conquered is said to be unhappy, and
    the one who gives up both victory and defeat is called contented and happy.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Passion is compared to fire, hatred to a losing throw, the body to pain, and
    rest is called the highest happiness.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hunger is called the worst disease and the body the greatest pain; true knowledge
    of this is identified with Nirvana, the highest happiness.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Health, contentedness, trust, and Nirvana are named respectively as the greatest
    gift, best riches, best relationship, and highest happiness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: One who tastes solitude and tranquillity, and drinks in the law, is described
    as free from fear and sin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sight and company of the elect are called good and happy; the company
    of fools is painful; the company of the wise is pleasurable; one is told to follow
    the wise as the moon follows the path of the stars.
  category: speech
  evidence_refs:
  - ev:6
