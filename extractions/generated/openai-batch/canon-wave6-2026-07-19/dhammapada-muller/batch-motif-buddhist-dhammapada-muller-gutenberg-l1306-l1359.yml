canonical_text:
  quote: ''
  summary: Dhammapada Chapter XXIII uses elephant analogies to teach endurance, self-taming,
    control of the mind, escape from the evil way, prudent companionship or solitude,
    and concludes with verses praising friends, good works, family and religious states,
    virtue, faith, intelligence, and avoiding sin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he will silently endure abuse as an elephant in battle endures
    an arrow from a bow.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a tamed elephant is led to battle and mounted by a king,
    and that the person who silently endures abuse is the best among men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mules, noble Sindhu horses, and large-tusked elephants are called good if
    tamed, but the one who tames himself is said to be better.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says no man reaches the untrodden country, identified as Nirvana,
    by means of those animals; a tamed man goes there on his own well-tamed self.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The elephant Dhanapalaka is named as bound, difficult to hold, having temples
    running with sap, refusing food, and longing for the elephant grove.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A fat, great-eating, sleepy fool who rolls about is compared to a hog fed
    on wash and is said to be born again and again.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker says his mind formerly wandered as it pleased, but that he will
    now hold it in like a rider holding in a furious elephant with a hook.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage instructs its audience not to be thoughtless, to watch their thoughts,
    and to draw themselves out of the evil way like an elephant sunk in mud.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage advises walking with a prudent, wise, sober companion if such
    a companion is found, and walking alone if no such companion is found.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Solitary walking is compared to a king who has left a conquered country behind
    and to an elephant in the forest.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Friends on an occasion, enjoyment, good work in the hour of death, giving
    up grief, the states of mother, father, Samana, and Brahmana, lasting virtue,
    rooted faith, intelligence, and avoiding sins are called pleasant.
  category: attribute
  evidence_refs:
  - ev:6
