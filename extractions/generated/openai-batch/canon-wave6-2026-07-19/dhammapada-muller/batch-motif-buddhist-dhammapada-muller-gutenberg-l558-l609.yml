canonical_text:
  quote: ''
  summary: Chapter IX, verses 116-128, gives ethical admonitions about hastening toward
    good, avoiding evil, the delayed ripening of deeds, accumulation of good or evil
    by small acts, analogies for avoiding harm, the recoil of evil upon the offender,
    postmortem destinies, and the impossibility of escaping evil deeds or death anywhere
    in the world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man is instructed to hasten toward good and keep his thought away from evil;
    slothful pursuit of good allows the mind to delight in evil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Repeated sin is discouraged and repeated good action is encouraged; pain is
    stated as the outcome of evil and happiness as the outcome of good.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: An evil-doer may see happiness before an evil deed has ripened, and a good
    man may see evil days before a good deed has ripened.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Water-drops filling a water-pot are used as an analogy for the fool becoming
    full of evil and the wise man becoming full of good little by little.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Evil deeds are to be avoided as a merchant carrying much wealth with few companions
    avoids a dangerous road, and as a man who loves life avoids poison.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A hand without a wound may touch poison without being affected; the passage
    compares this to the absence of evil for one who does not commit evil.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man offends a harmless, pure, innocent person, the evil falls back on
