  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A question asks who will overcome earth, the world of Yama, and the world
    of the gods, and who will find the path of virtue; the answer given is the disciple.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body is compared to froth and to a mirage; one who knows this is said
    to break Mara’s flower-pointed arrow and not see the king of death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Death is described as carrying off or subduing a distracted man who is gathering
    flowers before he is satisfied in his pleasures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A flood carrying off a sleeping village is used as a comparison for death
    carrying off the distracted flower-gatherer.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bee is said to collect nectar and depart without injuring the flower, its
    colour, or its scent; this is presented as a model for how a sage should dwell
    in a village.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A sage is instructed to attend to his own misdeeds and negligences rather
    than the perversities and sins of others.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fine words without corresponding action are compared to a beautiful flower
    without scent, while fine words with corresponding action are compared to a beautiful
    flower with scent.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Many wreaths can be made from a heap of flowers, and many good things may
    be achieved by a mortal once born.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ordinary floral and fragrant scents are contrasted with the odour or perfume
    of virtue, which is said to travel against the wind, pervade every place, and
    rise to the gods.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mara is said not to find the way to people who possess virtues, live without
    thoughtlessness, and are emancipated through true knowledge.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A lily growing sweetly on a heap of rubbish by the highway is compared to
    the disciple of the enlightened Buddha shining by knowledge among people who walk
    in darkness.
  category: relationship
  evidence_refs:
  - ev:10
