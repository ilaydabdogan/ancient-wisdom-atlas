  quote: ''
  summary: The passage uses flower, scent, bee, flood, froth, mirage, and lily imagery
    to describe the disciple’s discovery of the path of virtue, the overcoming of
    Mara and death through knowledge, the danger of distracted pleasure-seeking, the
    conduct of a sage, the relation between words and deeds, and the superior reach
    of virtue and knowledge.
