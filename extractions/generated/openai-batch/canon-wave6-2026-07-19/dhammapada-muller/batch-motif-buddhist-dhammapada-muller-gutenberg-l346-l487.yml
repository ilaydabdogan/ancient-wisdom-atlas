  quote: ''
  summary: Verses contrast the fool, wise person, renunciant disciple, and liberated
    Arhat. They describe foolish attachment to wealth, family, reputation, and evil
    deeds; wise companionship, self-discipline, and serenity; the renunciant road
    to Nirvana; crossing beyond the dominion of death; and the Arhat’s freedom, trackless
    path, subdued senses, and cessation of rebirth.
