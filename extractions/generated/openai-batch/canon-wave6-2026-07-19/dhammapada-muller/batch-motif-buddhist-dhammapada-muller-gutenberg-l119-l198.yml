literal_observations:
- id: obs:1
  text: The passage states that what a person is results from thought; evil thought
    in speech or action is followed by pain, and pure thought in speech or action
    is followed by happiness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who harbor thoughts of abuse, beating, defeat, and robbery do not see
    hatred cease; those who do not harbor such thoughts see hatred cease, and the
    passage says hatred ceases by love rather than hatred.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that those who know all must come to an end here have their
    quarrels cease at once.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who seeks pleasures, lacks sense-control, is immoderate in food,
    idle, and weak is said to be overthrown by Mara like a weak tree thrown down by
    wind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person who does not seek pleasures, controls the senses, is moderate in
    food, faithful, and strong is said not to be overthrown by Mara, as a rocky mountain
    is not thrown down by wind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage contrasts one who is unworthy of the yellow dress because he has
    not cleansed himself from sin with one who is worthy because he is cleansed, virtuous,
    and attentive to temperance and truth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage contrasts people who imagine truth in untruth and untruth in truth
    with people who know truth as truth and untruth as untruth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Passion is compared to rain breaking through an ill-thatched house when the
    mind is unreflecting, and not breaking through a well-thatched house when the
    mind is well-reflecting.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The evil-doer mourns and suffers in this world and the next, while the virtuous
    man delights and is happy in this world and the next.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage contrasts a thoughtless reciter who does not do the law with a
    follower of the law who recites little but forsakes passion, hatred, and foolishness
    and possesses true knowledge and serenity of mind.
  category: relationship
  evidence_refs:
  - ev:9
