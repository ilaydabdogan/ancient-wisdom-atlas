canonical_text:
  quote: ''
  summary: The verses contrast vanity and pleasure with meditation, advise freedom
    from attachment and aversion, state that pleasure and related cravings produce
    grief and fear, praise virtue and truthfulness, describe one desiring Nirvana
    as carried upward by a stream, and compare good works receiving a good person
    who goes to the other world with kinsmen greeting a safe returnee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who gives himself to vanity, neglects meditation, forgets the real
    aim of life, and grasps at pleasure will later envy one who has exerted himself
    in meditation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage instructs that no one should look for what is pleasant or unpleasant,
    and it calls both absence of the pleasant and sight of the unpleasant painful.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that loss of the beloved is evil and that those who love
    nothing and hate nothing have no fetters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pleasure, affection, lust, love, and greed are each named as sources of grief
    and fear; freedom from each is linked with knowing neither grief nor fear.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person possessing virtue and intelligence, being just, speaking truth, and
    doing his own business is said to be held dear by the world.
