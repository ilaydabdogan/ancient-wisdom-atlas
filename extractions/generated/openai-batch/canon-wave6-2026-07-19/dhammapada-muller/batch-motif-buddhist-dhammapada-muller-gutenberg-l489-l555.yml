canonical_text:
  quote: ''
  summary: The passage praises the person who has renounced ties and desires, describes
    places of Arhanta and forests as delightful to the passionless, and then presents
    maxims contrasting meaningful words, self-conquest, homage to the wise, reverence
    for elders, and brief virtuous insight with large quantities of senseless speech,
    external conquest, sacrifice, and long unwise life.
  language: English
  quote_policy: summarized
