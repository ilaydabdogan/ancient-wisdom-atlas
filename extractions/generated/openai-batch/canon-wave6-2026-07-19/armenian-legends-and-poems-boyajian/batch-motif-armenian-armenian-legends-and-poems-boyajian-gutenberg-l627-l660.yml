  summary: A maiden asks a huntsman whether he has seen her lover, whom she likens
    to a wild deer. The huntsman reports that he saw the lover in the hills, adorned
    in red and green, with a rose tree growing on his breast where her kiss had been.
    When she asks who tends him as bride, the huntsman says the lover lies with his
    head on a stone and a bullet in his heart, while the mountain breeze moves his
    hair and blossoms weep over him.
