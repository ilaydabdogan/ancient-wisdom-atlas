  summary: 'The passage describes the Armenian Bible translation as foundational for
    Armenian Christianity and as read by Armenians as a symbolic history of their
    own country, including associations with Armenia, Ararat, the Flood, and national
    heroes such as Haik and Vahagn. It explicitly compares Moses leading his people
    from bondage to freedom with Haik, and notes broader parallels between biblical
    oppression-and-revolt stories and Armenian history. The passage then surveys the
    fourth- and fifth-century Armenian intellectual movement: Nerses the Great’s institutions,
    Vramshapuh’s patronage, St. Sahak and St. Mesrop’s leadership, the new alphabet,
    translation activity, schools, literature, and the end of Arsacid political independence.'
