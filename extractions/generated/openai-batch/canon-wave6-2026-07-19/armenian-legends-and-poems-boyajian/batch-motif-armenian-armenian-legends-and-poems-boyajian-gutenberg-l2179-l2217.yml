canonical_text:
  quote: ''
  summary: An English folk song in which the Hawk asks why the Dove weeps. The Dove
    laments that spring is gone, autumn has arrived, streams have ceased, leaves and
    flowers are dead, birds are silent, and she fears for her babies' food. The Hawk
    tells her not to weep, promises that spring will return, and offers to carry her
    to high trees and mountains to make a nest-like dwelling. The song ends with autumn
    giving way to spring, flowing rills, flowers, birdsong, lambs, and a call to God
    for love and care.
