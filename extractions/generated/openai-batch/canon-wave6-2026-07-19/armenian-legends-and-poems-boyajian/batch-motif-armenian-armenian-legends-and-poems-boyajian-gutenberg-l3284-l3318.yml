canonical_text:
  quote: ''
  summary: A dead speaker tells a lady that, while alive, she was overcome by love
    and intended to love a knight, but death came before this could be achieved. She
    says her good will has relieved her enough that Love permits her to wear a bridle,
    and she asks the lady to warn others not to be idle in love. The speaker suddenly
    vanishes from the lady's sight. Frightened, the lady says she is in the same case,
    resolves to amend if she lives, goes home, changes her first intent, and swears
    she will bear no halters.
  language: Middle English
  quote_policy: summarized
