  quote: ''
  summary: The passage contains two English-translated Armenian poems. In “Incense,”
    incense burns in a church censer, rises as fragrance through cleansing fire, and
    is compared to a woman’s anguished heart that must be melted and cleansed. In
    “The Little Lake,” a speaker addresses a lonely lake as friend and queen, compares
    his inner wounds and thoughts to the lake’s waves and foam, contrasts the lake
    with his restless fiery soul, and laments rejection and being unread by others.
