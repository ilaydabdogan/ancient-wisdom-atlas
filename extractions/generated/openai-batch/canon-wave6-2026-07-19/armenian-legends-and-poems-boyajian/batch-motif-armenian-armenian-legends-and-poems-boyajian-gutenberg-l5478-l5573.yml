literal_observations:
- id: obs:1
  text: From 432 onward, much of Armenia was governed by Persian satraps, and the
    Persians feared that Armenian Christianity strengthened ties with the Greeks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Persians aimed to eradicate Christianity in Armenia and to enforce Zoroastrianism.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: With no Armenian king, many princes and nobles formed an army, the people
    served as volunteers, and a small party led by Prince Vasak Suni was inclined
    toward Persian proposals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The first religious war of 451 is called Vardanantz after Vardan Manikomian,
    the commander-in-chief and moving force of the Armenian army of defense.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vardan Manikomian fell in the battle of Avarair, and the passage says his
    fame survived and that he is among the most beloved Armenian heroes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The war did not restore Armenian political independence, but it convinced
    the Persians that the religion of the Armenian people could not be uprooted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a second religious war, Armenian princes resisted, and the Persians eventually
    appointed an Armenian satrap and proclaimed religious liberty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Chief of the Magi was sent to convert Armenians to Mazdiism, returned
    unsuccessful, and reported that Mazdiism could not be established in Armenia even
    with the aid of immortals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Although Vardan and his followers perished and the Armenians apparently lost
    the battle, the passage describes the result as the triumph of religious freedom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The battle of Vardan is described as a national triumph that is still annually
    commemorated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: After Armenia ceased to be independent, its literature became more religious,
    and Christianity introduced church hymns and chants called sharakans.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sharakans were written in metre for singing, and the Armenian word sharakan
