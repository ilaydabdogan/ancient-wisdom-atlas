  summary: The passage describes ancient Armenian funeral laments and mourning customs,
    including professional mourners, singing maidens, the structure of dirges, and
    the grave as the dead person's new dwelling. It then surveys pre-Christian Armenian
    literature, temple histories, priestly chroniclers, historical songs, lost works,
    and early Armenian drama, with a brief comparison to a Hindu belief about drama's
    divine origin.
