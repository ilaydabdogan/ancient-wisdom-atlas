canonical_text:
  quote: ''
  summary: The passage summarizes the authority and criticism of Moses of Khorene's
    History of Armenia, recounts the story that Wargharshak sent Mar-Abas-Katina to
    obtain archival information about Armenia's earlier rulers and noble families,
    and explains that Mar-Abas copied an ancient Armenian history from a book in the
    library at Nineveh. It then notes critical doubts about this source tradition
    and concludes with a brief account of Armenia's adoption of Christianity and the
    treaty between Tiridates and Constantine.
  language: English
