canonical_text:
  quote: ''
  summary: 'The passage first describes the Christ-child through images of leaves,
    roses, pearls, sea-depth, pomegranate grains, and lilies. It then opens Raffi’s
    “The Castle of Anoush”: a barren crag stands by the road from Tisbon to Ecbatana;
    Farhat, a Persian sculptor, sees the daughter of the Arian King, becomes lovesick,
    and is told that he may win her by carving palaces, treasuries, and stables out
    of the rock. After years of labor he creates a decorated rock palace with reliefs
    of Iranian heroes, kings, and divine ancestry. She praises it but demands fountains
    and trees before fulfillment.'
  language: English
  quote_policy: summarized
