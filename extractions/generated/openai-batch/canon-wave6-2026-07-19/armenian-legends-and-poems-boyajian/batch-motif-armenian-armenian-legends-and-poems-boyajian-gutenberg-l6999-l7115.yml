canonical_text:
  quote: ''
  summary: The passage recounts Sayat Nova’s renunciation in response to hopeless
    love, his monastic seclusion, a disguised departure to win a minstrel contest
    in Tiflis, and his martyrdom after refusing forced conversion. It then surveys
    Armenian medieval poetry, including pagan heroic themes, Christian religious poetry,
    influence from Persian and Arabic poetry, attitudes toward women and marriage,
    celibate clerics composing love poetry, a folk song about a girl, a youth, a mother,
    and a rose tree, and divisions of Armenian devotional poetry.
  language: English
  quote_policy: summarized
