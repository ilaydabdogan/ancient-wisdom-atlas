canonical_text:
  quote: ''
  summary: The passage describes the Christianization of Armenia as a rupture with
    ancestral beliefs, the suppression and partial survival of pagan songs and folklore,
    early Armenian contact with Greek and Syriac Christian learning, the invention
    of the Armenian alphabet, the separation of the Armenian Church from the Greek
    Church, and the role of Mesrop and Sahak in Armenian literacy and Bible translation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The adoption of Christianity is described as a revolution in Armenian views
    of life and as a severance from ancestral beliefs, though traces of those beliefs
    remained in folklore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Christian clergy regarded the old beliefs and related folklore as a harmful
    growth from paganism.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The clergy and Christian authorities are described as pulling down temples,
    building churches in their place, breaking images and monuments, destroying heathen
    books and records, and turning pagan festivals into Christian festivals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Laws were made against the use and singing of pagan songs, but Armenians are
    said to have longed for those songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Vasak Suni had books of pagan songs copied and distributed to attract people
    back to heathenism; after Christianity finally triumphed, those books were destroyed,
    though echoes of the songs survived later.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Gregory the Illuminator is presented as the converter of Armenia to Christianity
    and as a member of the Arsacid royal race with Hellenising tendencies.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: In early Christian Armenia, the Bible was read in Greek in north-western provinces
    and Syriac in south-eastern provinces; schools educated youths on Christian principles,
    and about one hundred pupils were sent abroad for Greek learning.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The youths educated abroad brought back some Greek culture, which the passage
    connects with the rise of the Golden Age of Armenian literature.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Greek Empire is said to have sought ecclesiastical and political ascendancy
    over Armenia, while Armenian Church and intellectual leaders sought religious
    and national independence.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'Two steps toward Armenian religious and national independence are identified:
    the invention of the Armenian alphabet in 404 and the separation of the Armenian
    Church from the Greek Church in 491.'
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Armenian language is described as Indo-European, independent in character,
