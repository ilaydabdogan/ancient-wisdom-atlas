  summary: A folk-song speaker laments that her lover has gone over the mountains
    to fight. She searches for him in the meadows, recalls that he left without farewell,
    compares his brief passing to a sweet fragrance, says they will not meet again,
    and asks Sourb Carapet to bless his way.
