canonical_text:
  quote: ''
  summary: The supplied passage contains three lyric sections. In “The Tears of Araxes,”
    a speaker addresses the personified River Araxes, who replies as a grieving Armenian
    mother and widow, recalls former splendor, refuses to benefit hostile outsiders,
    laments the exile of her sons, and winds sorrowfully toward the sea. In “The Eve
    of Ascension Day,” night, Earth, waters, rocks, flowers, and forests are personified
    in a charged nocturnal landscape awaiting heavenly showers and union. In “Thy
    Voice Is Sweet,” a lover praises the beloved through images of flowers, jewels,
    sun, pilgrimage, shrine, seed, wound, and death by love.
  language: English
  quote_policy: summarized
