  summary: A folk song presents a fox entering a mill, raising its paws and dancing,
    grinding and carrying away corn, eating village chickens, trampling upland cornfields,
    and lying stretched out. A speaker then says sable and fox will be caught in fall
    to make a match for the speaker's son, but laments that no price was made and
    Hovhannes remained unmarried.
