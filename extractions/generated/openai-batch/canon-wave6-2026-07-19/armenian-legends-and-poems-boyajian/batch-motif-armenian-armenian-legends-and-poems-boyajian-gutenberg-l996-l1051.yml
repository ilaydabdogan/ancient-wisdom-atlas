canonical_text:
  quote: ''
  summary: The passage recounts Semiramis hearing of Ara the Beautiful, sending gifts
    and offers, then invading Armenia after Ara refuses her. Ara is killed in battle
    despite her wish to preserve him. Semiramis searches for his body, claims the
    gods will lick his wounds and restore him, attempts magical revival, conceals
    the decaying body in a pit, substitutes a secretly dressed man as the revived
    Ara, promotes worship of the gods with a statue and sacrifices, stops Armenian
    resistance, and appoints Ara’s twelve-year-old son by Nouvart as ruler under the
    name Ara.
  language: English
  quote_policy: summarized
