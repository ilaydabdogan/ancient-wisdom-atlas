    to his birthplace, Ashdarag, and to his father’s house. He describes his father
    waiting vainly for his only son, asks the bird to convey greetings and news of
    his suffering, and portrays himself as impoverished, sleepless, tearful, and like
    a flower uprooted from native soil.
