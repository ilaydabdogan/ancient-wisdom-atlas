  summary: The passage summarizes Armenian epic material preserved by Moses of Khorene,
    including Sharezer and Adramelech, the founding of Sassoon, oral transmission
    of an epic, and ancient songs from Goghtan. It then discusses the birth-song of
    Vahagn as a dawn and fire myth, compares Vahagn with Rig-Vedic Agni and with Hercules
    in translation usage, notes Vahagn’s worship and dragon-fighting traditions, and
    describes the parallelism and diction of ancient Armenian verse.
  language: English
