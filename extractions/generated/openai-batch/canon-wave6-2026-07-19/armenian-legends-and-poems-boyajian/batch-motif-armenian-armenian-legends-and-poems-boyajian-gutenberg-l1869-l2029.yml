canonical_text:
  quote: "“My Rose is gone and I am desolate.”"
  summary: A personified Nightingale laments the disappearance of the Rose, questions
    the garden, flowers, and birds, receives reassurance from the gardener, writes
    to the Rose’s court, and finally hears that the Rose will return after delay.
    Seasonal signs and abundant blossoms appear, and at last the Rose reappears hidden
    in a silken screen while the flowers worship her.
  language: English
  quote_policy: quoted
