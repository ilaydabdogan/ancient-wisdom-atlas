candidate_motifs:
- id: motif:1
  label: Edenic vine as immortal and sacred drink
  taxonomy_refs: []
  basis: The vine is said to come from Eden by the Creator’s care, to seem like the
    fruit of immortality, to have been brought to Noah by angels, and to be used in
    the sacred cup at Mass.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage praises vine and wine in Christian and biblical language,
    but it does not explicitly define a formal mythic cycle.
- id: motif:2
  label: Miraculous healing and liberation by drink
  taxonomy_refs: []
  basis: The poem attributes to wine the ability to soften a ruler’s anger, free a
    banned man, give sight to the blind, and give speech to the dumb.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The effects are poetic praise and may be hyperbolic rather than a narrative
    miracle episode.
- id: motif:3
  label: Ritual indispensability of wine
  taxonomy_refs: []
  basis: The poem says wine is raised by the priest in the sacred cup and that no
    Mass or service can occur where it is absent.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage describes Christian liturgical use, not a full mythic narrative.
- id: motif:4
  label: Initiation through fasting and pilgrimage
  taxonomy_refs:
  - initiation
  basis: A person aspiring to become an ashough first fasts for seven weeks and then
    goes to Sourb Karapet monastery to acquire the art.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The text describes a professional-sacred preparation pattern rather than
    an ordeal-filled narrative initiation.
- id: motif:5
  label: Patron saint of minstrels
  taxonomy_refs: []
  basis: Sourb Karapet, identified as John the Baptist, is named as patron saint of
    Armenian minstrels.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the patron relationship but not an origin legend for
    it.
- id: motif:6
  label: Lover as pilgrim-minstrel
  taxonomy_refs: []
  basis: Sayat Nova, after ten years of wooing as a prince, resolves to court the
    beloved for seven years as a pilgrim-minstrel.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The beloved is a lady-love in the passage; no divine status should be
    inferred.
- id: motif:7
  label: Love as sea and self as small vessel
  taxonomy_refs: []
  basis: Sayat Nova explicitly describes his love as a sea and himself as a little
    barque floating on it.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This is a poetic image within literary commentary, not an independent
    mythic episode.
- id: motif:8
  label: Beloved as unavailable healer
  taxonomy_refs: []
  basis: Sayat Nova contrasts the physician’s ineffective ointment with the beloved’s
    different medicine, while she says she has no remedy for him.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The healing language is metaphorical in a love poem context.
