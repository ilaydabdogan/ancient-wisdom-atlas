canonical_text:
  quote: "“To us on earth you seem to be / The fruit of immortality.”"
  summary: The passage first gives a praise-poem to the vine and wine, describing
    its beauty, Edenic origin, connection with Noah, transformation through the wine-press,
    power to gladden rulers, heal or loosen speech, and serve in the sacred cup at
    Mass. It then summarizes Armenian literary history, the Mekhitarist Brotherhood,
    Byron’s Armenian studies, the social and ritual role of ashough minstrels, the
    seven-week fast and pilgrimage associated with becoming an ashough, and Sayat
    Nova’s intense love-poetry, including images of love as a sea and the lover as
    a small barque.
  language: English
  quote_policy: quoted
