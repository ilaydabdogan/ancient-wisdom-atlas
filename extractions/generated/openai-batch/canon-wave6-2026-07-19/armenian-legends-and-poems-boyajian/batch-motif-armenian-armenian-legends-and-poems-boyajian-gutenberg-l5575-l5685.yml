canonical_text:
  quote: ''
  summary: The passage describes Armenian hymns, folksongs, folktales, riddles, proverbs,
    and charm-verses. It notes mystical and devotional qualities in hymns, possible
    pagan musical survivals in Christian hymn tunes, the youngest child as folktale
    hero or heroine, a riddle-based courtship custom, and an Ascension Eve fortune-telling
    practice in which maidens use a flower-filled bowl, tokens, water from seven springs,
    prayer, moonlight, and charm-songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Armenian hymns are described as picturesque, richly colored, vivid, tender,
    hopeful, devotional, and sometimes mystical, especially in the works of Gregory
    of Narek.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Armenian hymn tunes are described as unique and independent of those of other
    Christian nations, with a rhythm said to recall singers around pagan altars; the
    passage says some pagan melodies may have entered Christian Armenian hymn tunes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A composer describes Armenian folksong melodies as ethereal waves that call
    up an image of enchanting mermaids dancing by lakes, poising on waters, and alluring
    pagan Armenians and minstrels.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says unwritten Armenian literature includes folktales, fables,
    and proverbs, and that in folktales the youngest child is the hero or heroine.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: An ancient and partly retained custom has a man meet the girl he wishes to
    marry on the bank of a stream or in a forest and ask her a riddle; if she answers
    correctly, he marries her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Example riddles identify the heart as unwritable paper, language as the pen
    writing on the heart, snow as a winter rose, and the sun and moon as a brother
    and sister who chase without catching each other.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Charm-verses are used by young girls for fortune-telling and are associated
    with an extensive literature.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the Eve of Ascension Day, fortune-seeking maidens decorate a bowl with
    selected flowers, cast tokens into it, fill it with flowers of seven kinds and
    water from seven springs, cover it with an embroidered cloth, take it to a priest
    for prayer, and leave it overnight in moonlight and open to the stars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At daybreak the maidens carry the bowl outside the village to a spring, the
    foot of a mountain, or an open field, gathering flowers and adorning themselves
    on the way.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A veiled little girl who does not know the token owners draws the articles
    from the bowl one by one while a charm-song is recited; each token owner accepts
    the accompanying song as her fortune.
  category: sequence
  evidence_refs:
  - ev:7
