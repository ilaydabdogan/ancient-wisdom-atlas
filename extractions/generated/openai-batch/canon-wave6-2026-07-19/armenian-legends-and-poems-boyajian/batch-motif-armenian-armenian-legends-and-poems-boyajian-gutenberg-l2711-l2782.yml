canonical_text:
  quote: And thus they loved, though never side by side
  summary: The poem personifies Sky and Mother Earth as separated lovers. Sky gazes
    down at Earth, Earth awakens from winter into spring, and their longing is expressed
    through stars, waters, dew, mountains, clouds, moonlight, song, and a secret kiss.
    The Moon witnesses the exchange and tells the Poet, who feels jealous sorrow and
    wishes for such love.
  language: English
  quote_policy: quoted
