  summary: The preface presents the anthology as a memorial to Armenia, explains its
    limited scope and translation aims, describes its visual scheme as based on ancient
    Armenian art, invokes the Armenian Muses as keepers of indestructible treasures,
    thanks contributors and permission-grantors, and states that proceeds will go
    to the Armenian Fund.
