canonical_text:
  quote: ''
  summary: 'The passage gives anthology commentary and excerpts concerning Armenian
    poets and themes: Grigoris of Aghtamar as a poet of love, beauty, the Nightingale,
    and the Rose; a summary of his poem in which a Gardener is summoned from his garden
    by Death and the abandoned garden becomes desolate; descriptive imagery for a
    lady-love; the Rose and Nightingale theme, identified as Persian in origin but
    given Armenian emphases of refinement, deference, continuity, and faithfulness
    in love; comments on Nahapet Kouchak; Arakel Sunetzi’s Book of Adam as a romance-like
    Fall narrative; Adam’s divided loyalty between Eve and the Creator; stanzas from
    The Rib; and a resurrection vision with opened tombs, renewed earth and heavens,
    the Holy Rood, hosts of fire, angels, and butterflies.'
  language: English
  quote_policy: summarized
