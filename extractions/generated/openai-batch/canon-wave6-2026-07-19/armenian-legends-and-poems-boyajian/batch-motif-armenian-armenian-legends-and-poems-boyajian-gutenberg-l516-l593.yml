canonical_text:
  quote: On the bosom of my love / May I live and die forever!
  summary: An anonymous English-translated Armenian lyric in which a first-person
    lover encounters his beloved at night, enters her gated home, receives dewed roses,
    rests in her arms, laments a departed falcon, describes love as illness and thirst,
    asks for an apple and intimate entry of the beloved into his heart, and imagines
    a garment for her made from celestial and natural materials.
  language: English
  quote_policy: quoted
