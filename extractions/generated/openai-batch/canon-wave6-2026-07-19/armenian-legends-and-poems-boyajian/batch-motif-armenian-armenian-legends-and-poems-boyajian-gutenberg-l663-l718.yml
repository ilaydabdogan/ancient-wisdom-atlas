canonical_text:
  quote: When the God of Liberty / Formed of earth this mortal frame, / Breathed the
    breath of life in me
  summary: A first-person speaker says the God of Liberty formed and animated him.
    As a bound infant, he reached for Liberty, begged his mother to free him, and
    vowed to love Liberty. His first spoken word is Liberty. A voice of Doom from
    above asks whether he will swear to serve and love Liberty until the tomb and
    warns him of trials. The speaker replies that he will proclaim Liberty through
    danger, foes, death, gallows, and the tomb.
  language: English
  quote_policy: quoted
