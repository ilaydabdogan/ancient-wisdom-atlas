canonical_text:
  quote: ''
  summary: The poem praises Santoukhd, the king’s daughter, as a new lily of Shavarshan
    and a radiant Armenian maiden. Her beauty is compared with flowers, stars, and
    light; nature and earthly rulers respond to her. Foreign princes desire her, while
    the Sky and Ocean speak of honoring her, but a greater King is said to claim her
    alone. She is then slain by a sword, her blood and body are imaged as roses, lilies,
    violets, and fire, and the maidens are told to lay her corpse in the tomb with
    Thaddeus in Armenian soil.
  language: English
  quote_policy: summarized
