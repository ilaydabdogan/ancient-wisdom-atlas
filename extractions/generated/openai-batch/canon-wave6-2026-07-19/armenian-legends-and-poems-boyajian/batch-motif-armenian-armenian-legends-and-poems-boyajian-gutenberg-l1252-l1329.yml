canonical_text:
  quote: It is needful that we build for ourselves a city and palaces
  summary: In this excerpt attributed to Moses of Khorene, Semiramis sees a favorable
    Armenian site near pure waters, decides to build a seasonal city and palaces,
    commands large groups of laborers and artisans to construct dykes, ramparts, streets,
    baths, gardens, and palaces, and creates a mysterious fortified Royal Palace with
    rock-cut structures and inscriptions.
  language: English
  quote_policy: quoted
