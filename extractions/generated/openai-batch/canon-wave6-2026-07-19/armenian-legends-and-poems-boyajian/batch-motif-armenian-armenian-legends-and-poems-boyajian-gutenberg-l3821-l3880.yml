canonical_text:
  quote: ''
  summary: A master builder, later identified as Farhat, creates a rock-hewn palace
    and garden supplied by diverted underground water for Anoush. A peasant tells
    him that Anoush has married the King after seven days and nights of wedding celebration.
    Farhat, despairing, throws a hammer into the air; it falls on his head and kills
    him. The fortress keeps Anoush’s name and later becomes a place where Persian
    kings imprison captive Armenian kings.
  language: English
