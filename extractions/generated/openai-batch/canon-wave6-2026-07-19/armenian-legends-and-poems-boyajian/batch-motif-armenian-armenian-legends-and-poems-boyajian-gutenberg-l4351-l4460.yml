comparison_claims:
- id: claim:1
  claim: The passage explicitly links Haik with the Greek Orion as a great hunter
    and notes that Armenian biblical passages use Haik where English has Orion as
    a constellation name.
  claim_level: same_function
  target: Greek Orion / Orion constellation in Job and Isaiah
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports functional and naming association only; it does
    not establish historical contact or shared origin.
- id: claim:2
  claim: The passage explicitly says Tork’s act of hurling huge rocks at enemy ships
    and sinking them recalls the Cyclops Polyphemus in the Odyssey.
  claim_level: same_motif
  target: Cyclops Polyphemus in the Odyssey
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the rock-hurling-at-ships incident; no
    broader narrative equivalence is described.
