canonical_text:
  quote: ''
  summary: 'The passage surveys Armenian epic traditions as reported by Moses of Khorene:
    recognition of good and evil spirits; divine descent of heroes; a fragment on
    former gods, giants, tower-building, divine wrath, wind, and confused speech;
    accounts of Haik, Belus, Armenak, Aramais, Shara, Amasa, Tork, Aram, Ara the Beautiful,
    and Semiramis; etiological naming of lands, towns, rivers, and mountains; explicit
    comparisons of Haik with Orion and Tork with Polyphemus; and Semiramis’s magical
    attempt to restore Ara’s corpse to life.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Armenians recognized a Good and Evil Spirit, gave
    predominance to the Good Spirit, had no god of evil in the pantheon, and described
    epic heroes as fighting evil spirits.
  category: relationship
  evidence_refs:
  - ev:1
