  text: The cited fragment describes former gods as glorious and awful and as causes
    of earthly blessings, the beginning of the world, and generations of men.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fragment says a race of giant beings arose from the gods, attempted tower-building
