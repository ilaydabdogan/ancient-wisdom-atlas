candidate_motifs:
- id: motif:1
  label: Good and evil spirits with heroic opposition to evil spirits
  taxonomy_refs:
  - duality
  basis: The passage explicitly recognizes Good and Evil Spirit, gives predominance
    to the former, and says Armenian epic heroes fight evil spirits.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states a dual spiritual opposition but also says there is
    no god of evil in the Armenian pantheon.
- id: motif:2
  label: Heroes of divine descent as ancestors of a people
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: The passage says poets attribute divine descent to legendary heroes and trace
    the origin of the Armenian race to the gods.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: Specific parent-child genealogies between individual gods and heroes are
    not detailed in this passage.
- id: motif:3
  label: Arrogant tower-building punished by divine wrath and confused speech
  taxonomy_refs:
  - divine_judgment
  - chaos
  basis: Giants from the gods conceive an impious tower-building project; divine wrath
    sends a mighty wind that shatters the structure and confuses human speech.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not name an external parallel or a specific tower site.
- id: motif:4
  label: Founding hero resists foreign domination and gives name to homeland
  taxonomy_refs:
  - culture_hero
  - royal_legitimacy
  basis: Haik is called patronymic hero of Armenia, refuses Belus’s domination, defeats
