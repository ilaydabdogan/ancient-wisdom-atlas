  summary: A poem titled “Reproaches” addresses God as righteous and truthful. The
    speaker, identifying as God's servant, complains that the world afflicts humans
    with wrongs and torments while God does not avenge them. The speaker emphasizes
    human vulnerability, compares humans negatively to stone, grass, reeds, weeds,
    thorny fields, and brushwood, and asks either for swift erasure if humans are
    hateful or for evil ones to be swept away while those favored by God remain.
