canonical_text:
  quote: ''
  summary: A Middle English excerpt set in Armenia recounts King Herupus's daughter
    Rosiphelee, who is wise, fair, and heir to her father but reluctant toward love.
    Venus and Cupid move to correct her. During a private May walk in a park by a
    river, Rosiphelee sees spring signs, a rich procession of mounted ladies, and
    then a poorer young woman riding behind with a damaged horse, many halters, and
    a rich bridle. The woman explains that the richly arrayed riders were faithful
    servants of love, while she herself was once a king's daughter who was slow to
    obey love and must now follow them every May as a horse-servant. The excerpt ends
    as she begins to explain the bridle.
  language: Middle English
  quote_policy: summarized
