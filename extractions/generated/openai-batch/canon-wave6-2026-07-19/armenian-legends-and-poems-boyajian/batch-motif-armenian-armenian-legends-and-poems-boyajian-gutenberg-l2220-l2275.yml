canonical_text:
  quote: ''
  summary: 'The passage recounts traditions about Artavasd after the death of Artashes:
    he becomes king, drives away his siblings, loses his reason while hunting, and
    disappears into a chasm. Associated oral accounts describe his father cursing
    him to be taken to Ararat, his confinement in a cavern with iron chains, dogs
    trying to gnaw the chains so he can end the world, blacksmiths strengthening the
    chains by striking anvils, and an alternate birth tradition involving attempted
    bewitchment, dragon-children stealing the infant, and a devil substituted in his
    place.'
  language: English
  quote_policy: summarized
