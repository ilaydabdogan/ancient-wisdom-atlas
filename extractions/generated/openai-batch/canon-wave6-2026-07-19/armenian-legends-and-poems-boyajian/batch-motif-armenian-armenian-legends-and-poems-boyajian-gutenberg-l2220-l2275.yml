  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sound of hammers striking an anvil strengthens Artavasd's chains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some blacksmiths strike the anvil three or four times on a Monday to strengthen
