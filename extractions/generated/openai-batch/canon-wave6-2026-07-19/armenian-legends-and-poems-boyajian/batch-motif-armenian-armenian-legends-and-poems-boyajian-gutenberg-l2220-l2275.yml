  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another account says that, at Artavasd's birth, women of the house of Ahasuerus
    tried to bewitch him and Artashes tormented them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The same singers say that the Children of the Dragons stole the infant Artavasd
