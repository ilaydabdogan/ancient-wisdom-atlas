  text: Artavasd drove his brothers and sisters to Aghyovd and Arberan so that they
    would not live in Aïrarat on the king's territory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While riding out to hunt deer and wild asses near the Ghin, Artavasd was seized
    by a visionary terror and lost his reason.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Artavasd urged his horse down a steep bank, fell into a chasm, sank, and disappeared.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The singers of Ghogtan say that many people killed themselves when Artashes
    was dying and that Artavasd complained that his father had taken the whole land
    with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Artashes cursed Artavasd, saying that the Strong Ones would take him onto
