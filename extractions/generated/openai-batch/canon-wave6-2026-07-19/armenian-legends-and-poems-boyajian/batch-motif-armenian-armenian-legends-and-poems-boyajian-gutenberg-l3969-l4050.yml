canonical_text:
  quote: ''
  summary: The passage presents three poems. “Love One Another” addresses personified
    undying Love at Golgotha and contrasts the neglect of the poor with wealth, ending
    with death as the condition in which high and low are one. “Pasqua Armena” recalls
    Christ’s suffering, crucifixion, and resurrection, then applies the Passion pattern
    to Armenia’s suffering and says Armenia’s Easter is near. “Io Vidi” describes
    a speaker seeing the angel of death approach her bed, desiring his promise of
    rest, and then hearing a malign voice command her to wake and take up her cross
    again.
  language: English and Italian
  quote_policy: summarized
