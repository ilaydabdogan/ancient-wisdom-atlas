canonical_text:
  quote: ''
  summary: 'The passage first presents a Nightingale praising Heaven after seeing
    the Rose enclosed in her bud, followed by a warning to Aghtamartzi that worldly
    love brings both joy and pain. It then shifts to Saint Nerses Shnorhali’s poem
    on the arrival of the Crusaders: God moves a vast mounted and foot force to land
    like waves, sands, and stars; they drive out unbelievers, redeem Christians, restore
    church lights, and enable exiled sons to return, prompting the speaker to exchange
    mourning garments for bright clothing.'
  language: English
