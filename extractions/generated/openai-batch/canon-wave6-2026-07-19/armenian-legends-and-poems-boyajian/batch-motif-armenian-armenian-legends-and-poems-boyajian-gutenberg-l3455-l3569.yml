canonical_text:
  quote: ''
  summary: The passage contains two poems. Raffi's ballad tells of a maiden imprisoned
    in an enchanted mountain castle, freed by a singing minstrel, and later contrasted
    with the prince who abducted and caged women. Hovhannes Costaniantz's lyric presents
    an unreachable mountain crest with Saint Gregory's lamp, addresses a brave brother
    or beloved, and laments the absence of news from warriors at war.
  language: English
  quote_policy: summarized
