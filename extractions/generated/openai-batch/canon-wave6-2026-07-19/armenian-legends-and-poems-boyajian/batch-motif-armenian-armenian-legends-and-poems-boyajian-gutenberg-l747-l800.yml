canonical_text:
  quote: ''
  summary: A folk song tells of a fox, wolf, and bear who make peace. The fox is presented
    as a false hermit and later deceives the bear by calling a cheese-baited trap
    a convent or house of prayer. After the wolf unjustly divides hunted animals and
    the bear blinds him, the bear himself is caught in the trap. The closing moral
    praises Justice and states that one who wrongs another will soon cease to be.
  language: English
  quote_policy: summarized
