canonical_text:
  quote: "“Believe not then that I am dead.”"
  summary: The passage contains two poems. In “My Death,” the speaker describes death,
    funeral rites, burial, and remembrance, repeatedly saying that these signs do
    not make him truly dead until his grave and memory are neglected. In “The Eagle’s
    Love,” an eagle on a mountain sees a maid, loves her, laments that she cannot
    fly, imagines making her queen of his mountains, and flies away mourning her fate.
  language: English
  quote_policy: quoted
