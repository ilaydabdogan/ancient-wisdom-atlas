canonical_text:
  quote: "“Stands embodied there a noble thought.”"
  summary: The poem praises the Chragan Palace as a wondrous marble building by the
    blue sea, associated with Carrara marble, Propontis, gifts from awakened souls
    of many lands, astonished passing ships, an Armenian genius, and a master builder.
    At midnight it can be imagined as living stone changed into song, and the poem
    concludes that the palace is not merely earthly matter but an embodied noble thought.
