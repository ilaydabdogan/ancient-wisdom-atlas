  summary: 'The passage gives a biographical and literary account of Moses of Khorene:
    his education abroad, travels and shipwreck, return to Armenia, withdrawal into
    solitude, recognition by Catholicos Gute, opposition from unlearned clergy, uncertain
    report of exhumed bones thrown into a river, and the scope, sources, style, and
    structure of his History.'
