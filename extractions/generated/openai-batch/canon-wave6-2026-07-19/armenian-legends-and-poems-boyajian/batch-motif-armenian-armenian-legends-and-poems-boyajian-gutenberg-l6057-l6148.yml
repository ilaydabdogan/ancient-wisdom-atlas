canonical_text:
  quote: ''
  summary: 'The passage gives a historical and literary overview of late medieval
    Armenia: the captivity and exile of Leo VI, devastation by conquerors, the Silver
    Age of Armenian literature, the works of Catholicos Nerses the Gracious, an allegorical
    elegy on the Fall of Edessa, the continuation of Nerses'' history by Vahram Rabun,
    and an incident in which Nerses counsels plague-stricken Edessa that disease is
    not a divine punishment and that the sick should be cared for.'
  language: English
  quote_policy: summarized
