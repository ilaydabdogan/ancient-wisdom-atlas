  quote: Night is my coffin, stars for lights flame round.
  summary: A first-person speaker in Bedros Tourian's poem addresses the Sun, God,
    stars, and natural images while facing death, desiring life, imagining celestial
    fire and star-transformation, and ending with a complaint that the world is God's
    mockery.
  language: English
  quote_policy: quoted
