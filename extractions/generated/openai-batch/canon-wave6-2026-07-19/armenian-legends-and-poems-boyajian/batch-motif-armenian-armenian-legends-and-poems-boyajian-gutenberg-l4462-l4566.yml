canonical_text:
  quote: ''
  summary: 'The passage recounts several Armenian legendary episodes: Sanatruk is
    rescued as a child by a miraculous white animal during a mountain snowstorm; an
    Ardzruni heir is sheltered by an eagle; Mushegh Mamikonian''s body is placed on
    a tower in hope of restoration to life; Plato''s Er is linked to Ara and returns
    from death to report the other world; Semiramis is associated with Van, a magic
    bracelet, pursuit, water, and petrification; Tigranes I is praised as a just and
    prosperous ruler; and Astyages begins to recount a terrible dream.'
  language: English
  quote_policy: summarized
literal_observations:
