  quote: And the boy lay hushed, and slumbered, / With the war-notes in his ear.
  summary: 'A cradle song addresses several birds, asking each to soothe a crying
    boy. The nightingale, jackdaw, and wild dove fail to quiet him and are linked
    with rejected future roles: priest, merchant, and mourner. A falcon connected
    with chase and war-notes finally hushes the boy and brings sleep.'
