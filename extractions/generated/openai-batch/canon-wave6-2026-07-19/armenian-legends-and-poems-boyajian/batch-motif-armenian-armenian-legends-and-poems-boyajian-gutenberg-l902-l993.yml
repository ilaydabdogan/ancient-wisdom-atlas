  quote: ''
  summary: The passage contains two English-translated Armenian poems. In “Spring,”
    an unnamed voice addresses Spring and says its coming is vain because the world
    is in gloom, the earth is bloody, and flowers, roses, and joy are absent. In “Cradle
    Song,” a mother sings a lullaby refrain, “oror,” while the baby repeatedly protests
    sleeplessness, tears, confinement of hands and feet, and inability to be free;
    the mother urges sleep and promises protective love.
