canonical_text:
  quote: ''
  summary: The passage describes the Armenian mystic work Narek, beliefs about its
    healing and demon-controlling powers when certain chapters are read, and the danger
    of distraction by evil spirits. It then summarizes Gregory of Narek and Grigor
    Magistros, including Magistros's biblical poem and a peasant story about a lark
    trying to hold up the sky. The final section describes Armenian migration into
    the Taurus region, fortress-building, Rubin's principality, Constantine's expansion,
    and Armenian aid to the Crusaders.
  language: English
  quote_policy: summarized
