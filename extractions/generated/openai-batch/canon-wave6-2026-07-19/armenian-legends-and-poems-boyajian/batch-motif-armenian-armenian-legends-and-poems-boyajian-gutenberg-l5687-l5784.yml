  summary: 'The passage recounts Armenia after the Arsacid dynasty: domination and
    warfare among Persians, Greeks, and Arabs; oppression by governors including Kashm
    and Bugha; the rise of the Bagratuni family; Ashot Bagratuni’s crowning as king;
    prosperity under the Bagratuni dynasty; rival Armenian kingdoms; and the charity
    of Ashot III.'
