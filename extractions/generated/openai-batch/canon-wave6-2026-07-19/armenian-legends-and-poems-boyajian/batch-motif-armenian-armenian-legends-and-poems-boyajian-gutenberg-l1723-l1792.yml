canonical_text:
  quote: ''
  summary: An account from Moses of Khorene describes war between Artashes and the
    Alans after an Alan incursion and the capture of the Alan king’s son. The two
    camps stand on opposite banks of the river Kur. Satenik, daughter of the Alan
    king, appeals from a rock by the river for the captive youth’s return and for
    peace. Artashes desires her and seeks her as wife through Smpad, with oaths of
    peace and return of the youth. Songs then describe Artashes crossing the river
    with a red cord and golden ring to take the Alan princess, and the narrator interprets
    the song as referring to bride-price goods and royal wedding largesse of gold
    and pearls.
  language: English
  quote_policy: summarized
