canonical_text:
  quote: "“Heaven and Earth are brothers.”"
  summary: The passage introduces Nerses Mokatzi and summarizes his poem in which
    personified Heaven and Earth dispute which is greater. Heaven cites stars, dew,
    sun, lightning, hail, angels, the seven regions, and God’s throne; Earth answers
    with flowers, the sea’s source, abyssal waters, mountains and valleys, the burial
    of bodies, apostles and prophets, and the final Judgment in Earth’s domain. The
    passage then briefly summarizes comic verses about flies and a love lyric that
    imagines the beloved with sea-deep eyes and celestial bodies adorning her.
  language: English
  quote_policy: quoted
