canonical_text:
  quote: ''
  summary: The passage recounts Astyages’ dream of an icy Armenian mountain where
    a veiled woman gives birth to three heroes, one of whom rides a dragon and threatens
    his kingdom and gods. Astyages interprets the dream as foretelling Tigranes’ attack.
    The passage then summarizes Astyages’ proposed marriage to Tigranes’ sister Tigranuhi,
    the diplomatic letter and gifts, the later plot against Tigranes, Tigranuhi’s
    warning, and Astyages’ death in battle. It also cites an anecdote from Xenophon
    in which Prince Tigranes offers his life for his captive wife and Cyrus releases
    the captives freely. The passage closes with narratorial comparisons involving
    letters in other traditions and a biblical notice connected to Sasmadzrer.
  language: English
  quote_policy: summarized
