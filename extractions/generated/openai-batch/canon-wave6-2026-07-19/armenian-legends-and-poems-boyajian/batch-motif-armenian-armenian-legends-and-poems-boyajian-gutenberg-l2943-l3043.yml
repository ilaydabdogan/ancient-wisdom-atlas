canonical_text:
  quote: "“Then suddenly the surface of the lake / Grew luminous”"
  summary: In Raffi’s “The Lake of Van,” a lonely exile laments Armenia’s oppression
    beside Lake Van, appeals to the moon, the lake, winds, and God, and asks whether
    a future day will restore Armenians to their home. A luminous maid identified
    with the Armenian Muses rises from the lake carrying a lantern and lyre, prophesies
    better days, peace, divine order, poetic renewal, dawn, and the Morning Star as
    a sign, then vanishes into darkness and waves. The speaker closes by asking whether
    a dead corpse can rise and live again.
  language: English
  quote_policy: quoted
