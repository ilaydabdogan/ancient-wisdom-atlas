comparison_claims:
- id: claim:1
  claim: 'The prophetic lake-maid is placed in a Muse/Apollo/Parnassus poetic-inspiration
    pattern: the poem identifies her with the Armenian Muses and later invokes Armenia’s
    Parnassus and Apollo’s bright car.'
  claim_level: same_function
  target: Muse/Apollo/Parnassus poetic inspiration pattern within classical-referenced
    literary tradition
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage uses these names poetically for Armenian renewal; this
    claim does not assert historical origin or direct borrowing beyond the explicit
    references in the poem.
- id: claim:2
  claim: The final question about a dead corpse rising and living again aligns with
    the resurrection motif family at the level of image and function.
  claim_level: same_motif
  target: resurrection motif family
  evidence_refs:
  - ev:13
  counter_evidence_refs:
  - ev:11
  confidence: medium
  limitations: The nearby context of dead hearts and national renewal suggests a metaphorical
    or rhetorical use rather than an unambiguous literal resurrection narrative.
- id: claim:3
  claim: The mountain-flag image aligns with a return-to-homeland pattern, since the
    flag on Ararat would call Armenians scattered abroad back home.
  claim_level: same_motif
  target: return motif family
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The return is anticipated in a question and is not narrated as completed
    within the passage.
- id: claim:4
  claim: The text briefly raises and rejects possible comparison of the apparition
    to an Angel or Houri before identifying her instead with the Armenian Muses.
  claim_level: visual_similarity
  target: angelic or houri-like visionary female messenger pattern
  evidence_refs:
