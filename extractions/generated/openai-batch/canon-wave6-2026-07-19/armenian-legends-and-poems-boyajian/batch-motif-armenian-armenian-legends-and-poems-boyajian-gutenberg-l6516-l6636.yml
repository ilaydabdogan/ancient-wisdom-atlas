    is personified as an overpowering force against prophets, rulers, heroes, and
    all the strong; Mkrtich Naghash is introduced as an archbishop, artist, protector,
    and poet; his poems treat avarice, love, exile, epidemic death, and a mysterious
    divinely sent Flower mourned and honored by other flowers.'
