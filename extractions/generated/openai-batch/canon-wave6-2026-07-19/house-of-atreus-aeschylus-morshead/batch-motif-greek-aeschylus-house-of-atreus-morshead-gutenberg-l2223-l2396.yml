candidate_motifs:
- id: motif:1
  label: murder justified as vengeance for sacrificed child
  taxonomy_refs:
  - sacrifice
  basis: Clytemnestra explicitly grounds Agamemnon’s killing in his earlier sacrifice
    of their daughter and swears by vengeance for the murdered child.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The daughter is not named in this passage; identification beyond the passage
    is not used.
- id: motif:2
  label: reciprocal blood retribution
  taxonomy_refs:
  - divine_judgment
  basis: The Chorus predicts that Clytemnestra will be smitten as she smote, and the
    passage repeatedly frames murder as blood answering blood.
  evidence_refs:
  - ev:5
  - ev:10
  - ev:13
  confidence: high
  cautions: The passage voices this through Chorus and Clytemnestra; it does not narrate
    the later fulfillment here.
- id: motif:3
  label: ancestral curse or race-fiend in a royal house
  taxonomy_refs:
  - royal_legitimacy
  basis: The Chorus and Clytemnestra name a fiend of the race, the double stock of
    Tantalus, the house of Atreus, and an old Avenger connected with a feast of blood.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:13
  confidence: high
  cautions: The specific older story of the feast is alluded to but not fully narrated
