canonical_text:
  quote: ''
  summary: After Agamemnon’s murder, Clytemnestra addresses the Elders of Argos, openly
    claims the killing, and justifies it as requital for Agamemnon’s sacrifice of
    their daughter. The Chorus condemns her, laments the king, invokes Fate, Zeus,
    Helen, and the ancestral fiend of the house of Tantalus/Atreus, and predicts reciprocal
    punishment. Clytemnestra swears by vengeance, Atè, and the Fury, refers to Aegisthus
    as her support, denounces Agamemnon’s infidelity and the slain captive seeress,
    and frames the killing as the act of an old Avenger for earlier blood crimes.
  language: English
  quote_policy: summarized
