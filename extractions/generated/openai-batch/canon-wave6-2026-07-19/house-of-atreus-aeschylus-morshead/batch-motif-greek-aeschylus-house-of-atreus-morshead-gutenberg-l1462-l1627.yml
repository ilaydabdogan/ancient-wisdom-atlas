canonical_text:
  quote: ''
  summary: Clytemnestra persuades Agamemnon to enter the house by walking on purple
    garments. Agamemnon consents reluctantly, asks that Cassandra be led inside gently,
    and enters. Clytemnestra speaks of abundant purple dye, ransom vows, the returning
    lord of the house, and Zeus. The Chorus remains with Cassandra and sings of foreboding,
    Fate, the Furies, shipwreck-like ruin, irrecoverable spilled blood, and Asclepius
    smitten by Zeus. Clytemnestra returns and orders Cassandra to enter, referring
    to lustral rites, slavery, Heracles as a former slave, prepared victims, knife,
    and fire; Cassandra remains silent and is described by the Chorus as like a trapped
    wild thing.
  language: English
  quote_policy: summarized
