candidate_motifs:
- id: motif:1
  label: Destructive divine former beloved
  taxonomy_refs:
  - divine_beloved
  basis: Cassandra addresses Apollo as her former love and as the destroyer who has
    destroyed her and led her to an evil home.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states the prior beloved relationship and destructive effect
    but does not narrate the full earlier divine-human relationship.
- id: motif:2
  label: Cursed blood-house of kin murder
  taxonomy_refs:
  - divine_judgment
  basis: The Atreus house is named as cursed, filled with kin-blood imagery, ghostly
    child victims, and powers whose hatred no blood can satiate.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  confidence: medium
  cautions: The passage presents curse and divine or daemonic hostility but does not
    fully explain the origin or formal judgment.
- id: motif:3
  label: Treacherous wife murders lord
