canonical_text:
  quote: ''
  summary: Clytemnestra dismisses Cassandra as distraught after Troy’s fiery fall.
    The Chorus urges Cassandra to leave the car and accept servitude. Cassandra invokes
    Earth and Apollo, calls Apollo her destroyer and former beloved, identifies the
    house of Atreus as cursed, recalls older kin-murder and child-cannibalism, and
    prophesies Agamemnon’s imminent murder by his wife with another helper. She describes
    a treacherous bath, a net or snare, blows, blood, and a double-edged sword that
    will also kill her. She laments Troy, Paris, the river Scamander, failed sacrifices
    for the city, and anticipates death near underworld rivers.
  language: English
  quote_policy: summarized
