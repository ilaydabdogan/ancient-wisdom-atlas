canonical_text:
  quote: ''
  summary: The chorus reflects on Troy’s ruin through images of Zeus’s delayed vengeance,
    Paris’s marriage, a fostered lion-cub that becomes a bloodthirsty destroyer of
    its household, and the principle that impious deeds breed later curses. The leader
    greets Agamemnon on his return from Troy. Agamemnon enters in a chariot with Cassandra
    and declares that the gods judged Ilion to death, that Troy still burns, and that
    Argive revenge has closed upon its prey.
  language: English
  quote_policy: summarized
