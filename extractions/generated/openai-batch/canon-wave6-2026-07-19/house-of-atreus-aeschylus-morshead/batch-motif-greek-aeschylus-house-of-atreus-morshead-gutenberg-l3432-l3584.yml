canonical_text:
  quote: ''
  summary: Orestes and Electra invoke chthonic powers and their murdered father at
    his tomb, asking aid in vengeance and promising funeral honors. Orestes questions
    offerings sent by the mother; the chorus explains they followed a terrifying dream
    in which she bore and nursed a serpent that drew blood with milk. Orestes interprets
    the serpent as himself and the dream as an omen that he must slay her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orestes says the task of stanching the wrong and driving out the land’s blood-fiend
    belongs to kin rather than strangers, and he frames the speech as a spell calling
    Earth’s nether powers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chorus invokes dark eternal lords to send aid from hell in response to
    the children’s cry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Orestes addresses his murdered father, asks to rule his halls, and says rightful
    feasts and altar-smoke will be paid to him if he grants aid.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Electra asks for the power to deal dark death to Aegisthus, to escape her
    own doom, and promises lustral streams and special honor at her father’s tomb.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Orestes and Electra invoke Earth and Persephone, recall that their father
    was slain in a laver and ensnared by a net or enfolding robe, and ask him to arise
    and aid his kinsmen’s cause.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Electra describes herself and Orestes at the tomb as two fledglings, a man-child
    and a maid, and says their survival preserves the dead father from wholly dying.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Orestes questions why the woman sent offerings and states that gifts, wealth,
    or wine cannot atone for spilled blood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chorus reports that a night-terror dream caused the woman to send offerings;
    in the dream her womb bore a serpent, she nursed it like a swaddled child, and
    it drew blood with milk from her breast.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
- id: obs:9
  text: After the woman awoke crying, many palace lamps flared into light, and offerings
    were sent in hope of separating sin from doom.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Orestes calls on Earth and his father’s grave to fulfill the dream through
    him, identifies himself with the serpent from the same womb and breast, and says
    he must slay the woman.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The chorus tells Orestes to act, but first to state how some should aid by
    acting and others by not acting.
  category: speech
  evidence_refs:
  - ev:11
