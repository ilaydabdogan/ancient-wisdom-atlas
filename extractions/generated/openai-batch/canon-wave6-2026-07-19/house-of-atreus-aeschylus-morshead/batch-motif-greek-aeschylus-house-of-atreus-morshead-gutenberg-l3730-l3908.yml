canonical_text:
  quote: "“Orestes is no more.”"
  summary: A speaker identified as Orestes presents himself as a traveler bearing
    news that Orestes has died and that his ashes are in an urn. Clytemnestra receives
    the report and grants guest-right. The chorus invokes Agamemnon’s tomb, Hermes,
    and Zeus, while Kilissa the nurse is sent to summon Aegisthus. The chorus persuades
    her to alter the summons so that Aegisthus will come without the protection Clytemnestra
    requested.
  language: English
  quote_policy: quoted
