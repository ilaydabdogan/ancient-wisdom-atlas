  summary: Orestes reveals himself to Electra through signs including a lock of hair,
    footprints, and a robe she made. Electra receives him as brother and hoped-for
    saviour of their father’s house. The siblings pray to Zeus as homeless children
    of a slain father, likened to eagle-brood whose sire was killed by a serpent.
    Orestes reports Apollo’s oracle commanding vengeance against his father’s slayers
    and threatening him with disease, madness, exclusion, and the wrath of the dead
    if he fails. At Agamemnon’s tomb, the Chorus invokes Fates, Zeus, and Justice,
    and the living children address their dead father with cries for vengeance.
