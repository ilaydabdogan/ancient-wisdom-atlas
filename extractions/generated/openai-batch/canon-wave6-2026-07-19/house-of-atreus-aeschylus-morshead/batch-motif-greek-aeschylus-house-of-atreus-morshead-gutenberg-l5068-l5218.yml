canonical_text:
  quote: "“Wisdom is child of pain, and born with many a tear;”"
  summary: Orestes tells Athena that he has been ritually cleansed after killing his
    mother in revenge for Agamemnon, and that Loxias shares responsibility for the
    deed. Athena accepts him as ritually pure but says the claims of his chthonic
    foes cannot simply be dismissed; she establishes oath-bound judges for blood-guilt.
    The Chorus warns that freeing a matricide would overthrow ancient laws, diminish
    fear of punishment, and bring moral disorder, then praises reverence, justice,
    the middle way, and the honor owed to parents and guests. Athena returns with
    twelve Athenian citizens.
  language: English
  quote_policy: quoted
