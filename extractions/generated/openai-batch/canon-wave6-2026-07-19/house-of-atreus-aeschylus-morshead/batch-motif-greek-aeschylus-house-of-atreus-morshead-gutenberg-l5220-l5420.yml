canonical_text:
  quote: ''
  summary: Athena convenes a public court and commands silence until judges fill the
    judgment-seat. Apollo enters as witness and advocate for Orestes, who admits killing
    his mother by sword under Apollo's oracle. The Chorus prosecutes him for matricide
    and argues maternal blood-kinship. Apollo defends the killing as commanded by
    Zeus, recounts the treacherous killing of Orestes' royal father in a bath with
    a net-like robe, distinguishes reversible bondage from irreversible death, and
    argues that the male is the true parent by invoking Athena's birth from Zeus without
    a mother's womb. Apollo also seeks a lasting pledge between Orestes' line and
    Athena's city. Athena orders the judges to deliver a just award.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Athena orders a herald and trumpet to summon all people, requires silence,
    and frames the proceeding as a judgment whose ordinance the city is to learn for
    all time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apollo says he comes first as witness for Orestes, who is his suppliant, guest
    of his holy hearth, and one whom he has cleansed of blood-guilt.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Apollo also says he stands beside Orestes because he bore a part in the deed
    by which Orestes' mother fell.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Orestes admits that he killed his mother and says he gashed her neck with
    a drawn sword.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Orestes attributes his act to Apollo's oracles and hopes his buried father
    will aid him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Chorus treats the matter as a contest of charges and presses Orestes on
    maternal kinship, womb-bearing, and blood relation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Orestes argues that his mother had two stains because she killed her husband,
    who was Orestes' father, and he asks why the Chorus did not hunt her while she
    lived.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Apollo says his prophetic speech follows commands from Zeus and tells the
    court that oaths do not prevail over Zeus' command.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Apollo recounts the father''s death as a treacherous homecoming killing:
    the wife welcomed him, trapped him with covering robes while he bathed, and struck
    him down.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Chorus invokes Zeus' chaining of his father Cronos as a challenge to Apollo's
    claim about the special gravity of a father's death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Apollo answers that bonds can be loosed, but when dust drinks shed human blood
    the dead person does not rise again, and no chant or charm has been made for this.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Apollo argues that the womb is not the true parent but nurses a seed, while
    the male is the parent.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Apollo offers Athena's birth from Olympian Zeus without being fostered in
    a womb as proof for his parenthood argument.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Apollo says he sent his suppliant to Athena's shrine so that Orestes, his
    line, and Athenian descendants may remain bound in lasting loyalty and troth.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Athena closes the speeches and instructs the judges to deliver a just award
    with pure intent; the Chorus says it awaits the doom of law.
  category: action
  evidence_refs:
  - ev:10
