canonical_text:
  quote: ''
  summary: Apollo disputes the Furies’ pursuit of Orestes for matricide, contrasting
    their wrath over kindred blood with their tolerance of a wife killing her husband
    and invoking the sanctity of marriage. Apollo says Pallas will guard right and
    that he will defend his suppliant. The scene shifts to Athena’s temple in Athens,
    where Orestes clings to her image and calls on her for aid after wandering and
    undergoing purification. The Furies track him by the scent of his mother’s blood,
    threaten to drain him and drag him below, invoke Death’s judgment, and perform
    a binding chant declaring themselves ministers of Justice who punish blood-guilt
    in life and death.
  language: English
  quote_policy: summarized
