canonical_text:
  quote: ''
  summary: Athena urges the ancient goddesses not to curse Athens after a balanced
    judgment has atoned Orestes’ killing. She offers them a sanctuary, sacrifices,
    civic honor, and power over household prosperity. The Chorus protests that younger
    gods have dishonored their ancient rights and threatens venomous blight and plague.
    Through repeated persuasion, Athena promises refuge, worship, and lasting honor;
    the Chorus desists from wrath, and Athena directs them toward blessings of fertility,
    civic prosperity, justice, and victory.
  language: English
  quote_policy: summarized
