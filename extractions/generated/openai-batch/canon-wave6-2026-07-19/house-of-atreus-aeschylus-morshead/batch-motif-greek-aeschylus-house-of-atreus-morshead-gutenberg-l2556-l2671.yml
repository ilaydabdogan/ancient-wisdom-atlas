canonical_text:
  quote: Enough of wrong and murder, let no other blood be spilt.
  summary: The Chorus confronts Aegisthus after the king’s death, denouncing his claim
    to rule and hoping for Orestes’ return. Aegisthus threatens coercive punishment
    and asserts authority. The exchange nearly becomes armed conflict until Clytemnestra
    intervenes, urges an end to further bloodshed, and declares that she and Aegisthus
    will rule the palace.
  language: English
  quote_policy: quoted
