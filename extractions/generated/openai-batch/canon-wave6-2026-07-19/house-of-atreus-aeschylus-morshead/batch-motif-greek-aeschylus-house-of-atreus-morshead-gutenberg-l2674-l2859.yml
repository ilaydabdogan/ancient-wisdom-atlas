canonical_text:
  quote: ''
  summary: The passage opens The Libation-Bearers, listing the dramatic persons and
    setting the scene at Agamemnon’s tomb at Mycenae. Orestes returns from banishment,
    invokes Hermes and Zeus, dedicates locks of hair, and hides with Pylades when
    Electra and captive women arrive bearing libations. The Chorus reports ominous
    dreams, the anger of the dead against their killers, the command to bring offerings,
    and reflections on justice, blood-guilt, and captivity. Electra asks how to pour
    offerings sent by her mother, and the Chorus advises her to pray for those who
    love Agamemnon and those who oppose Aegisthus.
  language: English
  quote_policy: summarized
