canonical_text:
  quote: ''
  summary: The chorus recounts how brother kings led the Greek expedition to Troy
    under an eagle omen interpreted by Calchas. The omen predicts Troy’s fall but
    also divine anger from Artemis, delay at Aulis, and an unhallowed sacrifice. The
    passage invokes Zeus as the source of wisdom through suffering and narrates the
    elder chief’s decision to sacrifice his daughter to calm the winds and launch
    the fleet.
