canonical_text:
  quote: ''
  summary: Agamemnon praises Odysseus, speaks of public deliberation and healing what
    is amiss, and prepares to enter his palace and home shrines. Clytemnestra enters
    with maidens bearing purple robes, describes her suffering during his absence,
    explains Orestes’ absence, greets Agamemnon with elaborate similes, and orders
    a purple path spread for him. Agamemnon resists walking on the rich dyes, saying
    such pomp belongs to gods rather than mortal men, and debates the matter with
    Clytemnestra.
  language: English
  quote_policy: summarized
