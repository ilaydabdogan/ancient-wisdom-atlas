candidate_motifs:
- id: motif:1
  label: Deceptive return in stranger disguise
  taxonomy_refs:
  - return
  - trickster_boundary
  basis: Orestes returns to the palace with Pylades as a stranger traveler, uses foreign
    speech and concealment, and seeks entry through the gate.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:11
  - ev:13
  confidence: high
  cautions: The taxonomy labels are broad; the passage emphasizes tactical disguise
    rather than a fully elaborated return-cycle.
- id: motif:2
  label: Blood vengeance under divine sanction
  taxonomy_refs:
  - divine_judgment
  basis: Orestes frames the killing as foretold by Apollo, invokes Hermes to guide
    his sword, and the chorus says Justice and Destiny forge the sword that repays
    bloodshed.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:10
  confidence: high
  cautions: The moral status is voiced by Orestes and the chorus within the passage
    and should not be treated as an external legal judgment without review.
- id: motif:3
  label: Cursed house and recurring blood payment
  taxonomy_refs:
  - divine_judgment
  basis: The Fury of the house is said to drink a third draught of blood, and the
    Fiend of the house is said to repay the price of blood previously shed.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The passage uses personified and poetic language; extraction records the
    motif without resolving whether the power is literal, figurative, or dramatic.
- id: motif:4
  label: Destructive betrayal within kinship and marriage
  taxonomy_refs: []
  basis: The chorus groups Althea’s act against her son, Scylla’s betrayal of her
    father, the loveless wedlock that killed a chieftain, and the Lemnos crime as
    related examples of grievous household or kinship crimes.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The chorus presents a gendered moral catalogue; the extraction does not
    endorse the generalization.
- id: motif:5
  label: Life bound to a combustible token
  taxonomy_refs: []
  basis: Althea’s son is said to share life and death with a brand whose burning was
    interrupted at his birth and later rekindled.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives only the choral summary of the myth and does not name
    the son.
- id: motif:6
  label: Fatal cutting of a protective lock
  taxonomy_refs: []
  basis: Scylla kills her father by clipping a lock from his head that should never
    grow old while he sleeps.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explicitly explain the mechanism by which cutting
    the lock causes death beyond the choral summary.
- id: motif:7
  label: Hospitality as access for hidden purpose
  taxonomy_refs:
  - sacred_exchange
  - trickster_boundary
  basis: Orestes presents himself as a traveler seeking welcome and tidings-bearing
    access, and Clytemnestra offers bath, bed, rest, and welcome to the disguised
    strangers.
  evidence_refs:
  - ev:11
  - ev:13
  - ev:14
