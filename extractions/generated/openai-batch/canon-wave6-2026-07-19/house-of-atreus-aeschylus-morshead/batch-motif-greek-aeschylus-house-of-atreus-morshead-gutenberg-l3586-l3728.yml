canonical_text:
  quote: May by like craft and in like noose be ta’en
  summary: Orestes plans to enter the palace with Pylades in the guise of foreign
    travelers, conceal the plot with his sister’s help, and kill Aegisthus as vengeance
    foretold by Apollo. The chorus reflects on fearful powers, destructive crimes
    within families and marriages, and examples involving Althea, Scylla, and Lemnos,
    before asserting that Justice and Destiny will repay old bloodshed. Orestes and
    Pylades then arrive at the palace gate, a slave admits them, and Clytemnestra
    offers the strangers hospitality.
  language: English
  quote_policy: quoted
