canonical_text:
  quote: "“From the womb of Night / Spring forth, with promise fair, the young child
    Light.”"
  summary: The chorus recalls the sacrifice of an unnamed maiden ordered by her father
    and linked with Calchas’ prophecy. Clytemnestra, approached at the altars as queen
    during the king’s absence, announces that Troy has fallen. She rejects dreams
    and rumor as proof, instead describing a chain of fire beacons from Ida to the
    Atrides’ roof. She then imagines the mixed cries of Greek victors and Trojan captives
    and warns that the Greeks must honor Troy’s gods and avoid forbidden gain if they
    are to return safely.
  language: English
  quote_policy: quoted
