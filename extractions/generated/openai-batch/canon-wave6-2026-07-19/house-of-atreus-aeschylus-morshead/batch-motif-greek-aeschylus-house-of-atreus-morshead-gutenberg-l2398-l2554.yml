canonical_text:
  quote: ''
  summary: After Agamemnon’s death, the Chorus laments him and describes a cycle of
    kin-blood, vengeance, and doom in the royal house. Clytemnestra defends the killing
    as requital for Iphigenia’s death and claims authority over the burial. The Chorus
    states that wrong returns upon wrongdoers under Zeus’s law. Clytemnestra prays
    that the murderous frenzy of the house of Pleisthenes may end. Aegisthus enters
    and recounts Atreus’s deception of Thyestes, the feeding of children’s flesh at
    a feast, Thyestes’ curse on the lineage, and Aegisthus’s own exile, return, and
    planning of Agamemnon’s murder.
  language: English
  quote_policy: summarized
