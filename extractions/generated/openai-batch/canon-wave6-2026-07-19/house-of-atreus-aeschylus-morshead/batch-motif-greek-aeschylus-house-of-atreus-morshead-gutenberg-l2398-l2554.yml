candidate_motifs:
- id: motif:1
  label: reciprocal kin vengeance in a cursed house
  taxonomy_refs:
  - divine_judgment
  basis: The Chorus states that sin follows sin, the slayer dies in turn, Zeus’s law
    fixes vengeance on the wrongdoer, and fate clings to the house; Clytemnestra and
    Aegisthus both frame the killing as requital.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  - ev:11
  confidence: high
  cautions: The passage gives these claims through dramatic speakers; divine causation
    is asserted within the dialogue.
- id: motif:2
  label: retaliatory killing for a dead child
  taxonomy_refs: []
  basis: Clytemnestra justifies the killing by naming Iphigenia, her daughter, whom
    the dead man gave to a deadly doom.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This passage summarizes Iphigenia’s death but does not narrate the circumstances
    in detail.
- id: motif:3
  label: cannibal banquet of children served to a parent
  taxonomy_refs: []
  basis: Aegisthus recounts that Atreus served Thyestes flesh that had been his children,
    hiding identifying parts, and that Thyestes ate without knowing.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The episode is reported by Aegisthus rather than enacted in the passage.
- id: motif:4
  label: spoken curse on a lineage
  taxonomy_refs: []
  basis: After discovering the food, Thyestes curses Pelops’ house and the race of
    Pleisthenes, and Aegisthus says the curse caused the present death.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The mechanism of the curse is presented within Aegisthus’s account.
- id: motif:5
  label: exiled child returns to avenge ancestral wrong
  taxonomy_refs:
  - return
  basis: Aegisthus says he was sent into banishment as an infant, later brought home
    by Justice as a grown man, and planned the killing.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives only a brief retrospective account of exile and return,
    not a full journey narrative.
- id: motif:6
  label: divine or personified justice validating vengeance
  taxonomy_refs:
  - divine_judgment
  basis: Aegisthus says the gods heed earthly wrongs; the Chorus invokes Zeus’s fixed
    law; Justice is personified as holding the steel, bringing Aegisthus home, and
    ambushing the slain man.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  - ev:11
  confidence: medium
  cautions: Human plotting is also explicit, so the divine role is intertwined with
    mortal agency and speaker interpretation.
