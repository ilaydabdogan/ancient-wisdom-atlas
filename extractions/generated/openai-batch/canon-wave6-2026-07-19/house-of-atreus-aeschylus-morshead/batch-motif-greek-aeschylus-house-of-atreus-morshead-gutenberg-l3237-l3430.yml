canonical_text:
  quote: "“Blood-drops shed upon the ground / Plead for other bloodshed yet”"
  summary: Orestes, Electra, and the Chorus lament at the dead father’s tomb or urn,
    invoke Zeus, Earth, the underworld powers, Fate, and the Furies, recall the father’s
    dishonored death and burial by the mother, and call on the dead father to hear,
    rise, and aid their vengeance. The passage ends with a lament for the hereditary
    curse and bloodstained doom of the house.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Chorus says a god can turn tears to joy, drown a dirge beside an urn with
    a triumph-ode, and greet a restored child returning to kingly halls.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Orestes addresses his father and imagines that death at Ilion or overseas
    in war would have left honor, fame, and a heaped tomb.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Chorus describes the father as one who could have stood among the noble
    dead in the underworld, near the enthroned kings of hell, and as a mortal king
    of kings with crown and staff.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Electra rejects the wish that her father had been merely one of the war-dead
    and says those who slew him should have died by Scamander.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Chorus says a double prayer awakes the dead, that avengers rise late,
    that blood stains the guilty rulers, and that Fate stands on the children’s side.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Electra says Zeus sends a doom from below and that a father will visit his
    wrong upon a mother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Orestes calls Zeus his only parent, asks for a blow upon the guilty heads,
    and invokes Earth and the monarchy of hell to hear his prayer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: 'The Chorus states a stern law: blood-drops shed upon the ground plead for
    other bloodshed, and a Fury crowns crime with crime.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:9
  text: Electra calls on the avenging powers and Furies of the slain and describes
