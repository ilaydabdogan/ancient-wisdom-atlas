canonical_text:
  quote: ''
  summary: The Chorus reflects on divine punishment, rumor, beacon-fires, and uncertainty
    before seeing a herald arrive. The Herald returns to Argos after ten years, invokes
    several gods, announces Agamemnon’s victorious return from Troy, describes Paris
    and Troy as condemned and punished, exchanges words with the Chorus about longing
    and wrong, recounts the army’s hardships, and proclaims that the Argive host conquered
    Troy and dedicated spoils in Greek temples by Zeus’s will.
  language: English
  quote_policy: summarized
