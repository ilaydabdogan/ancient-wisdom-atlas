canonical_text:
  quote: ''
  summary: A choral passage prays for Orestes to return to his father’s house, avenge
    old blood, and restore rightful rule. Aegisthus enters after hearing a report
    of Orestes’ death, goes inside, and is killed. A slave announces Aegisthus’ death
    and warns that Clytemnestra is in danger. Clytemnestra recognizes reciprocal craft,
    calls for the axe used before, and confronts Orestes, who enters with a bloody
    sword. She appeals to him as his mother and nurse; Orestes hesitates, asks Pylades,
    and Pylades reminds him of Apollo’s command at Delphi. Orestes resolves to kill
    Clytemnestra beside Aegisthus, while she invokes nursing, fate, and a parent’s
    curse.
  language: English
  quote_policy: summarized
