candidate_motifs:
- id: motif:1
  label: Avenging son returns to the father’s house
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: Orestes is framed as entering his father’s hall, striking his father’s foes,
    and recovering his father’s wealth and political allegiance.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage presents the return within an avenging tragedy, not as a completed
    peaceful homecoming.
- id: motif:2
  label: Blood vengeance meant to end inherited blood-curse
  taxonomy_refs:
  - divine_judgment
  basis: The chorus asks for old blood to be avenged by a rightful blow and for the
    old curse not to generate further blood; later the deed is tied to Atreus’ doom.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage hopes for an end to the curse but does not show final resolution.
- id: motif:3
  label: Divine command overrides kinship appeal
  taxonomy_refs:
  - divine_judgment
  basis: When Orestes hesitates before killing his mother, Pylades invokes Apollo’s
    Delphic command and a sworn compact, leading Orestes to proceed.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage gives Pylades’ reasoning but does not include the original
    oracle itself.
- id: motif:4
  label: Restoration of rightful rule through violent retribution
  taxonomy_refs:
  - royal_legitimacy
  - return
  basis: The home is to be restored to its rightful lord; the chorus anticipates restored
    commonwealth, freedom, wealth, throne, and city fealty after the violent act.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The political restoration remains anticipated in the passage rather than
    fully enacted.
- id: motif:5
  label: False death report as lethal stratagem
  taxonomy_refs: []
  basis: Aegisthus arrives because of a report that Orestes is dead, goes inside to
    test it, and Clytemnestra later says those who slew by craft will die by like
    craft.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage alludes to the report and reciprocal craft but does not narrate
    the full planning of the deception.
- id: motif:6
  label: Mother’s nursing plea against matricide
  taxonomy_refs: []
  basis: Clytemnestra asks her son to spare her by invoking the breast where he rested
    and the milk he drew from her; Orestes directly asks whether he can spare his
    mother.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage presents the plea but ends before the killing is described
    within this excerpt.
- id: motif:7
  label: Heroic exemplar invoked before a terrible deed
  taxonomy_refs:
  - culture_hero
  basis: Orestes is urged to hold in his breast such heart as Perseus had while performing
    the deed demanded for the dead and the household.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Perseus is named only as a model of courage; no detailed Perseus episode
    is included in the passage.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the courage required of Orestes to the heart
    of Perseus, using a named Greek hero as an exemplar for a dangerous deed.
  claim_level: same_function
  target: Perseus as heroic model within Greek mythic tradition
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supplies only the name Perseus and the function of exemplary
    courage; it does not specify which Perseus episode is meant.
- id: claim:2
  claim: The passage frames Orestes’ killings as part of the wider inherited doom
    of Atreus’ house, connecting the immediate revenge to a house-curse pattern.
  claim_level: same_motif
  target: House of Atreus inherited blood-guilt / family curse pattern
  evidence_refs:
  - ev:2
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt names Atreus’ doom and the old curse but does not recount
    earlier generations of the curse.
