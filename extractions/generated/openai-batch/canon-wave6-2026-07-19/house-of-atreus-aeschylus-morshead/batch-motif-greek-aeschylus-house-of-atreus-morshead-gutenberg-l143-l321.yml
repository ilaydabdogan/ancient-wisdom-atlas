canonical_text:
  quote: ''
  summary: The passage opens Agamemnon at the Palace of Atreus in Mycenae. A watchman,
    after a year of sleepless rooftop watching, sees the beacon announcing Troy’s
    fall and prepares to summon Clytemnestra while hinting at hidden trouble in the
    house. The chorus of old men enters as Clytemnestra kindles altars; they recall
    the ten-year expedition of Atreus’ sons against Troy and Paris, speak of Zeus
    and divine vengeance, describe their own old age, and ask the queen what news
    has prompted the sacrificial fires.
  language: English
  quote_policy: summarized
