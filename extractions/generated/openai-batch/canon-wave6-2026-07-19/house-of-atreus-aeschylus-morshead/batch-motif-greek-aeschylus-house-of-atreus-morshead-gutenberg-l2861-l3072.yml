canonical_text:
  quote: ''
  summary: Electra, instructed by the Chorus, pours libations at her dead father’s
    tomb, invokes Hermes, the gods below, Earth, and her father, and prays for Orestes’
    return and for vengeance on the slayers. The Chorus sings a dirge at the grave.
    Electra discovers a newly shorn lock of hair and footprints, interprets them as
    signs of Orestes, and Orestes then appears and identifies himself, though Electra
    initially suspects deception.
  language: English
  quote_policy: summarized
