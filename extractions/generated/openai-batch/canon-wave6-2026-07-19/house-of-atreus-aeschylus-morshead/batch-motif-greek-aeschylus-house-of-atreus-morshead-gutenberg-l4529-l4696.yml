canonical_text:
  quote: ''
  summary: The ghost of Clytemnestra rouses the sleeping Furies, complains of her
    death at Orestes' hands, recalls offerings made to them, and urges renewed pursuit.
    The Furies wake, lament Orestes' escape, and accuse Apollo of protecting a matricide
    and violating ancient divine right. Apollo enters from the shrine, orders the
    Furies away, threatens them, denounces their blood-hunger, and disputes their
    claim that their pursuit of Orestes is a fate-imposed office.
  language: English
  quote_policy: summarized
