canonical_text:
  quote: Portal of Hades, thus I bid thee hail!
  summary: Cassandra foresees her death and Agamemnon’s, enters the palace despite
    terror at the blood-stained house, and calls for future vengeance. Agamemnon cries
    out from within as he is struck. The scene opens to show Clytemnestra with the
    corpses of Agamemnon and Cassandra; Clytemnestra avows that she trapped Agamemnon
    in a robe or net and killed him with repeated blows.
  language: English
