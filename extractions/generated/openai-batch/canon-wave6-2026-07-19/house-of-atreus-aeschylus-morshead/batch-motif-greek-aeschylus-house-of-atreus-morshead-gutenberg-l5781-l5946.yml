canonical_text:
  quote: ''
  summary: At the end of the drama, the Furies accept Athena/Pallas's invitation to
    dwell at Athens. Athena affirms a covenant by which the appeased deities will
    remain in the city and exercise their power over mortal fate. The Chorus blesses
    Athens with fertility, civic peace, and protection from blight, famine, untimely
    death, and civil bloodshed. Athena orders the citizens and ritual attendants to
    honor and escort the newly Athenian powers with torches to their hidden underground
    shrine, identified in the stage direction as the Cave of the Furies under the
    Areopagus.
  language: English
