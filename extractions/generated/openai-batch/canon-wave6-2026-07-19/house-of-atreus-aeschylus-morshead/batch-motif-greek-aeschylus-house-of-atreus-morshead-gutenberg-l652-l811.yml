canonical_text:
  quote: Only a spear and sword, and ashes in an urn!
  summary: 'After Clytemnestra’s report, the Chorus accepts the queen’s tale, salutes
    the gods, and praises Zeus for the victory over Troy. The Chorus frames Paris/Alexander’s
    abduction of a wife from Atrides’ house as a violation of hospitality and a sin
    punished by divine vengeance. It then laments the suffering caused by the war:
    the absent wife, the bereaved household, warriors returning only as ashes, public
    anger against the Atrides, and a future doom brought by the gods and the dark
    Furies.'
  language: English
  quote_policy: quoted
