canonical_text:
  quote: ''
  summary: Clytemnestra responds to the beacon report of Troy’s fall with sacrifices,
    public proclamation, and a planned welcome for Agamemnon while declaring her fidelity.
    The herald then reports that Menelaus was separated from the Greek fleet, which
    was wrecked by a divinely charged storm, though the herald’s own ship survived
    through divine aid. The chorus closes by reflecting that Helen’s departure from
    the bridal chamber brought war and death to fleet, host, and citadel.
  language: English
  quote_policy: summarized
