canonical_text:
  quote: ''
  summary: Orestes confronts Clytemnestra, who warns him of maternal vengeance and
    calls him the snake she bore. Orestes drives her off to death. The Chorus mourns
    the double death while interpreting it as doom, delayed vengeance, divine justice,
    and liberation of the royal house. The scene then reveals Orestes standing over
    the corpses of Aegisthus and Clytemnestra with a sword and the robe used in Agamemnon’s
    murder. Orestes presents the robe as proof, invokes the all-seeing Sun as witness,
    claims justice for the killings, and also recognizes blood-pollution and grief.
    The Chorus ends by foreseeing further woe.
  language: English
  quote_policy: summarized
