candidate_motifs:
- id: motif:1
  label: succession of oracular authority
  taxonomy_refs:
  - wisdom
  basis: The Priestess presents the Delphic oracle as passing from Earth to Themis
    to Phoebe to Apollo, who voices Zeus’ decrees.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy link to wisdom is based on the passage’s explicit oracle
    and prophecy language; no broader external genealogy is used.
- id: motif:2
  label: blood-stained suppliant at a sacred altar
  taxonomy_refs: []
  basis: Orestes is found crouching at the central altar for refuge while holding
    a bloody sword and a wool-twined olive bough.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage shows supplication and blood-guilt markers but does not yet
    narrate a completed purification rite.
- id: motif:3
  label: monstrous pursuers temporarily subdued by divine power
  taxonomy_refs: []
  basis: The Furies sleep near the altar after Apollo says they have been subdued
    by his craft, yet he warns that they will continue to hunt Orestes over land and
    sea.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage identifies them as hunters and enemies, but their full juridical
    or avenging function develops outside this excerpt.
- id: motif:4
  label: divinely directed flight to judgment and asylum
  taxonomy_refs:
  - departure
  - divine_judgment
  basis: Apollo instructs Orestes to flee to Pallas’ city, embrace her ancient image,
    and find judges and persuasive pleas for deliverance, while Hermes escorts him.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: high
  cautions: The judgment itself is only anticipated in this passage, not enacted.
- id: motif:5
  label: cleansing after bloodshed under divine patronage
  taxonomy_refs: []
  basis: Apollo is described as healer, prophet, and cleanser of homes, and he claims
    responsibility for Orestes’ matricide by command while promising protection.
  evidence_refs:
  - ev:8
  - ev:11
  confidence: medium
  cautions: The excerpt names Apollo as cleanser and patron but does not depict an
    actual cleansing action.
- id: motif:6
  label: Dionysiac rending of Pentheus
  taxonomy_refs: []
  basis: In the Priestess’s invocation, Bacchus is said to have led his Maenad host
    and devised Pentheus’ death, with Pentheus rent piecemeal.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an embedded allusion in an invocation, not the main enacted scene
    of the passage.
comparison_claims:
- id: claim:1
  claim: The Priestess visually compares the sleeping Furies to Gorgons, but immediately
    says the comparison is inadequate.
  claim_level: visual_similarity
  target: Gorgons
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: low
  limitations: The passage itself weakens the comparison by saying the word Gorgons
    is insufficient and does not establish identity or shared origin.
- id: claim:2
  claim: The Priestess compares the Furies to painted Harpies associated with Phineus’
    board, while also distinguishing them as wingless and black.
  claim_level: visual_similarity
  target: Harpies snatching food from Phineus’ board
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:7
  confidence: low
  limitations: The comparison is explicitly visual and partial; the passage denies
    a full match by noting that the Furies are wingless.
- id: claim:3
  claim: The invocation briefly aligns Bacchus, Maenads, and Pentheus with a Dionysiac
    pattern of Pentheus’ dismembering death.
  claim_level: same_motif
  target: Pentheus dismembered by Maenads
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a compact allusion and does not narrate the
    full Pentheus story.
