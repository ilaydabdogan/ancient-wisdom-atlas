canonical_text:
  quote: ''
  summary: 'Opening passage of The Furies: the dramatis personae and settings are
    given; the Pythian Priestess invokes the Delphic divine succession and local powers,
    enters Apollo’s temple, returns terrified, and reports Orestes as a blood-stained
    suppliant at the central altar with the Furies sleeping nearby. Apollo promises
    protection, sends Orestes to Athena’s city and shrine for judgment, and orders
    Hermes to guide him.'
  language: English
  quote_policy: summarized
