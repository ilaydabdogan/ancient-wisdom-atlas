canonical_text:
  quote: We are the children of eternal Night, / And Furies in the underworld are
    called.
  summary: The Furies invoke Mother Night, complain that Leto's son has taken from
    them a consecrated matricide refuge-seeker, and describe their Fate-given office
    of pursuing kin-blood murderers through life and into the realm of death. They
    assert a dark rite of blood vengeance. Athena enters from above, asks who they
    and the statue-clinging stranger are, hears their claim against Orestes, rejects
    oath-formalism as sufficient justice, accepts adjudication, and asks Orestes to
    state his case as a sacred suppliant.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker invokes Mother Night as the one who brought the speaker forth,
    and describes the speaker as a torment to living and dead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says Leto's stripling son has dishonored them by taking away a
    refuge-seeker who had been consecrated to them as a rightful victim for slaying
    his mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chorus describes a hymn of hell over the victim that brings frenzy, confounds
    sense and will, entwines the soul, and wastes it as with fire.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fate is said to have assigned the Furies the service of remaining beside mortals
    stained with kin-blood and hunting them onward to the Silent Land and realm of
    death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Furies say they sprang from the womb of Night and that immortal gods must
    not touch the privilege assigned to them; their rites are dark rather than festal
    and white-robed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Furies say they act when an ancient line falls and kindred hands slay
    within the household, pursuing the slayer so that blood atones for blood and new
    pain answers ancient wrong.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Furies say they stand apart from the high gods, are abhorred by Zeus,
    leap upon their prey, trip and cast them down, and reduce formerly great people
    to low estate in the underworld.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Furies say the guilty person does not perceive their nearness; a cloud
    of guilt surrounds him, and the mirk of hell rises around his hearthstone.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Furies call themselves queens mindful of solemn vengeance, say tears and
    prayers do not avert them, and describe themselves as moving in unhonoured darkness
    with a torch of sunless regions.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Athena enters from above, says she heard the cry from far away by Scamander,
