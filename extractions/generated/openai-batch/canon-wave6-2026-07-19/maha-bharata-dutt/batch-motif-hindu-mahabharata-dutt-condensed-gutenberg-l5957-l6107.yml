canonical_text:
  quote: ''
  summary: After Duryodhan's death, Dhrita-rashtra orders his chariot prepared and
    summons Gandhari and the Kuru women to visit the battlefield. The royal women
    leave the palace in grief, casting aside ornaments and loosening robes and hair.
    At the battlefield, Gandhari and the mourners see corpses, weapons, scavenging
    animals, and supernatural flesh-eaters. Gandhari addresses Krishna, describing
    widows, mothers, fallen heroes, scattered jewels and weapons, and the indignity
    of kings and warriors lying on the bloodied ground. When she sees Duryodhan, she
    faints in anguish.
  language: English
  quote_policy: summarized
