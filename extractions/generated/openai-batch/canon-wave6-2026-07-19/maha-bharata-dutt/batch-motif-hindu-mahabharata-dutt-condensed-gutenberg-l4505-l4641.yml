canonical_text:
  quote: ''
  summary: Bhishma declares limits on whom he will fight. Krishna advises Arjun to
    place Sikhandin, described as born female and divinely made a warrior, before
    Bhishma. Arjun objects to the stratagem because of his filial reverence for Bhishma,
    but Krishna urges him onward. In battle, Arjun places Sikhandin at the front;
    Bhishma, remembering his oath, drops his weapons and falls. Both sides mourn,
    and the dying Bhishma counsels Duryodhan to end the war and grant Yudhishthir
    his kingdom, but Duryodhan remains unmoved.
  language: English
  quote_policy: summarized
