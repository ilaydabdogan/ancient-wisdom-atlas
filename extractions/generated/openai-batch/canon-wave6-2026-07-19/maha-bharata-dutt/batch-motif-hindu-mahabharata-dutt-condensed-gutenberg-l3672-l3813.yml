canonical_text:
  quote: Krishna pleads for peace and virtue, blessings unto you and all!
  summary: In a royal assembly, Krishna urges Dhrita-rashtra to prevent war, spare
    kinsmen and armed nations, and restore a share of rule to the Pandavs after their
    sufferings. Bhishma and Drona then advise Duryodhan to accept Krishna's counsel,
    warning of kin-slaying, divine vengeance, and defeat by Krishna and Arjun.
  language: English
  quote_policy: quoted
