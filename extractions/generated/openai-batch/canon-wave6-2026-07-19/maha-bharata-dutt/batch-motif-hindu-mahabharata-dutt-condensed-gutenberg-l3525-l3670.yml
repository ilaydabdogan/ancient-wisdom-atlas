canonical_text:
  quote: ''
  summary: A war-advocating speaker argues that Yudhishthir, after exile and concealment,
    must reclaim Indra-prastha from Duryodhan by force if necessary. Drupad then counsels
    sending heralds for alliances while also sending a priest with an offer of peace.
    Peace messages fail; the passage states that the gods ordained fatal war. Krishna
    goes to Hastina, addresses Dhrita-rashtra, urges him to avert kinsmen’s slaughter
    by restraining his sons, and argues that peace between Duryodhan and Yudhishthir
    would strengthen the Kuru realm.
