canonical_text:
  quote: ''
  summary: Narad praises Satyavan’s virtues but declares that he is destined to die
    one year later. Savitri’s father urges her to choose another husband, but Savitri
    insists that a maiden chooses only once and remains pledged to Satyavan. Narad
    accepts her firmness, the marriage is blessed, and Savitri lives in the forest
    serving Satyavan and his parents. As the foretold day approaches, she undertakes
    a three-night vow of fasting and vigil, prays, offers oblations to Fire, receives
    blessings against widowhood, and asks to accompany Satyavan when he goes with
    his axe into the dark jungle.
  language: English
  quote_policy: summarized
