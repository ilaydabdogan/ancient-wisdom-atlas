canonical_text:
  quote: ''
  summary: Bhishma has Sahadeva bring the arghya to Krishna, who accepts it. Sisupala
    angrily objects to Krishna receiving the highest honor and lists other kings,
    elders, priests, teachers, and warriors whom he considers more deserving. Krishna
    answers by recounting Sisupala's repeated offenses and states that he had promised
    Sisupala's mother to forgive one hundred faults, but that the limit has now been
    exceeded. Krishna's discus beheads Sisupala. Sisupala's soul is described as cleansed
    and coming to Krishna. Rain, lightning, earth tremor, and thunder follow; the
    assembled monarchs react variously, rishis and Brahmans praise Krishna, and Yudhishthir
    orders funeral rites and royal honors for the dead.
  language: English
  quote_policy: summarized
