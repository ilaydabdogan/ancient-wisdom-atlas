canonical_text:
  quote: ''
  summary: Gandhari laments over the bloodied body of Duryodhan, recalls his departure
    for battle, affirms that a warrior slain in battle reaches the warrior's heaven,
    and grieves for his widow and family. Yudhishthir then orders proper funeral rites
    for all slain warriors, friends and enemies alike. Vidura and others prepare pyres
    with fragrant woods, robes, oil, ghee, and broken war gear; named heroes and countless
    unnamed dead are cremated with libations, hymns, and lamentations. Afterward Dhrita-rashtra
    and Yudhishthir go to the Ganga, where Kuru women and widows arrive to perform
    holy rites for the departed chiefs.
  language: English
  quote_policy: summarized
