canonical_text:
  quote: ''
  summary: Draupadi uses granted boons from Dhrita-rashtra to free the Pandava brothers
    from slavery and declines to ask further. Yudhishthir, deprived of empire, leaves
    with Draupadi and his brothers for exile. Vidura shelters Pritha, blesses the
    exiles, frames exile as a moral trial and discipline, and invokes divine aid.
    Pritha laments parting from Draupadi and blesses her for the forest path.
  language: English
  quote_policy: summarized
