canonical_text:
  quote: ''
  summary: Salya taunts Karna by praising Arjun's prowess. Karna drives into battle
    and fights Yudhishthir. Yudhishthir wounds Karna, but Karna recovers, destroys
    Yudhishthir's armour, standard, chariot, and horses, and lets him flee while insulting
    him. In his tent, Yudhishthir rebukes Arjun for not yet killing Karna. Krishna
    says Arjun has vowed Karna's death. Yudhishthir insults Arjun and tells him to
    yield Gandiva. Arjun angrily draws his sword against his elder, but Krishna restrains
    him by invoking honour, scripture, and virtue; Arjun obeys with tears.
  language: English
  quote_policy: summarized
