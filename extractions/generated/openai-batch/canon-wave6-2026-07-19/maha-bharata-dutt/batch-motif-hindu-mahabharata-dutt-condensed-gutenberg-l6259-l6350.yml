canonical_text:
  quote: ''
  summary: At the banks of Ganga, mourners perform water oblations for slain relatives
    and heroes. Pritha reveals to her sons that Karna, killed by Arjun and known to
    them under another lineage, was her eldest son and had a Sun-inspired birth. The
    Pandavas, especially Yudhishthir, grieve the slain elder brother. Further oblations,
    ablutions, and a sorrowful return to Hastina follow.
  language: English
  quote_policy: summarized
