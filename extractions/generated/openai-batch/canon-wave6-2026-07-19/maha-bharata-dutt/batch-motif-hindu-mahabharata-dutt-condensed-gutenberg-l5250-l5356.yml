canonical_text:
  quote: ''
  summary: Duryodhan accuses Drona of favoring the sons of Pandu. Drona rebukes him,
    affirms his duty, and says Heaven has willed that either Arjun or Drona will die
    that day. Warriors perform a dawn sun-facing rite and return to battle. Drona
    devastates the Panchala side, killing Drupad's grandsons and then Drupad and Virata.
    Bhima kills an elephant named Aswa-thaman, whose name matches Drona's son; a distorted
    report reaches Drona. Yudhishthir gives a technically true statement about the
    dead elephant, but Drona hears only part of it. Dhrista-dyumna then kills Drona,
    and Arjun mourns his teacher.
  language: English
  quote_policy: summarized
