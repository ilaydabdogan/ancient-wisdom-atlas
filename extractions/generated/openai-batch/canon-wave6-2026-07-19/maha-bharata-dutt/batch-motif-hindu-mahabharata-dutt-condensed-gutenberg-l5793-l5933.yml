canonical_text:
  quote: ''
  summary: Kripa urges Duryodhan to spare the remaining warriors and restore Yudhishthir's
    kingdom, but Duryodhan refuses peace as too late. Yudhishthir arranges the Pandava
    force and kills Salya. Sahadeva kills Sakuni, Bhima kills Duryodhan's brothers,
    and Duryodhan flees to a lake. The Pandavas find him; Duryodhan challenges them,
    and Bhima answers with a list of remembered wrongs. Bhima and Duryodhan fight
    with maces until Bhima, remembering his vow, breaks Duryodhan's thigh with a foul
    but fatal blow. A voice resounds through sky and earth, beings tremble, darkness
    falls, and inherited anger remains after battle.
  language: English
  quote_policy: summarized
