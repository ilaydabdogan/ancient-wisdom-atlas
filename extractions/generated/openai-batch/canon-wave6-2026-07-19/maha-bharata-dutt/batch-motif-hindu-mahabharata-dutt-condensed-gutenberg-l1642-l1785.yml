canonical_text:
  quote: ''
  summary: Duryodhan, jealous after Yudhishthir's imperial sacrifice, works with Sakuni,
    an expert at false dice, to bring about Yudhishthir's ruin through gambling. Yudhishthir
    loses wealth, empire, brothers, himself, and Draupadi, and the family is declared
    enslaved. Draupadi contests the legality of the wager, but Duryodhan sends Duhsasan
    to force her into the council hall. Duhsasan seizes her by her consecrated hair
    and drags her before the assembly, where she appeals to elders for protection.
  language: English
  quote_policy: summarized
