canonical_text:
  quote: ''
  summary: Draupadi and Pritha weep as Pritha's sons, dressed in deer-skin, come before
    her in shame. Pritha laments their suffering, their coming forest wandering, her
    widowhood, and the loss of Pandu and Madri. She begs her children and Draupadi
    not to leave, invokes divine and human helpers, asks that at least Sahadeva remain,
    and is consoled by her children before they turn toward the jungle. Kuru women
    escort Pritha to Vidura's palace and mourn, while Dhrita-rashtra is troubled by
    forebodings.
  language: English
  quote_policy: summarized
