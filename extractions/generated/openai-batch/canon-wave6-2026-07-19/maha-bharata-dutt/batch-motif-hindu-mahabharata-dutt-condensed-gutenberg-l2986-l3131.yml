canonical_text:
  quote: ''
  summary: Arjun, disguised as Brihannala, asks Draupadi to persuade Prince Uttara
    to let him drive the battle-chariot. Draupadi, also in disguise, recommends Brihannala,
    though Uttara hesitates. A Matsya princess directs Arjun, and he drives Uttara
    to a dark sami tree where the Pandavas' weapons are hidden in wrappings resembling
    corpses. Uttara unwraps the cache, marvels at the bows, arrows, and swords, and
    Arjun identifies Gandiva and other weapons as belonging to himself and his brothers.
  language: English
  quote_policy: summarized
