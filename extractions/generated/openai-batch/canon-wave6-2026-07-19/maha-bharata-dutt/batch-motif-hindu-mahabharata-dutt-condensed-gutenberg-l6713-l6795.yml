canonical_text:
  quote: ''
  summary: 'The passage summarizes concluding events after the main epic war: Dhrita-rashtra,
    Gandhari, and Pritha retire to the forest, see the slain dead, and die in a holy
    forest fire; Krishna and Valadeva die after disorders among the Vrishnis and Andhakas,
    and the Yadava city is swallowed by the ocean; the Pandavas install Prakshit and
    depart for the Himalayas, where all but Yudhishthir die; Yudhishthir ascends to
    heaven, undergoes trial and purification, receives a celestial body, and is introduced
    by Indra to Krishna, his brothers, Draupadi, and other immortalized warriors and
    kin.'
  language: English
  quote_policy: summarized
