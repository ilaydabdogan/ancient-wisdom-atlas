canonical_text:
  quote: ''
  summary: After Bhishma's fall, Drona becomes commander of the Kuru forces and vows
    to capture Yudhishthir. Arjun refuses to kill his preceptor but vows to protect
    Yudhishthir. Abhimanyu fights Paurava and Jayadratha; Salya intervenes and is
    met by Bhima in a mace duel. Drona continues pressing toward Yudhishthir until
    Arjun returns. The next morning Drona defeats Panchala warriors, including Satyajit,
    while Pandav warriors appear with varied standards, chariots, and horses.
  language: English
  quote_policy: summarized
