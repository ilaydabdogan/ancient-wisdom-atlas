canonical_text:
  quote: ''
  summary: In a public trial of skill for Panchala's princess-bride, many royal suitors
    fail to bend Drupad's bow. Karna nearly completes the attempt but withdraws after
    the bride refuses to wed a Suta's son. Arjun, disguised among Brahmans, prays
    to Isana, bends the bow, shoots through the disc, hits the target, receives celestial
    and public acclaim, and is given the bridal garland and robe. The defeated suitors
    respond with anger.
  language: English
  quote_policy: summarized
