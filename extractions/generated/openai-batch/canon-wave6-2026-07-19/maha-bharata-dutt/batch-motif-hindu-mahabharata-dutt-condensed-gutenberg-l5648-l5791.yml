canonical_text:
  quote: ''
  summary: Arjun apologizes to Yudhishthir for drawing his sword after words about
    yielding his weapon, and Yudhishthir forgives him. Arjun then returns to battle
    with Krishna as driver and fights Karna, whose chariot is driven by Salya. Both
    warriors appeal to rules against striking a helpless opponent, but Karna first
    attacks Arjun while his bow is broken, and later Karna's own chariot wheel sinks.
    Krishna rebukes Karna by recalling earlier wrongs, after which Arjun, remembering
    Abhimanyu, kills Karna. In the aftermath, Kripa tells Duryodhan that the Kuru
    forces are leaderless and urges an end to battle.
  language: English
  quote_policy: summarized
