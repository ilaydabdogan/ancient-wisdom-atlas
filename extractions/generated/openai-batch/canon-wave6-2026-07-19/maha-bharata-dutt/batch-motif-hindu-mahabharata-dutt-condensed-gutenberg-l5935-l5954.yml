canonical_text:
  quote: ''
  summary: After Drona and Drupad have died, Aswa-thaman is driven by vengeance. At
    midnight, amid dark omens and a battlefield of the dying and slain, he enters
    the enemy tents silently, kills Dhrista-dyumna and Sikhandin, and smothers Draupadi's
    sleeping children before dawn. He then goes to the dying Duryodhan beside clear
    waters, where Duryodhan blesses him and dies cheered by vengeance.
