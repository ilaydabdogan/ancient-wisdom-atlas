canonical_text:
  quote: ''
  summary: The passage describes battle standards and battlefield actions involving
    Drona, the Pandavas, Duryodhan, Bhagadatta, Arjun, Karna, and others, then turns
    to the fatal day of Abhimanyu. Drona forms a circular battle-line; Abhimanyu enters
    it alone, defeats several opponents, denounces and wounds Duhsasan for earlier
    wrongs against the Pandavas and Draupadi, kills Lakshman, and is finally enclosed
    by Jayadratha and six warriors while his standard, car, weapons, and driver are
    destroyed.
  language: English
  quote_policy: summarized
