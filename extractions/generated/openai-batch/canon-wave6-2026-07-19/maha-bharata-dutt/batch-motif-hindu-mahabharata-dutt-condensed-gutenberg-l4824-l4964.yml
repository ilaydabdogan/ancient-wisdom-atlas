candidate_motifs:
- id: motif:1
  label: Warriors identified by heraldic battle emblems
  taxonomy_refs: []
  basis: The passage presents a sequence of standards or signs for named warriors,
    including vessel, celestial, and animal devices.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a battlefield emblem pattern rather than a named taxonomy motif
    in the supplied list.
- id: motif:2
  label: Infant associated with a water-vessel
  taxonomy_refs:
  - miraculous_child
  basis: Drona's sign is explained by the statement that tender infant Drona rested
    in a water-jar.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The passage only states that the infant rested in a water-jar; it does
    not narrate a full birth or childhood episode here.
- id: motif:3
  label: Enemy who is also kin
  taxonomy_refs: []
  basis: Karna and Arjun are described as dearest foemen and nearest kin as they meet
    in battle.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not elaborate the kinship relation in this excerpt.
- id: motif:4
  label: Lone hero enters a fatal circular battle formation
  taxonomy_refs:
  - labyrinth_initiation
  basis: Drona makes a circular battle-line, the Pandavs fail to force a passage,
    Abhimanyu enters alone, and the circle later closes around him.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:11
  confidence: medium
  cautions: The passage describes a military circle, not an explicit labyrinth or
    ritual initiation; the taxonomy link is functional and provisional.
- id: motif:5
  label: Vengeance for a queen's public humiliation
  taxonomy_refs: []
  basis: Abhimanyu confronts Duhsasan by recalling the dice trick and the dragging
    of Yudhishthir's queen by her hair, then says he owes Duhsasan's death to Queen
    Draupadi.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The revenge is voiced by a warrior in battle; no divine or judicial agency
    is explicit in this passage.
- id: motif:6
  label: Many-against-one encirclement of a young hero
  taxonomy_refs: []
  basis: Jayadratha and six car-borne warriors close the fatal circle, and Abhimanyu
    fights seven chiefs alone as his chariot and weapons are destroyed.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage cuts off before the full death scene is completed, though
    the section title and surrounding language frame it as fatal.
- id: motif:7
  label: Fatal dawn before heroic fall
  taxonomy_refs: []
  basis: The section opens with a blood-red morning and repeated statements that the
    day is fatal for Abhimanyu.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The omen-like reading relies on descriptive framing; the passage does
    not state a supernatural omen.
