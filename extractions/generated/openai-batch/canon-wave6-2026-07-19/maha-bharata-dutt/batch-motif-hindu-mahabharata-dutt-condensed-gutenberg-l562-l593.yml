canonical_text:
  quote: ''
  summary: A speaker addresses Bhima and his brothers' lineage as god-inspired, praises
    Karna as an armed and royal warrior, and challenges objectors to combat. The crowd
    applauds as evening falls; Duryodhan leaves with Karna, while Pandu's sons and
    senior warriors depart silently. The people disagree over whether Arjun, Karna,
    or Duryodhan won. Pritha privately recognizes Karna as her boy and rejoices at
    seeing him crowned king of Anga. Duryodhan allies himself with Karna against fear
    of Arjun's prowess, and Yudhishthir judges Karna the mightiest warrior.
  language: English
  quote_policy: summarized
