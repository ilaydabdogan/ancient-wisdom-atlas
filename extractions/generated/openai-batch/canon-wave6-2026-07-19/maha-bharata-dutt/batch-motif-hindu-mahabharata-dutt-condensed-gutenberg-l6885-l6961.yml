canonical_text:
  quote: ''
  summary: The translator explains that the old epic has been enlarged by later matter
    but that its main incidents and characters remain recoverable. He describes his
    plan to translate selected main passages and link them with notes, while condensing
    the war books more severely because of their prolix battle narration. He concludes
    that the scheme presents a vast Sanskrit epic in a much shorter English poetic
    form.
  language: English
