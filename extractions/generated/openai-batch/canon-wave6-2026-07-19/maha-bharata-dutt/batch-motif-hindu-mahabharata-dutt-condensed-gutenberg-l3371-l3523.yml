canonical_text:
  quote: ''
  summary: After the end of the Pandavas' banishment, Yudhishthir demands restoration
    of Indra-prastha. Duryodhan refuses despite counsel from elders, and both sides
    prepare for war. In Virata's council hall, Krishna urges peaceful restoration
    through an envoy while noting Duryodhan's hostility. Valadeva also advises an
    envoy and opposes war, but tells Yudhishthir to seek Duryodhan's grace. Satyaki
    angrily rejects Valadeva's counsel and defends Yudhishthir's conduct in the dice
    game.
  language: English
  quote_policy: summarized
