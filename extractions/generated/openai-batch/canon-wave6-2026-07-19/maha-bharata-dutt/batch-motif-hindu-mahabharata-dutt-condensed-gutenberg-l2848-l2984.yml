  summary: The passage closes an episode of Savitri in a dark jungle, then introduces
    the Pandavas’ year of concealment in Virata’s kingdom. It explains their disguises,
    notes weapons hidden in a tree, and begins the cattle-lifting episode in which
    Trigarta and Kuru forces attack Matsya. A cowherd reports the theft of sixty thousand
    cattle to prince Uttara, urges him to recover them, and Uttara boasts that he
    will do so if given a skilled chariot-driver.
