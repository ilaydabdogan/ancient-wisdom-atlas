canonical_text:
  quote: a True Woman's Love is not conquered by Death
  summary: The passage summarizes the Pandavs' forest exile with Draupadi, incidents
    involving Krishna, Arjun's acquisition of celestial weapons, Duryodhan's capture
    and release, and Draupadi's abduction and rescue. It frames the forest book as
    full of ancient legends, introduces the Savitri episode as a tale of love stronger
    than death, depicts Draupadi's hardship and vow, and begins Markandeya's narration
    of Savitri with King Aswapati's childlessness, austerities, and the manifestation
    of the goddess of Savitri from altar fire.
  language: English
  quote_policy: quoted
