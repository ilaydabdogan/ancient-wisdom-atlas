canonical_text:
  quote: ''
  summary: Yudhishthir prepares and conducts the aswa-medha sacrifice at Hastina.
    Pavilions, dwellings, ritual structures, hospitality, feasts, priests, sages,
    kings, attendants, animals, stakes, Soma rites, gifts, and a golden eagle-shaped
    altar are described. Vyasa instructs Yudhishthir that the sacrifice and gifts
    may purify the stain of war and kin-slaying.
