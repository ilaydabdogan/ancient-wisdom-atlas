  summary: 'The passage narrates successive battle scenes: Bhishma devastates the
    Pandav forces; Yudhishthir seeks Krishna''s aid; Arjun and Bhishma contend while
    celestial beings watch; Drona defeats Dhrista-dyumna until Bhima intervenes; Bhima
    kills Kalinga leaders; Arjun''s advance with Krishna causes Kuru panic; Duryodhan
    accuses Bhishma of partiality; Bhishma replies that Duryodhan is doomed because
    of unjust deeds and rejected counsel, then returns to battle.'
  language: English
  quote_policy: summarized
