- id: motif:3
  label: divine judgment against an unjust ruler
  taxonomy_refs:
  - divine_judgment
  basis: Bhishma tells Duryodhan that he is doomed by righteous Heaven because of
    unholy deeds, wrongs, theft of kingdom, plots, and rejected counsel.
  evidence_refs:
