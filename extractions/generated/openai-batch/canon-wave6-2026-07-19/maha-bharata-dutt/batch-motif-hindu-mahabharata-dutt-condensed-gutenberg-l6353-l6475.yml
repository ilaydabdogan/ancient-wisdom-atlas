canonical_text:
  quote: ''
  summary: The passage introduces Book XII, Aswa-medha, and summarizes post-war instructional
    episodes before turning to Yudhishthir's horse sacrifice. Yudhishthir, troubled
    by the carnage of war, is advised by Vyasa to perform the Sacrifice of the Horse.
    The custom is described as a royal rite in which a horse wanders freely, its detention
    signals war, and its unopposed passage indicates submission. Arjun escorts the
    horse, wins conflicts where it is stopped, and returns with it to Hastinapura.
    Yudhishthir orders preparations for the rite, and Brahmans and architects lay
    out an ornate sacrificial arena.
  language: English
  quote_policy: summarized
