canonical_text:
  quote: ''
  summary: Rejected royal suitors denounce Drupad and the swayamvara outcome, threaten
    violence, and advance in arms. Drupad flees among Brahmans. Bhima and Arjun rise
    to face the attackers; Bhima uproots a tree as a weapon and Arjun stands with
    bow in hand. Krishna recognizes the sons of Pandu beneath Brahman robes, identifies
    Arjun, Bhima, Yudhishthir, and the twins, and recalls their escape from Duryodhan's
    fire plot. Krishna then appeases the monarchs, who leave, while Arjun leads the
    princess away by the hand.
  language: English
  quote_policy: summarized
