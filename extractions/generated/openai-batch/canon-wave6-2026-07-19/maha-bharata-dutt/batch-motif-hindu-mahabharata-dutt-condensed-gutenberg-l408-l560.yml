canonical_text:
  quote: ''
  summary: Karna repeats Arjun's martial feats, is welcomed by Duryodhan, and seeks
    combat with Arjun. The rivals exchange challenges while divine and atmospheric
    signs divide them. Kripa questions Karna's lineage; Duryodhan answers by crowning
    Karna king of Anga through ritual anointment and asks only for his friendship
    in return. A charioteer then appears and hails Karna as his son; Bhima insults
    Karna's low status, and Duryodhan defends martial worth over birth.
  language: English
  quote_policy: summarized
