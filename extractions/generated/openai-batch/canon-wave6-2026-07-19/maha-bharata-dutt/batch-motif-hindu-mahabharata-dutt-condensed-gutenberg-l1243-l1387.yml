canonical_text:
  quote: ''
  summary: At Yudhishthir's rajasuya rite, he asks kinsmen and elders to support the
    sacrifice, distributes ritual duties, receives tribute from assembled monarchs,
    feeds and gives gifts to Brahmans and the poor, undergoes abhisheka, and presides
    over a learned and ritually pure assembly. Narad perceives the kings as divine
    incarnations and Krishna as Narayana. Bhishma instructs that the foremost arghya
    should be offered to Krishna, whose presence gives sanctity and splendour to the
    rite.
  language: English
  quote_policy: summarized
