canonical_text:
  quote: |-
    Joins her hands to Abhimanyu's, and with cake and parched rice,
    On the altar brightly blazing doth the holy sacrifice.
  summary: Arjun asks the Matsya monarch to give his daughter in marriage to Abhimanyu,
    and the monarch consents, honoring an alliance with Pandu's race. Yudhishthir
    approves and invites royal guests to Upa-plavya. Krishna, Subhadra, Abhimanyu,
    allied clans, chiefs, and kings arrive with gifts. The wedding is celebrated with
    music, feasting, performances, bridal attendants, hand-joining, altar sacrifice,
    libations, and large royal and social donations.
  language: English
  quote_policy: quoted
