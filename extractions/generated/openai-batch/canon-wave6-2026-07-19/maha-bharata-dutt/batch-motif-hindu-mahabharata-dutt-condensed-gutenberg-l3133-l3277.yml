canonical_text:
  quote: '"Meet Duryodhan in the battle, win thy father''s stolen kine!"'
  summary: Arjun identifies Pandava weapons, reveals that the Pandavas and Draupadi
    have been living in disguise in Virata's court, arms himself, is recognized by
    the Kuru side through his standard, bow, shell, and arrows, directs Uttara toward
    Duryodhan to recover stolen cattle, routs the Kuru soldiers and rescues the herd.
    Virata later recognizes the Pandavas as royal princes and offers his daughter
    to Arjun, who refuses because he regards her as a daughter-like pupil.
  language: English
  quote_policy: quoted
