canonical_text:
  quote: ''
  summary: The passage recounts Draupadi becoming the common wife of the five sons
    of Pandu after their mother unknowingly commands them to share what they have
    brought home. It then comments on the anomalous nature of this marriage custom,
    describes the partition of the Kuru kingdom, the Pandavas' founding of Indra-prastha,
    Yudhishthir's decision to perform the Rajasuya imperial sacrifice, and the arrival
    of kings, elders, chiefs, and tribute for the rite.
  language: English
  quote_policy: summarized
