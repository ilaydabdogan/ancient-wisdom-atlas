canonical_text:
  quote: ''
  summary: Savitri obtains permission to accompany her husband Satyavan into the forest.
    Satyavan gathers fruits and branches, falls ill, and dies with his head in Savitri's
    lap. Yama appears with a noose, identifies himself as monarch of the dead, removes
    Satyavan's thumb-sized vital spark, and goes southward. Savitri follows him, argues
    that law and love do not divide husband and wife, and receives from Yama a boon
    restoring sight and vigor to her husband's banished father.
  language: English
  quote_policy: summarized
