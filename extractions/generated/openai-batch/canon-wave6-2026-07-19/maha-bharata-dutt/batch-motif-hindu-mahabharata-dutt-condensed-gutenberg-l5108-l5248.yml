canonical_text:
  quote: Krishna then a prayer whispered; came a friendly sable cloud
  summary: Arjun refuses to fight Drona, whom he treats as an acharya and father-like
    figure, and drives with Krishna toward Jayadratha. After resting and tending the
    exhausted horses, Arjun resumes the pursuit. Kuru chieftains with distinctive
    standards guard Jayadratha. Krishna causes a cloud to veil the sun, the Kuru side
    mistakes the darkness for evening, and Arjun breaks through to kill Jayadratha
    before sunset. The battle continues into torchlit night; Bhima kills Duryodhan's
    brothers, Karna kills Ghatotkacha, and at dawn Duryodhan laments the Kuru losses
    to Drona.
  language: English
  quote_policy: quoted
