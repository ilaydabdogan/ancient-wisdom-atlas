canonical_text:
  quote: '"and thy lord shall live again"'
  summary: Savitri follows Yama after Satyavan’s death, argues that a faithful wife
    follows her husband even into death, wins boons for Satyavan’s father and lineage,
    and finally receives Satyavan’s life. She returns to Satyavan’s body in the forest,
    where he awakens. The couple prepare to return through the dark jungle to his
    anxious parents.
  language: English
  quote_policy: quoted
