canonical_text:
  quote: ''
  summary: A divine Prayer-Maiden blesses King Aswapati and, through Swaymbhu, promises
    him a noble daughter after his penance and sacrifices. The queen conceives and
    bears Savitri, who grows in extraordinary beauty. When no suitor seeks her, Aswapati
    tells her to choose a husband herself. Savitri travels with attendants through
    woods, hermitages, and sacred fords, gives charity, and returns to court before
    Aswapati and the rishi Narad. She names Satyavan, son of the dispossessed blind
    king Dyumat-sena, as her chosen husband. Narad warns that disaster attends the
    choice, while praising Satyavan’s truth and virtue.
  language: English
  quote_policy: summarized
