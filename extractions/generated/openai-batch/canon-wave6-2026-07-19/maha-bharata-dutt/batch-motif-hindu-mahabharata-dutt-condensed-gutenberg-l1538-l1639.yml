canonical_text:
  quote: ''
  summary: After rites for Chedi's monarch, Sisupala's son is installed as king. Yudhishthir
    completes the rajasūya sacrifice, receives ritual recognition from Brahmans and
    monarchs, and sends departing guests home with escorts. Krishna asks leave to
    return to Dwarka; Yudhishthir grieves and credits Krishna with the success of
    the rite. Krishna takes leave of Pritha, Draupadi, and Subhadra, receives benedictions,
    mounts his falcon-bannered chariot, gives Yudhishthir counsel on ruling with care
    and humility, and departs while Yudhishthir returns home sorrowfully.
  language: English
  quote_policy: summarized
