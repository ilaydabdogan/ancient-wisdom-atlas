canonical_text:
  quote: ''
  summary: The translator explains why selected passages from the Maha-bharata were
    rendered in English verse rather than prose. He compares the problem with prose
    translation of Homer, cites authorities who argue that poetry loses truth without
    musical movement, describes the Sanskrit Sloka metre and the choice of an English
    metrical analogue, acknowledges help from Edmund Russell, gives examples comparing
    Sanskrit and English metres, and states the limits of preserving Sanskrit epic
    majesty and simplicity in English.
  language: English
