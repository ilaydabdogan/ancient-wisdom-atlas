canonical_text:
  quote: ''
  summary: A richly decorated arena is prepared for Draupadi's swayamvara. Draupadi
    enters with a bridal garland, a Brahman lights the Fire with offerings, and Drupad's
    son announces that a noble-born suitor who shoots five arrows through a whirling
    discus into a suspended target may claim her. Numerous kings and warriors assemble
    as suitors. The Pandu sons are present in Brahman disguise; Krishna recognizes
    them, while others do not. Gods and celestial beings come to witness the scene,
    and heavenly blossoms descend.
  language: English
  quote_policy: summarized
