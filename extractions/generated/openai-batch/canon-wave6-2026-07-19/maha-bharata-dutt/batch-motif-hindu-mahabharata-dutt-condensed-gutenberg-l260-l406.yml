canonical_text:
  quote: ''
  summary: A public arms exhibition is described. Bhima and Duryodhan duel with maces
    until Drona stops the combat. Drona then summons Arjun, who performs a rite, receives
    public acclaim, and demonstrates exceptional archery and weapon skill. Afterward
    Karna arrives dramatically, is identified as Pritha's eldest son with a solar
    birth, and challenges Arjun, though the two are unknown to each other as brothers.
  language: English
  quote_policy: summarized
