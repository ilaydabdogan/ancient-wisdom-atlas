canonical_text:
  quote: ''
  summary: The sons of Pandu, threatened by Duryodhan's plot, escape a burning house
    through a subterranean passage, live disguised as Brahmans, and journey toward
    Panchala for the princess's Swayamvara. Brahmans describe the princess as altar-born
    and her brother as born armed from sacrificial fire. Drupad prepares a difficult
    bow, discus, and target contest for the wedding assembly, hoping Arjun will win
    his daughter.
  language: English
