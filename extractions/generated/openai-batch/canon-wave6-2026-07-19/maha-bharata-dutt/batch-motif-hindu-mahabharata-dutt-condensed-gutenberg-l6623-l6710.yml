canonical_text:
  quote: ''
  summary: 'The passage describes Yudhishthir''s horse sacrifice: animals are tied
    and immolated, celestial beings attend, priests slay and cook the horse, Draupadi
    is placed beside the dead steed as Queen of yajna, and the smoke and offerings
    sanctify the rite. Vyasa blesses Yudhishthir, receives and returns the king''s
    gift of realm and wealth, while Krishna advises obedience to Vyasa. The rite is
    said to cleanse Yudhishthir''s sins and affirm his royal standing; gifts are distributed
    to priests, monarchs, and relatives, and Krishna then departs for Dwarka.'
  language: English
  quote_policy: summarized
