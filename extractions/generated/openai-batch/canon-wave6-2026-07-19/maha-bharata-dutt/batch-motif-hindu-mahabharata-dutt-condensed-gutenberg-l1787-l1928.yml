canonical_text:
  quote: ''
  summary: In the Kuru assembly Draupadi protests her humiliation and the silence
    of the warriors. Karna argues that Yudhishthir's gambling has made her subject
    to the Kurus. Bhima, constrained by Yudhishthir's act, vows to break Duryodhan's
    offending knee. Ominous animal cries interrupt a ritual setting, and Dhritarashtra,
    frightened by the portent, rebukes Duryodhan and offers Draupadi a boon; she asks
    that Yudhishthir be freed from bondage and that her son not bear the status of
    a slave's son.
  language: English
  quote_policy: summarized
