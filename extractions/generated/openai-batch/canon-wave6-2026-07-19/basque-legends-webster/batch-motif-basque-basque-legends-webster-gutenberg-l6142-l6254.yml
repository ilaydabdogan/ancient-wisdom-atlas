canonical_text:
  quote: ''
  summary: A mother’s son, Juan de Kalais, becomes a sailor, spends his wealth to
    secure burial for a dead debtor, exchanges a later cargo for a young woman named
    Marie Madeleine, and marries her. Marie sends him with tokens to the King of Portugal.
    A jealous old general throws Juan into the sea, takes Marie back, and seeks to
    marry her. Juan survives seven years on a rock, is transported by a speaking fox
    to the king’s house on the eve of the wedding, is recognized by Marie through
    her ring, exposes the betrayal at the feast, and the general is executed.
  language: English
  quote_policy: summarized
