canonical_text:
  quote: ''
  summary: A king captures and imprisons a Tartaro. One of the king’s sons frees the
    Tartaro after bargaining for the return of a ball and secretly taking the key
    from his mother. The Tartaro promises future service. After the king angrily threatens
    the unknown releaser, the boy’s mother sends him away with money and a fleur-de-lis.
    The boy, Petit Yorge, loses his money, calls the Tartaro, and receives instructions
    to become a gardener for another king. His destructive gardening is followed by
    renewed growth and three flowers for the king’s daughters. The youngest daughter
    favors him and says she is soon to be eaten by a serpent. Petit Yorge calls the
    Tartaro again, receives a horse, clothing, and a sword, enters the carriage where
    the young woman waits behind seven doors, secretly cuts pieces from her seven
    robes, and confronts the approaching serpent.
  language: English
  quote_policy: summarized
