canonical_text:
  quote: ''
  summary: Jesus Christ, traveling with his disciples, receives the last coin of an
    old discharged soldier. Offered either gold or Paradise, the soldier chooses a
    sack of gold that can draw whatever he names into it. He uses it for food and
    later traps and beats the devil. After death, Peter refuses him Paradise and sends
    him to hell, but the devil refuses to admit him. He returns to Paradise, where
    God orders Peter to admit him because he had been an enemy of the devil.
  language: English
  quote_policy: summarized
