canonical_text:
  quote: ''
  summary: A youngest brother carries off a young lady on a horse, obtains the white
    blackbird, and returns toward home. His two brothers, who have lied to their father,
    plot against him, throw him and the lady into a cistern, and try to steal the
    bird. A fox, later identified as the soul of a dead man whose debts the son had
    paid, rescues them. The blackbird returns to the white horse, and the party reaches
    the father/king, where the lady, bird, and horse make sounds; the bird restores
    the king's sight. The son recounts his labours and debt-payments. He marries the
    young lady, and the wicked brothers are sent into the desert for penance.
  language: English
  quote_policy: summarized
