literal_observations:
- id: obs:1
  text: The author says the theory that Basque ancestors were Iberians is possible
    but not proved, and that proposed readings of inscriptions, legends, and names
    are disputed or inadmissible.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that, as far as the author knows, Basques have no original
    and well-defined anthropological characteristic other than their language.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The custom called couvade is described as a husband going to bed with the
    new-born infant when his wife is confined, as if brooding over it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author says no modern or contemporaneous writer has found couvade among
    the Basques, and that historical testimony is limited to a Strabo passage and
    later allusions connected with Béarnais.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Prince L. L. Bonaparte is said to have found that in the Basque dialect of
    Roncal the moon is called Goicoa; the passage states that Jaungoicoa is the Basque
    word for God and could be interpreted as Lord Moon or our Lord the Moon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage summarizes Strabo as saying that the Keltiberians and their northern
    neighbours honor an anonymous god by dances before their doors at night during
    the full moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author says it still must be proved that the Keltiberians and their northern
    neighbours were Basques before the moon-worship evidence can support a Basque
    claim.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports Strabo as saying that among the Cantabrians daughters
    inherited to the detriment of their brothers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Cordier connected this inheritance report with primogeniture
    without distinction of sex in western Pyrenean customs, while Balasque argued
    that the fact was not peculiar to the Basques and reflected a Celtic or Gallic
    patrimony-preservation principle.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author closes by apologizing for brevity and citing a Tamil poet, Tiruvalluva,
    in support of avoiding useless words.
  category: speech
  evidence_refs:
  - ev:5
