canonical_text:
  quote: ''
  summary: 'The passage first gives editorial comparison notes about story openings,
    endings, Basque house inscriptions, and the relation of collected tales to French
    fairy tales and possibly Eastern materials. It then begins the tale ''Ass''-Skin'':
    a servant named Faithful is trusted with keys, falsely blamed after robbers steal
    treasure, condemned, spared by executioners who substitute an ass''s heart, and
    disguised in an ass-skin. She becomes a goose-keeper in another royal household.
    An old woman gives her a nut that produces splendid clothing, enabling her to
    attend a royal feast in a silver robe. The young king dances with her, she escapes,
    reports the event as Ass''-skin, and is struck with a slipper when the king learns
    she knew of the mysterious guest.'
  language: English
  quote_policy: summarized
