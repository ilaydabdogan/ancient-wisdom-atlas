  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The king sees the carriage, hears that a sick man wishes to see him, recognizes
    the widow's son by the ring, and embraces him without regard to the illness.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The king tells his wife that the sick man once restored him to life and that
