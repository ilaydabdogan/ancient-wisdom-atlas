canonical_text:
  quote: ''
  summary: A widow's son witnesses the killing of a king's son, is falsely condemned,
    proves the murder with blood-hounds, carries the body to Rome, and under the Holy
    Father's instruction sees the king's son restored to life. Later the widow's son
    becomes horribly diseased; a monk says he can be cured only by washing in the
    king's blood. The restored king recognizes him by a ring, his wife sacrifices
    their child for the cure, the widow's son is healed, and the child is found alive
    again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The widow's son and the king's son are received in a house, given supper and
    a bed, and at midnight the owner enters with a large knife while the mistress
    holds a light and a servant holds a basin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owner, mistress, and servant cut the throat of the king's son and carry
    him downstairs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The widow's son escapes onto the roof, calls for justice, reports the killing,
    is not believed, is imprisoned, and is condemned to death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before execution, the widow's son asks for two blood-hounds to search the
    house; the dogs lead investigators to the cellar, where the king's son is found
    with his crown.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The widow's son is freed, asks for the body, puts it in a sack, carries it
    on his shoulders, and reaches Rome exhausted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Holy Father instructs the widow's son to place the head on the body at
    the moment of the Elevation; when he does so, the body trembles and the king's
    son speaks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The two companions return to the oak where they first met, renew their promises,
    and the king's son gives the widow's son a ring as a keepsake.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After returning home, the widow's son is covered with a frightful leprosy-like
    disease with an infectious smell, though his mother does not smell it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
