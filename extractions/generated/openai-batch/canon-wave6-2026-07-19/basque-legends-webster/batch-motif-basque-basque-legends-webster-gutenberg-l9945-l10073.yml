canonical_text:
  quote: ''
  summary: 'The passage gives an English translation of the Song of Altabiscar: a
    cry is heard in the Basque mountains, Etcheco Jauna and his dog are alerted, an
    invading northern host comes through Ibañeta pass, Basque defenders signal with
    horns, hurl rocks from the heights, shoot arrows, and annihilate the enemy. Carloman
    is urged to flee and Roland is named as lying dead. The song ends with Etcheco
    Jauna returning home while eagles consume the battlefield dead. The accompanying
    prose commentary discusses the song’s alleged discovery, its former acceptance,
    its use as a corroboration of the Chanson de Roland, and arguments that it is
    modern and inauthentic.'
  language: English
  quote_policy: summarized
