canonical_text:
  quote: "“a white blackbird, which gave sight to the blind”"
  summary: A blind king with three sons hears of a white blackbird that can restore
    sight. The two elder sons set out separately but lose their money and horses at
    cards to three young women at an inn and are imprisoned for debt. The youngest
    son resists the card game, pays his brothers’ debts and another debtor’s debt,
    and reaches the king who owns the blackbird. That king demands a young lady from
    another king in exchange. A fox advises the youngest son, but the son’s actions
    cause the young lady to sing and wake the household; her king then demands a white
    horse from another king. The fox again advises him; after a noisy saddle incident,
    the youngest son shows his crown, explains his mission, receives the horse, and
    sets off.
  language: English
  quote_policy: quoted
