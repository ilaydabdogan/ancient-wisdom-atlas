  text: A poor gentleman sits sadly at a crossroads because he lacks the means to
    live.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stranger offers the poor gentleman as much money as he likes if, at an appointed
    time, he can tell the devil's age.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man becomes rich and later worries because the appointed time is near
    and he has not learned the devil's age.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The man's wife tells him to cover himself first with honey and then with feathers,
    go to the crossroads, move on all fours, and pass around and between the devil's
    legs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The devil is frightened by the disguised man and says that in all his years
    he has never seen such a frightful animal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The man returns home, reports success to his wife, and is no longer afraid
    of the devil.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A poor woman with many children goes far away to beg and reaches the city
    of the fairies, where she receives many alms.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The queen of the fairies offers the poor woman gold and much money if the
    woman gives her the child when she is confined, with the condition that the child
    be brought up in the woman's law.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The woman's husband agrees that the fairy queen will be godmother, and the
    woman returns to accept the offer.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the birth of a daughter, the queen arrives with a mule laden with gold;
    after the christening the godmother and child fly away.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The fairy queen takes the child to her house in a corner of a mountain and
    names her Pretty-Rose; another goddaughter is a little dog named Rose.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: Pretty-Rose has a glint of diamonds in the middle of her forehead and grows
    up playing with the dog.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Pretty-Rose becomes tired of the mountain dwelling, and the dog says the queen
    has another fine house beside the king's highway.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: At the house by the king's highway, a king's son sees Pretty-Rose on a balcony,
    is struck by her beauty, and asks her to go with him.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The dog Rose says Pretty-Rose shall not go anywhere without her, and then
