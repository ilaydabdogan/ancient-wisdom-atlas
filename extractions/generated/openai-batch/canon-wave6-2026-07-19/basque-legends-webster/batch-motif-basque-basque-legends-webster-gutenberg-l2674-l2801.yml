canonical_text:
  quote: ''
  summary: In "The Devil's Age," a poor gentleman receives wealth in exchange for
    a future answer about the devil's age. His wife devises a disguise of honey and
    feathers; at the crossroads the disguised man frightens the devil, who says he
    has never seen such an animal in all his years, thereby revealing the needed information.
    In "The Fairy-Queen Godmother," a poor mother begs in the city of the fairies.
    The fairy queen offers gold to become godmother to the woman's next child; after
    the christening the queen flies away with the child, Pretty-Rose, raises her in
    a mountain dwelling with a dog named Rose, and later Rose plots to drug the godmother
    with liqueur so a king's son can arrive at midnight in a flying chariot.
  language: English
  quote_policy: summarized
literal_observations:
