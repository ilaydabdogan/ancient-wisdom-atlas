canonical_text:
  quote: ''
  summary: A king's debauched son named Dragon leaves with a soldier companion, enters
    an apparently empty castle, and hears a voice from under a fig tree. To see and
    free the speaker he must endure successive nights of silent torture until cockcrow.
    Each morning the buried young lady is more visible, and after a final mutilation
    ordeal Dragon is restored and she is freed. The three flee to a city, where the
    young lady instructs Dragon to meet her fasting at the fountain of the Four Cantons.
    He eats a small nut while waiting, falls asleep, and she tells his companion to
    warn him not to eat anything when she returns.
  language: English
  quote_policy: summarized
