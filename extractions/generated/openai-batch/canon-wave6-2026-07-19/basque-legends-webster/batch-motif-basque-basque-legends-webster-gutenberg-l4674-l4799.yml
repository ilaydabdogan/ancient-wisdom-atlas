canonical_text:
  quote: ''
  summary: A poor young man named Fidel leaves his mother to better himself, enters
    service with a gentleman who owns a house and stable, and is aided by a speaking
    white mare. The mare reveals that the master is a devil and that Fidel will be
    enchanted if he remains seven years. Fidel escapes on the mare; the mare creates
    fog, hail, and a river to stop the pursuing monster, who drowns. The mare then
    directs Fidel to serve as gardener at a king's residence, where the garden works
    by itself and produces three flowers daily for the king's three daughters. The
    youngest daughter falls in love with Fidel and insists that only he can cure and
    marry her, while an old nurse who is a witch hides to listen.
  language: English
  quote_policy: summarized
