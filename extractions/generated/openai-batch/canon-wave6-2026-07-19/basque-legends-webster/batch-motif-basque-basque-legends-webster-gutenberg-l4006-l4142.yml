canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which three identical gentlemen come
    to a king's palace, a princess cannot distinguish her husband, the serpent-killer
    identifies himself, an old woman is burned, and the newly married pair receive
    a castle. An editorial note compares the tale with a Gaelic version. The next
    tale begins with a traveling lad who finds a speaking snuff-box that grants wishes,
    creates gold, builds a dazzling castle, and enables his marriage to a king's daughter.
    The king's wife has the snuff-box stolen and uses it to carry the palace and household
    to the far side of the Red Sea, leaving the young couple behind. The young man
    begins a quest for the lost snuff-box and palace, consults the Moon, and is directed
    toward the Sun.
  language: English
  quote_policy: summarized
