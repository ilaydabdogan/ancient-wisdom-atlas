  quote: ''
  summary: Editorial notes compare Basque tale elements with Gaelic, Spanish, French,
    Italian, Indian, and Latin analogues. The notes discuss possible transmission
    routes, recurring incidents such as paying a dead man's debts, a helper appearing
    as a hermit or fox, a rival who maroons the hero, a child exposed and found by
    a gardener, serpent/dragon and well episodes, theft of a bay filly, borrowing
    fire, and sibling figures represented as trees or birds.
  language: English
  quote_policy: summarized
