canonical_text:
  quote: ''
  summary: Three brothers leave home, follow distant smoke to Basa-Jaun's castle,
    and become servants after Basa-Andre hides and then reveals them. Their sister
    later learns of them, follows, becomes a servant, and is weakened by Basa-Jaun
    sucking her finger through a door. The siblings kill Basa-Jaun, but Basa-Andre
    transforms the brothers into oxen with teeth placed in washing water. The sister
    threatens Basa-Andre, receives instructions involving hazel sticks, restores the
    brothers to human form, and they live together in the castle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A farmer's wife has three sons who ask their mother for a ball and a penny
    roll so they can go from country to country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a forest at night, the eldest and second brothers see nothing from a tall
    tree, while the third brother sees a thin, distant column of smoke and suggests
    going toward it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers reach a grand castle; Basa-Andre answers the door, warns that
    Basa-Jaun will eat them if he catches them, and hides them in three corners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Basa-Jaun detects hidden people by smelling, has the brothers brought out,
    and asks the first two whether they will be his servants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The brothers remain with Basa-Jaun and go hunting with him the next day until
    evening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The little sister grows up, is accused after moving maize from her mistress'
    heap to her own, and learns from her mother that she had brothers who went away
    long ago.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sister asks for a distaff and a penny cake, sets off, reaches Basa-Jaun's
    house, and agrees to become his servant.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: After some days the siblings recognize one another and embrace.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sister becomes thin and says that every evening the master asks her to
    put her little finger through the door and sucks it, making her sad and languid.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Basa-Andre is absent, the brothers and sister plot to kill Basa-Jaun
    if they can catch him in a ravine, and they kill him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Basa-Andre brings three large teeth and tells the sister to put one tooth
