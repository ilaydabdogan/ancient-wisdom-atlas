canonical_text:
  quote: ''
  summary: A one-eyed giant named Tartaro catches a powerful young man. After the
    giant eats a sheep and sleeps, the captive blinds him with a red-hot spit, escapes
    through the guarded door by using a sheep skin and bell, receives a ring from
    Tartaro's witch mother that announces his location, and cuts off his own finger
    to escape pursuit. Reported variants alter the setting and escape route and end
    with Tartaro dying after following the ring toward a precipice or bog.
  language: English
  quote_policy: summarized
