canonical_text:
  quote: ''
  summary: A fisherman catches a speaking fish three times. After releases and domestic
    pressure, he takes the fish home; the fish instructs that its body be divided
    among the wife, mare, and dog, resulting in three identical sons and corresponding
    animal offspring, with a boiling well as a danger sign. One son later travels
    with horse, dog, and sword, rescues a princess from a seven-headed serpent, exposes
    a false claimant through retained tongues and robe pieces, marries the princess,
    and then sees a mysterious moonlit castle from which no one returns.
  language: English
  quote_policy: summarized
