- id: obs:4
  text: The Satans influence Pharaon through Sara's beauty, stir up strife between
    Abraham's and Lot's herdsmen, direct the wickedness of Sodom's inhabitants, and
    stir up war against Abraham and Lot through Turkish kings with Biblical names.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Turkish kings first conquer Lot and slay his partisans, including the
