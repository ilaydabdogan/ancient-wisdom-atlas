canonical_text:
  quote: ''
  summary: The passage summarizes the plot of a Basque Pastorale titled "Abraham."
    Satan and Bulgifer announce a plan to torment Abraham and weaken Christian faith,
    then repeatedly instigate Abraham's troubles while angels intervene to save him.
    The action includes episodes involving Sara in Egypt, strife between herdsmen,
    Sodom, war involving Lot, Agar and Ismael in the desert, the birth and baptism
    of Isaac, the sacrifice of Isaac as the climax, Abraham's death, and a concluding
    chant.
  language: English
  quote_policy: summarized
