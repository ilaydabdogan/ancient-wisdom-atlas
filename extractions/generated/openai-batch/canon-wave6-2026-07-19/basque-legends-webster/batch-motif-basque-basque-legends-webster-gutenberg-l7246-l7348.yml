  label: quest for water that restores life and youth
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The water makes stones live, restores the brothers and horses, makes the
    imprisoned queen young again, and in the variant makes the aged king twenty years
    old.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The available taxonomy terms are broad; the passage specifically emphasizes
    rejuvenating and life-restoring water.
- id: motif:3
