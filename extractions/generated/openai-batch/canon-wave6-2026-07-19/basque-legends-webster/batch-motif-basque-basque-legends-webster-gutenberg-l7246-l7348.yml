canonical_text:
  quote: ''
  summary: A young man ignores a warning not to look round and is changed to stone.
    His sister, warned by the rotting of an apple, disguises herself as a man, receives
    a bottle and instructions from a saintly monk, reaches the top of a mountain despite
    terrifying cries, takes water that restores life and youth, and revives her petrified
    brothers and their horses. A speaking bird later arranges a royal visit and reveals
    to the king that his wife has been imprisoned underground and that his children
    have been falsely represented as animals. The king frees and rejuvenates the queen
    with the water and punishes the queen's sisters. A following note summarizes a
    more common variant in which an aged king's three sons seek the same water; the
    youngest is aided by an old woman and a fox, is betrayed by his elder brothers,
    and finally uses the water to make his father young.
  language: English
  quote_policy: summarized
