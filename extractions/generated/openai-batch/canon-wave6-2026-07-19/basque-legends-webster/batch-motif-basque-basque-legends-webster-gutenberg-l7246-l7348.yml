  taxonomy_refs: []
  basis: After the apple rots, the sister dresses like a man, travels where others
    have failed, obtains the water, and restores her brothers.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The excerpt begins after at least one earlier quest attempt, so the full
    sequence of failed brothers is only partly visible in this passage.
- id: motif:4
  label: mountain trial with terrifying voices
  taxonomy_refs:
  - ascent
