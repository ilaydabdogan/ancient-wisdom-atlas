canonical_text:
  quote: ''
  summary: 'The passage concludes a Fidel/Ezkabi tale: magical water is exchanged
    for golden apples, restores youth and sight, and later restores Fidel''s wife
    to life after he kills her with the king''s sword; Fidel''s proofs and shining
    head lead to his coronation and his rivals'' exile. An editorial note summarizes
    a close variant. The passage then begins ''The Lady Pigeon and Her Comb,'' in
    which a poor son leaves home, meets a Tartaro, and is instructed to take the middle
    pigeon-skin from three bathing young women until its owner promises help.'
  language: English
  quote_policy: summarized
