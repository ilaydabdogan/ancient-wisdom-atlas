candidate_motifs:
- id: motif:1
  label: Magical water exchanged for golden apples
  taxonomy_refs:
  - sacred_exchange
  basis: The water is not sold but given in exchange for golden apples, and the exchange
    is later central to the feast confrontation.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The passage states an exchange involving magical water; the taxonomy term
    'sacred_exchange' is broader than the literal wording.
- id: motif:2
  label: Life-restoring and rejuvenating water
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The water rejuvenates an old blind dog, restores the king's youth and sight,
    and revives Fidel's dead wife.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The rejuvenation examples are not deaths; the resurrection taxonomy is
    directly supported by the wife's revival.
- id: motif:3
  label: Hidden shining head as sign for kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: Fidel's wife reveals his shining head, after which the king says the crown
    will shine better there and crowns him.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain the origin of the shining head within this
    line range.
- id: motif:4
  label: Hero vindicated by concealed proofs at royal feast
  taxonomy_refs: []
  basis: Fidel speaks at the feast under the king's sword warning and produces the
