canonical_text:
  quote: ''
  summary: 'A tale of two brothers described as an idiot and a fool: the elder goes
    to the mountain with sheep and leaves the other to bathe their aged mother. The
    son at home puts her into boiling bathwater and kills her; the brothers bury her
    in the garden, then burn the house, go into the woods, meet witches, cure a king''s
    daughter, and one marries her. Editorial notes compare the opening with reported
    or related cases involving persons described by the source as idiots, crétins,
    or imbeciles.'
  language: English
  quote_policy: summarized
