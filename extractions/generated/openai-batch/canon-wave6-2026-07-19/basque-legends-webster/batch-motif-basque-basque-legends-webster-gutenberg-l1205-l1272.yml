  quote: "“The serpent lay with his head resting on the summit of the Pic du Midi
    de Bigorre...”"
  summary: 'The passage introduces the Heren-Suge or seven-headed serpent by comparing
    Basque and Pyrenean dragon stories with St. George and other dragon traditions.
    It summarizes the Serpent d''Isabit legend: a vast serpent spanning Pyrenean valleys
    devours animals and people by inhalation, villagers melt iron into a red-hot mass,
    the serpent swallows it, dies in agony, and the water from its mouth forms Lac
    d''Isabit. The passage also notes variants involving gunpowder, the death of the
    hero in this class of Basque legends, and resemblances or contrasts with Gaelic,
    French St. George, Deccan cobra, Tartaro, and princess-rescue tales.'
  language: English
