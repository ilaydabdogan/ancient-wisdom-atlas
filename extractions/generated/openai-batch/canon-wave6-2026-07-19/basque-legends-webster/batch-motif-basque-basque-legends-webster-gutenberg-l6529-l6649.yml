canonical_text:
  quote: ''
  summary: Ass'-skin, warned that the king will kill her if she returns, is repeatedly
    aided by an old woman who gives her a walnut and then a peach containing splendid
    clothing. She attends royal dances, gives the name Braf-le-mandoufle, escapes
    while the king is distracted, and later receives his promise of marriage and diamond
    ring. The queen suspects that Ass'-skin is the unknown lady, sends her to the
    king with broth, and Ass'-skin hides the ring in the bread. The king recognizes
    the ring, recovers from illness, and arranges a wedding feast, where the bride
    says she has knowledge that may displease some guests and the king threatens silence
    with a sword.
  language: English
  quote_policy: summarized
