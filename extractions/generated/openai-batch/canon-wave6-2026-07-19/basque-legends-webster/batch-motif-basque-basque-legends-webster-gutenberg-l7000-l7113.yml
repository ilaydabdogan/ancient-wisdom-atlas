canonical_text:
  quote: ''
  summary: A poor cobbler gives his three daughters, one after another, to a wealthy
    gentleman in exchange for money. Each daughter is given keys and forbidden to
    enter one chamber. The elder two enter, see dead bodies, and are imprisoned underground.
    The youngest enters, arms herself, finds her sisters and a starving royal youth,
    then kills the gentleman when he stoops for the keys and frees the prisoners.
    A following note gives another Blue Beard version in which a murderous widower
    is delayed by his wife until her brothers arrive and imprison him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor cobbler has three daughters and lacks enough work or food to maintain
    them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A gentleman offers the cobbler money in exchange for one of his daughters,
    and the father gives him the eldest daughter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gentleman gives the eldest daughter keys to the house and forbids her
    to use one key for one room.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eldest daughter enters the forbidden room, sees heaps of dead bodies,
    drops the key, admits entering, and is placed in an underground dungeon with little
    food, described as human flesh.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The second daughter is likewise given the keys, enters the forbidden chamber,
    sees many dead bodies, drops and stains the key, admits entering, and is taken
    underground like her sister.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gentleman persuades the cobbler to send the third daughter by promising
    money and saying the sisters will be happier together and returned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The third daughter goes directly to the forbidden chamber, sees many dead
    people, takes a sabre from the weapons there, and hides it under her dress.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The third daughter finds her two sisters and a young man nearly dying with
    hunger and cares for them until the gentleman returns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the gentleman asks if she entered the room, the third daughter says yes,
    deliberately drops the keys, and cuts off his head as he stoops to pick them up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The third daughter frees her sisters and the young man, who is the son of
    a king, then marries the young man and leaves her father with the two daughters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A noted variant concerns a widower who has killed twenty wives and marries
    a twenty-first wife with two brothers; her entry into the forbidden chamber is
    detected by blood on the key.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the noted variant, the wife writes to her brothers and delays her husband
    by dressing for death until the brothers arrive, prevent her death, and put him
    in prison.
  category: sequence
  evidence_refs:
  - ev:6
