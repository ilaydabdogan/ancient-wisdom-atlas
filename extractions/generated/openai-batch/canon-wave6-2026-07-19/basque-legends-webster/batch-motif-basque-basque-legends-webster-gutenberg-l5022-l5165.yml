canonical_text:
  quote: ''
  summary: A lad is set impossible tasks by a king/master identified as a devil. A
    young lady, the master's daughter, helps him complete a timed agricultural task
    with magic combs, recover a ring from a river after he cuts her into pieces and
    throws them into the water, and tame a horse and fillies that she says are her
    father and sisters in animal form. The master then offers one daughter as wife,
    and the young lady instructs the lad how to recognize her while his eyes are shut.
  language: English
  quote_policy: summarized
