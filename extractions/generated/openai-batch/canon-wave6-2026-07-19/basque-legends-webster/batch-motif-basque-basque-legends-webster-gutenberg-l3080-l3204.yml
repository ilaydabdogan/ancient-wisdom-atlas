canonical_text:
  quote: ''
  summary: 'A labourer overhears an inn woman planning to charm his newly born child.
    He imitates her ointment-aided flight, returns home, and beats a white cat near
    his wife''s room. Later, after livestock losses, he uses a consecrated taper to
    trap and kill the witch in cat form. Reduced to misery, he accepts money from
    a gentleman/devil on condition that he identify the material of the devil''s chalice
    or lose his soul. Hiding at a cross-roads, he overhears witches reveal the answer:
    Sunday fingernail parings cut by Christians. He gives the answer, and the devil
    and his company depart to hell in fire and flame.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The labourer leaves his wife when she is near confinement and lodges at a
    crowded inn in a dark room without windows near the kitchen.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inn woman tells her daughter to check whether the labourer is asleep and
    says she must go to charm the newly born infant.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The inn woman lifts a stone under the hearth, removes a saucepan containing
    ointment, rubs herself with it using a brush, and recites a travel formula before
    departing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The labourer copies the anointing and formula, but changes the wording; he
    arrives home torn by thorns and with clothes in strips.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A great white cat comes to the wife's bedroom door and meows; the labourer
    strikes it with a stick, returns to the inn, and the next day finds the inn woman
    very ill.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the child is saved, the household suffers repeated misfortunes, including
    the deaths of cows and other animals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: An old woman advises placing a consecrated taper under a peck measure in the
    stable; at midnight a cat-form witch gets astride the ox, and the labourer kills
    her with a stick.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A gentleman offers the labourer as much money as he wishes, with the condition
    that after a year he must tell with what the devil makes his chalice or his soul
    will belong to them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The labourer hides at a cross-roads, where witches gather, dance, exchange
    news, and reveal that the devil's chalice is made from Christians' fingernail
    parings cut on Sunday.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the appointed cross-roads meeting, the labourer gives the answer; the devil
    and the others go off in fire and flame to the bottom of hell.
  category: sequence
  evidence_refs:
  - ev:10
