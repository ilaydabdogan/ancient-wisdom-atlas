canonical_text:
  quote: ''
  summary: The passage describes Basque versification and improvisation, village fête
    verse contests, and two forms of Basque drama, especially the Pastorale. It characterizes
    the Pastorale as a survival of medieval mystery or miracle plays, performed outdoors
    with music, dance, comedy, tragedy, chant, chorus, stage personnel, conventional
    props, and single-sex casts. It also notes its literary sources, staging, anachronisms,
    and the stage image of Mahomet as a wooden puppet idol in certain plays.
  language: English
  quote_policy: summarized
