canonical_text:
  quote: ''
  summary: A young man recognizes and marries the young woman whose little finger
    is missing. She urges him to flee from her father, leaves spittle to answer in
    her place, and uses a comb to create obstacles and finally a river that drowns
    the pursuing father. At the border of Christian land she sends him for a priest
    to baptize her and warns him against being kissed; an old aunt kisses him, and
    he forgets her. The young woman then creates a hotel with free food, receives
    the husband and his companions, and uses a comb with endless powder to delay the
    first overnight guest until morning.
  language: English
  quote_policy: summarized
