canonical_text:
  quote: ''
  summary: Rose leaves a door unlocked after returning a key, and she and Pretty-Rose
    depart at midnight in the son of the king's flying chariot. Pretty-Rose loses
    her diamond-like radiance, and Rose goes to the mountain to ask the godmother
    to restore it. The godmother, also called the queen, receives Rose kindly, promises
    the restoration, and later provides magnificent wedding garments. The sisters-in-law
    question the hidden bride, the speaking little dog defends her, and the king protects
    the dog by proclamation. Pretty-Rose appears dazzling at her wedding, gives support
    to her poor parents, and later has four children.
  language: English
  quote_policy: summarized
