canonical_text:
  quote: ''
  summary: A wealthy couple lose many children before a son is born. A would-be sheep
    thief learns from a witch that she kills infants when no one blesses them after
    sneezing, and he saves the newborn by saying the protective formula. A devil nevertheless
    removes the child, leaves itself in the cradle, and the true child is raised by
    a childless coachman and his wife. The child becomes a monk, saves his real father
    from a false murder conviction by briefly restoring the dead victim to life, and
    later exposes the non-growing substitute as a devil, revealing himself as the
    couple's true son.
  language: English
  quote_policy: summarized
