canonical_text:
  quote: |-
    He has given me the order,
    The good God Himself,
    That I sacrifice Isaac
    On this mountain myself.
  summary: Excerpt from a Basque pastorale scene in which Satan and Bulgifer urge
    Abraham not to sacrifice Isaac; Abraham insists that God ordered the sacrifice
    on a mountain; Isaac prays, binds himself, and consents; Angel Gabriel stops Abraham
    at the moment of sacrifice. The prose afterward describes other Basque dramatic
    forms, including Mascarade, charivari, and impromptu comedy.
  language: English
  quote_policy: quoted
