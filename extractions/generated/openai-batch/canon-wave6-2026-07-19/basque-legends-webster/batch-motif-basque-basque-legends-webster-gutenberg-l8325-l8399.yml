canonical_text:
  quote: ''
  summary: A secluded saintly orphan girl is fed daily by a dove until she has a proud
    thought about another young woman being taken to prison or execution. A priest
    tells her she has been punished and instructs her to witness three births and
    their gifts. She sees newborns marked by white, red, and blue cords that reveal
    their futures. The white-corded royal son is fated for execution at eighteen,
    but he leaves home, performs nightly penance by carrying a candle and walking
    on his knees to a chapel, is lifted by an angel with a chain, and later returns,
    marries his master’s daughter, and lives happily.
  language: English
  quote_policy: summarized
