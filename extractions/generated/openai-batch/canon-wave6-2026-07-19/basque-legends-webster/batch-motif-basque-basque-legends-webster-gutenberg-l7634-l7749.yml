canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a king rescues a princess from a
    precipice, compels a witch to restore transformed brothers, punishes the witch
    by burning, and reunites the family. It then provides editorial comparative notes
    on Basque versions of French-derived tales, Tom Thumb variants, a devil-bridegroom
    tale involving a white mare helper, and bibliographic notes on translated tale
    collections.
