canonical_text:
  quote: ''
  summary: A rival casts Juan Dekos into the sea, but an angel rescues and sustains
    him on a rock. Marie Louise returns to her royal father and is pressed to marry
    the second officer if Juan does not return after a year and a day. The angel brings
    Juan back after requiring a promise of half of his future child. Juan enters as
    a poor stranger, is recognized by Marie Louise through her handkerchief, locks
    the doors, retells his own story, exposes the second officer, and the offender
    is burned. Juan and Marie Louise marry; when the angel later demands half the
    child, Juan prepares to keep his oath, but the angel stops him and leaves the
    child to him.
  language: English
  quote_policy: summarized
