canonical_text:
  quote: ''
  summary: A sea captain marries a poor young woman and leaves her with his mother
    during a later voyage. The mother and sister mistreat the wife, reduce her to
    goose-herding and chores, and hide her husband's letters. The captain returns
    secretly as a foreign guest, observes the situation, and arranges an encounter
    in which the wife refuses to betray her husband. He reveals himself by a birthmark
    she can identify. After the reunion, he rebukes his mother and sister; his wife
    asks mercy for them, and they are sent away. A following source note discusses
    uncertain attribution and related unpublished tales or variations.
  language: English
  quote_policy: summarized
