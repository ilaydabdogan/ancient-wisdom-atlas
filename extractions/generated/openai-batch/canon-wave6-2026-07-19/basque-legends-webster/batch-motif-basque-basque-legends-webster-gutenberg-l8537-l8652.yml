  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife recounts that she had been poor and unloved, that a rich gentleman
    married and treated her kindly, and that she has had no news since being left
    at his mother's house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Asked whether she would recognize her husband, the wife identifies a mole
