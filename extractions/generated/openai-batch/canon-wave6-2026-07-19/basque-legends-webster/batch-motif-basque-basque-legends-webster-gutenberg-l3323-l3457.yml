canonical_text:
  quote: ''
  summary: The passage first frames a group of Basque tales as resembling Keltic legends
    while leaving questions of borrowing unresolved. In the tale beginning 'Malbrouk,'
    a poor woodcutter agrees for money to let a mysterious gentleman be godfather
    to his newborn; after the christening the godfather takes the child, raises him
    in a witch household, and the grown boy later visits his birth family, brings
    back his brothers, escapes a planned killing by swapping headgear with the household
    daughters, steals seven-leagued boots, and begins a quest for a king's three lost
    daughters.
  language: English
  quote_policy: summarized
