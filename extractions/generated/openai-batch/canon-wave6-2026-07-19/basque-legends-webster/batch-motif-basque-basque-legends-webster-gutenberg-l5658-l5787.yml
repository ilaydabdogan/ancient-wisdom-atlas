canonical_text:
  quote: "“I forgive you, I am your son.”"
  summary: A son who often hears a voice is disliked by his parents after reporting
    that parents would become servants to their son. His mother orders two servants
    to kill him, but one servant prevents the killing and they use a dog’s heart as
    false proof. The son travels toward Rome, is warned by the voice in a robber house,
    escapes with companions, heals a suffering young woman, receives half of her ring,
    and is made Holy Father after bells ring by themselves near Rome. His repentant
    mother later confesses in church; he forgives her, his parents die from joy, and
    he rewards the servant who spared him while punishing the servant who wished to
    kill him. The passage then begins another tale in which a poor son leaves home,
    enters a robber household, and is ordered to rob or kill a rich rider.
  language: English
  quote_policy: quoted
