candidate_motifs:
- id: motif:1
  label: Voice-hearing child persecuted for a reported prophecy
  taxonomy_refs: []
  basis: The son hears a voice saying parents will become servants to a son, and the
    mother responds by arranging his death.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not identify the source of the voice or call the prophecy
    divine.
- id: motif:2
  label: False proof of a child's murder through an animal heart substitute
  taxonomy_refs: []
  basis: The servants spare the son and carry back a big dog's heart as if it were
    his.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not state whether the mother accepts the heart as proof,
    only that the servants carry it to her.
- id: motif:3
  label: Protective warning voice at a dangerous lodging
  taxonomy_refs:
  - wisdom
  basis: The same voice warns the young man inside the hidden forest house, after
    which he hears the robbers and escapes with his companions.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The taxonomy link to wisdom is functional and cautious; the voice's nature
    is not explained.
- id: motif:4
  label: Healing of a long-suffering young woman followed by a ring token
  taxonomy_refs:
  - mystical_quest
  - sacred_exchange
  basis: The young man cures a daughter who has suffered for seven years, and her
    father gives him half of her divided ring.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The narrator explicitly says the healing method was forgotten, limiting
    detail about the cure.
- id: motif:5
  label: Miraculous acclamation to sacred office
  taxonomy_refs:
  - royal_legitimacy
  basis: Bells ring by themselves when the young man nears Rome, and the people make
    him the Holy Father.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The available taxonomy term is approximate because the office is religious
    rather than royal.
- id: motif:6
  label: Recognition and forgiveness of the penitent attempted murderer
  taxonomy_refs:
  - return
  basis: The mother confesses her crime in church, the son recognizes her, opens his
    arms, and forgives her.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The reconciliation occurs at Rome rather than through the son returning
    home.
- id: motif:7
  label: Reward of the merciful servant and punishment of the violent servant
  taxonomy_refs: []
  basis: The servant who spared the son receives the ring-half and marries the young
    woman, while the servant who wanted to kill him is sent to the mountain to make
    charcoal.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The punishment and reward are enacted by the protagonist; the passage
    does not frame them as divine judgment.
- id: motif:8
  label: Poor youth enters a robber band and receives a first robbery assignment
  taxonomy_refs:
  - trickster_boundary
  basis: In the following tale opening, the poor son joins robbers and is ordered
    to rob or kill a rich rider, though he is said to have had enough of the trade.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: low
  cautions: Only the opening of the tale is included, so the later clever-thief pattern
    is not available in this passage.
