canonical_text:
  quote: ''
  summary: A male figure is let out, kills Malbrouk's wife, puts her in a cauldron
    over a fire, and leaves with a violin. Old Malbrouk hears the violin and assumes
    his wife has killed Malbrouk, but then finds his wife half-boiled in the cauldron.
    Young Malbrouk goes to the king's house, marries the princess, receives the crown
    from the aged king, and makes his two brothers kings. The passage ends with an
    informant attribution.
