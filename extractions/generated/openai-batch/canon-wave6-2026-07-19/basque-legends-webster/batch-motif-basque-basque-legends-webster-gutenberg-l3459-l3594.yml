canonical_text:
  quote: ''
  summary: Malbrouk descends by bucket into a well, finds an underground house, and
    rescues two royal daughters from chambers where a serpent and a lion head sleep
    in their laps. After fairly dividing a sheep among a wolf, dog, hawk, and ant,
    he receives powers to transform into those animals. A woodpecker tells him that
    the third daughter is imprisoned beyond the Red Sea on an island in a closed house.
    Malbrouk becomes a hawk to reach the island, an ant to enter, and hides from a
    monster described as a horrible body without a soul, while planning for the princess
    to learn how the monster can be killed.
  language: English
  quote_policy: summarized
