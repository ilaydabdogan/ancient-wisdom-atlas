canonical_text:
  quote: ''
  summary: A mother’s three sons leave home one after another to seek service. The
    first two refuse an old woman’s request for cake and are devoured by bears. The
    third son gives the old woman cake, receives directions and a killing stick, becomes
    a shepherd, and uses the stick to kill a succession of bears. The last old bear
    offers wealth and leads him to a rich palace, but the shepherd later kills the
    bear to possess the fortune.
  language: English
  quote_policy: summarized
