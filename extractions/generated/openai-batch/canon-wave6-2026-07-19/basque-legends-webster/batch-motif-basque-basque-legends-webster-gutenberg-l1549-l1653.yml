- id: obs:3
  text: The young lady denies that the charcoal-burner is her rescuer, but the king
    treats the serpent heads as evidence and initially says she must marry him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: To delay the marriage, the king proclaims that the man who rides under a diamond
    ring hanging from a bell and pierces it with his sword will have his daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Petit Yorge asks the Tartaro for help, and the Tartaro gives him a handsome
    horse, a superb dress, and a splendid sword.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Petit Yorge enters the contest, the young lady recognizes him, and he carries
    off the ring on his sword without stopping.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The king throws a lance at the departing rider, and the lance strikes him
    in the leg.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The next day the young lady sees the gardener with his leg bandaged; when
    the king demands an explanation, the gardener says a blackthorn wounded him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the gardener shows the injury, the king and his daughter see that the
    lance is still there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Petit Yorge uncovers his bosom and shows a fleur-de-lis; the young lady calls
    him her preserver and says she will marry no one else.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Petit Yorge has dressmakers questioned about whether they made dresses with
    pieces missing; he produces pieces and the dressmakers deny delivering dresses
    that way.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Petit Yorge asks butchers whether they kill animals without tongues; the serpent
