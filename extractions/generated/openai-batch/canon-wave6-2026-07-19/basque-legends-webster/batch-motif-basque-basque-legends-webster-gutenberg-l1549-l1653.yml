canonical_text:
  quote: ''
  summary: After a serpent has been killed, a charcoal-burner falsely claims the reward.
    The king sets a mounted ring-piercing test for the right to marry his daughter.
    Petit Yorge receives horse, dress, and sword from the Tartaro, wins the test,
    is wounded by the king's lance, and is later identified as the gardener by the
    wound and a fleur-de-lis mark. He proves the false claimant wrong through dress
    pieces and the serpent's missing tongues, marries the king's daughter, reconciles
    with his father through a staged sheep-heart meal, and continues to benefit from
    the Tartaro's service.
  language: English
  quote_policy: summarized
