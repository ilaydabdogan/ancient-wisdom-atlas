- id: obs:1
  text: The young lady brings dinner to the gardener, who says he told her she would
    not be eaten and asks whether something has killed the serpent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A black charcoal-burner appears, says he killed the serpent, and shows the
    serpent's heads to support his claim to the reward.
  category: action
  evidence_refs:
