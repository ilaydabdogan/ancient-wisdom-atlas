- id: obs:1
  text: The merchant says he lost everything in a bet with Mr. Laur-Cantons because
    he could not get into the wife's house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The witch offers to arrange the matter and enters the house with a basket
    of apples by claiming to be the lady's nurse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young lady shows the supposed nurse her marriage dresses, gold chain,
    and other pretty things.
  category: action
  evidence_refs:
