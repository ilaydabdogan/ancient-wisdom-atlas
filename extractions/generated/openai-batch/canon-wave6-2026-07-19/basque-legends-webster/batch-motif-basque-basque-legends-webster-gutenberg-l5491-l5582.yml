  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The king's daughter has been seriously ill for seven years.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The disguised woman gathers flowers and herbs, associates with the king's
