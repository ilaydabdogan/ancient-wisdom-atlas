  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mr. Laur-Cantons dismounts, puts his wife into a chest, and throws the chest
    into the sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: People on the seashore see the chest, retrieve it, hear the woman speak from
    inside, and open it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: After rescue, the woman gives the rescuers a handsome present, goes to a hotel,
