    the third drink the daughter leaps out of bed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: As her reward, the woman asks to be made governor of the city.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Once installed in her palace, she summons Mr. Laur-Cantons between two policemen
