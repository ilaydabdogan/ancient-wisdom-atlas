canonical_text:
  quote: ''
  summary: A merchant who lost a wager over entering Mr. Laur-Cantons's wife's house
    receives help from a witch, who enters by pretending to be the lady's nurse and
    steals the lady's named gold chain. The chain provokes Laur-Cantons to cast his
    wife into the sea inside a chest. She is rescued, disguises herself as a gentleman,
    cures the king's daughter, becomes governor, obtains confessions from her husband,
    the merchant, and the witch, punishes the merchant and witch, pardons her husband,
    and lives happily.
  language: English
  quote_policy: summarized
