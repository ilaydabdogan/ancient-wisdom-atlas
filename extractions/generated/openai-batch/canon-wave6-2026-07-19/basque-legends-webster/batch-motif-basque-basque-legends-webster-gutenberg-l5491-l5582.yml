  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: After being threatened with the gallows, Mr. Laur-Cantons confesses that he
    threw his wife into the sea in a chest after seeing the chain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: The merchant confesses after being threatened, and the witch tells how she
