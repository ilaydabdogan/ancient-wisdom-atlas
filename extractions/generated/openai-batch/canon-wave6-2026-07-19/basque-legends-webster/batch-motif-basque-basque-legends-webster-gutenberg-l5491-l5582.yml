- id: obs:4
  text: While the dresses are being put away, the witch takes the gold chain bearing
    the lady's name, and the lady does not notice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The witch gives the chain to the merchant, and the merchant rewards her with
    a complete set of new clothes.
  category: sequence
