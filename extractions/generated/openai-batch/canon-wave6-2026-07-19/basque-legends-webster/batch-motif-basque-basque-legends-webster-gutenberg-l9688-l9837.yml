canonical_text:
  quote: ''
  summary: A bilingual Basque song and English translation opens with the repeated
    statement that Lelo is dead or killed, then depicts Rome or Octavianus besieging
    Biscay by sea and land. The speakers contrast enemy-held plains with their own
    high mountains and caverns, describe a prolonged five-year siege, losses, numerical
    imbalance, and eventual peace. A later image says great oaks yield to the constant
    strokes of a woodpecker. The accompanying commentary emphasizes the manuscript
    history, obscurity of many words, and competing interpretations of Lelo as hero,
    refrain, or glory.
  language: Basque with English translation and English commentary
  quote_policy: summarized
