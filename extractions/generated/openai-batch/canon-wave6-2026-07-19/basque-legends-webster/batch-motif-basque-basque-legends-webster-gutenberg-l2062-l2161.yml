canonical_text:
  quote: ''
  summary: A hungry fox repeatedly obtains food by arranging distractions and then
    cheating his accomplices. He tricks a wolf in a theft of curdled milk, tricks
    a blackbird in a theft of a boy's dinner basket, then leaves because he has made
    enemies. At the water's edge he pays a boatman for passage by telling three comic
    'truths,' and a first-person speaker says he learned them by the river.
  language: English
  quote_policy: summarized
