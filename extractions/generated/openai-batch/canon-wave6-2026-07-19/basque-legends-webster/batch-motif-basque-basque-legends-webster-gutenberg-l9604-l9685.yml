  summary: The passage characterizes Basque poetry as mainly lyrical rather than epic
    or narrative, comments on its oral and printed transmission, and emphasizes a
    recurrent use of allegory, especially in love songs where the beloved or lover
    may be represented through images such as a star, nightingale, flower, heifer,
    dove, quail, pomegranate, or apple. It also mentions two historical songs, the
    Leloaren Cantua and the Altabiskarco Cantua, and summarizes their reputed subjects
    and dating.
