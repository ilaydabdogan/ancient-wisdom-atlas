canonical_text:
  quote: ''
  summary: After poison is exposed through dogs dying from soup, a young lady has
    an old witch burned, sees Fidel's radiant bare head, and marries him despite her
    father's disinheritance. Fidel's hair later yields gold. When the king goes to
    war, Fidel is mocked and given an unfit horse, but a white mare arms him and instructs
    him to break the city gates, whereupon the city makes peace. Fidel hides his victory
    and returns to poverty. Later the aging blind king sends his sons-in-law to seek
    waters that restore sight and youth. The first two sons-in-law fail and remain
    in another city. Fidel sets out, meets an old woman, witnesses lizards using a
    grass to revive the dead, gathers the grass, and receives two bottles of restorative
    water to exchange for his brothers-in-law's golden apples.
  language: English
  quote_policy: summarized
