canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a fox claims half of Juan de
    Kalais’s possessions, stops Juan from cutting his child in half, reveals itself
    as a saved soul now in Heaven, and flies away as a pigeon. It then gives the tale
    “The Duped Priest,” in which Petarillo deceives a priest by selling him a supposedly
    message-carrying hare, then a supposedly reviving flute. The priest kills his
    housekeeper while imitating the trick, tries to drown Petarillo, is deceived by
    a sack substitution, and is finally pushed into the sea after being told there
    are flocks beneath it. A concluding note frames such priest tales as part of a
    Basque satirical attitude toward clerical domination despite general religiosity.
  language: English
  quote_policy: summarized
