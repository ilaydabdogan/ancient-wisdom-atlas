canonical_text:
  quote: ''
  summary: The passage contains the song “The Happy Shepherd,” in which a shepherd
    named Peter praises his modest cottage, flock, health, and freedom from fear while
    rejecting wealth as a source of sorrow. It then introduces and prints the bilingual
    cradle song “Lo! Lo! ene Maitea,” where a mother rocks, guards, and watches her
    child through night, imagines the child’s dreaming spirit flying toward heaven
    for grace, and greets the waking child with flowers. The passage ends by introducing
    “Little Peter” as another lullaby or cradle song, without giving its full text
    in the supplied excerpt.
  language: English and Basque
  quote_policy: summarized
