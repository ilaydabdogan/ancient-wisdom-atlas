canonical_text:
  quote: the monster comes only at night
  summary: The passage describes another version of a tale, compared by the source
    to Apuleius's Cupid and Psyche. In this version, a monster visits only at night;
    the woman is first terrified, then grows accustomed to it and loves it. After
    she is left alone for several days, a magnificent young man, a king's son bewitched
    into monster form until someone should love him, appears to her. They marry and
    are happy. A further unrecorded version has the father as a sailor instead of
    a king.
  language: English
