canonical_text:
  quote: ''
  summary: A ship's runner, aided by medicine and drink, disguises himself as a shipwrecked
    beggar and steals a tinder-box from a hostile old woman. She pursues him to the
    ship, tears away his skin, and renounces him and the ship. The captain reports
    to a serpent, who provides further remedy and instructs him to fire cannon rounds
    that will lead to arrest and a royal hearing. The king condemns the crew because
    cannon have been forbidden during seven years of mourning for his lost son. When
    the king inspects the ship, he finds that the serpent is his son, enchanted by
    the old woman for seven years. The prisoners are freed and rewarded.
  language: English
  quote_policy: summarized
