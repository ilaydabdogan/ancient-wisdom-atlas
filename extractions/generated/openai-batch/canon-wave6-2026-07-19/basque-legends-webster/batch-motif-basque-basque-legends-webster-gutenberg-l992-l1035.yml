canonical_text:
  quote: ''
  summary: A lad tends pigs in a forest where the Tartaro threatens to eat him. The
    lad frightens the Tartaro with nuts presented as deadly balls, wins a wood-gathering
    wager by pretending to claim many trees with thread, blinds the sleeping Tartaro
    with a red-hot spit, and escapes. He then deceives his master by placing pigs'
    tails in a fairy well or marsh, claiming the pigs sank there, and receives 100,000
    francs before returning to his family.
  language: English
  quote_policy: summarized
