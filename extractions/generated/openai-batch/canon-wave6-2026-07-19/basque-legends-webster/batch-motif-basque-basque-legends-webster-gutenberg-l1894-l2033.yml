candidate_motifs:
- id: motif:1
  label: king’s son condemned in serpent form
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: The serpent explicitly says he is a king’s son condemned for four years to
    be a serpent.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives the cause only as condemnation; it does not identify
    who imposed it or why.
- id: motif:2
  label: woman held by serpent who becomes marriage partner
  taxonomy_refs:
  - serpent
  - stolen_beloved
  basis: The third daughter is caught and held prisoner by the serpent, later says
    he promised to marry her, and is finally taken as the former wife.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:13
  confidence: medium
  cautions: The label 'beloved' is inferred from the later marriage language; the
    early captivity is involuntary.
- id: motif:3
  label: arduous search measured by wearing out shoes
  taxonomy_refs:
  - mystical_quest
  - return
  basis: The serpent states she must wear out seven pairs of shoes if she fails to
    find him, and the narrative describes her journey through successive pairs, ending
    with iron shoes.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage does not explicitly call the travel magical, though the shoe
    condition is extraordinary.
- id: motif:4
  label: recognition by gifted tokens
  taxonomy_refs: []
  basis: The handkerchief, distaff, and spindle given by the serpent are displayed
    at the king’s son’s house and lead to his recognition of the young girl.
  evidence_refs:
  - ev:5
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage presents the objects as tokens but does not assign them an
    explicit sacred status.
- id: motif:5
  label: former bride restored over new bride by parable
  taxonomy_refs: []
  basis: The king’s son uses the old and new key story to ask which should be used,
    then applies the answer to leaving the new wife and taking the former one.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage calls the former woman a wife in the king’s son’s speech,
    while earlier narration only reports a promise of marriage.
- id: motif:6
  label: third daughter surpasses elder sisters by going farther
  taxonomy_refs: []
  basis: The first two daughters return after ordinary sights, while the third daughter
