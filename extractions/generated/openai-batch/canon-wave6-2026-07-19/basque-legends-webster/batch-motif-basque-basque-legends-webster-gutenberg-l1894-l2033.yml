canonical_text:
  quote: ''
  summary: A widower’s third daughter goes farther than her sisters into a wood, is
    held by a serpent who later reveals himself as a condemned king’s son, and receives
    tokens and instructions. Her father delays her return, so she must travel until
    seven pairs of shoes are worn out. She reaches the city on the king’s son’s wedding
    day, gains entry as a spinster, displays the tokens, is recognized, and the king’s
    son dismisses the new wife in favor of the former one.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A widower has three daughters; the eldest asks to see the country and returns
    after seeing men cutting furze and mowing hay.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: The second daughter also goes out and returns after seeing the same things
    as her sister.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The third daughter follows the same road but goes farther, seeing washerwomen
    and wood-cutters and asking whether more can be seen farther on.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The third daughter goes much farther into the wood and is caught and kept
    prisoner by a serpent; after an initial period of crying and not eating, she remains
    there three years.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The serpent tells her to return after two days, saying his time is nearly
    finished and that he is a king’s son condemned for four years to be a serpent.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The serpent gives her a silver-gilt distaff and spindle and a silk handkerchief.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The serpent says that if she does not find him on her return, she must wear
    out seven pairs of shoes, six leather and one iron, before finding him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Her father refuses to let her return and confines her in a high room; she
    escapes on the fourth day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: She journeys on, buying and wearing out successive pairs of shoes until the
    seventh iron pair is nearly worn out, and then reaches a city with music.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the city she is told that a king’s son is being married that day, and she
    asks at the house whether there is spinning work for her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the kitchen she displays the silk handkerchief; the king’s son’s mother
    notices that it is like the one her son has for his marriage day.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The king’s son asks to see the handkerchief, recognizes the young girl, and
    she shows him the distaff and spindle.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: At table the king’s son tells a story about losing a key, having a new one
    made, and later finding the old one.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: When the new wife says the old key should be used if it was good, the king’s
    son says he formerly had a wife, leaves the new wife, and takes the former one.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: The tale is attributed to Gagna-haurra Hirigaray and is marked as learned
    at Guethary.
  category: other
  evidence_refs:
  - ev:14
