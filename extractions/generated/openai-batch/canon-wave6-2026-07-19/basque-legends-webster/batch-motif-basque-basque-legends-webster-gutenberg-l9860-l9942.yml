canonical_text:
  quote: ''
  summary: A Basque song describes a cry heard among the Basque mountains, an approaching
    northern army at the pass of Ibañeta, the Basques preparing darts and rolling
    rocks down the mountain slope, the destruction and flight of the enemy, the death
    of Roland, the escape of King Charlemagne, and the aftermath in which a householder
    returns home while eagles eat the dead.
  language: Basque
  quote_policy: summarized
