canonical_text:
  quote: ''
  summary: Editorial prose introduces Agot/Cagot songs as sad songs of a despised
    Pyrenean outcast group, contrasts Basque dread of the forest with greenwood-song
    delight, and presents a Basque song with English translation. In the song, two
    lovers meet at daybreak; one reports that her father has changed her sheep-pasture
    and forbidden her to speak with the other because of alleged Agot status. The
    speakers discuss parental separation, caste stigma, bodily signs said to mark
    Agots, and the role of wealth in social acceptance.
  language: Basque with English translation and English editorial prose
  quote_policy: summarized
