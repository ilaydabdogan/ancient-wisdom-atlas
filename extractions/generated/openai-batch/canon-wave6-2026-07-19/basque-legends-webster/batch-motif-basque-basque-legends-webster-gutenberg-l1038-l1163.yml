canonical_text:
  quote: ''
  summary: Petit Perroquet, an impoverished son, leaves home, becomes a gardener in
    the king's house, and gains favor. A jealous prince falsely claims that Petit
    Perroquet has boasted he can bring the Tartaro's horse and later the Tartaro's
    diamond. Petit Perroquet undertakes both tasks, crosses a river by ferry, enters
    the forest and mountain region where the Tartaro lives, hides in ferns, steals
    the horse by muffling its bell, then steals the diamond from under the sleeping
    Tartaro's pillow. Each time the Tartaro demands the stolen item back from the
    opposite side of the river, but Petit Perroquet refuses and returns to the king.
    The excerpt ends when the jealous prince next claims that Petit Perroquet can
    bring the Tartaro himself.
  language: English
  quote_policy: summarized
