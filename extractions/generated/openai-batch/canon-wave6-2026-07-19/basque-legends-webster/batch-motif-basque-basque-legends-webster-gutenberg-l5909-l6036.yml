candidate_motifs:
- id: motif:1
  label: trickster impersonates a divine figure to deceive a religious authority
  taxonomy_refs:
  - trickster_boundary
  basis: The young man uses church vestments, lights, bells, and the altar to pose
    as God before the rector and command him to bring his riches.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage presents the deception literally as a trick, not as an actual
    divine manifestation.
- id: motif:2
  label: sacred setting used for theft of wealth
  taxonomy_refs:
  - sacred_theft
  basis: The young man hides in the church and uses its ritual objects and authority
    to obtain the priest's money and riches.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: medium
  cautions: The stolen items are the priest's money and household riches; the passage
    does not state that sacred objects themselves are stolen.
- id: motif:3
  label: mock afterlife passage as ordeal
  taxonomy_refs:
  - afterlife_journey_map
  basis: The disguised young man tells the priest he is going to purgatory and then
    heaven while dragging him in a sack down the tower stairs.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a comic deception using afterlife language, not a genuine journey
    to the afterlife.
- id: motif:4
  label: threatened trickster profits from impossible or hostile task
  taxonomy_refs:
  - trickster_boundary
  basis: The mayor threatens the young man with a task intended to trap him; the young
    man completes it by deception and becomes rich while the mayor and priest are
    poorer.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage is the concluding part of the tale, so earlier task sequence
    context is incomplete.
- id: motif:5
  label: apparent fool as generous voyager
  taxonomy_refs:
  - departure
  basis: Juan Dekos is called a blockhead, is sent away as ship-master, and uses trading
    profits for acts that anger practical companions.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage begins the tale and does not yet show the later outcome of
    his generosity.
- id: motif:6
  label: payment of debts of an dishonored dead man
  taxonomy_refs: []
  basis: Juan Dekos finds a dead man exposed and spat upon because debts are unpaid,
    then spends all his money paying those debts.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The supplied passage does not show any later return or reward by the dead
