canonical_text:
  quote: ''
  summary: 'The supplied passage concludes a tale in which a young man, threatened
    by a mayor, disguises himself in church robes, impersonates God before the mayor''s
    priest-brother, obtains the priest''s money, encloses and drags the priest in
    a sack, leaves him in the mayor''s chicken-house, and then bargains for a large
    payment to open the moving sack. The passage then begins the tale of Juan Dekos,
    called a blockhead: his father sends him trading by ship; he pays the debts of
    an exposed dead man, later buys enslaved Christians including Marie Louise, returns
    with her, has her portrait made as the ship''s figurehead, and faces jealousy
    from the lame second-in-command.'
  language: English
  quote_policy: summarized
