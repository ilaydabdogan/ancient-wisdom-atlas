    becomes fine, and his voyage succeeds financially.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After returning to land, the captain forgets his vow and amuses himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a second, worse storm, the captain again vows to marry the most abandoned
    and poorest girl he can find and regrets not keeping his earlier promise; the
    weather immediately becomes fine, and he gains much money.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the captain next sees the young woman and his friends spit at her, he
    refuses to spit and says he wishes to marry her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The captain's friends laugh at his intention, and his mother objects to the
    match because the girl is not rich and is regarded as bad.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The captain goes to the girl's old house at night; she refuses to open because
    she is in bed, and he breaks open the door.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Inside, the girl is lying on a little straw and covered only by her dress;
