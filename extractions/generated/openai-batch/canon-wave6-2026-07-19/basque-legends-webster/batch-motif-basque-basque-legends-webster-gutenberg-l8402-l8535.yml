canonical_text:
  quote: ''
  summary: A poor young woman, left alone after her mother's death, is repeatedly
    slandered as bad and a thief, loses work, and is reduced to begging while people
    spit at her. A sea captain who has twice been saved from storms after vowing to
    marry the most despised or abandoned poor girl returns, refuses to spit at her,
    and declares his intention to marry her despite ridicule and his mother's objections.
    He forces entry into her poor dwelling, obtains a promise of marriage after she
    resists his approach, and then gives money to a priest to build and furnish a
    house for her.
  language: English
  quote_policy: summarized
