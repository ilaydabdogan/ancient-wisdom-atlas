- id: obs:1
  text: A soldier returns home after seven years of service with five sous in his
    pocket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three poor men ask the soldier for charity in the Name of God, and he gives
    to each despite having little money.
  category: sequence
