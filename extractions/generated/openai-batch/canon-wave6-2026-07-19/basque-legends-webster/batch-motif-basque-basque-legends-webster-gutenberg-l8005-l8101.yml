  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A widow gives her son three apples before his journey to Rome and tells him
    to judge companions by how they divide an apple with him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
