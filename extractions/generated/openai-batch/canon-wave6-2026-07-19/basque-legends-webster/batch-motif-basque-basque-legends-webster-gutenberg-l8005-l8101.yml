canonical_text:
  quote: ''
  summary: The passage contains a tale in which a returning poor soldier gives alms
    in the Name of God, receives a warning message about a rich man’s place in hell,
    and causes the rich man to amend his charity. It then begins another tale in which
    a widow’s son travels toward Rome, uses his mother’s apples to test companions,
    finds a generous royal companion, vows friendship under an oak, and approaches
    a dangerous lodging.
