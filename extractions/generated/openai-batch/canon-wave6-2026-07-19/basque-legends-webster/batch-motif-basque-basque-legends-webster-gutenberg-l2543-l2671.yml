canonical_text:
  quote: ''
  summary: In one tale, a household is visited nightly by a fairy who receives ham.
    The wife wants the fairy gone, and the husband disguises himself as his wife,
    offers ham, and throws red-hot ham into the fairy's face. When other fairies arrive,
    the injured fairy says she hurt herself, so they refuse to help; all fairies leave,
    and the household declines into wretchedness. In the next tale, a beautiful idle
    girl is promised in marriage if she can sew seven shirts. A witch makes the shirts
    under the condition that the girl remember the witch's name after a year and a
    day. Later another old woman reports hearing the name Marie Kirikitoun in a chant,
    allowing the girl to write it down and know it when the witch returns.
  language: English
  quote_policy: summarized
