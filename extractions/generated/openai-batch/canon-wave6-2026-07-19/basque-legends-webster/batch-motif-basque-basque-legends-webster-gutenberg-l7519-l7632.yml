canonical_text:
  quote: ''
  summary: A poor couple's seven sons leave home before their sister is born. After
    learning of them, the sister seeks them, secretly keeps their mountain house,
    sews shirts for them, and is recognized by the youngest brother. Later she visits
    the forbidden neighbor for fire; the neighbor, identified as a witch, gives her
    herbs for the brothers' footbath, transforming them into cows. A king's son marries
    the sister after promising not to kill the cows, especially the Breton cow. While
    the king is away and the sister has given birth, the witch throws her down a precipice,
    takes her place in bed, and asks for the Breton cow to be killed. A servant finds
    the cows by the precipice and hears a grieving voice.
  language: English
  quote_policy: summarized
