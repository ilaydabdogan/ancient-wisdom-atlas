canonical_text:
  quote: ''
  summary: An editorial note mentions an unrecorded variant compared to a Campbell
    tale. In the main tale, three sisters state marriage wishes while spinning; the
    king overhears and marries the youngest. Her jealous sisters falsely report her
    three childbirths as births of animals, expose the children in baskets thrown
    into water, and cause the queen’s imprisonment. A gardener rescues the children,
    who grow up as two brothers and a sister. An old beggar tells them they lack a
    singing tree, a truth-telling bird, and water that makes young. The elder brother
    quests for these objects, receives warnings not to turn back when frightened by
    cries, disobeys, and is turned to stone; the second brother then sets out and
    receives similar warnings.
  language: English
  quote_policy: summarized
