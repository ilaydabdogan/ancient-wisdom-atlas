canonical_text:
  quote: He kills the serpent with the aid of the "olanos," and the princess helps
    by striking the serpent's tail with a sword
  summary: A narrated variation tells of a young prince living as a herdsman who kills
    three card-playing Tartaros with a hammer, finds their wealth and three olano
    animals, uses the olanos and the princess's sword-stroke to kill a serpent, receives
    stolen dishes from the king's table through an olano, proves himself with tongues
    and pieces of dress, and sees the charcoal-burner punished by fire beneath seven
    barrels of powder.
  language: English
  quote_policy: quoted
