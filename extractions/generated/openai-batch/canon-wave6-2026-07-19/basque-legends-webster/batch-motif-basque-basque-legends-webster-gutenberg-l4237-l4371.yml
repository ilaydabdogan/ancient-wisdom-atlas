canonical_text:
  quote: ''
  summary: A ruined master mariner repeatedly spares a large serpent at the seaside.
    The serpent instructs him to buy a ship, hire twelve strong sailors, build a hidden
    space and chest in the hold, and set sail with the serpent concealed in the chest.
    During the voyage the serpent foretells a terrible storm and a black bird whose
    killing calms the sea. Later the serpent directs the captain to send a fast runner
    ashore to retrieve fire-making objects from an old woman on a mountain. The runner
    steals the steel and then the flint, each time being injured by the pursuing old
    woman and healed by the serpent's remedy and drink.
  language: English
  quote_policy: summarized
