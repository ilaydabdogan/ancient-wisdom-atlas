canonical_text:
  quote: ''
  summary: A youngest daughter goes into service at a fairy's house, receives confusing
    destructive instructions, feeds a talking little dog, learns the true tasks and
    the proper humble answers, and is rewarded with gold and a star on her forehead.
    Her eldest sister later imitates her, refuses the dog, follows the destructive
    instructions literally, chooses gold and a star, and is instead punished with
    charcoal and a donkey's tail. The mother then refuses to let the second daughter
    go.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman has three daughters, and the youngest says she must go out to service.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youngest daughter travels from town to town and meets a fairy who offers
    to take her as a servant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fairy says they are fairies and assigns the new servant work in the kitchen,
    phrased as smashing, breaking, pounding children, dirtying faces, and rumpling
    hair.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A little dog asks the youngest daughter for food; after first threatening
    to kick him, she gives him a small amount to eat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dog tells the youngest daughter that the mistress's real instructions
    are to sweep the kitchen, fill the pitcher, and wash the plates, and tells her
    to choose charcoal and a donkey's tail when offered wages.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The mistress is satisfied with the youngest daughter's completed work; when
    the girl chooses charcoal and a donkey's tail, the mistress gives her gold and
    a star on her forehead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The youngest daughter returns home with a star and a bag of gold, and her
    family is astonished.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The eldest daughter asks to go into service; her mother initially refuses
    but later assents.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The eldest daughter reaches the city of the fairies, meets the same fairy,
    is taken as a servant, and receives similar destructive instructions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The little dog asks the eldest daughter for food, but she gives him nothing
    and drives him away with kicks.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The mistress returns and finds the kitchen dug up, the pitcher broken, and
    the plates broken.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The eldest daughter chooses the bag of gold and the star, but receives a sack
    of charcoal and a donkey's tail for her forehead and returns crying.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The second daughter asks permission to go, but the mother refuses and keeps
    her at home.
  category: sequence
  evidence_refs:
  - ev:12
