candidate_motifs:
- id: motif:1
  label: False execution avoided through animal-heart substitution
  taxonomy_refs: []
  basis: The condemned servant is spared and an ass's heart is presented as proof;
    in a related variant, the youngest daughter is spared and a horse's heart is presented
    to the king.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage gives the substitutions in summary form and does not specify
    ritual or symbolic meaning.
- id: motif:2
  label: Falsely accused or rejected heroine later vindicated
  taxonomy_refs:
  - return
  basis: The servant later identifies the king who condemned her; in the love-test
    variant, the exiled youngest daughter reveals herself at the wedding feast and
    matters are made right.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: medium
  cautions: The taxonomy reference to return is broad; the passage shows recognition
    and restoration more clearly than a formal return journey.
- id: motif:3
  label: Children die first and prepare heavenly places for parents
  taxonomy_refs:
  - afterlife_journey_map
  basis: The children say they are going to Heaven to prepare or keep places ready,
    and the parents later die together and go to Heaven.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents Heaven as a destination but does not describe a detailed
    journey map.
- id: motif:4
  label: Love test answered with bread and salt
  taxonomy_refs:
  - wisdom
  basis: The youngest daughter answers that she loves her father as bread loves salt,
    is punished, and later demonstrates the value of salt by serving bread without
    it.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The taxonomy reference to wisdom is interpretive; the literal pattern
    is the love test and salt demonstration.
- id: motif:5
  label: Banished daughter sustained in the forest by birds and bees
  taxonomy_refs:
  - departure
  basis: The daughter is sent into the forest to be killed, is spared, and lives there
    on plants from birds and flowers from bees.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Departure is a broad taxonomy match; the passage does not develop a full
    quest structure.
- id: motif:6
  label: Father-daughter marriage avoided by impossible demand and escape
  taxonomy_refs:
  - departure
  basis: The daughter refuses to marry the widowed king, consults her godmother, requests
    an impossible fly-wing wedding dress, and then escapes by ship or on foot.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage summarizes two variants and does not include all narrative
    details.
- id: motif:7
  label: Magical clothing container used in ball or wedding sequence
  taxonomy_refs: []
  basis: An old woman gives the daughter a nut with dresses at the ball, and one variant
    mentions unusually matched wedding garments.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage says 'etc.' and gives only a brief explanation of the clothing
    episode.
comparison_claims:
- id: claim:1
  claim: The love-test variant is explicitly compared by the collector to King Lear's
    scene of a king asking his daughters how much they love him.
  claim_level: same_motif
  target: King Lear love-test pattern
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only names the comparison and summarizes the Basque variant;
    it does not quote or analyze King Lear.
- id: claim:2
  claim: Two variants are explicitly said to open like Campbell's 'The King who Wished
    to Marry his Daughter,' with a widowed king constrained by a deathbed promise
    and directed toward marrying his daughter.
  claim_level: same_motif
  target: Campbell's 'The King who Wished to Marry his Daughter'
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
