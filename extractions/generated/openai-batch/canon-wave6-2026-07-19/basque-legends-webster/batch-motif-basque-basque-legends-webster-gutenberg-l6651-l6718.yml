canonical_text:
  quote: ''
  summary: 'The passage recounts the conclusion of a tale in which a falsely accused
    servant is imprisoned and condemned, but executioners spare her and substitute
    an animal heart. She identifies the guilty king, and her bridegroom kills him.
    The couple later dies after their two children die and announce that they are
    preparing places in Heaven. The passage then summarizes several related variants:
    a love-test tale with bread and salt, exile in the forest, animal-heart substitution,
    marriage, and recognition at a feast; and variants resembling Campbell''s tale
    of a king wishing to marry his daughter, involving a deathbed promise, magical
    wedding dress demands, escape, servitude, a ball, and a nut containing dresses.'
  language: English
  quote_policy: summarized
