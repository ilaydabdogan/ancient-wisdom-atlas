canonical_text:
  quote: ''
  summary: A poor mother has three sons. The two elder sons enter service under a
    harsh master, fail an imposed wheat-sowing task, and lose the skin from their
    backs according to the contract. The third son accepts the same terms, fulfills
    the master's commands by literal and destructive interpretations, and is then
    sent with pigs into a forest inhabited by a man-eating Tartaro. On the way, warned
    by helpers, he receives walnuts, balls of thread, and a spit for use against the
    Tartaro.
  language: English
  quote_policy: summarized
