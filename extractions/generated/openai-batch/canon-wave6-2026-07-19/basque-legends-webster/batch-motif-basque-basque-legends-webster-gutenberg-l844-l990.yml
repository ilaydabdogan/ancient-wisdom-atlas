  text: The eldest son enters service under an agreement for a very high salary, with
    the condition that disobedience will result in the skin being torn from his back
    and no pay.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The eldest son is ordered to sow fourteen bushels of wheat in one day, fails
    to complete the task, and is punished according to the agreement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The second brother makes the same agreement, is given the same wheat-sowing
    task, fails, and is also skinned and dismissed without money.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The third brother says he will return with both the money and the skin of
    his back, and he accepts the same service terms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The third brother sows the wheat by putting all fourteen bushels into a furrow
    around the field and covering it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When ordered to put cattle into a field without unlocking the gate or making
    a gap, the third brother kills the cattle, cuts them up, and throws the pieces
    into the field.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When ordered to bring straight wood, the third brother cuts down planted young
    chestnut trees; when ordered to bring crooked wood, he pulls up a vineyard.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The master sends the third brother with ten pigs and ten days of food into
    a forest where a Tartaro eats all people and animals who enter.
  category: sequence
  evidence_refs:
  - ev:9
