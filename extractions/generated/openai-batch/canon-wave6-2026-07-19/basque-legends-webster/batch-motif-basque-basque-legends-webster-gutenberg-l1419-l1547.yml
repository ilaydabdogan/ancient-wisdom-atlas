  text: Petit Yorge and his horse each cut off one of the serpent's heads, and the
    serpent asks for quarter until the next day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Petit Yorge refuses the young lady's invitation to go home with her, saying
    he has made a vow to go to Rome and that another helper will come the next day.
  category: speech
  evidence_refs:
  - ev:1
