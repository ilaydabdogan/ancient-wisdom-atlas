  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young lady throws the good-scented water where needed, and Petit Yorge,
    the horse, and the dog each cut off one of the serpent's heads, ending the serpent.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Petit Yorge takes the seven tongues and throws away the heads.
