  text: The Tartaro instructs Petit Yorge how to answer the serpent's fire-threat
    and tells him that the young lady must throw the good-scented water on him, the
    horse, and the dog.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Twenty-one doors open when touched by Petit Yorge's sword, and he cuts twenty-one
    pieces from the young lady's twenty-one dresses.
  category: action
  evidence_refs:
  - ev:7
