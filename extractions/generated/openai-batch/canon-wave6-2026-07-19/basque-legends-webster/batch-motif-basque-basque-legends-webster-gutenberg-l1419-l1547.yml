canonical_text:
  quote: ''
  summary: Petit Yorge repeatedly fights a multi-headed serpent threatening a young
    lady. A Tartaro gives him horses, clothing, swords, a dog, and good-scented water
    with instructions. The hero, horse, and dog sever the serpent's remaining heads
    after the young lady applies the water, and Petit Yorge takes the serpent's seven
    tongues before the young lady's father calls for the killer to present proofs.
  language: English
  quote_policy: summarized
