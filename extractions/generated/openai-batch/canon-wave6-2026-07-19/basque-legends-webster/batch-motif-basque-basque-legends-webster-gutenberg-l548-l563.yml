canonical_text:
  quote: '"Thou there, and I here."'
  summary: A king's son, punished by being made a monster, can become a man again
    only by marrying. A frightened girl refuses him and later receives his ring through
    a young man. The ring on her finger repeatedly calls out, and the Tartaro pursues
    her. She cuts off the finger bearing the ring, throws finger and ring into a large
    pond, and the Tartaro drowns himself there.
