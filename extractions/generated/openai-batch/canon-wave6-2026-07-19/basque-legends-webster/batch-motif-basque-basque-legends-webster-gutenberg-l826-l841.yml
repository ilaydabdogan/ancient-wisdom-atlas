  summary: The passage summarizes several variants of the Errua tale. Some are compared
    to Grimm and Campbell tale collections. One variant has two brothers, one failing
    in service and the other outwitting a master and the Tartaro, including burning
    out the Tartaro's eye with a red-hot spit. Other variants include frightening
    the Tartaro with cracked walnuts described as bones, and winning a water-carrying
    wager by threatening to take away an entire fountain.
