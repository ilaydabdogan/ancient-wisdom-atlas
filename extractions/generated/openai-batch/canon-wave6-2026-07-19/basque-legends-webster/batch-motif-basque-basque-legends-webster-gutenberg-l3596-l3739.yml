canonical_text:
  quote: ''
  summary: 'A monster reveals that he can be killed only by an egg hidden inside a
    pigeon, inside a fox, inside a wolf. Malbrouk, who can take animal forms, kills
    the nested animals, obtains the egg, and the princess strikes the monster dead.
    Malbrouk flies away with her, then postpones marriage while stealing marvelous
    objects from his godfather: a golden-horned cow, a moon that gives light, and
    a self-playing violin. The violin theft fails, and Old Malbrouk imprisons him
    in an iron cage and threatens to roast and eat him.'
  language: English
  quote_policy: summarized
