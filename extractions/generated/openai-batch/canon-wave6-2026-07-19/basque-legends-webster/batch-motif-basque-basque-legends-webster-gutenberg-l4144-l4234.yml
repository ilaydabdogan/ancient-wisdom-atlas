canonical_text:
  quote: ''
  summary: A dispossessed young man seeks a marvelous lost house or castle. He consults
    the personified sun, then the south wind, whose mothers protect him from being
    eaten. The south wind locates the house beyond the Red Sea. The man becomes a
    gardener at the castle, obtains and steals a speaking snuff-box, commands it to
    return him and the castle to their former place and to drown the king, queen,
    and servants in the Red Sea. He is reunited with his wife, while the others perish.
  language: English
  quote_policy: summarized
