canonical_text:
  quote: "“When you shall find this key, your mother will be saved.”"
  summary: A child born after his parents' vow to go to Rome later fulfills the vow
    himself. In Rome the Holy Father shows him rooms identified as Hell, Purgatory,
    and Heaven, then gives him a locked hair-cloth shirt and a key cast into water
    as a condition for saving his mother. After years of suffering, the son returns
    home, the key is found in a fish, he is pushed into a well but emerges, reveals
    his birthmark, and the three family members die as a servant sees three white
    doves fly away.
  language: English
  quote_policy: quoted
