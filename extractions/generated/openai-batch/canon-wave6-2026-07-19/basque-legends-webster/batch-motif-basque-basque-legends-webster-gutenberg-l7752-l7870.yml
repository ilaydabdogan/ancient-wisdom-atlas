canonical_text:
  quote: ''
  summary: An editorial introduction frames the section as religious tales. The tale
    'Fourteen' begins with a poor mother and son; the son is as strong as fourteen
    men and eats as much as fourteen men. He leaves home, works for a master by mowing
    fields rapidly and eating large provisions, survives attempts to dispose of him
    in beast-filled forests, leaves with wages, and later carries two men across a
    river who are identified as Our Lord and St. Peter. Our Lord rewards him with
    a sack into which whatever he wishes for will come.
  language: English
