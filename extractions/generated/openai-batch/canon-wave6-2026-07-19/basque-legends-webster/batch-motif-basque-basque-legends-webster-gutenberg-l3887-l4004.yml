canonical_text:
  quote: ''
  summary: A first and then a second brother go to a beautiful castle despite warnings,
    enter through a hidden small door, eat food pressed on them by an old woman, and
    become terrible monsters unable to leave. Boiling water at home signals each misfortune.
    A third brother goes after them, receives a cooked pigeon and instructions from
    another old woman, refuses the castle old woman's food, compels her to eat the
    pigeon, threatens her with his dog, and forces her to restore his brothers and
    their animals.
  language: English
  quote_policy: summarized
