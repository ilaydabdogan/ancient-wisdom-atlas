  summary: The passage describes Basque Pastorales as long, orally memorized dramatic
    performances prepared through family and community training. It lists repertory
    categories and titles, then summarizes the dramatis personae and some staging
    features of an Abraham Pastorale, including divine figures, biblical families,
    kings, soldiers, giants, Sodom inhabitants, and Satans.
  language: English
  quote_policy: summarized
