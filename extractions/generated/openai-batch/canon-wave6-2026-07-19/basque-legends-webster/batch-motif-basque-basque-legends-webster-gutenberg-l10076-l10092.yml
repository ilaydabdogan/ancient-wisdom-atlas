  summary: The passage is a philological and editorial note stating that M. Fr. Michel
    regarded the songs Abarcaren Cantua and Altabiscarraco Cantua as forgeries, that
    M. d'Abbadie repeated this testimony and claimed to know where a song was composed,
    and that the language, rhythm, and foreign vocabulary indicate modern composition
    rather than antiquity.
