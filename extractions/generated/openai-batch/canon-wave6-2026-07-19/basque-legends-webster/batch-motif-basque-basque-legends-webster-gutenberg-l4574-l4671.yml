canonical_text:
  quote: ''
  summary: Dragon repeatedly misses the young lady because he eats and falls asleep
    despite warnings. After receiving handkerchiefs and a ring as tokens, he searches
    for the City of the Four Quarters. Mountain men summon animals; an eagle agrees
    to carry him there in exchange for flesh. Dragon feeds the eagle an ox and then
    a piece of his own thigh during the sea crossing. In the city, he interrupts the
    king’s daughter’s wedding, shows the tokens, is recognized, and marries her.
  language: English
  quote_policy: summarized
