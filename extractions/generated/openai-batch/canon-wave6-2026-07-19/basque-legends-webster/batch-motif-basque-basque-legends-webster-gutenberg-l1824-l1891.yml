- id: obs:1
  text: The young man dresses splendidly, rides from country to country, enters a
    city, hears bells, and finds the people excited.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The city people report that a seven-headed serpent is in the mountain and
    that one person must be given to it every day, with lots deciding the victim.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lot has fallen on the king's daughter; the king and people accompany her
    to the mountain, and she ascends alone from its foot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man follows the king's daughter and offers to accompany her; she
    asks him to turn back so he will not risk his life because of her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man tells the king's daughter not to fear because he has a charm
    of might.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The serpent arrives with extraordinary noise and hissing, moving like lightning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man strikes one of the serpent's heads with his stick, and the seven
    heads fall off one by one, saving the princess.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The princess is wearing seven beautiful robes; the young man cuts a piece
    from each robe and takes a tongue from each serpent head, placing the tongues
    in the silk pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young man takes the king's daughter down the mountain on his horse; she
    goes to her father, and he goes to the bear's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king has promised his daughter and half his kingdom to the man who killed
    the serpent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Three charcoal-burners find the serpent on the mountain, take the seven heads,
    and ask the king for the reward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Because the three claimants create a difficulty and no other person has appeared,
    lots are to be drawn to decide who will be the princess's husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The young man arrives, is received by the king, asks whether the seven heads
    had tongues, and shows the seven tongues when none are found in the heads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The young man calls for the princess's seven robes and shows that the missing
