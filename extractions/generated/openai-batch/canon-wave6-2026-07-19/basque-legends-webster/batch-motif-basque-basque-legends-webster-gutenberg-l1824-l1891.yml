canonical_text:
  quote: ''
  summary: A travelling young man reaches a city where the king's daughter has been
    selected by lot as the daily victim for a seven-headed mountain serpent. He accompanies
    her, kills the serpent with his stick after saying he has a charm of might, keeps
    the serpent's tongues and pieces from her seven robes as proof, later exposes
    three charcoal-burners who falsely claim the reward, and marries the princess.
    The false claimants are burned, and the couple live happily.
  language: English
  quote_policy: summarized
