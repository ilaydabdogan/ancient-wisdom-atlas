canonical_text:
  quote: ''
  summary: A young schoolboy says he has learned to understand the song of birds.
    A bird on his father's ship sings, and the boy says it means that he is now under
    his father's orders but that the father will later be under his. The father seals
    the boy in a barrel and throws it into the sea; a storm casts the barrel ashore.
    A king finds the boy, takes him home, and the boy marries the king's daughter.
    Later the father is driven ashore by a storm, fails to recognize his son, becomes
    his servant, and is told that the bird's song has come true. Father and son then
    live happily together.
  language: English
  quote_policy: summarized
