canonical_text:
  quote: ''
  summary: A mischievous youth leaves home, becomes a servant under a dangerous agreement,
    ruins his master's property through destructive actions, and is sent with pigs
    to a mountain where a Tartaro lives. With help from an old woman, he defeats the
    Tartaro in contests involving a stone, an iron bar, and oaks. He then survives
    a night attack by placing a dead man in his bed and hiding underneath; afterward
    the mixed pig herds are examined for marks.
  language: English
  quote_policy: summarized
