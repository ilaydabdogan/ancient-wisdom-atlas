canonical_text:
  quote: ''
  summary: A young woman named Fifine leaves her serpent companion Azor for three
    days, forgets him, and is recalled by a ring that changes and bleeds. She returns
    to a silent castle, saves Azor with fire from a frozen garden spot, agrees to
    marry him only as a man, and later sees him revealed as a young man. At midnight
    she burns his serpent skin and throws out the ashes before the last stroke of
    twelve, ending his enchantment. They later feast, move to the king's house, have
    children, and receive royal succession.
  language: English
  quote_policy: summarized
