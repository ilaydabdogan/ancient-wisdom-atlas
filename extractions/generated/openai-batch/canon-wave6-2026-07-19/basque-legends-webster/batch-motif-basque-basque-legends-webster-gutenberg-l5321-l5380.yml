canonical_text:
  quote: ''
  summary: 'A young lady imposes night-long tasks on male visitors: one cannot keep
    his washed feet clean, and her husband cannot keep a light extinguished. At daybreak
    she reveals herself as the wife he forgot after leaving to fetch a priest. She
    says he and his friends have done enough penance, sends him for a priest, is baptized,
    and goes with him to his country, where she creates a palace and garden by touching
    the earth with her stick. They live happily and die well.'
  language: English
  quote_policy: summarized
