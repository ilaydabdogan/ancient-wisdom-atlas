canonical_text:
  quote: ''
  summary: 'A lad obtains money, clothes, and a horse from a gentleman and returns
    to his mother. News of his sudden wealth reaches the mayor, who repeatedly threatens
    his life unless he steals specified items: the mayor''s finest horse, all the
    bread from the mayor''s oven, and the sheets from beneath the mayor and his wife.
    The lad succeeds through disguise, exploiting guards'' sleep or misplaced attention,
    making a hole in the oven, and using an effigy of himself as a decoy.'
  language: English
  quote_policy: summarized
