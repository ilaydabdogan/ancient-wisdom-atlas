canonical_text:
  quote: '"Come into my sack."'
  summary: A wandering figure called Fourteen uses a sack that obeys his command to
    gather food and drink from shops. He later helps a sick father who says he has
    given his soul to the devil by hiding with the sack, trapping the devil in it,
    and having stone-breakers beat the devil until a signed paper releases the man's
    soul from any infernal claim. Fourteen then tires of the world, reaches hell where
    the devils shut the gates against him, reaches Heaven where the gates are also
    shut, puts his sack through the keyhole, commands himself into it, and remains
    behind Heaven's door. An editorial note says another version of the popular tale
    follows.
  language: English
  quote_policy: quoted
