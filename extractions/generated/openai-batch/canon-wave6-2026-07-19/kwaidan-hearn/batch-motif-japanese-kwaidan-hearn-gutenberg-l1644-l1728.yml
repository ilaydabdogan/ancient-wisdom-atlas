  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Daigen Oshō, the head priest of a Zen temple, says that something in or near
    the tansu must be causing O-Sono anxiety and arranges to watch the room alone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: While Daigen Oshō reads sutras in the room, O-Sono’s figure appears after
    the Hour of the Rat with a wistful face and eyes fixed on the tansu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The priest addresses O-Sono by her kaimyō, asks whether something in the tansu
    troubles her, and searches the drawers and chest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A letter is found under the lining of the lowermost drawer.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the priest asks whether to burn the letter, O-Sono bows; after he promises
    it will be burned and not read by anyone except himself, the figure smiles and
    vanishes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The priest tells the family that O-Sono will not appear again; the letter
    is burned, and it is revealed to have been a love-letter from the time of O-Sono’s
    studies in Kyōto.
  category: sequence
  evidence_refs:
  - ev:10
