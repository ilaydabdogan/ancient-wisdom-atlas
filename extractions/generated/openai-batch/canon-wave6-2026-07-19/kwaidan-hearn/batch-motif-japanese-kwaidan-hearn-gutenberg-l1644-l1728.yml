- id: obs:3
  text: On the night after O-Sono’s funeral, her son says that his mother has returned
    to the upstairs room, smiled at him, and did not speak.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Family members see the figure of the dead mother in O-Sono’s room, standing
    before a tansu; her upper body is distinct while the lower part becomes invisible
    and transparent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mother of O-Sono’s husband suggests that O-Sono may have returned because
