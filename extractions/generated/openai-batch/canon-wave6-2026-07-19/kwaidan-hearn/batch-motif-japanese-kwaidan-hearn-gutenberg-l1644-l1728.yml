canonical_text:
  quote: ''
  summary: O-Sono, a merchant’s daughter educated in Kyōto and later married with
    one son, dies after several years of marriage. After her funeral, her child and
    household see her ghost near a chest of drawers. Her belongings are sent to the
    temple, but the apparition continues. The Zen priest Daigen Oshō watches, questions
    the ghost, searches the chest, and finds a hidden love-letter beneath a drawer
    lining. When he promises to burn it and keep its contents secret, the ghost smiles
    and disappears. The letter is burned, and O-Sono does not appear again.
  language: English
  quote_policy: summarized
