    presenting them as aesthetic miniatures. The poems describe butterflies by shape,
    motion, freedom, sleep, play, youthfulness, companionship, relation to flowers,
    and possible spiritual associations. A prose excerpt from Mushi-Isamé then addresses
    a butterfly in spring as admired and envied by insects and humans, and cites examples
    of butterfly-form transformation or apparition involving Sōshū of China, Sakoku
    of Japan, and barley-grass.
