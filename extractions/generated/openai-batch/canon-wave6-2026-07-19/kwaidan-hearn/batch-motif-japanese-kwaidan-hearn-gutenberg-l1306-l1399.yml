canonical_text:
  quote: ''
  summary: 'Opening of “Rokuro-Kubi”: a former samurai loyal to his ruined lord becomes
    the Buddhist traveling priest Kwairyō. While journeying through lonely mountains
    in Kai, he lies down to sleep outdoors, is warned by a woodcutter about local
    haunters called Hairy Things, and accepts shelter at the woodcutter’s isolated
    thatched cottage, where a respectful household receives him.'
  language: English
