canonical_text:
  quote: ''
  summary: A young samurai named Tomotada, traveling on a winter mission through a
    mountain district, is forced by snow and exhaustion to seek shelter at a poor
    cottage among willow-trees. An old couple receive him, feed him, and invite him
    to stay the night. He becomes entranced by their daughter Aoyagi, whose beauty,
    grace, and refined speech seem incongruous with her remote and humble surroundings.
    Tomotada and Aoyagi exchange poems that suggest attraction and a desire for him
    to remain.
  language: English
  quote_policy: summarized
