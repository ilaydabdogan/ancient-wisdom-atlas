  quote: ''
  summary: An admonishing speaker rebukes a butterfly for pride, recalls its earlier
    state as a despised cabbage-insect or hairy worm that hid in a hanging nest and
    damaged cherry, daikon, and other leaves, contrasts this with its present admired
    white-winged form, recounts an ancient Chinese story in which a butterfly's perch
    on a palace lady's hairpin determined whom Emperor Gensō summoned, and criticizes
    the butterfly's preference for showy flowers over evergreen trees.
  language: English
