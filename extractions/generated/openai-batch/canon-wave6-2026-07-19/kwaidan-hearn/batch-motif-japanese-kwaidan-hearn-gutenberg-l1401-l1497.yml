canonical_text:
  quote: ''
  summary: A host describes his ruined past and desire for atonement. The priest Kwairyō
    promises to recite sūtras for him. Later that night, while the household sleeps,
    Kwairyō finds five headless bodies, recalls written lore about Rokuro-Kubi, moves
    the host’s body, and hides in the grove. He sees five detached heads eating insects.
    The host’s head speaks of eating the priest, notes that prayer prevents attack,
    learns that its body has been moved, declares that it cannot rejoin and must die,
    and then spots the priest.
  language: English
  quote_policy: summarized
