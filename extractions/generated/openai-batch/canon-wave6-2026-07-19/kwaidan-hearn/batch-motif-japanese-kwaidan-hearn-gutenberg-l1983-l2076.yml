canonical_text:
  quote: ''
  summary: Tomotada, strongly attracted to Aoyagi after her verse, asks her parents
    to give her to him in marriage. Her father objects to the rank difference and
    offers her instead as a humble handmaid. At dawn Tomotada asks again, offers gold,
    and is refused; the parents say Aoyagi has already been freely given and may accompany
    him. Tomotada leaves with her on horseback. An editorial note marks a narrative
    gap and says Tomotada took Aoyagi to Kyoto. Because a samurai needs his lord's
    permission to marry, he hides her there, but a retainer of Lord Hosokawa sees
    her and reports her; the daimyō orders that she be brought to him, and she is
    taken.
  language: English
