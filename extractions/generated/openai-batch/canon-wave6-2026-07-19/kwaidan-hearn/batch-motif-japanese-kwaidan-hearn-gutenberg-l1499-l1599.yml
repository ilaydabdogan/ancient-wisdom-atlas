  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Most magistrates consider Kwairyō a hardened criminal, but one aged officer
    asks that the head be examined before judgment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The aged officer finds strange red characters on the nape and observes that
    the neck edge does not look cut by a weapon.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The elder identifies the head as that of a Rokuro-Kubi, citing red characters
