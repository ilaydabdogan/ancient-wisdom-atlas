canonical_text:
  quote: ''
  summary: Kwairyō fights five detached Rokuro-Kubi heads, kills the aruji's head,
    and carries it away still fastened to his sleeve. In Suwa he is arrested as a
    presumed murderer, but an aged officer examines the head, finds marks and an uncut
    neck line identifying it as a Rokuro-Kubi, and Kwairyō is honored after revealing
    his former samurai identity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The head of the aruji and four other heads spring at Kwairyō, and he strikes
    them with a young tree he has plucked up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four heads flee, while the aruji's head catches Kwairyō's left sleeve in its
    teeth and remains clamped there after it dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the house, four Rokuro-Kubi are seen squatting with bruised and bleeding
    heads reunited to their bodies, and they flee into the woods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The east sky is brightening, and Kwairyō understands that the goblins' power
    is limited to the hours of darkness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kwairyō treats the head as a miyagé and descends the mountain with it still
    hanging from his sleeve.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Suwa, people panic at the sight of the dangling head, and the torité seize
    and jail Kwairyō as a suspected murderer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the magistrates, Kwairyō says the head fastened itself to his sleeve,
