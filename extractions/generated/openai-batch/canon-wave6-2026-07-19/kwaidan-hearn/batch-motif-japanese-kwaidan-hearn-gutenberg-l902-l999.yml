canonical_text:
  quote: ''
  summary: In the supplied passage of “Of a Mirror and a Bell,” priests collect women’s
    bronze mirrors to cast a temple bell. A farmer’s wife donates an heirloom mirror,
    regrets the gift, and her attachment is said to keep the mirror from melting.
    After public shame she drowns herself, leaving a promise that her ghost will enrich
    whoever breaks the bell. The bell is cast, people repeatedly try to break it by
    ringing, and priests finally roll it into a swamp. The passage then explains the
    Japanese term nazoraëru as imaginative substitution used in mimetic magic and
    religious acts of merit.
  language: English
  quote_policy: summarized
