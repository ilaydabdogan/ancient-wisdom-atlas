canonical_text:
  quote: "“The soul of a tree is my soul;—the heart of a tree is my heart.”"
  summary: Tomotada sends a dangerous poem-letter to Aoyagi after fearing she has
    been taken from him. Lord Hosokawa unexpectedly approves their marriage. After
    five happy years, Aoyagi announces that their karmic relation in this life is
    ending, reveals that she is not human but bound to a willow tree being cut down,
    and disappears, leaving robes and hair ornaments. Tomotada becomes a Buddhist
    priest and later finds the former dwelling replaced only by the cut stumps of
    three willows.
  language: English
  quote_policy: quoted
