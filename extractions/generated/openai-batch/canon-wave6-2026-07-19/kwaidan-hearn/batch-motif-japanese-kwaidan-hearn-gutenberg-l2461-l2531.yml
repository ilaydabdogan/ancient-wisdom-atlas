canonical_text:
  quote: ''
  summary: The passage tells of Riki-Baka, a childlike young man who dies suddenly.
    His mother writes his name on his left palm and prays for him to be reborn into
    a happier condition. Later, a boy is born in a wealthy household with the characters
    'Riki-Baka' on his left palm. The household traces the mark to Riki, obtains clay
    from his grave, and the woodcutter explains that such marks can be removed by
    rubbing the child's skin with clay from the grave of the former birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Riki's name means Strength, but people call him Riki-the-Simple, Riki-the-Fool,
    or Riki-Baka because he was born into perpetual childhood.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says people were kind to Riki even after he set a house on fire
    with a lighted match and rejoiced at the blaze.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At sixteen, Riki is described as tall and strong while mentally remaining
    at the happy age of two and playing with very small children.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Riki's favorite toy was a broomstick used as a hobby-horse, and the narrator
    eventually told him to find another playground because of his noise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woodcutter tells the narrator that Riki died suddenly nearly a year
    earlier, with doctors attributing the death to a brain disease.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Riki died, his mother wrote the name 'Riki-Baka' in the palm of his left
    hand and prayed that he might be reborn into a happier condition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A boy was later born in the residence of Nanigashi-Sama with plain characters
    on the palm of his left hand reading 'Riki-Baka'.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The household understood the birth as having occurred in answer to someone's
    prayer and made inquiries that led them to Riki's mother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The family of Nanigashi-Sama was angry about the word 'Baka' on the child's
    hand.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The servants asked where Riki was buried, went with his mother to Zendōji,
    and took clay from Riki's grave wrapped in a furoshiki.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The servants gave Riki's mother ten yen after taking the grave-clay.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The old woodcutter says that characters appearing in that way on a child's
    body can only be removed by rubbing the skin with clay from the grave of the body
    of the former birth.
  category: speech
  evidence_refs:
  - ev:8
