canonical_text:
  quote: ''
  summary: O-Yuki lives as Minokichi’s wife and mother of ten children without aging.
    One night Minokichi recalls a beautiful white nonhuman woman he saw in youth and
    recounts the fatal encounter in a ferryman’s hut. O-Yuki reveals that she was
    that being, says he has broken her warning not to speak of it, spares him because
    of their children, warns him to care for them, then becomes white mist and disappears
    through the smoke-hole.
