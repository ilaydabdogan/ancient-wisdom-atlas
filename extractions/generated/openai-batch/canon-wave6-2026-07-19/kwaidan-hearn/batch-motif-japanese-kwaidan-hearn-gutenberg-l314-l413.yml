canonical_text:
  quote: ''
  summary: Hōïchi obeys a samurai summons, takes his biwa, and is guided at night
    through a gateway into a noble-seeming assembly. He is asked to recite the Heiké
    story of Dan-no-ura, performs with great skill, and causes the listeners to praise
    him and then weep at the deaths he recounts. A woman speaking for the lord orders
    him to return for six more nights and to tell no one. Hōïchi is taken back to
    the temple before dawn, keeps silent, is fetched again the next night, and his
    absence is then discovered.
  language: English
  quote_policy: summarized
