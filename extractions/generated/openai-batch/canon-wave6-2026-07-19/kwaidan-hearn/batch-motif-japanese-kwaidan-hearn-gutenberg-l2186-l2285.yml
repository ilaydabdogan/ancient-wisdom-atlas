    tatsu, 'to act as a substitute.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man spread a white cloth and coverings under the tree, sat there,
    performed hara-kiri, and his ghost entered the tree, which blossomed in the same
    hour.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The tree continues to bloom every year on the sixteenth day of the first month,
    in the season of snow.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Akinosuké rested under an ancient cedar in his garden with two fellow-gōshi,
