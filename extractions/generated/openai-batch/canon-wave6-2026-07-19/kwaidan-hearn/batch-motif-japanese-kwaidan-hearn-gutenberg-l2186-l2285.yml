  - ev:3
- id: obs:4
  text: The tree grew in the garden of a samurai of Iyo, who had known it since childhood
    and whose ancestors had hung poem-inscribed colored papers on its branches for
    more than a hundred years.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The samurai became very old, outlived all his children, and had nothing left
    in the world to love except the tree.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the old tree withered and died, neighbors planted a young cherry tree
    to comfort the old man, but he remained sorrowful.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the sixteenth day of the first month, the old man bowed before the withered
