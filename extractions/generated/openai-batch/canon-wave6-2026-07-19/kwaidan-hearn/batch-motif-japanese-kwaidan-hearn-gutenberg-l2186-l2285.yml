canonical_text:
  quote: There is the ghost of a man in that tree.
  summary: 'The passage closes a prior tale with Buddhist memorial services for Aoyagi
    and her parents, then tells of the Jiu-roku-zakura, a cherry tree that blooms
    only on the sixteenth day of the first lunar month because an old samurai gave
    his life to it by hara-kiri and his ghost entered the tree. The passage then begins
    the Dream of Akinosuké: Akinosuké sleeps under an ancient cedar, dreams of a grand
    procession, receives a summons from the King of Tokoyo, enters a palace-carriage,
    and begins a journey.'
  language: English
  quote_policy: quoted
