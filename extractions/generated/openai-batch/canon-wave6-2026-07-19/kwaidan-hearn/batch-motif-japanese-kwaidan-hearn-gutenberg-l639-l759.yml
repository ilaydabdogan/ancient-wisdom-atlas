    her if she returns in another body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Nagao later marries because of family necessity, continues offerings to O-Tei’s
    tablet, and gradually finds her image becoming dim in memory.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After losing his parents, wife, and only child, Nagao leaves his home and
    travels in the hope of forgetting his sorrows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At an inn in Ikao, a mountain village known for thermal springs and scenery,
