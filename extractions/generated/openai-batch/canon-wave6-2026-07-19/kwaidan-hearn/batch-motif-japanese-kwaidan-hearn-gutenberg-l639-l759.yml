canonical_text:
  quote: "“I believe that we are destined to meet again in this world”"
  summary: Nagao Chōsei is betrothed to O-Tei, who dies young after predicting that
    she may meet him again in this world by being born again as a girl. Nagao mourns
    her, keeps a mortuary tablet, and writes a sealed promise to marry her if she
    returns in another body. Years later, after losses and travel, he meets a young
    woman at an inn who resembles O-Tei and momentarily identifies herself as the
    dead O-Tei returned. He marries her, but she no longer remembers the former birth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Nagao Chōsei is described as the son of a physician and as betrothed from
    childhood to O-Tei, with the families expecting a future wedding.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: O-Tei has weak health, develops fatal consumption in her fifteenth year, and
    calls Nagao to her bedside to say farewell.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On her deathbed, O-Tei tells Nagao that she expects they will meet again in
    this world, not in the Pure Land, and says she would need to be born again as
    a girl and grow to womanhood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nagao answers that waiting for O-Tei would be a joy and a duty, says they
    are pledged for seven existences, and asks for a sign or token by which to know
    her in another body.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: O-Tei says she cannot provide a sign or token, but asks Nagao to remember
    her words; after this she dies.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Nagao has a mortuary tablet made with O-Tei’s zokumyō, places it in his butsudan,
