canonical_text:
  quote: ''
  summary: In the tale “Ubazakura,” Tokubei and his wife pray to Fudō Myō Ō for a
    child and receive a daughter, O-Tsuyu. When O-Tsuyu later becomes gravely ill,
    her milk-nurse O-Sodé prays for her recovery, then reveals that she asked to die
    in O-Tsuyu’s place. O-Sodé requests that a cherry-tree be planted at Saihōji as
    a thank-offering. The tree blooms annually on the anniversary of her death, with
    flowers likened to milk-wet breasts, and is called the Cherry-tree of the Milk-Nurse.
  language: English
  quote_policy: summarized
