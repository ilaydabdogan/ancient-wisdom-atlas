canonical_text:
  quote: ''
  summary: Musō Kokushi, a Zen priest traveling alone in Mino, becomes lost in a mountain
    district and reaches a hamlet where a death has occurred. Villagers explain that
    custom requires everyone to leave the village at night after a death, leaving
    the corpse and offerings alone. Musō stays to perform rites and keep vigil. At
    deepest night a vague vast Shape enters, renders him unable to move or speak,
    devours the corpse and offerings, and departs. In the morning the villagers return,
    unsurprised by the disappearance, and explain that breaking the rule has previously
    brought misfortune.
  language: English
  quote_policy: summarized
