canonical_text:
  quote: "“To kill oshidori is not good”"
  summary: Sonjō, a hungry hunter, kills the male of a pair of mandarin ducks at Akanuma
    and cooks it. That night a weeping woman in a dream accuses him of killing her
    husband and says she cannot live without him. The next day Sonjō returns to Akanuma,
    sees the female duck swim toward him, and watches her tear open her own body and
    die. Sonjō then shaves his head and becomes a priest.
  language: English
  quote_policy: quoted
