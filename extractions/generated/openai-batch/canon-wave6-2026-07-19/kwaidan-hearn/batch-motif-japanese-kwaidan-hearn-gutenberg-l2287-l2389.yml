canonical_text:
  quote: "“Our master, the King, augustly desires that you become his son-in-law”"
  summary: Akinosuké is received at the palace of Tokoyo, ceremonially clothed, married
    to the king’s daughter, appointed governor of Raishū, and lives there prosperously
    for twenty-three years before his wife dies and a royal messenger arrives with
    condolences.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Akinosuké’s carriage stops before a huge two-storied Chinese-style gateway,
    and the kérai goes to announce his arrival.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two high-ranking purple-robed men greet Akinosuké, lead him through a vast
