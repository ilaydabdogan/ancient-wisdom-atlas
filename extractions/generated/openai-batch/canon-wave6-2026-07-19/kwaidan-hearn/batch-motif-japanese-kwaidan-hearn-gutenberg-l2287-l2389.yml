  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the wedding, the couple is taken to prepared apartments and receives
    congratulations and numerous gifts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some days later the king appoints Akinosuké governor of Raishū and instructs
    him to improve laws and customs and rule with kindness and wisdom.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Akinosuké and his bride depart from Tokoyo by a state ship and are welcomed
    on the beach by the people of Raishū.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Akinosuké governs Raishū for twenty-three years; laws are framed and enacted,
    the country is healthy and fertile, and laws are not broken.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the twenty-fourth year, Akinosuké’s wife, who has borne seven children,
    becomes sick and dies.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The wife is buried with high pomp on a beautiful hill in Hanryōkō, with a
