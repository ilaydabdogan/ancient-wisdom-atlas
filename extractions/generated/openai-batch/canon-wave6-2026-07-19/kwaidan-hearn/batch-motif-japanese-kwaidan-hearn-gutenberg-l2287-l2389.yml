  evidence_refs:
  - ev:1
- id: obs:3
  text: The attendants inform Akinosuké that the king wants him to become his son-in-law
    and to marry the king’s maiden daughter that day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The attendants take robes, girdles, and a regal headdress from a gold-lacquer
    chest and dress Akinosuké as a princely bridegroom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Akinosuké is brought into the presence-room, where the Kokuō of Tokoyo sits
    on the daiza among ranked dignitaries, and Akinosuké performs a triple prostration.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king declares that Akinosuké shall become the adopted husband of his only
    daughter and that the wedding ceremony shall be performed immediately.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Court ladies conduct Akinosuké to the bride; the wedding is witnessed by many
