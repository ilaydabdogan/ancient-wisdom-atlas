  quote: "“So, at last, Akiko came for him: the white butterfly was her soul.”"
  summary: The passage contrasts the short life of a pleasure-seeking butterfly with
    changing seasons, then tells a story of Takahama, an unmarried old man who dies
    after a large white butterfly leads his nephew to Akiko’s grave. The widow explains
    that Akiko had been Takahama’s betrothed, that he had honored her grave for fifty
    years, and that the butterfly was Akiko’s soul coming for him. The passage also
    briefly mentions the Butterfly Dance formerly performed at the Imperial Palace.
  language: English
  quote_policy: quoted
