canonical_text:
  quote: ''
  summary: The passage describes Hōrai as a legendary realm of immortality, inexhaustible
    food and drink, healing plants, revivifying grass, and youth-giving water, then
    qualifies or denies these older legends. It presents Hōrai’s true wonder as an
    ancient ghostly atmosphere that alters human perception, making the place appear
    as a small, trusting, fairy-like society. The passage ends by saying this magical
    atmosphere is shrinking under western winds and that Hōrai, also called Mirage,
    is fading into art, poetry, and dreams.
  language: English
  quote_policy: summarized
