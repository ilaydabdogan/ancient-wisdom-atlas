canonical_text:
  quote: ''
  summary: The passage reflects on whether religious creeds, moral laws, and ethical
    codes are necessary for civilization. It argues that social insects, especially
    ants and bees, provide examples of societies where altruistic behavior appears
    instinctive rather than commanded. Herbert Spencer is quoted as predicting that
    humanity may eventually reach a state in which egoism and altruism are reconciled.
    The narrator then cautions that this need not imply human caste-like specialization
    comparable to insects, while speculating about possible future physical and moral
    transformations.
  language: English
  quote_policy: summarized
