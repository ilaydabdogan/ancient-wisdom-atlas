canonical_text:
  quote: ''
  summary: A condemned man is restrained for execution in a garden. He warns that
    his resentful ghost will avenge him. The samurai redirects his final intention
    by challenging him to bite a stepping-stone after decapitation. The severed head
    bites the stone and then drops inert. The household later fears haunting and asks
    for a Ségaki service, but the samurai says the dead man’s last purpose was spent
    on biting the stone; no further trouble follows.
  language: English
  quote_policy: summarized
