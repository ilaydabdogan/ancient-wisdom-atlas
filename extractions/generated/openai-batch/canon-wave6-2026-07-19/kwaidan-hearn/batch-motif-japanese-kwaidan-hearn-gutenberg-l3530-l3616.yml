canonical_text:
  quote: ''
  summary: The passage reflects on ants as intelligent but wholly practical beings
    without selfishness or moral error, then imagines ant society as an impossible
    human-like world of tireless female workers serving a commonwealth and its young.
    It describes communal labor, hygiene, chastity or sexlessness among workers, seasonal
    and inferior males, a reproductive class called Mothers-Elect, occasional parthenogenesis,
    and an allusion to the Dragon-Maiden in Buddhist legend.
