canonical_text:
  quote: "“Here is the biwa; but of the biwa-player I see—only two ears!”"
  summary: A gruff-voiced visitor finds only Hōïchi’s ears visible, tears them off
    as proof of obedience to a lord, and leaves. Before sunrise, the priest returns,
    finds Hōïchi bleeding but seated in meditation, and explains that holy texts had
    been written over his body except on his ears. Hōïchi recovers, becomes famous,
    and is thereafter called Mimi-nashi-Hōïchi, “Hōïchi-the-Earless.”
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A gruff voice says it sees the biwa and only two ears of the biwa-player,
    concludes that there is no mouth to answer, and says it will take the ears to
    its lord as proof that commands were obeyed as far as possible.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hōïchi feels his ears gripped by iron-like fingers and torn off, but he gives
    no cry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the ears are torn off, heavy footfalls recede from the verandah through
    the garden to the roadway and cease, while Hōïchi feels warm blood trickling from
    both sides of his head and does not lift his hands.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before sunrise, the priest returns, slips on something clammy, sees that it
    is blood by lantern light, and finds Hōïchi seated in meditation with blood still
    oozing from his wounds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Hōïchi hears the priest’s voice, he feels safe, begins sobbing, and tells
    the priest about the night’s adventure.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The priest says that holy texts had been written everywhere on Hōïchi’s body
    except on his ears, blames himself for trusting the acolyte to do that part, and
    says the visitors will not trouble Hōïchi again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: With a doctor’s help Hōïchi recovers; the story spreads, noble persons come
    to hear him recite, he receives money, becomes wealthy, and is thereafter known
    as Mimi-nashi-Hōïchi, “Hōïchi-the-Earless.”
  category: sequence
  evidence_refs:
  - ev:6
