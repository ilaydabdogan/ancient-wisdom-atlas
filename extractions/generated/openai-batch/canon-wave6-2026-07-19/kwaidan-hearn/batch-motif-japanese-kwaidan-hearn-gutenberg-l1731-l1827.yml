canonical_text:
  quote: ''
  summary: Two woodcutters are trapped by a snowstorm at a river ferry and take shelter
    in an unheated hut. Minokichi sees a woman in white breathe on Mosaku, then spare
    him under a threat that he must never tell what he saw. Mosaku is found frozen
    dead, while Minokichi recovers and keeps silent. The following winter Minokichi
    meets a young woman named O-Yuki on the road, brings her home, and she remains
    as his mother’s daughter-in-law.
  language: English
  quote_policy: summarized
