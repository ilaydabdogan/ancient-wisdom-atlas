canonical_text:
  quote: ''
  summary: The speaker reflects on wanting burial in an ancient Buddhist graveyard,
    within hearing of a bell, and imagines possible rebirth from a bamboo flower-cup
    as a biting insect. The passage then opens an essay on ants after a storm, describing
    ants repairing their homes. A quoted Chinese story tells of a pious man visited
    by a yellow-robed goddess, who anoints his ears so he can understand ants for
    one day. By overhearing two ants, he discovers buried jars of gold. The narrator
    then compares this temporary supernatural hearing to the temporary perceptive
    aid granted by the personified Fairy of Science.
  language: English
  quote_policy: summarized
