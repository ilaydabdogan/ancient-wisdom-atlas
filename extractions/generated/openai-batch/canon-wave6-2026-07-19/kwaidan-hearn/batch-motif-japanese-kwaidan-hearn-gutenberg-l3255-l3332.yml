    cemetery behind the garden.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dr. Howard’s book is reported to advise putting petroleum or kerosene oil
    into stagnant breeding water to remove mosquitoes from a neighborhood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cemetery contains many tomb water-receptacles called mizutamé, as well
    as cups and flower-vessels holding water before tombs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Water is placed for the dead, flowers are offered, and relatives or friends
