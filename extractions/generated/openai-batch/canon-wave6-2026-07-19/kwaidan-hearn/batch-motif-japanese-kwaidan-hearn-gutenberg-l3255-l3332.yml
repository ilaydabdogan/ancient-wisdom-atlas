  evidence_refs:
  - ev:3
- id: obs:6
  text: Because the cemetery contains thousands of receptacles and many flower-vessels,
    the water cannot be renewed daily and becomes stagnant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator says the mosquitoes are born in the cemetery tanks and flower-vessels
    and rise by millions from the water of the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator reports that, according to Buddhist doctrine, some of the mosquitoes
    may be reincarnations of the dead condemned as Jiki-ketsu-gaki, or blood-drinking
    pretas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A film of kerosene on stagnant water is described as killing larvae when they
