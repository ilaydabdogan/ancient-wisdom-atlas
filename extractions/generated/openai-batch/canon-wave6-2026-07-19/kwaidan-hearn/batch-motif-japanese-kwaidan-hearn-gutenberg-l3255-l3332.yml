canonical_text:
  quote: "“they rise by millions from the water of the dead”"
  summary: The narrator describes a tormenting mosquito species traced to stagnant
    water in a Buddhist cemetery. Grave water-receptacles, flower-cups, and other
    vessels serve ritual needs for the dead but also breed mosquitoes. The narrator
    notes a Buddhist idea that some mosquitoes may be reincarnated dead condemned
    as blood-drinking pretas, then contrasts scientific kerosene extermination with
    religious non-killing, filial piety, and preservation of ancestral graveyards.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The first-person narrator says he is persecuted by a small silver-speckled
    mosquito with a painful bite and a distinctive hum.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator identifies the mosquito as resembling Stegomyia fasciata or Culex
