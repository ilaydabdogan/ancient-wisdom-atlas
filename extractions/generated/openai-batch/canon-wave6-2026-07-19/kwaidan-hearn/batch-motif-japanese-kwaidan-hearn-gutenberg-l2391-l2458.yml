  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a larger ant structure, many small ants swarm around one very large ant
    with yellowish wings and a long black head.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Akinosuké identifies the large ant and central structure with the King and
