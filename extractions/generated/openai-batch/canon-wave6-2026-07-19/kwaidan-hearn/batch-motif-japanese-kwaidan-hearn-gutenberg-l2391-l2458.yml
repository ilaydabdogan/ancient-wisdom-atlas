canonical_text:
  quote: ''
  summary: Akinosuké is ordered by the King of Tokoyo to return home, leaves by ship,
    and suddenly wakes under a cedar-tree in his garden. His friends report that a
    yellow butterfly hovered over his face, was pulled into an ant-hole by a large
    ant, later emerged, and may have entered his mouth. Excavation under the cedar
    reveals a large ant colony resembling miniature towns; Akinosuké identifies features
    as places from his dream and finds a mound with a pebble like a Buddhist monument
    over the body of a dead female ant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A messenger reports that the King of Tokoyo commands Akinosuké to be sent
    back to his own people and country, while the seven children will remain cared
    for as the King’s grandchildren.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Akinosuké prepares to depart, is escorted to a port, embarks on a ship, and
    then suddenly wakes under the cedar-tree in his garden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Akinosuké tells his friends of a dream lasting twenty-three years in Tokoyo
    and Raishū, though they say he slept only a few minutes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: One gōshi says a little yellow butterfly fluttered over Akinosuké’s face,
    was seized by a large ant and pulled into a hole, then later came out again and
    fluttered over his face before disappearing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another gōshi suggests the butterfly may have been Akinosuké’s soul and says
