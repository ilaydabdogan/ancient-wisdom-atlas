comparison_claims:
- id: claim:1
  claim: The passage presents much Japanese butterfly literature and some aesthetic
    customs as likely influenced by Chinese butterfly literature and precedent.
  claim_level: historical_contact
  target: Chinese butterfly stories and Japanese butterfly literature/custom
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is based on the passage’s literary-historical commentary;
    it does not quote or analyze the Chinese source texts directly.
- id: claim:2
  claim: The passage cautiously raises Chinese derivation for some weird Japanese
    butterfly beliefs, while also allowing that those beliefs might be older than
    China.
  claim_level: historical_contact
  target: Chinese and Japanese beliefs about butterflies as souls
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: low
  limitations: The passage itself marks the derivation as possible and immediately
    notes an alternative of greater antiquity.
- id: claim:3
  claim: The passage explicitly separates wedding paper butterflies from ghostly butterfly-soul
    beliefs, treating them instead as emblems of living marital union.
  claim_level: same_function
  target: Non-ghostly wedding emblem versus butterfly-soul belief in the same passage
  evidence_refs:
  - ev:14
  counter_evidence_refs:
  - ev:12
  confidence: high
  limitations: This is an internal functional comparison within the passage, not a
    cross-cultural historical claim.
