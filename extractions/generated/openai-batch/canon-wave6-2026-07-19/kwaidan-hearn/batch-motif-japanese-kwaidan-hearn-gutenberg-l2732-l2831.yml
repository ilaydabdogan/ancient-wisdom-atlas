canonical_text:
  quote: ''
  summary: 'The passage surveys butterfly lore in Chinese and Japanese literary and
    folk contexts: spirit-maidens tell a scholar butterfly stories; butterflies are
    linked with beauty, choice of lovers, dream-transformation, souls of the living
    and dead, portents, vengeance, and wedding emblems of paired union.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Chinese scholar known in Japanese literature as Rōsan is described as beloved
    by two spirit-maidens, celestial sisters, who visit him every ten days and tell
    him stories about butterflies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator mentions a Chinese maiden whom butterflies mistook for a flower
    and followed in great numbers because she was fragrant and fair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Emperor Gensō/Ming Hwang is said to have released caged butterflies among
    beautiful ladies so that the butterflies would fly to the fairest, who would then
    receive imperial favor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The scholar Sōshū is described as having dreamed he was a butterfly, with
    the passage adding that his spirit had wandered in butterfly shape and that butterfly
    sensations remained after waking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator refers to a Chinese official recognition of certain butterflies
    as spirits of an emperor and his attendants.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says much Japanese butterfly literature, except some poetry, appears
    to be of Chinese origin, and that Chinese precedent explains some Japanese professional
    names connected with butterflies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage notes Japanese and regional naming practices in which words meaning
    butterfly are used for professional names, women’s personal names, and, in Mutsu,
    the youngest daughter in a family.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Japanese belief is described in which the soul of a living person may wander
    in the form of a butterfly.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A related notion says that if a butterfly enters a guest-room and perches
    behind the bamboo screen, the person most loved by the viewer is coming to visit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A historical episode is described in which a vast swarm of butterflies appears
    in Kyōto while Taïra-no-Masakado is secretly preparing revolt, frightening people
    as a portent of coming evil.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The narrator suggests that the butterflies in the Kyōto swarm may have been
    supposed to be spirits of people doomed to die in battle.
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that in Japanese belief a butterfly may be the soul of
    a dead person as well as a living person, and that souls take butterfly shape
    to announce final departure from the body.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Because a butterfly may be a soul, the passage says any butterfly entering
    a house ought to be kindly treated.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: In the play named in the passage, Kochō kills herself after false accusations
    and cruel treatment; later her hairpin turns into a butterfly and guides an avenger
    to the villain’s hiding place.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Large paper butterflies used at weddings are described as non-ghostly emblems
    expressing joy in living union and hope that the couple will pass through life
    together like a pair of butterflies.
  category: attribute
  evidence_refs:
  - ev:14
