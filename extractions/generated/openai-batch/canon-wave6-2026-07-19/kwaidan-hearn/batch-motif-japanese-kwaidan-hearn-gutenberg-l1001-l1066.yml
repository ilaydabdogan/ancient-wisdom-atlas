canonical_text:
  quote: ''
  summary: The passage explains forms of nazoraëru, or mimetic magic, through examples
    involving a straw effigy, a robber’s footprints, and objects substituted for the
    Bell of Mugen. It recounts how Umégaë broke a bronze basin as if it were the bell
    and received gold, then tells of a farmer who broke a clay model of the bell and
    received a covered jar from a white-robed woman.
  language: English
