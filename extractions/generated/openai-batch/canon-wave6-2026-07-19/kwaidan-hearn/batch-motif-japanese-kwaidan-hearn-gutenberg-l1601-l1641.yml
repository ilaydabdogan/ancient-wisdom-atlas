canonical_text:
  quote: ''
  summary: After leaving Suwa, Kwairyō is stopped by a robber who demands his clothing.
    The robber sees a head attached to Kwairyō’s robe and offers his own robe plus
    money for it, thinking it can frighten people. Kwairyō warns that it is a goblin’s
    head, not a human head. The robber takes the head and robe, later learns the true
    story near Suwa, fears the spirit of the Rokuro-Kubi, and returns to the mountain
    cottage in Kai. Unable to find the body, he buries the head alone in a grove,
    sets up a tombstone, and has a Ségaki-service performed for the spirit.
  language: English
  quote_policy: summarized
