canonical_text:
  quote: ''
  summary: The passage speculates, using Spencer and insect biology, that future human
    social equilibrium, greater intelligence, and long life might require physiological
    change, reduced fertility, and suppression or control of sex-life analogous to
    ants. It frames longevity and social advantage as requiring a price under cosmic
    law, and concludes that the highest strength appears to be unselfishness rather
    than cruelty or lust. The latter part contains notes explaining terms from another
    section, including crabs, Shimonoseki/Bakkan, the biwa, biwa-hōshi, bachi, samurai
    gate language, awaré, and shinobi no go-ryokō.
  language: English
  quote_policy: summarized
