canonical_text:
  quote: ''
  summary: Musō reports a corpse-eating Shape seen in a death-chamber. Villagers say
    there has been no hill priest or hermitage for generations. Musō returns to the
    hill, meets the aged hermit again, and hears him confess that he is a jikininki,
    a former priest reborn as a corpse-eater because he performed rites selfishly.
    The hermit asks for a Ségaki-service and prayers; then he and the hermitage vanish,
    leaving Musō beside an old priestly tomb.
  language: English
  quote_policy: summarized
