  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The recluse says that because of selfish impiety he was reborn immediately
    after death as a jikininki and must devour corpses of people who die in the district.
  category: speech
  evidence_refs:
  - ev:7
