canonical_text:
  quote: "“Before I go, it will be necessary to protect your body by writing holy
    texts upon it.”"
  summary: After Hōïchi repeatedly leaves the temple at night, servants follow him
    and find him in a cemetery before Antoku Tennō’s memorial tomb, playing the biwa
    and chanting amid ghostly fires. The priest explains that Hōïchi has been responding
    to the dead and protects him by having the Hannya-Shin-Kyō written over his body.
    Hōïchi is instructed to sit silently and motionless when called; after dark, an
    unseen voice calls him three times and approaches.
  language: English
  quote_policy: quoted
