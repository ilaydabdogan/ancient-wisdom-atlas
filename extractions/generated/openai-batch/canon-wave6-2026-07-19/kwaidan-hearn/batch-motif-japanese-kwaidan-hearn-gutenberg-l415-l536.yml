  text: The servants seize Hōïchi and forcibly bring him back to the temple, where
    the priest demands an explanation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The priest tells Hōïchi that he has been spending nights among the tombs of
    the Heiké, that most of what he imagined was illusion except the calling of the
    dead, and that further obedience would lead to his being torn apart.
  category: speech
  evidence_refs:
  - ev:4
