canonical_text:
  quote: ''
  summary: Two children on a wooded Welsh hill look for fairy-rings, discuss goblins,
    hear a wandering harper whose song deeply affects the child narrator, and later
    regard him through fears of gipsies, wizards, fairies, and child-stealing. In
    an adult recollection, a Japanese sunflower called Himawari recalls the song and
    Robert. The following opening of “Hōrai” describes a Japanese silk painting of
    a sea-and-sky mirage showing Hōrai and the Palace of the Dragon-King.
  language: English
  quote_policy: summarized
