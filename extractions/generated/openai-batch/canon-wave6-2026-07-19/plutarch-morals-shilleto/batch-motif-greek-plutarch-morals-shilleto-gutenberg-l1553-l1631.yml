canonical_text:
  quote: ''
  summary: In a dialogue on love and marriage, the speaker defends Ismenodora against
    objections that she is wealthy, influential, and in love. He gives examples of
    women who gained power through male lovers, including Semiramis, Belestiche, and
    Phryne, but argues that rich or high-born wives need not dominate husbands if
    husbands act with self-control and good sense. He also argues that a somewhat
    older sensible wife may guide a younger husband well, and cites Hercules giving
    Megara to Iolaus as a Boeotian precedent for accepting age inequality in marriage.
  language: English
  quote_policy: summarized
