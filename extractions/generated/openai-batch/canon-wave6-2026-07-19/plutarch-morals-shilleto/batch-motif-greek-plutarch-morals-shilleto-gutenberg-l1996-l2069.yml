    affection from his boy-love, Chalcidian and Theban military-erotic customs, individual
    acts of courage motivated by a beloved's gaze, and mythic or heroic examples involving
    Epaminondas, Hercules, Iolaus, Admetus, Alcestis, and Apollo.
