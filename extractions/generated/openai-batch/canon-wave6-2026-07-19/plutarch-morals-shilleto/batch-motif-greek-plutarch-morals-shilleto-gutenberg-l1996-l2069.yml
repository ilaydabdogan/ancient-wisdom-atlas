comparison_claims:
- id: claim:1
  claim: The passage presents Aristotle's and Dionysius' accounts as variants of the
    Cleomachus martial-love story, differing in origin and names while remaining attached
    to the Chalcidian context.
  claim_level: same_motif
  target: Aristotle's account and Dionysius' Causes as variants of the Cleomachus
    story
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to the variants as summarized by this passage;
    no external text is used.
- id: claim:2
  claim: 'The passage aligns Chalcidian and Theban traditions by giving both the same
    function: erotic bonds strengthen battlefield courage and cohesion.'
  claim_level: same_function
  target: Chalcidian Cleomachus tradition and Theban lover-beloved military custom
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The alignment is part of the speaker's rhetorical argument and should
    not be treated as independent historical proof.
- id: claim:3
  claim: The passage groups heroic and divine relationships involving Hercules, Iolaus,
    Admetus, Alcestis, and Apollo as further examples of love's power among heroes
    and gods.
  claim_level: same_function
  target: Greek heroic and divine erotic-attachment examples in the closing catalogue
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The examples are brief allusions and do not establish detailed narrative
    equivalence.
