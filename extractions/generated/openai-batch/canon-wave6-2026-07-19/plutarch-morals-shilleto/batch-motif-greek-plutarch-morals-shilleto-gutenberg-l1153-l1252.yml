canonical_text:
  quote: ''
  summary: Plutarch argues that love for offspring arises from nature rather than
    law, gain, inheritance, or later repayment. He describes mothers caring for infants
    even in painful childbirth, invokes the Ilithyiae as divine helpers of labor,
    contrasts human childrearing with quicker agricultural and animal returns, notes
    fathers who did not live to see famous sons, and argues that childless wealth
    attracts would-be heirs. He then treats self-destruction and offspring-destruction
    as diseases or deviations from nature, noting that animal killing of young is
    viewed as an evil omen requiring sacrifice, while poverty may lead some parents
    not to rear children.
  language: English
  quote_policy: summarized
