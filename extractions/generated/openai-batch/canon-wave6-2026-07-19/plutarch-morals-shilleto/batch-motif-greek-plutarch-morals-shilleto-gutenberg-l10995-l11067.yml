canonical_text:
  quote: ''
  summary: In a discussion of restraining anger, the speaker describes curing anger
    by observing its visible and vocal effects in others. He cites examples from medicine,
    public speaking, mirrors, Athene, Marsyas, the sea, fever, wine, and Sappho to
    argue that anger deforms appearance, roughens speech, and is best checked by self-observation
    and silence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he began curing anger by observing its effects in other people,
    comparing this to Lacedaemonians studying drunkenness in the Helots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People affected by anger are described as changing face, colour, walk, and
    voice, and as losing ordinary behaviour and gentleness in conversation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he would be disgusted if he appeared frightful, wild, or
    unlike himself before friends, wife, and daughters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Caius Gracchus is said to have used a pitch-pipe held by a slave during speeches
    so that a gentle note could lower and soften his voice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says he would not be vexed if a companion showed him a looking-glass
    during fits of anger, because seeing his distorted countenance would condemn anger.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The poets are said to tell that Athene was rebuked by a Satyr while playing
