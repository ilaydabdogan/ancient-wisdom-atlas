  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Anger is described as puffing and distending the face and producing a harsh,
    unpleasant voice.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says an agitated sea throws up tangle and seaweed, and compares
