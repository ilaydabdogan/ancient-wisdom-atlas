- id: motif:5
  label: Withdrawal from worldly distractions for contemplation
  taxonomy_refs:
  - wisdom
  basis: The passage says that philosophers establish study places away from towns
    and favor night because quiet and withdrawal aid thought.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The Democritus anecdote is identified by the passage as false, so the
    motif rests on the general claim about philosophers, not on the alleged self-blinding
    act.
