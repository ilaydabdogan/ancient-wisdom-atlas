  quote: ''
  summary: 'The passage gives practical exercises for restraining curiosity: avoiding
    trivial inscriptions, not looking into houses, not joining quarrels or crowds,
    and abstaining from spectacles that attract the senses. It uses animal and household
    analogies for disciplined perception and cites Greek figures as examples of either
    susceptibility to sight or restraint from visual temptation.'
  language: English
  quote_policy: summarized
