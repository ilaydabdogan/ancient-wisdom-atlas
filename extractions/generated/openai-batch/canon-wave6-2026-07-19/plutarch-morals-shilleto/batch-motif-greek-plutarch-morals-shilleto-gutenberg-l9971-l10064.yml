candidate_motifs:
- id: motif:1
  label: Training curiosity through abstention from minor stimuli
  taxonomy_refs:
  - wisdom
  basis: The passage explicitly treats curiosity as curable by habit and gives small
    exercises for restraining attention before moving to stronger attractions.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The taxonomy reference is broad; the passage is philosophical instruction
    rather than narrative myth.
- id: motif:2
  label: Reason bridling the senses
  taxonomy_refs:
  - wisdom
  - duality
  basis: The passage contrasts roving or runaway senses with reason that should govern
    them, using leashes, bridling, an ill-trained maid, and bolting horses as images
    of control or loss of control.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:8
  confidence: medium
  cautions: The duality reference is limited to moral psychology in the passage, not
    a cosmic or mythic dualism.
- id: motif:3
  label: Intrusive gaze as trespass across a boundary
  taxonomy_refs: []
  basis: Looking into another person's house is likened to entering it with one's
    feet, and peeping into litters or windows is linked to vice.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: This is an ethical image rather than an explicitly mythological motif.
- id: motif:4
  label: Refusal to gaze at dangerous beauty
  taxonomy_refs:
  - wisdom
  basis: Cyrus and Alexander are praised as examples of avoiding the sight of beautiful
    women in order to prevent distraction or temptation.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The motif is supported as a moral exemplum within the passage; no historical
