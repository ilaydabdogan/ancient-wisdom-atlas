canonical_text:
  quote: ''
  summary: 'Thespesius, accompanied at first by a guide, witnesses afterlife punishments:
    tortured kin, his guilty father, hidden vice exposed, mutually devouring souls,
    metallic lake torments for cupidity, descendants pursuing guilty ancestors, souls
    forcibly remade for animal rebirth, and Nero''s altered fate. At the end, women
    intervene over whether to mark him for memory, and he is carried by wind back
    to his body near his tomb.'
  language: English
  quote_policy: summarized
