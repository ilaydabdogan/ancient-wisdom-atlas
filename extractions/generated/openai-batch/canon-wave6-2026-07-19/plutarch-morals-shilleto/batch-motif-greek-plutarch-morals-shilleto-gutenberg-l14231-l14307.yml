canonical_text:
  quote: ''
  summary: A dialogue speaker begins a promised story about Thespesius of Soli, also
    called Aridaeus. Formerly profligate, he consults the oracle of Amphilochus and
    is told he will do better after death. After a fall from a great height, he appears
    dead for three days and revives just before burial, later becoming morally reformed.
    He reports that his soul left his body and entered an aerial, luminous realm where
    he saw stars and souls of the dead rising, moving in different ways, and showing
    troubled or joyful states. A deceased relation greets him by a new name, explains
    that he is not fully dead because the rest of his soul remains in the body like
    an anchor, and gives signs distinguishing the dead from him.
  language: English
  quote_policy: summarized
