canonical_text:
  quote: ''
  summary: Plutarch argues that pugnacity, jealousy, and envy should be diverted away
    from friends and toward enemies; that enemies' successes should be studied for
    emulation and their faults for avoidance; and that virtue should not be exchanged
    for wealth, applause, office, or corrupt power.
  language: English
  quote_policy: summarized
literal_observations:
