  text: The passage states that every person's nature contains pugnacity, jealousy,
    and envy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage recommends purging or diverting these passions away from companions
    and friends and toward enemies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Onomademus, after victory in a disturbance at Chios, advised his party not
    to expel all members of the opposing faction, so that internal quarrels among
    friends would not begin after all enemies were removed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage cites examples of envy among people of the same occupation or
    close relationship, including potter, singer, neighbour, cousin, and brother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If no other way exists to remove strife and envy, the passage advises directing
    vexation and acerbity toward enemies' good fortune.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage compares this redirection to gardeners planting garlic and onions
    beside roses and violets so bitter or strong elements may be transferred away
    from the flowers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that an enemy who attracts one's envy and malignity can make
    one kinder and more agreeable to prosperous friends.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage advises rivalry with enemies for glory, office, or righteous gain
    by observing how they advance and trying to surpass them in industry, hard work,
    soberness, and prudence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Themistocles is presented as saying that Miltiades' victory at Marathon would
    not let him sleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person not blinded by hate can discern that much of what is envied in others
    comes from diligence, prudence, and good actions, and can improve by imitating
    these qualities.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: If enemies gain power by flattery, fraud, bribery, or venal service, the passage
    says this should lead one to take pleasure in one's own liberty, purity, and independence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage cites Plato and Solon to support the claim that virtue is worth
    more than gold or wealth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says virtue should not be given up for applause, honours, chief
