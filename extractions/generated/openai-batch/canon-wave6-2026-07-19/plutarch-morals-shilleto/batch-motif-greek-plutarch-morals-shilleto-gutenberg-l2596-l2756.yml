    announces a marriage sacrifice. Pisias, formerly opposed to the marriage, has
    yielded to Ismenodora and is preparing, crowned and dressed in white, to lead
    a procession to the god through the market-place. The narrator's father urges
    the group to go, worship the god, and laugh at Pisias, saying the god has been
    delighted and propitious. The remainder of the passage consists of translator
    notes explaining literary and mythological allusions.
