canonical_text:
  quote: ''
  summary: 'The passage opens Plutarch''s essay on distinguishing a flatterer from
    a friend. It argues that self-love makes people poor judges of themselves and
    gives flatterers an opening. Truth and self-knowledge are associated with the
    gods and Apollo''s maxim, while flattery implants self-deceit. The passage develops
    several analogies: wood-worms in soft wood, lice abandoning dying bodies, a friend
    tested like money, poison tested by tasting, fire as a sauce, and false gold imitating
    true gold. It concludes that genuine friendship may be pleasant and praising,
    but also censures at the proper time.'
  language: English
  quote_policy: summarized
