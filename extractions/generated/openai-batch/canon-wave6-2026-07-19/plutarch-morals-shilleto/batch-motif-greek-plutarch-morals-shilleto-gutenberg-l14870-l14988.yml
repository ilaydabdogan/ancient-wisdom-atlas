canonical_text:
  quote: ''
  summary: 'The passage argues against borrowing and debt through a series of analogies:
    debtors pass from one money-lender to another, deepen their obligations, and lose
    freedom and property. Rich debtors are urged to give up chattels rather than become
    chattels themselves. The passage uses a fable of two vultures, Homeric images
    of Odysseus in a storm, examples of philosophers or poets abandoning possessions,
    and the myth of Phineus and the Harpies to describe creditors as destructive forces.
    The next section opens by criticizing the precept to ''live unknown'' as self-contradictory.'
  language: English
  quote_policy: summarized
