canonical_text:
  quote: ''
  summary: The passage argues against talkativeness. It presents the tongue as physically
    guarded by teeth and morally governed by reason, contrasts sober silence with
    drunken foolish speech, gives anecdotes of Bias and Zeno holding their tongues
    at drinking bouts, uses Lysias and Homer to warn against repetition, and concludes
    that misused speech harms companionship rather than attracting affection.
  language: English
  quote_policy: summarized
