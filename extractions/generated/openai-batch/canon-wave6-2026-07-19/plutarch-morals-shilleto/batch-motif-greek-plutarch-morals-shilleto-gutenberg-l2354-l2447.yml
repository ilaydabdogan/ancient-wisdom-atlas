canonical_text:
  quote: ''
  summary: 'The passage argues against treating Love as mere licentious desire and
    describes Love-inspired marriage as mutual unity, respect, and constancy. It gives
    examples of fidelity: Lais leaving other lovers for Hippolochus, and Camma, priestess
    of Artemis and wife of the murdered Sinatus, deceiving Sinorix into sharing poisoned
    mead at an altar and dying after avenging her husband.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker rejects a view attributed to Zeuxippus that Love is only irregular
    desire carrying the soul toward licentiousness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some men are described as marrying women for dowries or seeking children more
    than wives, without caring to love or be loved.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A marriage inspired by Love is described as lacking separate ownership claims
    and as making bodily separate spouses one in soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says that if the god Love enters the soul of a licentious man,
    he gives up other amours and becomes constant to one person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lais is described as a famous courtesan who fell in love with Hippolochus,
    left Acro-Corinthus and her other lovers, went to Thessaly, and lived faithful
    to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women in Thessaly, said to be envious and jealous of Lais, dragged her into
    a temple of Aphrodite and stoned her to death; the temple is said to be called
    Aphrodite the Murderess.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage mentions servant girls refusing masters' embraces and private
    individuals rejecting affairs with queens when Love dominates their hearts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Camma is described as a beautiful Galatian woman, wife of the tetrarch Sinatus;
    Sinorix, an influential Galatian in love with her, murdered Sinatus after failing
    to obtain her by force or persuasion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Sinatus's death, Camma found refuge in her hereditary priestly service
    to Artemis, spent much time in the temple, and refused many royal and powerful
    suitors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Sinorix proposed marriage, Camma received him, led him to the goddess's
    altar, and shared with him a cup of poisoned mead, drinking half and giving him
    the rest.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Sinorix drank, Camma joyfully invoked her dead husband, said she had
    avenged him, and asked him to take her; Sinorix died soon after and Camma died
    later with courage and gaiety.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The speaker says similar examples could be given among Greeks and foreigners
    and argues that Aphrodite, when associated with Love, does not hinder friendship.
  category: speech
  evidence_refs:
  - ev:9
