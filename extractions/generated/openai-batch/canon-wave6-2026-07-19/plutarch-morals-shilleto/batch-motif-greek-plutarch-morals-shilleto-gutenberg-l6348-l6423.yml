canonical_text:
  quote: ''
  summary: The passage contrasts true friendship, grounded in stable likeness of character
    and pursuits, with flattery, which imitates another person's tastes in order to
    trap and please him. It describes the flatterer as a counterfeit who changes habits,
    speech, dress, and interests according to the target, using images of bait, snares,
    water in flux, ape-like imitation, and Circe's cup. Examples include the Syracusan
    court under Dionysius, Alcibiades' changing conduct in different places, and the
    contrasting consistency of Epaminondas, Agesilaus, and Plato.
  language: English
  quote_policy: summarized
