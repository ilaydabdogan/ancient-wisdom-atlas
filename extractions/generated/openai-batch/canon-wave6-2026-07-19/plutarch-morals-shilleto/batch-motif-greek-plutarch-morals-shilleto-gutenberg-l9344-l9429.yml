canonical_text:
  quote: So the meaning of the questioner ought to be the standard for the answer.
  summary: The passage distinguishes necessary, polite, and superfluous answers, criticizes
    talkativeness, and advises speakers to measure answers by the questioner’s need.
    It then warns that people are most verbose about favorite subjects, past successes,
    loves, and areas of expertise, giving examples from Socrates, Homeric Nestor,
    Cyrus, and a reader of Ephorus.
  language: English
  quote_policy: quoted
