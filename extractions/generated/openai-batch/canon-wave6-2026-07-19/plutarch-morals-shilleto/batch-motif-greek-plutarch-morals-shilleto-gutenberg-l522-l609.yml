canonical_text:
  quote: philosophy is the only cure for the maladies and disorders of the soul
  summary: The passage advises freeborn boys to acquire a limited general education
    but to cultivate philosophy seriously. It presents philosophy as moral guide and
    cure of the soul, recommends combining public life with philosophical contemplation,
    urges the collection of old books, prescribes bodily and martial training, frames
    education as desirable for poor and rich alike, and recommends exhortation, praise,
    and censure rather than blows or abuse.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A freeborn lad is advised to take only a smattering of general knowledge while
    seriously cultivating philosophy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author uses the image of sailing around many cities but living in the
    best, and cites Bion's comparison involving Penelope, her suitors, and her maids,
    to explain the preference for philosophy over lesser pursuits.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Philosophy is called the most important branch of study and the only cure
    for the maladies and disorders of the soul; it is also described as ruler and
    guide.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Philosophy is said to teach distinctions between honourable and disgraceful,
    just and unjust, what to seek and avoid, and proper conduct toward gods, parents,
    elders, laws, foreigners, rulers, friends, women, children, and slaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that philosophy teaches moderation in prosperity, adversity,
    pleasure, and anger, and that conquering passions by reason marks a wise man.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Those who unite political ability with philosophy are called perfect men,
    combining public service with calm philosophical life; Pericles, Archytas, Dion,
    and Epaminondas are named as examples.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old books should be procured and collected; books are described as an instrument
    in education, and learning is linked with going to the fountain head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Boys should be sent to the master of the gymnasium for training in bodily
    carriage and strength, and good bodily habit in youth is described as the foundation
    of a good old age.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bodily exertion should be managed so that fatigue does not make boys unfit
    for study; excessive sleep and fatigue are called enemies to learning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lads should be trained for warlike encounters, including hurling the javelin
    and darts and participating in the chase; the spare warrior is said to make the
    best combatant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author says his teaching is intended to be general and suitable to all,
    including poor and rich children, though poverty may prevent some from following
    the precepts fully.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Boys should be drawn to good pursuits by entreaties and exhortation, not by
    blows or abusive language, which are described as more fitting for slaves than
    for the freeborn.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Praise and censure should be used alternately; the passage compares encouragement
    after censure to nurses giving the breast to sobbing children, and warns against
    excessive praise.
  category: sequence
  evidence_refs:
  - ev:9
