canonical_text:
  quote: ''
  summary: 'The dialogue argues that punishment of the wicked may be delayed for a
    useful or fitting outcome. It gives legal, historical, divine, family-lineage,
    and retributive exempla: a pregnant condemned woman spared until birth, wicked
    rulers used as instruments of correction, bad lineages producing good descendants,
    wrongdoers later punished by the same weapon or by striking accidents, a temple
    thief''s household burned, and Bessus exposing his hidden parricide after killing
    swallows. The passage closes by contrasting Plato and Hesiod on whether punishment
    follows crime or grows with it.'
  language: English
  quote_policy: summarized
