comparison_claims:
- id: claim:1
  claim: The passage itself reports a Greek adoption of an Egyptian law that delays
    execution of pregnant condemned women, and uses that legal pattern as an analogy
    for delaying punishment until a future benefit appears.
  claim_level: historical_contact
  target: Egyptian legal practice as reported to have been adopted by some Greeks
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The extraction uses only the speaker's report in this passage and provides
    no external corroboration of the legal history.
- id: claim:2
  claim: 'The passage explicitly contrasts Hesiod''s and Plato''s accounts of punishment:
    Plato is summarized as making punishment follow crime, while Hesiod is presented
    as making it contemporaneous with crime and self-returning.'
  claim_level: same_function
  target: Hesiodic and Platonic explanations of the relation between wrongdoing and
    punishment
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The Platonic position is given only in the speaker's summary; only
    Hesiodic sayings are quoted.
- id: claim:3
  claim: The speaker compares unpleasant animal medicines with wicked rulers used
    for correction; both are said to function as harsh but useful cures.
  claim_level: same_function
  target: Medical cure analogy for social or divine correction
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal analogy in the argument, not evidence by itself
    for transmission between traditions.
- id: claim:4
  claim: The later exempla of Callippus, Mitius' murderer, Aristo, and Bessus are
    framed as cases illustrating the Hesiodic pattern that wrongdoing brings harm
    back upon the wrongdoer.
  claim_level: same_function
  target: Hesiodic self-returning harm pattern applied to retributive exempla
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: 'The examples vary in mechanism: some are mirrored punishments, one
