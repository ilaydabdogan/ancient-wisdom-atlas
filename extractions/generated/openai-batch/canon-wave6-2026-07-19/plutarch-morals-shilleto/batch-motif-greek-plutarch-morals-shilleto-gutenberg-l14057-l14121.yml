canonical_text:
  quote: ''
  summary: In a philosophical dialogue, Olympicus questions whether the speaker has
    assumed the permanence of the soul. The speaker connects divine providence and
    moral recompense with the soul's survival after death, cites ritual honors for
    the dead and Pythian oracles, recounts cases involving Archilochus, Corax, Tettix,
    Pausanias, and necromancers, and argues that punishments affecting descendants
    deter wrongdoing. The speaker then postpones a story that might be taken as myth.
  language: English
  quote_policy: summarized
