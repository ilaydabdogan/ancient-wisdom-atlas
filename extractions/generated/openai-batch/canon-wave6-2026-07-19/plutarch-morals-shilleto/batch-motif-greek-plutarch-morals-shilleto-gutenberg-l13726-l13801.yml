candidate_motifs:
- id: motif:1
  label: wrongdoing carries its own punishment
  taxonomy_refs: []
  basis: The passage repeatedly states that wickedness creates its own pain, torment,
    shame, fear, remorse, and anxiety at the time of wrongdoing rather than only after
    a later penalty.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: This is primarily a moral-philosophical pattern rather than a narrative
    myth motif.
- id: motif:2
  label: hidden punishment beneath outward splendor
  taxonomy_refs: []
  basis: Theatrical criminals in splendid costume and powerful wicked people are presented
    as apparently admirable while already subject to punishment.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The theatre example functions as an analogy within an ethical argument.
- id: motif:3
  label: life as prison with suspended execution
  taxonomy_refs: []
  basis: The guilty life is compared to a prison without escape, with ordinary pleasures
    continuing while a rope hangs overhead.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The image is metaphorical and not presented as a mythic afterlife scene.
- id: motif:4
  label: pleasure of wrongdoing as baited hook
  taxonomy_refs: []
  basis: Wrongdoing is compared to a fish swallowing a hook, with pleasure as bait
    and conscience vexing the wrongdoer afterward.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an ethical analogy rather than a developed narrative episode.
- id: motif:5
  label: ominous dreams and apparitions afflict the guilty
  taxonomy_refs:
  - divine_judgment
  basis: The passage states that dreams, apparitions, oracles, lightning, and signs
    thought to come from deity bring apprehension to the guilty, then lists multiple
    dreams and apparitions.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is cautious because the passage says the signs
    are thought to come from deity, but not every example is explicitly called divine
    judgement.
- id: motif:6
  label: bloody serpent or dragon dream announcing an avenger
  taxonomy_refs:
  - serpent
  basis: Clytaemnestra sees a bloody-headed dragon in a dream, and Orestes appears
    to come from it.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage cites Stesichorus briefly and does not explain the dream’s
    wider narrative context.
- id: motif:7
  label: body dismemberment and boiling in a punitive dream
  taxonomy_refs: []
  basis: Apollodorus dreams that Scythians flay and boil him, while his heart speaks
    from the caldron.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The event is explicitly a dream vision, not an external action in waking
    life.
- id: motif:8
  label: trial by dead or animal judges in a dream
  taxonomy_refs:
  - divine_judgment
  basis: Ptolemy Ceraunus is dreamed as summoned for trial by Seleucus, with vultures
    and wolves acting as judges and tearing his flesh.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The dream involves judgement, but the judges are animals and the passage
    does not explicitly identify the scene as divine or afterlife judgement.
- id: motif:9
  label: murdered victim returns in dreams to summon killer to judgement
  taxonomy_refs: []
  basis: Cleonice, killed by Pausanias, repeatedly appears in his dreams and calls
    him near for judgement.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The apparition occurs in dreams; the passage does not describe a full
    ghost narrative beyond the repeated dream appearances.
- id: motif:10
  label: necromantic summoning of the dead by propitiation and sacrifice
  taxonomy_refs: []
  basis: Pausanias travels to a place where souls of the dead could be summoned and
    calls up Cleonice’s soul by propitiations and sacrifices.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage names the practice and result but gives little ritual detail.
comparison_claims:
- id: claim:1
  claim: The passage explicitly uses Stesichorus’ account of Clytaemnestra’s dream
    as a parallel example for the way guilty people experience frightening dreams
    or signs.
  claim_level: same_function
  target: Stesichorus’ Clytaemnestra dream tradition
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only a short quotation-like summary of the dream
    and does not compare full narrative versions.
- id: claim:2
