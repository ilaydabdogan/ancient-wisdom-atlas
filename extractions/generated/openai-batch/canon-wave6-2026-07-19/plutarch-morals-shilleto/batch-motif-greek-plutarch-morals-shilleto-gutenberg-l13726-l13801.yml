canonical_text:
  quote: vice fabricates for itself each of its own torments
  summary: The passage argues that wrongdoing carries punishment within itself through
    fear, remorse, conscience, and apprehension before any final external penalty.
    It illustrates this thesis through analogies of theatrical criminals, prisoners
    under death sentence, hemlock, and a hooked fish, and through examples of ominous
    dreams and apparitions involving Clytaemnestra, Apollodorus, Hipparchus, Ptolemy
    Ceraunus, and Pausanias with Cleonice.
  language: English
  quote_policy: quoted
