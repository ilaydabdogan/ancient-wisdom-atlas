canonical_text:
  quote: ''
  summary: Plutarch writes to Paccius explaining that, because Eros must leave quickly
    for Rome after Fundanus's urgent letter, he sends copied notes on contentedness
    of mind. He argues that status, wealth, and power do not cure mental distress;
    practiced reason must be ready to restrain emotional disturbance. He uses Xenophon's
    advice about honoring the gods before trouble, a comparison to savage dogs soothed
    by a familiar voice, and examples from women in the house, Laertes, Achilles,
    Epicurus, and Menander to argue that idleness or a particular social station does
    not itself bring ease of mind.
  language: English
  quote_policy: summarized
