canonical_text:
  quote: ''
  summary: 'A dialogic speaker challenges a previous argument, recalls Greek honours
    paid to descendants of poets and heroes, and argues that inherited honour for
    good stock makes inherited punishment for bad stock less unreasonable. The speaker
    then describes inquiry into the deity as dark and labyrinthine, and offers examples
    of hidden transmission: ritual protection from disease, a she-goat''s herb affecting
    a herd, plague spreading from Arabia to Athens, and vengeance falling on descendants
    of wicked cities.'
  language: English
  quote_policy: summarized
