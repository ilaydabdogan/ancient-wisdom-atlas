canonical_text:
  quote: ''
  summary: The speaker consoles his wife over the death of their young daughter by
    urging grateful memory of the child's brief life, restraint toward Fortune and
    the gods, and attention to remaining blessings. He then turns to inherited and
    Dionysiac mystery traditions about death, describing the soul as incorruptible,
    liable after long embodiment to return to bodily life, but able after brief embodiment
    to be liberated by higher powers and recover its former brightness.
  language: English
  quote_policy: summarized
