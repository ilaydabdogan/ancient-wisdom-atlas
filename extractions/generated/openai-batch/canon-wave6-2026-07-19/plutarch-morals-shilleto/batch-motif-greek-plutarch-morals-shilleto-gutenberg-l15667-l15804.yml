canonical_text:
  quote: ''
  summary: The passage argues that exile is not inherently disgraceful. It rebuts
    Polynices' and Jocasta's complaints, lists Greek mythic and civic figures whose
    exile or migration did not prevent honor, foundation, religious teaching, or royal
    lineage, then extends exile into a philosophical image of the soul as a stranger
    in the body. It ends by contrasting philosophers who retained wisdom in prison
    or death with Phaethon and Tantalus, who reached heaven but fell into misfortune
    through folly.
  language: English
  quote_policy: summarized
