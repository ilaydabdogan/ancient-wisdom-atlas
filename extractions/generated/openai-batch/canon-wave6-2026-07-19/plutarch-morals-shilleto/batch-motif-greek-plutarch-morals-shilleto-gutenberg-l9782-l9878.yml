canonical_text:
  quote: ''
  summary: The passage advises redirecting curiosity away from private scandals and
    toward harmless study of nature. It contrasts observation of sky, sun, moon, plants,
    and fruits with a craving for recent evils, scandals, and hidden misfortunes.
    It uses analogies of a serpent in deadly matter, cupping-glasses, gloomy city
    gates, healers intruding into private ailments, custom-house searches, and rural
    gossip to condemn curiosity as malign and intrusive.
  language: English
  quote_policy: summarized
