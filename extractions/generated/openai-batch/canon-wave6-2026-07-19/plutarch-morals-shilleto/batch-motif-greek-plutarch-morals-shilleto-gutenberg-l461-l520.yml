  summary: The passage advises parents to give sons a sound education, avoid vulgar
    crowd-pleasing speech, prefer disciplined practice and preparation over random
    or premature extempore speaking, and cultivate moderation, vigor, and variety
    in speech and character. It supports these points with references to Euripides,
    Pericles, Demosthenes, and Apelles.
