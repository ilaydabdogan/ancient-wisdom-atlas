canonical_text:
  quote: ''
  summary: In a dialogue on love, Daphnaeus cites Greek poets and mythic examples
    to argue for the natural and conjugal love of women over male-male erotic relations,
    linking marriage to Aphrodite, divine friendship, and the renewal of mortal life
    through births. Pisias angrily replies, criticizes the restriction of Love to
    women and marriage, and uses images of brass and flame to describe Daphnaeus's
    condition in relation to Lysandra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Daphnaeus stops Protogenes and cites Solon and Aeschylus as authorities for
    defining an amorous man in relation to boys and bodily embraces.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Daphnaeus says that the ancients called the yielding of the female to the
    male the “favour,” and he supports this with references to Pindar, Sappho, and
    a question addressed to Hercules.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Within Daphnaeus's citation of Pindar, Hephaestus is described as the son
    of Hera “without any favours.”
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Daphnaeus says Solon later delighted in Aphrodite, Dionysus, and the Muses,
    and he describes this as reaching a quiet haven of marriage and philosophy after
    youthful loves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Daphnaeus states that love for boys and love for women are one passion, but
    describes boy-love as a later, illegitimate rival to the older love of women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Daphnaeus locates the rise of boy-love in gymnasiums and wrestling-schools
