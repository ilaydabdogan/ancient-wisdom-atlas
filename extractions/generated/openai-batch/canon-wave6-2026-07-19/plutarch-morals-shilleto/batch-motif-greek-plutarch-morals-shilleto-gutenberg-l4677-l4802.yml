canonical_text:
  quote: ''
  summary: The passage argues that moral training should moderate passions rather
    than abolish them. Fear, desire, hatred, shame, pleasure, pain, ambition, and
    courage are treated as forces that reason and law can guide. The author illustrates
    this with civic battle-arousal, Muse-inspired poetry, Homeric divine inspiration
    of warriors, corrective praise and rebuke, and a tutor's aim to make a boy delight
    in good and dislike bad.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says fear should not be wholly removed, but only excessive fear,
    so that bravery and confidence do not become recklessness or foolhardiness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says excessive desire in pleasure and excessive hatred in vengeance
    should be removed, producing temperance and justice rather than apathy, savagery,
    or cruelty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage compares reason without passions to a pilot without a storm and
    says reason would become duller and blunter if passions were entirely removed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Legislators are described as exciting ambition and emulation in states and
