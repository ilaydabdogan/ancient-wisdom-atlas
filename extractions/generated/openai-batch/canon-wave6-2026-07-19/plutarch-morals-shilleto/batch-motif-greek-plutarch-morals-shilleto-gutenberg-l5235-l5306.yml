canonical_text:
  quote: everybody might gauge his progress in virtue by his dreams
  summary: The passage argues that dreams can reveal progress in virtue when desires
    and passions remain governed by reason. It cites Zeno and Plato, uses analogies
    of trained animals, calm seas, bodily discipline, disease, and musical measure,
    and tells a dream anecdote in which Stilpo answers an angry Poseidon without fear
    and receives a promised gift for the Megarians.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Zeno is reported to have thought that a person may gauge progress in virtue
    by dreams in which the person takes pleasure in nothing disgraceful and neither
    does nor wishes anything dreadful or unjust.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes fancy and passions under reason as visible like the
    clear depths of a calm and tranquil sea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Plato is reported as having earlier described the role of fancy and unreason
    in the sleep of a tyrannical soul, including incestuous, unlawful, and abandoned
    desires normally restrained during the day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Well-trained beasts of burden are said to continue along the proper road even
    if the driver lets go of the reins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People whose unreason has become obedient, mild, and tempered by reason are
    said not easily to desire insolent or lawless actions in dreams or illnesses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The body is said to be trainable so that the eyes refrain from tears, the
    heart from fearful palpitations, and passions remain calm in the presence of beautiful
    youths and maidens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Stilpo is said to have dreamed that Poseidon was angry with him because he
    had not sacrificed the customary ox.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the dream, Stilpo answers Poseidon without fear, saying he sacrificed modestly
    from what he had rather than filling the town with costly sacrifice bought with
    borrowed money.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the dream, Poseidon smiles, holds out his right hand, and says he will
    give the Megarians a large shoal of anchovies for Stilpo's sake.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pleasant, clear, painless dreams without frightful or malignant apparitions
    are said to reflect progress in virtue.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Agitation, panics, ignoble flights, boyish delights, and lamentations in sad
    or strange dreams are compared to waves breaking on the coast and indicate a soul
    not yet composed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that progress in virtue consists in a remissness and mildness
    of the passions, while total freedom from passions is described as great and divine.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage instructs the reader to observe whether desire, fear, and rage
    are less strong than formerly and whether one is moved more by modesty than fear,
    emulation than envy, and love of glory than love of riches.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A shift of vice toward milder passions is compared to diseases turning aside
