canonical_text:
  quote: ''
  summary: Plutarch argues that moral progress in virtue must involve some reduction
    of folly and vice, using analogies from learning, medicine, weights, and purification.
    He rejects the idea that a person could instantly pass from complete vice to perfect
    wisdom without noticing it, compares such a change to Caeneus's transformation
    from woman to man, and criticizes Stoic claims that all non-perfect people are
    equally vicious.
  language: English
  quote_policy: summarized
