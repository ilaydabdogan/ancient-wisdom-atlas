canonical_text:
  quote: ''
  summary: 'The passage gives advice on how a friend should rebuke another: reminders
    of former noble deeds or parentage may encourage reform, while hostile comparisons
    provoke resentment. The rebuked person should listen patiently. Reproof should
    be reserved for serious faults, mixed with praise, and delivered mildly. Plutarch
    illustrates this with medical analogies, an iron-tempering image using fire and
    water, and brief examples from Greek epic and drama involving Oedipus, Hercules,
    Agamemnon, Odysseus, Hector, Paris, and Nestor.'
  language: English
  quote_policy: summarized
