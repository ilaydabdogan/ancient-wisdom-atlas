canonical_text:
  quote: '"difference and struggle between two opposing elements"'
  summary: The passage contrasts continence with temperance, describing the temperate
    soul as calm and harmonized under reason. It argues against the view that reason
    and passion are merely shifts of one faculty, instead presenting them as opposed
    elements whose conflict affects moral judgment and deliberation. It also distinguishes
    passionate practical conflict from theoretical reasoning, where opinion can change
    without pain when passion is absent.
