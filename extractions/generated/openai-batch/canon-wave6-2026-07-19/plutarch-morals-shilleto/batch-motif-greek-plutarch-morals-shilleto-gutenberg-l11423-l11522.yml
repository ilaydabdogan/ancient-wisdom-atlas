  summary: The passage praises good temper as a means of overcoming anger. It gives
    examples involving Euclides, Polemo, Aristippus, and Aeschines; compares anger
    to a wild beast, a seed compounded from passions, and a disease of the soul; describes
    the household signs of angry masters; and advises restraint through awareness
    of human imperfection, self-examination, and reduced scrutiny of others.
  language: English
