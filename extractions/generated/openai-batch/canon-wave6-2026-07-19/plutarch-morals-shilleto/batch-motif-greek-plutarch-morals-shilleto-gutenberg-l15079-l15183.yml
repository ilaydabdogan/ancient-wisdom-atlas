  quote: ''
  summary: The passage contrasts night, sleep, obscurity, and death with sunrise,
    light, knowledge, and social visibility. It identifies the Sun with Apollo and
    Hades with the unseen realm of darkness. It then cites Pindar's bright abode of
    the blessed and contrasts it with the dark third road for unholy souls, where
    punishment is described as oblivion, obscurity, and annihilation rather than bodily
    torment.
