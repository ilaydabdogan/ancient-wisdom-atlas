    rather than eradicate them, using analogies of bodily temperament, pruning, mixing
    wine with water, trained working animals, music, medicine, and poetic examples
    from Pindar and Homer.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage asks how the same person can be both better and worse than himself,
    and answers that everyone is in some way twofold, with a better and worse self.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person who subjects the baser element to the better is described as self-controlled,
    while the person whose nobler element follows the unreasoning element is described
    as incontinent and unnatural.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Reason is described as divine and as naturally ruling and governing the unreasoning
    element, which is said to originate from the body and participate in bodily passions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage uses youth, old age, animal courage or fear, and bodily signs
    such as pallor, blushes, tremblings, and palpitations as evidence for the bodily
    connection of emotion.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: When the mind is by itself and unmoved by passion, the body is described as
    being in repose and at rest; the passage concludes that the soul has two distinct
    parts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Man is said to participate in nature, habit, reason, intelligence, and the
    unreasoning element, with passion innate in him as a necessity requiring care
    and attention.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The function of reason is contrasted with uprooting or destroying all passion,
    and is instead compared to a genial and mild god that prunes, corrects, trains,
    and cultivates the useful part.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage compares tempering passion to mixing wine with water and to restraining
    the restiveness of oxen and horses without stopping their useful movement or work.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Pindar quotation names the horse for the chariot, the ox for the plough,
    and the hound for hunting the boar; the passage then says passions are useful
    when they wait on reason and run parallel to virtue.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Moderate anger, hatred of evil, and righteous indignation are presented as
    useful, while natural affection, pity, and sympathy are said not to be removable
    from friendship, philanthropy, and goodwill.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage argues that one should not banish love or desire because of their
    abuses, comparing this to refusing to run, throw, or sing because of possible
    errors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Music and medicine are used as analogies for proportionate blending, and the
    passage says victory in the soul comes when the passions are reduced by reason
    to moderation and due proportion.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Excessive grief, fear, or joy is compared to a body swollen or inflamed, and
