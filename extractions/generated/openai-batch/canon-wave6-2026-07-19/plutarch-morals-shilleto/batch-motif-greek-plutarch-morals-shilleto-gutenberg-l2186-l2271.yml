canonical_text:
  quote: "“The Egyptians, (like the Greeks) recognize two Loves, the Pandemian and
    the Celestial...”"
  summary: In a dialogue, Soclarus asks the speaker’s father to explain how an Egyptian
    account of Love corresponds with Plato. The father compares Egyptian and Greek
    recognition of two Loves, then develops analogies among Love, the Sun, Aphrodite,
    and the Moon. Love is described as a guide, physician, and initiator that uses
    bodily beauty to lead the soul toward truth and divine beauty, while undisciplined
    or forcibly suppressed passion leads to confusion or lawless pleasure.
  language: English
  quote_policy: quoted
