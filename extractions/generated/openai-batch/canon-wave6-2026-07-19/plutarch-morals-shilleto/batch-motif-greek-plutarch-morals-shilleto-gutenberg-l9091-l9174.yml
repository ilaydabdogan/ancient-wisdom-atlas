  summary: 'The passage gives a series of moral anecdotes about talkativeness: barbers
    and other speakers betray secrets or spread painful news, are punished or endangered,
    and criminals reveal themselves through unguarded remarks. It closes by urging
    the tongue to be restrained by reason, comparing prudent silence to geese that
    carry stones in their mouths while flying over eagle-filled mountains.'
