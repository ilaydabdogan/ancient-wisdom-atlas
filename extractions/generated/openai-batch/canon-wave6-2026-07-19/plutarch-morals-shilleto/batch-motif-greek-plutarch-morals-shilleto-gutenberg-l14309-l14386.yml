canonical_text:
  quote: ''
  summary: Thespesius' kinsman explains a post-mortem order of punishment governed
    by Adrastea and administered by Vengeance, Justice, and Erinnys. Souls display
    visible moral marks and colors, undergo correction or destruction, and some are
    carried into animal bodies. The kinsman then carries Thespesius to a bottomless
    abyss and a beautiful, fragrant place called Oblivion, associated with Dionysus'
    ascent and Semele's being taken up; he prevents Thespesius from remaining there
    and explains that pleasure weighs the soul down toward bodily generation.
  language: English
  quote_policy: summarized
