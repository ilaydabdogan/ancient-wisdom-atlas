  quote: ''
  summary: The passage argues that bashfulness or shyness is an injurious vice, not
    a virtue. It contrasts righteous judgment aided by Isis's asp with bashfulness
    that weakens judgment and refusal. It gives examples from Medea, Dion, Antipater,
    and the son of Alexander by Barsine to show harm from shame or misplaced trust
    toward enemies, then recommends training oneself through small refusals such as
    declining drink, dice, or time-wasting conversation.
  language: English
  quote_policy: summarized
