canonical_text:
  quote: ''
  summary: The passage contrasts the flatterer with the true friend. The flatterer
    imitates and exaggerates the patron for pleasure, while the true friend aims at
    what is useful and right, sometimes giving pleasure and sometimes corrective pain.
    Plutarch illustrates the difference through analogies of perfume and medicine,
    seasoning, physicians, musical tuning, and examples of praise or rebuke from heroic
    and philosophical traditions.
  language: English
  quote_policy: summarized
