  quote: ''
  summary: 'The passage contrasts moral states using nautical and storm imagery: judgement
    resists disgrace like cables but may yield to passion; the intemperate person
    is carried toward pleasure by desires, while the incontinent person is dragged
    into disgrace while trying to resist. Timon is cited mocking Anaxarchus as reckless
    and repeatedly drawn into excess. The passage concludes by distinguishing the
    temperate wise person from the intemperate fool and defining incontinence as reason
    unable to remain with what it knows is right.'
