canonical_text:
  quote: "“Two souls beating as one.”"
  summary: The passage contrasts coerced or corrupt sexual relations, which may produce
    hatred and vengeance, with conjugal love, which is presented as the beginning
    and renewal of friendship. It argues for women's capacity for virtue and friendship,
    advises devotion within marriage, and describes early marital friction as giving
    way to a complete tranquil union under Love.
  language: English
  quote_policy: quoted
