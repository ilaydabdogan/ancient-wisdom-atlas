  quote: departed into a better and more divine place and sphere
  summary: The passage argues from ancestral custom and law that infants who die receive
    neither libations nor the usual adult funerary rites. Parents are not to linger
    at infant tombs or mourn, because such infants are said to have no share in earthly
    things and to have departed to a better divine sphere. The speaker advises outward
    obedience to the laws and inward purity.
