canonical_text:
  quote: ''
  summary: 'The speaker addresses Cornelius Pulcher and argues that public life cannot
    avoid enemies, but a sensible person can profit from them. The passage supports
    this claim through analogies: wild beasts, sea-water, fire, illness, exile, shipwreck,
    and even dangerous foods can become useful when properly handled. It then describes
    enemies as vigilant examiners who expose faults, making their scrutiny a cause
    of careful and more virtuous living.'
  language: English
  quote_policy: summarized
