canonical_text:
  quote: ''
  summary: The passage argues that wrongdoing carries its own punishment through remorse,
    fear, shame, troubled memory, and self-loathing. It contrasts this with a hypothesis
    about punishment after death, gives examples including Lysimachus, Ino, Apollodorus,
    and Glaucus, and concludes that vice itself sufficiently mars and troubles the
    life of wrongdoers.
  language: English
  quote_policy: summarized
