- id: ev:6
  type: summary
  locator: Sec. III, within lines 2896-2994
  quote_or_summary: Newly married people should avoid the first quarrel; newly fabricated
    vessels are easy to break apart, but with time become compact, welded, and resistant
    to fire or steel.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
- id: ev:7
  type: summary
  locator: Sec. IV, within lines 2896-2994
  quote_or_summary: Fire kindled in chaff, a wick, or hare fur is easily extinguished
    if unfed; newly married love based on youth and beauty must be fixed in character
    and mind to last.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
- id: ev:8
  type: summary
  locator: Sec. V, within lines 2896-2994
  quote_or_summary: Wives using philtres and charms to master husbands by pleasure
    are compared to drugged fish bait; Circe's bewitched men became swine and asses,
    while she loved prudent Odysseus.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
- id: ev:9
  type: summary
  locator: Sec. VI, within lines 2896-2994
  quote_or_summary: Women who prefer ruling fools to obeying sensible men are compared
    to people who would rather lead the blind than sighted travelers.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
- id: ev:10
  type: summary
  locator: Sec. VII, within lines 2896-2994
  quote_or_summary: Pasiphaee, a king's wife, is mentioned as enamoured of a bull;
    the passage compares this with women preferring men enslaved to intemperance and
    pleasure, like dogs and he-goats.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
- id: ev:11
  type: summary
  locator: Sec. VIII, within lines 2896-2994
  quote_or_summary: Men too weak to mount horses teach them to kneel; similarly, some
    husbands lower noble or rich wives rather than improve themselves, though one
    should govern with regard to a woman's merit.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
- id: ev:12
  type: summary
  locator: Sec. IX-X, within lines 2896-2994
  quote_or_summary: The moon is bright far from the sun but pales near it; the modest
    wife is advised to be seen chiefly with her husband and to keep modesty in intimacy.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
- id: ev:13
  type: summary
  locator: Sec. XI, within lines 2896-2994
  quote_or_summary: As with two voices in unison where the loudest prevails, a well-managed
    household acts by mutual consent while the husband's supremacy is shown.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source metadata; summarized.
