candidate_motifs:
- id: motif:1
  label: marital wisdom delivered as compact precepts
  taxonomy_refs:
  - wisdom
  basis: The passage explicitly presents a remembered philosophical summary for newly
    married people and organizes counsel as short observations.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The taxonomy reference is broad; the passage is ethical-philosophical
    rather than a narrative myth.
- id: motif:2
  label: ritualized marriage under divine auspices
  taxonomy_refs:
  - sacred_marriage
  basis: The married pair are joined by the Priestess of Demeter, while Aphrodite,
    the Muses, Hermes, Peitho, and the Graces are connected with marital harmony,
    conversation, and persuasion.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: This is a human conjugal rite and moral essay, not a narrated divine hierogamy;
    the taxonomy link is approximate.
- id: motif:3
  label: persuasion conquers force in domestic life
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly values persuasion over contention, culminating in
    the Sun and North Wind fable as an analogy for reason rather than force.
  evidence_refs:
  - ev:3
  - ev:14
  confidence: high
  cautions: The motif is ethical and didactic; it is not presented as a full mythic
    episode except through the fable allusion.
- id: motif:4
  label: love-magic as failed domination and animal transformation
  taxonomy_refs:
  - shapeshifter
  basis: The warning against wives using philtres and charms invokes Circe, whose
    bewitched men are described as transformed into swine and asses.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The available taxonomy term 'shapeshifter' is only approximate because
    the passage describes involuntary transformation of victims, not voluntary shapeshifting.
- id: motif:5
  label: animal-directed desire as negative exemplum
  taxonomy_refs: []
  basis: Pasiphaee's desire for a bull is cited to illustrate a warning against preference
    for intemperate, animal-like men.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage only briefly alludes to Pasiphaee and does not narrate the
    wider myth.
- id: motif:6
  label: fragile beginning made durable through time and inner substance
  taxonomy_refs: []
  basis: Newly made vessels and quick-burning fire are used to describe how early
    marriage or youthful love must become firm and rooted in character to endure.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a didactic analogy rather than a named traditional motif.
comparison_claims:
- id: claim:1
  claim: The marital warning against philtres and charms is explicitly compared with
    the Circe-Odysseus mythic pattern, where enchantment produces animal-transformed
    victims but prudent Odysseus remains the desirable companion.
  claim_level: same_function
  target: Circe and Odysseus episode in Greek epic/mythic tradition
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a compressed moral allusion and does not narrate
    the full Circe episode.
- id: claim:2
  claim: The advice that reason and gentleness work better than force is explicitly
    supported by the Sun and North Wind fable.
  claim_level: same_function
  target: Sun and North Wind fable
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The fable is used as an analogy for marital persuasion; the passage
    does not discuss its broader fable tradition.
- id: claim:3
  claim: The warning against preferring intemperate partners invokes Pasiphaee's desire
    for the bull as a negative mythic analogue.
  claim_level: same_function
  target: Pasiphaee and the bull myth
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is brief and polemical; the passage explicitly says
    women disbelieve the myth while using it as an analogy.
