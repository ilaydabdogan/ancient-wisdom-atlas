canonical_text:
  quote: ''
  summary: Plutarch addresses Pollianus and Eurydice after their marriage rites and
    offers short philosophical precepts for married life. The passage frames marriage
    through ritual, divine figures, conversation, persuasion, domestic order, and
    a sequence of analogies from plants, vessels, fire, animals, myth, astronomy,
    music, and fable.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the Priestess of Demeter has united Pollianus and Eurydice
    through customary marriage rites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker sends both addressees a summary of philosophical observations
    as a gift and prays that the Muses will assist Aphrodite in making their married
    life harmonious.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ancient statues of Hermes, Peitho, and the Graces are described as placed
    near Aphrodite to teach conversation and persuasion in marriage rather than wrangling
    or contention.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Solon is said to have ordered a bride to eat a quince on the first night of
    marriage, with an explanation relating the bride's mouth to the bridegroom's first
    pleasure and conversation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Boeotia, the bride is dressed with an asparagus chaplet; the asparagus
    is described as producing excellent fruit from a thorny stalk.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Married people are warned to avoid an early quarrel; newly made vessels are
    described as easy to break apart, while later compact vessels resist fire and
    steel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Fire that starts easily in chaff, wick, or hare fur is said to go out easily
    unless it has material to feed it; newly married love based on youth and beauty
    is similarly said to need character and mind to last.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wives who use philtres and charms to master husbands by pleasure are compared
    with catching fish by drugged bait; Circe's bewitched men are said to have been
    turned into swine and asses, while she loved prudent Odysseus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Women who prefer ruling fools to obeying sensible men are compared to people
    who prefer leading the blind rather than sighted travelers.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Pasiphaee, a king's wife, is mentioned as enamoured of a bull; the passage
    compares this with women preferring intemperate men likened to dogs and he-goats.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Men unable to mount horses are said to teach horses to kneel; this is compared
    with husbands who lower noble or rich wives in order to rule them more easily.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The moon is described as bright when far from the sun and pale when near;
    this is contrasted with the modest wife, who is advised to be seen chiefly with
    her husband and remain at home in his absence.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: 'A well-managed household is compared to two voices in unison: matters are
    done by mutual consent, while the husband''s supremacy is displayed.'
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Sun defeats the North Wind by warming and scorching a man until he removes
    his coat and cloak; this is used to advise persuasion by reason rather than force.
  category: sequence
  evidence_refs:
  - ev:14
