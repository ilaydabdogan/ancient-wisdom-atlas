canonical_text:
  quote: ''
  summary: Thespesius travels with the guide of his soul to a great crater fed by
    colored rivers, where three genii mix the streams. His guide explains that Orpheus
    once reached this place while seeking his wife’s soul and misreported what he
    saw. The guide describes an oracle of Night and the Moon that works through dreams
    and visions, contrasts it with Apollo’s inaccessible oracle, and tries to show
    Thespesius a bright tripod-light. Thespesius hears the Sibyl’s prophetic voice
    from the moon’s orbit before being swept away by the moon’s violent motion, hearing
    only fragments of prophecy about Vesuvius, Dicaearchia, and the reigning emperor.
  language: English
  quote_policy: summarized
