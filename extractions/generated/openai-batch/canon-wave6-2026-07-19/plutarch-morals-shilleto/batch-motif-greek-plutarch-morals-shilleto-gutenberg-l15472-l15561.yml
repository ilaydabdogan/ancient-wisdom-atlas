candidate_motifs:
- id: motif:1
  label: loss transformed into philosophical simplification
  taxonomy_refs:
  - wisdom
  basis: Zeno treats the loss of his ship and freight not as mere misfortune but as
    Fortune’s reduction of him to a simple philosophical life.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a philosophical exemplum rather than a mythic narrative episode.
- id: motif:2
  label: exile as quiet sufficiency and holy retirement
  taxonomy_refs:
  - wisdom
  basis: Island exile is described as secure, private, sufficient, undisturbed, and
    a kind of holy retirement for a life of leisure.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames exile morally and philosophically; it does not describe
    a ritual retreat.
- id: motif:3
  label: bounded life aligned with cosmic order
  taxonomy_refs:
  - divine_judgment
  basis: The passage compares island-like boundedness to planets keeping order and
    cites the Furies as ministers of Justice who would detect the sun leaving its
    bounds.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The cosmic material functions as an analogy inside an ethical argument;
    the passage does not narrate divine punishment actually occurring.
- id: motif:4
  label: exile as liberty through departure and mobility
  taxonomy_refs:
  - departure
  - wisdom
  basis: A prohibition from one place is recast as freedom to go elsewhere, to attend
    festivals and games, or to live without civic obligations; wise men are said to
    have voluntarily departed from their countries.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is expressed as consolation and ethical reasoning, not as a
    hero’s adventure plot.
