canonical_text:
  quote: ''
  summary: Plutarch argues that exile, especially island exile, can be understood
    as quiet, freedom, leisure, and philosophical sufficiency rather than misfortune.
    He supports this with examples from Zeno, Diogenes, Greek festivals, cosmic order,
    Persian royal mobility, and poets or historians who lived or were claimed outside
    a single homeland.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zeno learns that his only remaining ship and freight have been lost at sea
    and responds by addressing Fortune as dealing kindly with him by confining him
    to a threadbare cloak and philosophical life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says island confinement may relieve a person from weariness, anxiety,
    foreign wandering, sea dangers, and the forum’s uproar.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The island is described as providing a secure, quiet, private life within
    a circle containing necessities, including a house, promenade, bath, fish, and
    hares.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: On an island, busybodies, borrowers, and legal or civic demands do not come;
    only close friends and intimates visit from goodwill and affection.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The life of island leisure is called a sort of holy retirement for someone
    who wishes or has learned to live at leisure.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: People who regard constant travel as happiness are compared to people who
    think planets are happier than fixed stars; planets are said to keep their order
    in one sphere as if in an island.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Heraclitus is cited for the idea that the sun will not deviate from its bounds
    because the Furies, ministers of Justice, would detect it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those banished to an island are described as separated by sea waves, while
    a person forbidden to live in only one place is said to have liberty to go to
    all others.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The exiled person is described as free from office, senate membership, games
    umpiring, factional obligations, large expenditures, attendance on a prefect,
    and concern over a provincial governor’s character.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that focusing only on exile’s inglorious aspect overlooks
    its freedom from cares, leisure, and liberty, using Archilochus’ negative description
    of Thasos as a comparison.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The exile may attend several Greek mysteries, festivals, and games, or may
    instead walk, read, and sleep undisturbed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Diogenes is quoted as saying he can dine whenever he chooses, unlike Aristotle,
    who must dine when Philip thinks fit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that many of the wisest and most intelligent men voluntarily
    left their countries, using nautical language of weighing anchor and transferring
    course.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Euripides is said to have praised his country in verse and nevertheless spent
    the latter part of his life in Macedonia at Archelaus’ court.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Aeschylus, Simonides, and Herodotus are given as examples of Greek literary
    figures associated with places beyond their original cities.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: Homer is described as claimed by many cities because he did not praise only
    one city, and Hospitable Zeus is said to have many honours.
  category: relationship
  evidence_refs:
  - ev:11
