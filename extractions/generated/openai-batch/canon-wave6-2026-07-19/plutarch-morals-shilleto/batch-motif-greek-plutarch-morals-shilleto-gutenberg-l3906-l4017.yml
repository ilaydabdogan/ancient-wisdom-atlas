  quote: '"a happy and cheerful life is not from without"'
  summary: Plutarch argues that happiness depends on the condition of the mind rather
    than external possessions. He contrasts virtue, reason, and philosophy as sources
    of calm pleasure with vice, which remains within a person, disturbs waking and
    sleeping life, inflames passions, and makes wealth or splendor painful. He uses
    images of clothing retaining warmth, fire brightening a house, perfumes, illness,
    storms, food, and a curb on desires to explain the effects of virtue and vice.
  language: English
  quote_policy: quoted
