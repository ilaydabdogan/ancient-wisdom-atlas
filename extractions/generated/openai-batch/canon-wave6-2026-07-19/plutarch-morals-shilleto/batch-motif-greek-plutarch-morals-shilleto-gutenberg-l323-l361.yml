canonical_text:
  quote: ''
  summary: The passage advises that mothers should nurse their own children when able,
    because nursing fosters affection and follows nature's provision of milk. If other
    nurses are needed, they should be chosen carefully for Greek habits and moral
    influence. The passage then argues that infancy is easily molded, compares early
    instruction to impressions on soft wax, cites Plato and Phocylides on regulating
    early stories and teaching good habits, and warns that attendants and companions
    shape young people's morals and speech.
