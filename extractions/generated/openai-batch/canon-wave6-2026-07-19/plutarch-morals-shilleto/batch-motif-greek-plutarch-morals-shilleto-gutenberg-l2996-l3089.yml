canonical_text:
  quote: ''
  summary: 'Sections XIII-XXII give precepts on marriage: marital affection and correction
    should be private; a wife is compared to a mirror that should reflect her husband''s
    condition; husbands are advised to share cheerfulness with wives; Persian royal
    banquet practice is used as an analogy for separating wives from drunken licentiousness;
    the husband is said to shape the wife''s conduct; the wife is advised to follow
    her husband''s friends and gods; marriage is described through common interest,
    mutual sympathy, interlaced rope, joint children, shared property, and mixed water
    and wine; Greek epic couples and a Roman shoe anecdote illustrate happy and troubled
    marriages.'
  language: English
  quote_policy: summarized
