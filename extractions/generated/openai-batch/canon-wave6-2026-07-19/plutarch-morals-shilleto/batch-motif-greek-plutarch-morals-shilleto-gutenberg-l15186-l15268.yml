canonical_text:
  quote: ''
  summary: The passage opens Plutarch's essay on exile by arguing that friends should
    console and instruct rather than merely share grief. It urges the sufferer to
    examine misfortunes rationally, since opinion can make exile, honours, and losses
    feel light or heavy. It contrasts Polynices' negative judgment of exile with Alcman's
    positive valuation of his Spartan life and poetry, then uses analogies of bitter
    food, harsh colors, bad weather, cupping-glasses, Homeric jars of fortune, and
    sieves to argue that people should mitigate sorrow by attending to remaining goods.
  language: English
  quote_policy: summarized
