canonical_text:
  quote: ''
  summary: The passage argues that anger, if repeatedly indulged, becomes an irascible
    disposition, but can be checked early by judgment, reason, silence, and calm conduct.
    It develops the image of anger as fire that is easy to extinguish at first but
    destructive when fed, contrasts anger with grief and love, and gives Greek literary
    and historical exempla including Achilles, Socrates, Thamyris, Pandarus, Xerxes,
    and others.
  language: English
  quote_policy: summarized
