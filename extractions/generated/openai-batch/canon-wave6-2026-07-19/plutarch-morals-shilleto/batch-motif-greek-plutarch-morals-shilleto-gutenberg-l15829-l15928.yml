    and Alexander son of Priam are presented as examples in questions about whether
    virtuous or vicious actions should be attributed to fortune.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says sobriety, justice, fortitude, prudence, and wisdom are connected
    names or applications of rational virtue in different circumstances.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that if wise acts are ascribed to fortune, then stealing,
    picking pockets, and lewdness would also be ascribed to fortune, and argument
    would be abandoned.
  category: speech
  evidence_refs:
  - ev:4
