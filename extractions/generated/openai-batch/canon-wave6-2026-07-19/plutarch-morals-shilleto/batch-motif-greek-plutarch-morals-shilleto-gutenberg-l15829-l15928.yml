canonical_text:
  quote: ''
  summary: The passage argues against the claim that fortune rather than wisdom rules
    human affairs. It lists moral and immoral historical examples, criticizes dependence
    on fortune, presents wisdom/reason as the faculty that enables deliberation, and
    says reason, allegorized as Prometheus, compensates for human natural weakness
    by making humans able to use and master animals.
  language: English
  quote_policy: summarized
