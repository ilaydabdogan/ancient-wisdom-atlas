  summary: The passage argues that virtue, good sense, justice, and rectitude should
    be teachable. It contrasts moral education with learned crafts and daily disciplines,
    uses anecdotes about tutors, philosophers, Scythians, and military command, and
    concludes that good sense orders all other arts and gives them proper use.
