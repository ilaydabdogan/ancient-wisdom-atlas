canonical_text:
  quote: ''
  summary: The passage criticizes flattery of wealth and power, argues that false
    praise ruins people, and contrasts counterfeit outspokenness with the painful
    but helpful candor of a true friend. It illustrates these points with examples
    involving rich men, Alexander, Carneades’ comment about horses, Bion’s field analogy,
    Patroclus and Achilles, Menander’s sham Hercules, household and educational comparisons,
    Ptolemy, and medical imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that some object to the Stoic assertion that the wise
    man is rich, handsome, noble, and a king, while flatterers ascribe many abilities
    and victories to the rich man.
  category: speech
  evidence_refs:
  - ev:1
