  text: Carneades is reported as saying that sons of rich men and kings learn riding
    well because horses do not flatter and will throw an unskilled rider.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bion’s comparison between praising a field and praising human beings is rejected;
    the passage states that false praise puffs up and ruins people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The flatterer is described as copying the marks and tokens of a friend while
