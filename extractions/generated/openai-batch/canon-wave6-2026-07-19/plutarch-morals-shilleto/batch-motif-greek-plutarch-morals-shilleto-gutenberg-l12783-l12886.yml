  summary: The passage distinguishes blameworthy self-praise, rooted in vanity and
    envy, from permitted or admirable self-commendation when answering slander, standing
    trial, suffering adversity, defending a friend, or responding to wrong. It illustrates
    the rule with examples from Pericles, Epaminondas, Sthenelus, Scipio, Patroclus,
    Phocion, and Achilles.
