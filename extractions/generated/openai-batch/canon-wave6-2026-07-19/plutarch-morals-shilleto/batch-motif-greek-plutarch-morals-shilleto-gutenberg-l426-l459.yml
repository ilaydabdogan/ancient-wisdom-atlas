canonical_text:
  quote: ''
  summary: 'The passage argues that education and sound upbringing are the chief human
    good, superior to inherited status, wealth, fame, beauty, health, and strength.
    It describes education, mind, reason, virtue, and wisdom as resistant to fortune,
    age, disease, informers, and war. Two examples are given: Stilpo says he has lost
    nothing after Megara is destroyed because war cannot harm virtue, and Socrates
    says the happiness of the King of Persia depends on virtue and education rather
    than external advantages.'
  language: English
  quote_policy: summarized
