canonical_text:
  quote: ''
  summary: The passage advises Eurydice that a wife may regard her husband as teacher
    and guide in philosophy. It argues that geometry and philosophical learning protect
    women from spells, incantations, alleged moon-drawing, and other false ideas.
    Aglaonice is cited as someone who used knowledge of lunar eclipses to deceive
    women into thinking she had drawn down the moon. The passage also rejects claims
    of children conceived without intercourse, urges Eurydice to learn sayings of
    wise women, and contrasts costly adornments with the virtues of famous women and
    the fruits bestowed by the Muses.
  language: English
  quote_policy: summarized
