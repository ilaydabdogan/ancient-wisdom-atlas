canonical_text:
  quote: ''
  summary: The passage argues that intimate friendship should not be formed with chance
    acquaintances or with all who attach themselves to a person, but only with tested
    and worthy friends. It contrasts the unity of a pair of friends with the dispersal
    caused by many friendships, gives examples of conflicting obligations produced
    by many friends, and cites Greek figures and sayings, including Zeuxis, Menelaus
    and Odysseus, Empedocles, Briareus, Euripides, Pythagoras, and Chilo.
  language: English
  quote_policy: summarized
