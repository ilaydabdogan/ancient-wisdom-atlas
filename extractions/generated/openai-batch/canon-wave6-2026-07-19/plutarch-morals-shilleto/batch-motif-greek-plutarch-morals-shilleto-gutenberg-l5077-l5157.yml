  quote: ''
  summary: 'The passage gives tests of progress in virtue: moderation in argument,
    willingness to listen, steadiness in public speaking, valuing utility and truth
    over display, doing good or resisting temptation without seeking praise, and becoming
    humbler as moral substance increases. It illustrates these points with examples
    and similes involving Aristippus, Demosthenes, Alcibiades, Homer, Agesilaus, Democritus,
    farmers, grain, vessels of water, and young would-be philosophers.'
  language: English
