    follows reason as if she were a god.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Menedemus says that people who went to school at Athens passed through stages
    of being wise, philosophers, orators, and then ordinary people, laying aside pride
    as learning increased.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'People needing a physician respond differently: some seek help quickly, some
