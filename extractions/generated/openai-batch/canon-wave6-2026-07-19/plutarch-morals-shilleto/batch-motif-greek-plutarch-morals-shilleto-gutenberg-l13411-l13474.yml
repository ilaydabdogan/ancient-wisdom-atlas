  summary: A dialogue passage argues that delayed divine punishment of wrongdoing
    fails to deter offenders, comfort victims, create remorse, or sustain belief in
    providence. It cites sayings and examples involving Thucydides, Bias, Aristocrates,
    Lyciscus, Euripides, horse correction, and the proverbial mills of the gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says it is not fitting for the deity to be slow, especially in
    punishing the wicked, because the wicked are quick in doing evil.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Punishment that follows wrongdoing closely is described as blocking further
    villainy and comforting the injured.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bias is reported as telling a bad man that he did not fear the man would escape
    punishment, but feared he would not live to see it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Aristocrates is described as guilty of treason at the battle of the Great
    Trench, reigning for more than twenty years before being detected and punished,
    while the Messenians killed earlier were no longer alive.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lyciscus is described as causing losses among the people of Orchomenus through
    treason and later suffering a disease that spread over his body; he dipped his
    feet in a river and prayed that they might rot off if he was guilty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The descendants of slain persons were not permitted to see the bodies of the
    criminals torn from their graves at Athens and carried beyond the borders.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Euripides is quoted as presenting vengeance as not striking at once, but moving
    silently and with slow foot until it reaches the wicked.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The wicked are said to encourage themselves toward lawless acts because crime
    presents an immediate visible fruit, while punishment is late and long after enjoyment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Olympicus says delayed punishment takes away belief in providence because
    the wicked regard later evil as accident rather than punishment and feel no remorse.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'A horse is used as an analogy: immediate whipping or spurring after a stumble
    is corrective, while delayed pulling, backing with the bit, and shouting cause
    pain without showing the fault.'
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Immediate correction of vice is said to make it humble and in awe of the deity,
    while delayed justice appears more like chance than providence because of uncertainty,
    delay, and irregularity.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The mills of the gods are said to grind late, and Olympicus says this obscures
    punishment and removes fear of evil-doing.
  category: speech
  evidence_refs:
  - ev:12
