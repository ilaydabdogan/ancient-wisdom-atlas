candidate_motifs:
- id: motif:1
  label: Seized beloved or prospective spouse
  taxonomy_refs:
  - stolen_beloved
  basis: Baccho is physically seized, taken into Ismenodora's house, locked inside,
    and later described by a speaker as subject to rape and detention.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage reverses a common gender expectation by presenting a woman
    and her associates seizing a male prospective spouse; the taxonomy label is used
    only for the abduction pattern.
- id: motif:2
  label: Capture followed by wedding rites
  taxonomy_refs: []
  basis: Immediately after Baccho is seized, he is dressed in a bridal robe, both
    houses are decorated with wreaths and garlands, and a wedding-song is performed
    publicly.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents social wedding markers, not an explicitly sacred
    or divine marriage ritual.
- id: motif:3
  label: Love as overpowering divine possession
  taxonomy_refs: []
  basis: Anthemion says love is harder to control than anger, claims it may spend
    life, money, and reputation, and suggests divine inspiration has possessed Ismenodora;
    Pemptides discusses Love as divine blessing and god.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage debates and questions the divinity of Love rather than presenting
    a settled mythic narrative.
- id: motif:4
  label: Serpent as contested good omen
  taxonomy_refs:
  - serpent
  basis: Pemptides recounts an Egyptian roadside episode in which a passing serpent
    is called a good omen by two disputing neighbors, each claiming the blessing.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is an anecdote embedded in a philosophical argument, not the main
    narrative action.
- id: motif:5
  label: Female seizure as inversion of civic and gender order
  taxonomy_refs: []
  basis: Pisias frames the event as lawlessness and as nature subjected to women,
    invokes Lemnos, and imagines handing the gymnasium and council-hall to women.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: This pattern is voiced by characters as rhetoric within debate; it should
    not be treated as the narrator's direct judgment.
