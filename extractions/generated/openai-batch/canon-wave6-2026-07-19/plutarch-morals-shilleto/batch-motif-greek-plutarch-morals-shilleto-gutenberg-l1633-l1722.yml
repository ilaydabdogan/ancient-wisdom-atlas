canonical_text:
  quote: ''
  summary: In a dialogue on love, messengers report that Ismenodora has arranged the
    seizure of Baccho, brought him into her house, clothed him in a bridal robe, and
    publicly marked the event with wedding decorations and song. The bystanders and
    speakers debate the act, invoking Lemnos, civic disorder, Baccho's possible consent,
    love's uncontrollable force, divine inspiration, serpent omens, and the question
    of why Love is called a god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A friend of Pisias gallops from the town to report Ismenodora's audacious
    act during the conversation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ismenodora thinks Baccho has no personal dislike of the proposed match but
    is deterred by friends.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ismenodora summons male friends and female companions, instructs them, and
    waits for Baccho's regular passage by her house on his way to the wrestling-school.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: As Baccho passes with companions, Ismenodora touches his cloak; her friends
    rush out, seize him, hurry him into the house, and lock the doors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women inside the house remove Baccho's cloak and put a bridal robe on him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Servants place olive wreaths and laurel garlands at the doors of both Baccho's
    and Ismenodora's houses, while a flute-girl plays and sings the wedding-song in
    the street.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some inhabitants and strangers laugh, while others are indignant and try to
    involve the superintendents of the gymnasium.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pisias protests that such license tends toward lawlessness, describes nature
    as subjected to women, invokes Lemnos, and proposes handing over male civic spaces
    to women if the townsmen have lost courage.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Protogenes leaves with Pisias, partly sharing his indignation and partly trying
    to cool him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Anthemion says the deed was bold and somewhat Lemnian, and Soclarus suggests
    that the rape and detention might be Baccho's stratagem to escape his lovers and
    reach Ismenodora.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Anthemion rejects suspicion of Baccho, says Baccho normally divulges secrets
    to him, and says he had wanted Baccho to marry Ismenodora.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Anthemion cites Heraclitus on the difficulty of controlling love, says love
    may pay with life, money, and reputation, defends Ismenodora's prior reputation,
    and says a divine inspiration seems to have possessed her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pemptides compares calling passionate love sacred and divine with the bodily
    condition called the sacred disease.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Pemptides recounts seeing two neighbors in Egypt dispute ownership of a good
    omen when a serpent passed by them on the road.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Pemptides says some drag Love to the men's apartments, others confine it to
    the women's side of the house, and all regard it as a divine and superlative blessing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Another messenger, sent by Ismenodora, summons Anthemion because the tumult
    has increased and the superintendents of the gymnasium disagree about demanding
    Baccho's liberation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The narrator's father says that asking for reasons for opinions about the
