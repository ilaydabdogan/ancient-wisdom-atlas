canonical_text:
  quote: ''
  summary: The passage advises ready compliance with seemly requests and firm refusal
    of injurious or unlawful ones. It presents a series of exempla in which Zeno,
    Theocritus, Lysimache, Antigonus, Cato, Agesilaus, Themistocles, and Nicostratus
    respond to pressure through rebuke, wit, appeal to law, or appeal to Hercules
    as a moral standard. The section closes by advising readers to tell reputable
    people who press them toward wrong that they are acting ignobly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes seemly and modest requests, which should be complied
    with, from injurious or unreasonable requests, which should be resisted.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zeno meets a young man walking quietly near a wall to avoid a friend who wants
    him to perjure himself on the friend's behalf.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zeno rebukes the young man for being afraid to stand boldly for what is right
    when the friend is not ashamed to press him toward wrong.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage rejects defending against vice by imitating vice and recommends
    refusing shameless importunity without false modesty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Theocritus refuses to lend a scraper in the public baths to two requesters,
    answering that he does not know one and knows the other too well.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lysimache, priestess of Athene Polias, refuses muleteers who bore sacred vessels
    when they ask her for a drink, saying she fears they would make a practice of
    it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Antigonus refuses promotion to a young man of distinguished ancestry, saying
    honours are given for personal prowess rather than ancestral prowess.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Catulus, a censor in high repute, urgently and violently petitions Cato the
