canonical_text:
  quote: ''
  summary: The passage argues that bashfulness should be restrained through practice
    in small matters, such as withholding false praise, refusing minor importunate
    requests, choosing competent helpers, and managing invitations. It uses examples
    involving Pericles, Archelaus, Antigonus, Diogenes, Demosthenes, and the Pythagoreans
    to show that habits formed in trivial situations prepare a person to act rightly
    in more serious matters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that practicing restraint of bashfulness in small and unimportant
    matters is useful in relation to praise.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a drinking party, a friend's harper may sing badly or an actor may perform
    Menander badly while most of the party applauds.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says it is not hard or bad manners to listen silently rather than
    praise contrary to one's convictions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage asks how someone who falsely praises a friend's poor poem or speech
    will later correct that friend in business, office, marriage, or civic affairs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Pericles is said to have told a friend seeking false witness, even to perjury,
    that he was his friend as far as the altar; the author says Pericles went too
    far.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person accustomed not to violate conviction in applause, praise, or laughter
    is said not to swear, bear false witness, or pronounce an unjust verdict for an
    impudent requester.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says people who want to borrow money should be refused through
    prior practice in saying no to small and easily refused matters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Archelaus, when asked at supper for a gold cup, ordered a boy to give it to
    Euripides and said the requester was fit to ask but not to receive, while Euripides
    was fit to receive without asking.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Antigonus is described as clever at getting rid of importunity, including
    responses to Bion and to a Cynic who asked first for a drachma and then for a
    talent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Diogenes is said to have begged from statues in the Ceramicus and explained
    that he was practicing how to bear refusals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage says one must exercise in little things so as to refuse importunate
    people and avoid great miscarriages.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Demosthenes is cited for the claim that spending resources on unnecessary
    things leaves no means for necessary things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Bashfulness is said to lead people to reject expediency and reason in choosing
    doctors, teachers, legal advocates, and philosophical views.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage recommends not choosing a barber, fuller, or inn merely from bashfulness
    when a better option is available.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Pythagoreans are described as careful not to put their left leg across
