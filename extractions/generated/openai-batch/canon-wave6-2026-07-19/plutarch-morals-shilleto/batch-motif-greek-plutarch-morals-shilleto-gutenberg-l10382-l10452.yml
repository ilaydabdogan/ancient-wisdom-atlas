  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: At a sacrifice, marriage, or entertainment, the passage recommends inviting
    the serviceable friend rather than the person who greets and runs up to meet the
    host.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The passage concludes that one trained in this way will be difficult to catch
    tripping and even unassailable in greater matters.
  category: sequence
  evidence_refs:
