canonical_text:
  quote: ''
  summary: The passage argues that judgment and reason can restrain bodily passion
    and emotion. It gives examples from forbidden erotic desire, unlawful food, music,
    trained animals, and Achilles encouraging horses, then defines moral character
    as habit formed in the unreasoning part of the soul by reason. Virtue is presented
    as passions well tutored by reason, and vice as passions badly tutored.
  language: English
  quote_policy: summarized
