canonical_text:
  quote: ''
  summary: 'The passage opens Plutarch''s essay on education by stating an aim to
    discuss how free children may be trained into good citizens. It then treats birth
    and procreation as preliminaries to education: prospective fathers are warned
    against unions that would make offspring socially discredited; good birth is said
    to produce assurance, while illegitimacy or ill fame of parents is said to burden
    descendants. The passage gives anecdotes about Diophantus, son of Themistocles,
    Lacedaemonians fining King Archidamus for marrying a small woman, and Diogenes
    attributing a youth''s derangement to drunken conception. It ends by turning from
    procreation to education.'
  language: English
  quote_policy: summarized
