canonical_text:
  quote: ''
  summary: 'The passage describes signs of progress in virtue: turning away from envy
    and display, choosing discourse that forms character, attending to useful things
    rather than attractive words, and learning moral lessons from reading, sights,
    actions, and everyday incidents. It gives examples involving a bee, frozen words,
    a boxing contest, a mouse, a lad drinking water from his hand, and a bird feeding
    its young.'
  language: English
  quote_policy: summarized
