canonical_text:
  quote: Fortune therefore does not produce perfect infelicity, unless Vice co-operate.
  summary: The passage personifies Fortune and Vice in a hypothetical contest over
    making human life miserable. Fortune is given external calamities, while Vice
    is presented as an internal cause that makes people vulnerable to suffering. Examples
    from philosophers, Roman self-sacrifice, Indian fire-death practices, and funerary
    customs are used to argue that external misfortunes do not by themselves make
    the virtuous unhappy. The passage then begins a new essay by citing Homer on man
    as the most wretched living creature.
  language: English
  quote_policy: quoted
