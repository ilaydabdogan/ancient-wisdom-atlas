- id: motif:2
  label: Delay before punitive action
  taxonomy_refs: []
  basis: The speaker urges an interval before punishment, reinforced by Phocion's
    advice that what is true today will remain true tomorrow.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: No specific taxonomy reference is available for this practical ethical
    pattern.
- id: motif:3
  label: Anger as mistaken perception of contempt
  taxonomy_refs:
  - wisdom
  basis: The passage identifies the idea of being despised or neglected as a common
    origin of anger and counsels reinterpretation of offenses as weakness, error,
    or mischance.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The pattern is psychological and didactic, not a standalone mythic episode.
- id: motif:4
  label: Appeasement through humility and satisfaction after offense
  taxonomy_refs: []
  basis: Agamemnon's humility and offer of satisfaction to Achilles are presented
