  cautions: The passage gives only a brief allusion to the epic episode.
- id: motif:5
  label: Misdirected punishment toward lower-status or nonhuman target
  taxonomy_refs: []
  basis: The final anecdote redirects beating from an ass-driver, who claims Athenian
