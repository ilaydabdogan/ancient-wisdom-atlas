canonical_text:
  quote: For as bodies seem greater in a mist, so do little matters in a rage.
  summary: The passage argues that punishment should be delayed until anger has subsided
    and reason can determine the proper manner and amount. It uses analogies and examples
    from Phocion, Aristotle, Sophocles, Agamemnon, Diogenes, and a comic anecdote
    about an ass-driver to teach that anger often arises from a mistaken sense of
    being despised.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage contrasts self-respect, which produces corrective fear, with continual
    pitiless beating, which produces concealment rather than repentance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he tries to reduce anger by allowing those being corrected
    to speak in their own defence and by listening to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The interval before punishment is said to pause and mitigate passion, allowing
    judgment to find the fitting manner and amount of punishment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Phocion is cited as advising the Athenians, after Alexander's reported death,
    that if Alexander was dead that day he would still be dead on following days.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker applies Phocion's delay logic to punishment, saying that if a
    person has wronged someone today, the wrong will still be there tomorrow and the
    next day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Small matters in rage are compared to bodies that appear larger in mist.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says punishment should proceed only if, after passion is gone,
    the matter still appears bad to calm and clear reason.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Those who avoid punishment while calm and punish only when anger rises are
    compared to lazy rowers who stay in harbor in calm weather and sail when the wind
    rises.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage rejects punishing with hunger, thirst, appetite, or anger as a
    stimulant, saying punishment should be compelled by reason.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Aristotle is cited for the claim that slaves in Etruria were scourged to the
    music of the flute, and this is used as an example of taking pleasure in punishment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker says he observed that in nearly all cases anger contained the
    idea of being despised and neglected.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage advises treating anger or injury as folly, necessity, emotion,
    mischance, weakness, error, rashness, heedlessness, illiberality, old age, or
    youth rather than as contempt.
  category: action
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:13
  text: Agamemnon is cited as ascribing the carrying off of Briseis to Ate and then
    wishing to please Achilles and give full satisfaction.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Diogenes is cited as replying to people who laughed at him that he was not
    one to be laughed at.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage lists wife, slaves, friends, innkeepers, sailors, muleteers, barking
    dogs, and asses as targets toward which people may direct rage when they imagine
    themselves slighted.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: A closing anecdote says a man who intended to beat an ass-driver spared him
    when he claimed to be an Athenian, but then beat the ass instead.
  category: action
  evidence_refs:
  - ev:10
