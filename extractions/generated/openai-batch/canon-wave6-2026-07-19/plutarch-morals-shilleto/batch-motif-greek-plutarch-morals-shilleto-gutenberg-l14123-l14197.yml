canonical_text:
  quote: '"produce malignant fruit in the heart"'
  summary: The passage argues against Bion's objection that punishing descendants
    for ancestral crimes is like misdirected medical treatment. It develops a medical
    analogy in which inherited bodily predispositions require preventive care, then
    applies this to inherited or latent vice. It claims that the deity can discern
    hidden dispositions before they become overt crimes and may punish incipient wrongdoing
    as a cure rather than as personal retaliation.
