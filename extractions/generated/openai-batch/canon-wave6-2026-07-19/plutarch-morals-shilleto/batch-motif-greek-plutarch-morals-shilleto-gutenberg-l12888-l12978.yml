canonical_text:
  quote: ''
  summary: The passage discusses when self-praise is acceptable in public speech,
    especially as defense against ingratitude or accusation. It gives examples from
    Themistocles, Demosthenes, Epaminondas, Alexander, and others, then recommends
    assigning glory partly to fortune or deity, citing Achilles, Timoleon, Pytho,
    Sulla, and Zaleucus, who attributes his laws to Athene's visits and instruction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Themistocles is described as having given no offence; when Athenians neglected
    him, he asked why they tired of receiving benefits and compared their behavior
    toward him to seeking shelter under a tree in a storm and stripping its leaves
    in fine weather.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says wronged people commonly mention the good they have done to
    the ungrateful, and that a person blamed for a good action may praise his own
    actions as a defense.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Demosthenes is presented as praising himself in the speech On the Crown in
    relation to embassies and decrees connected with war.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes antithesis as a technique in which a speaker shows that
    the opposite of the charge against him is base, and it gives examples involving
    Lycurgus, Cicero, and Demosthenes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Demosthenes is said to insert praise of his audience into remarks about himself
    by recounting Athenian benefits to Euboeans, Thebans, Byzantium, and the Chersonese
    while claiming only a subordinate role.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Epaminondas replies to a jeer by saying that it was through the help of the
    Thebans that he put down the power of the Lacedaemonians in one day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says some speakers praise others with similar pursuits, business,
    or character, and gives Alexander honoring Hercules and Androcottus honoring Alexander
    as examples; Dionysius is contrasted as disparaging Gelon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage advises those compelled to praise themselves to assign part of
    the honor to fortune or deity; Achilles is quoted as crediting the gods with the
    killing of a hero.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Timoleon is said to have erected a temple at Syracuse to the goddess of Fortune
    and dedicated his house to the Good Genius; Pytho says a god did the deed and
    he only put his hands to the work; Sulla is said to praise fortune and proclaim
    himself under Aphrodite's protection.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Zaleucus is said to have pleased the Locrians by saying that Athene visited
    him from time to time, suggested and taught him his laws, and that the laws were
    not his own idea or plan.
  category: speech
  evidence_refs:
  - ev:8
