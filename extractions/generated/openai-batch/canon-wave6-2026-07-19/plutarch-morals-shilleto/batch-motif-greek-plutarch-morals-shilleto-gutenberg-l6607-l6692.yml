canonical_text:
  quote: ''
  summary: The passage warns that flattery is especially dangerous when expressed
    as praise. It compares flatterers to pests lodging in the ear, advises testing
    praise by actions and inward judgment, describes how false praise renames vices
    as virtues and corrupts character, gives historical examples of rulers or peoples
    harmed by flattering praise, and explains indirect tactics by which a flatterer
    approaches cautious targets.
  language: English
  quote_policy: summarized
