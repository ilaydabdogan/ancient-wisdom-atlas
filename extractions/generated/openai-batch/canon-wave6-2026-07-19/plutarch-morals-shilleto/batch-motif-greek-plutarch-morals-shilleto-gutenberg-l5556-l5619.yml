  quote: ''
  summary: The passage opens the essay question of whether vice alone is enough to
    cause unhappiness. It contrasts restless pursuit of wealth, court favor, and public
    advancement with quiet leisure at home; invokes Tantalus, Agamemnon, and Ilium
    as brief exempla; and argues that vice afflicts the soul more powerfully than
    tyrants, torture, fire, or sword.
  language: English
  quote_policy: summarized
