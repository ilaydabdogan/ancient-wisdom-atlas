canonical_text:
  quote: ''
  summary: The passage argues that crafts and the good use of life’s external goods
    depend on art, reason, and wisdom rather than fortune. It names Ergane and Athene
    as patrons of trades, gives Nealces’ accidental painting of horse-foam as a rare
    exception, compares arts to scattered fragments of Prometheus’ fire, and cites
    Hesiod’s Prometheus advising Epimetheus to refuse Zeus’ gifts, interpreted as
    things of fortune.
  language: English
  quote_policy: summarized
