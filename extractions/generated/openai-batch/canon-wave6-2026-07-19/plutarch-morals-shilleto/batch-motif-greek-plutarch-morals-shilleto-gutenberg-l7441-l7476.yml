  quote: ''
  summary: 'The passage explains occasions for frank corrective speech among friends,
    then gives anecdotes: Demaratus reproves Philip by pointing to strife in Philip''s
    own household; Diogenes enters Philip''s camp and calls Philip''s campaign a foolish
    risk; a tactful person should turn hostile abuse into private correction; Ammonius
    indirectly rebukes pupils by having a freedman punish his own son over an accusation
    about needing vinegar at dinner.'
