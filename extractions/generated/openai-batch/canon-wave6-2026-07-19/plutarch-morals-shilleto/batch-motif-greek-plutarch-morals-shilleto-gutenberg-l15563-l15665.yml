  summary: Plutarch argues that exile need not be shameful or disabling. He lists
    philosophers and writers whose distance from home aided study, quiet, composition,
    and fame; cites Diogenes, Themistocles, Cicero, and others as honored despite
    banishment; then contests Euripidean lines that describe exile as grievous and
    unfree by giving examples of exiles or outsiders speaking frankly before kings.
  language: English
