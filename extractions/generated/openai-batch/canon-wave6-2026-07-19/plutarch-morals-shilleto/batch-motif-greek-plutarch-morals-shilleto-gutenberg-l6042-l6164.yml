canonical_text:
  quote: ''
  summary: 'The passage argues against seeking many friends: friends become implicated
    in one another''s injuries, enemies, disgrace, and misfortune. It illustrates
    this with an oracle about bees and wasps, political punishments of associates,
    mythic and tragic examples of shared harm, and the Athenian plague. It then says
    friendship should be reserved for worthy and similar people, comparing friendship
    to animal likeness, musical harmony, and one soul in several bodies. Finally it
    rejects excessive social adaptability through images of the polypus, Proteus,
    and mutable matter, concluding that a constant friend is rare.'
  language: English
  quote_policy: summarized
