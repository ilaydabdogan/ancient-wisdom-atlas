canonical_text:
  quote: ''
  summary: In a dialogue on Love, Zeuxippus comments on Anytus, and the narrator's
    father argues that Love transforms character, subdues bold lovers before the beloved,
    produces bodily symptoms described by Sappho, and should be understood as a divine
    seizure caused by a god. He compares erotic disturbance with Pythian and Cybele-inspired
    religious inspiration, then argues that poets, legislators, and philosophers,
    despite differing views of divinity, agree in recognizing Love as a god and ruler.
  language: English
  quote_policy: summarized
