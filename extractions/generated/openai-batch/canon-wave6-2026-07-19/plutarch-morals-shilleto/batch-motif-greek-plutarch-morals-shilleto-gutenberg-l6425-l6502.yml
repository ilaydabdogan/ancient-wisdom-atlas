canonical_text:
  quote: ''
  summary: Plutarch explains how to distinguish a flatterer from a true friend. The
    flatterer shifts opinions to match the listener, imitates faults and misfortunes,
    and uses apparent likeness or shared secrets to gain trust. The true friend does
    not imitate everything, praises only what is excellent, and speaks truthfully
    with judgment.
  language: English
  quote_policy: summarized
