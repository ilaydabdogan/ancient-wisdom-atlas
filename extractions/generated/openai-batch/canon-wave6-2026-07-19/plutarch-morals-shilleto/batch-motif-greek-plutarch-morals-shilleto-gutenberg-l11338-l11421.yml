canonical_text:
  quote: ''
  summary: The passage argues that anger grows from selfishness, peevishness, luxury,
    and softness, and that plain living and contentment make one milder toward servants,
    family, and friends. It gives examples of anger at meals and possessions, contrasts
    them with the calm responses of Arcesilaus, Socrates, and Nero after Seneca's
    warning, and concludes that anger spoils friendship, marriage, drunkenness, instruction,
    public judgment, and even adversity.
  language: English
  quote_policy: summarized
