canonical_text:
  quote: ''
  summary: Plutarch writes a consolatory letter to his wife after the death of their
    young daughter. He urges patience, recalls the child's affectionate character,
    argues that memory should bring more joy than grief, praises his wife's restrained
    funeral conduct, and criticizes ostentatious or self-harming mourning practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Plutarch says the messenger sent by his wife to announce their little girl's
    death missed him on the way to Athens, and that he learned the news from his niece
    at Tanagra.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Plutarch supposes the funeral has already taken place and hopes it was done
    in a way that causes the least sorrow; he advises that any remaining action be
    without ceremoniousness or superstition.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Plutarch asks his wife that both of them be patient at the calamity and says
    that excessive grief from her would trouble him more than the event itself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dead child is described as especially beloved by the wife, the first daughter
    after four sons, and given the wife's name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child is described as having pure and simple gaiety, contentedness of
    mind, meekness, affectionateness, winning ways, and kindliness of heart.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The child used to ask her nurse to give the teat to other children and even
    to her favourite playthings, as though sharing her table and good things with
    them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Plutarch argues that memories of the child should give more joy than grief
    and that they should not rail against fortune.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Plutarch cites Clymene as someone who avoided and trembled at things that
    reminded her of her son because remembrance brought grief.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: People present at the funeral reported that the wife put on no mourning, did
    not adorn herself or her maids with trappings of woe, avoided ostentatious funeral
    expenditure, and conducted everything orderly and silently among relations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Plutarch distinguishes natural affection shown in regret, honour, and memory
    from excessive funeral grief expressed in coronachs, breast-beating, lamentation,
