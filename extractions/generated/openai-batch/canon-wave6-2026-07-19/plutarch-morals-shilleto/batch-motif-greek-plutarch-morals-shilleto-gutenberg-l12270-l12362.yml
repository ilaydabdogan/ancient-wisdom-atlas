  text: Perseus is said to have bewailed losing Macedonia unexpectedly, while Aemilius,
    who conquered him, gave up command, was crowned, offered sacrifice, and was esteemed
    happy because he expected the command to be temporary.
  category: sequence
  evidence_refs:
  - ev:2
