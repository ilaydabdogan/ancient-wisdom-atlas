canonical_text:
  quote: '"Anytus and Melitus can kill me, but they cannot hurt me."'
  summary: The passage argues that grief and anger are lessened by expecting mortal
    and changeable conditions, distinguishing external losses from the secure inner
    disposition of the wise. It uses examples from Anaxagoras, Perseus, Aemilius,
    Odysseus, Stilpo, and Socrates, and develops maritime images of a pilot, storm,
    harbour, and leaky boat to describe wise conduct and fear of death.
  language: English
  quote_policy: quoted
