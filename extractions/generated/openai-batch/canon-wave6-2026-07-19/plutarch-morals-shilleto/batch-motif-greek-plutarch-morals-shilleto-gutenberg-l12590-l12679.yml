canonical_text:
  quote: ''
  summary: Plutarch distinguishes envy from hatred. Hatred is traced to the belief
    that an object is bad or harmful, while envy is directed at prosperity, virtue,
    and good reputation. The passage uses examples from animals, Persian magicians,
    Greek literary and historical figures, Socrates' accusers, Alexander, and Cyrus,
    along with images of disease, plants, insects, pollution, and the sun, to contrast
    the two passions.
