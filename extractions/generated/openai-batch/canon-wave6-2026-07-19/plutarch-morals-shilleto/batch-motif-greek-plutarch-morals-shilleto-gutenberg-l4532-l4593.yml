  summary: The passage argues against the view that all sins or passions are equal.
    It presents paired examples of fear, grief, and anger to show varying degrees
    of passion, discusses differing judgments about poverty, death, and health, and
    cites Plato, Chrysippus, and Menander in support of a distinction between reason
    and the unreasoning or emotional part of the soul.
