- id: obs:1
  text: Socrates reproves a friend too vehemently during a table discussion; Plato
    says the correction would have been better made privately, and Socrates replies
    that Plato's remark also should have been private.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pythagoras harshly rebukes a pupil before many people; the pupil hangs himself,
    and Pythagoras thereafter avoids rebuking anyone in another's presence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wrongdoing is compared to a foul disease, and its detection and exposure are
    said to belong in private rather than before witnesses and spectators.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage contrasts ostentatious public rebuke with gentle, cautious, mild
