canonical_text:
  quote: ''
  summary: Plutarch advises that frank correction among friends should be private,
    gentle, supported by the speaker's own character, and sometimes softened by shared
    self-criticism or praise. He illustrates the rule with anecdotes about Socrates,
    Plato, Pythagoras, Alexander, Ptolemy, Xenocrates, Phoenix, and Homeric lines.
  language: English
  quote_policy: summarized
