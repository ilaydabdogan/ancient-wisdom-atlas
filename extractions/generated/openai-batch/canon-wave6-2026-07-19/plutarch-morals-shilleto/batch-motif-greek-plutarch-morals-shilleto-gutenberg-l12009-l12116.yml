  summary: The passage gives moral counsel against envy and dissatisfaction with fortune.
    It contrasts escalating ambitions for Roman offices with a sound mind that rejoices
    by comparing itself with less fortunate lives. It uses examples of litter bearers,
    Xerxes' laborers, Socrates' market lesson, Pittacus' domestic trouble, Homeric
    royal suffering, and figures such as Dionysius, Alexander, and Achilles to argue
    for moderated desires and recognition of limits.
