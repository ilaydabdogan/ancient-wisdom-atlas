  quote: ''
  summary: The passage distinguishes a true friend from a flatterer. It says the friend
    counsels the rational and better part of the soul, while the flatterer stimulates
    passions and irrational impulses. It offers practical tests involving appetite,
    travel, promises of money, greetings, services, and advice. It also uses dramatic
    quotations and examples to contrast candid friendship with pleasing speech.
  language: English
  quote_policy: summarized
