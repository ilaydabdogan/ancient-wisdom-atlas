candidate_motifs:
- id: motif:1
  label: Punishment of descendants for ancestral sins
  taxonomy_refs:
  - divine_judgment
  basis: The passage explicitly names the charge that gods visit parents' sins on
    children and then gives repeated examples of present communities harmed for earlier
    deeds.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents the pattern critically as an objection to divine
    or political justice, not as an endorsed doctrine.
- id: motif:2
  label: Delayed vengeance resolved through later satisfaction
  taxonomy_refs:
  - divine_judgment
  - sacred_exchange
  basis: After AEsop is killed, divine wrath brings calamities on the Delphians until
    a later figure gives satisfaction three generations afterward.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The text reports the story as something said, and uses it as an analogy
    in philosophical argument.
- id: motif:3
  label: Sacred theft causing later communal punishment
  taxonomy_refs:
  - sacred_theft
  - divine_judgment
  basis: Apollo's flooding of present Pheneus is attributed to Hercules' ancient carrying
    off of the oracular tripod.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only one example in the passage directly links a stolen sacred object
    to later punishment.
- id: motif:4
  label: Propitiatory rite or inherited ritual obligation
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The Delphians seek satisfaction for AEsop's death, the Sybarites are told
    to propitiate Hera, and the Locrians send maidens to serve at Athene's altar because
    of Ajax's offense.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: medium
  cautions: The practices differ in form; the shared feature is later ritual or propitiatory
    action linked to earlier wrongdoing.
- id: motif:5
  label: Destructive flood as divine punishment
  taxonomy_refs:
  - divine_judgment
  basis: Apollo is said to punish Pheneus by blocking the water outlet and flooding
    the whole district.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage mentions flood as punishment but does not describe renewal
    or survival after the flood.
- id: motif:6
  label: Mythic past used as political justification for present violence
  taxonomy_refs: []
  basis: Alexander and Agathocles are cited as rulers who punish living communities
    for ancestral or mythic acts.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a rhetorical pattern in the passage rather than a taxonomy-linked
    myth family.
- id: motif:7
  label: Mourning or bodily marking for mythic dead
  taxonomy_refs: []
  basis: Thracians mark wives in honor of Orpheus, and people by the Eridanus wear
    mourning for Phaeethon.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives brief examples and immediately evaluates delayed mourning
    as ridiculous rather than explaining ritual meaning.
comparison_claims:
- id: claim:1
  claim: The passage itself groups several stories under a shared pattern in which
    later people bear punishment, burden, or harm for earlier offenses.
  claim_level: same_motif
  target: AEsop and the Delphians; Branchidae; Corcyraeans and Ithacans; Pheneus;
    Sybarites; Locrians
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to Timon's argument and does not establish
    historical relationship among the stories.
- id: claim:2
  claim: Agathocles' remarks connect present harm to Corcyra and Ithaca with mythic
    traditions about Odysseus, using earlier Odyssean deeds as an explanatory precedent.
  claim_level: same_function
  target: Odysseus-linked mythic precedent for later retaliation
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only preserves Agathocles' hostile joke and does not narrate
    the full Odysseus story.
- id: claim:3
  claim: The Locrian, Thracian, and Eridanus examples function similarly as present
    communal practices tied to mythic figures or events from the past.
  claim_level: same_function
  target: Ritual service, bodily marking, and mourning attached to Ajax/Cassandra,
    Orpheus, and Phaeethon
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The practices are not identical; the passage compares them as questionable
    later obligations or commemorations.
