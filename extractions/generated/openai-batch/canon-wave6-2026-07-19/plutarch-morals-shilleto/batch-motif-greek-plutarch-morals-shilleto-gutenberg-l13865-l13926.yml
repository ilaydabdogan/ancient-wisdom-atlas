canonical_text:
  quote: "“visiting the sins of the parents upon the children”"
  summary: Timon frames Euripides' objection that gods unjustly punish children or
    later communities for ancestral sins. He gives a series of examples involving
    AEsop and the Delphians, Alexander and the Branchidae, Agathocles and communities
    linked to Odysseus, Apollo and Pheneus, Hera and the Sybarites, Locrian maidens
    sent to Troy, Thracian marking for Orpheus, and mourning for Phaeethon. The passage
    ends by questioning why divine anger would subside and later burst out against
    others like rivers.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Timon introduces a final question concerning Euripides' accusation against
    the gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The accusation is that the gods visit the sins of parents upon children, which
    Timon presents as unjust punishment of the innocent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: AEsop came with money from Croesus to offer sacrifice and distribute money
    to the Delphians; after a dispute, the Delphians charged him with sacrilege and
    executed him by throwing him from Hyampia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Delphic god is said to have become angry with the Delphians and brought
    dearth and strange diseases on their land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three generations later Idmon, a Samian descended from those who had purchased
    AEsop, gave satisfaction and the Delphians were released from their trouble.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Alexander destroyed the city of the Branchidae and killed its inhabitants
    because their great-grandfathers had betrayed the temple at Miletus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Agathocles justified wasting Corcyra by saying the Corcyraeans' forefathers
    had welcomed Odysseus, and justified taking Ithacan sheep by citing Odysseus'
    blinding of a shepherd's eye.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Apollo is described as punishing the present inhabitants of Pheneus by blocking
    a water-channel and flooding the district because Hercules had carried off the
    oracular tripod long before.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sybarites are said to have been told that their troubles would end only
    by propitiating the wrath of Leucadian Hera through ruin on three occasions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Locrians sent maidens to Troy, where they swept around Athene's altar
    barefooted and without upper garments, because Ajax violated Cassandra.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Thracians mark their wives in honor of Orpheus, and people on the Eridanus
    wear mourning for Phaeethon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Timon compares delayed divine anger to rivers that subside and later burst
    out against others until they ruin them.
  category: speech
  evidence_refs:
  - ev:9
