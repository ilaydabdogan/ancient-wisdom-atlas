canonical_text:
  quote: flattery is not easily distinguished from friendship
  summary: The passage explains why a clever flatterer is difficult to distinguish
    from a genuine friend. It contrasts obvious parasites with secret, serious flatterers;
    uses examples and analogies involving feasting, courtly servility, Gobryas and
    Darius, wheat and wild grains, cooks, and color-changing creatures; and concludes
    that the flatterer must be unmasked by discerning differences from true friendship.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says it is difficult to distinguish flatterer from friend when
    both give pleasure and praise, and when flattery can surpass friendship in services
    and attentions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists obvious flatterers, including dinner parasites, people drawn
    to wealthy tables, and female flatterers in Cyprus nicknamed "step-ladders" because
    they let kings' wives step on their bodies to mount carriages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dangerous flatterer is described as one who neither seems nor admits to
    be a flatterer, is often sober and busy, seeks involvement in another person's
    affairs and secrets, and plays a serious rather than comic role.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Secret and serious flattery is said to cast suspicion even on genuine friendship
    if one is not careful.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gobryas pursues one of the Magi into a dark room, wrestles with him on the
