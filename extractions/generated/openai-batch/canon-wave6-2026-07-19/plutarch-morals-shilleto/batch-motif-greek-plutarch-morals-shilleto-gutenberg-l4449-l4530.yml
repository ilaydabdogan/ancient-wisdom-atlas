canonical_text:
  quote: ''
  summary: The passage argues that reason and passion are distinct powers in the soul.
    Their conflict can painfully divide the soul, while their agreement occurs when
    reason persuades and orders the emotional element rather than destroying it. Examples
    include love, anger, shame, marriage, pupils and teachers, civic relations, and
    the contrast between temperate and incontinent persons. Chrysippus is cited as
    evidence that what follows reason differs from reason itself.
  language: English
  quote_policy: summarized
