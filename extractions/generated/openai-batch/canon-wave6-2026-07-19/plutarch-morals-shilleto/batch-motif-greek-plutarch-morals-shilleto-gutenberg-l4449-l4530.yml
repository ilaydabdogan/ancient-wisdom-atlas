- id: obs:3
  text: A person dissatisfied with falling in love is said to call reason to aid against
    passion and to perceive the two as contrary elements in the soul.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the unreasoning element contends with reason, the passage says that victory
