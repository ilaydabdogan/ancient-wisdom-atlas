canonical_text:
  quote: ''
  summary: The passage argues that exile should be eased by reason, by attention to
    remaining goods, and by recognizing that no particular place is naturally one’s
    country. It invokes Aristo, Plato, Hercules, Socrates, shared cosmic elements,
    God, and Justice to present the whole world as a common country. It then uses
    examples of migration, attachment to local waters and mountains, prudence as an
    anchor and helm, and anecdotes about banished or displaced figures to show that
    a wise person can make any city a home.
  language: English
  quote_policy: summarized
