canonical_text:
  quote: Borrow from your own table.
  summary: The passage argues against borrowing money, urging people to use or sell
    their own surplus resources before taking loans. It supports the argument with
    legal, historical, religious, and mythological examples, and repeatedly depicts
    debt as loss of liberty, captivity, torment, and self-propagating growth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Plato's Laws is cited as permitting a person to use a neighbour's water only
    after first trying and failing to make a usable well on their own land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The speaker proposes an analogous rule for money: people should examine their
    own resources before borrowing from others.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says people borrow at high interest because of luxury, effeminacy,
    and lavish expenditure, even when they have resources of their own.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker tells the addressee to use household items such as cups, silver
    dishes, pots, and pans in time of need rather than court a banker or trader.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Pericles made the gold ornament of Athene removable so the
    gold could be used in war and later restored.
  category: action
  evidence_refs:
  - ev:5
