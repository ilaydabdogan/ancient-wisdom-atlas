candidate_motifs:
- id: motif:1
  label: Shared water as a model for necessity and self-provision
  taxonomy_refs: []
  basis: The passage uses Plato's water law to frame a rule that one should use one's
    own resources before borrowing from others.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a legal-philosophical analogy rather than a mythic narrative motif.
- id: motif:2
  label: Sacred wealth or personal wealth offered for communal need
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Pericles' removable ornament of Athene, Roman matrons' offerings to Apollo,
    and Carthaginian matrons' shorn hair all present valuable or bodily materials
    redirected toward civic or sacred purposes.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The examples are used rhetorically in an essay against borrowing; the
    Carthaginian hair episode is civic defense rather than a direct offering to a
    deity.
- id: motif:3
  label: Temple refuge or asylum from creditors
  taxonomy_refs: []
  basis: Artemis at Ephesus is said to give debtors asylum and security when they
    take refuge in her temple.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives only a brief reference and then moralizes it into a
    metaphorical sanctuary of frugality.
- id: motif:4
  label: Oracular wooden refuge for liberty
  taxonomy_refs:
  - wisdom
  basis: The Pythian Priestess' wooden-walls oracle and the Athenians' refuge in ships
    are used as a precedent for seeking liberty through simple wooden household goods.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The second use is the author's moral adaptation, not a new oracle narrative.
- id: motif:5
  label: Debt as underworld punishment
  taxonomy_refs:
  - divine_judgment
  basis: Money-lenders' agents are compared to fiery Hades torturers and executioners
    who punish the impious, and the forum is described as a hell for debtors.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage does not narrate an actual afterlife judgment; it uses underworld
    punishment imagery as a comparison for social suffering.
- id: motif:6
  label: Tantalus-like deprivation from one's own abundance
  taxonomy_refs: []
  basis: Debtors are described as prevented from tasting their own grapes or crops,
    as if they were Tantaluses.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The Tantalus pattern appears as a simile, not a full retelling.
- id: motif:7
  label: Captivity through bonds and fetters
  taxonomy_refs: []
  basis: Money-lenders' boxes of bonds and agreements are likened to Persian manacles
    and chains for captives.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: This is a political-martial comparison applied to debt documents.
- id: motif:8
  label: Beneficial sowing inverted into debt-planting
  taxonomy_refs:
  - culture_hero
  basis: Triptolemus' harmless sowing of corn is contrasted with money-lenders planting
    roots of debt that grow, spread, and choke cities.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: Triptolemus is invoked only as a contrast, and the debt-roots image is
    metaphorical.
- id: motif:9
  label: Self-propagating debt
  taxonomy_refs: []
  basis: The passage compares debts to hares and says debts give birth before they
    conceive.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: This is a metaphor for compounding or rapidly recurring debt, not a mythological
    episode.
comparison_claims:
- id: claim:1
  claim: 'The passage explicitly gives creditor oppression the same rhetorical function
    as Hades punishment imagery: tormentors, executioners, and a hell-like setting
    represent the debtor''s suffering.'
  claim_level: same_function
  target: Hades punishment imagery / divine_judgment motif family
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is moral and metaphorical; the passage does not claim
    that debt is literal divine judgment.
- id: claim:2
  claim: The passage compares debtors barred from enjoying their own crops to Tantalus-like
    deprivation.
  claim_level: same_function
  target: Tantalus deprivation pattern
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: Only the deprivation image is present; the passage does not retell
    Tantalus' myth.
- id: claim:3
  claim: The passage likens debt documents to captor's fetters by comparing money-lenders'
    boxes of bonds and agreements with Persian manacles and chains.
  claim_level: same_function
  target: captivity or fetter pattern
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: The link is a rhetorical analogy between financial obligation and military
    captivity.
- id: claim:4
  claim: The passage contrasts money-lenders' spreading roots of debt with Triptolemus'
    sowing of harmless corn, using an agricultural dissemination image with opposite
    moral value.
  claim_level: same_function
  target: Triptolemus agricultural culture-hero sowing pattern
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: Triptolemus appears only as a brief comparison and not as the subject
    of a narrative.
- id: claim:5
  claim: The passage applies the Delphic wooden-walls refuge pattern to private frugality
    by moving from ships as public refuge to wooden household furniture as a means
    of liberty.
  claim_level: same_function
  target: Delphic wooden-walls oracle and refuge pattern
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The adaptation is the essayist's moral analogy, not evidence for a
    separate mythic tradition.
