canonical_text:
  quote: So great is the force of habit in all matters.
  summary: The passage argues that talkativeness should be corrected by habit and
    reason. It uses the anecdote of Pupius Piso's slave, advice on answering questions
    in company, a contrast with Pythian oracular speech, and Socrates' delayed drinking
    after exercise to illustrate disciplined speech and appetite.
  language: English
  quote_policy: quoted
