  summary: The passage argues that contentment and discontent lie in the mind rather
    than in external divine allotments. It contrasts foolish forgetfulness with wise
    recollection, uses images of futile underworld labor and trapped insects for destructive
    memory habits, recommends harmonizing good and bad like music, and contrasts Menander's
    single good genius at birth with Empedocles' two fates or genii governing each
    person.
