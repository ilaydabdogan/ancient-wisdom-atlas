canonical_text:
  quote: ''
  summary: The passage contrasts the true friend with the flatterer. The flatterer
    pleases, assents, makes services conspicuous, and reminds recipients of favors.
    The true friend gives useful and honorable aid quietly, illustrated by Arcesilaus
    secretly helping Apelles, Lacydes secretly helping Cephisocrates, the gods bestowing
    benefits secretly, and the Lacedaemonians modestly sending corn to Smyrna. The
    passage concludes that friends should share in good, not bad, action.
  language: English
  quote_policy: summarized
