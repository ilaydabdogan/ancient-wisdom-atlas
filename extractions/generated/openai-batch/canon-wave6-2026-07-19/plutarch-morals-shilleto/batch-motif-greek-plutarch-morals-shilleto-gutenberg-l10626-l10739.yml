literal_observations:
- id: obs:1
  text: The passage asks whether a miser can be importuned to lend without a bond,
    a proud man to yield place, or an ambitious man to surrender an office, and contrasts
    their firmness in vice with the duty of honorable people not to abandon virtue.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Improperly satisfying importuners for glory or power is compared to unfair
    umpires or voters who improperly bestow offices, prizes, and glory while robbing
    themselves of fair fame.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Giving way to an importuner for money is described as making another person's
    purse heavier at the cost of one's own reputation, and is compared to people pressed
    to drink large bumpers who complain but obey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Weakness of mind is compared to a bodily temperament equally susceptible to
    heat and cold; such people yield to praise and fear blame or suspicion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Praise from importuners is called insincere, and yielding through pleasure
    is compared to swine allowing themselves to be used because of itching and tickling.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: People who listen to flatterers are compared to people tripped up in wrestling,
    with their fall described as more disgraceful.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bio is said to have compared such people to jars that can be taken by the
    ears and turned about at will.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports anecdotes about Alexinus speaking against Stilpo, then
    being defended as someone who had praised him, and about Menedemus censuring Alexinus
    despite Alexinus frequently praising him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hercules in Antisthenes is said to have ordered his sons to be grateful to
    no one who praised them; the passage glosses this as not being dumbfounded by
    praise and not flattering in return.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pindar replies to someone who says he praises him everywhere that he will
    make the account true by his actions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: For bashfulness, the passage advises remembering the pain and grief caused
    by past errors, comparing this to travellers remembering a stone they stumbled
