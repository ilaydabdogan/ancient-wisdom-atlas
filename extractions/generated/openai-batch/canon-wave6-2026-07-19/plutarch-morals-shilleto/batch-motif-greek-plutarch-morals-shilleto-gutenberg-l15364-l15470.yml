    and public duties.
  source_text_path: texts/public-domain/greek/project-gutenberg/plutarch-morals-shilleto.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 15425-15431
  quote_or_summary: Callimachus is cited for not measuring wisdom by a Persian rope,
