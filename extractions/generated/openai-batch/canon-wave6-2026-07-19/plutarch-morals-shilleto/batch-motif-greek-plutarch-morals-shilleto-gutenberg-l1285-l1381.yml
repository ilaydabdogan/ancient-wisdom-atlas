canonical_text:
  quote: ''
  summary: The passage opens Plutarch's dialogue On Love. Flavianus asks his brother
    Autobulus to recount conversations about Love held on Mount Helicon during the
    Thespian festival to the God of Love and the Muses. Autobulus frames the narrative,
    rejects ornamental landscape exordium, and invokes the Mother of the Muses for
    memory. He then describes how his newly married father and mother attended a sacrifice
    to the God of Love, how companions gathered at Thespiae and moved to Helicon,
    and how a dispute arose over whether the virtuous widow Ismenodora should marry
    the handsome youth Baccho. Pisias opposes the match, Anthemion supports it, and
    Daphnaeus rebukes Protogenes for criticizing love despite Protogenes' own love-driven
    journey from Cilicia to Athens.
  language: English
  quote_policy: summarized
