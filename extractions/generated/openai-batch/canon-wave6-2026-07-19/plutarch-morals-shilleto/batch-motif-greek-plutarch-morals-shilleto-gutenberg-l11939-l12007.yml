canonical_text:
  quote: ''
  summary: The passage argues that people should not fix attention on troubles while
    ignoring present comforts. It uses analogies and anecdotes about a Chian choosing
    sour wine, Aristippus weighing a lost farm against remaining fields, Antipater
    counting blessings on his death-bed, and Arcesilaus criticizing attention to others'
    lives. It advises reckoning everyday blessings, imagining their absence, looking
    to one's own condition or to those worse off, and avoiding endless upward comparison
    toward wealth, kingship, or divine power.
  language: English
  quote_policy: summarized
