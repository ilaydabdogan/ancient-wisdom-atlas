canonical_text:
  quote: ''
  summary: The passage argues that love is necessary for generation in nature and
    illustrates this with personified cosmic unions. It then contrasts unstable boy-loves
    with lasting conjugal fidelity, introducing the story of Sabinus and his wife
    Empone/Herois. After a failed revolt, Sabinus hides in underground caves and has
    his death falsely reported. Empone grieves publicly, then secretly joins and helps
    him, conceals her pregnancy, gives birth to two boys in the cave, and is later
    executed by Vespasian after defiantly preferring underground darkness to imperial
    power.
  language: English
  quote_policy: summarized
