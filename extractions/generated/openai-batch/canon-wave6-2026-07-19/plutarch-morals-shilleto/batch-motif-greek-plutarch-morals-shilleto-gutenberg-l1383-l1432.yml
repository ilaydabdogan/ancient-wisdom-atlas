    love.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Protogenes says love, when it seizes a noble young soul, ends in virtue through
    friendship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Protogenes says violent passions for women aim at carnal enjoyment, and he
