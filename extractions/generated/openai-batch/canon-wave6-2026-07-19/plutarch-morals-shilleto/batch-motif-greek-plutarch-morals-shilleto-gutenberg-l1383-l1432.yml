  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Protogenes says marriage is necessary for the continuation of the human race
    and is praised by legislators, but he denies that genuine love is present on the
    woman's side of the house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Protogenes compares men attracted to women and girls to flies attracted to
    milk, bees to a honey-comb, and butchers and cooks to calves and birds fattened
