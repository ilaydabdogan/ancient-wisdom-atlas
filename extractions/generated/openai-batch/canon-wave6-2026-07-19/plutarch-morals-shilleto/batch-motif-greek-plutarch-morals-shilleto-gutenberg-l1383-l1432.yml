canonical_text:
  quote: For love, when it seizes a noble and young soul, ends in virtue through friendship
  summary: In a debate on love, Protogenes distinguishes genuine love from uncontrolled
    sexual passion. Daphnaeus defends marriage as a holy union, while Protogenes treats
    marriage as necessary but not genuine love, argues that true love leads through
    friendship to virtue, and contrasts this with forms of desire aimed at pleasure.
    The passage uses animal, food, domestic, poetic, educational, and legal examples
    to support the distinction.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Protogenes says he is not hostile to love but is fighting on love's behalf
    against ungovernable lust that takes love's honorable title.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Daphnaeus asks whether Protogenes calls the marriage and union of man and
