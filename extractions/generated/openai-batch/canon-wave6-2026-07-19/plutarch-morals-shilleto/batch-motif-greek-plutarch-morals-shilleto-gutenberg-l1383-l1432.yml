  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Protogenes says love without the promise of friendship and virtue does not
    continue merely for beauty, and he uses examples of an unnamed husband and Stratocles
    to illustrate non-reciprocal or difficult relations.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Protogenes calls the passion he criticizes effeminate and bastard love, contrasts
