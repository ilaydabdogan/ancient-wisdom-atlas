canonical_text:
  quote: ''
  summary: The passage argues that reason and examples of self-restraint can moderate
    anger. Plato and Archytas are presented as men who delayed or avoided punishment
    while angry. The speaker then argues that the deity delays punishment to allow
    repentance and reform, removing only the incurable and punishing persistent vice.
    Several rulers and public figures are cited as examples of character change or
    of great natures that would have been lost if judged too soon, with metaphors
    of sea-tossing and uncultivated but fertile land.
  language: English
  quote_policy: summarized
