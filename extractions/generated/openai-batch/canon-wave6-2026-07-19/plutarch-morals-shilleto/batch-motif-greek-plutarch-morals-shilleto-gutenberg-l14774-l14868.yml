  summary: A moral-philosophical argument against borrowing money accuses money-lenders
    of fraud, expanding harm, and luxury-driven exploitation. The speaker warns borrowers
    that debt brings servitude and care, recommends labor and self-sufficiency, and
    uses anecdotes, animals, Zeus Soter, Centaurs, Gorgons, bridled horses, and exiled
    demons as rhetorical comparisons.
