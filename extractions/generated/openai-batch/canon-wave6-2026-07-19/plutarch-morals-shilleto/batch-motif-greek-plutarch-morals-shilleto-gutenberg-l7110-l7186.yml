canonical_text:
  quote: ''
  summary: The passage contrasts the conduct of a true friend with that of a flatterer.
    A friend helps in hardship but refuses dishonourable acts; a flatterer avoids
    toil and danger but eagerly serves disgraceful purposes. The passage extends the
    contrast through images of an ape, counterfeit coin, inferior metal, a painter
    hiding real cocks from painted ones, slander as a wound that leaves a scar, and
    the vulnerability of powerful people such as Alexander to flatterers.
  language: English
  quote_policy: summarized
