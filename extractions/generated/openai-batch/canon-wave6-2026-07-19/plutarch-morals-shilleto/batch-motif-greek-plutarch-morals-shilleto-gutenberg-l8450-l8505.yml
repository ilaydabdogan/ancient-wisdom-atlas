canonical_text:
  quote: ''
  summary: Section IX argues that people should treat enemies with forbearance and
    justice, praise deserving opponents, avoid habits of deceit and revenge, and train
    humane conduct through examples involving Caesar, Pythagoras, Scaurus, and Cato.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage instructs that enmities should be met with meekness and forbearance,
    and friendships with still greater simplicity, magnanimity, and kindness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says it is generous not to take revenge on an enemy when an opportunity
    arises, and admirable to help an afflicted enemy and the enemy's family.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A cited verse describes a person who does not admire such benevolence as having
    a black heart made of adamant, iron, or bronze.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Caesar is said to have ordered fallen statues of Pompey to be set up again,
    and Cicero comments that this action erected statues to Caesar himself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage advises praising and honoring an enemy who deserves a good name,
    saying that such praise increases the praiser's own credibility.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that enmity brings hatred, envy, jealousy, malignity, revenge,
    knavery, deceit, and villainy into the character, and that habits used against
    enemies can later be used against friends.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pythagoras is described as training disciples to avoid cruelty to animals
    by discouraging bird-fowling, buying captured fish and having them returned to
    water, and forbidding the killing of animals except wild animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says it is still more noble, in human quarrels, to be a generous,
    just, and true enemy and to tame base propensities.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Scaurus, though enemy and accuser of Domitius, refuses to hear a slave who
    offers to reveal important matters about Domitius and sends the slave back to
    his master.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cato, while prosecuting Murena, is watched by people who ask whether he will
    gather witnesses and open the case on a given day; when he says no, they believe
    him and leave.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage concludes that dealing justly with enemies removes fear that one
    will act unjustly or treacherously toward friends and intimates.
  category: speech
  evidence_refs:
  - ev:10
