  summary: In a dialogue on restraining anger, Sylla praises Fundanus for becoming
    milder and asks how he cured his temper. Fundanus explains that reason and philosophical
    precepts must be stored in the soul before anger arises, because anger at its
    height excludes reason and resists outside correction.
