canonical_text:
  quote: the cure of the soul, which is called justice
  summary: In a dialogue, Timon asks whether to add a further difficulty. The speaker
    urges caution in discussing divine matters, compares divine punishment to medical
    treatment, cites Pindar and Plato on God and justice, notes that human laws can
    be hard to understand without knowing the lawgiver's purpose, and argues that
    delayed punishment teaches humans to restrain angry revenge and imitate divine
    mildness and order.
  language: English
  quote_policy: quoted
