    it was a good or bad omen.
  category: speech
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:4
  text: The wife told her maid; the maid told a fellow-servant; the fellow-servant
    told her lover; the report reached the Forum before the senator did.
  category: sequence
  evidence_refs:
  - ev:4
