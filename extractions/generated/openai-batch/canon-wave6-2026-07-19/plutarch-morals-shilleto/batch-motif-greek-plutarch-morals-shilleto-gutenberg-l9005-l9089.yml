canonical_text:
  quote: ''
  summary: 'In a didactic passage on talkativeness and curiosity, several anecdotes
    show secrets being demanded, invented, disclosed, or refused: a Roman senator
    tests his wife with a false portent; Fabius reveals Augustus''s private words
    through his wife to Livia; Philippides asks a king for anything except secrets;
    talkative people are compared to those unable to hold ice or serpents; and Seleucus,
    fleeing incognito, has a host killed for revealing his identity.'
  language: English
  quote_policy: summarized
