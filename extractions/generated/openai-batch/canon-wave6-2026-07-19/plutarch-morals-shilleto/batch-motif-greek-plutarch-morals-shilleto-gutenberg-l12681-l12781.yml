canonical_text:
  quote: ''
  summary: The passage distinguishes envy from hatred by comparing what reduces or
    intensifies each passion, then begins a separate discussion on how one may praise
    oneself without provoking envy. It criticizes boastful self-praise through literary
    examples and allows limited self-praise for a statesman when truth and public
    usefulness require it.
  language: English
  quote_policy: summarized
