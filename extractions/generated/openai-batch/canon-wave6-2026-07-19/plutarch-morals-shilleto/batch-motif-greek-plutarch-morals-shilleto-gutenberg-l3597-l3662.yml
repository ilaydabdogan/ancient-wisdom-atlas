  summary: Plutarch addresses his wife in a consolatory letter, praises her plain
    living and fortitude in previous bereavements, cites an Aesopic anecdote in which
    Zeus grants Grief conditional honours, and warns against outward mourning, bodily
    neglect, and condolence visitors who intensify sorrow.
  language: English
  quote_policy: summarized
