canonical_text:
  quote: ''
  summary: The passage explains why taste, smell, and sight affect different creatures
    differently. It gives examples of food becoming poison, odors guiding animals,
    a goose detecting humans, lions fleeing a cock, and odor traveling less effectively
    than sound or vision, all explained through differing seeds, pores, and sensory
    particles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The same substance can be pleasant food to one creature and poison to another;
    examples include a snake harmed by human spittle and hellebore poisoning humans
    while fattening goats and quails.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says things contain commixed seeds, creatures differ outwardly
    and internally, and their apertures or pores vary in size and shape.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Smooth particles entering palate pores are said to produce sweetness, while
    rough or barbed particles entering apertures produce sourness or bitterness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fever or malady changes the positions of seeds in the body, so particles that
    formerly caused one savor may no longer do so; honey is said to contain both sorts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Odors are described as streaming, darting, and sprinkling from things; different
    creatures are affected by different odors because of differing seeds and pores.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bees are led by the odor of honey, vultures by carcasses, dogs guide a hunter
    by scent, and the white goose detects the odor of mankind; smell leads creatures
    to food or away from poison.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The look and hues of things affect creatures differently; lions are said to
    flee the cock because particles from cocks enter lions' eyes and cause pain, while
    not hurting human eyes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Odor is said to travel less far than sound or voice, to emerge from inner
    regions of things, to become stronger when objects are broken or burned, not to
    pass stony walls like sound, and sometimes to mislead dogs hunting scent.
  category: relationship
  evidence_refs:
  - ev:7
