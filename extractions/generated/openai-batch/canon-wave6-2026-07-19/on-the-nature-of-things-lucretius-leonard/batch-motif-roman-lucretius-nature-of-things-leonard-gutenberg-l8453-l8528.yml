canonical_text:
  quote: ''
  summary: The proem credits Athens with early civilizing gifts, including harvest,
    ordered life, laws, and the begetting of a wise truth-speaking man. This master
    diagnoses human distress as an inner fault, likened to a cracked and polluted
    vessel, and teaches a remedy through wisdom, bounds on desire and fear, a path
    to the supreme good, and knowledge of nature's law. The passage contrasts childish
    fear in darkness with adult mental terrors and says these are dispelled not by
    physical light but by understanding nature.
  language: English
  quote_policy: summarized
