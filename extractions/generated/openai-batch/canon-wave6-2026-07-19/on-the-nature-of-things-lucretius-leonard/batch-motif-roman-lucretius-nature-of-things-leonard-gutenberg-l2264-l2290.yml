canonical_text:
  quote: Nothing there is that's not of mixed seed.
  summary: The passage teaches that visible things are composed of mixed elements.
    Earth is described as containing sources of waters, fires, crops, trees, rivers,
    fronds, and pastures, and is therefore named mother of gods, beasts, and humans;
    Greek bards are said to have hymned her.
