canonical_text:
  quote: ''
  summary: The speaker explains the mind as made of extremely tiny, smooth, mobile
    particles, using comparisons with water, honey, breeze-blown seeds, stones, and
    wheat. At death, mind and soul depart without visibly changing the body's form
    or weight, like fragrance or flavor leaving an object. The passage then describes
    the mind as compounded of aura, heat, air, and an unnamed fourth element that
    first transmits sensation through the body; severe disturbance can scatter parts
    of soul through the pores, while ordinary motions stop near the skin and life
    is retained.
  language: English
  quote_policy: summarized
