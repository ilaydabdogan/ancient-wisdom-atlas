canonical_text:
  quote: '"naught''s at hand but body mixed with void"'
  summary: 'The didactic speaker argues that all things are porous bodies mixed with
    void. He illustrates permeability through moisture in grottos, sweat and nourishment
    in human bodies, heat and cold passing through metals, voices and odors passing
    through walls and materials, and tempests moving between earth and sky. He then
    explains that particles emitted from things have different qualities and effects:
    sun, fire, and water act differently on earth, ice, wax, metals, hides, and flesh;
    plants, perfumes, and mire are pleasing or harmful to different animals. The passage
    concludes that pores differ in shape and direction, so senses and materials receive
    different objects through different pathways.'
  language: English
  quote_policy: quoted
