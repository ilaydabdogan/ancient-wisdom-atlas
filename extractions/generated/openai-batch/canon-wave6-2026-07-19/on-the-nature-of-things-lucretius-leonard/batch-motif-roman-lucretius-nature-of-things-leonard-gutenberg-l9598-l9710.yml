  summary: The speaker explains that the earth contains many different atoms or seeds,
    some life-giving and some disease-producing. He lists harmful odors, sights, touches,
    tastes, tree shades, flowers, lamp fumes, bath vapors, charcoal fumes, mining
    exhalations, and other telluric effluvia. He then explains Birdless places where
    exhalations or near-void conditions cause birds to fall and die. The passage ends
    with a physical explanation of seasonal changes in well water temperature.
