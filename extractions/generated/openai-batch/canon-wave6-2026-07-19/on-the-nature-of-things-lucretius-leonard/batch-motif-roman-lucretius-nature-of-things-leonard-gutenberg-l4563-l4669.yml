- id: obs:3
  text: These images are said to terrify intellects in waking or sleeping states,
    especially through strange shapes and images of people without light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the explanation should prevent the supposition that souls
    come loose from Acheron, shades move among the living, or anything of a person
