  text: The speaker says he has already taught about seeds of things, the nature of
    mind, and the mind's dissolution into primordials, and now begins an argument
    about images.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Images of things are described as films scaled off the outer surfaces of things
    and moving through the atmosphere.
  category: object
  evidence_refs:
