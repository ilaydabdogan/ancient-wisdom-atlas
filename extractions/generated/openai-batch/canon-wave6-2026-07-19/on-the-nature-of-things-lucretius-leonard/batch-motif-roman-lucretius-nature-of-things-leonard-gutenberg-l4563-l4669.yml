    apart.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Images appearing in mirrors, water, or other shining surfaces are explained
    as being formed from images sent out by things and repeatedly discharged.
  category: relationship
  evidence_refs:
  - ev:7
