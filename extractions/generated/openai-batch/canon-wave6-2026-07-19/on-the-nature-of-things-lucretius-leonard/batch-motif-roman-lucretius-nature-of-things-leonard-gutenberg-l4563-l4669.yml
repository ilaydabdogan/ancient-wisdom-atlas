canonical_text:
  quote: ''
  summary: The speaker introduces an argument that thin images or effigies are shed
    from the surfaces of things, move through the air, and account for waking or sleeping
    visions that may terrify people. The passage denies that such visions prove that
    souls escape from Acheron or that shades move among the living, and instead explains
    surface-images through analogies including smoke, heat, shed skins, theatre awnings,
    colours, mirrors, water, and shining surfaces.
  language: English
  quote_policy: summarized
literal_observations:
