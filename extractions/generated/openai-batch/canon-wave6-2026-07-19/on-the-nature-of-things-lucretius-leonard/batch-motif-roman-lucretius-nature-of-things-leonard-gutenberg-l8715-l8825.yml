  text: Clouds are said to suffuse the lands with leaping light, and the storm flashes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wind enters a cloud, whirls within it, hollows it, thickens its crust, and
    becomes hot through motion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A heated wind splits a black cloud and scatters pressed-out fire-seeds, producing
    flashes; the sound reaches the ears later than the sight reaches the eyes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dense piled clouds are compared to moving mountain-ranges and to masses about
    mighty peaks; their interiors are described as caverns like crags.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hurricanes are described as prisoned in clouds, roaring, blustering, seeking
    an outlet, and gathering fire-seeds in hollow furnaces until forked flashes burst
    out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Clouds are said to contain abundant fire-seeds, to take many such seeds from
    sunlight, and to pour out bright fire when compressed by wind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When clouds grow rare and thin and are gently broken apart by wind, lightning
