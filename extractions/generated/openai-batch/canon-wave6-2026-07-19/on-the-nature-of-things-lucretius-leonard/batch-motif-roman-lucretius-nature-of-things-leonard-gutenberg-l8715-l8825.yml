  summary: The passage explains lightning, thunder, and thunderbolts as natural phenomena
    caused by wind, clouds, heat, and fire-seeds. It describes storm clouds as towering
    mountain-like masses with cavernous interiors, explains different forms of lightning,
    and lists the penetrating and destructive effects of thunderbolts. The speaker
    addresses an addressee and promises further explanation.
  language: English
