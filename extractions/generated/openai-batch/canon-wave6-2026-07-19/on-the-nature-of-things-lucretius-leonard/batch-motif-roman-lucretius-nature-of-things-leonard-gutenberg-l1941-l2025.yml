  summary: The speaker explains that the primordial beginnings or seeds of things
    are innumerable and dissimilar in form. He illustrates natural variation through
    animals, mother-offspring recognition, a sacrificed calf and its searching mother,
    kernels, shells, and examples of penetration or filtration involving lightning,
    fire, light, rain, wine, and oil.
