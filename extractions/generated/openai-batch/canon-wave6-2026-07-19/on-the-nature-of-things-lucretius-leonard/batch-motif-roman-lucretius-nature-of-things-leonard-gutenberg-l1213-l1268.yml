canonical_text:
  quote: ''
  summary: The speaker introduces the inquiry into the infinity of the universe by
    describing his Muse-inspired poetic task, his aim to free the mind from dread
    religion, and his method of presenting difficult doctrine in pleasing song. He
    compares this method to physicians sweetening bitter wormwood with honey for children.
    He then turns to whether matter and void are finite or infinite.
  language: English
  quote_policy: summarized
