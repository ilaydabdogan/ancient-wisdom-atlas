canonical_text:
  quote: ''
  summary: Lucretius argues that created things have fixed limits and that atomic
    shapes are finite while atoms of each shape are infinite. He illustrates bounded
    gradation with seasons between summer heat and winter frost, abundance with elephants
    in India, and dispersion with a shipwreck on the sea. The passage ends by describing
    an everlasting elemental struggle in which birth, growth, death, funerals, and
    infant cries coexist.
  language: English
  quote_policy: summarized
