canonical_text:
  quote: ''
  summary: The speaker praises earlier philosophers as truth-seekers but argues that
    they fail concerning first-elements, void, minimum bodies, and the four elements.
    He rejects doctrines of soft mortal primal matter and cyclic transformation among
    fire, air, water, and earth, arguing instead for immutable bodies whose changed
    order, motion, and combination produce diverse things. The passage also uses Delphic
    oracle imagery and an analogy between atoms and the elements of words or verses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unnamed earlier philosophers are described as discoverers of truth whose responses
    are compared favorably with those of the Pythia, but they are also said to have
    failed in the matter of first-elements.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The criticized philosophers are said to banish void while still assigning
    motion and allowing soft, loosely textured things such as air, dew, fire, earth,
    animals, and grains to exist without void in their frames.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports a view that cutting bodies down has no end and that there
    is no minimum in things; the speaker counters that unseen things have boundary
    points and minimums.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says that if primal germs are soft and mortal, then all things
    would return to nothing and abundance would be born anew from nothing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes certain bodies as poisons and foes to one another whose
