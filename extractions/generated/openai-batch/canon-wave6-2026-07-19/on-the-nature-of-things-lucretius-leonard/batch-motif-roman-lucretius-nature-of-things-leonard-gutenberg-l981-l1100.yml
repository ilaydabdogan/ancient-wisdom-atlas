  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker states that an immutable something must remain, because change
    beyond a thing's bounds is the death of what it was before.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: An interlocutor objects that growth depends on air, earth, favorable season,
