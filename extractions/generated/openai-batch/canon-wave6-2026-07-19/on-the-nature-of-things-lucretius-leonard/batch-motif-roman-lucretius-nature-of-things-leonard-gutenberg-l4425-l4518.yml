canonical_text:
  quote: ''
  summary: The passage urges the addressee to consider that kings, conquerors, poets,
    scientists, Democritus, and Epicurus all died. It then describes humans burdened
    by hidden mental distress, restlessly changing places while unable to escape themselves,
    and argues that wisdom about nature is needed because death is unavoidable and
    no prolonging of life reduces the eternal state after death.
  language: English
  quote_policy: summarized
