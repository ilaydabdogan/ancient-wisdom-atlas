canonical_text:
  quote: ''
  summary: The passage argues that the totality has no boundary or beyond. A thought
    experiment with a traveler throwing a spear from a supposed edge shows that further
    space must remain. The poem denies a cosmic bottom, describes endless motion in
    the void, and says body and void alternately bound one another, making the whole
    infinite. It also says the primal germs did not arrange themselves by counsel
    or compact, but through blows, motions, and conjoinings formed the arrangements
    that preserve seas, earth, living creatures, and heavenly fires through continual
    material supply.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the All has no beyond and lacks all end because nothing
    exists outside the sum of things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An imagined farthest traveler runs to the extreme coasts of finite space and
    throws a spear ahead; whether it continues or is stopped, the supposed edge is
    not a final end.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If all space were bounded, the passage says matter would flow downward into
    a heap, but it denies any bottom and says elements remain in endless motion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The abyss is described as so vast that even flashing thunderbolts cannot complete
    a journey through it or lessen their remaining journey.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Local things are said to bound one another, such as air, hills, mountains,
    land, and sea, while nothing outside bounds the All.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Great nature is personified as compelling void to bound body and body to bound
    void, rendering the whole infinite or immeasurable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says sea, earth, sky, mortals, and gods could not keep their place
    if the stock of stuff were dissolved or had never combined.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The primal germs are said not to have established themselves by counsel, mind,
    or compact, but to be driven by blows and to arrive at arrangements after many
    motions and conjoinings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The present arrangements are said to preserve the sum of things by refreshing
    the sea with river-waves, warming earth by the sun, renewing broods, sustaining
    creatures, and keeping ether fires alive through material supply from infinite
    space.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage compares the dissolution of things without incoming matter to
    breathing creatures wasting away when deprived of food.
  category: relationship
  evidence_refs:
  - ev:9
