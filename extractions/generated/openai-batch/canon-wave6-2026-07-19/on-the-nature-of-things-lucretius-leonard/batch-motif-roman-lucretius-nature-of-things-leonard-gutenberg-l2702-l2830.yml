canonical_text:
  quote: sensations all / Can out of non-sensations be begot.
  summary: The speaker argues that sensation does not belong to primal elements themselves.
    Sense arises only when elements unite into living bodies and vital motions. Violent
    disruption can loosen the soul from the body, while lesser disruption may be reversed.
    The passage uses examples of severed members, eggs becoming chicks, worms from
    rain-soaked earth, pain, delight, and a reductio about laughing or thinking elements.
  language: English
  quote_policy: quoted
