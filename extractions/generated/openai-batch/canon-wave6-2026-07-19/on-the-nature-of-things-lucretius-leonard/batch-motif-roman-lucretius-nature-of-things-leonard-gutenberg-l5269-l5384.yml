canonical_text:
  quote: ''
  summary: The passage gives a physical account of voice, echo, sound transmission,
    and taste. Voice is formed by tongue and lips, can be confused over distance,
    divided among listeners, reflected by solid surfaces, and transmitted through
    apertures where sight cannot pass. Echoes in lonely mountain places are contrasted
    with local stories of satyrs, nymphs, fauns, and Pan. The passage then explains
    flavour as contact between particles and the tongue and palate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Voices are described as forced from within the body, expelled at the mouth,
    and made articulate by the tongue and lips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the distance from speaker to hearer is short, the voice preserves its
    formation and words are heard distinctly; when the distance is too long, air and
    winds confound the voice so that sound is heard without clear meaning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A single word from a crier can reach many listeners because one voice divides
    into many voices for separate ears; portions that do not strike ears are diffused
    among the winds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A part of a voice can strike solid porticoes, be tossed back, and return as
    a sound or a phantom-like word.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rocks and hills in lonely, shady mountain places are said to return ordered
    shapes of words and to multiply one uttered voice into six or seven voices through
    reverberation.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The neighbouring countryside is said to claim that such spots are haunts of
    goat-foot satyrs, nymphs, fauns, and Pan, with night noises, revels, strings,
    pipes, reeds, and woodland music.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker states that people tell prodigies and wonders so that they will
    not seem to live in lonely places deserted by gods, or because they are led to
    tell fables.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sounds can pass through places where visible objects cannot be seen; people
    may converse through closed doors because voice can wind through bent apertures,
    while visual films are said to require straight apertures.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Voice passing through shut chambers is dulled and jumbled; voices divide in
    all directions, generate new voices, and can fill hidden places, so one may hear
    beyond a wall without seeing through it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Flavour is felt in the mouth when food is chewed and squeezed, and the expressed
    substance spreads through pores and paths of the tongue.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Smooth bodies of flavour are said to touch the tongue delightfully, while
    rough bodies sting and pain the sense.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pleasure from flavour is limited to the palate; after food passes down the
    throat, the passage emphasizes nourishment and digestion rather than taste.
  category: sequence
  evidence_refs:
  - ev:6
