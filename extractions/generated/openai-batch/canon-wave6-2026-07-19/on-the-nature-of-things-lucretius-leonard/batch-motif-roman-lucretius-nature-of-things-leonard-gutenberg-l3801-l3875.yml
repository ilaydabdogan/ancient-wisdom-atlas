canonical_text:
  quote: ''
  summary: The passage argues that the soul does not depart the body as a single immortal
    whole, but is distributed through the frame, fails locally, and perishes when
    the body decays. It uses images of smoke, a snake leaving its coat, fainting,
    fixed bodily seats of functions, fire and streams, and Acheron-souls pictured
    by painters and older bards to argue that disembodied souls cannot feel or endure
    apart from bodily organs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The body is described as unable to endure separation from the soul without
    decay and stench.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul is described as rising from the body's depths, filtering through
    the frame, passing out in fragments, being shivered within the body, and drifting
    into the winds of air.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dying person is said not to feel the soul leaving as one whole at once,
    nor first through the throat and mouth, but to feel failure in a particular bodily
    spot as the senses dissolve in their own locations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that, if the mind were immortal, dying would be like going
    away or leaving a coat, with the comparison made to a snake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a fainting or near-death case, the soul is described as tottering and craving
    to go out; the face becomes flaccid, the limbs collapse, bystanders are alarmed,
    and people speak of the person as gone or fainted dead away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A soul thrust outside the body is described as in the open, enfeebled, stripped
    of wrappings, and unable to endure for even the least time.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The intellect or counselling mind is said to cleave to one fixed haunt, the
    breast, rather than being begotten in the head, feet, or hands.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that fixed places are assigned for each thing's birth and
    endurance, that bodily members keep their order, and that flame is not created
    in flowing streams nor cold in fire.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says that imagining disembodied souls feeling would require giving
    them five senses, and notes that painters and older bards pictured souls in this
    way in Acheron, while also saying eyes, nose, hands, tongue, and ears cannot exist
    for soul apart from body.
  category: speech
  evidence_refs:
  - ev:6
