canonical_text:
  quote: ''
  summary: 'The passage defines possible conditions for anything eternal: solid bodies
    repel destructive blows, the void is exempt from blows, or the totality has no
    outside space into which it can dissolve. It then considers and challenges the
    soul’s supposed immortality, noting that bodily disease affects the soul and that
    the soul or mind suffers dread, care, guilt, frenzy, oblivion, drowse, and torpor.'
  language: English
  quote_policy: summarized
