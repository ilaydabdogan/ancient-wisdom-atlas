canonical_text:
  quote: The atoms must a little swerve at times--
  summary: The speaker argues that bodies do not rise by their own force, using flames,
    plants, blood, and water-thrown timber as examples. He then says celestial fire
    and heat can move downward. In the void, atoms fall straight down but must swerve
    slightly at indeterminate times and places; otherwise there would be no collisions
    and Nature would create nothing. He rejects the idea that heavier atoms overtake
    lighter ones in the void, because empty void offers no resistance and all weights
    fall equally fast.
  language: English
  quote_policy: quoted
