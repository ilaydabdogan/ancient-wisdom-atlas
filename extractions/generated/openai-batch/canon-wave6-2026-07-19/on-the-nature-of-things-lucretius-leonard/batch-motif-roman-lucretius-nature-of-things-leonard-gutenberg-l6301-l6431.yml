- id: obs:2
  text: The praised figure is said to have first found the way of life called philosophy
    and to have moved life from waves and darkness into serene havens and clear light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ceres is said to have established grain for mortals, and Bacchus is said to
    have provided grape-derived drink, although people could still live without these
    gifts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that human well-being was impossible without a free breast
    or mind, and that the praised figure’s solaces soothe human minds.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage lists monsters and adversaries associated with Hercules’ labours
