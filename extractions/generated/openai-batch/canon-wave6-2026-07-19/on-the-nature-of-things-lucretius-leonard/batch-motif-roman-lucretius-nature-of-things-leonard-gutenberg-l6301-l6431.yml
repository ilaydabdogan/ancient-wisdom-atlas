  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: The praised figure is said to have subdued and expelled these inner troubles
    from the mind by words, not by arms, and to have taught about the immortal gods
    and the nature of the world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The speaker says he follows the praised figure’s footprints and teaches the
    covenant or laws by which all things are framed, including limits that things
