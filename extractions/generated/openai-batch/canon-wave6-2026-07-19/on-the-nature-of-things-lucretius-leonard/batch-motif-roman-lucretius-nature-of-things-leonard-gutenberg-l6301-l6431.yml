canonical_text:
  quote: ''
  summary: The speaker praises an unnamed philosophical discoverer as godlike because
    he found the way of life called philosophy, freed human life from darkness and
    turmoil, and subdued inner passions by words rather than weapons. The proem compares
    this achievement with the gifts of Ceres and Bacchus and the labours of Hercules,
    arguing that mental purification is more necessary than grain, wine, or monster-slaying.
    The following argument announces a natural account of the mortal universe, living
    beings, speech, religion, and celestial motions, opposing explanations based on
    divine teleology or old religious fear.
  language: English
  quote_policy: summarized
