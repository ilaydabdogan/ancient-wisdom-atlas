canonical_text:
  quote: ''
  summary: The passage explains why the ocean does not grow despite rivers, rain,
    springs, and storms; it attributes the balance to sun, wind, clouds, porous earth,
    filtration, and return flow to river-heads. It then turns to Aetna, describing
    volcanic fires, local dread, a call to view events within the boundless Sum-of-Things,
    analogies from bodily disease, and the beginning of a physical account of eruption
    through hollow mountain caverns connected with the sea.
  language: English
  quote_policy: summarized
