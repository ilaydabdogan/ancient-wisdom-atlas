  summary: The passage explains how fires in forests and mountains led humans to notice
    metals, extract and shape them, and develop tools and weapons. It presents a sequence
    from bodily and natural weapons to fire, copper, and iron, then to mounted warfare,
    chariots, and Punic war elephants, with Discord personified as increasing the
    horrors of war.
