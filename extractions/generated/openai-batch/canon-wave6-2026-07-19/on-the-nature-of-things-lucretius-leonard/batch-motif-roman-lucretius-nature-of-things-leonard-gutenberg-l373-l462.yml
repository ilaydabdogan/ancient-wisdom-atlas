canonical_text:
  quote: Thus Nature ever by unseen bodies works.
  summary: The passage argues that nothing is born from nothing or reduced to nothing.
    Rain, earth, crops, animals, milk, and human life exemplify natural transformation,
    while winds, smells, heat, cold, voices, moisture, wear, growth, decay, and sea
    erosion are offered as evidence that unseen bodies produce visible effects.
  language: English
  quote_policy: quoted
