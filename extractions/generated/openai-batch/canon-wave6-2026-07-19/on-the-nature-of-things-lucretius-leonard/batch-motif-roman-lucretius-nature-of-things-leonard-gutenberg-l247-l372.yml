canonical_text:
  quote: Nothing from nothing ever yet was born.
  summary: The passage argues that Nature's law, not ordinary light or divine intervention,
    dispels mental terror by teaching that nothing comes from nothing and nothing
    returns to nothing. It develops this through examples of fixed seeds, seasonal
    growth, cultivation, dissolution into primal bodies, and the replenishment of
    living kinds and cosmic bodies by eternal matter.
  language: English
  quote_policy: quoted
