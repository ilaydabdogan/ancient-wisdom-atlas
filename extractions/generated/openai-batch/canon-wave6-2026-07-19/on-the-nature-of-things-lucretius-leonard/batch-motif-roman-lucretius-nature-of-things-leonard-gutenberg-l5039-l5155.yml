canonical_text:
  quote: ''
  summary: The speaker argues that the senses, especially sight, are not themselves
    deceived; rather, the reasoning mind must judge reality and can add mistaken opinions.
    A sequence of examples describes apparent motion, distance, reflection, refraction,
    double vision, and dream experience, ending with the difficulty of separating
    plain facts from doubtful mental additions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the eyes have the task of noting where light and shadow are,
    while the reasoning mind must decide the facts and the nature of reality.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker instructs the addressee not to attach the mind's fault to the
    eyes or think the senses are everywhere unstable.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A moving ship can seem to stand still, a stationary ship can seem to pass
    by, and hills and fields can seem to flee astern as the ship moves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Stars, the sun, and the moon can seem to pause or stay in place, though the
    passage says they are in motion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two distant mountains with an open waterway between them can seem joined into
    a single island.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: After boys stop spinning, halls can still seem to whirl, posts to reel, and
    roofs to threaten collapse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rising sun can seem close to mountain tops, though the passage says ocean,
    ether, lands, peoples, and wild beasts lie between.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: A shallow pool between paving stones can present a downward vision of clouds
    and heavenly bodies beneath the earth.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A horse stuck in a rapid stream can seem to be carried upstream while standing
    still, and surrounding objects can seem to flow in the same way.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A long portico supported by equal parallel columns can appear to contract
    into a cone-like point when viewed from one end.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sailors on the sea can see the sun as rising from the waves and setting into
    them; observers unfamiliar with the sea can see vessels, oars, and rudders as
    broken or bent by water.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Moving cloud drifts at night can make constellations seem to glide on a different
    course, and pressure beneath one eye can make viewed objects appear double.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: In sleep, while the body rests, the self can seem awake, moving, seeing daylight,
    changing landscapes, hearing sounds, and speaking.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The passage concludes that many such cases seem to undermine faith in sense,
    but the deception is attributed to opinions the mind adds to what the senses do
    not see.
  category: relationship
  evidence_refs:
  - ev:13
