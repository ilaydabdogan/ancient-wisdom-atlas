canonical_text:
  quote: "“minds and the light souls of all that live / Have mortal birth and death”"
  summary: The speaker argues that mind and soul are a single interjoined substance
    with mortal birth and death. He compares the soul’s dissolution to liquids leaving
    broken jars and smoke or fog dispersing, and supports mortality by observing that
    mind develops, ages, suffers disease, is affected by wine, and is disrupted by
    bodily fits.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says he will teach that the minds and light souls of living beings
    have mortal birth and death, and that mind and soul may be treated under one name
    because they are one interjoined substance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul is described as a subtle fabric made of very minute particles, smaller
    than particles of liquid water, fog, or smoke, and more mobile than those substances.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage mentions sleepers seeing altars exhaling steam and smoke aloft,
    and says such apparitions come from outward.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Liquids are said to depart when jars are shivered, and fog and smoke are said
    to depart into the winds; the soul is likewise said to be shed abroad and dissolved
    back to primal bodies after leaving human members.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The body is compared to a jar-like container of the soul; when the body is
    shivered or rarefied by blood loss, it can no longer hold the soul.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Mind is said to come into being with the body, grow with the body, and age
    with the body: children have weak wisdom, maturity brings greater counsel, and
    old age brings failing thought, wandering tongue, and yielding mind.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that the body has diseases and dreadful pain, and the mind
    likewise has bitter cares, grief, and fear.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: In bodily diseases, the mind is said to wander, speak crazily, sink into heavy
