canonical_text:
  quote: That many images of objects rove / In many modes to every region round
  summary: The speaker explains that very thin images or films of objects move through
    the world, combine in the air, penetrate the body, and stir the mind. Compound
    images account for mental visions such as Centaurs, Scylla-like limbs, Cerberus-like
    dog faces, dead people seen as alive, moving dream figures, and altered forms
    in sleep.
  language: English
  quote_policy: quoted
