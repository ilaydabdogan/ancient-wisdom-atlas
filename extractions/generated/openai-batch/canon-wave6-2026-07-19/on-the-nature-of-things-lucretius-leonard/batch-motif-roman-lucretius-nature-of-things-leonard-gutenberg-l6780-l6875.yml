canonical_text:
  quote: ''
  summary: 'The speaker argues that the enclosing sky/world is mortal: if it gives
    birth to and reabsorbs all things, it is diminished and replenished; if lands
    and sky were eternal, older heroic deeds would be preserved; recent arts and doctrine
    show the universe is new; prior fires, earthquakes, and floods imply future annihilation;
    eternal things must be solid, void, or without external space, but the world meets
    none of these conditions, so the door of doom remains open to sky, sun, earth,
    and sea.'
  language: English
  quote_policy: summarized
