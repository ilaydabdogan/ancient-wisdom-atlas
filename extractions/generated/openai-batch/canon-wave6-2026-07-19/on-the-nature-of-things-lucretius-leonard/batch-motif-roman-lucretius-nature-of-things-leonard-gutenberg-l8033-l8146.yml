canonical_text:
  quote: "“To look on all things with a master eye / And mind at peace.”"
  summary: The passage explains the rise of belief in gods and public rites as arising
    from visions and dreams, the observed order of the sky and seasons, ignorance
    of natural causes, and fear before thunder, storms, and earthquakes. It rejects
    ritual acts as true piety and identifies calm understanding as true piety.
  language: English
