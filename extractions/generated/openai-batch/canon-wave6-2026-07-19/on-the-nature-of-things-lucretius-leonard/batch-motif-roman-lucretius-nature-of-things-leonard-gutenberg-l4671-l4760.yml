  quote: ''
  summary: The speaker explains the tenuous nature of images, arguing from minute
    bodies, smells, cloud-forms, and reflections that thin forms stream from objects.
    He also describes self-formed aerial images that change shape into faces, mountains,
    beasts, and storm-darkness likened to murk from Acheron.
  language: English
  quote_policy: summarized
