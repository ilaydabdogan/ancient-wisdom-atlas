  quote: |-
    Wherefore it seems that soul
         Hath both a natal and funeral hour.
  summary: The passage argues that vital sense and soul are distributed throughout
    the body, are divided or dissolved when the body is divided or dies, do not preserve
    memories of a prior life, and therefore have both birth and death.
  language: English
