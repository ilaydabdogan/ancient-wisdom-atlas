canonical_text:
  quote: ''
  summary: The speaker introduces a natural explanation of sleep, asking the listener
    for attention and discernment. Sleep is described as arising when the soul's energy
    is scattered, partly expelled, partly driven inward, and partly hidden within
    the body, causing sense and limbs to fail without becoming death. A remnant of
    soul is compared to fire under ashes, able to rekindle sense. The passage then
    explains air, breath, food, fatigue, and bodily disruption as causes of this condition.
  language: English
  quote_policy: summarized
