canonical_text:
  quote: ''
  summary: 'The passage gives a natural-philosophical account of cosmic formation:
    vapors form clouds, ether encloses the world as a dome, sun and moon revolve midway,
    the earth contracts and produces seas and mountains, the elements settle into
    layers, and the earth remains fixed in the world''s mid-region because it is conjoined
    with air and sky. Human body, soul, and mind are used as analogies for this union
    of subtle and heavy bodies.'
  language: English
  quote_policy: summarized
