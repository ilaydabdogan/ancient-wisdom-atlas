canonical_text:
  quote: Before all else, the seas, the lands, the sky
  summary: The speaker tells Memmius that sea, land, sky, and celestial bodies are
    not divine or eternal and can be annihilated. He frames his teaching as sounder
    than Delphic oracle, warns against religion's imagined punishment for those who
    reason against cosmic divinity, and argues that mind and sense cannot exist apart
    from a living body.
  language: English
  quote_policy: quoted
