canonical_text:
  quote: ''
  summary: 'The passage explains optical appearances: mirror reflections reverse left
    and right, multiple mirrors relay images, curved mirrors alter reversal, bright
    light and bodily conditions affect sight, dark and light air open or block vision,
    distant square towers seem rounded, and a shadow appears to follow the body because
    light is removed and restored across the ground.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a mirror, the right part of the body is observed on the left because the
    image is forced back in a direct line rather than returned unshifted.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage compares mirror reversal to a plaster mask dashed against a post
    or beam and retaining a reversed shape facing the thrower.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An image can be handed from mirror to mirror until five or six idol-films
    have been generated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Things hidden farther back in a house may be shown through bending paths by
    several mirrors, because things spring off at equal angles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Curved mirrors can return images with the right side on the right, either
    through double reflection or by turning the image back toward the observer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Film-idols are described as stepping with the observer and imitating the observer's
    carriage; no images return from the mirror part after the observer has withdrawn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The eyes shun brightness, and the sun can blind when gazed at because films
    from above strike the eyes and disturb them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Piercing lustre is said to burn the eyes because it contains many seeds of
    fire that work into the eyes and produce pain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Jaundiced viewers see things as wan-yellow because yellow seeds flow from
    their bodies and are mixed within their eyes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: From dark recesses, things in light can be seen after luminous air purges
    dark air from the eye paths; from light, objects in darkness cannot be seen because
    denser dark air blocks the apertures.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Distant square city towers often seem rounded because their angles are not
    perceived and the air blunts the image of the angle through many collisions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A shadow in sunlight appears to move with and follow the body's steps, but
    the passage identifies it as air deprived of light while the ground is successively
    darkened and refilled with sunlight.
  category: action
  evidence_refs:
  - ev:8
