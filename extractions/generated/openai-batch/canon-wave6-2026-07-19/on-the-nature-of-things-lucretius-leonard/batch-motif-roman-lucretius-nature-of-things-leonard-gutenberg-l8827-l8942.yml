canonical_text:
  quote: |-
    Here be all things fulfilled with winds and fires--
    Hence the long lightnings and the thunders loud.
  summary: The passage gives a natural-philosophical account of thunderbolts as generated
    in dense, high storm-clouds through the interaction of wind, heat, fiery particles,
    pressure, motion, and impact. It describes storm darkness, thunderheads, lightning,
    thunderclaps, earthquakes, heavy rain, flood-like fields, and mechanisms by which
    wind and blows kindle fire.
  language: English
  quote_policy: quoted
