canonical_text:
  quote: ''
  summary: The proem contrasts watching storm and battle from safety with the higher
    position of wise contemplation. It describes human beings wandering after status,
    power, luxury, and military display, argues that nature needs little for bodily
    ease and mental freedom from care, and concludes that mental darkness and fear
    are dispelled only by nature's aspect and law.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says it is pleasant to watch a storm-tossed sea or an embattled
    army from a place of safety, not because another person's suffering is delightful,
    but because the viewer recognizes evils avoided.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker describes a higher good as holding serene, wise-fortified plateaus
    from which one may look down on people wandering and seeking the road of life.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Human beings are described as rivaling one another in genius or rank and laboring
    for power and mastery of the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The speaker states that nature needs little: bodily pain should be kept away,
    and the mind should enjoy pleasant feeling free from care and fear.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A simple scene of friends resting in grass beside water under a large tree
    is presented as refreshing without great expense.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Luxury objects include golden images of boys holding lamps, gold and silver
    houses, gilded ceilings, pictured tapestry, and purple robes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker says fever does not depart faster from a person lying on costly
    fabric than from one lying on poor bedding.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Military and naval displays are described as temporarily making Religion pale
    and flee from the mind, and as making fears of death leave the heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker says that dread and care are not overawed by arms, swords, kings,
    lords, gold, or purple splendor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Adults are compared to children who tremble in darkness: adults sometimes
    fear things in the light that are no more fearsome than what children imagine
    in the dark.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The speaker says mental terror and darkness are not dispersed by sunrise or
    morning light, but only by nature's aspect and law.
  category: sequence
  evidence_refs:
  - ev:8
