canonical_text:
  quote: ''
  summary: 'The passage argues that mind and soul are mortal: disease can disturb
    them within the body, medicine can restore them, severed organs cannot function
    apart from the body, and the mind and body have vital powers only in their conjoined
    estate. After death, when bodily containment is lost and breath is forced out,
    the soul and the senses of the mind dissolve rather than live independently in
    air.'
  language: English
