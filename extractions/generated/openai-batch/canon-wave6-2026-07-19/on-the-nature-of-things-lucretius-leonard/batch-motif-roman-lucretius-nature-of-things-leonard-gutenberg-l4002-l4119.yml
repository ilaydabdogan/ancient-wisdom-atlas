canonical_text:
  quote: ''
  summary: 'The passage argues that the soul or mind is mortal and bodily: it cannot
    leave remnants in a corpse and still be immortal, cannot migrate into worms or
    ready-made bodies, develops with inherited bodily traits, and cannot exist apart
    from the body or be joined as an eternal thing to mortal flesh.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks whether seeds of soul remain in the breathless body, and
    says that if they do, the soul has lost parts and cannot justly be called immortal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks how cadavers produce worms and a mass of boneless and bloodless
    living things from putrid flesh if the soul has wholly departed and left no remainder.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker considers the idea that souls from outside enter worms one by
    one, and asks why many thousands of souls gather where only one soul has gone
    away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says souls do not make frames or bodies for themselves and cannot
    enter ready-made bodies, because they cannot be interwoven with them to form a
    common interplay of sense.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage attributes rage to the lion's breed, cunning to foxes, and ancestral
    fear and flight to deer, and says traits arise from the start of life in members
    and mentality.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says a certain power of mind comes from its own seed and breed
    and grows together with the body.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: As an absurd result of immortal minds changing bodies, the passage imagines
    a hound fleeing a stag, a hawk fearing a dove, men becoming foolish, and savage
    beasts becoming wise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker states that what is changed dissolves and dies, and that reordered
    parts can perish along with the body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker challenges the idea that human souls always enter human bodies
    by asking how a wise soul becomes dull, why a child is not prudent, and why a
    filly is not trained like a mature steed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker imagines souls standing near animal births and rites of Love,
    innumerable and contending to be first to enter mortal limbs, then proposes mock
    treaties among souls about first arrival.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says a tree cannot exist in ether, clouds cannot exist in ocean
    depths, fish cannot live in fields, blood cannot be in timber, and sap cannot
    be in boulders; each thing has a fixed place to grow.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The speaker says the nature of mind cannot arise alone without the body or
    exist apart from thews and blood, and that joining mortal with eternal is ill-assorted.
  category: relationship
  evidence_refs:
  - ev:8
