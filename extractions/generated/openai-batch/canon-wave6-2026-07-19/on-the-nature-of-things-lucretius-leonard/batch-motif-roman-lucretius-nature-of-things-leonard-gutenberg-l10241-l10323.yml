    funeral, and dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Contagion passes continuously from one person to another and is compared to
    spread among woolly flocks and horned herds.
  category: sequence
  evidence_refs:
  - ev:1
