  text: Those who avoid attending their own sick are later described as dying deserted
    and without help.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who remain with the sick perish from contagion and toil, compelled by
    honour and by pleas and wails around the dying.
  category: action
  evidence_refs:
  - ev:2
