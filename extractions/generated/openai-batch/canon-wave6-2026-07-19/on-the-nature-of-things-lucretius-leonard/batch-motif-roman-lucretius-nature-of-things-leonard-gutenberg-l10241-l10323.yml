canonical_text:
  quote: ''
  summary: 'The passage describes the social effects of the plague: infected people
    expect death, contagion spreads continuously, both neglecters and caregivers perish,
    funerals and burial rites collapse, rural sufferers crowd into the city, bodies
    lie by fountains and in public places, temples are filled with corpses, and people
    fight over pyres to burn their kin.'
  language: English
  quote_policy: summarized
