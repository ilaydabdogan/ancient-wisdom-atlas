canonical_text:
  quote: ''
  summary: The passage denies that all things can combine with all things, using impossible
    hybrid monsters as examples. It argues that living beings arise from fixed seed
    and dam, preserve ancestral type by fixed law, and assimilate only suitable atoms.
    It then extends such lawfulness to all things, explaining diversity through differently
    shaped atoms and using letters, words, and verses as an analogy for atomic combinations.
    It concludes that differing seeds, spaces, weights, blows, and motions distinguish
    living forms and separate ocean, land, and heaven.
  language: English
  quote_policy: summarized
