canonical_text:
  quote: ''
  summary: The speaker refutes philosophers who make fire, air, water, earth, paired
    elements, or four elements the primal stuff of all things. Heraclitus is named
    as a leading fire theorist and criticized for obscure speech and for relying on
    the senses while denying the reality of things perceived by them. The speaker
    argues for void and enduring primal bodies whose motions, positions, and orders
    produce fire and other sensible things. Empedocles of Acragas is introduced in
    connection with the four elements, followed by a vivid description of Sicily,
    Charybdis, Aetna, and praise of Empedocles.
  language: English
  quote_policy: summarized
