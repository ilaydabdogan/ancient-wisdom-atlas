canonical_text:
  quote: ''
  summary: 'The passage gives natural explanations for thunder, lightning, and related
    atmospheric noises: clouds collide, graze, split, or are driven by winds; fire
    moves between clouds; wet clouds quench it while dry clouds ignite; hail, ice,
    and cloud-waves also make sound. Several earthly analogies illustrate these processes
    and explain why lightning is seen before thunder is heard.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thunder is said to shake the blue depths of heaven because clouds aloft clash
    while winds battle against one another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that no sound comes from serene regions of the sky, while
    crashes more often come from places where dense clouds gather.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Clouds are described as neither as condensed as stones and timbers nor as
    fine as mist and smoke, and as able to retain snow and hail.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cloud-sounds are compared to a theater awning, torn paper, hanging cloth,
    and paper sheets beaten or torn by winds.
  category: other
  evidence_refs:
  - ev:1
- id: obs:5
  text: A hurricane enclosed within a cloud is described as making the cloud hollow
    with a thickened crust, after which the cloud splits and gives a loud crash.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Winds blowing through rough-edged or forked clouds are compared to north-west
    winds moving through a forest and making leaves and limbs sound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A fierce hurricane can rend a cloud by assault, and an earthly wind is said
    to twist up and uproot tall trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Waves among clouds are said to break with a rumbling roar like surf on deep
    streams or the sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fiery energy of a thunderbolt falling from one cloud to another is said to
    be extinguished noisily by a wet cloud or to ignite a dry cloud into flame.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Burning in a dry cloud is compared to flame driven by winds along laurel-covered
    mountains and consuming trees, including Delphic laurel of Apollo.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: Crashing ice and a downpour of hail among high clouds are said to produce
    sound when packed rain-cloud masses mixed with hailstones break and boom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Lightning is said to occur when colliding clouds strike forth seeds of fire,
    as stone or steel can emit sparks when struck.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The flash is seen before thunder is heard because things reach the ears more
    slowly than the eyes; the passage illustrates this with a distant man felling
    a tree.
  category: sequence
  evidence_refs:
  - ev:5
