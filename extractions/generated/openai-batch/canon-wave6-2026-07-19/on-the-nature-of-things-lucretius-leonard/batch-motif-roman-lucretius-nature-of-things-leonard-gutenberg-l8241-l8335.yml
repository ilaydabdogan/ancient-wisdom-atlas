canonical_text:
  quote: ''
  summary: The passage describes attempts to use bulls, boars, lions, and other animals
    in war, emphasizing their panic and harm to allies. It then explains the sequence
    from rough clothing to loom weaving and the transfer of wool-working tasks to
    women. Finally, it presents Nature as the first seed-sower and grafter, leading
    humans to grafting, tillage, clearing woods upward onto mountains, and creating
    cultivated landscapes with waterworks, grain, vineyards, olives, fruit trees,
    and hedges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men tried to use bulls, boars, lions, and she-lions in warfare, with lions
    guided by armed trainers and masters in chains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war animals did not remain controllable; lions and she-lions attacked
    riders, bulls injured friends and horses, and boars gored allies and disrupted
    infantry and horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Horsemen could not calm horses panicked by the roar, and saddle animals tried
    to escape tusks by shying or rearing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage compares the fleeing wild beasts to Lucanian oxen in contemporary
    wars, after those oxen have been mangled by steel and have harmed friends.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The speaker doubts that this war-animal practice occurred on this particular
    earth, but allows that it may be true in other worlds; the motive given is to
    cause enemies woe despite self-destruction, weakness in numbers, and lack of arms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rough inter-plaited clothing is said to have preceded loom-woven coverings,
    and loom weaving is placed after iron because iron is needed for the weaving tools.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men are said to have worked wool before women, until farmer folk mocked such
    tasks and gave them to women's hands while turning to harder labor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nature is called the Mother of things and is described as the first seed-sower
    and primal grafter through berries and acorns falling from trees and producing
    shoots in season.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Humans developed practices of grafting slips, setting young shrubs in fields,
    testing modes of tillage, and improving wild fruits by care.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Humans cleared woods upward onto the mountain to make lower places available
    for tilth, meadows, cisterns, runnels, grain, vineyards, olive trees, fruit trees,
    hedges, and shrubberies.
  category: action
  evidence_refs:
  - ev:5
