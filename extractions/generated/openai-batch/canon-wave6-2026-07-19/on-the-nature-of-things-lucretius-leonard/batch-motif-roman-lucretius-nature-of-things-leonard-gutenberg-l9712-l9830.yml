canonical_text:
  quote: "'Tis said at Hammon's fane a fountain is, / In daylight cold and hot in
    time of night."
  summary: 'The passage explains several reported natural marvels: a fountain at Hammon
    that is cold by day and hot by night, a cold fountain that ignites tow and torches,
    sweet-water springs in the sea, and the magnet stone that draws iron. The speaker
    rejects wonder-based explanations and introduces natural principles of fire-seeds,
    water, earth, heat, and continual effluences from things.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A fountain at Hammon's fane is reported to be cold in daylight and hot at
    night; people marvel and attribute the nighttime heat to the sun beneath the earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker rejects the subterranean-sun explanation, arguing that the sun
    cannot boil water from under the thick earth when it cannot heat open water's
    upper side in daylight.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker explains the Hammon fountain by saying that porous earth near
    the spring contains many seeds of fire; night chill contracts the earth and squeezes
    those seeds into the spring, while daytime heat draws them back into the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker adds that sunlight makes water rarer in texture and causes it
    to give up seeds of fire, comparing this with water giving up frost and thawing
    ice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another cold fountain is described as causing tow held above it to catch fire
    and a pitch-pine torch to kindle while floating along its waves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The ignition fountain is explained as containing many seeds of heat; fire
    particles rise through the water, exhale into the air, and combine in flame above,
    though not in enough quantity to make the fountain hot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A fountain at Aradus in the sea is described as bubbling out sweet water and
    parting the salt waves around itself; other sea regions likewise provide sweet
    water to thirsty mariners.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker uses the Aradus example as an analogy for fire-seeds bursting
    through another fountain and attaching to tow or torch material.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A recently extinguished flaxen wick or torch near a lamp may catch fire before
    touching the flame, by heat alone at a distance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The stone called magnet by the Greeks, named from the Magnesian country, is
    said to draw iron.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The magnet stone is said to make a chain of iron rings, sometimes five or
    more, dangling and swaying, with each ring depending from another and feeling
    the stone's power.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Before explaining the magnet, the speaker says many preliminary points must
    be made sure and asks the listener for attentive mind and ears.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speaker states that bodies continually flow from visible things to strike
    the eyes, and compares this with odors, cold from rivers, heat from sun, sea spray,
    echoes, salt taste, and wormwood bitterness.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The speaker generalizes that from all things something is continuously borne
    streamingly outward, with no rest or respite in the flow.
  category: other
  evidence_refs:
  - ev:14
