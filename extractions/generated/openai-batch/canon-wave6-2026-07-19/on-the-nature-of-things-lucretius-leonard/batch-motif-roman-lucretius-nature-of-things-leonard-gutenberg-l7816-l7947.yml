canonical_text:
  quote: ''
  summary: 'The passage gives a naturalistic account of early civilization: households,
    offspring, fire, love, and children soften humans; neighbours make peace; fire
    originates from lightning or tree-friction and cooking is learned from the sun;
    wiser humans teach devices and laws; kings, property, wealth, ambition, royal
    overthrow, and legal codes arise in sequence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Early humans possess huts, pelts, and fire; a woman and a man share one dwelling
    place, and offspring are recognized as born from themselves.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fire reduces exposure to cold, while love and children soften parental hardiness
    and temper.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Neighbours begin to league as friends, avoid wronging or suffering wrong,
    and express compassion for children, women, and the weak through cries and gestures.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lightning is said to have first brought fire to earth for mortals, after which
    heat and flames spread through the lands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fire can also be produced when wind-driven branches of neighbouring trees
    rub and chafe against one another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Humans learn to cook and soften food in flame by observing objects mellowed
    by the sun's warmth and fiery beams.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Men described as stronger in sense and wiser in heart teach others to alter
    their earlier life by fire and new devices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kings begin to found cities and citadels, using them as strongholds and asylums,
    and they portion flocks and fields according to beauty, strength, and sense.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Wealth and gold come to light and soon displace the honour formerly given
    to the strong and fair, as people follow the rich man's party.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Striving for glory and power is described as climbing to heights of honour,
    where envy, likened to a thunderbolt, can hurl people down to Tartarus.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kings are slain; golden thrones, sceptres, and crowns are overturned, made
    bloody, and trampled by the rabble while individuals seek dominion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Wiser heads instruct humans to found magistracies and frame codes, and humankind,
    weary of force and feuds, yields to laws and strict codes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Those who violate common peace fear punishment and exposure; force and fraud
    recoil on their originators, and concealed secrets may be revealed in dreams or
    sickness.
  category: sequence
  evidence_refs:
  - ev:6
