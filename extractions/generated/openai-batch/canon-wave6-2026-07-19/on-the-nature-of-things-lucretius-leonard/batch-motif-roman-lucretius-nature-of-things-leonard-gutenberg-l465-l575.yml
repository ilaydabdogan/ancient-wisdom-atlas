  quote: There's place intangible, a void and room.
  summary: The passage argues that void exists within things and is necessary for
    movement, permeability, differences of weight, and the separation of bodies. It
    rejects explanations that deny void, then compares philosophical inquiry to dogs
    tracking hidden lairs and promises Memmius abundant proofs.
  language: English
  quote_policy: quoted
