canonical_text:
  quote: ''
  summary: The passage describes the ritual image and attendants of the Idaean Mother/Mother
    of Gods, including lion-drawn chariot, turret-crown, Galli, instruments, knives,
    offerings, and the Curetes story of protecting infant Zeus. It then rejects the
    tale as irrational, presents gods as detached from human affairs, treats earth
    as insensate but generative through material seeds, and develops an atomic account
    of diversity, fire, sensory qualities, and mixed elemental forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A divine maternal image is described seated in a chariot in the realms of
    air, with a team of lions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The figure has a turret-crown, and the passage links this token with fortified
    cities and strongholds.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wide nations name the figure the Idaean Mother and give her Phrygian bands
    as escort; the passage says grain first began from those regions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Galli are assigned to the Mother; the passage calls them emasculate and
    explains their assignment by reference to violations against the mother and parents.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cymbals, tambourines, horns, and pipe sound around the Galli, and knives are
    carried before them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Mother is borne through cities, people strew her route with bronze
    and silver coins, alms, largesse, and roses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: An armed troop called the Phrygian Curetes plays with arms, leaps in measured
    motion, and shakes crests on their heads.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The armed troop is said to represent Dictaean Curetes in Crete who drowned
    out infant Zeus' cry by dancing and striking brass so Saturn would not seize him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage offers an alternate explanation that the armed escort signifies
    the Mother's teaching that men should defend their motherland and parents.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker calls the tale beautifully wrought but far from reason and says
    the gods are immortal, remote, at rest, immune from pain and peril, and unaffected
    by gifts or service.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker says earth is insensate, obtains germs of many things, and brings
    many things into sunlight; he permits calling earth Mother of Gods if foul religion
    is avoided.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Flocks, cattle, and horses graze under one sky and drink from one stream,
    yet keep different forms, parental natures, and habits by kind.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Creatures are described as composed of bones, blood, veins, heat, moisture,
    flesh, and sinews, with elements dissimilar in shape.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: Things consumed by fire are said to contain atoms that produce fire, light,
    sparks, and embers.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Smell, colour, and flavour are described as working differently on the senses
    because they differ in elemental shapes; unlike forms combine into one mass.
  category: attribute
  evidence_refs:
  - ev:11
