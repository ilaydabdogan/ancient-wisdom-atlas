canonical_text:
  quote: ''
  summary: The passage describes early human beings as hardier, earth-born, wandering
    like wild beasts, living without agriculture, iron, fire, clothing, shared laws,
    navigation, organized warfare, or medicine. They subsist on naturally produced
    foods and water, shelter in groves, caves, woods, and thickets, mate in forests,
    hunt and flee animals, sleep on leaves, and suffer dangers from beasts, hunger,
    wounds, and poison. The speaker contrasts these ancient dangers with later dangers
    from war, shipwreck, abundance, and deliberate poisoning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Early mortal humans are described as hardier than later humans, with larger
    bones, stronger sinews, and resistance to heat, cold, strange food, and illness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Early humans are said to have been begotten by a hardier earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: They lived in a roaming manner compared to wild beasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: They did not use ploughs, iron fieldwork, planting, or pruning tools.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: They ate what sun, rain, and earth produced without cultivation, including
    acorns, arbute berries, and other coarse foods.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rivers and springs supplied drinking water, and water descended from hills.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: They found woodland grottos associated with flowing rills, wet rocks, moss,
    and water welling across flats.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: They did not yet know how to kindle fire against cold or use animal pelts
    as clothing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: They sheltered in groves, mountain-caves, woods, and thickets during wind
    and rain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: They lacked shared customs, laws, and concern for the general good; each took
    away booty individually.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sexual unions occurred in forests, attributed to mutual desire, male force,
    or gifts of food such as acorns, pears, or arbute berries.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: They hunted forest animals with strength of hands and legs, stones, and gnarled
    branches, conquering some animals and fleeing others.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: At night they lay naked on the earth and rolled themselves in leaves and boughs.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: They did not fear that night would become eternal because they had always
    seen dark and day alternate.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Their sleep was threatened by wild animals such as boars and lions, causing
    them to abandon rocky shelters and leaf beds.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: Some humans were eaten alive by beasts, and wounded survivors lacked medical
    knowledge.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: The passage contrasts earlier dangers with later mass death in war and shipwreck,
    noting that ship-sailing was unknown in the ancient period.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:18
  text: Lack of food killed people in the earlier period, while later abundance is
    said to overwhelm; accidental self-poisoning is contrasted with deliberate poisoning
    of others.
  category: sequence
  evidence_refs:
  - ev:17
