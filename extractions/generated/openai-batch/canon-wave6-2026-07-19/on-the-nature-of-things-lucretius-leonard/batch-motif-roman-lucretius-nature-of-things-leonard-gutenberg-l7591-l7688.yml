canonical_text:
  quote: "“But Centaurs ne'er have been, nor can there be / Creatures of twofold stock
    and double frame”"
  summary: The passage explains that animal stocks survive by capacities such as valor,
    cunning, speed, or usefulness to humans, while unfit stocks perish. It then rejects
    Centaurs, Scyllas, Chimaera, and similar heterogeneous hybrid creatures as impossible
    because their parts would not share growth, vigor, desire, habits, foods, or vulnerability
    to fire. It concludes that even in the young earth, kinds could not be grafted
    together but conserve their own natural distinctions.
  language: English
  quote_policy: quoted
