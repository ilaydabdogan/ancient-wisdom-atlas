canonical_text:
  quote: ''
  summary: The passage argues that human names and speech arose from nature, need,
    and use rather than from a single original name-giver. It supports this by comparing
    early human speech to children’s gestures and to animals’ instinctive powers and
    varied cries in different moods or situations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nature is said to urge humans to utter varied sounds, while need and use shape
    the names of things.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young children without speech are described as pointing with the finger at
    things before them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each creature is said to feel by instinct how to use its powers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bull-calves, panther whelps, lion cubs, and fledgling birds are presented
    as using horns, claws, bites, paws, or wings before those powers are fully developed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage rejects the idea that one man assigned names to things and taught
    the first nomenclature to others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The human race is described as having voice and tongue and using different
    words to denote objects as prompted by different senses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Herds and wild beasts are said to produce different sounds when experiencing
    fear, pain, or joy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Molossian hounds are described as making different sounds when threatening,
    barking, fondling puppies, staying alone in the house, or slinking from blows.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The horse’s neighing is said to differ when the stud is aroused among mares,
    when he calls to battle, and when his limbs quake with terror.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Birds such as hawks, ospreys, sea-gulls, crows, and rooks are described as
    changing their cries according to feeding, fighting, prey-struggle, or weather
    contexts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage concludes that, if different moods compel animals to send forth
    different sounds, early mortal men could likewise denote separate things with
    different sounds.
  category: speech
  evidence_refs:
  - ev:8
