canonical_text:
  quote: ''
  summary: 'The speaker argues that the gods are too subtle and remote to dwell in
    the mundane world or act upon human affairs. He rejects the claim that gods made
    the world for humans, proposes instead that primordial seeds combine through natural
    motion, and points to the world''s faults: inhospitable regions, agricultural
    toil, crop-destroying weather, hostile beasts, disease, death, and the helplessness
    of human infants compared with animals.'
  language: English
  quote_policy: summarized
