  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that many primal germs must be stirred before the seeds of
    soul intermingled through the frame feel that body primordials have been struck.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage describes mind as keeper of the gates and as having more dominion
    over life than soul.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that without intellect and mind no part of soul can remain
    in the frame for even the least time, but goes with mind into the winds and leaves
