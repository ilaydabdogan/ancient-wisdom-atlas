canonical_text:
  quote: ''
  summary: The passage argues about bodily sensation, soul, and mind. It rejects the
    idea that eyes are merely doors through which the mind looks, disputes a reported
    Democritean arrangement of body and mind primordials, explains why very slight
    contacts are not always felt, and states that mind has greater dominion over life
    than soul, ending with the claim that soul and mind are bound together.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents and rejects the claim that the body does not feel and
    that soul alone, mixed through the body, takes on the motion called sense.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that when soul is parted, the body is without sense, but
    describes this as the body losing something that was not its own.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage rejects the description of eyes as doors through which the mind
    looks out.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that eyes can be hampered by bright light and that this
    would not happen if eyes were mere doorways.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage instructs the reader not to adopt Democritus' proposition that
    body and mind primordials alternate and interweave the fabric of the members.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that soul-elements are smaller, fewer, and more sparsely
    scattered through the frame than the elements composing the body and inward parts.
