canonical_text:
  quote: ''
  summary: The speaker examines Anaxagoras' doctrine of homeomeria, rejects its denial
    of void and infinite divisibility, argues against the idea that every thing contains
    miniature like-parts of itself, uses examples involving food, earth, wood, blood,
    milk, and fire, and concludes that common seeds combine in different arrangements
    and motions to produce different visible bodies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker announces scrutiny of the homeomeria of Anaxagoras, a Greek term
    for which he says Italian has no name.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anaxagoras is described as thinking that bones arise from minute bones, flesh
    from minute flesh, blood from drops of blood, gold from grains of gold, earth
    from bits of earth, fire from fires, and water from waters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anaxagoras is said to concede no void in things and no limit to the cutting
    down of bodies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker says that if primordial germs have the same nature as visible
    things, they travail and perish equally with those things.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker appeals to earlier proofs that things cannot fall back to nothing
    or increase from nothing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Food is said to augment and nourish the human frame, while veins, blood, bones,
    and sinews are argued to be formed from particles unlike them in kind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker argues that if plants already exist within earth, or if flame,
    smoke, and ash already exist unseen within wood, then earth and wood would have
    to be compounds of alien substances.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Anaxagoras is said to hold that all things lurk commixed with all things,
    while only the most numerous and foremost bodies come into view.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker says that, if the doctrine were true, crushed grains should show
    blood, rubbed rocks should yield gory ooze, herbs should give drops of sweet milk,
    crumbled clods should reveal herbs, grains, and leaves, and cloven wood should
    reveal hidden ashes, smoke, and fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker states that fact teaches these expected signs do not occur, and
    instead says common seeds are commixed in many ways within things.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: An addressed objector says that on high hills neighboring tree tops may be
    rubbed together by the south wind until they blaze with flame.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The speaker replies that fire is not ingrafted in wood; rather, seeds of heat
    flow together through rubbing and start forest conflagrations.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The speaker says that if already fashioned flame were stored in forests, fires
    could not remain unseen and would burn the wildwood.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The speaker explains that the positions and motions of primal germs determine
    how the same germs can produce both fiery and wooden objects.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The speaker compares the alteration of primal germs to the way words are made
    by altering their elements, distinguishing the words for fiery and wooden.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The speaker says that if visible objects require matter of like nature, the
    germs of things would perish and are personified as laughing like men or moistening
    cheeks with tears.
  category: speech
  evidence_refs:
  - ev:9
