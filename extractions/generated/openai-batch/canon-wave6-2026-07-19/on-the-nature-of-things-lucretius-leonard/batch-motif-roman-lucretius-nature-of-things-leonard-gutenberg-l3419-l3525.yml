canonical_text:
  quote: ''
  summary: The speaker explains that mind and soul are composed of commingled subtle
    elements, including wind, warmth, air, and an unnamed fourth essence. He relates
    heat, wind, and air to rage, fear, and tranquility, illustrates these temperaments
    through lions, stags, oxen, and human differences, and argues that body and soul
    are born, live, sense, and perish conjointly rather than separably.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he is constrained by his country's limited speech while trying
    to describe how the components are commixed and function together.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Primordials are described as working together like many powers in one body,
    unable to act if sundered from one another by space.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wind, warmth, air, and an unnamed fourth essence are described as commingled
    into one nature that produces sense-bearing motion in the vitals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The unnamed fourth essence is described as hidden deeply in the body, as the
    soul of all the soul, and as holding dominion over the body.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Heat is associated with rage and fire flashing from the eyes; wind is associated
    with dread and shuddering; air is associated with a tranquil breast and serene
    face.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lions are described as having more heat and as roaring with wrath; stags as
    having more wind and trembling with icy currents; oxen as living more by tranquil
    air and occupying a middle place between lions and stags.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Human beings are said to retain vestiges of each mind's nature despite training,
    producing differences in wrath, fear, and patience.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker says reason cannot entirely expel natural vestiges, but they are
    slight enough that a person can live a life worthy of the gods.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Soul is described as kept by the body, as the body's guard and source of well-being,
    with body and soul cleaving together by common roots.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage compares separating mind and soul from body to tearing fragrance
    from frankincense, which destroys the nature involved.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Body and soul are said to be intertwined from birth and endowed conjointly
    with a partner-life; sensation requires mutual motions of both.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says the body alone is not begotten, does not grow, and is not
    seen to endure after death; the deserted frame moulders away when soul is dissevered.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The body and soul are said to learn vital motions together from earliest age,
    even while buried in the mother's womb, and cannot be dissevered without harm.
  category: sequence
  evidence_refs:
  - ev:11
