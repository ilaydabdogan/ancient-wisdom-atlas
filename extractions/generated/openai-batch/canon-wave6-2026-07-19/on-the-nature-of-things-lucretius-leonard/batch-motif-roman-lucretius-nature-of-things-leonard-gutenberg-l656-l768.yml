canonical_text:
  quote: '"First since we know a twofold nature exists... Body, and place in which
    all things go on"'
  summary: The passage argues that all bodies are either primal germs or unions made
    from them. It distinguishes body from void/place, describes primal bodies as solid
    and voidless, and argues that such bodies must be eternal because generated things
    dissolve into them rather than into nothing. It also uses seasonal renewal and
    the persistence of forms as evidence for a fixed limit to material division.
  language: English
  quote_policy: quoted
