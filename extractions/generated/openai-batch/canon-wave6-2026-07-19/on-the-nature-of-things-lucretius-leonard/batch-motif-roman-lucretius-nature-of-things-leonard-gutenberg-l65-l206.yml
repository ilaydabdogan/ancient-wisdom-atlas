canonical_text:
  quote: ''
  summary: The speaker invokes Venus as generative mother and asks her to aid a poem
    on Nature, charm the words, and secure Roman peace by subduing Mars. The passage
    then describes humanity oppressed by personified Religion until a Greek thinker
    boldly crosses the boundaries of Nature and reports natural laws. The speaker
    promises to render Greek discoveries in Latin and explain atoms as the primal
    bodies of things. To argue that religion causes impiety, the speaker recounts
    the killing of Agamemnon's daughter at Aulis as a sacrifice for favorable winds
    to Troy.
  language: English
  quote_policy: summarized
