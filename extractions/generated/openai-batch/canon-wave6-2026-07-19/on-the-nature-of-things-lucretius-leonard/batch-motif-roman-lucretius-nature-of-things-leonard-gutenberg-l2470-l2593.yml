canonical_text:
  quote: ''
  summary: The speaker instructs an addressee that atoms or primordials do not possess
    color. Visible colors arise from atomic shapes, arrangements, motions, sensory
    impacts, and light. Examples include touch without color, the changing color of
    the ocean, iridescent birds, and hypothetical ravens or swans with altered colors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses an addressee and presents the teaching as wisdom sought
    by toil.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says white, black, or otherwise hued objects are not made from
    atoms of the same color, because bodies of matter possess no hue.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: People born blind are said to recognize things by touch, although those things
    have never had hue for them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Things touched in the dark are not found to be colored by the act of touch.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says every color changes, while the primordials should not change;
    an immutable something must remain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says uncolored seeds have variable forms, and colors arise from
    which seeds are joined, their positions, and the motions they give and receive.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ocean is described as changing from black to hoary marble-white waves
    when high winds upheave it and its matter is rearranged.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says colors cannot exist without light, and that primordials do
    not come forth into light.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The down on doves' necks and throats is described as appearing gold-bronze,
    then green-emerald blended with coral-red, depending on the light.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The peacock's tail is described as changing colors when it turns in copious
    light.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The pupil of the eye is said to receive different kinds of impact when perceiving
    different colors, while touch depends on shape rather than color.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker gives hypothetical examples in which ravens might shine white
    or swans might become black or any other dye if primal formations carried all
    colors.
  category: speech
  evidence_refs:
  - ev:7
