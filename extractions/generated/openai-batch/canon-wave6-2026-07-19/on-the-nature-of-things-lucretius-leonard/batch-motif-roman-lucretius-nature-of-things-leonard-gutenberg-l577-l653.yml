  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Inseparable properties are illustrated by weight in rocks, heat in fire, flow
    in waters, touch in bodies, and intangibility in void.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Slavery, pauperhood, wealth, freedom, war, concord, and similar things are
