canonical_text:
  quote: ''
  summary: The passage gives a natural-philosophical explanation of meteorological
    phenomena and earthquakes. It describes the under-earth as containing windy caverns,
    pools, abysses, cliffs, and hidden rivers; earthquakes arise when caves collapse,
    mountains or soil fall, waters oscillate, or subterranean winds press, turn, or
    burst through the earth. The passage cites ruined or sunken cities and describes
    human fear that roofs will fall, the ground will open, and the world itself will
    collapse into wreckage.
  language: English
  quote_policy: summarized
