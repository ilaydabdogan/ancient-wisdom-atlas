canonical_text:
  quote: |-
    The source of seeing is in images,
         Nor without these can anything be viewed.
  summary: The passage explains perception as the result of continual emanations from
    things, especially subtle images or films that strike the eyes, move intervening
    air, allow distance judgment, and account for mirror appearances.
