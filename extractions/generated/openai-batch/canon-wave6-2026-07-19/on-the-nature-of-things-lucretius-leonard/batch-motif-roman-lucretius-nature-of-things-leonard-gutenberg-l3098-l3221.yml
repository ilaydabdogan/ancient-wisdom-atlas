canonical_text:
  quote: ''
  summary: The speaker opens Book III by praising a Greek truth-finder as a torch-bearing
    father and teacher. The teacher's account of nature makes mental terrors flee
    and opens a vision of the void, the movements of the universe, and the calm abodes
    of the gods, while the vaults of Acheron no longer appear. The speaker then announces
    a treatment of mind and soul meant to drive out fear of Acheron. He argues that
    fear of death motivates ritual offerings to gods below, ambition, greed, violence,
    envy, self-destruction, and betrayal. The passage ends by comparing adult fears
    in daylight to children's fears in darkness and saying that only nature's aspect
    and law dispel mental darkness.
  language: English
  quote_policy: summarized
