canonical_text:
  quote: ''
  summary: 'The speaker addresses Memmius and argues that thunderbolts should be understood
    through their natural causes rather than through Etrurian oracular scrolls or
    divine portents. He challenges the idea that Jupiter and other gods deliberately
    hurl lightning by asking why bolts strike innocents, wastes, mountains, the sea,
    and sacred images. The passage then explains the phenomena called by the Greeks
    “bellows”: a cloud-and-wind column or vortex descending from the sky to the sea,
    endangering ships and producing seething waters, with related whirlwinds sometimes
    occurring on land.'
  language: English
  quote_policy: summarized
