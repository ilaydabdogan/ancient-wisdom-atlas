canonical_text:
  quote: ''
  summary: The speaker explains that atoms move constantly though the visible whole
    can seem still, using distant flocks and armies as analogies. He then argues that
    primordial atoms move through empty void faster than sunlight moves through air.
    The passage closes by rejecting the view that gods made nature, seasons, grains,
    and generation for human beings, promising further explanation of atomic motions.
  language: English
  quote_policy: summarized
