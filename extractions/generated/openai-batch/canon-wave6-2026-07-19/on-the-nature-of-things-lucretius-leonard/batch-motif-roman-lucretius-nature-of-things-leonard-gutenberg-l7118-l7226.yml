canonical_text:
  quote: Now let us sing what makes the stars to move.
  summary: The passage offers several possible physical explanations for the motion
    of the stars and constellations, states caution about deciding the exact cause,
    argues that the apparent sizes of the sun, moon, and celestial fires are close
    to their real sizes, and explains how a seemingly small sun could fill the world
    with light and heat through analogies of springs and sparks.
  language: English
  quote_policy: quoted
