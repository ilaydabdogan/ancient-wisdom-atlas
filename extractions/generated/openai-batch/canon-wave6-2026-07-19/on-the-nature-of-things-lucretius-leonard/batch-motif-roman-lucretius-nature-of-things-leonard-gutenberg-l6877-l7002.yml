canonical_text:
  quote: ''
  summary: 'The passage presents the world as subject to conflict among its major
    elemental members, especially fire or sun against water. It recalls a Greek poetic
    tale of Phaethon and a story of waters overwhelming human life, then gives a naturalizing
    atomic explanation for such apparent victories of fire and water. It then begins
    an account of world formation: primal germs, without counsel or compact, combine
    through long motion, blows, and weight; before the ordered cosmos there was only
    a stormy mixed mass, from which like joined like and the parts of earth, sea,
    heavens, sun, moon, stars, and fiery ether separated.'
  language: English
  quote_policy: summarized
