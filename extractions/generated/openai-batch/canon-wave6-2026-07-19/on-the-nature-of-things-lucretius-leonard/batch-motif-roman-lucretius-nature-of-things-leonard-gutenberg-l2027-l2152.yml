canonical_text:
  quote: Touch is indeed the body's only sense
  summary: 'The passage argues that different sensations and material qualities arise
    from differing shapes and combinations of atoms: smooth and round elements produce
    pleasant or fluid effects, rough, hooked, or pointed elements produce bitterness,
    hardness, piercing, or dispersal, and the possible shapes of primal germs are
    finite rather than infinite.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Honey or milk is said to yield agreeable taste, while wormwood and centaury
    produce foul or bitter flavor.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pleasant sensations are attributed to smooth and rounded elements, while bitter
    or sharp sensations are attributed to crooked elements that enter and rend the
    senses or body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage contrasts a squeaking saw with music on strings, burning cadavers
    with saffron and altar fragrance, and pleasing hues with tear-producing or gruesome
    sights.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some elements are described as neither wholly smooth nor wholly hooked, but
    slightly angled so that they tickle rather than wound; wine tartar and elecampane
    are given as examples.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Glowing fire and icy rime are both said to sting the body's sense through
    unlike teeth, and touch is described as the body's only sense.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bodily sensation is described as arising from outward contact, something born
    within the body, passage along procreative paths, or disordered collision of seeds
    in the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hardened and condensed things are said to be formed from more hooked and branch-like
    atoms, with diamond, flint, iron, and brazen bars given as examples.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Liquid things are said to be formed from smoother and rounder elements whose
    globules do not cohere; poppy seeds rolling from the hand are compared with drinking
    water.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ocean brine is explained as fluid because its atoms are smooth and round,
    yet bitter because painful rough atoms are mixed with them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sweet water is said to become separated from brine by filtering underground
    into a hollow, leaving rough briny germs above because they cling more readily
    in earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Smoke, cloud, and flame disperse instantly and are said not to be co-linked
    with intertwined atoms, but to come from pointed elements that can pierce the
    body and bore rocks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that primal germs vary in shape, but only in a finite number
    of shapes; infinite shape-difference would require some seeds to have immeasurable
    size.
  category: attribute
  evidence_refs:
  - ev:8
