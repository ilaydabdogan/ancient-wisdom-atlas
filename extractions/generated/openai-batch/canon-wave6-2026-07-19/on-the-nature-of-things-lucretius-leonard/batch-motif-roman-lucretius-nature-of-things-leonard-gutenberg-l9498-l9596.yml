canonical_text:
  quote: ''
  summary: 'The passage explains several striking natural phenomena: volcanic emissions,
    the need to list multiple possible causes, the summer flooding of the Nile, and
    noxious places where birds or animals fall or collapse. It explicitly rejects
    explanations based on Pallas'' wrath or an underworld gate of Orcus, instead attributing
    such wonders to natural law.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water and air from the open sea are described as penetrating deeply, driving
    out flame, boulders, and clouds of sand through openings called bowls, throats,
    and mouths.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says some phenomena should be given several possible causes, only
    one of which will be true, using a lifeless corpse and possible causes of death
    as an example.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nile is said to overflow Egypt in summer, with possible causes including
    Etesian northwinds, sand blocking river mouths, greater rains at the source, and
    snowmelt in Aethiopian mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Birdless spots and tarns are named from their harmful effect on birds, which
    fall headlong when flying over them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A place at Cumae is described where mountains smoke, with pungent sulphur
    and steaming springs.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A place on the Acropolis beside the fane of Tritonian Pallas is said to be
    avoided by crows; the passage says this is not because of Pallas' wrath but because
    of the nature of the place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Syrian spot is reported where four-footed animals collapse after entering,
    as if slaughtered to the under-gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker says these wonders work by natural law and warns against believing
    that such regions are a gate of Orcus or that under-gods draw souls down to the
