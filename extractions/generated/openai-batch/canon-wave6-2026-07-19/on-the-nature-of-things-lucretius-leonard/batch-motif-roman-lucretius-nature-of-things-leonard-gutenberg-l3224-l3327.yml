canonical_text:
  quote: |-
    Mind and soul,
         I say, are held conjoined one with other,
         And form one single nature of themselves;
  summary: The speaker argues that mind and soul are bodily parts of a human being,
    rejects the idea that mind is merely a bodily “harmony,” locates the ruling mind
    in the breast, describes soul as distributed through the body and obedient to
    mind, and uses death, sleep, emotion, and bodily wounds as evidence that mind
    and soul are corporeal.
  language: English
  quote_policy: quoted
