canonical_text:
  quote: ''
  summary: The passage argues that no living kind or cosmic body is unique, extending
    this to earth, sun, moon, ocean, and other worlds. Nature is described as acting
    by herself, free of divine rule, while gods are denied the practical capacity
    to govern the immeasurable cosmos. The passage then explains cosmic and organic
    growth as the addition and separation of seeds or bodies according to their kinds,
    followed by decline when outflow, age, and external blows exceed nourishment.
  language: English
  quote_policy: summarized
