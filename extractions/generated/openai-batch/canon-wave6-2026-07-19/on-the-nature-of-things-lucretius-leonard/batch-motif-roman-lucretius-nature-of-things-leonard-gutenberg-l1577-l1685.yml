canonical_text:
  quote: ''
  summary: The speaker explains that primordial bodies generate and dissolve the world
    through ceaseless motion in boundless void. Matter leaves some things and increases
    others, while generations pass on life. Atoms collide, rebound, combine into dense
    bodies or rare forms, and visible motes in sunbeams serve as an analogy for hidden
    atomic motion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker announces an explanation of the motions by which the begetting
    bodies of world-stuff generate and later dissolve the varied world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Matter is described as not cohering tightly; visible things wane as motes
    leave them and increase other things.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The total sum is said to remain replenished while mortals live by exchange,
    nations wax and wane, and generations pass life onward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The primordial germs of things are said not to stop; they move through void
    by their own weight or by another body's blow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Primordial bodies repeatedly meet, clash, and leap apart because they are
    hard and solid and have no resistance behind them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the whole has no bottom or realm of rest because space
    is unbounded and extends in every direction.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Some atoms rebound with small gaps and form dense things such as rocks and
    iron; others leave large gaps and supply thin air and sunlight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Many other bodies are described as wandering the mighty void, cast back from
    unions and not linked with the motions of the rest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Dust-like motes are visible in sunbeams entering dark halls, moving in many
    ways, contending, meeting, parting, and being driven up and down.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The visible tumbling of motes in light is presented as a sign of secret and
    invisible motions of primal stuff beneath or behind appearances.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Motion is described as beginning from primeval atoms, passing through bodies
    of increasing size, and eventually emerging to human sense in visible sunbeam
    motes.
  category: sequence
  evidence_refs:
  - ev:10
