canonical_text:
  quote: |-
    Of earth--"The Mother!"--since from out the earth
    Are all begotten.
  summary: The passage describes the young earth first producing vegetation, then
    living creatures, including birds, humans, and other animals. Earth is repeatedly
    called Mother, is said to nourish newborn beings with milk-like juice, later ceases
    to bear, and also produces malformed monsters whose increase Nature prevents.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says he returns to the world's primeval age to tell what the young
    fields of earth first raised into light and wind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earth first gives forth grasses, green meadows, shrubs, and trees that shoot
    upward into the air.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Earth is called "The Mother" because all are said to be begotten from out
    of earth; living things are also said to arise from loams through rains and the
    sun's heat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Winged beings and parti-coloured birds are described as hatching in springtime
    and leaving eggs behind; the fields are described as hot and wet when earth gave
    mortal generations to the day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In fitting spots, womb-cavities grow by roots affixed to earth; the young
    within burst the wombs when they seek the air and flee the earth's dampness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nature turns the pores of earth and makes her spurt a milk-like juice from
    open veins; earth furnishes food, warmth is their swaddling cloth, and grass is
    their bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Earth is again called Mother because she begat the human race, mountain-ranging
    creatures, and varied aerial birds.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Earth's bearing years are said to end like those of an aged woman; lapsing
    ages change the nature of the world, and earth can no longer bear some things
    she once bore.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The telluric world is said to have tried to beget monsters and prodigies with
    astounding forms, including the Man-woman, footless forms, handless forms, mouthless
    dumb horrors, blind ones, and bodies shackled by their own limbs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nature prevents these monsters from increasing because they cannot reach maturity,
    find food, or unite reproductively; the passage lists food and reproductive conditions
    as necessary for ongoing generations.
  category: sequence
  evidence_refs:
  - ev:10
