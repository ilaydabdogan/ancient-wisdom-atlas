canonical_text:
  quote: ''
  summary: 'The passage describes a destructive plague in Athens: a disease said to
    come from Egypt through air and sea, strike the Athenian people, produce burning
    heat, bleeding and ulcers, thirst, vomiting, delirium, wasting, mutilating aftereffects,
    memory loss, unburied corpses, animal deaths, and the failure of any universal
    cure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A disease or mortal miasma is said to reduce Cecropian lands to dead men's
    bones, empty highways, and drain the Athenian town of citizens.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disease is described as coming from afar, rising in Egypt, traversing
    air and sea-foam, and swooping upon Pandion's folk.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: People are described as being given over in groups to disease and death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Early symptoms include a burning head, red eyes, blackened bloody throat,
    ulcers in the passage of the voice, and a tongue trickling gore.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The destructive influence is said to move through throat, breast, and heart;
    the breath smells foul like unburied rotting bodies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sick suffer weakness of body and mind, anguish, groaning, and recurrent
    vomiting spasms.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The skin is warm and red with ulcers, while the inner parts are described
    as blazing to the bones and the stomach as flaming like a furnace.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sick seek coolness, breeze, icy streams, waves, and water-pits; their
    thirst makes even a good shower seem scant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Medicine is depicted as fearful and ineffective while observing sleepless,
    staring eyes called heralds of death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Additional death signs include deranged intellect, dread, delirious face,
    ringing ears, irregular breath, sweat, colored salty spittle, cough, contracting
    hands, shivering, rising cold, sunken eyes, and rigid death around the eighth
    or ninth day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Those who escape immediate destruction may later waste and die from ulcers,
    black belly discharges, fouled blood from the nostrils, or disease moving into
    limbs, joints, and genitals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some survive after removal of the male member, after loss of hands or feet,
    or after losing their eyes.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: Some are seized by oblivion and no longer know themselves.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: Corpses lie piled unburied; birds and beasts flee the stench or die after
    tasting; dogs lie in the streets and die distressfully.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:15
  text: No sure universal cure is found; what helps one person breathe and look at
    the sky may bring death to others.
  category: relationship
  evidence_refs:
  - ev:12
