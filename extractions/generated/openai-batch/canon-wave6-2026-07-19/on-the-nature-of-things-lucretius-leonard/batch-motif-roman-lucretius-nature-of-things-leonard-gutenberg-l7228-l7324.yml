canonical_text:
  quote: ''
  summary: The passage gives multiple possible natural explanations for the motions
    of the sun, moon, and stars; the coming of night and dawn; the formation or renewal
    of solar light; and the fixed recurrence of natural events. It cites Democritus,
    describes air streams and winds as possible movers, names Matuta as spreading
    morning light, reports an Idaean mountain-fire story, and closes with examples
    of fixed seasonal and life-cycle sequences.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that no single sure cause has been revealed for the sun's
    movement between summer and winter turning-points, or for the moon's monthly crossing
    of a distance the sun traverses in a year.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A doctrine is attributed to the holy thought of great Democritus: celestial
    bodies nearer to earth are less carried by the whirl of the sky because the upper
    speed decreases in lower regions.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the sun lies below the blazing starry signs, while the moon
    is lower than the sun and is overtaken by circling starry signs, making the moon
    appear to return to a zodiacal sign more swiftly than the sun.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker proposes that two alternating streams of air from transverse regions
    may thrust the sun from summer signs toward winter goals and then cast it back
    toward hotter zodiacal regions; the moon and stars may likewise be sped by alternate
    air streams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Clouds moved by contrary winds are used as an example when asking whether
    stars in ether might be borne by opposite currents.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Night is described as overwhelming the lands either when the sun has completed
    its daily course and exhausted its fires, or when the force that drove the sun
    above the lands compels it to turn beneath the lands.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Matuta is said to spread roseate morning and deploy light at a fixed hour;
    the passage gives possible explanations involving the returning sun or gathering
    fires and seeds of heat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports a story that from Idaean mountain-tops at daybreak dispersed
    fires are seen to combine into one ball and form an orb.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage lists shrubs budding and casting flowers, teeth dropping with
    age, boys growing beards, and thunderbolts, snow, rains, clouds, and winds as
    events occurring at fixed times or seasons in a fixed sequence from primordial
    causes.
  category: sequence
  evidence_refs:
  - ev:8
