canonical_text:
  quote: ''
  summary: The passage argues that primal bodies or atoms lack secondary qualities
    such as color, sound, smell, taste, heat, and cold. It illustrates this by the
    fading color of shredded dyed linen and by scentless olive oil used as a base
    for perfume. It then argues that living and sensing beings can arise from insensate
    elements, citing worms from dung after rain, food transformed into animal bodies,
    and the importance of atomic size, shape, order, position, mixture, and motion.
  language: English
  quote_policy: summarized
