canonical_text:
  quote: The life of fools is Acheron on earth.
  summary: The passage rejects fear of death by having personified Nature rebuke human
    complaints, compares death to restful completion after a feast, argues that pre-birth
    nonexistence mirrors post-death nonexistence, and reinterprets traditional Acheron/Tartarus
    punishments as conditions of fear, desire, ambition, and conscience in present
    life.
  language: English
  quote_policy: quoted
