canonical_text:
  quote: ''
  summary: The passage gives a natural explanation of heredity, sex, fertility, conception,
    and love. It describes offspring as arising from twofold parental seed, sometimes
    resembling parents or ancestors. It rejects divine withholding as the cause of
    sterility and treats ritual offerings for fertility as vain. It attributes conception
    to seed qualities, diet, bodily posture, and partner compatibility. It concludes
    that love can arise through habit rather than divine arrows, comparing repeated
    habituation to water gradually boring through stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Female and male seed mingle; when one predominates, the offspring resembles
    that parent, while an equal blend produces mixed parental features.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parents are said to retain concealed primal germs from ancestral stock, so
    offspring can resemble grandparents or earlier ancestors in features, voice, and
    hair.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that sex and bodily form do not arise from a single seed,
    because every birth comes from twofold seed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some men are said to think divine powers deny them children; they sprinkle
    altars with blood and burn gifts to make their wives pregnant, but the passage
    calls this vain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sterility is attributed to seed being too thick, too watery, or too thin,
    and to failures of adhesion, emission, entry, or mixture with the woman's seed.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says some men and women conceive more readily with particular
    partners, and previously sterile or childless spouses may have children with more
    concordant mates.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Diet is said to affect seed by thickening it or thinning and wasting it away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The manner of sexual intercourse is said to affect conception; an animal-like
    posture is described as favorable, while certain movements of blandishment can
    deflect seed from its proper place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Courtesans are described as using such movements to avoid pregnancy and childbirth
    while increasing men's pleasure.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A woman of scant grace may become beloved by a man through deeds, complying
    ways, tidy habits, and long habituation, not through divinity or Venus's arrows.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Repeated light blows and drops of water falling on stone are used as examples
    of gradual effect through repeated action.
  category: sequence
  evidence_refs:
  - ev:11
