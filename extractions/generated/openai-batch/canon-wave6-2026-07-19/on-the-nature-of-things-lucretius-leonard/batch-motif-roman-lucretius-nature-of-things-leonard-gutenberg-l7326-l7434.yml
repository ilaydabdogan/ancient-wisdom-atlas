canonical_text:
  quote: ''
  summary: The passage gives alternative natural explanations for the waxing and waning
    of days and nights, the sun's course, the moon's light and phases, and the possible
    repeated creation and destruction of suns or moons. It compares rival lunar explanations
    attributed to Babylonian Chaldees and Greek astrologers, then uses an ordered
    procession of seasons, winds, and personified powers as an analogy for fixed recurring
    phenomena.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Days are said to wax while nights wane, and nights to grow while daylight
    is diminished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One explanation presents the sun as traveling under the lands and over them
    in unequal arcs through the Zodiac, producing unequal periods of light and night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men who use diagrams are described as having charted the adorned regions and
    arranged signs of the Zodiac.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another explanation says dense air under the lands delays bright beams of
    fire, causing winter nights to linger before the sun rises.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another explanation says fires stream together at different speeds in alternating
    seasons and make the sun rise in one place; those who hold that a new sun is born
    at each daybreak are mentioned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The moon may shine because struck by the sun's rays, showing more light as
    she recedes from the sun and hiding it as she approaches the sun along the Zodiac.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Alternative lunar explanations include the moon having her own light, a dark
    invisible body blocking her disk, and the moon rotating as a half-bright sphere.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: A Babylonian doctrine of Chaldees is described as opposing and refuting the
    art of Greek astrologers, while the narrator says rival explanations might both
    be true.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage proposes that a new moon might be created in fixed shapes and
    later perish, with another moon engendered in its place.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:10
  text: 'A fixed sequence of seasonal figures and winds is listed: Spring-time and
    Venus, Venus'' winged boy, Mother Flora, Heat with Ceres and Etesian Breezes,
    Autumn with Bacchus, Volturnus, Southwind, Shortest-Day, and Winter.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage ends by introducing eclipses of the sun and occultations of the
    moon without developing the explanation within the supplied excerpt.
  category: other
  evidence_refs:
  - ev:9
