canonical_text:
  quote: Nature, reserving them as seeds for things, / Permitteth naught of rupture
    or decrease.
  summary: The passage argues that soft perceptible things can be explained by void
    within bodies, while the primal bodies themselves must be solid, immutable, indivisible,
    and eternal. Fixed species traits, the persistence of generative properties, and
    the rejection of limitless division are used to support the existence of minimum
    parts and solid primal germs.
  language: English
  quote_policy: quoted
