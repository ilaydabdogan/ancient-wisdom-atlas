  quote: "“He made a temple in his home-field”"
  summary: Jorunn advises Hoskuld to make an honourable settlement with his brother
    Hrut. Mediators carry peace terms, Hrut accepts reconciliation, and the brothers
    live in good brotherhood. Hrut later becomes a powerful household head, moves
    to Hrutstead, builds a temple in his home-field, marries several women, has many
    children, and is remembered as great when he rides to the Thing with fourteen
    sons.
