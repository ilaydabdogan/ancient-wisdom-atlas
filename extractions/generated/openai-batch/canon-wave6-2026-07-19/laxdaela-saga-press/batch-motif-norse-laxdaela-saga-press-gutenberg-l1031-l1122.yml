canonical_text:
  quote: ''
  summary: Vigdis directs Asgaut to move Thorolf from an unsafe hiding place and promises
    Asgaut freedom and money. Thorolf and Asgaut flee, are caught between Ingjald
    and the swollen Salmon River, choose the river, and cross despite ice and danger.
    Ingjald refuses to pursue across the river. Thorolf reaches Sheepfell, where Thorolf
    Rednose accepts him under Vigdis's tokens. Ingjald returns to Goddistead, demands
    his money back from Thord, and is publicly shamed by Vigdis, who strikes him with
    the purse and sends him away.
  language: English
  quote_policy: summarized
