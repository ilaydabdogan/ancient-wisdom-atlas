canonical_text:
  quote: ''
  summary: The passage describes Hoskuld's sons Thorliek and Bard, Bard's marriage
    and descendants, Hrut's freeing and settlement of Hrolf near a disputed boundary,
    Hoskuld's demand for payment, Thorliek's killing of Hrolf and seizure of his wealth,
    the resulting legal assessment, and the later building of Combness and naming
    of Bolli by water-sprinkling.
  language: English
  quote_policy: summarized
