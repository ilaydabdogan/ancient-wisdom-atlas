- id: obs:3
  text: Bard married Astrid, a Broadfirth woman of good stock; their children were
    Thorarin and Gudney, and Gudney married Hall, son of Fight Styr.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hrut Herjolf's son freed his thrall Hrolf and gave him money and a dwelling-place
    near the boundary with Hoskuld's land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hrut's people made a boundary mistake and settled Hrolf on land belonging
