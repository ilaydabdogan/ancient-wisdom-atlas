canonical_text:
  quote: ''
  summary: Gudrun summons her sons to an orchard and shows them blood-stained linen
    clothing as a reminder of their father's killing and a call for revenge. The brothers,
    unable to sleep afterward, decide they must seek vengeance. Gudrun negotiates
    with Thorgils, who agrees to lead the raid against Helgi Hardbienson if Gudrun
    will marry him after the revenge is carried out. Gudrun gives a carefully worded
    promise before witnesses, which Thorgils accepts without seeing through it. Thorgils,
    Gudrun's sons, and others prepare to ride out toward the Dales.
  language: English
  quote_policy: summarized
