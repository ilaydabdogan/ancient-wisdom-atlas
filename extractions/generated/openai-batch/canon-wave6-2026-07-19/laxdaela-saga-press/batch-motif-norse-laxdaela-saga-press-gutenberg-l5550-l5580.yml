canonical_text:
  quote: ''
  summary: Osvif dies and is buried at Holyfell, where Gudrun has built a church.
    Gest Oddliefson, foreseeing that his illness will end his life, asks his son Thord
    to carry his body to Holyfell because he considers it the greatest place nearby
    and has seen a burning light there. Ice blocks Broadfirth, but a gale clears the
    ice long enough for Thord to transport Gest's body by ship to Holyfell, where
    Gest is buried in the same grave as Osvif. The ice returns afterward, and people
    regard the timing as marvelous.
  language: English
  quote_policy: summarized
