canonical_text:
  quote: ''
  summary: Thorkell tells Gudrun a dream of his beard spreading over Broadfirth. He
    reads it as a sign of wide power, while Gudrun suggests it foretells his beard
    being dipped into Broadfirth. Thorkell sails to Norway with his son Gellir to
    obtain timber for a church, receives honors and gifts from King Olaf, measures
    the timber of Olaf's church, rejects the king's request to shorten his main beams,
    and hears the king warn that the timber may never be used. Thorkell returns to
    Iceland with honor, stores the church timber, holds a lavish Yule feast, and distributes
    precious goods.
  language: English
  quote_policy: summarized
