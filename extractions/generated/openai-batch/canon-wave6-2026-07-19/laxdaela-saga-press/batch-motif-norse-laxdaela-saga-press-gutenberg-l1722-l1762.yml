canonical_text:
  quote: ''
  summary: Olaf meets Melkorka's foster-mother, gives her a knife and belt that she
    recognizes, and she rejoices at news of Melkorka. During the winter Olaf serves
    with the king, who consults him and praises his wisdom and prowess. At a Thing
    the king publicly identifies Olaf as his daughter's son and offers him the kingdom
    after his death. Olaf declines, saying he wishes to go to Norway and return to
    his mother. The king gives Olaf rich weapons and money, and Olaf sails to Norway
    and goes to find King Harald.
  language: English
