canonical_text:
  quote: ''
  summary: Thorhalla asks Kjartan to collect promised homespun from her kinsman while
    he travels west. Kjartan agrees, Thorarin joins the journey, and they ride to
    Hol, where Kjartan is warmly received. Thorhalla returns to Laugar and reports
    the meeting to the sons of Osvif, adding remarks about Kjartan’s bold appearance
    and land bargain. Gudrun and others speak sharply about Kjartan, while Bolli remains
    silent or avoids joining in criticism.
  language: English
  quote_policy: summarized
