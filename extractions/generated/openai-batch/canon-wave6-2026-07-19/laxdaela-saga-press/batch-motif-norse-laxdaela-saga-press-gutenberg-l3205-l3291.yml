canonical_text:
  quote: '"I have set my mind on going abroad"'
  summary: The passage introduces Asgeir Eider-drake's family, then follows Kjartan
    Olafson as he arranges to buy a share in Kalf Asgeirson's ship and leave Iceland.
    Bolli and other Icelanders accompany him. Gudrun objects to the sudden journey
    and asks to go with him, but Kjartan refuses and asks her to wait. Kjartan sails
    to Norway, where King Olaf Tryggvason has come to power, is pressing a change
    of faith, and has forbidden Icelandic ships to sail because their crews refuse
    the new faith. The Icelanders agree together to continue refusing it.
  language: English
  quote_policy: quoted
