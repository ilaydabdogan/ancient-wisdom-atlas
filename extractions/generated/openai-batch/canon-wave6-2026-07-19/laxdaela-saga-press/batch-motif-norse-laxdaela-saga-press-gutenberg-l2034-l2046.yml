  quote: ''
  summary: After a confrontation in which a spear shaft breaks and Hrapp disappears,
    Olaf and a house-carle return home. The next morning Olaf has Hrapp dug up, finds
    the body undecayed along with the spear-head, has Hrapp burned on a pyre, and
    has the ashes thrown into the sea. After this, Hrapp's ghost causes no further
    trouble.
