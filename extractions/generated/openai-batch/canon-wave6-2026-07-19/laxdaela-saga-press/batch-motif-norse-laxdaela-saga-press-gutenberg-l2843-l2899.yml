canonical_text:
  quote: ''
  summary: After earlier harm attributed to Kotkell's household, Gudrun grieves while
    near childbirth, bears a son named Thord after water-sprinkling, and accepts Snorri
    the Priest's offer to foster him. Gest Oddleifson pressures Hallstein to send
    away the accused wizards. Kotkell and his household leave with four stud-horses,
    negotiate with Thorliek for shelter in exchange for the horses, and receive a
    dwelling and stock. Osvif counsels against immediate attack, predicts that Kotkell's
    new neighbors and Thorliek will suffer from them, and sets a three-winter limit
    before further action.
  language: English
  quote_policy: summarized
