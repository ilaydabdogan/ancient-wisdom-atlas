canonical_text:
  quote: ''
  summary: The passage introduces Thorgils Hallason, his kin, character, dealings
    with Gudrun, and his instruction of Thorleik in law. It then turns to Thorkell
    Eyjolfson, the outlaw Grim, and Thorkell's decision to seek Grim alone. Thorkell
    visits Eid of Ridge, borrows the sword Skofnung, hears its handling taboos and
    healing condition, and rides toward Grim's suspected lair, where he sees a hut
    near water.
  language: English
  quote_policy: summarized
