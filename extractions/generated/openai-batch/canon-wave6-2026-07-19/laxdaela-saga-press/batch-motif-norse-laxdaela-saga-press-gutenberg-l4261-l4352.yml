canonical_text:
  quote: '"Do you think, fool as you are, you will ever give life to a man to whom
    fate has ordained death?"'
  summary: Kjartan rides with An the Black and Thorarin into an ambush. Witnesses
    see both parties but do not intervene. Kjartan fights the ambushers, wounds several
    opponents, and remains largely unwounded until Bolli is pressured to join the
    attack. Kjartan refuses to fight Bolli, throws away his weapons, and is killed
    by him. Bolli immediately regrets the killing, while Gudrun later comments on
    it approvingly in comparison with her own domestic work.
  language: English
  quote_policy: quoted
