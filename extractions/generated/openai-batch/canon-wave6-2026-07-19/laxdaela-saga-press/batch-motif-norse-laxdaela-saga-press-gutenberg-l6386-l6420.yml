canonical_text:
  quote: ''
  summary: Bolli Bollison returns to Iceland after four winters, arriving by ship
    with wealth and precious gifts from lords abroad. He displays scarlet, fur, gold-adorned
    weapons, a gilded helmet, and a red shield with a gold knight, rides west with
    twelve similarly splendid followers, visits Gudrun at Holyfell, then Snorri and
    Thordis at Saelingsdale Tongue, stays through the winter, and gains great renown
    from the journey.
  language: English
  quote_policy: summarized
