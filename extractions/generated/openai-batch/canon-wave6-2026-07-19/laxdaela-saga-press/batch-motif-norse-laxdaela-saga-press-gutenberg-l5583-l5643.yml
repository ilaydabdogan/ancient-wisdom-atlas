canonical_text:
  quote: ''
  summary: Audgisl seeks help from Snorri after Thorgils takes the chieftainship from
    him and his father. Snorri speaks cautiously about Thorgils and gives Audgisl
    an inlaid axe. At the Thing, Thorgils receives a warning from a large woman, then
    a blue hooded cloak is heard speaking. During payment of atonement money, Audgisl
    kills Thorgils by decapitation; the head is thought to continue the count. Halldor
    kills Audgisl, and the killing is later atoned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thorarin is described as a chieftain at Longdale, Audgisl as his son, and
    Thorgils Hallason as having taken the chieftainship from both of them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Audgisl goes to Snorri Godi, reports the unfairness, asks for help, and receives
    from Snorri both cautious words about Thorgils and an inlaid axe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thorgils Hallason and Thorstein the Black make terms of peace with Helgi's
    sons and other kinsmen; Thorstein is to pay two parts of the atonement and Thorgils
    one part at the Thing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the lava field by Thingvellir, Thorgils and his men see a mighty big woman
    coming to meet them; she turns aside and warns him to take care, go forward warily,
    and beware Snorri's wiles.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thorgils remarks to the woman that it has seldom happened, when luck was with
    him, that she was leaving the Thing while he was riding to it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: During the Thing, Thorgils's blue hooded cloak is hung wet on the booth wall,
    and people hear it speak a stanza about knowing a trick.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: When Thorgils counts out payment money and reaches ten, Audgisl strikes him;
    those present think they hear the severed head say eleven as it flies from the
    neck.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After killing Thorgils, Audgisl runs to the booth of the Waterfirthers; Halldor
    follows and kills him in the doorway.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When told that Thorgils has been slain, Snorri first says the report must
    be mistaken and that Thorgils must have slain someone; after hearing that the
    head flew off the trunk, he says perhaps it is time.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that the manslaughter was peacefully atoned.
  category: action
  evidence_refs:
  - ev:7
