canonical_text:
  quote: ''
  summary: At a leet, Thorgils pressures Thorstein the Black and Lambi, both implicated
    in Bolli’s killing, to join the sons of Bolli in a revenge journey against Helgi
    Hardbienson. Thorstein first resists because Helgi is his brother-in-law, and
    Lambi calls the demand a bad price of peace, but both accept under threat and
    on condition that the sons of Olaf be left in peace. They agree to meet at Tongue
    on the third day and arrive before sunrise.
  language: English
  quote_policy: summarized
