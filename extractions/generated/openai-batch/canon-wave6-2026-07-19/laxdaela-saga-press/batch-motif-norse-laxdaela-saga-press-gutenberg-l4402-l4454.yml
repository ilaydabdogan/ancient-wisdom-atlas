canonical_text:
  quote: ''
  summary: After Kjartan's killing, Olaf organizes messages and a blood-suit, brings
    Kjartan's body home, protects Bolli from possible retaliation, and directs a mediated
    peace settlement. Hrefna later goes north in grief, does not remarry, and is said
    to die of a broken heart.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Olaf sent messages to Thorstein Egilson and to northern allies seeking help
    for the blood-suit over Kjartan's killing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Olaf charged as guilty the men who had taken part in the ambush, except Ospak,
    son of Osvif, who was already under outlawry, and set the blood-suit for Thorness
    Thing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kjartan's body was brought home, and a tent was raised over it because no
    church had yet been built in the Dales.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Olaf gathered a large force from the Dales and sent it to Laugar with orders
    to guard Bolli if needed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thorstein and the Willowdale men arrived angry; Hall Gudmund's son and Kalf
    Asgeirson urged a forceful move against Bolli to search for the sons of Osvif.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Because Olaf opposed a raid on Laugar, peace messages were sent between the
    parties; Bolli accepted Olaf's settlement of terms, and Osvif did not oppose it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A peace meeting occurred at Lea-Shaws; the case was placed in Olaf's hands,
    with fines and penalties to be set by him and announced at Thorness Thing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: By Olaf's counsel, Bolli did not attend the peace meeting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Thorstein Kuggison asked to foster Asgeir, son of Kjartan, as a comfort to
    Hrefna.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hrefna went north with her brothers, was weighed down with grief, but bore
    her sorrow with dignity and spoke easily with people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hrefna took no other husband after Kjartan, lived only a short time after
    going north, and was said to have died of a broken heart.
  category: sequence
  evidence_refs:
  - ev:8
