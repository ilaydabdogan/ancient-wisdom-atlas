canonical_text:
  quote: ''
  summary: Ingibjorg gives Kjartan a costly coif as a bridal gift and says farewell.
    Kjartan and Ingibjorg embrace and are said to take their parting hard. Kjartan
    tells the king he is ready to leave. The king escorts him to his ship, gives him
    an ornamented sword, says it should always be with him and that he will not be
    weapon-bitten if he bears it, advises him to keep his faith well, and parts from
    him in friendship. Kjartan boards the ship, and the king remarks on Kjartan’s
    worth and the difficulty of coping with his fate.
  language: English
