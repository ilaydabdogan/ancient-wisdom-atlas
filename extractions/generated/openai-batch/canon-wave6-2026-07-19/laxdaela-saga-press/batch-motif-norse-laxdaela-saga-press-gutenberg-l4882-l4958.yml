canonical_text:
  quote: ''
  summary: Thorkell finds Grim fishing by water near a hut, attacks him, and is overcome
    in a wrestling struggle. Grim spares Thorkell, saying another fate is ordained
    for him. Thorkell treats Grim’s wound with Skofnung’s-stone. They travel to Snorri,
    who counsels Thorkell about abandoning trade journeys, marrying Gudrun, and going
    abroad once more. Thorkell takes Grim to Norway, gives him merchandise, and parts
    from him in peace; Grim settles in the Wick.
  language: English
  quote_policy: summarized
