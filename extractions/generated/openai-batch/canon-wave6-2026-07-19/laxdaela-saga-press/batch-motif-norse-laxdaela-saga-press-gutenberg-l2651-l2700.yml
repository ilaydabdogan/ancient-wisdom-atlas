canonical_text:
  quote: ''
  summary: Thorvald, a wealthy man of Garpsdale, woos the fifteen-year-old Gudrun
    at the Thing. Osvif arranges the marriage contract without asking Gudrun; the
    contract gives Gudrun control over money affairs, half the wealth, and jewels.
    Gudrun dislikes the marriage, demands costly finery, and is struck by Thorvald
    after asking for a gift. She tells Thord, who advises a shirt with a large neck-hole
    as a reason for separation. Gudrun separates from Thorvald, returns to Laugar,
    and receives half the wealth. The passage then notes Ingun's sale of land and
    briefly describes Hallstein the Priest.
  language: English
  quote_policy: summarized
