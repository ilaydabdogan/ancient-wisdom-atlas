canonical_text:
  quote: ''
  summary: King Olaf pressures Kjartan to either go to Iceland to advance Christianity
    or remain in Norway; Kjartan stays. Olaf sends Thangbrand to Iceland, where preaching,
    punishments, killings, conversions, and resistance occur. After further conflict
    and outlawry, Gizor and Hjalti come to Norway and later are sent back to preach,
    while Olaf restricts ships and keeps several Icelanders as hostages. Bolli prepares
    to return to Iceland and speaks with Kjartan about his detention and his attention
    to Ingibjorg, the king’s sister.
  language: English
  quote_policy: summarized
