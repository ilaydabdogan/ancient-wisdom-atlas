canonical_text:
  quote: ''
  summary: After Olaf Hoskuldson's death, Thorgerd travels with her sons to the homestead
    called Tongue, identifies it as Bolli's dwelling, and rebukes her sons for not
    avenging their brother Kjartan. Halldor answers briefly but becomes angry toward
    Bolli. Later Halldor and his brothers ride to the Thing, meet their nephew Bardi
    Gudmundson, invite him home, and Bardi stays with them at Herdholt for the rest
    of the summer.
  language: English
  quote_policy: summarized
