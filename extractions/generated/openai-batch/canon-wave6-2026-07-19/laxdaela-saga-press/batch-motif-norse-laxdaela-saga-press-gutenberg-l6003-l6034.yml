  quote: '"I have long had it in my mind to go for once into southern lands"'
  summary: After a settlement and the breaking up of the Thing, Bolli declares his
    intent to leave Iceland. Snorri tries to dissuade him by offering a stocked manor,
    chieftainship, honour, and money, but Bolli says a man is benighted if he knows
    only Iceland. Bolli buys half of a ship so that he and Thorleik are joint owners.
    The passage also notes Herdis, daughter of Bolli and Thordis, being taken by Gudrun
    to be brought up at Holyfell.
