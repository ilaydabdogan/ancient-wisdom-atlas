canonical_text:
  quote: ''
  summary: Hoskuld falls ill in old age, summons his sons and kinsfolk, and tries
    to secure a share for his son Olaf, who was not born in wedlock. Bard agrees,
    while Thorliek resists. Hoskuld gives Olaf a gold ring and a sword, together with
    his own and the family's luck. Hoskuld dies; his sons make him a cairn and discuss
    postponing the burial feast until the next summer Thing. The brothers divide property,
    and Olaf later appears to take the lead at the Thing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hoskuld falls ill in old age, sends for his sons and other kinsfolk, and speaks
    to Bard and Thorliek about his expected death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hoskuld says Bard and Thorliek were begotten in wedlock and are entitled to
    his inheritance, but asks them to allow Olaf, a third son not born in wedlock,
    to be adopted and take one-third of his means with them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bard agrees to do as Hoskuld wishes, while Thorliek objects to Olaf being
    adopted and says he will not freely give up the honour to which he was born.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hoskuld invokes a legal allowance to give twelve ounces to Olaf and mentions
    Olaf's high birth on his mother's side; Thorliek agrees to this.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hoskuld gives Olaf a gold ring described as Hakon's gift and a sword described
