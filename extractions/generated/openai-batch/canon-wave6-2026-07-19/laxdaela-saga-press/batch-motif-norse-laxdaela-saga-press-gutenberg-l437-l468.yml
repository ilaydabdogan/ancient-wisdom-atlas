  summary: In Chapter VI, Unn apportions parts of her land-take to followers, names
    grants to Hord, Erp, Sokkolf, and Hundi, explains that her men are being rewarded
    for their service, notes Erp's manumission because of his high birth, and the
    narrator gives several descent lines connected with these figures and Thorstein
    the Red's daughters.
