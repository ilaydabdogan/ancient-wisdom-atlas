canonical_text:
  quote: ''
  summary: Stigandi, an outlaw, is exposed through a bondswoman who secretly meets
    him. She helps Olaf capture him while he sleeps. His head is covered to prevent
    his destructive glance, but he sees a grassy slope through a slit and the land
    is blighted. He is stoned and buried under stones. The passage then recounts Hallbjorn
    Whetstone-eye being washed up by the surf, buried, haunting his burial place,
    appearing during a cow search, wrestling Thorkell Skull, and retreating into the
    earth.
  language: English
  quote_policy: summarized
