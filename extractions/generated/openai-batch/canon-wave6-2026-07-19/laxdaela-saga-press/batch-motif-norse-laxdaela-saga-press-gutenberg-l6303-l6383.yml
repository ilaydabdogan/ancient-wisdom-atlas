canonical_text:
  quote: ''
  summary: Thorkell ignores Thorstein's warning about uncertain weather and departs
    by boat with companions and the sword Skofnung. A gale and squall overturn the
    boat, drowning all aboard. Gudrun later sees ghostly signs at the church, including
    wet figures resembling Thorkell and his company. After the drowning is confirmed,
    Gudrun becomes devout. Herdis dreams of a buried woman complaining about Gudrun's
    nightly presence above her; excavation beneath the church floor reveals bones,
    a brooch, and a wizard's wand, and the bones are removed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On Maundy Thursday Thorkell prepares a journey, while Thorstein opposes it
    because the weather looks uncertain; Thorkell insists that he wants to be home
    before Easter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thorstein removes lading from the ferry-boat as quickly as Thorkell and his
    followers load it; after Thorkell departs, Thorstein is downcast and weeps.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A roaring blast strikes the house, and Thorstein calls it the slayer of his
    kinsman Thorkell.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thorkell's group sails down Broadfirth with ten people aboard; the wind rises
    to a full gale, a squall catches the sail near Bjorn's isle, and the boat is overwhelmed,
    drowning all aboard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thorkell has the sword Skofnung in the locker; after the drowning, timber
    and corner-staves drift ashore, and Skofnung is found stuck fast to boat timbers
    on Skofnungs-isle.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: That evening at Holyfell, Gudrun goes to the church after others have gone
    to bed and sees a ghost at the lich-gate that bows and says there are great tidings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the church door Gudrun thinks she sees Thorkell and his companions come
    home with water running off their clothes; she does not speak to them, and later
    finds no one in the guest-room.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On Good Friday Gudrun sends men to investigate Thorkell's journey, and by
    the Saturday before Easter the news is known after flotsam has come ashore around
    the islands and both shores of the firth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Gudrun grieves for Thorkell but bears the bereavement bravely; Gellir, aged
    fourteen, takes over household affairs and the chieftainship with his mother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gudrun becomes very religious, knows the Psalter by heart, and spends long
    periods in church at night saying prayers, accompanied by Herdis.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Herdis dreams of an unattractive woman in a woven cloak and head cloth who
    says Gudrun creeps over her nightly and lets hot drops fall on her, burning her
    all over.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the dream, Gudrun has planks raised from the church floor and the earth
    dug up; blue evil-looking bones, a round brooch, and a wizard's wand are found,
    and the bones are taken to a remote place.
  category: object
  evidence_refs:
  - ev:9
