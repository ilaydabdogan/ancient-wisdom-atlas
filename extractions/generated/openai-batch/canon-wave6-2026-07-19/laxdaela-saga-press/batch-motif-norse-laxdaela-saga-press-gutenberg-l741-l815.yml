canonical_text:
  quote: ''
  summary: At a summer rulers' meeting and fair at the Brenn-isles, Hoskuld visits
    a separate merchant's tent belonging to Gilli the Russian. Gilli reveals twelve
    women behind a curtain. Hoskuld chooses one ill-clad but fair woman, pays the
    high price after Gilli discloses that she is mute, then gives her fine clothing.
    After the meeting ends, Hoskuld greets King Hakon, who remarks that the greeting
    would have been welcome sooner.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king travels by fleet to the Brenn-isles for a rulers' meeting held every
    third summer to settle peace and matters between Norway, Sweden, and Denmark.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The meeting also includes a fair, crowds, drinking, games, entertainment,
    and visitors from many lands.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hoskuld goes out for amusement, sees a stately tent set apart from the other
    booths, enters it, and meets the man inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man in the tent is Gilli, called Gilli the Russian; he wears costly raiment
    and a Russian hat and is described by Hoskuld as a very rich merchant.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Hoskuld asks to buy a bonds-woman, Gilli lifts a curtain in the booth
    and reveals twelve women seated behind it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hoskuld examines the women and notices one seated by the skirt of the tent;
    she is very ill-clad, and Hoskuld thinks she is fair to look upon.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gilli prices the selected woman at three silver pieces or marks, while offering
    any of the other eleven for one mark of silver.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before closing the bargain, Gilli says there is no guile on his side and discloses
    that the woman is dumb and has not spoken despite his attempts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hoskuld has the silver in his belt purse weighed on scales; it comes to exactly
    three marks, and he closes the bargain by paying Gilli and taking the woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: That night Hoskuld goes to bed with the woman; the next morning he gives her
    fine women's clothes from a chest, and people say she looks very well when dressed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the rulers finish their lawful discussions and the meeting breaks up,
    Hoskuld goes to greet King Hakon, who comments that the greeting would have been
    welcome sooner.
  category: sequence
  evidence_refs:
  - ev:7
