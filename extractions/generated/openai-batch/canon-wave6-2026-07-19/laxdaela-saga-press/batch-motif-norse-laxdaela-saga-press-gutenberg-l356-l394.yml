canonical_text:
  quote: ''
  summary: Ketill Flatnose brings his ship to Scotland and settles there with his
    kin, while Thorstein turns to warfare, gains half of Scotland, and is later treacherously
    killed after a peace. Unn the Deep-minded, after hearing of Thorstein's death
    and her father's death, secretly has a ship built in a wood, loads it with wealth,
    gathers surviving kin and followers, and escapes from war. She then sails to the
    Orkneys and the Faroe Isles, arranging marriages for Gro and Olof, from whom the
    passage traces elite island lineages.
  language: English
  quote_policy: summarized
