  summary: Olaf sails to Norway to obtain house-timber, receives timber and a gold-inlaid
    axe from Earl Hakon, returns to Iceland with Giermund Roar, builds a decorated
    fire-hall at Herdholt, and hosts a wedding feast after Giermund secures marriage
    to Olaf's daughter Thured through Thorgerd's advocacy. Ulf Uggason recites the
    House Song about Olaf and the hall's painted legends.
  language: English
