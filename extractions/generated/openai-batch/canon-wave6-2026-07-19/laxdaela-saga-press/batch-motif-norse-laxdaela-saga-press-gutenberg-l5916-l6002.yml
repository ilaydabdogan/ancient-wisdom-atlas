  quote: the money was readily paid and the peace well holden to.
  summary: The sons of the slain Bolli secretly plan revenge against the sons of Olaf.
    Snorri the Priest intervenes, argues against further manslaughter, negotiates
    with Halldor, and arranges an arbitrated monetary settlement. Umpires meet, an
    award is issued, fines are paid, peace is maintained, and weapon gifts are exchanged.
  language: English
