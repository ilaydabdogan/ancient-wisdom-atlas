canonical_text:
  quote: ''
  summary: Vigdis rewards Asgaut with freedom and money connected with Thorolf's death;
    Asgaut later leaves Iceland and settles in Denmark. After Thord Goddi and Ingjald
    plot against Thorolf, Vigdis divorces Thord and leaves with her heirlooms. Threatened
    by claims on his wealth, Thord turns to Hoskuld and arranges for Hoskuld's son
    Olaf to be fostered by him and to inherit his wealth. Melkorka objects, but Hoskuld
    accepts. Gifts pacify Thord Yeller. Olaf grows into a strong, handsome, splendidly
    dressed youth and receives the nickname Peacock.
  language: English
  quote_policy: summarized
