canonical_text:
  quote: ''
  summary: After Bolli's slaying, Halldor's followers discuss Gudrun's composed conduct,
    and Halldor argues that she is grieving and was observing who took part. Gudrun
    and Osvif summon Snorri the Priest, who comes with sixty men and offers to seek
    a peaceful settlement. Gudrun is reluctant to accept money for the killing and
    asks instead to exchange dwellings with Snorri so that she will not live beside
    the Herdholtings. Snorri agrees. The next winter Gudrun gives birth to a son named
    Bolli. In spring Gudrun and Snorri exchange lands; Gudrun and Osvif move to Holyfell,
    where Gudrun's sons Thorleik and Bolli grow up.
  language: English
  quote_policy: summarized
