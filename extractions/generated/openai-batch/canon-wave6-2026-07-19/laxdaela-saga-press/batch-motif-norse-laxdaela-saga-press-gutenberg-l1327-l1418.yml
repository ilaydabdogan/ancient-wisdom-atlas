canonical_text:
  quote: ''
  summary: Hrut, honored in Norway by King Harald and Queen Gunnhild, leaves for Iceland
    with a royal ship and a gold ring from Gunnhild. He settles at Combness, seeks
    his maternal inheritance from his half-brother Hoskuld, and repeatedly presses
    the claim. When Hoskuld refuses, Hrut seizes cattle, defeats Hoskuld's pursuing
    house-carles at a sandhill later called Fight-Dale, and Hoskuld's wife Jorunn
    counsels against killing Hrut.
  language: English
  quote_policy: summarized
