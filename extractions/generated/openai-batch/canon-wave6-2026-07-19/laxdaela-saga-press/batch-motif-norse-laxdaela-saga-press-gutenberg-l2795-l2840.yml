canonical_text:
  quote: Then Kotkell had a great spell-working scaffold made... and presently a great
    tempest arose.
  summary: Aud reports her visit to Laugar and Thord remains wounded. Ingun seeks
    Thord's protection against Kotkell, Grima, and their sons, alleging theft and
    witchcraft. Thord travels to Skalmness, removes Ingun's goods, and summons the
    family for theft and witchcraft. Kotkell's family responds by making a spell-working
    scaffold and singing enchantments, after which a tempest arises at sea. Thord
    tries to save the boat party by throwing cargo overboard, but an unprecedented
    breaker capsizes the ship. Thord and his followers drown; the keel, shield, bodies,
    and burial mound become associated with named places.
  language: English
  quote_policy: quoted
