canonical_text:
  quote: ''
  summary: Vigdis refuses payment for Thorolf's shelter and insists he remain for
    the winter, despite Thord's objection. Ingjald, pursuing a blood-suit for his
    brother, travels by ferry with twelve men to Goddistead. He privately negotiates
    with Thord, offering silver and release from liability if Thord gives up Thorolf,
    whom Ingjald identifies as his brother's slayer. Thord accepts the bargain despite
    anticipating criticism, and the men sleep until near dawn.
  language: English
