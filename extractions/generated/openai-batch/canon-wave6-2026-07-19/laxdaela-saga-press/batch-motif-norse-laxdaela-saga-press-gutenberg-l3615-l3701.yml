canonical_text:
  quote: ''
  summary: Bolli asks his uncle Olaf for support in marrying and names Gudrun Osvif's
    daughter as his desired bride. Olaf refuses direct involvement because of known
    talk about love between Kjartan and Gudrun. Bolli then goes to Laugar with companions
    and asks Osvif for Gudrun's hand. Osvif and his sons press the match, while Gudrun
    remains unwilling but does not give an outright refusal; betrothal and wedding
    follow. In Norway, after news that Iceland has become Christian, King Olaf releases
    the Icelandic hostages. Kjartan obtains leave to return to Iceland, prepares a
    ship with Kalf, and visits Ingibjorg, who gives him a white gold-inwoven coif
    while speaking of Gudrun. The supplied passage ends mid-sentence during Ingibjorg's
    instruction.
  language: English
  quote_policy: summarized
