canonical_text:
  quote: ''
  summary: Kjartan leads a force to Laugar, confines the household by removing doors,
    and creates a severe humiliation that deepens enmity between Laugar and Herdholt.
    A later land bargain for Tongue between Thorarin and Bolli and Gudrun is unset
    because it lacks lawful witnesses; Kjartan intervenes, pressures Thorarin, and
    buys the land himself with witnesses. Gudrun frames this as a challenge to Bolli's
    honor. Kjartan later rides with one companion toward Saurby and is questioned
    about his route by Thorhalla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Yule, Kjartan musters sixty men, does not tell his father the reason
    for the journey, takes tents and stores, and rides to Laugar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Laugar, Kjartan orders some men to look after the horses and others to
    put up tents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kjartan has all the doors of the house taken, forbids the inmates to go outside,
    and for three nights makes them perform errands within the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Olaf is displeased with the raid, while Thorgerd says the Laugar men deserved
    this and an even greater shame.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hrefna asks Kjartan whether he spoke with anyone at Laugar and reports that
    she heard Gudrun had coifed herself with the head-dress and that it suited her
    well.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kjartan becomes visibly angry at Hrefna's remark and denies seeing Gudrun
    in the head-dress, while saying Gudrun needed no head-dress to look statelier
    than other women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The men of Laugar regard the raid as a disgrace worse than if Kjartan had
    killed one or two of them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sons of Osvif are the most agitated over the matter, Bolli quiets them
