- id: obs:10
  text: Hrefna gives birth to a boy, who is named Asgier.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Thorarin, the goodman of Tongue, wants to sell Tongue because he lacks money
    and thinks ill-will is swelling among people in the countryside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bolli and Gudrun negotiate with Thorarin to buy Tongue, agree on price and
