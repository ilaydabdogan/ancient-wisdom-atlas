canonical_text:
  quote: ''
  summary: At a wedding feast, the outlawed Gunnar, kept secretly by Gudrun, is recognized
    by Thorkell near the washing water. Thorkell orders Gunnar seized, Gudrun calls
    her followers to defend him, and Snorri Godi mediates before violence breaks out.
    Gunnar is sent away that evening; later Gudrun persuades Thorkell to provide Gunnar
    with a ship and necessary goods, after which Gunnar departs for Norway.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gunnar had been sent to Gudrun for keeping, his name was kept secret, and
    he was outlawed because of the slaying of Thridrandi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the first evening of the feast, during washing, a large hatted man stood
    by the water and Thorkell questioned him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thorkell identified the man as likely to be Gunnar, and Gunnar then acknowledged
    that Thorkell had named him correctly.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Thorkell ordered his men to lay hands on Gunnar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gudrun rose from the bridal bench and called on her men to help Gunnar and
    to give no quarter to anyone showing doubtful behavior.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Snorri Godi went between the two sides and urged them to calm the conflict.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thorkell said he had promised Thorleik Geitir's son that he would kill Gunnar
    if Gunnar came into the western countrysides.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Snorri's reasoning, Thorkell quieted down and Gunnar was sent away that
    evening.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The feast continued, and Thorkell gave rich gifts to Snorri and to the chief
    men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Thorkell settled at Holyfell, took charge of the household, had a new hall
    built, and love grew between him and Gudrun during the winter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In spring, Gudrun asked Thorkell to give Gunnar a ship and necessary goods;
