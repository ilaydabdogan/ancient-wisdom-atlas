canonical_text:
  quote: ''
  summary: The passage introduces Kotkell, Grima, and their sons as foreign wizards
    settled in Iceland. At the Thing, Gudrun prompts Thord about Aud's wearing of
    men's breeches and states that such conduct warrants separation. Thord publicly
    separates from Aud and later marries Gudrun. Aud then gathers information, rides
    to Laugar in breeches, enters Thord's sleeping place, wounds him with a sword,
    and returns home; Thord identifies her but refuses immediate pursuit.
  language: English
  quote_policy: summarized
