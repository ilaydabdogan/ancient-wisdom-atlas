canonical_text:
  quote: Thorkell was led out and slain
  summary: The passage recounts Bolli and Gudrun establishing a household and having
    a son, then focuses on a shepherd lad grieved by Kjartan's death and offended
    by Thorkell of Goat-Peaks' mockery. After the lad reports this at Herdholt, Thorgerd
    reproaches Halldor and his brothers for not taking revenge. Halldor later rides
    to Goat-Peaks with men, surrounds Thorkell's house, has Thorkell killed, forbids
    plunder, and returns home. The passage closes with continuing ill-will between
    Olaf's sons and Bolli and a brief genealogical note.
  language: English
  quote_policy: quoted
