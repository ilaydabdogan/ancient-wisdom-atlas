canonical_text:
  quote: ''
  summary: A party led by Halldor rides by night to the dairy where Bolli is staying
    with Gudrun. A shepherd sees the hidden men and tries to warn Bolli, but is stopped
    and injured. Gudrun leaves the dairy at Bolli's command. Bolli arms himself alone
    and resists several attackers, killing An Brushwood-belly and disabling Lambi
    before Helgi pierces him with a spear and Steinthor beheads him after Thorgerd
    urges the attackers on.
  language: English
  quote_policy: summarized
