canonical_text:
  quote: ''
  summary: A speaker at the dairy anticipates a hostile encounter and sends the women
    there to put on men's dress, take horses, and ride to the winter dwelling to gather
    help. Thorgils fears Helgi may have been warned and orders pursuit. A small, alert
    man named Hrapp arrives, introduces himself as Fight-Hrapp, recounts a quarrel
    with his master and the taking of a horse, then learns of the planned attack on
    Helgi and is eager to join.
