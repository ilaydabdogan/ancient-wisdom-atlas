canonical_text:
  quote: ''
  summary: At the Thing, Eldgrim asks Thorliek to sell valuable stud-horses given
    by Kotkell, but Thorliek refuses. Eldgrim later takes the horses from pasture.
    Hrut, Thorliek's kinsman, confronts him, offers substitute horses, and then kills
    Eldgrim with a halberd when Eldgrim refuses to yield them. Hrut tells Thorliek,
    who is angry rather than grateful, while Hrut's fame is said to increase.
  language: English
