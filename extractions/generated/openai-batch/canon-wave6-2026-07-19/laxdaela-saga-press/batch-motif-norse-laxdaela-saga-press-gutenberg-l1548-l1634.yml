canonical_text:
  quote: ''
  summary: Olaf travels to Norway, is received at King Harald's court, and gains Gunnhild's
    support for a westward sea journey to seek his maternal royal kin. Harald and
    Gunnhild send him off with honour and good-luck. During the voyage toward Ireland,
    Olaf and his crew face fog, little wind, confusion over direction, and a dangerous
    landfall. Olaf chooses Orn's wiser counsel over the majority, anchors near Ireland,
    observes a safer water-filled dip, and then encounters Irish men who invoke local
    law to claim the ship's goods.
  language: English
  quote_policy: summarized
