canonical_text:
  quote: ''
  summary: Unn, weakened by age, advises Olaf Feilan to marry and arranges his wedding
    feast at Hvamm. Before assembled kin and guests she publicly gives Olaf her dwelling
    and belongings, then withdraws and dies during the night. The feast becomes both
    Olaf’s wedding celebration and Unn’s funeral honours; she is buried in a ship
    inside a cairn with treasure. Olaf assumes control of Hvamm and later becomes
    a powerful chieftain. The passage then gives family lines and describes Koll’s
    death, Hoskuld’s succession, and Thorgerd’s wish to go abroad, for which Hoskuld
    buys a share in a ship.
  language: English
  quote_policy: summarized
