canonical_text:
  quote: ''
  summary: Thorkell Eyjolfson returns with merchant ships and timber. Snorri counsels
    him to stop voyaging and seek marriage with Gudrun, then accompanies him to Holyfell.
    Snorri presents the proposal, emphasizing Thorkell's rank, wealth, and prospects.
    Gudrun consults her sons and relies on Snorri's advice; the marriage is agreed.
    Gudrun chooses to host and fund the wedding feast at Holyfell, where large groups
    of guests are welcomed and seated.
  language: English
  quote_policy: summarized
