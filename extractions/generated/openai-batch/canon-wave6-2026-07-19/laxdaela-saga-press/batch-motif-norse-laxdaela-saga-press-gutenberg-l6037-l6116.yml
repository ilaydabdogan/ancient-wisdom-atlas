canonical_text:
  quote: ''
  summary: Bolli and Thorleik sail from Iceland to Norway. Bolli winters in Thrandheim,
    gains reputation through generosity and lordly conduct, then meets King Olaf at
    Sarpsborg. The king esteems Bolli and offers him a henchman title, but Bolli continues
    abroad. He travels to Denmark, then to Micklegarth, enters the Varangian Guard,
    and is highly esteemed for valor.
  language: English
