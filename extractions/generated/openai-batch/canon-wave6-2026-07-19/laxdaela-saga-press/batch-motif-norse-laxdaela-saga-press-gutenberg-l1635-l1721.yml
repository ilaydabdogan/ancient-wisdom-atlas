canonical_text:
  quote: '"True enough are the tokens"'
  summary: Olaf resists an Irish attempt to seize his ship, confronts King Myrkjartan
    from the defended vessel, states his maternal descent from Melkorka, and presents
    a ring as a token. Myrkjartan grants peace, accepts the token and family resemblance,
    acknowledges Olaf as kin, invites him and his suite to court, and travels toward
    Dublin with him.
  language: English
  quote_policy: quoted
