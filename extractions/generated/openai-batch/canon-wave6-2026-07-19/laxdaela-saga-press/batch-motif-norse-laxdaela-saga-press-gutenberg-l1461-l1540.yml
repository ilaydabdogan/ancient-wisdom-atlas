canonical_text:
  quote: ''
  summary: Hoskuld grows old while his sons establish themselves. Olaf, son of Hoskuld
    and Melkorka, is urged by Melkorka to travel overseas to find her Irish royal
    kin. To finance the journey, Melkorka agrees to marry Thorbjorn Skrjup, who provides
    wares. While Hoskuld is away at the Thing, the wedding and arrangements take place.
    Olaf takes passage with Orn, receives recognition tokens and Irish-language preparation
    from Melkorka, and sails when a fair wind arises.
  language: English
  quote_policy: summarized
