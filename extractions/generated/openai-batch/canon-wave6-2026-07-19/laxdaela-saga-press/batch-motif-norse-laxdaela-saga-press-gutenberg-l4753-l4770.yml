canonical_text:
  quote: ''
  summary: After Bolli has been killed, Gudrun asks what happened. Helgi wipes the
    blood from the spear that killed Bolli on the end of Gudrun's scarf. Gudrun smiles
    slightly. Halldor condemns the act, and Helgi says he thinks the undoer of his
    life abides under that scarf end. The riders depart after Gudrun walks and talks
    with them briefly.
  language: English
