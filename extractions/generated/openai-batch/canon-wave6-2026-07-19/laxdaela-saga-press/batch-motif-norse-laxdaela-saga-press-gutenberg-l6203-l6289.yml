canonical_text:
  quote: "“Sooner you will be embracing the sea-tangle in Broadfirth than I sell my
    land against my own will.”"
  summary: Thorkell prepares a winter timber-transport journey and stays with his
    kinsman Thorstein. Thorstein wants to buy Halldor's land at Herdholt, thinking
    Halldor short of money. Halldor anticipates the errand, positions Beiner the Strong
    as an armed supporter, and summons nearby men. In a field negotiation, Thorstein
    and Thorkell press Halldor, then threaten a forced sale. Halldor refuses, invokes
    violent consequences, and his summoned men arrive as Thorstein wants to attack,
    while Thorkell restrains him because of the season.
  language: English
  quote_policy: quoted
