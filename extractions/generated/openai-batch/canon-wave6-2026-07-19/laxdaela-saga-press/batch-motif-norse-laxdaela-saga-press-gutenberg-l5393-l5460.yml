canonical_text:
  quote: ''
  summary: Thorgils and his company ride to a dairy after seeing riders leave it.
    They surround the building where Helgi and a small group are inside. Hrapp is
    killed by Helgi’s spear from a window. The attackers tear at the roof-beam and
    guard the door. Hardbien wounds Thorstein through the broken doorway. Helgi rushes
    out, wounds Thorgils, and is killed by Bolli with Footbiter. Other men are killed,
    while Bolli forbids harm to Helgi’s young son Hardbien.
  language: English
  quote_policy: summarized
