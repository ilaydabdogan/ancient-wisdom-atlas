canonical_text:
  quote: ''
  summary: The passage introduces Osvif Helgeson through ancestry, household, residence,
    wife, children, dependents, land dealings, and neighboring households. It also
    describes Gudrun’s exceptional qualities, Ox-Thorir’s wealth and gift to King
    Hakon, Osvif’s land purchase from Thorarin, and Thord’s marriage to Aud chiefly
    for wealth.
  language: English
