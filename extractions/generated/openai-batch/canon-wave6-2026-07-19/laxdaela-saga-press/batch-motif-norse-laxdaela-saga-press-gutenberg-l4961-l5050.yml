canonical_text:
  quote: ''
  summary: Gudrun travels to arrange a private meeting with Snorri Godi and presses
    him for counsel on avenging Bolli after twelve years. They discuss possible targets,
    with Snorri discouraging attacks on Olaf's sons and redirecting attention toward
    Helgi, while proposing that Lambi and Thorstein join Gudrun's sons as a compensatory
    obligation. Snorri identifies Thorgils as a suitable leader and advises Gudrun
    to recruit him through a deliberately ambiguous marriage promise, since Thorgils
    had offered to avenge Bolli in return for marriage. Gudrun later rides with her
    sons and is joined by Thorgils on the way to Holyfell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gudrun travels into the Dales, sends for Snorri Godi, and arranges to meet
    him at a crag called Head by Hawkdale-river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Gudrun has only one man with her at the meeting: Bolli, son of Bolli, who
    is twelve years old, unusually strong and wise, and carrying Footbiter.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bolli and Snorri's follower sit on the crag while Gudrun and Snorri speak
    privately.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Gudrun tells Snorri that the killing of Bolli remains fresh to her after twelve
    years and asks for whole-hearted counsel on bringing about revenge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gudrun first says she wants all Olaf's sons not to go scatheless; Snorri forbids
    an attack on them and says it is time for the family feuds to end.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Gudrun proposes Lambi and then Thorstein the Black as targets, while Snorri
    distinguishes their guilt from that of Helgi Hardbienson, whom he names as one
    who took Bolli's life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Snorri proposes that Lambi and Thorstein join the train of Gudrun's sons as
    a fitting ransom, and says he will not plead for them if they refuse.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Snorri identifies Thorgils as the man Gudrun has effectively chosen to rule
    the journey and be its leader.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Gudrun reports that Thorgils had offered to avenge Bolli if Gudrun would marry
    him in return, but she considered that condition impossible.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Snorri advises Gudrun to promise marriage to Thorgils in wording with a double
    meaning: that of men in the land she will marry none other than Thorgils, while
    Snorri intends Thorkell Eyjolfson, who is not then in the land, as her husband.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Snorri instructs Gudrun to make the covenant with few witnesses, to include
    Halldor, and not to include Ornolf because Ornolf has more wits.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the meeting, Snorri rides home, Gudrun rides to Thickshaw, and the next
    morning Gudrun and her sons are overtaken by Thorgils Hallason as they ride toward
    Holyfell.
  category: sequence
  evidence_refs:
  - ev:7
