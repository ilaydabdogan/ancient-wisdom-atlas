canonical_text:
  quote: You will have four husbands
  summary: Gest Oddleifson, described as a foreseeing sage, meets Gudrun at the Saelingsdale
    spring. Gudrun recounts four troubling dreams involving a coif, a silver ring,
    a gold ring, and a jeweled gold helm. Gest interprets the dreams as omens of four
    future husbands and associated losses or burdens.
  language: English
  quote_policy: quoted
