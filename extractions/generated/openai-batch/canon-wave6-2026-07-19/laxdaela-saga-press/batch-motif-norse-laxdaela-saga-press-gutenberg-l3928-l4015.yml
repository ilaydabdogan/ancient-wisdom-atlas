canonical_text:
  quote: ''
  summary: The passage describes reciprocal feasts between Olaf and Osvif amid ill-will
    among younger people. At Herdholt, Kjartan publicly gives Hrefna the high seat
    formerly held by Gudrun. Gudrun asks to see Hrefna's costly coif. Kjartan's sword
    King's-gift is then missing and later recovered from a bog or ditch by following
    Thorolf's footprints. Olaf counsels restraint. Later, at the Laugar Winter-nights
    feast, Hrefna reluctantly brings the coif after Thorgerd urges her, and the coif
    disappears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Olaf and Osvif remain friends, but the younger people are said to have some
    ill-will between them; both households prepare feasts and invite each other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Olaf's feast, Kjartan says Hrefna shall sit in the high seat and be most
    honored while he lives; Gudrun had previously held that place and reacts by flushing
    but saying nothing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gudrun tells Hrefna she should wear the head-dress and display it as the costliest
    treasure that had come to Iceland; Kjartan answers that Hrefna shall not wear
    it at that feast.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hrefna takes the coif from a pocket of costly stuff kept in a chest in the
    out-bower and shows it to Gudrun, who unfolds it and looks at it without praise
    or blame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the guests' departure from Olaf's feast, Kjartan's sword King's-gift
    is missing from the room where it had been kept.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Olaf tells Kjartan they must handle the missing sword gently and arranges
    for men to watch each departing group discreetly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: An the White watches Osvif's company, follows Thorolf's footprints in the
    snow to a ditch or bog, and finds the hilt of a sword there; Thorarin accompanies
    An to take up the sword.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sword is returned to Kjartan, the place is later called Sword-ditch, the
    scabbard is never found, and Kjartan values the sword less afterward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Before the Laugar feast, Hrefna wishes to leave the coif behind and says she
    may go to places where fewer people envy her than at Laugar; Thorgerd urges her
    to take the peerless keepsake.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Laugar, Hrefna looks for the coif in the morning and it is gone; people
    search without finding it, and Gudrun suggests it was left at home or fell out
    on the way.
  category: sequence
  evidence_refs:
  - ev:5
