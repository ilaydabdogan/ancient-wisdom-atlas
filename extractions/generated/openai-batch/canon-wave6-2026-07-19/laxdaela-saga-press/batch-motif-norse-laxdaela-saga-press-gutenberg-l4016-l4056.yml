canonical_text:
  quote: ''
  summary: Olaf urges quiet handling of a dispute so that Kjartan and Bolli will not
    fall out. Kjartan publicly confronts Bolli over a missing sword scabbard and another
    valuable keepsake, and Bolli denies theft. Gudrun answers that those involved
    in the coif's disappearance may have taken what was their own and expresses no
    regret if Hrefna cannot use the head-dress. The parties depart heavy-hearted;
    the head-dress is never heard of again, and many believe Thorolf burnt it on Gudrun's
    order. Asgeir Eider-drake dies, and his sons inherit his estate.
  language: English
  quote_policy: summarized
