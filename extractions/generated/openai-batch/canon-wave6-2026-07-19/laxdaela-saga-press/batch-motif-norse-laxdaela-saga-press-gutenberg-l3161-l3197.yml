canonical_text:
  quote: ''
  summary: Osvif reminds Gudrun and her brothers of the danger of dealing with Kotkell
    and his sons, and Gudrun praises her father's counsel. Olaf lives honorably at
    his manor with his sons and Bolli. Kjartan and Bolli are closely bonded, and Bolli
    accompanies Kjartan everywhere. Kjartan often visits the Saelingdale-spring, where
    Gudrun is often present; he enjoys talking with her, and others regard them as
    well matched. Olaf and Osvif are friends, but Olaf warns Kjartan that he has a
    foreboding about dealings with Laugar. Kjartan hopes matters will turn out better
    and continues his visits with Bolli.
  language: English
  quote_policy: summarized
