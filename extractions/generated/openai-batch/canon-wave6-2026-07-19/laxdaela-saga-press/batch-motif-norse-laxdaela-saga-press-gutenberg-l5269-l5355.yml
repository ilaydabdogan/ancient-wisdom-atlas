canonical_text:
  quote: ''
  summary: At a dairy, Helgi sends his shepherd to watch the nearby woods because
    his dreams have been troubled. The shepherd reports a sizable company of men nearby,
    seated in a ring on their saddles and eating. He describes their clothing, saddles,
    ornaments, bodies, and weapons in detail, and Helgi identifies them one by one
    as known men, including Bolli Bollison, Thorleik Bollison, Thord Thordson, Lambi,
    Thorstein the Black, Halldor and Ornolf, Hunbogi the Strong, and Svein. Helgi
    grows concerned that such a picked company may be on a hostile journey or home-raid.
  language: English
  quote_policy: summarized
