canonical_text:
  quote: ''
  summary: Thorbjorn Skrjup and Melkorka are dead and buried in a cairn. Their son
    Lambi keeps house at Salmon-river-Dale and is well regarded. Olaf urges his brother
    Thorliek to go abroad to avoid dangerous proximity to Hrut and Hrut's sons. Thorliek
    agrees for Olaf's sake, entrusts concern for his son Bolli to Olaf, sells his
    land, buys a ship, and sails with his wife and household to Norway. He then goes
    to Denmark and Gautland, and the narration closes his story.
  language: English
  quote_policy: summarized
