canonical_text:
  quote: ''
  summary: Gizor and Hjalti return from Norway, preach the faith at the Althing, and
    Iceland receives the faith. Bolli returns to Herdholt and later visits Laugar,
    where Gudrun asks about his journey and about Kjartan. Bolli reports Kjartan’s
    high standing with the king and repeats talk of Kjartan’s friendship with Ingibjorg,
    the king’s sister, and possible marriage. Gudrun outwardly calls the tidings good
    but leaves abruptly, red-faced. Bolli continues visiting Gudrun and asks how she
    would answer a marriage proposal from him; she replies that she cannot marry while
    she knows Kjartan is alive. Bolli answers that she may have to remain husbandless
    if she waits for Kjartan, and after further disagreement he rides home.
  language: English
  quote_policy: summarized
