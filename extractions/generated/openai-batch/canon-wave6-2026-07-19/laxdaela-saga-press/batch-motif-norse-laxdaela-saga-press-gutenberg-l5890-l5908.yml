canonical_text:
  quote: ''
  summary: After a feast, people ride home. Bolli remains at Tongue and forms a loving
    bond with Thordis while Snorri treats him with exceptional kindness. The next
    summer Thorleik Bollison arrives by ship at White-river; Bolli rides to meet him,
    and the brothers greet each other joyfully. They go west to Holyfell, where Thorkell
    and Gudrun welcome Thorleik and invite him to stay for winter. Thorleik has his
    ship beached, his goods moved west, and is said to have gained wealth and honours
    as King Olaf's henchman.
  language: English
