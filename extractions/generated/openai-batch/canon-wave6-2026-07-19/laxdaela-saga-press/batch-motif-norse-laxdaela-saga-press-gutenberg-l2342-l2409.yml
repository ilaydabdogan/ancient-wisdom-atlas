canonical_text:
  quote: ''
  summary: Giermund plans to leave Iceland and to leave Thured and their young daughter
    Groa behind without money. Thured follows him by boat, disables his pursuit boat,
    places the child in his hammock while he sleeps, and takes his sword Footbiter.
    When Giermund wakes, he offers money and the child in exchange for the sword,
    but Thured refuses. Giermund lays a spell on the sword that it will kill the man
    in Thured's family whose death would be the greatest loss. Thured gives the sword
    to Bolli. Giermund later sails for Norway and dies with his crew when their ship
    strikes hidden rocks.
  language: English
  quote_policy: summarized
