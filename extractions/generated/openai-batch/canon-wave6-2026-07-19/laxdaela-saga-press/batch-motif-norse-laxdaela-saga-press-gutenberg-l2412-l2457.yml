canonical_text:
  quote: ''
  summary: The passage recounts Gudmund’s marriage to Thured and related family genealogy,
    then describes Olaf Peacock’s remarkable ox Harri, whose unusual horn breaks winter
    ice for water. After Harri’s ice-breaking horn falls off, Olaf has him killed.
    The next night Olaf dreams of a wrathful woman who says Olaf has slain her son
    and threatens to make Olaf see his own son blood-stained, choosing the son Olaf
    would least want to lose. Olaf is troubled but some dismiss the vision as dream
    or fancy.
