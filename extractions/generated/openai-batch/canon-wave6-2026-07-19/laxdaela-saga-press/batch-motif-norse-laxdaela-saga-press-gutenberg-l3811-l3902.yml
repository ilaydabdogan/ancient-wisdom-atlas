canonical_text:
  quote: ''
  summary: Bolli welcomes Olaf's party and greets Kjartan, but Kjartan is silent and
    refuses Bolli's gift of fine horses. Kjartan remains gloomy, then travels north
    to Asbjornness, where public games are held and he surpasses other competitors.
    Thurid advises him to stop pining after Gudrun and to consider Hrefna. Kjartan
    speaks privately with Hrefna, then woos her; the match is agreed before witnesses
    and a wedding at Herdholt is set. Kjartan returns happier, bearing gifts, and
    keeps a Lenten fast said to be the first in Iceland.
  language: English
  quote_policy: summarized
