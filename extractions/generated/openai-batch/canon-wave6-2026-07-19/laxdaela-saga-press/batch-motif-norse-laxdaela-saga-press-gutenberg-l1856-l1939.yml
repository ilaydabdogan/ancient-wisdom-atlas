canonical_text:
  quote: ''
  summary: Hoskuld asks Egil for Thorgerd's hand on Olaf's behalf. Egil consults Thorgerd,
    who first refuses because she considers Olaf the son of a bondswoman; Egil counters
    by stressing Olaf's royal maternal descent. Olaf then appears in prestigious clothing
    and weapons received from kings, speaks privately with Thorgerd for a day, and
    she agrees to the match. The wedding is held at Hoskuldstead, guests receive gifts,
    and Olaf gives Egil the sword originally given by King Myrkjartan.
  language: English
  quote_policy: summarized
