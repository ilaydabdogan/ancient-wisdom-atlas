canonical_text:
  quote: ''
  summary: At a royal meeting, the king questions Icelanders about baptism and about
    a proposed plan to burn him in his hall. Kjartan openly admits the proposal. The
    king spares him, grants peace, argues against forced conversion, and predicts
    that Kjartan's voluntary baptism would influence others. During Christmas/Yule,
    Kjartan and other Icelanders observe church ceremonies and the king's preaching.
    Kjartan then declares himself ready for baptism. The next morning he asks for
    water, and he, Bolli, their crew, and many others are baptized before Holy Service.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king opens a meeting, thanks those who are his friends and have taken
    the new faith, calls the Icelanders to a parley, and asks whether they will be
    baptized.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asks which Icelander thought it best to burn him in his hall, and
    Kjartan identifies himself as the person who said it.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The king tells Kjartan that Kjartan is not fated to kill him and says he will
    not take Kjartan's life because of the confession and uncertainty about whether
    Kjartan meant the threat.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The king predicts that on the day Kjartan is baptized of his own free will,
    several ships' crews will also take the faith, and that Kjartan's relations and
    friends in Iceland will heed him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king grants Kjartan and the Icelanders peace and says they will not be
