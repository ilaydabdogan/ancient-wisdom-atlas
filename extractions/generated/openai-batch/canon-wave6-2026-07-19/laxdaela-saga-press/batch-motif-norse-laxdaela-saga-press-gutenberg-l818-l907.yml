canonical_text:
  quote: ''
  summary: King Hakon receives Hoskuld, helps him obtain house-timber, and gives him
    a gold arm-ring and a gold-adorned sword before Hoskuld sails back to Iceland.
    At home, Jorunn questions him about the woman he has brought from Norway. The
    woman, treated as Hoskuld's mistress and thought to be deaf and dumb, gives birth
    to Olaf, who is notably beautiful, noble-looking, and precocious. Hoskuld later
    overhears her speaking to Olaf by a brook and learns that her name is Melkorka,
    daughter of the Irish king Myr Kjartan, taken as a prisoner of war at fifteen.
    Jorunn remains hostile; after a violent quarrel, Hoskuld gives Melkorka a separate
    dwelling, where Olaf lives with her and grows in beauty and courtesy.
  language: English
  quote_policy: summarized
