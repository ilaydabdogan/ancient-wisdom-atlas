canonical_text:
  quote: ''
  summary: 'Thorliek asks Kotkell and Grima to bring shame on Hrut. Kotkell, Grima,
    and their sons go by night to Hrut''s dwelling and perform incantations whose
    singing is heard inside. Hrut warns the household not to look out, but Kari, his
    twelve-year-old son, looks toward the enchantment and dies. Hrut and Olaf retaliate
    against Kotkell''s family: Kotkell and Grima are stoned, Hallbjorn is drowned
    after uttering a curse on Thorliek and his place, and Stigandi escapes. Hrut later
    seeks to raid Thorliek, but Olaf restrains the feud between kinsmen.'
  language: English
  quote_policy: summarized
