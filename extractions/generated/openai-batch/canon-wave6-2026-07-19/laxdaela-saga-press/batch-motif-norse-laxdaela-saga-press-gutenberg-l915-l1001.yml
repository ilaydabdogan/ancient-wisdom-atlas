  summary: The passage describes the fishing-place at Bjorn isles, a quarrel between
    Hall and Thorolf over dividing their catch, Hall's attempted violence and seizure
    of the catch, Thorolf's later ambush and killing of Hall at the landing-place,
    and Thorolf's secret flight to Goddistead where he asks his kinswoman Vigdis for
    shelter. Vigdis hides him and tells her husband Thord that she has already offered
    him refuge.
