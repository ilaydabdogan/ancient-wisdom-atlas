canonical_text:
  quote: ''
  summary: Thorgils Hallason leads a band of ten from home toward Water-Nook. He leaves
    the others in the wood, changes clothing, and goes alone to learn whether Helgi
    Hardbienson is at home. By questioning a local house-carle and presenting himself
    as an outlaw seeking help, he learns that Helgi is at the out-dairy Sarp with
    his son and two sheltered outlaws. Thorgils returns to his companions, waits until
    morning, and then advances toward the dairy.
