canonical_text:
  quote: ''
  summary: Kjartan returns to Iceland with Kalf and is welcomed by his father Olaf.
    At the ship, Hrefna tries on a precious coif from a chest, and Kjartan uses the
    moment to propose that both the coif and Hrefna should be his. Later, after tensions
    around Gudrun and Bolli are noted, Olaf urges Kjartan to attend the Laugar feast,
    and Kjartan rides there richly armed and dressed in royal gifts.
  language: English
