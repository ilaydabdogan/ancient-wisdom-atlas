canonical_text:
  quote: ''
  summary: Hrapp grows old, asks to be buried standing in the doorway of his fire
    hall so he can watch his dwelling, dies, and is buried as requested. After death
    he walks again, harms and kills servants, and Hrappstead is deserted. Hoskuld
    has Hrapp dug up and moved to a remote place, after which the hauntings lessen.
    Hrapp's son Sumarlid inherits Hrappstead, sets up household there, becomes frenzied,
    and dies soon after.
  language: English
