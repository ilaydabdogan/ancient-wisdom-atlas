canonical_text:
  quote: ''
  summary: King Olaf invites Kjartan and his kinsman Bolli to a Yule feast. Kjartan
    lays aside his white baptismal robes and he and Bolli become the king's liegemen.
    Hallfred delays baptism because he wants the king as godfather. Kjartan and Bolli
    remain with the king through winter; Kjartan is specially favored and praised,
    while Bolli is also highly esteemed. As spring comes, men prepare for journeys.
