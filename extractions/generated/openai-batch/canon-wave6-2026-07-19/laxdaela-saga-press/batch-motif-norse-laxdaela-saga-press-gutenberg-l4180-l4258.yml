canonical_text:
  quote: ''
  summary: After Easter at Hol, An recounts a violent dream in which an evil-looking
    woman cuts him open and replaces his inwards with brushwood. Kjartan mocks the
    dream, while Aud advises delay or a larger company. Gudrun wakes her brothers
    at Laugar, shames them into acting against Kjartan, and pressures Bolli to join
    despite his kinship with Kjartan. A party of nine lays an ambush at Goat-gill.
    Kjartan later dismisses some companions and states his belief that Bolli will
    not join plotters against him.
  language: English
  quote_policy: summarized
