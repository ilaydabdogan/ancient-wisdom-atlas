canonical_text:
  quote: ''
  summary: After the killing of Helgi and others, Thorgils and his followers return
    and report the deed. Gudrun receives them at Holyfell, hears Thorgils recite a
    verse claiming Bolli is avenged, thanks them, and gives them hospitality. The
    next day Thorgils asks for the promised reward, expecting marriage. Gudrun states
    that she promised to marry no man in Iceland except him, but will instead marry
    Thorkell Eyjolfson, who is abroad. Thorgils recognizes the wording as a trick,
    attributes the counsel to Snorri the Priest, and leaves angrily.
  language: English
  quote_policy: summarized
