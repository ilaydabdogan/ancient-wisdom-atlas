  summary: Olaf Hoskuldson stays at King Harald’s court, exchanges gifts, receives
    a ship from the king, and returns to Iceland. He reunites with his father Hoskuld
    and kin, his Irish royal descent is proclaimed, Melkorka questions him about Ireland,
    and Hoskuld begins arranging a politically advantageous marriage for him with
    Thorgerd, daughter of Egil Skallagrim’s son.
