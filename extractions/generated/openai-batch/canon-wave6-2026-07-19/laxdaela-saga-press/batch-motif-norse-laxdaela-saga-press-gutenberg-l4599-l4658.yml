canonical_text:
  quote: ''
  summary: Halldor secretly seeks Bardi's aid in a planned attack on Bolli, presenting
    revenge as unavoidable because of the brothers' mother's taunts. Bardi and Thorstein
    object to kinsmen killing one another, but the plan proceeds. Halldor notes that
    Bolli is temporarily vulnerable at an out-dairy with few men. Lambi and Thorgerd
    urge the expedition, and Thorgerd insists on joining, saying her sons need whetting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Halldor tells Bardi in secret that the brothers have decided to set on Bolli
    and that Bardi was invited so they could have his help and fellowship.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated pressure behind the brothers' decision is that they can no longer
    withstand their mother's taunts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bardi says it would be ill spoken of to break the peace with kinsmen, and
    he describes Bolli as difficult to overcome because he has men, fighting ability,
    and counsel from Gudrun and Osvif.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Halldor says the revenge on Bolli must come to pass, and Bardi agrees not
    to draw back if he cannot persuade them to abandon it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Halldor reports that Bolli's house-carles have been sent away and that Bolli
    is staying at the out-dairy in Saelingsdale with only haymaking house-carles.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Thorstein the Black objects to the undertaking, calling it heinous for kinsmen
    to go on killing one another, but his objection does not stop the plan.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lambi urges that the attack be carried out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Thorgerd eagerly urges the men onward and says Kjartan will not be avenged
    until Bolli pays for him with his life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The raid party is listed as Olaf's four sons, Bardi, Lambi, Thorstein, Helgi
    son of Hardbein, and An Brushwood-belly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Thorgerd also goes on the raid; when the men say such journeys are not for
