canonical_text:
  quote: ''
  summary: After Bolli and Gudrun speak about the killing of Kjartan, Osvif's sons
    hide in a secret underground chamber and messengers are sent to Snorri Godi. An,
    thought dead after the fight, sits up during the wake and explains that he had
    been in a swoon and dreamed that the same woman as before replaced brushwood in
    his belly with his own innards. His wounds are bound and he recovers, receiving
    the name An Brushwood-belly. Olaf grieves Kjartan but refuses to kill Bolli, instead
    sending his sons against Thorhalla's sons, who are intercepted by boat and beheaded
    overboard.
  language: English
  quote_policy: summarized
