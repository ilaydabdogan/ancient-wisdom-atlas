canonical_text:
  quote: ''
  summary: Gest finishes interpreting Gudrun's dreams, including a warning that a
    firth will be in the way on the last day of a man's life. Gudrun is disturbed
    but thanks him. Gest leaves, visits Olaf, sees young men swimming, recognizes
    and names Olaf's sons, and foretells that Kjartan will be the most highly accounted
    while alive. After departing, Gest weeps and tells Thord that Bolli will one day
    have the slain head of Kjartan at his feet and thereby bring about his own death.
