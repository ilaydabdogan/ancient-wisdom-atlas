canonical_text:
  quote: ''
  summary: Kjartan and Bolli arrive where King Olaf is staying. Kjartan enters a swimming
    contest in the river Nid with a man who later reveals himself as King Olaf. The
    king gives Kjartan a cloak. During a hard winter, heathen men attribute the weather
    to divine anger at the king's new faith. Olaf preaches Christianity, people are
    baptized after pressure, and Kjartan privately discusses resistance, including
    a plan to burn the king in his hall, while spies listen.
  language: English
  quote_policy: summarized
