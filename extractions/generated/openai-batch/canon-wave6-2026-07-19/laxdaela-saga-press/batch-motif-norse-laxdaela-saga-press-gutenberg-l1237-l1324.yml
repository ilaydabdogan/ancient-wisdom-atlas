canonical_text:
  quote: ''
  summary: Thorstein Swart leaves Thorness by ferry with family and companions, is
    caught in dangerous currents and weather, sees an uncanny seal near the boat,
    and the boat overturns so that all but Gudmund drown. Thorkell Trefill then arranges
    for Gudmund to report a death order favorable to Thorkell's inheritance claim,
    and later manipulates an earth-chain ordeal by staging a false fight that causes
    the sward arch to fall.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bork the Stout and Thorgrim rise in local honor, and Thorstein Swart decides
    to move his household to Hrappstead rather than contest their standing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thorstein boards a ferry-boat with twelve men, Thorarin, Osk, and the three-year-old
    Hild.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boat encounters a high south-westerly gale, ebbing tide, unfavorable wind,
    squalls, and a strong current in Coal-chest-Roost.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boat is heavily loaded with goods and chests; after striking a hidden
    rock, efforts to lower sail and push off with poles fail because the surrounding
    water is too deep.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A seal larger than the others swims around the ship during the day, appears
    to have human eyes, and cannot be shot by the men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the rising tide begins to refloat the ship, a violent squall heels the
    boat over and everyone aboard drowns except Gudmund.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Gudmund drifts ashore with timber, and the place where he is washed up is
    later called Gudmund's Isles.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Thorkell Trefill strikes a bargain with Gudmund so that Gudmund will tell
    the account of the deaths as Thorkell dictates it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The dictated order of deaths makes the inheritance pass through Hild and Osk
    so that Thorkell benefits through his wife Gudrid.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Thorarin's kinsmen doubt the account, claim half the heritage, and Thorkell
    calls for an ordeal according to custom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ordeal called earth-chain uses a slip of sward cut loose from the soil
    while both ends remain attached; the person is cleared if the sward does not fall
    on him.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Thorkell arranges for two men to feign a quarrel near the earth-chain so that
    they visibly knock it down during the ordeal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the sabotaged ordeal, Thorkell takes all the chattels, while the land
    at Hrappstead is left fallow.
  category: sequence
  evidence_refs:
  - ev:6
