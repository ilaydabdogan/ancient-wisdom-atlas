canonical_text:
  quote: ''
  summary: After Kjartan's death, his body lies in state and is buried at Burg in
    a newly consecrated church. At the Thorness Thing, Osvif's sons are banished and
    barred from return, while Bolli is spared prosecution and pays a money fine. Audun
    Cable-hound challenges the effect of the settlement; Osvif foretells that Audun
    will fall into the power of trolls, and Audun later dies with all aboard in a
    shipwreck among the Faroe Isles. Osvif's sons go abroad and never return. Olaf
    is praised for the settlement, later dies, and Thorgerd remains hostile to Bolli.
  language: English
  quote_policy: summarized
