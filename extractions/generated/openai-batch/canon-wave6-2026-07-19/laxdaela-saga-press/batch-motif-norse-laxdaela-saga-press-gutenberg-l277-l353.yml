canonical_text:
  quote: ''
  summary: Ketill responds to King Harald Fairhaired's growing power by convening
    his kin and debating whether to flee Norway or face death. Bjorn and Helgi favor
    Iceland, while Ketill prefers going west over the sea. Ketill arranges a marriage
    feast for Thorunn and Helgi the Lean, then his family disperses. Bjorn reaches
    Iceland, finds temple pillars washed ashore, treats this as a sign for where to
    build, and settles Bjornhaven; other named settlers and descendants are listed.
  language: English
