canonical_text:
  quote: ''
  summary: In winter, Marouckla is repeatedly sent to the mountain for out-of-season
    fruit. The personified months around a mountain fire change the season by transferring
    the highest seat and waving a wand over the fire, allowing her to gather strawberries
    and then two red apples. Helen later goes to take more apples herself, behaves
    rudely toward Setchene and the months, and is overtaken by a violent winter storm;
    her mother then goes searching for her.
  language: English
  quote_policy: summarized
