canonical_text:
  quote: ''
  summary: A rich widow favors her own daughter and mistreats two stepchildren, a
    brother and sister. The stepdaughter gives alms to an old man in a garden where
    three white-robed young men are present; they grant that her tears become pearls,
    her smiles produce roses, and water touched by her hands yields gold-fish. The
    widow sends her own daughter to imitate the encounter, but the old man judges
    her harshly, and the young men declare that her tears, smiles, and water-touch
    will produce lizards, toads, and serpents. After the widow's hatred worsens, the
    brother leaves home, prays at his parents' grave, and begins his travels.
  language: English
  quote_policy: summarized
