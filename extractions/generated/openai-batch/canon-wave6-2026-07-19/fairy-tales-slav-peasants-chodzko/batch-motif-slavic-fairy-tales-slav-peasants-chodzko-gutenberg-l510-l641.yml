canonical_text:
  quote: ''
  summary: The passage begins the tale of Marouckla, a persecuted orphan stepdaughter
    sent by Helen and her stepmother into the winter mountain forest to fetch out-of-season
    violets and then strawberries. On the mountain she finds a fire encircled by the
    twelve months, with January presiding. January gives his wand first to March,
    who changes winter into spring so she can gather violets, and later tells June
    to take the highest place for the strawberry errand.
  language: English
  quote_policy: summarized
