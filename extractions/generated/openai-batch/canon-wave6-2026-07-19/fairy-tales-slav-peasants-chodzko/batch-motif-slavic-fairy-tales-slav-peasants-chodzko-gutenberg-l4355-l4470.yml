- id: ev:5
  type: summary
  locator: 4385-4390
  quote_or_summary: The strange child goes into the garden before daylight, bathes
    in early dew, rolls in fine sand after sunrise, and returns home as a youth.
  source_text_path: texts/public-domain/slavic/project-gutenberg/fairy-tales-slav-peasants-chodzko.md
  rights_note: Public domain source; summarized evidence.
- id: ev:6
  type: summary
  locator: 4392-4400
  quote_or_summary: The prince grows rapidly, learns sword and horse skills, grows
    a moustache of pure gold, puts on a helmet, asks his parents' blessing, and declares
    he will seek his brothers.
  source_text_path: texts/public-domain/slavic/project-gutenberg/fairy-tales-slav-peasants-chodzko.md
  rights_note: Public domain source; summarized evidence.
- id: ev:7
  type: summary
  locator: 4402-4411
  quote_or_summary: The parents warn him not to venture; he replies that adventures
    do not terrify him and that he trusts in God; they then let him go and bless him
    and his road.
  source_text_path: texts/public-domain/slavic/project-gutenberg/fairy-tales-slav-peasants-chodzko.md
  rights_note: Public domain source; summarized evidence.
- id: ev:8
  type: summary
  locator: 4415-4421
  quote_or_summary: The prince crosses deep rivers and high mountains, reaches a dark
    forest, sees a cottage on a cock's foot in a poppy field, feels strong sleepiness,
    and breaks off poppy heads as he rides onward.
  source_text_path: texts/public-domain/slavic/project-gutenberg/fairy-tales-slav-peasants-chodzko.md
  rights_note: Public domain source; summarized evidence.
- id: ev:9
