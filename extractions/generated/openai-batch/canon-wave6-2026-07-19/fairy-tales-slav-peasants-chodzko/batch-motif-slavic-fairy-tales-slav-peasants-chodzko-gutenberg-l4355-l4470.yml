canonical_text:
  quote: ''
  summary: A queen bears an extraordinary royal son with a golden right hand, falcon-like
    eyes, and rapid growth. The child vows to seek his missing elder brothers, matures
    into a youth through contact with dew and sand, receives parental blessing, and
    journeys across rivers, mountains, and a dark forest to old Yaga's cock-footed
    cottage in a poppy field. Yaga tells him that his brothers perished while seeking
    the Princess with the Golden Hair, who was carried off by Vikher the hurricane.
    She offers a guiding pin-cushion, a heat-giving hood, and a cooling flagon, asking
    in return for Water of Youth from the mountain that touches the clouds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The queen reports the old man's words to the king, and a week or two later
    God sends her a son unlike an ordinary child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son has eyes compared to a falcon's, eyebrows compared to sable fur, a
    right hand of pure gold, and an awe-inspiring appearance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At three days old, the child leaves his swaddling-clothes and cradle, runs
    to his parents, and speaks to them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The parents grieve for two elder brothers who have been missing for three
    years and may be unburied in an unknown land.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child promises to become a strong young man before next spring and to
    search the whole world for his brothers, alive or dead, even in the centre of
    the earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The child bathes in early dew, rolls in fine sand near a little wood, and
    returns home no longer a child but a youth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Within three months the prince can wield a sword, ride on horseback, and has
    grown a moustache of pure gold.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The prince asks his parents' blessing and announces that he is going to seek
    his brothers at the furthest ends of the world if necessary.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The parents let the prince go, weep, bless him, and bless the road he is to
    travel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The prince crosses deep rivers, climbs high mountains, and comes to a dark
    forest containing a cottage on a cock's foot in a poppy field.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: As the prince approaches the poppy field he is seized by an overpowering longing
    to sleep, but he urges on his horse and breaks off poppy heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The prince recites words commanding the little cottage to turn and open its
    door to him; the cottage turns and faces him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Inside the cottage are old Yaga and two beautiful girls.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: Yaga greets the prince as Prince with Moustache of Gold and Hero with the
    Golden Fist.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Yaga says the prince's elder brothers perished on the mountain that touches
    the clouds while seeking the Princess with the Golden Hair, who was carried off
    by Vikher the hurricane.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: Yaga says Vikher could swallow the prince like a fly and that she has stayed
    inside the cottage for a hundred years for fear of being carried off to Vikher's
    palace near the sky.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: The prince says he is not afraid of Vikher carrying him off or swallowing
    him because his golden hand can smash anything.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: Yaga promises help if the prince gives his word of honour to bring her some
