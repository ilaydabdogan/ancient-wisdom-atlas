  source_text_path: texts/public-domain/slavic/project-gutenberg/fairy-tales-slav-peasants-chodzko.md
  rights_note: Public domain source; short excerpt quoted.
- id: ev:12
  type: summary
  locator: 4437-4440
  quote_or_summary: Yaga says the elder brothers perished on the mountain that touches
