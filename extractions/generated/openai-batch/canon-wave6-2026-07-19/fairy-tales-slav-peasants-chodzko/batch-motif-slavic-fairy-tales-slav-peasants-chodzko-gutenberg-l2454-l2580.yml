canonical_text:
  quote: ''
  summary: The passage closes one tale with Prince Dobrotek returning invisibly, destroying
    an invading army, revealing himself as the true rescuer, waking the princess with
    the dwarf's beard, marrying her, and receiving half the kingdom. It then begins
    another tale in which a poor fisherman gives his catch to a needy old traveller,
    witnesses the traveller vanish, catches a miraculous speaking fish, receives a
    gold-giving ring in exchange for sparing it, and returns home to find the given
    fish mysteriously cooked and waiting.
  language: English
  quote_policy: summarized
