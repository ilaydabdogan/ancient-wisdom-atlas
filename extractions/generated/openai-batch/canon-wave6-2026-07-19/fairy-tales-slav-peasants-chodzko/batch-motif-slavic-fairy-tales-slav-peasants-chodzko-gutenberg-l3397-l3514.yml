canonical_text:
  quote: ''
  summary: The princess repeatedly uses magic to escape Matthias and his companions,
    changing first into a dove and later into a fly and a fish. Tall, Broad, and the
    Man with Eyes of Flame use their special powers to recover her. After she acknowledges
    Matthias as husband, the party flees the palace; when the king's guards pursue,
    the princess creates a forest from her veil and begins to create a river from
    a tear.
  language: English
  quote_policy: summarized
