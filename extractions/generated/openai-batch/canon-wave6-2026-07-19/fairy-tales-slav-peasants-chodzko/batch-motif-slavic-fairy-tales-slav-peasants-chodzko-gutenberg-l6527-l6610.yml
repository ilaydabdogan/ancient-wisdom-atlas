canonical_text:
  quote: ''
  summary: A sluggard uses a repeated formula invoking the orders of the pike to command
    a broom, a stove, love from Princess Gapiomila, the descent of a crystal cask
    to a friendly island, and his own transformation into a handsome, wise, and clever
    man. The king first sends messengers, then has the sleeping sluggard bound and
    sent with the princess into an airborne crystal cask. The pair descend to an island
    where wishes provide food, a palace, and a bridge back to the king, who blesses
    their marriage.
  language: English
  quote_policy: summarized
