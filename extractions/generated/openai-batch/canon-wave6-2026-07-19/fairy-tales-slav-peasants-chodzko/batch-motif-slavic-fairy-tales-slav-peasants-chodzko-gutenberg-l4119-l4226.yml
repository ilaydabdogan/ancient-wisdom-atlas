canonical_text:
  quote: Within this egg is Kostey's life--if it be broken he dies.
  summary: A woman tells Prince Junak that Kostey can be killed only by breaking an
    egg hidden on the Island of Eternal Life beneath an oak, inside an iron-bound
    coffer, a hare, and a grey duck. Junak rescues a fish, crosses the sea with his
    speaking horse, retrieves the egg with the fish's help, defeats the twelve-headed
    dragon at the Enchanted Palace through his invisible club, and crushes the egg
    as Kostey attacks, causing Kostey's death.
  language: English
  quote_policy: quoted
