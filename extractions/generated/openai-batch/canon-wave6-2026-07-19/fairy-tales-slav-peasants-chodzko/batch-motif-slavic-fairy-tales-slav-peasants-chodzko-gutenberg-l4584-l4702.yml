  summary: The persecuted princess explains that Vikher has tried to force her into
    marriage. The Prince with the Golden Hand confronts and kills Vikher, a hurricane-like
    giant with a dragon head, then uses magical waters to revive his dead brothers
    and restore Yaga’s youth. Yaga gives her daughters to the prince’s brothers. The
    prince returns the Golden-Haired Princess to her parents, who reward him with
    marriage, half the kingdom, and succession rights.
