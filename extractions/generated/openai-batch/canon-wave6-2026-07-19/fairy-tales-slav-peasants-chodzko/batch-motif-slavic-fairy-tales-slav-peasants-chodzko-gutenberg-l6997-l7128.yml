  summary: The fool trades away a feast-producing tablecloth, twice recalls the oak's
    warning, and uses a self-acting fighting wand to recover it. He feeds a lame wounded
    soldier with the tablecloth, receives a magic helmet in exchange, retrieves the
    tablecloth again with the wand, reaches home, punishes his brothers with the wand,
    and begins to summon food for himself and his mother inside the cottage.
  language: English
