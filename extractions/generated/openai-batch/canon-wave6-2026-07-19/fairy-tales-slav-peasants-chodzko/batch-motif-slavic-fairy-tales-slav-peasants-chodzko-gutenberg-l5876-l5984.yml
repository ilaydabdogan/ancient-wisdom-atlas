canonical_text:
  quote: ''
  summary: A prince escapes with the Princess with the Golden Hair, aided by a speaking
    horse and a red fox. The fox restores barriers behind them, changes shape into
    a maiden to obtain the Horse with the Golden Mane from the silver king, then changes
    shape into a horse to obtain the fire-bird Ohnivak from the copper king. After
    warning the prince not to stop on the return journey, the fox vanishes. At the
    crossroads, the prince stops beneath the tree that has grown from his branch while
    his brothers' branches have withered. His elder brothers find him asleep with
    the princess, horse, and fire-bird, plan to seize the prizes and kingdom, kill
    him, cut up his body, and threaten Zlato-Vlaska.
  language: English
  quote_policy: summarized
