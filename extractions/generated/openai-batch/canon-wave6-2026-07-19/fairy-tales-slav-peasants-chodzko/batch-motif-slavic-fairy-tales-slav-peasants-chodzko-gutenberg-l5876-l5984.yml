- id: obs:3
  text: The faithful steed carries the prince and maiden rapidly, while the red fox
    follows and uses his tail to destroy bridges, reopen ravines, raise mountains,
    and restore the road to its previous state.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
