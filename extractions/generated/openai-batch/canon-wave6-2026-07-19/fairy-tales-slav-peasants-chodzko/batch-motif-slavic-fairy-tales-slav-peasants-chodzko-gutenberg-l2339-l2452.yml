canonical_text:
  quote: ''
  summary: A living giant head tells Prince Dobrotek how his dwarf brother betrayed
    and decapitated him with a hidden magic sword, leaving the giant's body as a forested
    mountain. The giant asks the prince to cut off the dwarf's beard, where the dwarf's
    strength lies, kill him, and then end the giant's own life. Dobrotek, aided by
    the Dappled Horse with Golden Mane, defeats the dwarf, recovers the sleeping Princess
    Pietnotka from under an invisible cap, and returns to the giant, who swallows
    the dwarf before Dobrotek destroys the giant's head. On the way home the magic
    horse restores Dobrotek's former appearance and departs. A rival knight then stabs
    the sleeping prince, carries Pietnotka to the king, and falsely claims to have
    rescued her. Dobrotek summons the magic horse, which brings three restorative
    waters from the Mountain of Eternal Life and revives him, telling him that only
    he can awaken Pietnotka by touching her with the dwarf's beard.
  language: English
  quote_policy: summarized
