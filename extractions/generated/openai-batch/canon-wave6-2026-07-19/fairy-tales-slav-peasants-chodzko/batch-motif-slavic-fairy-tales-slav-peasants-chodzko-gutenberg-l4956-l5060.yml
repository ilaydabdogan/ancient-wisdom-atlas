canonical_text:
  quote: ''
  summary: Niezguinek travels with a powerful speaking horse that warns him about
    old Yaga and supplies three magic objects for escape. After the eleven brothers
    arrive, the group enters Yaga's enclosed house and asks for her twelve daughters
    in marriage. Yaga receives them, arranges the brothers' and daughters' beds on
    opposite sides, and at midnight commands a guzla and sword to kill those on the
    right side. Niezguinek has switched the beds, so Yaga's daughters are killed instead.
    The brothers escape, and Yaga pursues them in a trough. Niezguinek delays her
    with a scarf that becomes a river, a handkerchief that becomes a lake, and a brush
    that becomes a forest. Yaga finally gives up after setting the forest on fire
    with fiery glances.
  language: English
  quote_policy: summarized
