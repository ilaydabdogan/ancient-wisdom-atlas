canonical_text:
  quote: ''
  summary: The king commands the herdsman's youngest son to fetch a cask of golden
    acorns. After refusing and being forced out by his brothers, the son goes to a
    mother oak, receives a feast-giving tablecloth, feeds an old beggar, trades the
    cloth for a beating wand, uses the wand to recover the cloth, and then feeds a
    hungry traveller who offers a lake-forming waistband.
  language: English
  quote_policy: summarized
