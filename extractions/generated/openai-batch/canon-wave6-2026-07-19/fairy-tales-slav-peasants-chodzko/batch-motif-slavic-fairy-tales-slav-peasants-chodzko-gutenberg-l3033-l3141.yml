canonical_text:
  quote: ''
  summary: The fisherman arrives at Kostey's courtyard with a flying carpet, invisible
    cap, and magic club. Kostey threatens the princess, who has sworn to marry only
    the man who can solve her six riddles. The fisherman commands the club to beat
    Kostey, but the immortal magician retaliates by poisoning the princess with his
    breath, changes into smoke, and escapes. The invisible fisherman carries the apparently
    dead princess outside. He captures a raven nestling and bargains with the father
    raven for Life-Giving Water, which revives the princess. The princess tells him
    of a golden-fruited apple-tree bearing a self-playing guzla whose music heals,
    cheers, beautifies, and breaks enchantments. The fisherman distracts the four
    guards with a shower of gold produced by his ring, takes the guzla, and flies
    away with the princess on the carpet. They return to a palace whose people remain
    motionless in enchanted sleep.
  language: English
  quote_policy: summarized
