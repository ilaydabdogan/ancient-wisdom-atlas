- id: obs:4
  text: Near the edge of the forest, George sees a spider devouring a fly; he sprinkles
    the spider with Water of Death and the fly with Water of Life, after which the
    fly frees herself and flies away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The revived fly tells George that by restoring her happiness he has assured
    his own, because she will help him recognize the Princess with the Golden Hair
    among her sisters.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
