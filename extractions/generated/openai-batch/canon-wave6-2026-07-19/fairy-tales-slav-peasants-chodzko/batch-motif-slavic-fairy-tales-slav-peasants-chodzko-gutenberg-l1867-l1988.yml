canonical_text:
  quote: ''
  summary: 'A king gives George a third task: obtain the Water of Death and the Water
    of Life. George is helped by ravens who bring the waters in gourds. He uses the
    waters to free and revive a fly, which later helps him identify Zlato Vlaska,
    the Princess with Golden Hair, among girls whose hair is concealed. George brings
    the princess back to the old king who sent him, but the old king executes him
    for taking the secret of animal language. Zlato Vlaska restores George by joining
    his severed body with the Water of Death and reviving him with the Water of Life.
    The old king tries to imitate the rejuvenation and dies. George is proclaimed
    king and Zlato Vlaska becomes queen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The king assigns George a third task: to bring the Water of Death and the
    Water of Life if the monarch who sent George is to receive the golden-haired daughter.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: George does not know where to find the waters, wanders until he reaches a
    dark forest, and calls for his little ravens.
  category: sequence
  evidence_refs:
