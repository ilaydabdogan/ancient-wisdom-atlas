canonical_text:
  quote: ''
  summary: 'A prince named Matthias travels to attempt a deadly three-night watch
    over a clever princess who has escaped all earlier suitors. On the road he recruits
    three extraordinary companions: Broad, who can swell into a barricade; Tall, who
    can stretch to the clouds and stride a mile; and a man with Eyes of Flame, who
    can ignite wood with his gaze. At the palace the king warns them that failure
    means death. They arrange themselves to guard the princess, who pretends to sleep
    and speaks of poppies falling on her eyelids; Matthias and his companions begin
    to grow drowsy.'
  language: English
  quote_policy: summarized
