canonical_text:
  quote: ''
  summary: The passage opens with a brief closing fragment from a preceding tale,
    then presents the tale “Time and the Kings of the Elements.” A loving husband
    finds his wife missing, travels in search of her, and consults the Water-King,
    Fire-King, and Air-King. He is directed to the Crystal Mountain, where witches
    and wizards say he must recognize his wife among two hundred identical women.
    His wife explains that a countryman used water to transform himself into a drake
    and her into a duck, compelling her to follow him. The husband climbs to the court
    of the King of Time, whose attendants sit around a fire; the King of Time rises
    from the flames and reveals that the wife can be known by a black thread in the
    shoe of her right foot. The husband uses this sign, breaks the spell, and returns
    home with his wife.
  language: English
  quote_policy: summarized
