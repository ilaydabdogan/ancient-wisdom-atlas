canonical_text:
  quote: ''
  summary: George continues a quest through a forest and to the sea. He saves helpless
    young ravens by feeding them his horse, frees a golden-scaled fish by buying it
    from disputing fishermen, learns of Princess Zlato Vlaska on an island, and asks
    her father for her hand on behalf of his master. The king sets three tasks. In
    the first two shown here, ants recover scattered pearls and a freed fish helps
    retrieve a gold ring from the sea.
  language: English
