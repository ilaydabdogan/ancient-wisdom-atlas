canonical_text:
  quote: ''
  summary: The widow's youngest daughter spends a night in a haunted room, kindly
    offers food, table, and bed to a mysterious young man, follows him through a precipice
    into a golden and silver otherworld, takes two metal branches, returns with him,
    and later learns that her act has broken his enchantment. The young man is recognized
    as the nobleman's long-lost son; the branches become gold and silver palaces,
    and he marries the girl.
  language: English
  quote_policy: summarized
