canonical_text:
  quote: ''
  summary: A fool demonstrates a feast-giving tablecloth, then resists the king's
    attempts to take his magical objects by using a self-acting wand, a lake-forming
    waistband, and a firing helmet. The king promises half his kingdom and his daughter
    in exchange, but after the fool comes to court with the objects, the paladin has
    him seized and killed treacherously.
  language: English
  quote_policy: summarized
