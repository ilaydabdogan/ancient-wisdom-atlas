canonical_text:
  quote: It was a soundless land, without voice or movement; on all sides calm, death,
    sleep.
  summary: A land lies under an enchanted spell in which people, animals, water, and
    wind are motionless. In the king's banqueting hall, the fisherman uses a magic
    guzla to awaken the sleepers. The king, after hearing the princess recount the
    fisherman's deeds, relents and agrees to the marriage. The princess requires the
    fisherman to solve six riddles according to a vow she made in Kostey's palace.
    He answers all six, receives the king's blessing, marries the princess, and is
    rewarded with half the kingdom and succession to the throne.
  language: English
  quote_policy: quoted
