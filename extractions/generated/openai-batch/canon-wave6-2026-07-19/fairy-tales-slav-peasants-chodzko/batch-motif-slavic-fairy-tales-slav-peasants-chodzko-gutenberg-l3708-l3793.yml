canonical_text:
  quote: ''
  summary: Prince Slugobyl, serving under a false claimant, is asked to destroy a
    besieging army so the false prince can receive credit. Slugobyl summons the Invisible
    Knight, who calls a fiery magical horse, and together they defeat the invaders.
    The princess witnesses the truth, later exposes the impostor by means of a document,
    and Slugobyl marries her after the traitor is punished.
  language: English
  quote_policy: summarized
