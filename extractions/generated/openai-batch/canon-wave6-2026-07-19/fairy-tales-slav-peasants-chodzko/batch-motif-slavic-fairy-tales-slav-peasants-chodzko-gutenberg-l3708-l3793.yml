- id: obs:1
  text: The pretended servant asks Slugobyl to go outside the town and destroy the
    besieging army in a way that makes everyone believe the pretended servant did
    it, promising to return the document renouncing Slugobyl's title and service.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Slugobyl puts on armour, mounts his horse, rides outside the city gates, and
    calls three times to the Invisible Knight.
