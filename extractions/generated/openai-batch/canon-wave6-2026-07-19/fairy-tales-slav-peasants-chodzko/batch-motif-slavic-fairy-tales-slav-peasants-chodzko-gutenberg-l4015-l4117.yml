canonical_text:
  quote: ''
  summary: An imprisoned princess prays to the rising sun, who tells her that Prince
    Junak is coming but needs special means to defeat Kostey. The sun advises Junak
    to abandon his army, seek old Yaga, and first recover a hidden enchanted horse
    and invisible club found beyond three oaks and an iron door. Junak follows the
    directions, dismisses the army by casting away the magic ring, releases the speaking
    war-horse, takes the club, travels by air to Yaga’s silent forest, commands her
    cock-footed turning house to admit him, and is hosted by Yaga before telling her
    his plans.
  language: English
  quote_policy: summarized
