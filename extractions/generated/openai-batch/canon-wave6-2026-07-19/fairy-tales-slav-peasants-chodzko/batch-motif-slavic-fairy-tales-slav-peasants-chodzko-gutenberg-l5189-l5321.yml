canonical_text:
  quote: ''
  summary: Niezguinek returns to the king with a magical guzla whose music causes
    dancing, healing, and gladness. His jealous brothers forge letters in his name,
    causing the king to command him to obtain a self-striking sword from old Yaga's
    house. With help from his flying horse and a holy chalk circle, Niezguinek defeats
    and gains obedience from the sword. The king uses the sword to destroy an attacking
    army, rewards Niezguinek again, and the brothers initiate another plot involving
    Princess Sudolisu.
  language: English
