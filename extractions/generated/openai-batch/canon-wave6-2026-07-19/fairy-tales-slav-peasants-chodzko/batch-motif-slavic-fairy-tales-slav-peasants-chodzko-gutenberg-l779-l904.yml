canonical_text:
  quote: ''
  summary: 'The passage closes one tale by reporting Marouckla''s survival, inheritance,
    marriage, and peaceful life after her stepmother and sister die frozen on a mountain.
    It then begins the tale of Plavacek: a hunting king loses his way and sleeps in
    a charcoal-burner''s loft while a son is born below. Three Soudiche or Fates appear
    and grant the newborn a destiny involving danger, survival, long life, and marriage
    to the king''s newly born daughter. The king tries to thwart this by taking the
    child and ordering his drowning, but the baby survives in a basket on the river,
    is rescued and adopted by a fisherman and his wife, and is named Plavacek. Years
    later the king recognizes the youth as the exposed child and sends him with a
    sealed letter ordering his execution. Plavacek loses the path in the forest at
    night and meets an old woman.'
  language: English
  quote_policy: summarized
