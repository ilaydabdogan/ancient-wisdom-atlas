canonical_text:
  quote: ''
  summary: The youngest son Niezguinek prepares heavy iron weapons, captures a speaking
    white mare with twelve colts, and frees her in exchange for the colts. His parents
    then send their sons to seek old Yaga's twelve daughters as wives. The weakest
    horse, left to Niezguinek, reveals itself as the son of the Dappled Horse with
    the Golden Mane and instructs him to kill and bury it under earth and manure,
    sow wheat over it, and feed it the ripe grain. After twelve days the horse revives,
    full of life, and Niezguinek mounts it to go to old Yaga's house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Niezguinek has an iron club made; the first heavy club breaks in testing,
    while the second, heavier club does not break, and he also obtains a noose made
    from twelve strong ropes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At midnight a loud noise and bright light appear from the east, and a white
    mare with twelve white colts comes to the haycock and begins to eat it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Niezguinek throws the noose over the mare, mounts her, strikes her with the
    club, and the mare is unable to follow the escaping colts.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The mare speaks in human language, asks Niezguinek not to choke her, warns
    him about her husband, and offers her twelve colts in exchange for her freedom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The colts return when their mother neighs; Niezguinek releases the mare, leads
    the colts home, and the brothers choose horses, leaving the thinnest and weakest-looking
    one for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father says old Yaga is a lame witch who travels in an oaken trough, supports
    herself on iron crutches, removes her tracks with a broom, and has twelve beautiful
    daughters with dowries.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The parents bless their sons and command them not to return without bringing
    old Yaga's daughters; the brothers ride away, while Niezguinek remains behind
    and weeps in the stable.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Niezguinek's horse speaks, identifies itself as the son of the Dappled Horse
    with the Golden Mane, and says it can receive the same power if Niezguinek follows
    its instructions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The horse instructs Niezguinek to kill it, bury it under earth and manure,
    sow wheat over it, harvest the ripe grain, and place some grain near its body.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Niezguinek kills the horse, covers it with earth and manure, sows wheat, and
    the wheat is watered by rain, warmed by the sun, and ripe by the twelfth day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Niezguinek places grain before the horse's bones; the horse moves, eats the
    wheat, springs up full of life, and carries Niezguinek toward old Yaga's house.
  category: sequence
  evidence_refs:
  - ev:6
