canonical_text:
  quote: ''
  summary: A bride leaves her mother without farewell or blessing and travels with
    her husband by golden carriage to a cavern beneath a high rock. The giant Zemo-tras
    seals the entrance behind them. Dwarfs with torches welcome King Kovlad, and the
    bride learns that her husband is Kovlad. They pass through an underground realm
    of lead forests, metal mountains, and a golden palace. At the feast, all food
    and bread are made of brass, silver, or gold, so the young wife cannot eat. She
    realizes she is in Kovlad’s power and must live underground with him, the God
    of Metals, because she desired only gold.
  language: English
