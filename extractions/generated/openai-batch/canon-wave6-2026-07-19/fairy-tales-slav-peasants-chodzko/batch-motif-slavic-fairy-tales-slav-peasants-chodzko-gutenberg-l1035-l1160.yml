canonical_text:
  quote: ''
  summary: The Fate identifies Dede-Vsevede as her son, the shining Sun, and hides
    Plavacek under a bucket. The Sun returns at evening as an old man with golden
    hair. While he sleeps, the Fate pulls three golden hairs and asks, as dreams,
    about a dried-up healing well, a barren youth-restoring apple-tree, and a trapped
    ferryman. The Sun explains that a frog blocks the spring, a snake harms the tree
    roots, and the ferryman can free himself by handing his oars to the next comer.
    At morning the Sun is a golden-haired child and leaves through the eastern window.
    Plavacek receives the hairs, repeats the answers, restores the well and tree,
    tells the ferryman the solution, gains horses and wealth, and returns to his wife
    and royal father-in-law.
  language: English
  quote_policy: summarized
