canonical_text:
  quote: ''
  summary: 'After replacing a black bridle with a golden one, the prince is caught
    while trying to take the Horse with the Golden Mane. The king who owns the horse
    says he will give it only if the prince brings the Maiden with the Golden Locks
    from the golden castle by the Black Sea. The red fox rebukes the prince but guides
    him to the Queen of the Ocean Kingdom and tells him to choose the plainly dressed
    daughter. The prince chooses the white-clad maiden among three similar princesses,
    then later identifies her again by a small fly she has told him to watch for.
    The queen next sets an impossible task: emptying a fish-pond with a golden sieve
    before sunset. The maiden in white finds the prince despairing and reassures him.'
  language: English
  quote_policy: summarized
