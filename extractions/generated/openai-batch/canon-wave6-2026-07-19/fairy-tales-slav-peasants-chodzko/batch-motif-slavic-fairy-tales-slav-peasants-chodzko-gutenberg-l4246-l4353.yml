canonical_text:
  quote: ''
  summary: A king and queen keep their beautiful only daughter secluded until she
    hears a cuckoo and later longs to go outside. After she enters the garden and
    wanders from her governesses, a hurricane identified as Vikher carries her away.
    The king promises her hand and kingdom to whoever returns her. Two brother princes
    search for her, reach a country at the earth's center with simultaneous summer
    and winter, climb a mountain, and see a silver palace on a cock's foot with golden
    hair at a window, but a violent north wind freezes them to death. Their parents
    mourn; after the queen gives alms to a poor old man, he announces that God has
    taken pity and that she will bear an extraordinary son, then vanishes.
  language: English
  quote_policy: summarized
