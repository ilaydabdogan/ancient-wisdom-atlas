canonical_text:
  quote: At midnight Ohnivak, the bird of fire, flew down and alighted upon the tree
  summary: A king's central apple tree bears a golden apple each day, but the fruit
    disappears. The two elder sons fail to guard it because they fall asleep. The
    youngest son keeps awake with a hedgehog skin, wounds Ohnivak the firebird as
    it tries to take the apple, and obtains a luminous feather. The king becomes ill
    with desire to hear the bird sing and sends his three sons to capture it, promising
    succession. The brothers split at a three-way road and plant branch tokens; the
    eldest later meets a speaking red fox on a mountain and shoots at it.
  language: English
  quote_policy: quoted
