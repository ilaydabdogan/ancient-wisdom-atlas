canonical_text:
  quote: ''
  summary: Jean seeks permission to marry Annette and is sent to ask the Sun and Moon
    why they do not act at all times. On his journey he also accepts questions about
    a fruitless pear-tree and a spoiled well. The Sun and Moon explain the cosmic
    order and reveal remedies for the tree and well, and Jean returns to carry out
    the remedies and receive gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jean and Annette are two young people who love each other; Annette is a rich
    farmer's daughter, while Jean is the son of a poor mountain shepherd.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Annette is described as sweet like a dove and strong and brave like an eagle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Annette's father tells Jean that, to marry Annette, he must ask the Sun why
    he does not warm the night as well as the day and ask the Moon why she does not
    shine by day as well as by night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father promises Jean Annette and his wealth if Jean returns with the requested
    answers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jean leaves Annette and sets out in search of the Sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: People in a small town ask Jean to inquire why their finest pear-tree, formerly
    fruitful, has ceased to bear fruit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a land without drinking water, inhabitants ask Jean to inquire why their
    chief well no longer gives good water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jean reaches the Sun's abode while the Sun is about to begin his travels around
    the world.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sun says that if he warmed or lit the earth by night as well as by day,
    the world and everything on it would soon be burnt up.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Sun identifies the Moon as his sister and says she can answer the questions
    about the pear-tree and the well.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Moon says that if she lit the world by day as well as by night, plants
    would produce neither fruit nor flower; she also says she supplies dew that makes
    the earth fertile and fruitful.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Moon explains that the pear-tree became barren after a child of the king's
    eldest daughter died and was buried under it; Christian burial of the child will
    restore the tree's blossom and fruit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Moon explains that an enormous toad under the mouth of the well continually
    poisons it; breaking the brim and killing the toad will restore the water.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Jean returns to the waterless land, gives the Moon's instructions, and the
    people find and kill the toad; the water becomes pure, transparent, and sweet
    again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Jean reports the Moon's directions about the tree; after they are carried
    out, the tree blossoms immediately, and Jean receives gifts and a valuable horse.
  category: sequence
  evidence_refs:
  - ev:10
