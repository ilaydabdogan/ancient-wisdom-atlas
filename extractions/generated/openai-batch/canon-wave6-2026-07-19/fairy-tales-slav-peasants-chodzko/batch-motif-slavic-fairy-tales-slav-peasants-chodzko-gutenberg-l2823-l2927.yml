  quote: ''
  summary: A fisherman uses an enchanted club and flying carpet to return to a besieged
    royal capital. He defeats the foreign army with the club, reveals himself as the
    promised savior, accuses the chamberlain of earlier treachery, and is again promised
    the princess and royal succession. The king, unwilling to accept a peasant son-in-law,
    pretends friendship and proposes a journey by flying carpet to the Valley of Diamonds
    for a wedding gift.
