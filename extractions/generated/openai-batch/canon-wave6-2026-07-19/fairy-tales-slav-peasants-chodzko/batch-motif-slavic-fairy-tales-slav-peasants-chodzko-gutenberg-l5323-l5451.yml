canonical_text:
  quote: '"Beyond the nine kingdoms, far beyond the ocean, within a silver vessel
    with golden masts lives Princess Sudolisu."'
  summary: A king orders Niezguinek to fetch Princess Sudolisu from a silver vessel
    beyond the ocean. Niezguinek's speaking horse carries him there, explains that
    old Yaga has locked the princess in the ship, and instructs him to kill the horse,
    use its entrails to obtain the diamond key from the King of the Crawfish, and
    then revive the horse with three marvellous waters fetched by a raven. Niezguinek
    obtains the key, revives the horse, and summons the ship to shore.
  language: English
  quote_policy: quoted
