canonical_text:
  quote: ''
  summary: Niezguinek and his brothers arrive near a besieged town. At night, with
    advice from his talking horse, Niezguinek scatters the herb of Sleep over the
    enemy camp, captures the enemy king, and causes the besieging army to retreat.
    The rescued ruler rewards him with military rank, provoking jealousy among his
    brothers. They forge a letter in his name promising to fetch old Yaga's marvellous
    guzla. Under threat of execution, Niezguinek rides his flying horse to Yaga's
    dwelling, uses herbs to induce sleep and open doors, finds Yaga asleep with her
    trough, iron crutches, magic sword, and guzla, and takes the guzla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travellers see flames, infer what has happened, thank God for preservation,
    continue their journey, and arrive by evening at the top of a steep hill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: From the hill they see a town besieged by foreign troops who have destroyed
    the outer part and plan to storm it at daylight.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The twelve brothers hide behind the enemy; all sleep except Niezguinek, who
    keeps watch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Niezguinek asks his horse how they can put the soldiers to sleep and seize
    the enemy king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The horse says dried leaves of the herb of Sleep are in the saddle pocket
    and instructs Niezguinek to scatter fragments over the camp to make the soldiers
    sleep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Niezguinek speaks magic words, the horse rises into the air and hovers
    over the camp while Niezguinek sprinkles the herb of Sleep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: All in the enemy camp, including sentinels, fall into heavy sleep; Niezguinek
    enters the tent and carries off the sleeping enemy king.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At daybreak the besieging soldiers awake, discover their king is missing,
    panic, and retreat in disorder.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Niezguinek delivers the captured enemy king to the ruler of the besieged city.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ruler rewards Niezguinek by making him a general, while the eleven brothers
    receive officer rank.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Niezguinek's success and appearance in command cause jealousy, including among
    his own brothers, who decide to ruin him.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The brothers forge a note in Niezguinek's handwriting saying he will fetch
    a marvellous guzla from old Yaga's house.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The king orders Niezguinek to fetch old Yaga's guzla and threatens execution
