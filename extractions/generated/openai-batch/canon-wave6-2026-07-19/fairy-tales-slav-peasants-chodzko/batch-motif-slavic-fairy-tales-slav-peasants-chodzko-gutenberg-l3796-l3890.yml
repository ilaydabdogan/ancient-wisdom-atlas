canonical_text:
  quote: ''
  summary: A childless queen travels with twelve maids, becomes lost on the steppes,
    and encounters an armored horseman at a stone column who identifies himself as
    the Master Spirit of the Steppes and demands kisses as payment for showing the
    road. After the queen and maids comply, the horseman and column vanish and the
    road appears. Later the queen and each maid give birth to a girl; the princess
    has shining eyes. Ministers warn the king that the Spirit has presented thirteen
    girl babies and demand their deaths. The king orders them thrown into the sea,
    but the queen persuades him to spare them by leaving them on a desert island.
    The princess is placed in a golden cradle, the other babies in copper cradles,
    and the narration says God cares for little children.
  language: English
  quote_policy: summarized
