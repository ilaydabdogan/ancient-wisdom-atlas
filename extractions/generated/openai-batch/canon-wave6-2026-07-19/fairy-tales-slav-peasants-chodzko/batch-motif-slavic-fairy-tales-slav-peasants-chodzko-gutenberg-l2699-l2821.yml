canonical_text:
  quote: ''
  summary: 'A fisherman tells the king that he is a common subject whose gold comes
    from a magic ring. The king resents owing safety and a marriage promise to a peasant.
    The chamberlain tricks the fisherman, takes the ring, and throws him from a tower
    into a river. A mysterious old man rescues him in a boat, explaining that pity
    shown to others deserves help. Later the fisherman encounters two demons quarreling
    over three magical objects from a damned sinner: a flying carpet, a self-striking
    club, and an invisibility cap. The fisherman tricks the demons with a rolling-stone
    contest, takes the objects, and rises into the air on the carpet.'
  language: English
  quote_policy: summarized
