canonical_text:
  quote: '"to gain happiness, knowledge, and wisdom, and to return a better man"'
  summary: Prince Slugobyl leaves home on a long journey with a servant. He rescues
    a white swan, who reveals herself as the daughter of the Invisible Knight and
    promises aid through a threefold summons. In a desolate plain the thirsty prince
    descends into a well; his servant threatens to drown him, forces him to surrender
    his name and rights in writing, exchanges clothes with him, and presents himself
    at another king's palace as the prince. The false prince demands the king's daughter
    and is told he must first free the city from a besieging army.
  language: English
  quote_policy: quoted
