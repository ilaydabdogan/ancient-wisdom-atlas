canonical_text:
  quote: ''
  summary: A widow's proud daughter repeatedly dreams of increasingly splendid suitors
    and wedding honors. Each day a real invitation or suitor appears and is rejected
    until three metal carriages arrive, including a golden carriage with a prince
    who matches the final dream. The daughter accepts him, exchanges an aigrette for
    a star-like ring and a golden mantle, and the widow anxiously asks what bread
    her daughter will share in his house.
  language: English
  quote_policy: summarized
