canonical_text:
  quote: '"You have fed me well, in return I will serve you well; mount your horse
    and follow me."'
  summary: The second brother refuses and attacks a famished red fox. The youngest
    prince feeds the fox, who becomes his guide and helper in the quest for the Bird
    of Fire. The fox instructs him to take the bird only in a wooden cage, but the
    prince uses the golden cage, causing an alarm and capture. Before the king, the
    prince explains that the bird stole golden apples from his father's tree and that
    its song can heal his father. The king demands the golden-maned horse Zlato-Nrivak
    in exchange. The fox renews his help and guides the prince to a silver castle
    where the horse eats fire from a silver trough.
  language: English
  quote_policy: quoted
