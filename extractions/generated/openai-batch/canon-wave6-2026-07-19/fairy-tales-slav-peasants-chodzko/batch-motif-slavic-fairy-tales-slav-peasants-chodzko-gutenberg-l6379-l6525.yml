canonical_text:
  quote: ''
  summary: An old man dies leaving property to his sons. The elder brothers take control
    of the youngest brother's money by promising clothing, then leave as merchants.
    The youngest, described as idle and foolish, is sent for water, captures a speaking
    pike, and releases it after receiving a formula that fulfills his wishes. He uses
    the formula to summon food, make pails walk home, make a hatchet chop wood, make
    a sledge travel, and make wood and faggots attack men who try to beat him. His
    fame reaches the king, who sends soldiers; a soldier strikes him, and the passage
    ends as he begins to respond.
  language: English
  quote_policy: summarized
