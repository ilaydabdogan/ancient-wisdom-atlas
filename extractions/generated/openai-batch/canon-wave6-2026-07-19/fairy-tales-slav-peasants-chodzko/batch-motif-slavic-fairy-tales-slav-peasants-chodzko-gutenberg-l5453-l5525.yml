canonical_text:
  quote: ''
  summary: Niezguinek breaks into a guarded place, finds Princess Sudolisu, renders
    her unconscious with an herb, and transports her by flying horse to the king.
    The princess rebukes the king and says a husband must possess triple youth. She
    demonstrates a sword-based rejuvenation ritual on Niezguinek, killing, dismembering,
    washing, reassembling, and breathing life into him. When the old king asks for
    the same treatment, she kills and dismembers him but has his pieces eaten by dogs.
    She tells Niezguinek to proclaim himself king; they marry, and magical sword-guardians
    and music accompany the celebration.
  language: English
  quote_policy: summarized
