canonical_text:
  quote: ''
  summary: A fisherman uses a charm addressed to a gold-giving ring in the name of
    a golden fishling, causing gold to fall amid storm signs. He reassures his mother,
    leaves home with her blessing to serve the king, and reaches a besieged capital.
    When enemies demand an immense gold ransom, the king promises his daughter, half
    the kingdom, and succession to anyone who can defeat the foes or provide the money.
    The fisherman publicly summons enough gold to pay the ransom and enrich the treasury;
    the enemies depart, and the king offers the promised dynastic reward while asking
    about the fisherman's identity and power.
  language: English
  quote_policy: summarized
