canonical_text:
  quote: ''
  summary: An elderly childless couple grieve on their diamond wedding day. A white-haired
    beggar asks for charity; the old woman gives him half of her last loaf, and he
    promises family and fortune by God's grace. He vanishes and is identified as an
    angel. His stick leads the couple to a nest of twelve eggs, from which twelve
    boys hatch after twelve hours while the shells become gold. The youngest boy,
    later named Niezguinek or Imperishable, grows rapidly, shows unusual size and
    strength, briefly disappears at his christening and emerges from the priest's
    sleeve. As a young man he uses twelvefold farm implements and produces a huge
    haycock; meanwhile the brothers fail to stop the night-time disappearance of the
    haycocks.
  language: English
  quote_policy: summarized
