canonical_text:
  quote: ''
  summary: A rich nobleman and his wife, long childless, pray for a son, and God sends
    them one. The father dreams that the child must not touch the earth until age
    twelve; near the end of that period a frightened nurse drops him, and he vanishes.
    Years later midnight footsteps and groans are heard in a castle room; the nobleman
    offers a reward for a night watch. A poor miller’s eldest daughter, then her second
    daughter, each watches, prepares food, a table, and a bed, and each answers a
    young stranger’s questions by saying the provisions are for herself; the stranger
    weeps, waves his arms, and disappears.
  language: English
  quote_policy: summarized
