canonical_text:
  quote: ''
  summary: Matthias, the princess, and their companions flee from royal pursuers.
    A river and Tall’s darkening of the sun delay the soldiers. Broad then swallows
    the pursuing army after they mistake his open mouth for a city gate, later releasing
    them in Matthias’ palace square. A wedding feast follows for Prince Matthias and
    the princess; the princess’s father attends and accepts the marriage, and Matthias
    rewards his companions.
