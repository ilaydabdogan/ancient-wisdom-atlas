canonical_text:
  quote: ''
  summary: A young man finds a portrait of his sister marked by pearls, roses, and
    gold-fish, becomes a royal under-gardener, and shows the portrait to a king. The
    king seeks to marry the sister, who is said to have received a divine favor causing
    her tears, smiles, and touch in water to produce pearls, roses, and gold-fish.
    The stepmother learns sorcery, transforms the step-child into a wild-duck, and
    substitutes her own daughter as the bride. At the wedding feast, the substitute
    produces toads, lizards, and serpents instead of the expected marvels. The king
    kills the young man in anger, and the bride secures an honorable burial for him.
  language: English
  quote_policy: summarized
