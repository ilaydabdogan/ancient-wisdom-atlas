canonical_text:
  quote: ''
  summary: A wise king receives a curious fish from an old woman; she says that eating
    it grants understanding of birds, land animals, and fish. The king orders his
    servant George to cook it and forbids him to taste it on pain of death. George
    tastes it and begins hearing flies, geese, horses, and birds speak. The king suspects
    him, tests him with a wine-pouring command, and George fails after hearing birds
    quarrel over golden hairs from the Maid with Locks of Gold. The king spares George
    only if he brings the maid for the king to marry. George sets out and, at the
    edge of a dark forest, saves ants and their eggs from a burning bush.
  language: English
  quote_policy: summarized
