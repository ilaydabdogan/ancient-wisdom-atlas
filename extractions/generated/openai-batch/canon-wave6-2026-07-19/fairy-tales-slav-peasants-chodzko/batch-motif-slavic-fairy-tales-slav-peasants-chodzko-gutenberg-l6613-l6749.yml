canonical_text:
  quote: ''
  summary: Helen, the lazy only daughter of a poor woman, is punished at a stream
    and then sold to the Lord of the Red Castle after her mother claims she can spin
    hemp into gold thread. The prince locks Helen in a room full of hemp and says
    he will marry her if she spins it into gold thread. An uncanny little man in a
    red cap and strange boots offers to do the work in three days if she can guess
    his right name and the material of his boots. Helen feeds a hungry white-haired
    old man with her dinner; after the second day he reports seeing the little man
    in the forest by burning wood and nine iron pots, singing that his name is Kinkach
    Martinko and his boots are made of dog skin. The old man vanishes, and Helen memorizes
    the information.
  language: English
  quote_policy: summarized
