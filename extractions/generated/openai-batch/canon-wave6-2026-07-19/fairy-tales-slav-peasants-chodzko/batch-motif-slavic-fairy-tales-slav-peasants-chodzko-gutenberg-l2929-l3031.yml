canonical_text:
  quote: ''
  summary: The king and the fisherman fly to an inaccessible diamond valley. The king
    tricks the fisherman into leaving the carpet, uses magic words to depart with
    the diamonds, and stores the treasures, ring, and carpet in the royal treasure-house.
    The fisherman is stranded among rocks, hunger, and serpents, survives in a tree
    with his magic cap and club, and later uses the club to destroy attacking snakes.
    An old man rescues him, explains that the king has been punished by siege and
    enchanted sleep, and that Kostey has carried off the princess after advice from
    Yaga. The fisherman returns invisibly to the sleeping city, recovers the ring
    and carpet, and flies away to continue the rescue.
  language: English
  quote_policy: summarized
