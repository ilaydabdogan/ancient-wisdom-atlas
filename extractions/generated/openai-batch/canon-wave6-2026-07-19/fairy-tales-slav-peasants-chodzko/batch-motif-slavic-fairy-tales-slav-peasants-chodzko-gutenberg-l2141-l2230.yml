canonical_text:
  quote: Pietnotka was borne up high as the highest clouds, and then right down to
    an underground palace.
  summary: A beautiful princess chooses Prince Dobrotek, but a rejected dwarf prince
    and magician transforms into a whirlwind and abducts her to an underground palace.
    She gains his invisibility cap, escapes into the garden, taunts him, is recaptured
    when the cap catches on a bush, and he prepares to fight an approaching assailant.
    Meanwhile the king and princes begin a search, with threats and rewards attached
    to her recovery.
  language: English
  quote_policy: quoted
