canonical_text:
  quote: ''
  summary: Princess Sudolisu grows in beauty under the care of natural forces and
    animals. Her eyes can bring joy or freeze opponents into ice. Suitors come and
    are refused; violent challengers are destroyed. The underground ogre Kostey sees
    her, desires her, tries to seize her, is frozen by her gaze, then revives and
    enchants her kingdom into sleep. He imprisons her palace behind an iron wall guarded
    by a twelve-headed dragon and offers to make her Queen of the Nether World. The
    princess remains awake and silent, longs for the knight of her dreams, and asks
    cloud, breeze, star, and moon whether he loves her; the moon directs her to the
    sun.
  language: English
  quote_policy: summarized
