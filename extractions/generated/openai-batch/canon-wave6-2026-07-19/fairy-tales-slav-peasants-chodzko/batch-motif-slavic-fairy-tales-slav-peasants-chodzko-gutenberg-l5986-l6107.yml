canonical_text:
  quote: he rose again perfect in form, and having about him no wound scars
  summary: After the elder brothers return with the horse, fire-bird, and princess
    but without the youngest prince, the palace falls into grief. A red fox obtains
    Water of Death and Water of Life from a raven, tests them on a young raven, and
    restores the dismembered prince. The prince returns in peasant disguise as a stable-boy;
    his horse, the fire-bird, and the golden-haired princess recognize him, and the
    bird's song revives the sick king.
  language: English
  quote_policy: quoted
