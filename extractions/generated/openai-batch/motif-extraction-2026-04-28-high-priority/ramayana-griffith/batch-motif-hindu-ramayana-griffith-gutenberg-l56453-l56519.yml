  summary: Rama orders Vibhishan to reward the allied hosts with treasure, boards
    the radiant car with Sita and Lakshman, bids farewell to Sugriva, Vibhishan, the
    Vanars, and the giants, and prepares to leave Lanka. The allies ask to accompany
    him to Ayodhya to witness his consecration before returning home. Rama welcomes
    them aboard, and the wondrous car rises through the clouds carrying the kings
    and chiefs.
