  summary: Rama admires a pleasant riverside woodland by the Godavari and asks Lakshman
    to build a cot there. Lakshman constructs a leafy hermitage, bathes in the river,
    gathers lilies, fruit, and berries, performs sacrifice, and shows the dwelling
    to Rama. Rama embraces and praises Lakshman, then remains content there with Lakshman
    and Sita.
