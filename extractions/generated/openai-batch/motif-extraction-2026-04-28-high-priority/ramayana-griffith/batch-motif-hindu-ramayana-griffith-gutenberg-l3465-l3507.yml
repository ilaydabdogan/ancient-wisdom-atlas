canonical_text:
  quote: ''
  summary: A saintly hermit receives pleasing words and blesses the king, ministers,
    and town. Servants report the good news to the king, who comes with a guest-gift,
    bows, and asks forgiveness for having enticed the saint's son away. The Brahman
    reassures him. The saint is honored in procession, greeted by a reverent crowd,
    and shown Śántá as his son's bride. He embraces her as his daughter; she bows
    with joined palms. The saint performs a rite for his son that removes stain and
    departs with him to the wood.
  language: English
  quote_policy: summarized
