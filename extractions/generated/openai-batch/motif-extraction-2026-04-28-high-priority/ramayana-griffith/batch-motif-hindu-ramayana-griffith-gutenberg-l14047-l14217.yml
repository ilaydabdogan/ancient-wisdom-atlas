canonical_text:
  quote: ''
  summary: Rama tells Sita that his father’s earlier boons to Kaikeyi require Rama
    to spend fourteen years in Dandak forest and Bharat to receive the throne. He
    instructs Sita to remain in Ayodhya, honor the king, queens, Bharat, and Shatrughna,
    and keep her vows. Sita rejects separation, argues that a wife shares her husband’s
    fate, asks to go before Rama through the forest, describes the woodland life she
    will accept with him, and swears to die if deprived of him. Rama still tries to
    dissuade her by describing the hardships of forest life.
  language: English
