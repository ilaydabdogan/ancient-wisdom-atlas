canonical_text:
  quote: ''
  summary: After Ravan's death, heaven rejoices and Rama honors his allies. Rama orders
    Lakshman to consecrate Vibhishan as lord of Lanka using sea water in a golden
    urn. Rama then sends Hanuman to Sita with news of victory. Hanuman finds Sita
    beneath a tree in a guarded garden, delivers Rama's message, and tells her that
    Ravana is dead and Lanka is won. Sita rejoices, refuses Hanuman's offer to kill
    her guards, and says her only wish is to see Rama. Hanuman promises that she will
    see Rama before the sun sets and returns with her message.
  language: English
  quote_policy: summarized
