canonical_text:
  quote: ''
  summary: Hanuman gives Sita Rama’s engraved ring as a token. Sita recognizes him
    as Rama’s messenger and asks about Rama, Lakshmana, and possible aid. Hanuman
    reports Rama’s grief and promises that Rama will come with the vanara hosts, bridge
    the sea, and destroy the giant city. Sita replies with grief and hope, reports
    Ravana’s deadline and ignored counsel, and affirms her trust in Rama. Hanuman
    offers to carry her back across the sea, enlarges himself to show his power, but
    Sita refuses because of fear of the flight and because she will not willingly
    touch another male body. Hanuman accepts her reasoning and asks for a recognizable
    token, a gem, to take back to Rama.
  language: English
  quote_policy: summarized
