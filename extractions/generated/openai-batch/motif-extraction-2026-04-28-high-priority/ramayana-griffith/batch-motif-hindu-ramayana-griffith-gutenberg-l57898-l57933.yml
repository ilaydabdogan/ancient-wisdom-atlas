canonical_text:
  quote: ''
  summary: Lakshman interrupts Rama's interview with Time to report Durvasas's message,
    accepting that death will result. Rama abandons Lakshman, who goes to the Sarayu,
    suppresses his senses, and is conveyed bodily to heaven by Indra. Rama then undertakes
    a great departure with his brothers, subjects, divine powers, sacred forms, and
    attendants; at the Sarayu, Brahma and the gods appear. Rama enters the waters,
    is addressed as Vishnu, enters the glory of Vishnu with his followers, and secures
    a celestial abode for the devoted people who accompanied him.
  language: English
  quote_policy: summarized
