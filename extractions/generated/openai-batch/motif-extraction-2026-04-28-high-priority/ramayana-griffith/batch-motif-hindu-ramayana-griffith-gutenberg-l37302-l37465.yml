  quote: ''
  summary: Lakshman counsels the grieving Rama to master sorrow and begin the search
    for Sita. Rama regains resolve, and the brothers travel toward Rishyamuka. Sugriva
    and the Vanars see the armed brothers, fear they may be spies of Bali, and flee
    to higher refuge. Hanuman advises Sugriva to dismiss his fear because Bali cannot
    harm him on Malaya hill and urges prudent judgment.
