canonical_text:
  quote: ''
  summary: Saramá comforts Sítá by describing the mustering of Ráma’s forces and promising
    that Ráma will defeat Rávaṇ and free her. Sítá asks Saramá to learn Rávaṇ’s plans.
    Saramá secretly hears the council, where Rávaṇ’s mother and elder nobles urge
    him to restore Sítá to Ráma, but Rávaṇ refuses. Battle sounds from Ráma’s approaching
    army frighten Lanká’s defenders, and Rávaṇ briefly quails before addressing his
    counsellors.
  language: English
