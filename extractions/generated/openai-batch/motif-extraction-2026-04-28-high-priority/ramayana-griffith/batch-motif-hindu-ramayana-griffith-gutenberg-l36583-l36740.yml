canonical_text:
  quote: ''
  summary: Kabandha ascends after regaining a radiant form and directs Rama toward
    Sugriva. Rama and Lakshman travel to Pampa and meet the aged devotee Savari, who
    receives them with hospitality. Savari recounts the promise of her former saintly
    masters that Rama would visit her and that she would then attain blessed worlds.
    She shows Rama the sacred grove, altar, lakes, garments, and unfading flowers
    associated with those ascetics. With Rama's permission, she casts off her mortal
    body in fire and rises heavenward in celestial form.
  language: English
