canonical_text:
  quote: ''
  summary: A monkey narrator is presented to the Sultan and displays courtly awareness,
    writing, poetry, and chess skill. The Sultan summons his daughter, Queen of Beauty,
    who veils herself and reveals that the monkey is an enchanted young prince. She
    explains that she learned magic and can recognize enchanted persons. At the Sultan's
    request she prepares a disenchantment rite with an engraved knife, a secret court,
    a written circle, and Koranic verses. Darkness falls, and the genius responsible
    for the spell appears as a colossal lion; the princess and the genius accuse one
    another of breaking a treaty.
  language: English
  quote_policy: summarized
