canonical_text:
  quote: ''
  summary: Camaralzaman falls into despair after separation and is moved with his
    father to an island castle. The Princess of China is returned by genii to her
    own bed, wakes alone, insists that a young man slept beside her, and shows a ring
    as proof. Her parents treat her claim as madness and confine her. The king offers
    her hand and succession to anyone who cures her, with death as the penalty for
    failure; suitors die. Marzavan, the nurse's son and the princess's foster-brother,
    secretly visits her, hears her account, and departs to search other countries
    for the absent beloved.
  language: English
  quote_policy: summarized
