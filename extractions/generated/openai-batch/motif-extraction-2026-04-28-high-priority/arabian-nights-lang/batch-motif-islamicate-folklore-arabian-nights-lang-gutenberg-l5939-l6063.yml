canonical_text:
  quote: ''
  summary: A princess awakens beside the magically sleeping Prince Camaralzaman, admires
    him, notices her ring on his finger, kisses him, and falls asleep. Maimoune claims
    victory in a comparison between prince and princess and orders Caschcasch and
    Danhasch to return the princess home. The next morning Camaralzaman seeks the
    vanished lady. His slave, then the grand-vizir, deny that any woman could have
    entered the tower; the prince responds violently. The king finally hears Camaralzaman's
    account, sees the ring, believes his son, and acknowledges the affair as mysterious.
