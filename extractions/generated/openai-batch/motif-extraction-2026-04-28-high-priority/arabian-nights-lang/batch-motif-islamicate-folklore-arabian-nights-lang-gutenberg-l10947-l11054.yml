canonical_text:
  quote: ''
  summary: Princess Parizade ascends a mountain while resisting hostile voices, captures
    the Talking Bird, obtains directions to the Golden Water and Singing Tree, and
    compels the bird to reveal how to restore her brothers and others from black stones.
    She sprinkles water from a pitcher on the stones, restoring them to human form,
    then returns with her brothers carrying the bird, the tree branch, and the flask
    of Golden Water.
