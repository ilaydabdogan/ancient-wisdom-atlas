canonical_text:
  quote: ''
  summary: Prince Camaralzaman refuses marriage despite dynastic pressure and is imprisoned
    in an old tower. At night, after devotions and reading the Koran, he sleeps. The
    fairy Maimoune rises from a well in the tower, discovers the sleeping prince,
    admires his beauty, kisses him, and flies away. In the middle region she meets
    the bad genie Danhasch, who tells her of the secluded princess of China, also
    famed for beauty and resistant to marriage, living in seven magnificent palaces
    and threatening self-harm if pressed to wed.
  language: English
  quote_policy: summarized
