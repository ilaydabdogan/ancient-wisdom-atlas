canonical_text:
  quote: ''
  summary: Sindbad and his companions are trapped on a desolate island shore below
    an unscalable mountain, among shipwrecks, bones, merchandise, and treasures. A
    fresh-water river runs from the mountain into a jeweled cave. After his companions
    die, Sindbad builds a raft, loads it with precious goods, and entrusts himself
    to the underground river. He travels through darkness, narrowly avoids being crushed,
    exhausts his food, sleeps, and wakes in daylight in another land, where local
    people rescue and feed him. They bring him and his raft to Serendib, where he
    tells his story to the king, who orders it written in gold and examines the treasures.
  language: English
  quote_policy: summarized
