canonical_text:
  quote: ''
  summary: The Sultan returns to the capital, orders the Sultana's sisters seized,
    questioned, and executed after they are found guilty. He publicly frees the Sultana
    from her narrow prison, asks her pardon, and restores her honour and position.
    The next day the Sultan and Sultana visit their children, share a reunion, dine,
    and see the Golden Water, the Singing Tree, and the Talking Bird. The royal family
    returns to the capital amid public welcome and birdsong.
  language: English
  quote_policy: summarized
