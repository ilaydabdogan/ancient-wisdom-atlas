canonical_text:
  quote: ''
  summary: Aladdin's mother petitions the Sultan for the princess's hand and presents
    jewels. The Sultan delays at the vizir's urging, while the vizir's son is arranged
    to marry the princess. Aladdin uses the lamp's genie to transport the newlyweds'
    bed to his chamber for two nights, causing the rival bridegroom to renounce the
    marriage. When the term expires, the Sultan demands an extravagant gift of gold,
    jewels, and attendants; the genie supplies it. Aladdin then appears in princely
    splendor, and the Sultan receives him for marriage to the princess.
  language: English
  quote_policy: summarized
