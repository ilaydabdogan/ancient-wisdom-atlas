canonical_text:
  quote: ''
  summary: The Sultan welcomes two accomplished brothers at court, where the people
    and the Sultan remark that they resemble the sons he might have had. The brothers
    invite him to visit their sister. The sister consults the Talking Bird, which
    instructs her to serve cucumbers stuffed with pearl sauce and tells her where
    to find buried pearls under a tree. She finds a golden box of pearls, orders the
    strange dish prepared, and receives the Sultan after the hunt; he is struck by
    her grace and courtly bearing.
