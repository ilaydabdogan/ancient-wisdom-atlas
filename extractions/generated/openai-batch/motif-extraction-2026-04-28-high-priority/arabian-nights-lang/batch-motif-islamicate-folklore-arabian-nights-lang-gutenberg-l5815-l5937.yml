canonical_text:
  quote: ''
  summary: The king of China confines his daughter and announces that whoever can
    cure her supposed madness may marry her. Danhasch and the fairy Maimoune dispute
    whether the princess or the imprisoned prince Camaralzaman is more beautiful.
    Danhasch brings the sleeping princess to the prince's room. Maimoune summons Caschcasch
    as umpire; he proposes waking each sleeper in turn to judge which admires the
    other more. Maimoune, in the shape of a gnat, wakes Camaralzaman, who admires
    and kisses the sleeping princess, exchanges rings with her, and falls asleep again.
    Danhasch then takes gnat form to wake the princess.
  language: English
  quote_policy: summarized
