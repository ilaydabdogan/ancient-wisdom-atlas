canonical_text:
  quote: ''
  summary: A captain warns that a nearby island is inhabited by small hairy savages.
    The savages swarm the ship, take control, and leave the crew on another island.
    The stranded sailors find a castle containing human bones and roasting spits.
    A one-eyed black giant enters, selects and roasts the captain, and later consumes
    another sailor. The narrator proposes building rafts for escape, and after another
    companion is eaten, the narrator and nine comrades heat spits in the fire and
    blind the sleeping giant.
  language: English
