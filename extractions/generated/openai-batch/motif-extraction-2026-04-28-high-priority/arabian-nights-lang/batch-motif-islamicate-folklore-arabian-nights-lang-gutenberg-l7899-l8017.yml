canonical_text:
  quote: ''
  summary: A false uncle leads Aladdin to a mountain valley, opens the earth by magic,
    and sends him into an underground place to fetch a lamp. Aladdin refuses to hand
    over the lamp before leaving, so the magician seals him inside. Aladdin escapes
    by accidentally rubbing a ring that summons a genie. At home, rubbing the lamp
    summons another genie who provides food and silver vessels. Later Aladdin sees
    the Sultan's veiled daughter, falls in love, and sends his mother to petition
    the Sultan with the jeweled fruits from the underground garden.
  language: English
  quote_policy: summarized
