canonical_text:
  quote: ''
  summary: A captain secretly abducts Prince Camaralzaman from the Island of Idolaters
    and brings him before the ruler of the Ebony Island. The ruler is Princess Badoura
    in male disguise, who recognizes her husband but conceals her identity, rewards
    the captain, installs Camaralzaman in honor, and later summons him privately.
    She shows him the talisman associated with their separation, then changes back
    into female clothing; Camaralzaman recognizes and embraces her.
  language: English
  quote_policy: summarized
