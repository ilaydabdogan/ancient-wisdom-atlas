canonical_text:
  quote: ''
  summary: Alnaschar survives an attempted murder, recovers, disguises himself as
    an old woman, returns to the murderers' house, kills the black slave, the Greek
    slave, and the old woman, spares a captive lady, discovers treasure, is tricked
    when the lady escapes with the gold, removes furniture from the house, and is
    arrested and brought before a judge.
  language: English
  quote_policy: summarized
