  quote: ''
  summary: A dying mother gives her daughter a mirror and tells her that, after death,
    the daughter may see her in it for comfort. After the mother dies, the daughter
    grieves, remembers the gift, looks into the mirror, and believes the reflected
    face is her mother's soul. The mirror consoles her and reinforces her effort to
    become gentle, kind, and dutiful. Later the father remarries, and the new stepmother
    begins treating the girl unkindly and trying to separate father and child.
