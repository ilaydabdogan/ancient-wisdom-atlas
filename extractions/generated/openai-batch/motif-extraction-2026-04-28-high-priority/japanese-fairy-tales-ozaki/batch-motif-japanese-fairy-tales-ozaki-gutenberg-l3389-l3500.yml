canonical_text:
  quote: ''
  summary: A stepmother, resentful of her husband’s affection for his daughter, schemes
    to drive the girl from the house. After secretly observing the girl in her room,
    she falsely tells her husband that the daughter is using an image and curses to
    kill her by magic. The father doubts the charge but investigates because the girl
    has been secluded. The girl, grieving for her dead mother and comforted by looking
    into a mirror she associates with her mother’s face, is found by her father and
    hides the mirror. Misreading her confusion, he angrily accuses her of cursing
    her stepmother. The girl does not understand the superstition and prepares to
    explain herself.
  language: English
