  summary: A daughter accused of hostile magic denies wrongdoing and reveals that
    she has been secretly looking into a mirror to remember her dead mother. Her father
    realizes she has mistaken her own reflection, which resembles her mother, for
    an encounter with her mother, praises her filial piety, and apologizes. The stepmother,
    who had suspected revenge magic out of jealousy, confesses, repents, and asks
    forgiveness. The daughter forgives her, and the household becomes harmonious.
