canonical_text:
  quote: ''
  summary: Momotaro asks his old father for permission to leave home and attack the
    devils on an island northeast of Japan. He explains that the devils rob, kill,
    eat people, and disobey the Emperor. The old man permits him to go because Momotaro
    is strong, fearless, and regarded as a gift from Heaven. The old parents make
    rice-cakes for his journey and farewell him tearfully. On the road, Momotaro eats
    under a tree, confronts a threatening dog, declares his mission, and gains the
    dog as a follower after giving it half a rice-cake. Later a monkey comes down
    from a tree and asks to join the expedition; the dog quarrels with it, but Momotaro
    intervenes and questions the monkey about its wish to fight with him.
  language: English
  quote_policy: summarized
