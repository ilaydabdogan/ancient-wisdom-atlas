canonical_text:
  quote: ''
  summary: Caoilte, while hunting near Ess Ruadh, meets Derg, a foster-brother living
    among the Tuatha de Danaan in a Sidhe hill. Derg brings him into the hill, where
    Ilbrec is at war with Lir. A destructive bird with an iron beak and fiery tail
    has been attacking Ilbrec's hall nightly. Caoilte brings the bird down with a
    copper rod. Ilbrec gives him the Spear of Fiacha, said to have been used by Finn
    against Aillen. Derg is appointed battle commander. Lir's armies surround the
    hill; battle follows, and Caoilte kills Lir in single combat.
  language: English
  quote_policy: summarized
