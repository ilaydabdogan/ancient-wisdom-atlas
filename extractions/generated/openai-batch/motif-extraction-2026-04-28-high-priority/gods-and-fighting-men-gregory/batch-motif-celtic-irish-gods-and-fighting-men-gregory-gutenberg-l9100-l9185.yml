candidate_motifs:
- id: motif:1
  label: Warrior guest enters a Sidhe hill
  taxonomy_refs:
  - hero_descent
  basis: Caoilte is invited by Derg into the hill of the Sidhe at night and becomes
    a guest within the otherworldly household.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage shows entry into a Sidhe hill but does not narrate a full
    descent-and-return structure.
- id: motif:2
  label: Fiery supernatural bird attacks a hall nightly
  taxonomy_refs:
  - chaos
  basis: The iron-beaked, fire-tailed bird appears every evening at Ilbrec's golden
    window and creates destructive disorder by causing weapons to fall on the hall's
    occupants.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The bird is destructive and fiery, but the passage does not explain its
    origin beyond association with Lir's side.
- id: motif:3
  label: Hero disables invulnerable attacker with special cast
  taxonomy_refs: []
  basis: Ordinary missiles thrown at the bird fail or rebound, while Caoilte's cast
    of a copper rod brings it down.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not state that the copper rod is magical; it only reports
    its successful use.
- id: motif:4
  label: Named heroic weapon passed for a new conflict
  taxonomy_refs:
  - sacred_exchange
  basis: Ilbrec hands Caoilte the Spear of Fiacha, identifies its earlier heroic use
    by Finn against Aillen, and asks Caoilte to keep it ready against Lir.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The exchange is explicit, but the passage does not ritualize the transfer
    or call the weapon sacred.
- id: motif:5
  label: Champion combat against the enemy's best fighter
  taxonomy_refs: []
  basis: Lir is named as the best fighter of the Men of Dea; Caoilte insists on meeting
    the best opponent hand to hand, and Lir falls by Caoilte's hand.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The broader outcome of the war after Lir's death is not included in the
    passage.
- id: motif:6
  label: Sidhe abundance contrasted with longing for the Fianna
  taxonomy_refs:
  - duality
  basis: Derg says food and clothing are abundant in the Sidhe, yet he would prefer
    even the life of the worst-treated serving-boy of the Fianna.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The contrast is explicitly stated by Derg, but the passage does not develop
    it into a full thematic resolution.
comparison_claims:
- id: claim:1
  claim: 'The passage internally links the present defense of Ilbrec''s hall to an
    earlier Fianna anti-destroyer episode through the same named spear: the Spear
    of Fiacha is said to have been used by Finn to end Aillen, who burned Teamhair,
    and is then given to Caoilte for the possible arrival of Lir.'
  claim_level: same_function
  target: Finn's killing of Aillen, son of Midhna, with the Spear of Fiacha
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the weapon's provenance and defensive use are reported; the passage
    gives no full account of the Aillen episode and does not explicitly equate Aillen
    with the fire-tailed bird or with Lir.
