- id: obs:3
  text: Corpre speaks a negative formula wishing that Bres's prosperity be like the
    lack he has experienced.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Corpre's satire, Bres has no good luck and declines thereafter; the
