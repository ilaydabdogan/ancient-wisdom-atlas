    of the Fomor.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: When Bres reaches for his sword, Elathan recognizes the ring and asks who
    Bres is; Eri tells the story and says Bres is Elathan's son.
  category: sequence
  evidence_refs:
  - ev:17
