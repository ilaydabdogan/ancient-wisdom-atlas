canonical_text:
  quote: ''
  summary: The Grey Man compels Daire to play music by temporarily weakening spells
    on Daire and Finn. The Fianna hear the music and attack Ailne's dun, but the Grey
    Man restores his spells and causes them to fall into sleep and death-like clouds,
    then imprisons them. Daire plays music of sweetness, grief, and lamentation while
    the captives remain under enchantment. Conan tricks the Grey Man into allowing
    him access to an enchanted cup, hides it, and gives its drink to Finn, Osgar,
    and the Fianna, restoring their appearance, strength, and courage.
  language: English
  quote_policy: summarized
