canonical_text:
  quote: ''
  summary: 'Diarmuid lies dying on Beinn Gulbain and asks Finn to use a healing gift
    connected with the Boinn: water given from Finn''s palms can restore youth and
    health. Finn refuses because of Diarmuid''s taking of Grania, while Diarmuid recalls
    past services to Finn and the Fianna and foretells future losses. Osgar threatens
    Finn unless he brings water. Finn twice lets the water slip away while thinking
    of Grania; on the third attempt he brings it, but Diarmuid dies before receiving
    it. The Fianna mourn, Finn leaves with Diarmuid''s hound, and several companions
    cover Diarmuid with their cloaks.'
  language: English
  quote_policy: summarized
