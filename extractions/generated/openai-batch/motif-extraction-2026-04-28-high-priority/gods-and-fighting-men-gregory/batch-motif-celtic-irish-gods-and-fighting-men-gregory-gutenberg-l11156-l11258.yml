  summary: A champion leads the wounded Diarmuid away from a dangerous sleeping-place
    to Land-Under-Wave, where he is welcomed, healed, and feasted. Meanwhile Finn
    and his people search for Diarmuid, are led by a rider to the land of Sorcha,
    receive hospitality from its king, and defend the land against the High King of
    Greece and his allies. Diarmuid later arrives at a gathering with an armed troop,
    and news is exchanged.
