canonical_text:
  quote: ''
  summary: During a crowded battle, Fergus reports conditions to Finn and identifies
    leading opponents. Daire Donn, the King of the World, seeks Finn; several Fianna
    warriors die opposing him. Arcallach attacks Daire Donn but cannot wound him and
    is killed. Finn and Daire Donn duel; Daire Donn fears Finn's weapons, and Finn
    finally beheads him but collapses from his own wounds. Finnachta transfers the
    dead king's crown and weapons first to Conmail, who is killed by Goll Garbh, and
    then to Ogarmach, citing a prophecy that the world will be owned by a woman. Ogarmach
    fights Finn; Finn beheads her and falls as though dead, but rises again.
  language: English
  quote_policy: summarized
