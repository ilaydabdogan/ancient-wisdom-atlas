candidate_motifs:
- id: motif:1
  label: mourning divine parent and grave enclosure
  taxonomy_refs:
  - divine_parent_child
  basis: The Dagda encloses his son's grave with a rath and sheds tears of blood for
    the son's death.
  evidence_refs:
