canonical_text:
  quote: ''
  summary: 'Caoilte and Cascorach say farewell, while Fermaise remains for a time.
    The people of the hill give Caoilte valuable gifts: a crimson fringed cloak made
    from wool of seven sheep of the Land of Promise, a fish-hook named Aicil mac Mogha
    that catches fish wherever set, and a drink of remembrance that preserves all
    seen places and battles in memory. Caoilte calls the gifts good help from kinsmen
    and friends. Caoilte and Cascorach leave the hill, and its people lament after
    them.'
  language: English
  quote_policy: summarized
