- id: obs:8
  text: In the Rio de la Plata account, the girl is sewn into her hammock as if dead,
    with a small breathing hole at the mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the Chiriguano account, the girl stays in a hammock raised to the roof
