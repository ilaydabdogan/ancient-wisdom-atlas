  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Panes was said to be a woman who had run away to the mountains and been
    changed into a bird by Chinigchinich.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Acagchemen were reported to believe that the sacrificed bird came to life
