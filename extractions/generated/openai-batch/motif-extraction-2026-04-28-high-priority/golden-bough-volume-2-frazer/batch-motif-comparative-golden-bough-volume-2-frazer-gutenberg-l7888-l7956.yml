    motionless in crouching posture, and hear rules and tribal secrets through a trumpet
    voice imitating spirits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: The novices are warned on pain of death not to reveal what passed in the Kakian
