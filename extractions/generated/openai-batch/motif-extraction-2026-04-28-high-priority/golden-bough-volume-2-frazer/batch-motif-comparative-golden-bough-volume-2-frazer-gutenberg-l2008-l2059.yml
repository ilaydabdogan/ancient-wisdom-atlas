  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that Mexican sacraments in honor of Huitzilopochtli were
    accompanied by human sacrifice.
  category: other
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage gives examples of dummies or effigies used to divert demons or
