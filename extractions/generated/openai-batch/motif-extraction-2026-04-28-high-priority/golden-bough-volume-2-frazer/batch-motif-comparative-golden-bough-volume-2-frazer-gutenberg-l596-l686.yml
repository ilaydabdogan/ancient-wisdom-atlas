- id: motif:2
  label: Last stroke or last sheaf receives the spirit-name
  taxonomy_refs:
  - seasonal_cycle
  basis: The last thresher, last bundle, last sheaf, or last blades are singled out
    and named as Cow, Bull, Ox, Calf, or Mare.
  evidence_refs:
  - ev:1
