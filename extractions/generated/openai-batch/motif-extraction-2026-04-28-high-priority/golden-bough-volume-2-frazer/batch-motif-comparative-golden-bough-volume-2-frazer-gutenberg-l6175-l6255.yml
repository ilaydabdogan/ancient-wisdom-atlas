  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In Brie, Isle de France, an eighteen-foot wicker-work giant was annually burned
    on Midsummer Eve.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: At Luchon on Midsummer Eve, a sixty-foot hollow wicker column interlaced with
