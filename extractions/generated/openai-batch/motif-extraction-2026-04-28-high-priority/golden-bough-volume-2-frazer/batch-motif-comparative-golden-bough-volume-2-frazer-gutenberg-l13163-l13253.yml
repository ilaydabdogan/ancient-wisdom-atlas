  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Mosquito Indians preserved deer bones and eggshells lest deer or chickens
    die or disappear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Yurucares of Bolivia put away even small fish bones, saying that otherwise
