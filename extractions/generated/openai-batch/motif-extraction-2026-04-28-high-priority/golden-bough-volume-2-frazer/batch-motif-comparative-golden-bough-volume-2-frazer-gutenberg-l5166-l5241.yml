  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The New Ireland girls are allowed out only once a day to bathe in a dish or
    wooden bowl placed close to each cage.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The New Ireland girls are placed in the cages when young and remain there
