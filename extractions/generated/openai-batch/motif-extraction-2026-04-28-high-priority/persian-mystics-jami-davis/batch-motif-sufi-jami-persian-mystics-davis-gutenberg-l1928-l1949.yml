  summary: A mosque in Egypt burns; Muslims suspect Christians and burn their houses
    in retaliation. The Sultan captures the perpetrators, distributes lots assigning
    punishments, and the culprits receive the penalties indicated. A condemned man
    says he fears not death but worries for his dependent mother. Another man assigned
    whipping exchanges notes with him, choosing death so the first man may live to
    care for his mother.
