  summary: A maiden and a youth exchange declarations of love. The maiden expresses
    a wish for physical intimacy. The youth says he shares the desire but refuses,
    citing a divine saying about friendship becoming enmity on the day of resurrection
    except among the pious. He leaves, reciting verses that advise abandoning a brief
    earthly love and choosing a love that endures on the day of reckoning in the eternal
    abode.
