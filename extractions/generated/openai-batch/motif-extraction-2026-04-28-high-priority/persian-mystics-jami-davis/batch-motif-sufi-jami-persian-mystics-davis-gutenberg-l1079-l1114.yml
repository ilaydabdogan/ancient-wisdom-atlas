  summary: The passage exhorts the addressee to abandon multiple earthly loves and
    devote the heart to one love. It defines Absolute Beauty as Divine Majesty whose
    rays are reflected in all grades of beings and as the source of wisdom. A lyric
    speaker describes the beloved appearing at dawn, rebuking the speaker for turning
    away, and says a momentary glimpse and possible Union are better than a lifetime
    of earthly beauties.
