canonical_text:
  quote: ''
  summary: Wainamoinen and his companions flee by boat from Pohyola. Wainamoinen uses
    tinder, flint, and magic words to raise a sea-mountain that wrecks the pursuing
    warship. Louhi transforms herself and wreckage into a monster-eagle carrying armed
    men, attacks the fleeing vessel, and contests the Sampo. After combat, the Sampo
    falls into the deep sea, breaks apart, and its pieces enrich the waters and Ahto's
    people.
  language: English
  quote_policy: summarized
