canonical_text:
  quote: ''
  summary: The landlord of Pohyola challenges Lemminkainen to a sword contest. After
    the landlord repeatedly fails to strike him, Lemminkainen uses his fiery ancestral
    sword to distract and behead him, then places the severed head on an empty picket
    among other heads. The Northland hostess Ilpotar angrily conjures armed men against
    Lemminkainen, who recognizes the danger and flees the feast, then searches for
    his horse as hostile forces gather.
  language: English
  quote_policy: summarized
