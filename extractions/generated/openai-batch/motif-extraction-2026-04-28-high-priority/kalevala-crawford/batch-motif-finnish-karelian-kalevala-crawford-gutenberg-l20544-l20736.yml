canonical_text:
  quote: ''
  summary: Wainamoinen steers a magic vessel toward Northland. Lemminkainen sees the
    approaching ship, recognizes Wainamoinen at the helm and Ilmarinen rowing, and
    asks to join their voyage to Pohyola to gain the Sampo. Wainamoinen accepts him.
    The ship sails onward, heard by maidens on the banks. As the vessel enters dangerous
    rivers, rapids, cataracts, and whirlpools, Lemminkainen recites invocations asking
    water-beings, rocks, a helms-goddess, and Ukko to make safe passage for the ship.
  language: English
  quote_policy: summarized
