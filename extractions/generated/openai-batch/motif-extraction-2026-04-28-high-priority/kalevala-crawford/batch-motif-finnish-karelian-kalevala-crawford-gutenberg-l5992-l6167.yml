canonical_text:
  quote: ''
  summary: Kyllikki rejects Lemminkainen's wooing. Later, while maidens gather for
    dancing, Lemminkainen arrives with a stallion, seizes Kyllikki, places her in
    his vehicle, and drives away, warning the other maidens not to report the abduction.
    Kyllikki weeps and asks for freedom, threatening that her male kin will pursue
    and kill him. Lemminkainen refuses to release her but promises not to harm or
    deceive her, presents his cattle, home, lineage, sword, and spear as signs of
    worth, and agrees to an oath not to go to battle for gold. Kyllikki swears not
    to attend village dances, and the two vows are registered before Ukko.
  language: English
  quote_policy: summarized
