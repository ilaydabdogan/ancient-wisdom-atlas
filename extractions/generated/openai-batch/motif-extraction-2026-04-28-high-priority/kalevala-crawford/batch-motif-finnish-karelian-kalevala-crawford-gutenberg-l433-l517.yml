    only snakes, lizards, and toads on the bottom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lake Eim moved through the air like a white cloud, hovered among the stars
    through the night, and in the morning descended near reapers.
  category: action
