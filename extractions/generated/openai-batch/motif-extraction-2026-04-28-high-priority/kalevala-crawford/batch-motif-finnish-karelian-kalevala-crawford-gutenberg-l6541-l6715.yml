canonical_text:
  quote: ''
  summary: The passage describes how heroes guard themselves from dangers, then presents
    Lemminkainen invoking protective heroes, nature spirits, Hisi, Wellamo, and Ukko
    against wizards and enchanters. He harnesses his stallion, travels north to Lapland/Northland,
    questions inhabitants at successive courtyards, confronts a wizard or witch, magically
    silences a watchdog, summons a pigmy from vapor to tend his horse, and enters
    unseen while hearing singing and laughter inside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heroes are said to guard homes, firesides, doors, roofs, windows, torch-posts,
    highways, and gateways from danger and evil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heroes are warned to guard themselves from women and merry maidens, because
    weakness there can make them victims of enchanters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage names warlike giants and dangerous places such as branching highways,
    blue-rock borders, evil marshes, waterfalls, whirlpools, fiery springs, and rapids.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lemminkainen calls on groups of heroes, forest archers, thicket armies, mountain
    spirits, Hisi, Water-mother, Wellamo, valley maidens, and river nymphs to protect
    him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The invoked protectors are asked to accompany Lemminkainen day and night and
    blunt or dull the weapons of wizards, enchanters, archers, and foemen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lemminkainen says he can call gods above him and then addresses Ukko as father
    of creation, thunder-speaker, and wielder of lightning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lemminkainen asks Ukko for a fire-sword, burning arrows, and lightning arrows
    to protect him, guide him from evil, and help him conquer or banish enchanters
    and Lapland wizards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Lemminkainen calls his stallion, harnesses it to a snow-sledge, and travels
    north for three days to a Northland village on the shores of Lapland.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At a lower courtyard, Lemminkainen asks if someone can loosen his stallion’s
    breastplate and collar; a child says no one in the dwelling can do so.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a central courtyard, Lemminkainen asks if anyone can tend his horse; a
    wizard or witch answers that someone can, but also threatens that many heroes
    can chase him home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lemminkainen answers the wizard with a threat and then drives onward to the
    upper courtyard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the upper courtyard, Lemminkainen invokes Hisi and Lempo to stop the watchdog’s
    throat, nostrils, and mouth so it will be silent while he passes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Inside the court-room, Lemminkainen strikes the floor with his whip; vapor
    rises, and a pigmy appears to unhitch and tend the horse.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Lemminkainen advances carefully; no one sees him or hears his footsteps, but
    he hears songs, voices, and laughter inside the dwelling.
  category: sequence
  evidence_refs:
  - ev:10
