canonical_text:
  quote: ''
  summary: The passage closes Lemminkainen's episode, then begins Rune XXXI with the
    origins of Kalervo and Untamoinen, their escalating feud, Untamoinen's slaughter
    of Kalervo's people, and the magical birth and attempted killing of the child
    Kullervo by water and fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lemminkainen makes racers, reins, and saddles from cares, sorrows, evil days,
    and sacred pains, then rides away to his aged mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiera rides to his Island-dwelling, while Kura guides Lemminkainen toward
    bride and kindred as the songs turn to other heroes.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A mother raises swans and chickens; birds of prey scatter them, sending one
    to Karyala, one to Ehstland, and leaving one in Pohya.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The one taken to Ehstland becomes a thriving merchant; the one sent to Karyala
    is called Kalervo; the one in Pohya is named Untamoinen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Untamoinen sets fish-nets in Kalervo's waters; Kullerwoinen takes fish home,
    and Untamo becomes angry over the salmon and nets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Untamo and his opponent battle for a long time without either proving victor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kalervo sows barley near Untamoinen's barns; Untamoinen's sheep eat the crop,
    and Kullerwoinen's dog tears Untamo's sheep to pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Untamo threatens to annihilate Kalervo's people and conjures an armed force
    with swords, spears, and axes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kalervo's wife sees something like smoke or a storm-cloud near the forest
    and prairie border, which is identified as Untamoinen's soldiers marching to battle.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Untamoinen's warriors kill Kalervo's people, slay his kindred, burn dwellings,
    and level courts and cabins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Only Kalervo's daughter and her unborn child are left alive after the slaughter.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The surviving daughter leads the hostile army to her father's halls, sweeps
    rooms, and gives the warriors home-attentions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A boy is born in magic of the virgin Untamala, a trouble-laden mother; he
    is named Kullervo and called Pearl of Combat by Untamo.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The infant rocks himself, breaks his swaddling garments, knocks his cradle
