canonical_text:
  quote: "“I am sailing to the Northland / To the dismal Sariola”"
  summary: Wainamoinen repeatedly gives false explanations for his voyage, and Annikki
    refutes them. After she threatens his magic vessel with storm-winds, he admits
    he is sailing to Sariola to woo the Maid of Beauty. Annikki leaves her washing
    and runs to Ilmarinen’s smithy, where she bargains for forged ornaments in exchange
    for news. She tells Ilmarinen that Wainamoinen is sailing to woo Ilmarinen’s affianced
    bride. Ilmarinen is stunned, drops his tools, promises Annikki the requested objects,
    and orders preparations for cleansing himself.
  language: English
  quote_policy: quoted
