  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mother says Ukko aided and saved Lemminkainen from the waters and chambers
    of Tuoni and Manala, and says God alone can revive the dead and dying.
  category: speech
  evidence_refs:
  - ev:3
