canonical_text:
  quote: ''
  summary: Mariatta, described as a virgin-mother, is refused shelter by the wife
    of Ruotus and sent toward a forest stable associated with the flaming horse of
    Hisi. Mariatta prays to the Creator and Ukko for protection, asks the horse for
    warmth, and gives birth in a woodland manger. Her child later vanishes; she searches
    widely and asks the star, moon, and sun where he is. The star and moon refuse,
    saying the child created them. The sun tells her the child lies hidden in water
    among reeds and rushes. Mariatta finds him, takes him home, and the child grows
    in beauty, strength, light, and wisdom; people disagree over his name.
  language: English
  quote_policy: summarized
