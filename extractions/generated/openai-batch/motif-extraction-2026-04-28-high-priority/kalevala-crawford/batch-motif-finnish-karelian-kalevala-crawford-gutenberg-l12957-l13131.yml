  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Maidens are compared to foxes and ermine driven into traps by hunger, and
    the passage states that the virgin or daughter is subject to her hero-husband
    and to his mother.
  category: relationship
  evidence_refs:
  - ev:10
