  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Forests, vines, flowers, birds, berries, herbs, and varied vegetation appear
    or return, but barley is not growing.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Wainamoinen finds six golden barley seeds and seven ripened kernels on the
