canonical_text:
  quote: ''
  summary: Annikki prepares a heated bath, cleansing mixture, and toilet arrangements
    for her brother Ilmarinen so that he may become worthy and successful in wooing.
    Ilmarinen forges ornaments and a silver loom for Annikki, bathes and dresses in
    fine garments, orders a servant to prepare his magic snow-sledge with a gray steed,
    birds, and furs, prays to Ukko for snow, and travels north toward Pohya and Sariola.
    On the third day he overtakes Wainamoinen, and the two agree to woo the Northland
    maiden peacefully, allowing her to choose between them without envy from the unsuccessful
    suitor.
  language: English
  quote_policy: summarized
