canonical_text:
  quote: ''
  summary: Lemminkainen answers his mother's warnings about successive dangers on
    the road to Pohyola. He plans magical protections against fire, beasts, serpents,
    armed enemies, and previous deathly waters, then arms himself with copper mail
    and his father's magic sword before declaring that no one in Pohyola can match
    him.
  language: English
