canonical_text:
  quote: ''
  summary: Math uses a magic wand to punish Gilvaethwy and another man by changing
    them through deer, wild swine, and wolf forms over successive years; each year
    they return with offspring who are baptized and named. After the punishment ends,
    Gwydion advises Math to seek Arianrod. Arianrod steps over Math's wand and a yellow-haired
    boy appears, while Gwydion hides a second small form in a scarf and chest. The
    yellow-haired boy, Dylan, is baptized, enters the sea, takes its nature, and is
    later said to be killed by Govannon. Gwydion later finds the hidden infant, arranges
    nursing, and the child grows rapidly.
  language: English
  quote_policy: summarized
