canonical_text:
  quote: ''
  summary: Peredur challenges combat near a grove and cromlech, fights a black-armoured
    man who repeatedly regains his saddle, and loses sight of him when the man vanishes
    with both horses. Peredur then crosses a mountain to a valley castle with a river,
    where he finds Gwalchmai, a lame grey-headed man, and his recovered horse. A yellow-haired
    youth kneels to Peredur and reveals that he had appeared previously as a black
    maiden and as bearer of a bloody head and bleeding lance; he identifies the head
    as Peredur's cousin, killed by the sorceresses of Gloucester, who also lamed Peredur's
    uncle. Peredur and Gwalchmai summon Arthur's household against the sorceresses.
    After one sorceress kills three men before Peredur, he strikes her helmet; she
    identifies him as the one destined to slay them, and Arthur's household kills
    the sorceresses. The passage ends by naming this as concerning the Castle of Wonders.
  language: English
  quote_policy: summarized
