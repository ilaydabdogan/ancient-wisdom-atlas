canonical_text:
  quote: ''
  summary: Gwenhwyvar follows the hunt with a maiden and meets Geraint. At the forest
    edge they encounter a dwarf, an unnamed lady, and a large armored knight. The
    dwarf refuses to identify the knight and strikes both Gwenhwyvar's maiden and
    Geraint with a whip. Geraint restrains himself because he lacks armor and follows
    the knight's party toward a town and castle where he hopes to obtain arms and
    challenge the knight.
  language: English
  quote_policy: summarized
