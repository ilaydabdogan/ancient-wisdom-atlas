canonical_text:
  quote: ''
  summary: Maxen Wledig, emperor of Rome, goes hunting with vassal kings, falls asleep
    beneath shields set up by his attendants, and dreams of a journey up a river valley,
    over a vast mountain, across sea by a splendid ship, and into an island castle.
    In the golden and gemmed hall he sees chess-playing youths, an older man carving
    chessmen, and a radiant maiden. He embraces the maiden, awakens, and afterward
    is overcome by love for her, seeing her only in sleep and not knowing where she
    is.
  language: English
  quote_policy: summarized
