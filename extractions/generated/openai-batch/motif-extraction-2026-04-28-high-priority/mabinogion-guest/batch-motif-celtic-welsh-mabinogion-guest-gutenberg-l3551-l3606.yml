canonical_text:
  quote: ''
  summary: At night Enid prepares Geraint's armour and warns him of Earl Dwnn's intentions.
    Geraint gives the host eleven horses and eleven suits of armour and is guided
    out of town by another route, with Enid going before him. Earl Dwnn arrives with
    fourscore armed knights, follows the tracks, and pursues. At dawn Enid sees dust
    and a knight through the mist and warns Geraint despite his order for silence.
    Geraint defeats each knight at the first onset, then overthrows Earl Dwnn, who
    asks mercy; Geraint grants it, while the defeated knights are grievously wounded
    by their falls and his blows.
  language: English
