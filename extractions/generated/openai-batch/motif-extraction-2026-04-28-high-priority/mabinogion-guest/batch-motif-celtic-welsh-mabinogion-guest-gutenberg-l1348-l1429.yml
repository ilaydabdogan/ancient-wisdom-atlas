canonical_text:
  quote: ''
  summary: An unnamed knight insults Gwenhwyvar at Arthur's court and challenges anyone
    to avenge her. Peredur arrives poorly equipped, seeking knighthood from Arthur.
    A previously mute dwarf and female dwarf hail him as a preeminent knight, and
    Kai strikes them down. Kai sends Peredur after the challenger. Peredur kills the
    knight with a sharp-pointed fork, cannot remove the armor, and is helped by Owain.
    Peredur sends the goblet back to Gwenhwyvar and declares service to Arthur, but
    refuses to come to court until he has avenged Kai's injury to the dwarf and dwarfess.
  language: English
  quote_policy: summarized
