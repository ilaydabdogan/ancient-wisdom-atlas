canonical_text:
  quote: ''
  summary: A bride-winning quest requires obtaining difficult marvels. Arthur's men
    enter the castle of Gwrnach the Giant by claiming the craft of sword-burnishing;
    Kai polishes Gwrnach's sword, tricks him into giving up the scabbard, beheads
    him, and brings the sword to Arthur. Arthur then directs the company to seek Mabon
    son of Modron, which first requires finding Eidoel son of Aer, imprisoned in Glivi's
    castle; Glivi agrees to release the prisoner and give aid.
  language: English
  quote_policy: summarized
