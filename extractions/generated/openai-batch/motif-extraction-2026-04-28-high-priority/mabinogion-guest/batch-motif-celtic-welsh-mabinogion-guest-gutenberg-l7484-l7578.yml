canonical_text:
  quote: ''
  summary: Gwydion perceives his brother's lovesickness for Goewin, proposes a stratagem,
    and goes with companions disguised as bards to Pryderi. He seeks pigs sent from
    Annwvyn by Arawn, but Pryderi is bound by a covenant not to part with them until
    they have doubled in number. Gwydion uses magic to create impressive horses, greyhounds,
    and shields as a temporary illusion, exchanges them for the pigs, and departs
    quickly as the illusion will last only until the same hour the next day. The route
    with the pigs is linked to several place-names.
  language: English
  quote_policy: summarized
