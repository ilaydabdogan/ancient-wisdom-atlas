canonical_text:
  quote: ''
  summary: Gwalchmai reaches a valley fortress, receives a ring-token of hospitality
    from its lord, is welcomed by the lord's sister beside a smokeless fire, and is
    later accused by a hoary-headed man of having killed the Earl's father; armed
    men try to enter, but Gwalchmai blocks the door with a chessboard until the Earl
    returns and grants him a year before answering the charge. Peredur, seeking the
    black maiden, meets a priest on Good Friday, is rebuked for traveling armed, dismounts,
    receives lodging and blessing after changing his conduct, and is directed toward
    the Castle of Wonders by way of a mountain, river valley, and royal Easter palace.
  language: English
  quote_policy: summarized
