canonical_text:
  quote: ''
  summary: Geraint and Enid travel along a high road toward a fair valley with a river,
    bridge, and fortified town. A knight warns that the Little King, Gwiffert Petit,
    customarily combats every knight entering his lands. Geraint proceeds, is overtaken
    by Gwiffert Petit, fights him on horseback and on foot, defeats him, grants mercy
    on condition of alliance, refuses rest at the Little King's court, and continues
    wounded toward a wood with Enid going first.
