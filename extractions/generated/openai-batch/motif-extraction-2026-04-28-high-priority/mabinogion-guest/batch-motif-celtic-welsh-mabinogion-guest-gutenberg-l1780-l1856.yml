canonical_text:
  quote: ''
  summary: Gwalchmai proposes to approach the pensive knight courteously, despite
    Kai's angry taunts. He finds Peredur resting on his spear and meditating on his
    beloved through the sight of snow, a raven, and blood from a bird killed by a
    hawk. Peredur explains that earlier uncourteous challengers disturbed him. He
    and Gwalchmai exchange names, embrace, and pledge fellowship. Peredur is brought
    to Arthur, welcomed, honored, and recognized as the avenger of the insulted dwarf
    and dwarfess. Later at Caerlleon, Peredur meets Angharad Law Eurawc, declares
    love for her, is refused, and vows not to speak to any Christian until she loves
    him above all men.
  language: English
  quote_policy: summarized
