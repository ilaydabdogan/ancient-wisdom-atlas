canonical_text:
  quote: ''
  summary: Peredur reaches a river valley, is sent to a king's palace, and is entertained
    by the king's daughter. A page reports that the daughter favors Peredur, and the
    king has Peredur imprisoned. The daughter visits him, gives him honorable treatment,
    and later supplies him with horse and arms so he can enter battle against a powerful
    Earl. Peredur repeatedly returns to prison after fighting anonymously in a scarlet
    robe and with a yellow shield, ultimately killing the Earl. The king offers him
    marriage to his daughter, half the kingdom, and the two Earldoms, but Peredur
    says he seeks news of the Castle of Wonders. The maiden directs him over a mountain
    to a lake with a castle in its middle.
  language: English
  quote_policy: summarized
