  quote: ''
  summary: The passage opens “The Dream of Rhonabwy.” Madawc rules Powys while his
    brother Iorwerth resents his lesser rank, refuses an offered office, and raids
    Loegria. Madawc sends men to seek him. Rhonabwy and two companions arrive at a
    poor, smoky, filthy hall, receive meagre hospitality, and attempt to sleep during
    a storm. Rhonabwy finally lies on a yellow calf-skin on the floor and sleeps.
