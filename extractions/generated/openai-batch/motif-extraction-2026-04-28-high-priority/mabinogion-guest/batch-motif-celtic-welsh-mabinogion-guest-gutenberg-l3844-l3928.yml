canonical_text:
  quote: ''
  summary: Geraint retrieves his horse, places Enid with him, and is pursued. The
    pursuing knight proves to be the Little King, who brings Geraint to a nearby palace
    for medical care and armour repair. Later Geraint, Enid, and companions reach
    a fork where a man warns that the lower road leads to a hedge of mist, enchanted
    games, and no return. Geraint chooses that road, is received at Earl Owain's court,
    insists on going to the games, and comes to a high hedge set with many human heads,
    where he must enter alone.
  language: English
  quote_policy: summarized
