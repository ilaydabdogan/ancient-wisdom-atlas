canonical_text:
  quote: ''
  summary: Peredur travels along a mountain ridge into a circular valley, passes a
    chained lion above a bone-filled pit, enters a castle ruled by a huge grey man,
    and is warned by the grey man’s daughter that the valley’s giant vassals will
    attack him. After arranging to keep his horse and arms with him overnight, Peredur
    fights the host, kills many of them and the grey man’s two sons, then grants mercy
    on condition that the grey man and his people do homage to Arthur and receive
    baptism. They go to Arthur’s court, are baptized, and receive the valley from
    Arthur to hold under him.
  language: English
  quote_policy: summarized
