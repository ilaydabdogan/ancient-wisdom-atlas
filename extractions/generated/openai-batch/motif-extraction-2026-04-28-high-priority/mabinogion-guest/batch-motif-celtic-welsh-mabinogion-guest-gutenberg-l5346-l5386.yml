canonical_text:
  quote: ''
  summary: 'Arthur seeks the remaining marvel: the blood of the witch Orddu at a cave
    on the confines of Hell. Several warriors fail against the witch before Arthur
    kills her with his dagger, and Kaw keeps her blood. Kilhwch and his allies bring
    the marvels to Yspaddaden Penkawr; Kaw shaves Yspaddaden to the bone, Yspaddaden
    concedes Olwen, and Goreu beheads him. Kilhwch marries Olwen, and Arthur''s hosts
    disperse.'
  language: English
  quote_policy: summarized
