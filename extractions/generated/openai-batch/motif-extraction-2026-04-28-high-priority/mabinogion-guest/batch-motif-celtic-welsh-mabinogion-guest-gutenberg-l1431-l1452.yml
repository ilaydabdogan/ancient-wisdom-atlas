  summary: Peredur meets a knight who claims to be Arthur's enemy and to have slain
    Arthur's men. Peredur defeats him, grants mercy on condition that he swear to
    go to Arthur's court and report Peredur's victory and his vow not to return until
    he has avenged the insult to the dwarf and dwarfess. During the same week Peredur
    defeats sixteen more knights, all of whom carry the same message to Arthur's court.
    Arthur reproves Kai, who is grieved.
