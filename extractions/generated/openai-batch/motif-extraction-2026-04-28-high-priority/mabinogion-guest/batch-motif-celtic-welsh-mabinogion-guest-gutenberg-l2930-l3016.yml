  quote: ''
  summary: Geraint accepts hospitality and healing at his former lodging, mediates
    restoration of Earl Ynywl's possessions, receives Ynywl's offer of the maiden,
    and sets out for Arthur's court. The narrative then shifts to Arthur's stag hunt,
    the killing of the stag by Arthur, a dispute over the stag's head, Gwenhwyvar's
    counsel to wait for Geraint, and a watch that sees three riders approaching.
  language: English
