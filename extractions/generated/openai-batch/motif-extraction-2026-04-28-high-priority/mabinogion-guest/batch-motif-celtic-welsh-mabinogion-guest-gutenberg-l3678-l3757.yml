canonical_text:
  quote: ''
  summary: Geraint, wounded and overheated, rests under a tree with Enid nearby. Arthur's
    company arrives in the wood. Kai confronts Geraint and is knocked down. Gwalchmai
    then approaches, recognizes Geraint, and arranges for Arthur's tent to be moved
    near the road. Arthur receives Geraint and Enid, refuses to let Geraint continue
    until healed, and provides lodging, clothing, physicians, and Morgan Tud with
    his disciples.
  language: English
  quote_policy: summarized
