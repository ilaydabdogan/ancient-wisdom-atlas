- id: motif:1
  label: god assumes altered form to approach a mortal beloved
  taxonomy_refs:
  - divine_beloved
  - shapeshifter
  basis: Zeus approaches Callisto under Artemis' form, Alcmene under Amphitryon's
    form, and Danae as a shower of gold.
