- id: motif:4
  label: Kin-slaying in religious frenzy
  taxonomy_refs:
  - sacrifice
  basis: Agave and her sisters attack Pentheus, who identifies Agave as his mother
    and Autonoë as his aunt; his body is torn apart and Agave carries his severed
    head as a victory.
  evidence_refs:
