  quote: "“Save it from the flames, if aught still survives, and provide for the preservation
    of the universe.”"
  summary: A cosmic fire dries seas, exposes mountains, kills or drives marine beings
    into hiding, heats the air beyond Neptune’s endurance, and causes Earth to rise,
    scorched and parched, to plead with the sovereign of the gods to save the universe
    from collapse into ancient chaos.
