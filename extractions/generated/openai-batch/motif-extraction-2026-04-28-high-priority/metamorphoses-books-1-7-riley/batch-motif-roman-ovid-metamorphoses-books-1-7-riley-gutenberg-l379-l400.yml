canonical_text:
  quote: ''
  summary: 'The passage summarizes Book VII: Jason, aided by Medea, overcomes fire-breathing
    bulls, serpent-born warriors, and a dragon to recover the Golden Fleece. Medea
    travels to Greece, restores Æson to youth, deceives Pelias with a ram-to-lamb
    demonstration and kills him, later kills her children, marries Ægeus, and escapes
    attempted poisoning. Minos wages war against Ægeus. The summary also notes transformations
    involving Arne, the Myrmidons, Cephalus, a dog and fox, and the fatal javelin
    that kills Procris.'
