canonical_text:
  quote: "“Why, son of Agenor, art thou thus contemplating the dragon slain by thee?
    Even thou thyself shalt be seen in the form of a dragon.”"
  summary: After Cadmus has slain a dragon, an unexplained voice foretells his own
    future dragon-form. Pallas descends and instructs him to sow the dragon’s teeth
    in ploughed earth. Armed men grow from the furrows, fight one another as newly
    born brothers, and only five survive. Echion, following Tritonia’s advice, lays
    down arms and makes peace. These survivors assist Cadmus in founding the city
    ordered by Apollo’s oracle.
