  text: The addressee is told to warn, but is said to have no authority over those
    warned.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those who turn back and disbelieve are said to be punished by God, returned
    to God, and reckoned with by God.
  category: sequence
  evidence_refs:
  - ev:3
