candidate_motifs:
- id: motif:1
  label: Purification through substitute earth when water is absent
  taxonomy_refs: []
  basis: The rule specifies use of clean sand on face and hands when no water is found,
    while stating that God intends purification rather than burden.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is primarily a legal-ritual instruction; broader symbolic interpretation
    should be reviewed.
- id: motif:2
  label: Covenant obedience, reward, and breach
  taxonomy_refs:
  - covenant
  basis: Believers, Israel, and Christians are all discussed in relation to covenant,
    obedience, forgetting or breaking covenant, and consequences.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The communities are treated differently in the passage; the motif should
    not erase those distinctions.
- id: motif:3
  label: Divine judgment of belief, conduct, and covenant response
  taxonomy_refs:
  - divine_judgment
  basis: The passage contrasts pardon and reward with Hell fire, curse, hardened hearts,
    chastisement, and the Fire as recompense for unjust doers.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:9
  - ev:13
  confidence: high
  cautions: Judgment appears in multiple sub-scenes with different addressees and
    causes.
- id: motif:4
  label: Revelatory guidance from darkness to light
  taxonomy_refs:
  - wisdom
  basis: The Apostle, light, and clear Book are said to guide followers to paths of
    peace, out of darkness to light, and to the straight path.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy reference 'wisdom' is approximate; the passage's literal
    terms emphasize guidance and revelation.
- id: motif:5
  label: Refusal to enter destined holy land and resulting wandering
  taxonomy_refs: []
  basis: Moses' people refuse to enter the holy land because of mighty inhabitants;
    after refusal, the land is forbidden to them for forty years and they wander perplexed.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: No available taxonomy family directly names wilderness wandering or failed
    entry.
- id: motif:6
  label: Accepted and rejected offerings leading to brother-slaying
  taxonomy_refs:
  - sacrifice
  - divine_judgment
  basis: Two sons of Adam make offerings; one is accepted and one rejected, which
    leads to threat, killing, and moral speech about God and the Fire.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage does not name the brothers.
- id: motif:7
  label: Animal demonstrates burial knowledge
  taxonomy_refs:
  - wisdom
  basis: God sends a raven whose scratching on the ground shows the killer how to
    hide his brother's wrong.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The wisdom taxonomy is approximate because the passage frames the raven
    as practical demonstration rather than explicit wisdom teaching.
- id: motif:8
  label: Claimed divine sonship or beloved status challenged
  taxonomy_refs:
  - divine_parent_child
  - divine_beloved
  basis: Jews and Christians are quoted as claiming to be sons of God and his beloved;
    the reply denies special exemption by asking why God chastises them for sins.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage presents the claim polemically and rejects it; extraction
    should not treat the claim as endorsed by the passage.
