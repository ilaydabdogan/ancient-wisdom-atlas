canonical_text:
  quote: ''
  summary: The passage gives rules for purification when water is unavailable; recalls
    divine covenant and commands justice; contrasts reward and punishment; describes
    covenants with Israel and Christians; presents the Apostle, light, and Book as
    guidance; rejects claims about the Messiah and divine sonship; recounts Moses
    urging his people to enter the holy land, their refusal, and forty years of wandering;
    and tells of the sons of Adam, unequal acceptance of offerings, fratricide, a
    raven teaching burial, and repentance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who are unclean are told to purify themselves; if water is unavailable
    because of sickness, journey, or other stated conditions, they are told to use
    clean sand on face and hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated divine purpose of the purification rule is not to burden the people
    but to purify them and complete favour toward them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Believers are reminded of God's covenant with them and of their response that
    they heard and would obey.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Believers are commanded to stand as righteous witnesses for God and not let
    ill-will prevent upright conduct.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those who believe and do right are promised pardon and a great reward, while
    those who reject and treat signs as lies are associated with Hell fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Believers are told to remember that God restrained hostile people who intended
    to stretch out their hands against them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: God accepted the covenant of the children of Israel, raised twelve leaders
    from among them, and set conditions involving prayer, alms, belief in apostles,
    helping them, and lending God a liberal loan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The promised result for faithful covenant obedience is forgiveness of evil
    deeds and entrance into gardens beneath which rivers flow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The covenant-breaking of Israel is followed by cursing, hardened hearts, shifting
    words of Scripture, and forgetfulness of what had been taught.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Those who say they are Christians are also described as having accepted a
    covenant and as having forgotten part of what they were taught, with enmity and
    hatred lasting until the Resurrection.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Apostle is said to have come to the people of the Scriptures with a light
    and clear Book from God, guiding followers from darkness to light and to the straight
    path.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage rejects the statement that God is the Messiah son of Mary and
    emphasizes God's sovereignty over heaven, earth, and creation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Jews and Christians are quoted as saying they are sons of God and his beloved;
    the reply says they are created humans subject to pardon or chastisement.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Moses reminds his people of God's gifts, including prophets, kings, and unprecedented
    gifts, and commands them to enter the holy land destined for them.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Moses' people refuse to enter because powerful men are there, while two God-fearing
    men urge them to enter by the gate and trust God.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: After the refusal, Moses asks God to distinguish between himself, his brother,
    and the ungodly people; the land is forbidden to the people for forty years, during
    which they wander perplexed in the earth.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Two sons of Adam each offer an offering; one offering is accepted and the
    other is not, leading the rejected brother to threaten killing.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: The threatened brother refuses to retaliate, states fear of God, and speaks
    of the Fire as recompense for unjust doers.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:19
  text: The rejected brother kills his brother, then a raven scratches the ground
    to show him how to hide his brother's wrong, after which he becomes repentant.
  category: sequence
  evidence_refs:
  - ev:14
