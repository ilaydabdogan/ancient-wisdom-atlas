canonical_text:
  quote: ''
  summary: The passage exhorts people to believe in an apostle who has come with truth
    from God; warns the People of the Book not to exceed bounds in religion or say
    “Three”; identifies Jesus son of Mary as God’s apostle, Word conveyed into Mary,
    and Spirit from God, while denying divine sonship. It states that the Messiah
    and nearby angels are servants of God, that God will gather all, reward believers
    and righteous actors, and chastise the proud. It describes a proof and clear light
    sent down, guidance along a straight way, and gives an inheritance ruling for
    childless kin. Translator notes discuss historical setting, marriage, inheritance,
    punishments, prayer practices, and comparisons with Rabbinic rules.
  language: English
