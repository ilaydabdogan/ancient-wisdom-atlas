  summary: The passage warns against denying divine signs, recounts a person who abandoned
    signs and was followed by Satan, describes divine guidance and misguidance, Hell,
    the unknown Hour, Muhammad's limited role as warner, creation from a single person
    and wife, human ingratitude through associating partners with God, the inability
