canonical_text:
  quote: ''
  summary: The passage exhorts believers to faith, striving, almsgiving, and support
    of God and the apostle. It promises forgiveness, gardens with rivers, divine help,
    conquest, and reward. It invokes Jesus son of Mary and his apostles as helpers
    of God. Sura LVII opens with praise of God as creator, sovereign, knower, life-giver
    and death-bringer, then describes God bringing people from darkness into light,
    recompensing believers, and a judgment scene in which believers have light while
    hypocrites are separated by a wall and face fire. The passage closes by urging
    humility and noting that God revives the earth after its death.
  language: English
  quote_policy: summarized
