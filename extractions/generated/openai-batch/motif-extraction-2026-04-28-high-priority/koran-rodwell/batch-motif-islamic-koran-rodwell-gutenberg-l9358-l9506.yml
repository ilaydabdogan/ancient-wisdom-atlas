canonical_text:
  quote: ''
  summary: The passage warns hearers that no gods beside God can protect them, announces
    just weighing and reckoning on the day of resurrection, recalls scripture or guidance
    given to earlier figures, and narrates episodes involving Abraham’s rejection
    of idols and rescue from fire, Lot’s rescue, Noah’s deliverance and the drowning
    of his opponents, David and Solomon’s divinely granted judgment and powers, Job’s
    relief, patient righteous figures, Dhoulnoun’s cry in darkness and rescue, Zacharias’s
    granted child, and the maiden and her son made a sign. It closes by affirming
    one religion under one Lord and saying divided groups will return to God.
  language: English
  quote_policy: summarized
