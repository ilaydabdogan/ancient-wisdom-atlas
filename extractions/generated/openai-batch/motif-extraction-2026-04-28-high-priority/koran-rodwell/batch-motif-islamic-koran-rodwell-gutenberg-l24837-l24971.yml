  summary: The passage gives notes on events connected with Hudaibiya and related
    campaigns, then presents Sura LXVI, in which the Prophet is addressed about forbidding
    what God has made lawful, release from oaths, a disclosed secret among his wives,
    divine protection of the Prophet, warnings to believers and unbelievers, penitence,
    judgment by fire, examples of the wives of Noah and Lot as deceivers, and examples
    of the wife of Pharaoh and Mary as believing women. The passage ends with the
    opening of Sura LX, warning believers not to take God's foes as friends.
