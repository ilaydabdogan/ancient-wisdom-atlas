canonical_text:
  quote: ''
  summary: The passage denies divine begetting in relation to Jesus, warns of judgment,
    recounts Abraham's dispute with his father and separation from idolatry, commemorates
    Moses, Aaron, Ismael, and Edris, describes guided prophets and later erring successors,
    promises the Garden to righteous servants, and depicts resurrection, gathering
    around Hell, deliverance of the God-fearing, and the failure of false gods to
    help unbelievers.
  language: English
  quote_policy: summarized
