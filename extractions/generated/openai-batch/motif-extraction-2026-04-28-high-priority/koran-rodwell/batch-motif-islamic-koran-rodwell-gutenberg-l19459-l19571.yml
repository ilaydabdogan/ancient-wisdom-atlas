canonical_text:
  quote: ''
  summary: The passage gives regulations for fasting, marital relations, wealth, pilgrimage
    timing and rites, fighting and restraint, remembrance of God, contrasting worldly
    and afterlife petitions, examples of a destructive hypocritical opponent and a
    self-offering servant, warnings against Satan, and images of divine judgment,
    return to God, punishment, and resurrection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the night of the fast, the addressees are allowed to approach their
    wives; wives and husbands are described as garments for one another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eating and drinking are permitted until the distinction between a white thread
    and a black thread can be discerned at daybreak, after which strict fasting continues
    until night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage instructs the addressees not to approach their wives while passing
    time in the mosques and calls these limits bounds set by God.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage forbids consuming wealth vainly among one another and presenting
    it to judges in order to consume part of other men's wealth unjustly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: New moons are described as fixed periods for human service and pilgrimage.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says piety is not entering houses at the back, but entering houses
    by their doors and fearing God.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The addressees are commanded to fight those who fight against them, but not
    to attack first.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage restricts attack at the sacred Mosque unless the addressees are
    attacked there, and says hostility should cease if opponents desist, except against
    the wicked.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sacred month and sacred precincts are described as under safeguards of
    reprisals, with reciprocal response to violence commanded.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The addressees are told to give freely for God's cause, not throw themselves
    into ruin, and do good.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pilgrimage and visitation rites include offerings, delaying head-shaving until
    the offering reaches the place of sacrifice, and substitutions by fasting, alms,
    or offering for illness or head ailment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: For those unable to offer, fasting is prescribed for three days during pilgrimage
    and seven days after return, making ten days total.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pilgrimage is to occur in known months, without sexual relations, transgression,
    or wrangling; provision is urged, with fear of God called the best provision.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage describes movement from Arafat, remembrance of God near the holy
    monument, and asking God's pardon after passing on with the people.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After holy rites, remembrance of God is compared to remembrance of one's fathers
    or to a stronger remembrance.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: One prayer asks only for a portion in this world; another asks for good in
    this world, good in the next, and protection from the torment of the fire.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: A man is described as impressive in speech about present life and invoking
    God as witness, while being zealous in opposition.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: When that man turns away, he runs through the land causing disorders and wasting
    fields and flocks; when told to fear God, pride of sin seizes him, and Hell is
    assigned as his couch.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: Another man is described as selling his very self out of desire to please
    God.
  category: action
  evidence_refs:
  - ev:13
- id: obs:20
  text: Believers are told to enter completely into the true religion and not follow
    the steps of Satan, who is called their declared enemy.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: The passage says God may come down overshadowed with clouds, with the angels
    also, and that doom will be sealed; all things return to God.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:22
  text: The children of Israel are cited as recipients of many clear signs, and altering
    God's boon after receiving it is linked to vehement punishment.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:23
  text: The present life is described as prepared for unbelievers who mock the faithful,
    while those who fear God will be above them on the day of resurrection.
  category: relationship
  evidence_refs:
  - ev:17
