- id: motif:1
  label: Purposeful creation with fixed eschatological term
  taxonomy_refs:
  - divine_judgment
  basis: The heavens and earth are said to be created for a serious end and fixed
    term, and human beings are told they will meet their Lord.
  evidence_refs:
