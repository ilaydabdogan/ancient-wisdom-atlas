canonical_text:
  quote: ''
  summary: 'The passage recounts episodes from Joseph''s story: the Prince''s wife
    is reproved, city women see Joseph and cut their hands, Joseph chooses prison
    over yielding to solicitation, he interprets prison dreams, later interprets the
    King''s dream of seven fat and seven lean cattle and seven green and withered
    ears, is vindicated by the women, is appointed over the granaries, and later receives
    his brothers without their recognizing him.'
  language: English
  quote_policy: summarized
