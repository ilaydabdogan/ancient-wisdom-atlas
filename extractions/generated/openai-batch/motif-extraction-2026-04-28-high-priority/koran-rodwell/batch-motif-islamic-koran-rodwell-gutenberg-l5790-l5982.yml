canonical_text:
  quote: ''
  summary: 'The passage describes divine judgment, Hell and Paradise, resurrection
    from graves, and warning by the Koran. It then opens Sura XX with divine sovereignty
    and the story of Moses: Moses sees a fire, is called by God in the holy valley,
    receives signs of the staff becoming a serpent and the white hand, is sent to
    Pharaoh, asks for Aaron as helper, and is reminded of his infant rescue in an
    ark on the water and his later trials.'
