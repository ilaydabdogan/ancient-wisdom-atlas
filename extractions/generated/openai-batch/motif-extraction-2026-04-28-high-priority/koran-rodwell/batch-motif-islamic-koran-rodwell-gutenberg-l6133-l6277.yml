canonical_text:
  quote: ''
  summary: The passage recounts questioning of Aaron and Samiri after the making of
    the calf, Samiri's explanation involving dust from the messenger's track, and
    the announced destruction of the calf. It then presents admonition about resurrection,
    judgment, the trumpet, the leveling of mountains, intercession, righteous believers,
    and divine knowledge. The passage also recounts the covenant with Adam, the angels'
    prostration, Eblis's refusal, Satan's temptation through the tree of Eternity,
    Adam and his wife eating from it, their exposure and covering with leaves, Adam's
    later selection and guidance, descent from the garden, and later warnings about
    guidance, blindness at resurrection, destroyed generations, prayer, provision,
    signs, and awaiting the end.
  language: English
  quote_policy: summarized
