canonical_text:
  quote: ''
  summary: The passage exhorts believers to trust and obey God and the apostle, treat
    family and wealth as trials, give alms, and remember God. It presents Sura LXII
    on divine praise, the sending of an apostle to teach the Book and wisdom, criticism
    of those who do not bear the law, a challenge to Jews concerning death, Friday
    assembly prayer, and the congregation’s distraction by trade or sport. It then
    begins Sura VIII, assigning spoils to God and the apostle, describing true believers,
    recalling a disputed departure on a mission of truth, and promising aid by a thousand
    angels.
  language: English
