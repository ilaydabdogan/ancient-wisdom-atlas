canonical_text:
  quote: ''
  summary: 'The passage gives communal instructions to believers: heed God and His
    Apostle, reconcile fighting believers, avoid mockery, suspicion, prying, and backbiting,
    recognize that peoples and tribes were created for mutual knowledge, and distinguish
    outward profession from sincere faith. It then opens Sura IX with an immunity
    or declaration concerning treaty relations with polytheist Arabs, including a
    four-month period, exceptions for upheld treaties, commands after the sacred months,
    and asylum for one who asks to hear the Word of God.'
  language: English
  quote_policy: summarized
