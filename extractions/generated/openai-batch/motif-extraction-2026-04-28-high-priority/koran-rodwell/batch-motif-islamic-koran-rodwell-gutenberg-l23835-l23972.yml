canonical_text:
  quote: ''
  summary: The passage closes one section by condemning the Hypocrites of Medina,
    warning believers not to let wealth and children distract them from God, and urging
    expenditure before death, since no soul is respited once its hour comes. It then
    begins Sura XXIV, Light, presenting divine signs and legal-moral rulings on sexual
    misconduct, accusations, witness requirements, oaths, calumny, Satanic prompting,
    charity, pardon, curse and punishment for false charges, bodily testimony on the
    day of judgment, and vindication of the virtuous.
  language: English
  quote_policy: summarized
