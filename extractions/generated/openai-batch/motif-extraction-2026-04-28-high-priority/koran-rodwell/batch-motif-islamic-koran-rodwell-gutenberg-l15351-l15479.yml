canonical_text:
  quote: ''
  summary: The passage contains translator notes followed by the opening portion of
    Sura XLII, Counsel. It presents God as revealer, creator, owner of heaven and
    earth, merciful judge, provider, and sender of the Book and Balance. The prophet
    is told to warn the mother city and surrounding people of the Day of Gathering,
    when some will be in Paradise and some in the flame. The passage affirms continuity
    with commands given to Noah, Abraham, Moses, and Jesus, criticizes sectarian division
    and disputation, and contrasts the harvest of the life to come with the harvest
    of this life.
  language: English
  quote_policy: summarized
