canonical_text:
  quote: ''
  summary: The passage instructs believers concerning opponents who break oaths, oppose
    the Apostle, or associate partners with God; distinguishes true piety from temple
    service alone; recalls divine help at Honein; restricts access to the sacred Temple;
    criticizes certain Jewish and Christian claims and corrupt religious leaders;
    promises gardens to those who believe, flee, and strive; threatens hell-fire punishment
    for hoarded treasure; and affirms the sacred calendar of twelve months with four
    sacred months.
  language: English
  quote_policy: summarized
