canonical_text:
  quote: ''
  summary: 'The passage recalls divine reassurance and aid to the faithful during
    conflict: sleep and heavenly water cleanse and steady them; angels are commanded
    to support them; believers are warned not to retreat and are told that God, not
    they, was the true agent of victory. It contrasts faithful obedience with unbelief,
    plotting, mock worship, and spending wealth to turn people from God. It promises
    punishment, Hell, forgiveness if unbelievers desist, divine protection for the
    faithful, and rules for distributing booty. It also recalls the battlefield setting,
    the meeting of hosts, and a dream in which the enemy appeared few.'
  language: English
  quote_policy: summarized
