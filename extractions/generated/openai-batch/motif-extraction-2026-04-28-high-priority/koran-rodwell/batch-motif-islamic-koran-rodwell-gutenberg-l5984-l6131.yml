- id: motif:1
  label: Divine mission to liberate an oppressed people
  taxonomy_refs:
  - departure
  - covenant
  basis: Moses and Aaron are commissioned to go to Pharaoh, demand release of the
    children of Israel, and later Moses leads God's servants out by night.
  evidence_refs:
