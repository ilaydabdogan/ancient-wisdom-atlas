canonical_text:
  quote: ''
  summary: The passage asserts that God alone has power in heaven and earth, allows
    intercession only by His leave, provides sustenance, gathers all people, judges
    between them, rewards believers, and punishes deniers. Opponents reject the Qur'an
    and previous books, dispute responsibility before their Lord, blame leaders and
    plots, and later repent after seeing punishment. Angels deny that they were the
    true objects of worship and identify the Djinn as those whom many worshipped.
    The prophet is described as a warner sent to mankind, not possessed by a djinn,
    asking no wage. The passage closes with images of terror, no escape, belated belief,
    and a gulf between the deniers and what they desire.
  language: English
  quote_policy: summarized
