canonical_text:
  quote: ''
  summary: The passage addresses the children of Israel, recalls divine favor, covenant
    obligations, rescue from Pharaoh, the parting of the sea, Moses' forty nights,
    the calf episode, divine forgiveness, revelation of the Book, death and revival
    after a thunderbolt, manna and quails, entry into a city, water from a rock, food
    complaints, covenant under a lifted mountain, Sabbath transgression and transformation,
    the sacrifice of a cow, and the revival of a slain man by striking the corpse
    with part of the cow.
