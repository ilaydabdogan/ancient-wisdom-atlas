  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage states that souls will face a day when no soul can satisfy for
    another, no intercession or ransom will be accepted, and no help will be given.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: God is said to have rescued the children of Israel from the people of Pharaoh,
    who imposed cruel chastisement and killed male children while sparing females.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sea is said to have been parted for the children of Israel; they were
    saved, and the people of Pharaoh were drowned while the Israelites looked on.
