  text: Clouds overshadowed the people, and manna and quails were sent down for food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The people were instructed to enter a city through a gate with prostrations
    and to say a word of forgiveness, but evil-doers changed the word and received
