  text: Moses told his people they had sinned by taking the calf for worship and instructed
    them to turn to their creator and slay the guilty among them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the people demanded to see God plainly, a thunderbolt fell on them, and
    then they were raised to life after death.
  category: sequence
  evidence_refs:
  - ev:5
