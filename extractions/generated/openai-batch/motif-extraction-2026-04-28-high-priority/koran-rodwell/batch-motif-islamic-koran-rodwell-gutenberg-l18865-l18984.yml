  evidence_refs:
  - ev:3
- id: obs:6
  text: During Moses' forty nights of absence, the people took the calf and acted
    wickedly, after which God forgave them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Moses received the Book and the Illumination for guidance.
  category: object
  evidence_refs:
  - ev:4
