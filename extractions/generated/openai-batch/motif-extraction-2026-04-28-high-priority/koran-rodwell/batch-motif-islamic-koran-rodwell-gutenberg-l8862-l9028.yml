canonical_text:
  quote: ''
  summary: The passage praises believers who pray, give alms, restrain appetites,
    keep trusts and covenants, and inherit paradise. It describes human creation from
    clay and embryonic stages, death, resurrection, seven heavens, rain, plants, cattle,
    and transport. It recounts Noah's rejected warning, the making of the ark, rescue
    of pairs and family, and drowning of the wicked. It then describes later generations
    rejecting apostles and suffering destruction, including a Moses and Aaron episode
    with Pharaoh, and names the Son of Mary and his mother as a sign in a lofty watered
    abode. It concludes with exhortations to apostles, the unity of religion, human
    sectarian division, righteous fear, return to the Lord, and a truthful book with
    God.
  language: English
  quote_policy: summarized
