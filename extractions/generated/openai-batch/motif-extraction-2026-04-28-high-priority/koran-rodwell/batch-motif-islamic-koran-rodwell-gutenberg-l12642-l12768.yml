canonical_text:
  quote: ''
  summary: 'The passage contrasts transient worldly reward with punishment or paradise
    in the next world, defends the revealed Book against accusations of human invention,
    and narrates Noah’s mission: he warns his people, is rejected and mocked, is commanded
    to build the Ark, takes selected beings and believers aboard, and sees a disbelieving
    son drowned when he seeks refuge on a mountain from the waters.'
  language: English
  quote_policy: summarized
