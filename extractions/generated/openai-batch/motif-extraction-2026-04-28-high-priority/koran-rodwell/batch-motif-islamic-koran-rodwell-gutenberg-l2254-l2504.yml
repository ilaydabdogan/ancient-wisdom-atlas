canonical_text:
  quote: ''
  summary: The passage contains several short Meccan suras. They rebuke neglect of
    a blind seeker, present the Koran as a warning on honored pages, describe human
    creation, death, burial, resurrection, divine provision through rain and crops,
    and scenes of judgment marked by the trumpet-blast, fleeing kin, radiant or darkened
    faces, fire, and punishment. Other suras praise the Most High, contrast the present
    life with the enduring life to come, invoke fig, olive, Sinai, the sacred territory,
    the declining day, and the starry heaven, and recount persecutors of believers
    associated with a fuel-fed trench of fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure frowns and turns away because a blind man comes to him, while a wealthy
    man receives attention and an earnest, fearful seeker is neglected.
  category: sequence
  evidence_refs:
