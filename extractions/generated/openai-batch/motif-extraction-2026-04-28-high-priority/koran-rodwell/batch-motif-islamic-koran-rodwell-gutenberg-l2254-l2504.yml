- id: obs:2
  text: The Koran is described as a warning, borne in mind by whoever wills, written
    on honored, exalted, purified pages by honored and righteous scribes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Man is said to be created from moist germs, fashioned, given an easy passage
