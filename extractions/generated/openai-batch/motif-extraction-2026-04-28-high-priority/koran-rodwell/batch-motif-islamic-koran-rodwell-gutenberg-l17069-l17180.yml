canonical_text:
  quote: ''
  summary: 'The passage recounts Moses returning angrily to his people after the calf
    episode, interceding for himself and his brother, receiving guidance in the tablets,
    choosing seventy men for an appointed meeting where an earthquake overtakes them,
    and praying for mercy. God describes mercy, chastisement, and the future unlettered
    Prophet. The passage then summarizes episodes involving the Israelites: twelve
    tribes, water from the rock, clouds, manna and quails, entry into a city with
    a word of forgiveness, Sabbath transgression by a seaside city, punishment and
    deliverance, division and testing of peoples, inheritance of the Book, the mount
    shaken over them, and the descendants of Adam made to witness God''s lordship.'
  language: English
  quote_policy: summarized
