canonical_text:
  quote: ''
  summary: The passage warns against sorcery attributed to Satans and to the teaching
    associated with Harut and Marut, instructs believers in proper speech and obedience,
    affirms God's sovereignty, disputes claims of exclusive salvation and divine sonship,
    describes judgment and resurrection, recalls Israel's favor and accountability,
    and recounts Abraham's trial, covenant, association with the Holy House, prayer
    with Ismael, and request for a future apostle to teach the Book and Wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says people followed what the Satans read in Solomon's reign,
    while denying that Solomon was unbelieving.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sorcery is described as taught to men, including what had been revealed to
    the two angels Harut and Marut at Babel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Harut and Marut are said not to teach anyone until first warning, 'We are
    only a temptation. Be not then an unbeliever.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men learn from the two how to cause division between man and wife, but the
    passage states that harm occurs only by God's leave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that those who bought the art have no part in the life
    to come, and contrasts this with the reward from God for belief and fear of God.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Believers are instructed not to address the apostle with one expression but
    with another, and to attend to the instruction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says God may cancel or cause verses to be forgotten and bring
    a better or similar one, because God has power over all things.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The dominion of the heavens and earth is assigned to God, and no patron or
    helper is said to exist apart from God.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage refers to asking the apostle what was formerly asked of Moses
    and describes exchange of faith for unbelief as error from the even way.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage reports disputes among Jews and Christians and says God will judge
    between them on the resurrection day.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says the East and West belong to God and that whichever way one
    turns, there is the face of God.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage rejects the statement that God has a son and affirms that whatever
    is in the heavens and earth belongs to Him and obeys Him.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: God is described as maker of the heavens and earth, whose decree is expressed
    as saying 'Be,' after which the thing is.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: The apostle is described as sent with the Truth, as a bearer of good tidings
    and a warner.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:15
  text: The children of Israel are told to remember God's favor and to dread a day
    when no soul can satisfy for another, no ransom is accepted, no intercession avails,
    and no help is given.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: Abraham is tried by his Lord with commands, fulfills them, and is told he
    will be made an Imam to mankind; the covenant is said not to embrace evildoers.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:17
  text: The Holy House is appointed as a resort and safe retreat, and the station
    of Abraham is named as a place of prayer.
  category: setting
  evidence_refs:
  - ev:16
- id: obs:18
  text: Abraham and Ismael are commanded to purify God's house for procession, devotion,
    bowing, and prostration.
  category: action
  evidence_refs:
  - ev:16
- id: obs:19
  text: Abraham asks for the land to be secure and for its believing people to be
    supplied with fruits; unbelievers are granted temporary goods before being driven
    to the torment of the Fire.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:20
  text: Abraham and Ismael raise the foundations of the House and ask God to accept
    it from them.
  category: action
  evidence_refs:
  - ev:18
- id: obs:21
  text: Abraham and Ismael ask that they and their posterity be made Muslims, that
    holy rites be taught, and that an apostle be raised to rehearse signs, teach the
    Book and Wisdom, and purify them.
  category: speech
  evidence_refs:
  - ev:19
