candidate_motifs:
- id: motif:1
  label: Forbidden or harmful knowledge taught under warning
  taxonomy_refs:
  - forbidden_knowledge
  basis: Sorcery is taught, the teachers warn that they are a temptation, and learners
    acquire what harms rather than profits them and endangers their share in the life
    to come.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage frames the knowledge as harmful and unbelief-associated; it
    does not narrate theft of knowledge.
- id: motif:2
  label: Divine judgment at resurrection and final accountability
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: God is said to judge disputes on resurrection day, and a day is described
    when no soul can satisfy for another, no ransom is accepted, and no intercession
    or help avails.
  evidence_refs:
  - ev:9
  - ev:14
  confidence: high
  cautions: The passage gives doctrinal statements rather than a narrated judgment
    scene.
- id: motif:3
  label: Covenant after patriarchal testing
  taxonomy_refs:
  - covenant
  - initiation
  basis: Abraham is tried by commands, fulfills them, is appointed an Imam, and receives
    a statement about the limits of God's covenant.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The initiation label is secondary; the passage explicitly supports testing
    and covenant more directly.
- id: motif:4
  label: Sanctuary foundation and ritual purification
  taxonomy_refs:
  - world_center
  basis: The Holy House is appointed as a resort and safe retreat; Abraham and Ismael
    purify it and raise its foundations for prayer, procession, devotion, bowing,
    and prostration.
  evidence_refs:
  - ev:16
  - ev:18
  confidence: medium
  cautions: The passage presents a sacred sanctuary; 'world center' is an interpretive
    taxonomy fit and is not explicitly stated.
- id: motif:5
  label: Divine creative command
  taxonomy_refs: []
  basis: God is described as maker of the heavens and earth whose decree consists
    of saying 'Be,' after which the thing is.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No exact available taxonomy reference fits this motif.
- id: motif:6
  label: Universal divine orientation
  taxonomy_refs: []
  basis: The East and West are said to belong to God, and whichever way one turns,
    there is the face of God.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is a theological spatial image rather than a full narrative motif.
- id: motif:7
  label: Rejection of divine sonship
  taxonomy_refs:
  - divine_parent_child
  basis: The passage reports and rejects the statement that God has a son, affirming
    instead that all in the heavens and earth belongs to and obeys Him.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The taxonomy reference names the broader motif family; this passage uses
    it polemically by denying the relationship.
- id: motif:8
  label: Apostle as teacher of scripture, wisdom, and purification
  taxonomy_refs:
  - wisdom
  basis: Abraham and Ismael pray for an apostle who will rehearse signs, teach the
    Book and Wisdom, and purify the people.
  evidence_refs:
  - ev:19
  confidence: high
  cautions: The passage presents this as a prayer/request, not a narrated fulfillment
    within the selected lines.
