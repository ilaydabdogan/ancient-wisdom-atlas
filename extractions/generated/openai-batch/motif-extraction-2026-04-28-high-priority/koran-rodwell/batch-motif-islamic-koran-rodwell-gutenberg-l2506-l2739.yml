canonical_text:
  quote: ''
  summary: 'The passage presents several short Meccan suras and notes. It describes
    reward for believers in gardens with rivers, divine vengeance and sovereignty,
    the preserved Table, and multiple scenes of the Last Day: the Blow, the Earthquake,
    the Cleaving, and the Folding Up. Human deeds are weighed, recorded, revealed,
    and judged; the righteous receive delight or Paradise, while the wicked face the
    pit, Hell-fire, and a raging fire. Cosmic signs include quaking earth, cleaving
    heaven, falling stars, boiling or mingled seas, moving mountains, opened graves,
    unrolled records, and assembled creatures. The passage also defends the revealed
    warning as the word conveyed by an illustrious messenger, identified in a note
    as Gabriel.'
  language: English
  quote_policy: summarized
