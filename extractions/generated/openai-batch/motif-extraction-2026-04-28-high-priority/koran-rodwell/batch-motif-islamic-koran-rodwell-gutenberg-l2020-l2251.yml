candidate_motifs:
- id: motif:1
  label: Moral path as difficult ascent or steep way
  taxonomy_refs:
  - wisdom
  basis: The passage defines the steep as concrete acts of ransom, feeding, belief,
    steadfastness, and compassion after saying man was guided to two highways.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The taxonomy reference is broad; the passage does not present a narrative
    ascent, only a moralized image of a steep path.
- id: motif:2
  label: Right and left division in judgment
  taxonomy_refs:
  - divine_judgment
  basis: The passage divides people into right-hand and left-hand groups and associates
    the left-hand group with closing fire.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a compact eschatological distinction without extended
    judgment-scene details.
- id: motif:3
  label: Divine defeat of hostile army through nonhuman agents
  taxonomy_refs:
  - divine_judgment
  basis: The Lord defeats the army of the Elephant by sending flocks of birds with
    clay-stones and reducing the army to eaten stubble.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The translator's note offers a historical-medical interpretation, so legendary
    elaboration should not be inferred beyond the passage.
- id: motif:4
  label: Sacred house as focus of provision and protection
  taxonomy_refs: []
  basis: The Koreisch are told to worship the Lord of this house because he provided
    food against hunger and security against alarm.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: No available taxonomy reference directly names sacred house or sanctuary
    protection.
- id: motif:5
  label: Descent of revelation and heavenly beings during a sacred night
  taxonomy_refs:
  - wisdom
  basis: The passage says the revealed text descends on the Night of Power, when angels
    and the spirit descend and peace lasts until morning.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The taxonomy reference is general; the passage emphasizes revelation and
    descent, not a human quest.
- id: motif:6
  label: Restoration to life after death for disclosure of secrets
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: God is described as able to restore man to life on a day when all secrets
    are searched out and man has no helper.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage is doctrinal and compressed rather than a narrative of an
    individual resurrection.
- id: motif:7
  label: Cosmic oath validating revelation
  taxonomy_refs:
  - wisdom
  basis: Oaths by heavenly and earthly phenomena are used to affirm that the Koran
    is a discriminating discourse.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: This is a rhetorical pattern rather than a narrative motif.
- id: motif:8
  label: Sacred animal violated followed by collective destruction
  taxonomy_refs:
  - divine_judgment
  basis: The Themoud reject the Apostle's warning about the Camel of God, hamstring
