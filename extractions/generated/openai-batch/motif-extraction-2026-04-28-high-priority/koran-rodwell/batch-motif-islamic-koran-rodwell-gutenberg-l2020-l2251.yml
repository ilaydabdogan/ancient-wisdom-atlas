canonical_text:
  quote: ''
  summary: 'The passage presents several short Meccan suras and notes: moral testing
    through hardship, charity, belief, and right/left-handed judgment; divine defeat
    of the army of the Elephant by birds hurling clay-stones; the Koreisch urged to
    worship the Lord of the House who feeds and secures them; the descent of revelation
    on the Night of Power with angels and spirit; oaths by the night-comer star, heaven,
    earth, and human creation, with resurrection and searching of secrets; and oaths
    by sun, moon, day, night, heaven, earth, and soul, ending with the Themoud rejecting
    the Apostle and hamstringing the Camel of God before divine destruction.'
  language: English
  quote_policy: summarized
