canonical_text:
  quote: When He decreeth a thing, He only saith, 'Be,' and it is.
  summary: The passage affirms God's oneness, knowledge, sovereignty, judgment, and
    mercy; instructs the addressed messenger to call others to surrender to God; warns
    against disbelief and false confidence about punishment; describes the day when
    souls receive what they have earned; and recounts the election of Adam, Noah,
    Abraham's family, and Imran's family. It narrates the wife of Imran vowing her
    unborn child, Mary's birth, naming, protection, upbringing by Zacharias, and miraculous
    provision in the sanctuary. Zacharias prays for descendants and receives an angelic
    announcement of John with a sign of three days of non-speaking except by signs.
    Angels announce Mary's chosenness and later the birth of the Messiah Jesus, son
    of Mary, who will speak in the cradle; Mary asks how she can have a son without
    male contact, and the reply emphasizes God's creative decree.
  language: English
  quote_policy: quoted
