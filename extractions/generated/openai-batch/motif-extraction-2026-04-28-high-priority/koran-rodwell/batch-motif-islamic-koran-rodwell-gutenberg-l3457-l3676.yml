canonical_text:
  quote: ''
  summary: The passage presents warnings against dishonest measure, denial of judgment,
    and rejection of divine signs; describes written registers for the wicked and
    righteous; depicts punishment, exclusion, and Hell-fire for sinners and delights
    for the righteous; recalls destroyed peoples and the Flood/Ark as warnings; describes
    cosmic upheaval at the trumpet, presentation before God, books received in right
    or left hand, paradise reward, hell punishment, and affirmation of the Koran as
    a divine warning.
  language: English
  quote_policy: summarized
