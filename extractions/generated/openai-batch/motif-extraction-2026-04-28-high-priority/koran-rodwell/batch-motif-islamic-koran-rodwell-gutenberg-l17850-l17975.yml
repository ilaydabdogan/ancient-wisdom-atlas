canonical_text:
  quote: ''
  summary: 'The passage presents warnings and assurances: God alone restores faculties,
    knows hidden things, judges souls, rescues from distress, and commands true guidance.
    It describes messengers as heralds and warners, the prophet as following revelation
    rather than possessing divine treasures or secret knowledge, believers as recipients
    of mercy, opponents as falsifiers, and every soul as accountable. It includes
    images of divine knowledge, night soul-taking and awakening, death by messengers,
    rescue from darkness on land and sea, punishment from above or below, boiling
    water for unbelief, a desert simile involving Satans, creation by the command
    ''Be,'' the trumpet on the day of kingdom, and Abraham rejecting images as gods
    before being shown the kingdom of heaven and earth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God is described as able to take away hearing and sight and set a seal upon
    hearts, with no other god able to restore them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sent Ones are described as heralds of good news and warners; believers who
    amend are promised no fear or sorrow, while those who call the signs false receive
    punishment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker is instructed to say that he does not possess God’s treasures,
    does not know secret things, is not an angel, and follows only what is revealed
    to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those who dread being gathered to their Lord are warned that they have no
    patron or intercessor except Him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Believers who come to the speaker are greeted with peace and told that their
    Lord has laid down for Himself a law of mercy for those who fault through ignorance,
    then turn and amend.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: God is said to possess the keys of secret things, know what is on land and
    sea, know every falling leaf and hidden grain, and have all things noted in a
    distinct writing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: God takes souls at night, knows what people have earned by day, awakens them
    for a fixed life-term, and then they return to Him to be told what they have done.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Guardians are sent over people until death overtakes them; then messengers
    take the soul and fail not, and the dead are returned to God for judgment and
    account.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: People cry secretly and humbly for rescue from the darkness of land and sea,
    promising thankfulness; God is said to rescue them from those conditions and from
    every strait.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: God is described as able to send punishment from above, from beneath the feet,
    through discord, or through violence among people.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The audience is told to withdraw from those who cavil at the signs until they
    turn to another subject, and not to sit with the ungodly after recollection if
    Satan causes forgetfulness.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Every soul is described as being consigned to doom for its own works, without
    patron or intercessor beside God, and compensation is not accepted; unbelievers
    receive boiling water and grievous torment.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Calling on beings beside God is compared to turning back after guidance and
    to a bewildered desert man spell-bound by Satans while companions call him to
    guidance.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: God is described as creator of the heavens and earth in truth; when He says
    to a thing, 'Be,' it is.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: On a day marked by a trumpet blast, the kingdom is said to belong to God,
    who knows the unseen and the seen.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: Abraham addresses his father Azar about taking images as gods and says that
    Azar and his people are in manifest error; Abraham is then shown the kingdom of
    the heavens and earth so that he might be established in knowledge.
  category: sequence
  evidence_refs:
  - ev:16
