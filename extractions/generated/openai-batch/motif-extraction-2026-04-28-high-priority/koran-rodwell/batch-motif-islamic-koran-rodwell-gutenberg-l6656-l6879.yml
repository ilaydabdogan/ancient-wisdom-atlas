canonical_text:
  quote: ''
  summary: 'The passage recounts several communities rejecting their apostles: the
    Adites and Houd, the Themoudites and Saleh with the she-camel sign, the people
    of Lot, and the dwellers in the forest of Madian with Shoaib. Each episode includes
    admonition, rejection, and divine punishment, followed by a repeated statement
    that the event was a sign and that the Lord is mighty or powerful and merciful.
    The passage then affirms the Book''s descent from the Lord through the faithful
    spirit in clear Arabic, denies that Satans brought it down, instructs the prophet
    to warn his kin and trust God, and contrasts satanic descent upon liars with poets
    followed by the erring.'
  language: English
  quote_policy: summarized
