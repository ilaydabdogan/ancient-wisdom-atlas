candidate_motifs:
- id: motif:1
  label: Rejected messenger followed by divine punishment
  taxonomy_refs:
  - divine_judgment
  basis: Multiple episodes repeat a sequence in which an apostle warns a community,
    the community rejects him as a liar, and destruction or chastisement follows.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The extraction identifies a repeated narrative pattern within the passage;
    it does not infer historical relation beyond the passage.
- id: motif:2
  label: Sign given before judgment
  taxonomy_refs:
  - divine_judgment
  basis: The she-camel is presented after the Themoudites demand a sign; harming her
    precedes punishment, and the passage repeatedly labels punishments as signs.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: Only the she-camel episode explicitly presents an object or animal as
    a requested sign in this line range.
- id: motif:3
  label: Righteous family delivered before communal destruction
  taxonomy_refs:
  - divine_judgment
  basis: Lot asks for deliverance; his family is delivered except an aged one, while
    the remaining people are destroyed by rain.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage states deliverance and destruction but gives limited details
    about the family members.
- id: motif:4
  label: Transgression of just measure and punitive cloud
  taxonomy_refs:
  - divine_judgment
  basis: Shoaib warns against dishonest measuring and fraud; after rejection, the
    chastisement of the day of cloud overtakes the people.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The nature of the cloud chastisement is not described beyond the passage
    wording.
- id: motif:5
  label: Descent of revelation through a spirit
  taxonomy_refs:
  - wisdom
  basis: The Book comes down from the Lord through the faithful spirit upon the prophet's
    heart in clear Arabic speech.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The available taxonomy has no exact 'revelation descent' family; 'wisdom'
    is used only as a broad supported category for revealed instruction.
- id: motif:6
  label: True revelation distinguished from satanic and poetic speech
  taxonomy_refs:
  - wisdom
  - duality
  basis: The passage contrasts the Book's divine descent with Satans descending on
    lying wicked persons and poets followed by the erring.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:13
  confidence: medium
  cautions: The dual contrast is explicit, but the taxonomy references are broad rather
    than exact.
- id: motif:7
  label: Water as provision and punishment
  taxonomy_refs: []
  basis: The passage uses fountains and drink as provisions, apportioned water for
    the she-camel and people, and fatal rain as punishment.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:7
  confidence: medium
  cautions: This is a symbolic pattern across selected details, not a single stated
    motif.
