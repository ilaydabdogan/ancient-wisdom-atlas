canonical_text:
  quote: ''
  summary: A believing speaker exhorts his people to follow the right way, warns of
    recompense, paradise, and fire, and rejects worship beside God. God preserves
    him, while the people of Pharaoh are exposed to fire and face severer punishment
    at the Hour. The passage depicts disputes among the punished in Hell, failed pleas
    for relief, divine aid for apostles and believers, Mosaic guidance and the Book,
    commands to patience and worship, signs in creation, human formation and life
    stages, divine power to give life and death, and the condemnation of deniers who
    are dragged into Hell while their former objects of worship vanish.
  language: English
  quote_policy: summarized
