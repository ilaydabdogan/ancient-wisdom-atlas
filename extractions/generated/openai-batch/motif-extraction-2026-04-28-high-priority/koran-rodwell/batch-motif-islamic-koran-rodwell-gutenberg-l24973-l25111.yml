canonical_text:
  quote: ''
  summary: The passage warns that kinship will not avail on the day of resurrection;
    presents Abraham and his followers as an example of renouncing idolatrous worship
    while trusting God; regulates relations with hostile and non-hostile outsiders;
    gives rules for believing women who come as refugees and for pledges made by believing
    women to the Prophet; commands avoidance of those under God's anger; briefly presents
    divine help and victory with people entering God's religion; and gives etiquette
    for believers in relation to God, the Apostle, the Prophet's apartments, and reports
    brought by questionable persons.
  language: English
  quote_policy: summarized
