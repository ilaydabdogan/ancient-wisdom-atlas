canonical_text:
  quote: ''
  summary: The passage recounts the rejection and rescue of Lot’s family, except his
    wife, and the destructive rain sent upon the warned people. It then presents a
    series of rhetorical questions affirming God as creator, sustainer, guide, knower
    of the unseen, and judge. It describes disbelief in resurrection, the coming of
    doom, a monster emerging from the earth, the gathering of deniers before God,
    the trumpet blast, cosmic upheaval including mountains passing away, and reward
    or punishment according to deeds. It concludes with commands to worship the sanctified
    land’s Lord, surrender to God, recite the Koran, and warn those who err.
  language: English
  quote_policy: summarized
