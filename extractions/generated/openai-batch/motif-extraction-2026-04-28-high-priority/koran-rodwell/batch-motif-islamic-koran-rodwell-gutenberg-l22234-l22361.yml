canonical_text:
  quote: ''
  summary: The passage exhorts believers to almsgiving, faith, restraint from covetousness,
    and pursuit of divine pardon and Paradise. It contrasts believers with deniers,
    describes worldly life as transient like plants after rain, states that events
    are written in a Book, and presents apostles as sent with tokens, scripture, balance,
    and iron. It recalls Noah, Abraham, Jesus son of Mary, the Evangel, and the later
    conduct of followers. The passage then begins Sura IV with commands concerning
    creation from one soul, reverence for kinship, orphan property, marriage limits,
    dowry, and guardianship of property.
  language: English
  quote_policy: summarized
