canonical_text:
  quote: ''
  summary: The passage closes a prior section by distinguishing believers who do good
    and defend themselves when unjustly treated from unjust opponents. It then includes
    translator notes, followed by the opening of Sura XV, Hedjr. The sura presents
    the signs of the Book and warning, the eventual regret of infidels, fixed terms
    for destroyed cities, mockery of the warned messenger, divine guardianship of
    the warning, earlier apostles being derided, a hypothetical heavenly ascent still
    rejected by unbelievers, the adorned and guarded heavens, Satanic eavesdropping
    pursued by flame, the spread earth with mountains, measured sustenance, winds
    and rain, divine power over life, death, and gathering, and the creation of man
    from clay and the djinn from fire, with angels commanded to bow to fashioned man
    after the divine breath is given.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who believe, do good works, remember God often, and defend themselves
    when unjustly treated are excepted from the preceding condemnation; those who
    treat them unjustly are said to face an awaited lot.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says infidels will wish they had been Muslims and are allowed
    to feast, enjoy themselves, and be beguiled by hope until they know the truth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: No city is destroyed before its appointed term, and no people can forestall
    or delay its destiny.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Opponents address the warned person as one to whom the warning has been sent
    down, call him possessed by a djinn, and demand angels as proof of truthfulness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that angels are not sent down without due cause and that,
    in such a case, the infidels would not be respited.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The warning is said to have been sent down by the speaking divine voice, which
    also states it will guard the warning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Apostles had already been sent among earlier groups, but every apostle who
    came to them was derided.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a gate in Heaven were opened above the unbelievers and they were mounting
    up to it, they would still say their eyes were drunken and that they were enchanted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Signs of the zodiac are set in the heavens and adorned for beholders; the
    heavens are guarded from every stoned Satan, except one who steals a hearing and
    is pursued by a visible flame.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The earth is spread forth, mountains are placed on it, and everything is caused
    to spring forth in balanced measure.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sustenance is provided for humans and for creatures not sustained by humans;
    all things have storehouses with the divine speaker and are sent down in settled
    measure.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Fertilising winds are sent forth, rain is caused to descend from heaven, and
    humans are given to drink of it while not being its storers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The divine speaker causes life and death, is the heir of all things, knows
    those who come first and later, and will gather them together again.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Man is created from dried clay and dark molded loam; the djinn had previously
    been created from subtle fire.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Lord tells the angels that after fashioning man and breathing of the divine
    spirit into him, they are to fall down and worship him; the angels bow down all
