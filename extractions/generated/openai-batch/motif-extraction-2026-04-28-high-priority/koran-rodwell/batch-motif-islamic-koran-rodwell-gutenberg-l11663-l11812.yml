canonical_text:
  quote: ''
  summary: The passage presents natural phenomena as signs of God, warns mockers and
    disbelievers of punishment, describes God’s subjection of sea and cosmos for human
    benefit, recalls gifts of Book, Wisdom, and Prophecy to the children of Israel,
    commands adherence to divine law, asserts resurrection and judgment according
    to deeds, depicts nations kneeling before their books, contrasts mercy for believers
    with fire for those who mocked the signs, and opens Sura XVI with divine doom,
    angelic descent with the Spirit, creation, and human contentiousness.
  language: English
  quote_policy: summarized
