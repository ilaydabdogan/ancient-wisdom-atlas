canonical_text:
  quote: ''
  summary: The passage recalls God's covenant with prophets, describes the trial of
    believers during an attack by confederate armies, contrasts hypocritical fear
    with faithful trust, reports divine deliverance and defeat of enemies, instructs
    the Prophet's wives about choice, conduct, reward, and chastisement, and lists
    virtues for which God has prepared forgiveness and recompense.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God is said to have entered into a strict covenant with the Prophets, including
    Noah, Abraham, Moses, Jesus son of Mary, and the addressed Prophet.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: God will question truthful people about their truth and has prepared torment
    for unbelievers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Believers are told to remember God's goodness when armies came against them
    and God sent a blast and unseen hosts against the attackers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The believers are described as being assaulted from above and below, with
    distracted eyes, fearful hearts, and strong quaking.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Disaffected and diseased-hearted people say that God and His Apostle had made
    only a cheating promise.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some people of Yathrib urge return to the city, while others ask the Prophet's
    leave to return, claiming their houses are undefended; the passage states their
    intent was to flee.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The disaffected had previously pledged to God not to turn their backs, and
    the passage says such a pledge must be enquired of.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Prophet is instructed to say that flight will not profit those fleeing
    death or slaughter, and that only briefly would they enjoy good things.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that none besides God can serve as patron or helper if
    God brings evil or mercy.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Some people are described as causing hindrances, inviting their brethren away,
    and coming only little to the fight.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Fearful people are described as rolling their eyes when alarm comes and then
    speaking sharply when the alarm passes, covetous of spoil.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Apostle of God is named as a noble pattern for those who hope in God and
    the latter day and remember God often.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: When the faithful saw the confederates, they said this fulfilled what God
    and His Apostle had promised, increasing their faith and self-devotion.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Some faithful people are said to have fulfilled what they promised God, while
    others await fulfillment without changing.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: God is said to reward the faithful, punish or turn toward the hypocrites,
    and drive back the infidels without their gaining advantage.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Those of the people of the Book who aided the confederates are brought down
    from fortresses; dismay is cast into their hearts, and some are slain while others
    are taken prisoner.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The believers receive land, dwellings, and wealth as an inheritance, including
    land where they had not set foot.
  category: object
  evidence_refs:
  - ev:17
- id: obs:18
  text: The Prophet is told to offer his wives a choice between the present life with
    honorable dismissal and God, His Apostle, and a home in the next life with reward.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: The Prophet's wives are warned that proven lewdness would bring doubled chastisement,
    while obedience and right action would bring doubled reward and noble provision.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:20
  text: The Prophet's wives are instructed to speak discreetly, abide in their houses,
    avoid public display associated with former ignorance, pray, pay the impost, and
    obey God and the Apostle.
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: The household is associated with God's desire to remove filthiness and cleanse
    them.
  category: attribute
  evidence_refs:
  - ev:21
- id: obs:22
  text: The wives are told to recollect what is rehearsed in their houses of the Book
    of God and wisdom.
  category: action
  evidence_refs:
  - ev:22
- id: obs:23
  text: Men and women are listed in parallel categories of submission, belief, devotion,
    truthfulness, patience, humility, almsgiving, fasting, chastity, and remembrance
    of God, with forgiveness and rich recompense prepared for them.
  category: sequence
  evidence_refs:
  - ev:23
- id: obs:24
  text: Believing men and women are said not to have choice in a matter decreed by
    God and His Apostle; disobedience is called palpable error.
  category: relationship
  evidence_refs:
  - ev:24
