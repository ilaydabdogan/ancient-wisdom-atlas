canonical_text:
  quote: ''
  summary: The passage gives legal admonition about truthful witness and fear of God,
    then depicts God assembling the Apostles, recalling divine favors to Jesus son
    of Mary, including instruction, miraculous signs, and protection. The Apostles
    ask for a furnished table from heaven; Jesus prays for it as a sign, festival,
    and nourishment, and God promises its descent with a warning against later disbelief.
    God then questions Jesus about whether he told people to take him and his mother
    as gods beside God; Jesus denies this and affirms that he taught worship of God
    alone. The passage concludes with reward for the truthful, gardens with rivers,
    and God's sovereignty over heaven and earth.
  language: English
