candidate_motifs:
- id: motif:1
  label: serpent sign from a staff
  taxonomy_refs:
  - serpent
  basis: Moses' staff becomes a serpent as proof of his mission before Pharaoh.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage treats the serpent as a sign; it does not elaborate an independent
    serpent myth.
- id: motif:2
  label: miraculous contest between prophet and magicians
  taxonomy_refs: []
  basis: Magicians publicly cast ropes and rods, but Moses' rod swallows their wonders
    and the magicians convert.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: No available taxonomy ref precisely names the contest motif.
- id: motif:3
  label: departure of the faithful under pursuit
  taxonomy_refs:
  - departure
  basis: Moses is ordered to depart by night with God's servants because they will
    be pursued; the Egyptians follow at sunrise.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage emphasizes command, pursuit, and rescue more than a voluntary
    quest departure.
- id: motif:4
  label: waters divided for rescue and judgment
  taxonomy_refs:
  - divine_judgment
  basis: The sea divides after Moses strikes it, enabling Moses' group to be saved
    and the pursuing others to be drowned.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The available symbol taxonomy includes water, but the motif-family assignment
    is primarily judgment rather than a named sea-crossing category.
- id: motif:5
  label: afterlife reckoning with Paradise and Hell
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  - resurrection
  basis: Abraham speaks of the day of reckoning and the day mankind is raised; Paradise
