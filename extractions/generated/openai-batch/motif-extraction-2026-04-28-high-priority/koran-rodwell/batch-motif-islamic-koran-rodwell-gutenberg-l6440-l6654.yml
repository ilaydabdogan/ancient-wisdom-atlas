canonical_text:
  quote: ''
  summary: The passage recounts Moses confronting Pharaoh, signs involving a staff-serpent
    and white hand, a contest with magicians, the night departure of Moses and his
    followers, the parting of the sea and drowning of Pharaoh's forces. It then gives
    Abraham's speech against idols, his prayer for wisdom, forgiveness, resurrection,
    and vindication on the day of reckoning. It concludes with Noah warning his people,
    being rejected, and being saved with believers in a fully laden ark while the
    rest are drowned.
  language: English
  quote_policy: summarized
