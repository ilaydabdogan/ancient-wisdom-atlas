canonical_text:
  quote: ''
  summary: The passage contains Rodwell's notes on a crucifixion-substitution interpretation,
    then Sura LXV on divorce procedure, waiting periods, provision for divorced and
    pregnant women, warnings of punishment for communities that disobey divine commands,
    promise of guidance from darkness to light and gardens with rivers for believers,
    and a cosmological statement that God created seven heavens and like earths. It
    then begins Sura LIX, praising God, recounting the expulsion of unbelievers among
    the People of the Book, their demolished houses, threat of fire in the world to
    come, and permission concerning palm trees and spoils.
  language: English
  quote_policy: summarized
