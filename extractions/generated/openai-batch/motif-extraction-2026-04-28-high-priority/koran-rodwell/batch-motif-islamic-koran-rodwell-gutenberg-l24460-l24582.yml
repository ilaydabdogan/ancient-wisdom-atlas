canonical_text:
  quote: ''
  summary: The passage instructs worshippers to complete pilgrimage rites at the ancient
    House, avoid idols and falsehood, sacrifice cattle and camels while naming God,
    and understand that piety rather than flesh or blood reaches God. It grants sanction
    to wronged believers who have been driven from their homes, recalls earlier peoples
    who rejected prophets and were destroyed, warns of divine chastisement and final
    judgment, describes Satan’s attempted interference with prophetic desire as a
    trial, and promises provision and aid to believers, emigrants, and the wronged.
    It closes by affirming God’s control over night and day and His truth over false
    objects of worship.
  language: English
