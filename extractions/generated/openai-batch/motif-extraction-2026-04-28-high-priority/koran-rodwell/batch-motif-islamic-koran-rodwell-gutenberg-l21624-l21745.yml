canonical_text:
  quote: ''
  summary: The passage addresses a battlefield reverse among believers, interpreting
    disobedience, flight, loss, death, and fear as matters under God's permission,
    testing, pardon, and judgment. It contrasts faithful trust, prophetic guidance,
    martyrdom, resurrection, and divine reward with hypocrisy, unbelief, Satanic fear,
    and chastisement.
