  category: action
  evidence_refs:
  - ev:14
  - ev:18
- id: obs:15
  text: Some among the People of the Book are contrasted as trustworthy or untrustworthy
    with entrusted dinars.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: Those who barter engagement with God and oaths for a small price are denied
