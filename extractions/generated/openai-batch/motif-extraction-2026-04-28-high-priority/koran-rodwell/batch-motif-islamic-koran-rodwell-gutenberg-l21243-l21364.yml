- id: claim:3
  claim: The passage contrasts legitimate prophetic signs and scripture with accusations
    of scriptural distortion, creating a recurrent pattern of true divine communication
    versus false attribution to God.
  claim_level: same_function
  target: True revelation versus false claims about scripture within the passage
  evidence_refs:
