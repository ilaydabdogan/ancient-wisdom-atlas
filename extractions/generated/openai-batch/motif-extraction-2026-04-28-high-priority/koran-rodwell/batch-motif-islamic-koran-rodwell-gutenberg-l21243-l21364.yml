canonical_text:
  quote: ''
  summary: The passage recounts Jesus being taught revelation and wisdom, announcing
    signs to Israel, animating a clay bird by God's leave, healing the blind and leper,
    raising the dead by God's leave, and calling for obedience to God. His helpers
    profess belief. God addresses Jesus, promising death, taking him up, deliverance
    from unbelievers, and final judgment. The passage compares Jesus with Adam as
    created by God's command, challenges disputants to invoke God's curse on liars,
    calls the People of the Book to monotheistic agreement, identifies Abraham as
    a Muslim rather than Jew or Christian, warns against misleading believers, condemns
    concealment or distortion of scripture, discusses trust and oaths, and rejects
    taking prophets or angels as lords.
  language: English
  quote_policy: summarized
