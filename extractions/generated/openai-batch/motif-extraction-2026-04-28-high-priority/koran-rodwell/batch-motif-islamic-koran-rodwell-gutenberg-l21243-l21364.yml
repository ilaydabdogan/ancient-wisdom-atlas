  - ev:5
- id: obs:6
  text: The Jews are said to plot, and God is said to plot, with God named the best
    of plotters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: God tells Jesus that he will cause him to die, take him up to himself, deliver
    him from unbelievers, and place his followers above unbelievers until the day
    of resurrection.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: God says return is to him and that he will decide between differing parties,
