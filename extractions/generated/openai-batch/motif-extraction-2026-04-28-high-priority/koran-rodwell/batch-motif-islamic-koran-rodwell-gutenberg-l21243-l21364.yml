  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jesus says he comes to attest the prior law, allow part of what had been forbidden,
    and call people to fear God, obey him, and worship God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When Jesus perceives unbelief, the apostles identify themselves as God's helpers
    and ask to be written among witnesses.
  category: speech
