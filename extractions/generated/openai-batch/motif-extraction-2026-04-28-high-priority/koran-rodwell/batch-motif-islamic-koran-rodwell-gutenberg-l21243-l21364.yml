- id: obs:10
  text: Disputants are challenged to summon sons, wives, and selves, then invoke God's
    malison on liars.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'The People of the Book are called to a shared judgment: worship only God,
    associate no other god with him, and not take one another as lords beside God.'
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage says Abraham was neither Jew nor Christian but sound in faith,
    a Muslim, and not one who adds gods to God.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The nearest kin to Abraham are identified as those who follow him, Muhammad,
