candidate_motifs:
- id: motif:1
  label: Miraculous animation of a clay bird
  taxonomy_refs: []
  basis: Jesus makes a clay figure of a bird, breathes into it, and it becomes a bird
    by God's leave.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage frames the act as a sign from God; it does not present an
    independent creator figure.
- id: motif:2
  label: Healing and quickening the dead as divine signs
  taxonomy_refs:
  - resurrection
  basis: Jesus announces healing the blind and leper and quickening the dead by God's
    leave.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The raising of the dead is stated generally; no individual restored person
    is narrated in this passage.
- id: motif:3
  label: Ascent or taking up of a prophet by God
  taxonomy_refs:
  - ascent
  basis: God tells Jesus that he will take him up to himself and deliver him from
    unbelievers.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Rodwell's translation includes 'cause thee to die' before the taking up;
    interpretation of sequence requires review.
- id: motif:4
  label: Final divine judgment and recompense
  taxonomy_refs:
  - divine_judgment
  basis: God says return is to him, he will decide disputes, chastise unbelievers,
    and recompense believers who do right.
  evidence_refs:
  - ev:8
  - ev:16
  confidence: high
  cautions: This is doctrinal judgment language rather than an extended narrative
    of the afterlife.
- id: motif:5
  label: Divine command brings a human into being
  taxonomy_refs: []
  basis: Adam is created from dust, and God says 'Be' and he is.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage uses this as an analogy for Jesus rather than recounting Adam's
    broader story.
- id: motif:6
  label: Solemn mutual invocation to expose liars
  taxonomy_refs: []
  basis: Disputants are told to gather kin and selves and invoke God's malison on
    those who lie.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives the challenge formula but does not narrate its performance.
- id: motif:7
  label: True monotheistic ancestry and contested religious lineage
  taxonomy_refs:
  - covenant
  basis: Abraham is identified as neither Jew nor Christian but sound in faith and
    Muslim, and those who follow him with Muhammad and believers are called nearest
    to him.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The covenant taxonomy is approximate; the passage emphasizes religious
    affiliation and monotheistic lineage rather than narrating a covenant event.
- id: motif:8
  label: Scriptural distortion and concealment of truth
  taxonomy_refs:
  - wisdom
  basis: Some People of the Book are accused of hiding truth, clothing truth with
    falsehood, and twisting scripture with their tongues.
  evidence_refs:
  - ev:14
  - ev:18
  confidence: medium
  cautions: The wisdom taxonomy is broad; the passage is primarily polemical about
    revelation and interpretation.
- id: motif:9
  label: Bartered oath or broken engagement with God
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: Those who barter engagement with God and oaths for a paltry price are threatened
    with exclusion and chastisement.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The exact nature of the engagement is not narrated in this excerpt.
- id: motif:10
  label: Refusal to deify prophets or angels
  taxonomy_refs: []
  basis: The passage denies that a prophet should command worship of himself besides
    God and denies that God commands taking angels or prophets as lords.
  evidence_refs:
  - ev:17
  - ev:19
  confidence: high
  cautions: This is a doctrinal admonition, not a mythic scene involving an attempted
    deification.
