  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Al-Sarraj says that going forth from one’s own qualities means going forth
    from one’s own will and entering the will of God, not that God descends into the
    heart.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
