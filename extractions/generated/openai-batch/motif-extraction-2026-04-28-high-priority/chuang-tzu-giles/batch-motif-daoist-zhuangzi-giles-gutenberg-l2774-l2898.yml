  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Duke Ai says he trusted Ai T'ai T'o, offered him the post of Prime Minister,
    and grieved when he left.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Confucius recounts seeing young pigs suck their dead mother, then leave when
