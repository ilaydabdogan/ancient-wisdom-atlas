- id: obs:3
  text: Shu Shan No-toes, a mutilated man of Lu, comes walking on his heels to see
    Confucius.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius first says No-toes brought the misfortune on himself, then apologizes
    and invites him in to discuss.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
