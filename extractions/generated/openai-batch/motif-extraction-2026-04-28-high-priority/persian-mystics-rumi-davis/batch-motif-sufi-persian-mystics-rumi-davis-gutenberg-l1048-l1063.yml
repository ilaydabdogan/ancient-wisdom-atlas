  summary: A speaker addresses the Beloved, declaring that spiritual beauty is glorious
    but the Beloved's own beauty is beyond it. Imagination of the Beloved increases
    light in the eye, but union with Him dims that light. The speaker venerates the
    Beloved's beauty, continually inwardly proclaiming divine greatness. The heart
    is described as having an eye that constantly desires the Beloved, and any heart
    that has spent one night in the Beloved's air becomes like radiant day.
