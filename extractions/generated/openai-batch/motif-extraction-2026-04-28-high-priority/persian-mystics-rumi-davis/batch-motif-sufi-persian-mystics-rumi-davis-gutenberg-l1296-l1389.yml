- id: obs:3
  text: The banquet of Union is remembered with yearning for divine beauty, wine,
    the threshold of an abode, and the hope of seeing a face.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The listener is instructed to illumine bodily senses by the light of the soul
    and to seek bliss by serving God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The listener is told to be silent so that the Lord who gave language may speak;
    the Lord is also said to have made a door, lock, and key.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A departed figure goes to the Unseen, breaks a cage, takes to the air, and
    journeys toward the world of Soul.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The departed figure is compared to a captive falcon that hears the falcon-drum
    and to a nightingale that goes to the Rose-Garden after receiving its scent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The world gives false clues like a ghoul, but the addressed figure ignores
    those clues and goes toward what is without a clue.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The heart is called a wondrous bird; the addressed figure is also likened
