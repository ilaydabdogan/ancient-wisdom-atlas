canonical_text:
  quote: ''
  summary: A sequence of devotional poems addresses a soul or seeker called by a heavenly
    voice toward union with the Friend or Beloved. The passage presents the way as
    a road to the Ka'ba or Shrine of Union, a dangerous path where many have fallen.
    It also describes a banquet of union, silence before the Lord, departure from
    the world as a bird breaking its cage and flying to the world of Soul, the rejection
    of the world's false clues, and the Beloved's coming with images of moon, flame,
    wine, flood, and sea.
  language: English
  quote_policy: summarized
