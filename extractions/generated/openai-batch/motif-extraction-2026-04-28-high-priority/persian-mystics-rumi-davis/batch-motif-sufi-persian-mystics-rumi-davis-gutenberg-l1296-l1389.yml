- id: obs:1
  text: A morning voice from heaven addresses the listener and says that laying the
    dust of the way enables arrival at the goal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The road is described as leading to the Ka'ba of Union, with thorn-bushes
    and thousands slain or wounded by desire along the path.
  category: setting
  evidence_refs:
