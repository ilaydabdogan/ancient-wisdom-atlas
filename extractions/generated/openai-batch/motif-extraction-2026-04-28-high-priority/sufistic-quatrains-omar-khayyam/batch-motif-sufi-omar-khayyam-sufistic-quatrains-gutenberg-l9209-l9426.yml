- id: motif:2
  label: Mystical wine as wisdom or liberation
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: Wine is framed as lawful for the wise, Being's wine produces sobriety, and
    the Etern Cupbearer's wine frees from troubles of both worlds.
  evidence_refs:
