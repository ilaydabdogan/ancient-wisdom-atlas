  summary: Editorial notes and variant readings for stanzas XLIII-XLVIII describe
    an Angel offering a dark drink to the Soul by a river-bank, a person abiding in
    a clay suburb, a tent as a resting place, Existence closing an account, the ocean
    or seven seas unaffected by a pebble-cast, and a momentary movement through Annihilation's
    Waste toward the Well of Life and the Dawn of Nothing as stars set and a caravan
    departs.
