  quote: ''
  summary: The speaker encounters a door without a key and a veil beyond which he
    cannot see; a brief distinction between “ME” and “THEE” seems to vanish. He asks
    Heaven what guide Destiny has for children stumbling in darkness, and Heaven replies
    that the guide is blind understanding. He then turns to an earthen bowl to learn
    the secret Well of Life, and it tells him to drink while living because the dead
    do not return.
