  confidence: medium
  cautions: The beloved is not explicitly identified as divine in this quatrain; the
    taxonomy link is plausible within Sufi reception but needs human review.
- id: motif:4
  label: Divine presence perceived through an idol
  taxonomy_refs:
  - annihilation_union
