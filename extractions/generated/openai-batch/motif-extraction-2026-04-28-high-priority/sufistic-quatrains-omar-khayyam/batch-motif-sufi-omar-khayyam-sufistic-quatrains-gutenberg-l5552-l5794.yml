- id: motif:5
  label: Heart as superior sacred center
  taxonomy_refs:
  - world_center
  - wisdom
  basis: A hundred Ka'bas are said not to equal one heart, and the wooer is told to
    seek a heart rather than the Ka'ba.
  evidence_refs:
