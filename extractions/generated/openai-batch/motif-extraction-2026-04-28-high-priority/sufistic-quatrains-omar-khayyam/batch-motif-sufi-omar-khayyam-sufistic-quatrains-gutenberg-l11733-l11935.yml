- id: motif:2
  label: death returning as green growth
  taxonomy_refs:
  - death_rebirth
  - seasonal_cycle
  basis: The passage imagines verdure growing from human dust and links rain, earth,
    spring, and green fields with mortality.
  evidence_refs:
