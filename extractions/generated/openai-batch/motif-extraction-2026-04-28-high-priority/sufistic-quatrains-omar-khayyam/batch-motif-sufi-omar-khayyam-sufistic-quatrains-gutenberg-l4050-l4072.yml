  summary: In quatrain LXXXVI, an ungainly vessel speaks after a silence, complaining
    that others sneer at its crooked leaning and asking whether the Potter's hand
    shook. An editorial note describes the quatrain as a companion to Kuza Nama quatrains
    but says no direct source has been found in O. or C. In quatrain LXXXVII, a loquacious
    member of the group, identified tentatively as a Sufi pipkin, asks who is the
    Potter and who is the Pot.
