  text: The speaker rejects the counsel of an ignorant penitent and identifies the
    group as adorers of wine.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the season of roses, the speaker wishes to infringe Koranic law with fair
