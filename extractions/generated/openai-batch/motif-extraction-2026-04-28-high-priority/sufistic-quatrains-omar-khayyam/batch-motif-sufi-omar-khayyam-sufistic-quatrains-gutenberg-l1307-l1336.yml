  quote: ''
  summary: At dusk by an open tavern door, an angelic figure carries a vessel and
    bids the speaker taste it; the contents are identified as the grape. The grape
    is said to confute disputing sects and to transform life's base metal into gold
    like an alchemist. Mahmud is invoked as a victorious lord who scatters and slays
    fears and sorrows with an enchanted sword. The speaker then advises leaving the
    wise to dispute and setting aside the quarrel of the universe.
