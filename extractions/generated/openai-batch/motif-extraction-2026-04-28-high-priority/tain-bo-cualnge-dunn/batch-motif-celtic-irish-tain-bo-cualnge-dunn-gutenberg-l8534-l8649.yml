canonical_text:
  quote: ''
  summary: Cuchulain undergoes a violent bodily contortion marked by distorted features,
    bristling hair, fiery and bloody signs, and the Champion's Light. He then mounts
    a scythed war-chariot, performs escalating thunder-feats, circles the armies of
    four provinces to prevent escape, and slaughters them in great rings while avenging
    the youths and Follomain. The passage names the event Sessrech Breslige and notes
    a variant report that Lug son of Ethliu fought on Cuchulain's side.
  language: English
  quote_policy: summarized
