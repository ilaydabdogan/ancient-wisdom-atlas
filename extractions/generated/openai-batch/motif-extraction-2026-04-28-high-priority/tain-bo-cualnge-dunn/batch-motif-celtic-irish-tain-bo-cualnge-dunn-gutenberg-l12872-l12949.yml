canonical_text:
  quote: ''
  summary: Curoi learns that one man has been checking the provinces of Erin and goes
    to fight Cuchulain, but finds him badly wounded after Ferdiad and refuses to take
    advantage. Curoi then confronts Amargin near Taltiu by hurling rocks and boulders.
    Medb asks him to stop because the throwing brings no help, and Curoi agrees to
    cease when Amargin also ceases and on condition that Curoi no longer aids the
    men of Erin. Amargin later turns against the moving hosts, pelting them and killing
    an innumerable number while Conall Cernach supplies stones and spears. The hosts
    negotiate a retreat and a postponement until the great battle; this episode is
    called the Deer-stalking of Amargin in Taltiu.
  language: English
  quote_policy: summarized
