canonical_text:
  quote: Cuchulain pledges himself to the terms of fair single-handed combat, and
    Fergus binds himself to the pact.
  summary: Cuchulain sits by the pillar-stone at Crich Rois playing draughts with
    Laeg, who observes approaching chariots. Laeg describes a splendid warrior whom
    Cuchulain identifies as Fergus, noting that Fergus carries a wooden sword in the
    sheath. A second young armored chariot-fighter approaches to look at Cuchulain.
    Fergus arrives, is warmly welcomed, declines hospitality, and secures Cuchulain’s
    pledge to a compact of fair single combat. Fergus then departs quickly to avoid
    appearing to betray the men of Erin for his disciple.
  language: English
  quote_policy: summarized
