canonical_text:
  quote: '"Cuchulain is my foster-brother and of everlasting covenant with me."'
  summary: After several warriors have fallen in single combat with Cuchulain, the
    men of Erin decide that Ferbaeth, Cuchulain's foster-brother and equal in arms,
    should oppose him at the ford. Medb summons Ferbaeth, offers rewards including
    Finnabair and kingship, and Ferbaeth agrees despite acknowledging his covenant
    with Cuchulain. Cuchulain sends Laeg to learn who will fight him; Lugaid reports
    that Ferbaeth has been chosen and is being entertained with Finnabair, drink,
    food, and kisses. Laeg returns sorrowfully, and Cuchulain understands that a brother-in-arms
    is coming against him.
  language: English
  quote_policy: quoted
