canonical_text:
  quote: ''
  summary: Etarcumul's body is dragged behind horses and a chariot back to Ailill
    and Medb's tent, where Fergus cites a law maxim about restoration and restitution.
    Medb rebukes Fergus, and Fergus defends Cuchulain's power. Etarcumul is buried
    with a tombstone, ogam inscription, and keen. The men of Erin then deliberate
    about finding someone to fight Cuchulain. Nathcrantail is recruited after demanding
    Finnabair as his reward, and Medb promises her to him if he fights Cuchulain at
    the ford. Lugaid warns Cuchulain that Nathcrantail will come, but Cuchulain is
    unconcerned.
  language: English
  quote_policy: summarized
