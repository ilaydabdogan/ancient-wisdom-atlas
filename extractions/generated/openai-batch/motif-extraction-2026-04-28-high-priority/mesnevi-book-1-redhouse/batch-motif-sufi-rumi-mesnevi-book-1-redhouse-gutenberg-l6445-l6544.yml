  quote: ''
  summary: A vazir, outwardly appearing as a disciple of Jesus while secretly serving
    a king, gains the trust of Christians divided into twelve legions. He prepares
    a separate forged volume for each captain, filling the books with mutually contradictory
    doctrines about fasting, charity, works, law, weakness, strength, light, darkness,
    renunciation, enjoyment, possessions, wisdom, unity, and plurality. The passage
    closes by calling the doctrines paradoxical antitheses, comparing one book to
    honey and another to poison, and warning not to forsake true scripture.
