canonical_text:
  quote: ''
  summary: A holy man sees Kirā Khātūn in heaven, where she explains that a funeral
    was delayed because she interceded for two people executed for adultery and gained
    their admission to paradise. Satan appears to Husāmu-'d-Dīn, complains of Jelāl's
    sanctity and pious exercises, and hopes Jelāl's sons will intercede for his release
    and salvation; Jelāl replies that Satan need not despair. Grandees seeking an
    audience with Shemsu-'d-Dīn of Tebrīz ask Husām to obtain Jelāl's intercession;
    payments are negotiated and used to support the holy community and dependants.
  language: English
  quote_policy: summarized
