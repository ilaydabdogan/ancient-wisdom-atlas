  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Abd-u'l-cadur the Gilani places his face on the black stone and asks God for
    pardon, or to be raised blindfolded on the day of resurrection if punishment is
    unavoidable.
  category: action
  evidence_refs:
  - ev:3
