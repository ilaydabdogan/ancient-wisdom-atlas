canonical_text:
  quote: ''
  summary: A speaker addresses Bhima about his and his brothers' divine-inspired birth,
    praises Karna as a warrior destined for more than Anga, and issues a combat challenge.
    The crowd applauds, night falls, and Duryodhan leaves with Karna. Pandu's sons
    and elders depart silently. The spectators dispute who won. Pritha secretly recognizes
    Karna as her son when he is crowned king of Anga. Duryodhan binds Karna to his
    side and no longer fears Arjun, while Yudhishthir judges Karna extremely powerful
    and doubts Arjun's superiority.
  language: English
  quote_policy: summarized
