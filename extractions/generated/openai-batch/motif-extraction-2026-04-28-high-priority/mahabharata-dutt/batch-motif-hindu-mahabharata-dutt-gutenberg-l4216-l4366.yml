canonical_text:
  quote: ''
  summary: 'The passage recounts successive episodes of the battle: Pandav forces
    are routed; Krishna attempts to enter combat with his discus but Arjun restrains
    him and vows to fight; Arjun rallies the Pandavs until nightfall; Bhima kills
    eight of Duryodhan''s brothers; Lakshman is wounded, and Satyaki''s ten sons are
    slain by Bhuri-sravas; Bhima is endangered and rescued by Drupad, Abhimanyu, and
    other chiefs; later Bhishma routs the Pandavs despite their efforts.'
  language: English
  quote_policy: summarized
