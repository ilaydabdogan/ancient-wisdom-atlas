  category: attribute
  evidence_refs:
  - ev:10
- id: obs:22
  text: An earliest ancestor kept a deer and tied divine symbols to its horns; the
    deer went to the mountains and brought back other deer, enriching the ancestor.
  category: sequence
  evidence_refs:
  - ev:11
