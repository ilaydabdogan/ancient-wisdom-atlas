canonical_text:
  quote: ''
  summary: A poor young man seeking his fortune is shipwrecked and cast alone onto
    a small island. A flying wild pig lands there with a magnificent diamond. The
    man takes the diamond and discovers that wishing while holding it can move him
    through space. The pig is revealed as a wicked magician in pig shape whose power
    lies in the diamond. From a tree, the man provokes the pig until its tusks stick
    in the trunk, then kills it. He uses the diamond and sunlight to roast the pig,
    eats it, and finally wishes himself through the air to the nearest land.
