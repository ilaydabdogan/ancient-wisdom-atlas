  quote: ''
  summary: A lion and a she-jackal have a cub who looks like a lion but has a jackal's
    voice. While playing with young lions, the cub tries to roar but yelps instead.
    A young lion reports the mismatch to the old lion, who says the cub's mother was
    a jackal and advises the cub to keep quiet because his voice reveals his kind.
    The cub leaves ashamed and thereafter keeps silent among the lions.
