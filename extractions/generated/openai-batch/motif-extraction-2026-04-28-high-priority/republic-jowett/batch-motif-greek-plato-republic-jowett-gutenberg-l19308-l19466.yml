canonical_text:
  quote: ''
  summary: The speaker argues that contradictory sense-impressions summon calculation
    and intelligence, leading the soul from confused perception toward the intelligible.
    Unity and number are said to draw the mind toward true being. Arithmetic is recommended
    for guardians because it serves both military and philosophical purposes, elevating
    the soul from becoming to truth and being. Geometry is then introduced as a related
    study useful in war.
  language: English
