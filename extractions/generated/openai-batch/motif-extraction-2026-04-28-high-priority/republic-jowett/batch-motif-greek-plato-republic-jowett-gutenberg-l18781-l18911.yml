canonical_text:
  quote: To them, I said, the truth would be literally nothing but the shadows of
    the images.
  summary: The passage presents a figurative account of human beings chained in an
    underground den, seeing only shadows cast by firelight, and then describes the
    painful release, ascent toward the upper world, gradual vision of objects and
    heavenly lights, contemplation of the sun, reflection on the former den, and difficulty
    of returning to darkness.
  language: English
  quote_policy: quoted
