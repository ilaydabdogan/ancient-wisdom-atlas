    being leveled.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Animals in the democratic State are described as possessing unusual freedom,
    with dogs, horses, and asses acting without deference.
  category: attribute
  evidence_refs:
  - ev:1
