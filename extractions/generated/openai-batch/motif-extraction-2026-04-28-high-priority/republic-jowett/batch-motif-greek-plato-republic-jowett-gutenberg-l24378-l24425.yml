canonical_text:
  quote: ''
  summary: Spirits leave a meadow after seven days and journey to a cosmic place where
    a bright column-like light binds heaven and earth. In the light they see the spindle
    of Necessity, with nested whorls corresponding to heavenly revolutions. Sirens
    on the circles sing tones that form a harmony, and the three Fates, daughters
    of Necessity, sing of past, present, and future while touching and guiding the
    revolutions.
  language: English
  quote_policy: summarized
