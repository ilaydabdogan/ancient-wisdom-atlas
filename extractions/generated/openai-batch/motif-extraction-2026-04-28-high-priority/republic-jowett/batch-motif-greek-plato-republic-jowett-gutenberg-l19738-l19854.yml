  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The eye of the soul is described as buried in an outlandish slough and lifted
    upward by dialectic.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: 'Four divisions are named: science, understanding, belief, and perception
