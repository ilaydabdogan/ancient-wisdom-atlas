  summary: A violent storm overwhelms a ship at sea. The crew panic as the vessel
    breaks and sinks. Ceyx, clinging to wreckage, repeatedly thinks of and calls upon
    Halcyone before being drowned by a wave. Halcyone, unaware of his death, prepares
    for his return and prays to Juno for him. Juno sends Iris to Sleep so that a vision
    in the form of dead Ceyx may reveal the misfortune to Halcyone.
