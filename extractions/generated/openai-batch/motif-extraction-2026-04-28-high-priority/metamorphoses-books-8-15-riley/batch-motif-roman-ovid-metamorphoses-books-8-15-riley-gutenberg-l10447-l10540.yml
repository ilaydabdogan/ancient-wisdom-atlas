    poetic version, stating that Virgil invented Aeneas’ visit to Dido to account
    for Roman-Carthaginian hatred.
  claim_level: same_motif
  target: Virgilian Aeneas-Dido episode
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
