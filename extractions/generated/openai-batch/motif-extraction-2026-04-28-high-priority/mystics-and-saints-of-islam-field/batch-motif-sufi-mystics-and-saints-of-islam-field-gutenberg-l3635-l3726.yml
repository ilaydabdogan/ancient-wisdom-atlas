canonical_text:
  quote: ''
  summary: A revered Sheikh dreams that he must leave Mecca for Roum and become an
    idolator. In Roum he falls in love with a Christian girl, neglects religious duties,
    drinks wine, worships idols, and keeps swine for a year at her demand. His disciples
    return to Mecca, where a friend urges them to pray and fast for him for forty
    days and nights. God restores the Sheikh’s memory and repentance, and he returns
    toward Mecca. The Christian girl then dreams of the Prophet commanding her to
    follow the Sheikh and adopt his doctrine. An inner voice informs the Sheikh of
    her conversion, and he goes to meet her; she asks him to teach her Islam.
  language: English
  quote_policy: summarized
