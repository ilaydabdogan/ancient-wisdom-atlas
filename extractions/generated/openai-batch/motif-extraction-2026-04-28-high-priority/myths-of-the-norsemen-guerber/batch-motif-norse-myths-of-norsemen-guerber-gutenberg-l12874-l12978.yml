candidate_motifs:
- id: motif:1
  label: lost and recovered divine beloved
  taxonomy_refs:
  - divine_beloved
  - return
  basis: Freya loses and recovers Odur, with tears and renewed joy paralleling Venus
    and Adonis.
  evidence_refs:
