canonical_text:
  quote: ''
  summary: Gunnar seeks Brunhild, who is enclosed in a golden hall beyond flames and
    will marry only the warrior who can ride through them. Gunnar cannot pass the
    fire, so Sigurd, aided by magical form exchange, takes Gunnar's appearance, rides
    Greyfell through the flames, and wins Brunhild's pledge. Sigurd places a sword
    between himself and Brunhild for three nights, exchanges rings with her, and later
    gives Andvaranaut to Gudrun. Brunhild comes to Gunnar's court; Sigurd's spell
    breaks when he sees her, but both are bound to other spouses. Brunhild grieves
    privately, and Gunnar becomes suspicious.
  language: English
  quote_policy: summarized
