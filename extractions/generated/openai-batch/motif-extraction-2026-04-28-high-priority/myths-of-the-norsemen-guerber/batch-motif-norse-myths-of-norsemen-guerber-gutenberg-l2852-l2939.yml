canonical_text:
  quote: ''
  summary: 'Thor leaves his goats in a man''s care and travels on foot with Loki and
    young companions toward Utgard. In mist and darkness they mistake a giant mitten
    for a house. The giant Skrymir joins them as guide, but his wallet cannot be opened
    and Thor''s hammer blows barely disturb him. The travelers then reach Utgard-loki''s
    icy castle, where the giant king challenges them to tests: Loki competes in eating
    against Logi, Thor tries and fails to empty a horn, Thialfi loses a race to Hugi,
    and Thor can lift only one paw of the giant''s cat after tightening his strength-giving
    belt.'
  language: English
  quote_policy: summarized
