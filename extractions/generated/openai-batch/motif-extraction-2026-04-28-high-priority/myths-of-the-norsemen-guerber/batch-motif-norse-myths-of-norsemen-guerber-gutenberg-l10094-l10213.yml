canonical_text:
  quote: ''
  summary: After Fafnir's death, Sigurd tastes the dragon's blood, understands birds,
    learns Regin intends him harm, kills Regin, consumes part of Fafnir's heart and
    blood, and takes treasures from the hoard. Guided by birds, he rides to a mountain
    where a warrior maiden sleeps behind flames. He passes through the fire, enters
    a shield-hung castle, removes the sleeper's armor, awakens Brunhild, and they
    love one another at first sight. Brunhild identifies herself as a Valkyrie raised
    by Odin, who had once disobeyed his command.
  language: English
  quote_policy: summarized
