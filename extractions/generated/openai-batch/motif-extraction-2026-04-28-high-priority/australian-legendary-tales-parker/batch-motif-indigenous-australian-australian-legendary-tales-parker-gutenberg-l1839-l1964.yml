  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: The women cook and eat the flesh hungrily and afterward feel ill.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Bleargah becomes suspicious of the meat, sends two women to follow Ouyan,
