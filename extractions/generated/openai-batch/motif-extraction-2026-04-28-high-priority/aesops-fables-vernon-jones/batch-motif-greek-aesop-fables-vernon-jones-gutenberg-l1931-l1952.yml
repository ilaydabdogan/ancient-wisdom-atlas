  summary: In one fable, an ass puts on a lion's skin, frightens others who mistake
    him for a lion, and is exposed when a fox recognizes his voice. In another, Jupiter
    grants beards to she-goats; he-goats object, but Jupiter dismisses the objection
    because the beards do not make the she-goats equal in strength.
