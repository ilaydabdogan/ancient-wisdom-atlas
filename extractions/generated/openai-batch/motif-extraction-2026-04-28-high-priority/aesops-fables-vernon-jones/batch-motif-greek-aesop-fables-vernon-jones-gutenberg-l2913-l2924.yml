  quote: ''
  summary: A lion and an ass hunt together. At a cave containing wild goats, the lion
    waits at the entrance while the ass goes inside and brays to drive the goats out.
    The lion kills the goats as they emerge. Afterward the ass boasts of frightening
    them, and the lion replies that the braying would have frightened him too if he
    had not known it came from an ass.
