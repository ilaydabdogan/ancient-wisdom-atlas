  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old Prussians are said to have acknowledged a supreme ruler known as God’s
    Mouth, who governed in the name of the gods.
  category: attribute
  evidence_refs:
  - ev:8
