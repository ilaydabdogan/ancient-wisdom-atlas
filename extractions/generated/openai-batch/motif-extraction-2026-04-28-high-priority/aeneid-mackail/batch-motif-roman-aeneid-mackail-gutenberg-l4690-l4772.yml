canonical_text:
  quote: ''
  summary: Allecto, acting for Juno, manipulates Ascanius' hunt so that his hounds
    pursue and he shoots a tame stag beloved by Tyrrheus' household and Silvia. The
    wounded animal returns home bleeding, Silvia calls the country people, and Allecto
    sounds an infernal war-note that gathers armed rustics and Trojans into battle.
    Almo and Galaesus die. Allecto reports the outbreak to Juno, who declares that
    enough terror and bloodshed have begun and calls the bloodstained conflict the
    union and bridal for the Trojan and Latin line. Allecto then departs through the
    Vale of Amsanctus, a chasm leading to Acheron and Cocytus.
  language: English
  quote_policy: summarized
