canonical_text:
  quote: ''
  summary: A goddess embraces her divine husband and persuades him to undertake work
    for war. After sleep he rises before dawn, descends to Vulcania near Sicily, and
    orders the Cyclopes of Aetna to stop other divine armament work and make a warrior's
    armor, especially a sevenfold shield. Meanwhile Evander and Aeneas rise at dawn,
    meet with Pallas and Achates, clasp hands, and begin private conversation.
  language: English
  quote_policy: summarized
