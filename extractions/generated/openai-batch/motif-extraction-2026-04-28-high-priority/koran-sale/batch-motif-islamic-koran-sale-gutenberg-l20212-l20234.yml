    divine revelation that he will later confront them, and his brothers return to
    Jacob with a false story that a wolf devoured him, presenting Joseph's garment
    stained with false blood. Travellers later draw water, discover Joseph, conceal
    him as merchandise, and sell him cheaply. An Egyptian buyer tells his wife to
    treat Joseph well, possibly as a servant or adopted son, while the passage states
    that God established Joseph and taught him the interpretation of dark sayings.
