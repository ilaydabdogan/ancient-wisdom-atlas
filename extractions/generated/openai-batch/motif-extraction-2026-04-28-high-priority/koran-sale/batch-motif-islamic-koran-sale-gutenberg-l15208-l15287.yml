canonical_text:
  quote: "“And now are ye come unto us alone, as we created you at first...”"
  summary: 'The passage includes translator notes on disputed revelation and false
    claimants, then presents a divine address: humans come before God alone, without
    possessions or intercessors. God is described as causing seeds and living beings
    to emerge, ordering day, night, sun, moon, and stars, producing humans from one
    soul, and sending heavenly water that brings forth vegetation and fruit. The passage
    rejects associating genii or offspring with God, affirms God as creator and caretaker
    of all things, states that sight cannot comprehend him, and urges following revelation
    while turning away from idolaters.'
