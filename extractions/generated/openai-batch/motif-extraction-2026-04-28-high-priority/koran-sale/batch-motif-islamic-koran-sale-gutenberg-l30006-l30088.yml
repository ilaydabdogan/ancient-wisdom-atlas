canonical_text:
  quote: ''
  summary: 'The passage combines translator notes on privileges and rules concerning
    Mohammed''s wives with Qur''anic directives: certain kin may speak to women unveiled;
    God and angels bless the prophet and believers are told to salute him; those who
    offend God, the apostle, or believers are threatened with curse and punishment;
    women are told to cast outer garments over themselves in public; hypocrites and
    disturbers in Medina are threatened; knowledge of the last hour belongs to God;
    infidels are cursed to fierce fire; the damned lament having followed their leaders;
    believers are warned not to imitate those who injured Moses, whom God cleared.'
  language: English
  quote_policy: summarized
