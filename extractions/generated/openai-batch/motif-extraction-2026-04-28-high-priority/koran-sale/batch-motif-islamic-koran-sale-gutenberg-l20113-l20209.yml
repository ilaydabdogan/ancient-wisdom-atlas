canonical_text:
  quote: ''
  summary: The passage opens Sura XII, stating that the Arabic revelation relates
    the excellent history of Joseph. Joseph tells Jacob of a dream in which eleven
    stars, the sun, and the moon bow to him. Jacob warns him not to tell his brothers,
    predicts divine favor and instruction in interpretation, and the brothers plot
    against Joseph because Jacob loves him and his brother more. One brother advises
    throwing Joseph into a well rather than killing him. The brothers ask Jacob to
    send Joseph with them into the field, while Jacob fears a wolf may devour him.
  language: English
