canonical_text:
  quote: ''
  summary: 'Opening of Chapter X, Jonas: the passage presents the revealed book as
    signs, defends revelation to a man among the Meccans, describes God as creator
    and ruler, asserts return to God, reward and punishment, cosmic signs in sun,
    moon, night, and day, contrasts unbelievers with believers, describes gardens
    with rivers for the righteous, warns of hell fire and boiling water, recalls earlier
    destroyed generations, and rejects demands to alter the Qur''an or claims that
    other worshiped beings intercede with God.'
