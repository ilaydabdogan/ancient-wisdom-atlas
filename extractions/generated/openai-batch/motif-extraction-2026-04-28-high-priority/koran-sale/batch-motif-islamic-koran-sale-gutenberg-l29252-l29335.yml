canonical_text:
  quote: ''
  summary: The passage gives admonitions attributed to a father addressing his son,
    instructing him to avoid idolatry even under parental pressure, practice prayer
    and justice, avoid arrogance, and speak moderately. It describes God as creator,
    knower, judge, giver of favors, controller of cosmic cycles, sender of rain, and
    possessor of knowledge of the hour, wombs, future gain, and place of death. It
    contrasts revelation with ancestral practice, warns of punishment and judgment,
    evokes ships endangered by waves whose passengers call on God, and uses images
    of a mustard seed, rock, heavens, earth, trees as pens, and seas as ink.
  language: English
  quote_policy: summarized
