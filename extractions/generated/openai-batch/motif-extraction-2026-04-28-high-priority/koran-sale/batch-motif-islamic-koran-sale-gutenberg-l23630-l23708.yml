candidate_motifs:
- id: motif:1
  label: quest for hidden wisdom through a guide
  taxonomy_refs:
  - wisdom
  - mystical_quest
  basis: Moses seeks instruction from a servant taught wisdom by God and must follow
    without questioning until meanings are revealed.
  evidence_refs:
