canonical_text:
  quote: There shall be but one blast of the trumpet, and they shall see themselves
    raised
  summary: The passage opens with oaths by ordered angels and describes God as one
    Lord of heaven and earth. The lower heaven is adorned with stars and guarded against
    rebellious devils, who are pursued by a shining flame if they steal a word. The
    Meccans mock warnings and deny resurrection, but the text states that one trumpet
    blast will raise them for judgment. The unjust, their comrades, and their idols
    are directed toward hell and brought before God's tribunal. Seduced and seducers
    dispute but share punishment. Sincere servants of God receive provision in paradise,
    including fruits, gardens, couches, a cup from a limpid fountain, and companions.
    One blessed person looks down and sees a former doubting friend in hell, crediting
    God's grace for rescue.
  language: English
  quote_policy: quoted
