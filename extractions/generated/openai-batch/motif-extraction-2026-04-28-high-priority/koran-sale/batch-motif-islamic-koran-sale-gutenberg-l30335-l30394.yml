  quote: ''
  summary: The passage says that Eblis successfully drew many people after him except
    true believers, while his power was only to tempt so that belief in the life to
    come might be distinguished from doubt. It rejects the power of other supposed
    gods, restricts intercession to those permitted by God, presents God as provider,
    judge, and sender of a messenger to all mankind, and describes unbelievers disputing
    at the last judgment, especially the weak and the arrogant blaming one another.
