canonical_text:
  quote: ''
  summary: The passage denounces hypocrites who verbally acknowledge the apostle but
    are called liars by God, use oaths as protection, turn others from God's way,
    and have their hearts sealed. They are described as outwardly impressive but inwardly
    fearful and hostile. They refuse the apostle's request for pardon, speak against
    supporting refugees with him, and claim the worthier will expel the meaner from
    Medina; the passage answers that worth and provision belong to God, his apostle,
    and true believers. It warns believers not to be diverted by wealth or children
    from remembering God, and urges almsgiving before death, because no further respite
    is granted when the appointed time arrives.
  language: English
  quote_policy: summarized
