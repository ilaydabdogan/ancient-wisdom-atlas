canonical_text:
  quote: ''
  summary: 'The passage opens Saba with praise of God as sovereign over heaven and
    earth, knower of what enters and leaves earth and descends and ascends from heaven,
    and guarantor of the hour of judgment. It contrasts recompense for believers with
    punishment for those rejecting signs, records unbelieving mockery of resurrection,
    warns of earth swallowing or heaven falling, and recounts divine gifts to David
    and Solomon: mountains and birds praising with David, iron softened for mail,
    wind and molten brass subjected to Solomon, and genii compelled to build monumental
    objects. Included notes explain some terms and report commentary about the divine
    law or trust offered to cosmic creation and accepted by Adam.'
  language: English
  quote_policy: summarized
