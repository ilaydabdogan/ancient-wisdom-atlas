canonical_text:
  quote: ''
  summary: 'The passage recounts divine assistance to believers at Bedr: angels are
    promised, sleep and rain are sent for security and purification, angels are commanded
    to strengthen believers, unbelievers are threatened with punishment, believers
    are warned not to retreat, and the killing and casting of gravel are attributed
    to God. It then exhorts believers to obey God and his apostle, avoid sedition
    and betrayal, remember refuge and aid when weak, and regard wealth and children
    as a temptation while fearing God for forgiveness and reward.'
  language: English
  quote_policy: summarized
