canonical_text:
  quote: ''
  summary: The passage affirms God's truth, sovereignty, mercy, knowledge, creation,
    control of water, earth, sea, heaven, life, death, resurrection, judgment, and
    choice of messengers. It contrasts God with powerless idols through a parable
    of idols unable to create or recover from a fly. It warns unbelievers of hell
    and instructs believers to prostrate, worship, fight in defense of God's religion,
    follow the religion of Abraham, pray, give alms, and adhere to God.
  language: English
