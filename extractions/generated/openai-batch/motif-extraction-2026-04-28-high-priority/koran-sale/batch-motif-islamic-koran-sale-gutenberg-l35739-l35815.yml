canonical_text:
  quote: ''
  summary: The passage praises believers in Medina who receive refugees and prefer
    them despite need; records a prayer by later believers; condemns hypocrites who
    promise aid to unbelieving people of scripture but will abandon them; compares
    their deception to the devil disavowing a man he led into unbelief; warns believers
    to fear God and prepare for the next life; contrasts inhabitants of hell fire
    and paradise; presents a similitude of the Koran humbling and splitting a mountain;
    and closes with divine names and universal praise of God.
  language: English
