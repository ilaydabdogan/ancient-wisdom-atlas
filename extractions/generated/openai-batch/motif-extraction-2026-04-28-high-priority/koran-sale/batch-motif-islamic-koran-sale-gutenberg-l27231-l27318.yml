  summary: The passage recounts Pharaoh threatening believers, Moses leading his people
    by night, Pharaoh's pursuit, the sea being struck and divided into twelve paths,
    the deliverance of Moses and his companions, and the drowning of their pursuers.
    It then begins the story of Abraham, who rejects idol worship, praises the Lord
    as creator, guide, provider, healer, life-giver after death, and judge, and prays
    for wisdom, righteousness, blessed remembrance, paradise, forgiveness, and freedom
    from shame on the day of resurrection.
