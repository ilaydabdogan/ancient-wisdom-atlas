canonical_text:
  quote: And the ark swam with them between waves like mountains
  summary: When the divine sentence is executed, water pours forth from the oven.
    Noah is commanded to carry pairs of animals, his family except those already condemned,
    and the believers into the ark. Noah invokes God as the ark moves. A separated
    son refuses to embark, trusting a mountain for safety, but a wave comes between
    him and Noah and he is drowned. The translator's notes discuss interpretations
    of the oven, the number of animal pairs, Noah's family, and parallels in Persian,
    Jewish, Christian, and other traditions.
  language: English
