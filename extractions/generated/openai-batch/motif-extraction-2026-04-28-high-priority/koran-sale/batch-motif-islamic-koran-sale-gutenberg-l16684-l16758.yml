  summary: Moses comes at the appointed time and asks to behold God's glory. God directs
    him to look toward the mountain; when divine glory appears in the mount, it is
    reduced to dust and Moses falls unconscious. After recovering, Moses repents and
    professes belief. God declares Moses chosen, gives him commissions and speech,
    and gives him written tables containing admonition and law. The passage warns
    that the proud and those who deny signs and the life to come will be turned aside
    and their works made vain. During Moses' departure, his people make a lowing corporeal
    calf from ornaments, take it as a god, then repent and ask for mercy and forgiveness.
