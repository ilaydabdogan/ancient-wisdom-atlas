  quote: O earth, swallow up thy waters, and thou, O heaven, withhold thy rain.
  summary: The waters are commanded to recede, the ark rests on Mount al-Judi, Noah
    pleads for his son, God rejects the plea because the son is not counted among
    Noah's family due to unrighteousness or infidelity, Noah seeks mercy, and he is
    told to descend from the ark with peace and blessings. The passage then identifies
    the account as revealed secret history and begins the mission of Hud to the tribe
    of Ad.
