canonical_text:
  quote: ''
  summary: The passage opens Sura Mary with Zacharias praying privately for an heir
    despite his old age and his wife's barrenness. An angel announces John, gives
    Zacharias a sign of three nights without speech, and John is described as receiving
    the book, wisdom in childhood, mercy, purity, and peace at birth, death, and resurrection.
    The passage then recounts Mary withdrawing eastward, veiling herself, receiving
    Gabriel in human form, being told she will have a holy son though untouched by
    a man, conceiving, retreating to a distant place, experiencing childbirth by a
    palm-tree, and being comforted with a rivulet beneath her.
  language: English
