canonical_text:
  quote: ''
  summary: The passage contrasts unbelievers who boast of wealth and expect future
    riches with believers whose enduring good works are valued by God. It warns that
    God records speech, numbers days of respite, destroys former generations, assembles
    the pious honorably, drives the wicked to hell, limits intercession to one with
    a covenant from the Merciful, rejects the claim that the Merciful has begotten
    children, and declares that all beings will come to God as servants on the day
    of resurrection.
