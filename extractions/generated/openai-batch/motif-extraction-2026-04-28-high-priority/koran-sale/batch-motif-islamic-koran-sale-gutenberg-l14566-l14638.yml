canonical_text:
  quote: ''
  summary: Jesus' followers ask for food from heaven as confirmation and witness.
    Jesus asks God to send down a table from heaven as a festival, sign, and provision.
    God promises the table but warns that later disbelief will receive severe punishment.
    A last-day exchange follows in which God questions Jesus about whether he told
    people to take Jesus and Mary as gods beside God; Jesus denies this and states
    that he only commanded worship of God. The truthful are promised gardens with
    rivers and eternal felicity. Sale's notes relate commentator traditions about
    the descending table, its foods, a revived fish, mass feeding and healing, the
    table's return to heaven, repeated descents, and punishment of some disbelievers.
  language: English
  quote_policy: summarized
