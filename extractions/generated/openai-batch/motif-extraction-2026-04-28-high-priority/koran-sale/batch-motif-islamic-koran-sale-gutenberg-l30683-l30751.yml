canonical_text:
  quote: "“Verily we will restore the dead to life, and will write down their works...”"
  summary: The passage opens Sura XXXVI, declaring the addressed prophet to be a messenger
    sent with revelation to warn a negligent people. It describes many as unable or
    unwilling to believe, using images of yokes, barriers, and darkness. It promises
    mercy and reward to one who follows the admonition, states that the dead will
    be restored to life and that deeds and traces are recorded, and introduces the
    inhabitants of Antioch as an example involving apostles of Jesus. Sale’s notes
    add commentarial explanations, including blindness, the meaning of the mysterious
    letters, and a story of disciples sent to Antioch.
