canonical_text:
  quote: ''
  summary: The passage opens with all things in heaven and earth praising God. It
    says God raised an apostle among the illiterate Arabians to recite signs, purify
    them, and teach scripture and wisdom. It compares those charged with the law but
    not observing it to an ass laden with books. It challenges Jewish followers who
    claim special friendship with God to wish for death, states that death will meet
    those who flee it, and says they will be brought before the knower of hidden and
    revealed things. Believers are instructed to hasten to Friday prayer, leave merchandising
    during prayer, then disperse and seek God's liberality afterward. The passage
    ends by contrasting God's reward with sport or merchandise when people leave the
    preacher standing in the pulpit.
  language: English
  quote_policy: summarized
