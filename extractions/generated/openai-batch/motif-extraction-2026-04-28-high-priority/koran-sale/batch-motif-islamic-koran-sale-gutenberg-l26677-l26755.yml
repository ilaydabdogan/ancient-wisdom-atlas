canonical_text:
  quote: ''
  summary: The passage commands obedience to God and the apostle, promises succession
    and security to believers who do good works, warns unbelievers of hell fire, gives
    rules about asking permission before entering private spaces at set times, addresses
    older women’s dress, and permits eating in various relatives’ and friends’ houses,
    including with the blind, lame, and sick. Translator notes explain some occasions
    and social scruples related to these rulings.
  language: English
