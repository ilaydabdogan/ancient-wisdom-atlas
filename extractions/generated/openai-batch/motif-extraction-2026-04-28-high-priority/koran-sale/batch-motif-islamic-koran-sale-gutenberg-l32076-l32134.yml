canonical_text:
  quote: ''
  summary: The passage opens Chapter XL by describing revelation from God, God’s forgiveness,
    punishment, and the final assembly. It recalls earlier peoples who rejected prophets
    and were punished. It then depicts angels around God’s throne praying for believers,
    asking that they be forgiven, delivered from hell, and admitted with righteous
    kin into eternal gardens. Finally, unbelievers at judgment hear a condemning voice,
    confess that God gave them death twice and life twice, ask for escape from the
    fire, and are told that judgment belongs to God.
