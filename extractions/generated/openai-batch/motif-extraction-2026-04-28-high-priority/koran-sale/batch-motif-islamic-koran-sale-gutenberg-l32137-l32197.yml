canonical_text:
  quote: ''
  summary: 'The passage calls for pure worship of God, describes God as exalted and
    enthroned, sending signs, food from heaven, and the spirit to warn of the day
    of meeting. It depicts resurrection from graves, divine kingship, judgment of
    every soul without injustice, exposure of hidden things, and the powerlessness
    of false gods and intercessors. It then recalls former peoples punished for rejecting
    apostles, and begins the Moses narrative: Moses is sent with signs to Pharaoh,
    Haman, and Karn; they call him a sorcerer and liar; Pharaoh’s party orders the
    killing of believers’ sons and Pharaoh proposes killing Moses; Moses seeks refuge
    in God; and a concealed believer from Pharaoh’s family argues against killing
    a man who says God is his Lord.'
  language: English
  quote_policy: summarized
