  quote: ''
  summary: 'The passage describes eschatological events after resurrection: creatures
    suffer intense sweat and heat while awaiting judgment; the good are shaded by
    God''s throne and the wicked suffer anguish. God appears in clouds with angels
    to judge, Muhammad intercedes after other prophets decline, books of deeds are
    produced, prophets testify, each person is examined regarding life, wealth, body,
    and knowledge, some followers enter paradise without examination, and persons
    attempt to excuse themselves, including a dispute between soul and body over guilt.'
