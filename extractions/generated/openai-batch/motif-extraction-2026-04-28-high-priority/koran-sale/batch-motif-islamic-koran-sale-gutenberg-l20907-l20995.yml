  quote: ''
  summary: The passage opens Chapter XIII, presenting the revealed book as truth,
    describing God’s ordering of the heavens, earth, celestial bodies, mountains,
    rivers, fruits, lands, and rain-fed vegetation. It rebukes denial of resurrection
    and warns of collars and hell fire. It states that God knows hidden and revealed
    things, assigns angels to watch people, sends lightning, clouds, thunder, and
    thunderbolts, rejects idols as powerless, and concludes with universal worship
    of God and a monotheistic argument using contrasts such as blind and seeing, darkness
    and light.
