canonical_text:
  quote: ''
  summary: The passage lists signs of God in creation, human diversity, sleep, provision,
    lightning, rain, revivified earth, and the stability of heaven and earth. It states
    that God will call humans out of the earth, that all beings are subject to him,
    and that he creates and restores life. It rejects associating partners with God,
    urges adherence to the true religion, criticizes sectarian division, and describes
    people who call on God in adversity but return to associating other deities after
    receiving mercy.
  language: English
  quote_policy: summarized
