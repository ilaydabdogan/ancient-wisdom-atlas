canonical_text:
  quote: ''
  summary: The passage recounts warnings by Saleh to Thamud, Lot to his people, and
    the beginning of Shoaib’s warning to the inhabitants of the wood. Saleh presents
    a she-camel as a sign with alternating access to water; the people kill her and
    are overtaken by punishment. Lot asks God to deliver him and his family; they
    are delivered except for an old woman, his wife, and the rest are destroyed by
    a shower of stones. Each completed episode is framed as a sign, while most people
    do not believe.
