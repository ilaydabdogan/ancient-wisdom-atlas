canonical_text:
  quote: ''
  summary: The passage recounts several remembered figures who are heard by God, relieved,
    or admitted into mercy; it includes the episode of Dhu'lnun/Jonas crying out in
    darkness, Zacharias receiving John after childlessness, and Mary and her son being
    made a sign. It then turns to unity of religion, judgment, the opening for Gog
    and Magog, the fate of idolaters and idols in hell, the protection of the predestined
    righteous, the rolling up of the heavens, resurrection, inheritance of the earth
    by the righteous, Muhammad's mission as mercy, warning to opponents, divine knowledge,
    trial by respite, and a prayer for truthful judgment.
