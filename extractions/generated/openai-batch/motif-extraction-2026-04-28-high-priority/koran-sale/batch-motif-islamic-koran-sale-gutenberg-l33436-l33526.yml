  summary: The passage opens Chapter XLVI by presenting the book as a revelation from
    God, affirming that creation has a truthful and limited term, challenging idolaters
    to show evidence for their idols, and warning that idols will fail and oppose
    their worshippers at judgment. It describes unbelievers rejecting signs as sorcery
    or forgery, presents Mohammed as a public warner who follows revelation, invokes
    a witness from the children of Israel and the earlier book of Moses, promises
    paradise to upright believers, and commands kindness to parents with special mention
    of the mother's painful bearing and birth and a prayer of gratitude and righteousness
    at maturity.
