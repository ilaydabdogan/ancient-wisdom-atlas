canonical_text:
  quote: ''
  summary: The passage contrasts those whose breasts are opened to Islam and who follow
    divine light with those whose hearts are hardened. It describes the Koran as a
    consistent Arabic discourse of repeated admonitions that affects the skin and
    hearts of those who fear God. It warns of punishment on the day of resurrection,
    recalls punishments that came upon earlier people who accused apostles of imposture,
    presents parables for warning, contrasts divided service with single devotion,
    states that Mohammed and others will die and dispute before God at resurrection,
    and contrasts liars against God with truth-bringers who will receive expiation
    and reward.
