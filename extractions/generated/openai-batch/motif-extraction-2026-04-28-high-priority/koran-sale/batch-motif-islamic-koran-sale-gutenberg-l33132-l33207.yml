canonical_text:
  quote: ''
  summary: Chapter XLIV opens by invoking the perspicuous book and says the Koran
    was sent down on a blessed night when every determined decree is sent down. It
    affirms God as lord of heaven and earth, giver of life and death, then warns of
    a day when heaven produces visible smoke covering humankind as a tormenting plague.
    Those afflicted ask for the plague to be removed and promise belief, but the text
    recalls their rejection of a manifest apostle and says they will return to unbelief.
    It then announces divine vengeance and recalls an earlier trial of the people
    of Pharaoh when an honourable messenger came to them.
