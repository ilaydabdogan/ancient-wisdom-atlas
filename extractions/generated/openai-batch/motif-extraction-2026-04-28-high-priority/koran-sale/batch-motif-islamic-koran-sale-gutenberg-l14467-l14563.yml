canonical_text:
  quote: ''
  summary: 'The passage includes explanatory notes on questions put to Mohammed, pre-Islamic
    animal dedications, testimony and oaths, and then presents a judgment-day scene
    in which God assembles the apostles. God reminds Jesus son of Mary of divine favors:
    strengthening by the holy spirit, speech in the cradle and adulthood, instruction
    in scripture, wisdom, law, and gospel, making a bird from clay by divine permission,
    healing the blind and leper, bringing the dead from graves by divine permission,
    and being protected from the children of Israel. The apostles profess belief and
    ask Jesus whether his Lord can send down a table from heaven.'
  language: English
  quote_policy: summarized
