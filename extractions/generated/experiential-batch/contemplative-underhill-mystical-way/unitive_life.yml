  quote_or_summary: 'The dark night ends in a stable union. The mystic now lives in continuous, settled communion with the divine. The phenomenology has changed: the alternation between presence and absence that marked the earlier stages is replaced by a steady ground that is neither felt nor unfelt in the old way, but is simply the medium of the life.'
