passage_locator:
  label: "The Story of the Fisherman: sealed jar, murderous genius, and return to the vessel"
  start: 775
  end: 903
  translation: Andrew Lang, The Arabian Nights Entertainments
  notes: Covers the fisherman's failed casts, the opening of the sealed vessel, the genius's threat, and the trick that forces the spirit back into confinement.
canonical_text:
  summary: An impoverished fisherman hauls up a lead-sealed jar from the sea, releases a rebel genius who vows to kill his liberator, and survives by challenging the spirit to prove it ever fit inside the vessel, then sealing it back in.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: The fisherman is introduced as old and poor, supporting a wife and three children, and limiting himself to four casts a day.
    category: attribute
    evidence_refs:
      - ev:1
  - id: obs:2
    text: His first three casts produce only an ass carcass, a rubbish-filled basket, and then stones, shells, and mud.
    category: sequence
    evidence_refs:
      - ev:1
      - ev:2
  - id: obs:3
    text: On the fourth cast he draws up a yellow pot sealed with lead and marked by an impressed seal.
    category: object
    evidence_refs:
      - ev:2
      - ev:3
  - id: obs:4
    text: When the fisherman opens the vessel, smoke pours out, fills sea and shore, and gathers into a giant genius.
    category: transformation
    evidence_refs:
      - ev:3
  - id: obs:5
    text: The genius tells the fisherman that freeing him will not save him, because he has resolved to kill his deliverer.
    category: speech
    evidence_refs:
      - ev:4
      - ev:5
  - id: obs:6
    text: The genius explains that he rebelled against the king of the genii, was sealed in the vessel and cast into the sea, and after centuries of captivity changed promises of reward into a vow of murder.
    category: speech
    evidence_refs:
      - ev:5
  - id: obs:7
    text: The fisherman pretends disbelief that so large a being could ever have fit inside the jar.
    category: speech
    evidence_refs:
      - ev:6
  - id: obs:8
    text: To prove the claim, the genius becomes smoke again and re-enters the vessel.
    category: transformation
    evidence_refs:
      - ev:7
  - id: obs:9
    text: The fisherman reseals the jar, threatens to cast it back into the sea, and refuses the genius's later promise of repayment.
    category: action
    evidence_refs:
      - ev:8
      - ev:9
