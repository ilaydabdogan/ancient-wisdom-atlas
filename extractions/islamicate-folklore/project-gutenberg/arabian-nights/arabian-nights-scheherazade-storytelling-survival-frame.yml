canonical_text:
  summary: Scheherazade persuades her father to give her to Schahriar, arranges for Dinarzade to request a story before dawn, and wins repeated postponement of execution by leaving each tale unfinished at daybreak.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: Scheherazade is introduced as the elder daughter of the grand-vizir and is described as learned, beautiful, clever, and courageous.
    category: attribute
    evidence_refs:
      - ev:1
  - id: obs:2
    text: She says she is resolved to stop the Sultan's bride-killing practice and save the girls and mothers of the city.
    category: speech
    evidence_refs:
      - ev:2
  - id: obs:3
    text: Scheherazade asks her father to let her be the bride, while the grand-vizir protests that the command would force him to kill his own daughter.
    category: relationship
    evidence_refs:
      - ev:3
  - id: obs:4
    text: The Sultan accepts the plan but warns the grand-vizir that he must carry out Scheherazade's execution himself or lose his own head.
    category: speech
    evidence_refs:
      - ev:4
  - id: obs:5
    text: Scheherazade instructs Dinarzade to wake her before dawn and ask for one of her stories so the people may be delivered from terror.
    category: speech
    evidence_refs:
      - ev:5
  - id: obs:6
    text: On the wedding night Scheherazade obtains permission for Dinarzade to sleep in the chamber and waits for the planned request.
    category: action
    evidence_refs:
      - ev:6
  - id: obs:7
    text: Dinarzade asks for a story before sunrise, the Sultan permits it, and Scheherazade begins the tale.
    category: sequence
    evidence_refs:
      - ev:6
  - id: obs:8
    text: At daybreak Scheherazade stops speaking and implies that the rest of the tale will be more wonderful if she is allowed to live another day.
    category: sequence
    evidence_refs:
      - ev:7
  - id: obs:9
    text: Schahriar postpones her death to hear the end, and the same pattern recurs on the following mornings.
    category: sequence
    evidence_refs:
      - ev:8
      - ev:9
