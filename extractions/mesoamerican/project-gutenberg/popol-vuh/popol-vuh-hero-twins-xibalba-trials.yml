passage_locator:
  label: The Second Book, Hero Twins in Xibalba
  start: It was not long, however, until Hun-Came and Vukub-Came
  end: Thus concludes the second book.
  translation: Lewis Spence, The Popol Vuh
  notes: Public-domain Project Gutenberg text of Spence's 1908 English edition.
canonical_text:
  summary: Hun-Ahpu and Xbalanque are lured toward Xibalba, avoid traps that defeated
    their fathers, pass underworld houses and ballgame challenges, suffer a
    beheading episode, die together by design, return in transformed disguise, and
    defeat the princes of Xibalba by refusing to revive them.
  language: English
  quote_policy: summarized
