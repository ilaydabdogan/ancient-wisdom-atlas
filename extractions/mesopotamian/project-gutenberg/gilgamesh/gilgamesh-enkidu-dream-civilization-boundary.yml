  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gish reports a second dream in which he sees his likeness in the streets
    of Erech, rejoices over him, loves him, embraces him, and regards him as a
    brother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Enkidu sits before the woman, cohabits with her for six days and seven
    nights, and forgets the place where he was born.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman tells Enkidu to leave roaming with cattle across the field and
    come to Erech and Eanna, where Gish is.
  category: speech
  evidence_refs:
  - ev:3
