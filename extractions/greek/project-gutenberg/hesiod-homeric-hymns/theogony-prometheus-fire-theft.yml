- id: ev:2
  type: quote
  locator: Theogony (ll. 507-543)
  quote_or_summary: >
    "For when the gods and mortal men had a dispute at Mecone... Prometheus
    was forward to cut up a great ox and set portions before them, trying
    to befool the mind of Zeus."
  source_text_path: texts/public-domain/greek/project-gutenberg/hesiod-homeric-hymns-homerica.md
  rights_note: Public-domain English translation from Project Gutenberg.
- id: ev:3
  type: quote
  locator: Theogony (ll. 548-558)
  quote_or_summary: >
    "Zeus... saw and failed not to perceive the trick... and because of this
    the tribes of men upon earth burn white bones to the deathless gods upon
    fragrant altars."
  source_text_path: texts/public-domain/greek/project-gutenberg/hesiod-homeric-hymns-homerica.md
  rights_note: Public-domain English translation from Project Gutenberg.
- id: ev:4
  type: quote
  locator: Theogony (ll. 561-584)
  quote_or_summary: >
    "From that time he was always mindful of the trick, and would not give
    the power of unwearying fire... But the noble son of Iapetus outwitted
    him and stole the far-seen gleam of unwearying fire in a hollow fennel
    stalk."
  source_text_path: texts/public-domain/greek/project-gutenberg/hesiod-homeric-hymns-homerica.md
  rights_note: Public-domain English translation from Project Gutenberg.
- id: ev:5
  type: quote
  locator: Theogony (ll. 561-584)
  quote_or_summary: >
    "Forthwith he made an evil thing for men as the price of fire; for the
    very famous Limping God formed of earth the likeness of a shy maiden as
    the son of Cronos willed."
  source_text_path: texts/public-domain/greek/project-gutenberg/hesiod-homeric-hymns-homerica.md
  rights_note: Public-domain English translation from Project Gutenberg.
- id: ev:6
  type: quote
  locator: Theogony (ll. 613-616)
  quote_or_summary: >
    "So it is not possible to deceive or go beyond the will of Zeus; for not
    even the son of Iapetus, kindly Prometheus, escaped his heavy anger..."
