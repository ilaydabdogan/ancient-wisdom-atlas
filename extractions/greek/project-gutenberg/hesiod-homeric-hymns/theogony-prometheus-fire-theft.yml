canonical_text:
  summary: >
    Prometheus is named among the sons of Iapetus, is punished by Zeus,
    divides an ox at Mecone in a deceptive way, and later steals the gleam
    of fire for mortals in a hollow fennel stalk; Zeus responds by making
    a beautiful evil for men as the price of fire.
