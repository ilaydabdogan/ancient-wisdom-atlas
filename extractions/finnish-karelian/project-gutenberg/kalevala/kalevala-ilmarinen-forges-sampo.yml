canonical_text:
  summary: Louhi asks Ilmarinen to forge the Sampo from rare materials. Ilmarinen
    claims the authority of having forged the arch of heaven, builds a smithy,
    rejects dangerous preliminary creations, and finally forges the many-colored
    Sampo, which grinds flour, salt, and money.
