canonical_text:
  summary: Cuchulain follows a terrifying cry to Ath da Ferta, confronts a red woman driving a cow in an uncanny chariot, forces her to reveal herself as the Morrigan, hears that she guards his death and that the cow's breeding will lead to the Tain bo Cualnge, and receives her threats of future attack in eel, wolf, and heifer forms.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: Cuchulain wakes in fear at a dire cry from the north, arms himself, and follows its track with Laeg.
    category: action
    evidence_refs:
      - ev:1
  - id: obs:2
    text: At Ath da Ferta, Cuchulain and Laeg see an uncanny chariot with a one-footed horse, a red woman, a great man, and a cow driven before them.
    category: attribute
    evidence_refs:
      - ev:2
  - id: obs:3
    text: Cuchulain says that the cows of Ulster are his proper care, but the woman answers for the man and gives strange names instead of plain identities.
    category: speech
    evidence_refs:
      - ev:3
  - id: obs:4
    text: Cuchulain springs into the woman's chariot, presses his feet on her shoulders, and demands her true name at spear-point.
    category: action
    evidence_refs:
      - ev:3
  - id: obs:5
    text: The whole chariot company vanishes, and the woman appears again as a black bird on a branch.
    category: sequence
    evidence_refs:
      - ev:3
      - ev:4
  - id: obs:6
    text: The woman says she guards Cuchulain's death, brought the cow from the fairy-mound of Cruachan to breed by the Black Bull of Cualnge, and that this will lead to the Tain bo Cualnge.
    category: speech
    evidence_refs:
      - ev:4
  - id: obs:7
    text: The Morrigan threatens to attack Cuchulain in future combat as an eel, a grey wolf, and a white red-eared heifer followed by a herd.
    category: speech
    evidence_refs:
      - ev:5
  - id: obs:8
    text: Cuchulain answers each threatened shape with a vow of counter-injury, and the Morrigan returns to Cruachan while he goes back to Dun Imrid.
    category: sequence
    evidence_refs:
      - ev:5
      - ev:6
