canonical_text:
  summary: Medb and Ailill compare their standing and possessions at Cruachan; when their wealth proves equal except for Ailill's possession of Finnbennach, Medb seeks the Brown Bull of Cualnge from Dare, but the embassy fails after drunken boasting and she resolves to take the bull by force.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: Medb rejects Ailill's claim of superiority and recounts her royal birth, military following, and prior wealth and power.
    category: speech
    evidence_refs:
      - ev:1
  - id: obs:2
    text: Medb says she demanded a husband without avarice, jealousy, or fear and still claims superior fortune within the marriage.
    category: speech
    evidence_refs:
      - ev:1
      - ev:2
  - id: obs:3
    text: Ailill answers with his own royal standing and denies that Medb has greater riches than he does.
    category: speech
    evidence_refs:
      - ev:2
  - id: obs:4
    text: The couple's vessels, adornments, garments, sheep, horses, swine, and cattle are counted and mostly found equal.
    category: sequence
    evidence_refs:
      - ev:3
  - id: obs:5
    text: Finnbennach, once a calf of Medb's cow, now belongs with Ailill's cattle, and Medb has no bull equal to him.
    category: object
    evidence_refs:
      - ev:3
  - id: obs:6
    text: Medb sends macRoth to request the Brown Bull of Cualnge from Dare on rich loan terms and with further rewards.
    category: action
    evidence_refs:
      - ev:4
  - id: obs:7
    text: Dare first agrees to the arrangement, but drunken messengers say the bull would be taken by force if not given willingly.
    category: sequence
    evidence_refs:
      - ev:5
      - ev:6
  - id: obs:8
    text: After the steward reports the boast, Dare refuses the loan, and Medb answers that the Brown Bull will be taken despite refusal.
    category: sequence
    evidence_refs:
      - ev:7
      - ev:8
