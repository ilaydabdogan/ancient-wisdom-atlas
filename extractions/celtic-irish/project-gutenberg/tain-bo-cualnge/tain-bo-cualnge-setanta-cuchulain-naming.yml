canonical_text:
  summary: Culann invites Conchobar to a feast, but after Conchobar forgets the boy Setanta and Culann releases his guard hound, Setanta kills the beast on arrival, promises to replace it and guard Culann's holdings himself, and receives the name Cuchulain.
  language: English
  quote_policy: summarized
