candidate_motifs:
  - id: motif:1
    label: heroic_childhood_signs
    taxonomy_refs: []
    basis: Setanta's prowess over thrice fifty boys and his killing of the guard hound present him as extraordinarily marked in childhood.
    evidence_refs:
      - ev:2
      - ev:5
    confidence: medium
    cautions: The passage stresses heroic precocity rather than miraculous birth or divine parentage.
  - id: motif:2
    label: threshold_ordeal_with_new_name
    taxonomy_refs:
      - initiation
    basis: Setanta crosses the boundary to Culann's fort, survives the hound attack, and emerges with a new public identity.
    evidence_refs:
      - ev:3
      - ev:4
      - ev:5
      - ev:8
    confidence: high
    cautions: The episode functions like an initiation but is not framed as a formal rite in this text.
  - id: motif:3
    label: reparation_vow_of_service
    taxonomy_refs:
      - covenant
    basis: Setanta answers the host's loss by binding himself to replace the hound's service until a new one can be raised.
    evidence_refs:
      - ev:6
      - ev:7
      - ev:8
    confidence: medium
    cautions: The vow repairs a social injury; the passage does not make the promise explicitly sacred or ritually ratified.
comparison_claims:
  - id: claim:1
    claim: This passage is a strong Irish witness for a hero-naming pattern in which an ordeal at a household boundary creates a new public identity.
    claim_level: same_function
    target: cross-cultural hero naming through ordeal records
    evidence_refs:
      - ev:3
      - ev:4
      - ev:5
      - ev:8
    confidence: medium
    limitations: The comparison concerns narrative function and public identity, not shared historical origin.
  - id: claim:2
    claim: Setanta's promise to replace the slain hound can be compared cautiously with stories of compensatory vows in which damage to a host is answered by self-binding service.
    claim_level: same_function
    target: covenant and compensatory-vow comparisons
    evidence_refs:
      - ev:6
      - ev:7
    confidence: medium
    limitations: The promised service is concrete and local to Culann's household, so broader analogy should remain narrow.
