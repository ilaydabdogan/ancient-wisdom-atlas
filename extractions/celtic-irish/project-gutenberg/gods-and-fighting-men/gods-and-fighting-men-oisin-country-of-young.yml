literal_observations:
  - id: obs:1
    text: Oisin is said to have returned to Ireland long after Niamh brought him away, although the time seemed short to him.
    category: sequence
    evidence_refs:
      - ev:1
  - id: obs:2
    text: Oisin and Niamh turn westward over the sea, which opens before them and closes behind them in waves.
    category: action
    evidence_refs:
      - ev:2
  - id: obs:3
    text: During the journey they see cities, courts, white houses, palaces, a deer, a white red-eared hound, and mounted figures travelling over the waves.
    category: setting
    evidence_refs:
      - ev:3
  - id: obs:4
    text: Oisin names the destination the Country of the Young and the Country of Victory.
    category: speech
    evidence_refs:
      - ev:4
  - id: obs:5
    text: The country is described as blossoming, full of smooth plains, a grand dun, sunny houses, shining stone palaces, armed men, young women, and royal figures.
    category: setting
    evidence_refs:
      - ev:5
  - id: obs:6
    text: The king tells Oisin that his life there will be long lasting and that Oisin will be young forever.
    category: speech
    evidence_refs:
      - ev:6
  - id: obs:7
    text: Niamh warns Oisin that if he gets off the white horse in Ireland he will never return and will become old, blind, and withered.
    category: speech
    evidence_refs:
      - ev:7
  - id: obs:8
    text: After Oisin dismounts beside a remembered stone trough, the years come on him and the white horse leaves.
    category: sequence
    evidence_refs:
      - ev:8
