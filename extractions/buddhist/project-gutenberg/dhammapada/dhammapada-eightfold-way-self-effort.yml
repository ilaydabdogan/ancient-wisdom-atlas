  translation: F. Max Muller, Project Gutenberg eBook #2017
canonical_text:
  quote: >
    The best of ways is the eightfold; the best of truths the four words;
    the best of virtues passionlessness; the best of men he who has eyes to
    see. This is the way, there is no other that leads to the purifying of
    intelligence. Go on this way! Everything else is the deceit of Mara (the
    tempter). If you go on this way, you will make an end of pain! The way was
    preached by me, when I had understood the removal of the thorns (in the
    flesh). You yourself must make an effort. The Tathagatas (Buddhas) are only
    preachers. The thoughtful who enter the way are freed from the bondage of
    Mara.
