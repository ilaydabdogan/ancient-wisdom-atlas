canonical_text:
  summary: Yudhishthira despairs of Bhishma's unstoppable slaughter, the Pandavas
    ask Bhishma how he may be overcome, Krishna presses Arjuna to place Sikhandin
    in front, Bhishma lowers his weapons rather than fight one born female, and
    he falls onto a bed of Arjuna's arrows while both sides grieve.
  language: English
  quote_policy: summarized
