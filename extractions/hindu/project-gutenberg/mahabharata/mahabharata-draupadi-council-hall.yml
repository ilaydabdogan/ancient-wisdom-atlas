candidate_motifs:
  - id: motif:1
    label: dharma challenged in royal assembly
    taxonomy_refs:
      - royal_legitimacy
      - wisdom
    basis: The crisis centers on whether the dice result can legitimately transfer
      a queen after the king has already lost his own freedom.
    evidence_refs:
      - ev:1
      - ev:2
      - ev:5
    confidence: high
    cautions: The appeal is to dharma and courtly justice rather than to a visible
      divine verdict within the passage.
  - id: motif:2
    label: violated queen as trigger of vengeance
    taxonomy_refs: []
    basis: Draupadi's public humiliation becomes the emotional and ethical spur toward
      later revenge.
    evidence_refs:
      - ev:4
      - ev:5
      - ev:6
    confidence: high
    cautions: The passage shows the vow impulse rather than the later fulfillment.
  - id: motif:3
    label: corrupt sacred exchange
    taxonomy_refs:
      - sacred_exchange
    basis: The dice game acts like a binding transfer of persons and status, but
      Draupadi rejects it as invalid once the gambler has lost himself.
    evidence_refs:
      - ev:1
      - ev:2
    confidence: medium
    cautions: The exchange is juridical and corrupt, not a repairing or covenantal
      sacred exchange.
comparison_claims:
  - id: claim:1
    claim: This passage is a strong atlas witness for public appeals to sacred or royal order when a woman's status is violated before passive authorities.
    claim_level: same_function
    target: cross-cultural justice-in-assembly and violated-queen comparison records
    evidence_refs:
      - ev:2
      - ev:4
      - ev:5
    confidence: medium
    limitations: The comparison is functional and does not imply direct borrowing
      from other legal or mythic traditions.
  - id: claim:2
    claim: Draupadi's hair seizure gives the scene a marked body-symbol motif that
      can be compared with other traditions where dishonor to a consecrated or royal
      person triggers curse, judgment, or vengeance.
    claim_level: same_motif
    target: cross-cultural dishonor-and-vengeance symbol records
    evidence_refs:
      - ev:4
      - ev:6
    confidence: medium
    limitations: The evidence here is social and ethical; supernatural retaliation
      is not narrated in this excerpt.
