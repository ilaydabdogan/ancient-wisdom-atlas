canonical_text:
  summary: After Yudhishthira loses wealth, kin, and Draupadi in the dice game,
    Draupadi challenges whether a man who has already lost himself can still stake
    his wife, is dragged by the hair into the council hall, calls the elders to
    defend justice, and ignites the Pandavas' vow of revenge.
  language: English
  quote_policy: summarized
