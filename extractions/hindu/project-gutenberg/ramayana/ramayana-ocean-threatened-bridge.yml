canonical_text:
  summary: Rama prays and waits by the sea on sacred grass, vows to destroy Ocean
    after receiving no answer, terrifies the deep with fiery arrows and a Brahma
    weapon, receives Ocean's law-bound appearance and counsel, redirects the weapon
    northward, and then has Nala lead the vanaras in building the bridge to Lanka.
  language: English
  quote_policy: summarized
literal_observations:
  - id: obs:1
    text: Rama reverently faces the southern ocean, lies on sacred grass, and vows
      that his host will cross or Ocean will perish.
    category: vigil
    evidence_refs:
      - ev:1
  - id: obs:2
    text: After three unanswered days Rama declares that gentleness fails with the
      base and resolves to dry the sea with arrows.
    category: wrath_speech
    evidence_refs:
      - ev:1
      - ev:2
  - id: obs:3
    text: Rama's fiery shafts strike the waters, frightening waves, sea monsters,
      serpents, and beings in the depths.
    category: assault
    evidence_refs:
      - ev:3
  - id: obs:4
    text: Lakshmana restrains Rama's arm with gentle reasoning, and voices from the
      air call on Rama to spare the sea.
    category: restraint
    evidence_refs:
      - ev:3
  - id: obs:5
    text: When Rama prepares the Brahma weapon, darkness, meteors, lightning, wind,
      and shaking mountains make the whole cosmos register the threat.
    category: cosmic_portent
    evidence_refs:
      - ev:4
  - id: obs:6
    text: Ocean rises in person with jewel-bright form and river retinue, says he
      cannot cease to be unfordable, yet promises support for a road across the
      waters.
    category: epiphany
    evidence_refs:
      - ev:5
  - id: obs:7
    text: At Ocean's request Rama redirects the unfailing shaft northward, where
      it wounds the land, creates the well of Vrana, dries waters, and is followed
      by a fertility boon.
    category: redirected_weapon
    evidence_refs:
      - ev:6
  - id: obs:8
    text: Ocean names Nala as the divinely skilled builder, and the vanaras fell
      trees and stones to complete a massive bridge in five days and cross toward
      Lanka.
    category: bridge_building
    evidence_refs:
      - ev:7
      - ev:8
