candidate_motifs:
  - id: motif:1
    label: natural power compelled into negotiation
    taxonomy_refs:
      - divine_judgment
    basis: Rama's threatened violence against the sea culminates in the appearance
      of Ocean, who only then offers terms for passage.
    evidence_refs:
      - ev:2
      - ev:4
      - ev:5
    confidence: high
    cautions: The text frames Ocean as a personified deity subject to force and
      law, not as an inanimate obstacle.
  - id: motif:2
    label: element bound by cosmic law yet practically helpful
    taxonomy_refs:
      - wisdom
    basis: Ocean insists he cannot violate his nature, but he can still disclose
      the workable way across through support and counsel.
    evidence_refs:
      - ev:5
      - ev:7
    confidence: medium
    cautions: The wisdom tag is analogical and refers to counsel about lawful order,
      not to an extended teaching discourse.
  - id: motif:3
    label: divinely inherited bridgecraft
    taxonomy_refs: []
    basis: Nala's authority to build the crossing is grounded in descent from Visvakarma
      and in demonstrated large-scale construction by the vanara host.
    evidence_refs:
      - ev:7
      - ev:8
    confidence: high
    cautions: The excerpt presents inherited craft and collective labor, not a miraculous
      instant bridge.
  - id: motif:4
    label: redirected world-wounding weapon becomes landscape marker
    taxonomy_refs:
      - divine_judgment
    basis: The unfailing arrow is diverted from the sea to the north, where it wounds
      the earth, creates a named well, and transforms the region.
    evidence_refs:
      - ev:6
    confidence: medium
    cautions: The passage combines punitive force with later blessing, so it is
      not a purely destructive landscape etiology.
comparison_claims:
  - id: claim:1
    claim: This passage is a strong comparison point for traditions in which a hero
      threatens a river, sea, or other natural power until that power appears in
      person and grants terms for passage.
    claim_level: same_function
    target: cross-cultural personified-water obstacle and negotiated crossing records
    evidence_refs:
      - ev:2
      - ev:4
      - ev:5
    confidence: medium
    limitations: The comparison concerns narrative function; it does not imply equivalent
      theology of nature spirits or identical ritual setting.
  - id: claim:2
    claim: Nala's bridge supports comparison with stories where divinely authorized
      craft or engineering makes an impossible water crossing available to an army
      or migrating host.
    claim_level: same_motif
    target: cross-cultural sacred bridge and impossible-passage engineering records
    evidence_refs:
      - ev:7
      - ev:8
    confidence: medium
    limitations: Here the bridge is built through massive labor under a gifted builder,
      not by spontaneous creation alone.
  - id: claim:3
    claim: The redirected Brahma weapon can be compared with traditions where an
      unleashed divine or kingly force must be discharged elsewhere, producing a
      named scarred landscape.
    claim_level: same_motif
    target: cross-cultural redirected wrath and etiological wound-landscape records
    evidence_refs:
      - ev:4
      - ev:6
    confidence: low
    limitations: The etiological dimension is present, but the passage does not
      dwell on cult, shrine, or long-term ritual memory at the site.
