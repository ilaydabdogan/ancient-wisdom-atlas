canonical_text:
  summary: Bhagiratha continues severe penance until Śiva agrees to bear Gangá's
    fall. The proud river crashes onto Śiva's head and is trapped in his tangled
    hair until released in divided streams. Following Bhagiratha, she sanctifies
    beings, is swallowed and reissued by Jahnu, descends to the underworld, and
    frees the sons of Sagar when Bhagiratha pours the funeral libation over their
    dust.
  language: English
  quote_policy: summarized
literal_observations:
