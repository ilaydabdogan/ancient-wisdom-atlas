candidate_motifs:
  - id: motif:1
    label: surrogate kingship through royal object
    taxonomy_refs:
      - royal_legitimacy
    basis: The sandals, once placed beneath Ráma's feet, are treated as the delegated
      protectors of realm and people during his absence.
    evidence_refs:
      - ev:4
      - ev:5
      - ev:6
      - ev:7
    confidence: high
    cautions: The passage clearly gives the sandals a regnal function, but it does
      not articulate a formal coronation rite here.
  - id: motif:2
    label: regency by self-abnegation
    taxonomy_refs:
      - sacrifice
    basis: Bharat refuses ordinary royal enjoyment, adopts hermit signs, and binds
      his own life to Ráma's timely return.
    evidence_refs:
      - ev:5
      - ev:6
    confidence: medium
    cautions: The sacrifice is ethical and ascetic; the scene does not depict an
      offering ritual.
  - id: motif:3
    label: city mourns absent ruler
    taxonomy_refs: []
    basis: Ayodhyá is described as dark, silent, and stripped of festival life while
      Ráma remains away.
    evidence_refs:
      - ev:8
      - ev:9
    confidence: medium
    cautions: The city is personified through simile and lament; this should not
      be read as an independent acting figure beyond poetic description.
comparison_claims:
  - id: claim:1
    claim: This passage is a strong atlas candidate for narratives in which a ruler's
      authority is represented and preserved through a personal object while a loyal
      subordinate governs provisionally.
    claim_level: same_function
    target: delegated-rule and absent-sovereign comparison records
    evidence_refs:
      - ev:4
      - ev:5
      - ev:6
      - ev:7
    counter_evidence_refs: []
    confidence: medium
    limitations: The claim concerns narrative function only and does not assert direct
      relation to other regency traditions.
  - id: claim:2
    claim: Bharat's vow and the city's grief also make this a cautious comparison
      point for scenes where collective well-being is suspended until the rightful
      ruler returns.
    claim_level: same_motif
    target: exile-return and grieving-capital comparison records
    evidence_refs:
      - ev:5
      - ev:8
      - ev:9
    counter_evidence_refs: []
    confidence: low
    limitations: This remains a broad motif comparison; the present passage does
      not include the final restoration itself.
