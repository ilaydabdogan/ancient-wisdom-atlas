    text: Bharat asks Ráma to take up kingship because he does not believe he can
      protect or hold the realm as Ráma can.
    category: petition
    evidence_refs:
      - ev:2
  - id: obs:3
    text: Ráma embraces Bharat but insists that he will keep his father's word even
      if cosmic order changes.
    category: vow_speech
    evidence_refs:
      - ev:3
  - id: obs:4
    text: Bharat asks Ráma to place his feet in a gold-decked pair of sandals so
      that the realm may be protected by them.
    category: ritual_request
    evidence_refs:
      - ev:4
  - id: obs:5
    text: Bharat vows to wear hermit's dress, live on roots and fruit outside the
      kingdom, delegate rule to the sandals, and die in fire if Ráma does not return
      at the end of fourteen years.
    category: self_binding_oath
    evidence_refs:
      - ev:5
